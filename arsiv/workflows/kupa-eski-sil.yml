name: kupa-eski-sil
# Eski 7 stil CANCER_LIBRA kupa taslagi 4597843405'i SIL (Serdar onayi 19 Eki 2026). Yalniz bu tek ilan; yayin/Ads yok.
# Kod: scripts/etsy/kupa_eski_sil.py (once oku: draft + baslik kapisi; tek deleteListing; sonra 404 + 4598525642 draft dogrulamasi).
# Rapor: Drive TEMP/KUPA_ORCHARD_TASLAK_20261019/KUPA_ESKI_SIL.json. Etsy kilidi: kilit_bekle.py. Kota tabani 10.
permissions:
  actions: read
  contents: read
on:
  workflow_dispatch:
    inputs:
      onay: { description: "Silinecek ilan numarasini yaz (4597843405); farkliysa kosu durur", required: true, default: "" }
env:
  O: "gdrive:ASTROLOVE/TEMP/KUPA_ORCHARD_TASLAK_20261019"
jobs:
  sil:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - name: Onay kapisi
        run: '[ "${{ inputs.onay }}" = "4597843405" ] || { echo "::error::onay girdisi 4597843405 degil"; exit 1; }'
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Kurulum
        run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || sudo apt-get install -y -qq rclone >/dev/null
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"; echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Etsy token
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
      - name: Eski taslagi sil (oku -> sil -> dogrula)
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          OUT: _out
        run: python3 scripts/etsy/kupa_eski_sil.py
      - name: Drive'a rapor
        if: ${{ always() }}
        run: '[ -d _out ] && rclone copy _out "$O" -q && echo "::warning::rapor Drive TEMP/KUPA_ORCHARD_TASLAK_20261019/KUPA_ESKI_SIL.json" || true'
      - name: Token geri yaz
        if: ${{ always() }}
        run: |
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "token geri yazildi" || true
          rm -rf _work ~/.config/rclone

name: wp-dikis-tara

# Dikis taramasi (Serdar 1 Eki): e4f65cd WP ciktilari + VINTAGE plate; 24x36 aday kesitleri TEMP/WP_ORNEK/DIKIS_24x36.
# Plate/kaynak salt okunur; yalniz TEMP/WP_ORNEK/DIKIS_24x36 yazilir. Etsy/Prodigi secret YOK. Tetik: config/wp_dikis_tara.trigger (bu dal).

permissions:
  contents: read

on:
  push:
    branches: [claude/wp-katman-baski-60sk0s]
    paths:
      - config/wp_dikis_tara.trigger

concurrency: wp-dikis-tara

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python bagimliliklari
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pillow opencv-python-headless numpy fonttools img2pdf pikepdf
      - name: rclone kur
        run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONF_B64:-}" ]; then echo "HATA: RCLONE_CONF_B64 yok" >&2; exit 1; fi
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Kapi testleri
        run: python scripts/medya_v1/test_wp_dikis_kapisi.py && python scripts/medya_v1/test_wp_kilit.py && python scripts/medya_v1/test_wp_siparis.py && python scripts/medya_v1/test_wp_plate_serit.py
      - name: WP 24x36 CANCER_LIBRA baski (plate seridi, Serdar 1 Eki ~15:50)
        run: python scripts/medya_v1/wp_ornek.py --cift CANCER_LIBRA --boylar 24x36
      - name: Dikis taramasi (e4f65cd 6 hucre + CL 24x36 cikti + 24x36 plate)
        run: |
          python scripts/medya_v1/wp_dikis_tara.py --plateler 24x36
          python scripts/medya_v1/wp_dikis_tara.py --ciftler CANCER_LIBRA --boylar 24x36 --plateler ''
      - if: always()
        run: rm -rf ~/.config/rclone

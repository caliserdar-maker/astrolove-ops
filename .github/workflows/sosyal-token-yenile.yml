name: sosyal-token-yenile

# Haftalik token yenileme (plan 4.9): Instagram / Threads yenilenip Drive'a geri yazilir; Facebook / YouTube salt okuma
# dogrulama. Zamanli kosu yalniz SOSYAL_YAYIN_ACIK=true ise. Hata ya da bitise 10 gunden az: Drive uyari dosyasi.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      platformlar:
        description: "bosluklu liste, or. instagram threads (bos = acik platformlar)"
        required: false
        default: ""
  schedule:
    - cron: "23 4 * * 1"

concurrency:
  group: sosyal-token-yenile
  cancel-in-progress: false

jobs:
  yenile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name != 'schedule' || vars.SOSYAL_YAYIN_ACIK == 'true' }}
    env:
      SOSYAL_YAYIN_ACIK: ${{ vars.SOSYAL_YAYIN_ACIK }}
      YAYIN_IG: ${{ vars.YAYIN_IG }}
      YAYIN_FB: ${{ vars.YAYIN_FB }}
      YAYIN_THREADS: ${{ vars.YAYIN_THREADS }}
      YAYIN_YT: ${{ vars.YAYIN_YT }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bagimliliklar
        run: pip install -q requests==2.34.2
      - name: rclone kur
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          rclone version | head -1

      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          [ -n "${RCLONE_CONF_B64:-}" ] || { echo "HATA: RCLONE_CONF_B64 yok" >&2; exit 1; }
          mkdir -p ~/.config/rclone
          umask 077
          printf "%s" "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE "^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S" ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
          fi

      - name: Calistir
        env:
          PL: ${{ inputs.platformlar }}
        run: |
          set -euo pipefail
          for p in ${PL:-}; do case "$p" in instagram|facebook|threads|youtube) ;; *) echo "::error::platform: $p"; exit 1;; esac; done
          python3 scripts/sosyal/yayin/token_yenile.py ${PL:-} 2>&1 | python3 scripts/guvenlik/sir_koru.py tee "$GITHUB_STEP_SUMMARY"

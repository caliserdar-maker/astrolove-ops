name: tt-yt-video-uygula

# Bekleyen TikTok + YouTube video gonderilerinde video degisimi (Serdar onayi 20 Eki 2026). METRICOOL'A YAZAR (PUT).
# scripts/sosyal/tt_yt_video_uygula.py -> metricool_video_degistir.py --mod yaz: cift basina tek video + tek kapak yuklemesi,
# yalniz media[0] (YouTube'da ek videoThumbnailUrl = P ilk karesi), uuid ile geri okuma, ilk FAIL -> DUR.
# Kaynak: Drive TEMP/SOSYAL_VIDEO_P_78_20261020/*.mp4; esleme TEMP/SOSYAL_DEGISIM_20261020/TIKTOK_YOUTUBE/ESLEME.csv.
# mod tek: yalniz ilk uygun cift; mod hepsi: kalanlar (onceki SONUC.csv'de PASS olan ciftler atlanir).
# Cikti Drive TEMP/SOSYAL_DEGISIM_20261020/UYGULAMA_TT_YT/ (SONUC.csv, OZET.txt, <CIFT>/...); 5 dk'da bir ara yukleme.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      mod:
        type: choice
        options: [tek, hepsi]
        default: tek

jobs:
  uygula:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      O: gdrive:ASTROLOVE/TEMP/SOSYAL_DEGISIM_20261020/UYGULAMA_TT_YT
      T: gdrive:ASTROLOVE/TEMP
    steps:
      - uses: actions/checkout@v4
      - name: Paketler
        run: |
          python3 -c "import numpy, PIL" 2>/dev/null || pip install -q numpy==2.1.3 pillow==11.0.0
          command -v ffprobe >/dev/null || { sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq ffmpeg >/dev/null; }
          ffprobe -version | head -1
      - name: rclone + token + girdiler
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MC_TOK: ${{ secrets.METRICOOL_USER_TOKEN }}
        run: |
          set -euo pipefail
          for d in 1 2 3; do curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1; command -v rclone >/dev/null && break; sleep $((d * 10)); done
          mkdir -p ~/.config/rclone _work/video _out; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            export RCLONE_CONFIG_GDRIVE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET"
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
          [ -n "${MC_TOK:-}" ] || { echo "::error::METRICOOL_USER_TOKEN bos"; exit 1; }
          echo "::add-mask::$MC_TOK"
          rclone copyto "$T/METRICOOL_TOKEN.json" _work/kimlik.json
          python3 -c "import json;print('::add-mask::'+json.load(open('_work/kimlik.json'))['userToken'])"
          python3 -c "import json,os;d=json.load(open('_work/kimlik.json'));json.dump({'userToken':os.environ['MC_TOK'],'userId':d['userId'],'blogId':d['blogId']},open('_work/mc.json','w'))"
          rclone copyto "$T/SOSYAL_DEGISIM_20261020/TIKTOK_YOUTUBE/ESLEME.csv" _work/ESLEME.csv
          rclone copyto "$O/SONUC.csv" _work/ONCEKI_SONUC.csv 2>/dev/null || echo "onceki SONUC yok"
          rclone copyto "$O/OZET.txt" _out/OZET.txt 2>/dev/null || true
          rclone copy "$T/SOSYAL_VIDEO_P_78_20261020" _work/video --include "*.mp4" --transfers 8 -q
          echo "P video: $(ls _work/video/*.mp4 | wc -l); ESLEME satir: $(($(wc -l < _work/ESLEME.csv) - 1))"

      - name: Uygula (${{ inputs.mod }})
        run: |
          set +e -uo pipefail
          yukle() {
            python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/mc.json --sir-json _work/kimlik.json _out >/dev/null 2>&1 \
              && rclone copy _out "$O" -q --exclude "_*" || echo "ara yukleme yapilmadi (tarama/rclone)"
          }
          ( while sleep 300; do yukle; done ) & ARA=$!
          python3 scripts/sosyal/tt_yt_video_uygula.py _work/mc.json _out _work/video _work/ESLEME.csv --mod "${{ inputs.mod }}" --onceki _work/ONCEKI_SONUC.csv 2>&1 \
            | python3 scripts/guvenlik/sir_koru.py tee --sir-json _work/mc.json --sir-json _work/kimlik.json "$GITHUB_STEP_SUMMARY"
          rc=${PIPESTATUS[0]}
          kill $ARA 2>/dev/null
          find _out -name '_*' -delete
          mkdir -p _work/engel
          find _out -type f | while read -r f; do
            python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/mc.json --sir-json _work/kimlik.json "$f" >/dev/null 2>&1 \
              || { echo "TARAMA GECMEDI (Drive'a gitmez): $f"; mv "$f" _work/engel/; }
          done
          rclone copy _out "$O" -q
          rclone lsl "$O" --max-depth 1 | python3 scripts/guvenlik/sir_koru.py tee --sir-json _work/mc.json "$GITHUB_STEP_SUMMARY"
          exit $rc
      - if: always()
        run: |
          rm -rf _work ~/.config/rclone
          if [ -f "$RUNNER_TEMP/SIR_ENGEL" ]; then echo "::error::sir iceren satir engellendi (sir_koru)"; exit 1; fi

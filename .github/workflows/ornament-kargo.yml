name: ornament-kargo
# ORNAMENT KARGO + FIYAT (Serdar 7 Kas "Evet", KARARLAR_20261107 Karar 3). YAYIN YOK, PATCH YOK, DELETE YOK, Etsy Ads YOK.
# Kod: scripts/etsy/ornament_kargo.py. Printful kargo verisi: docs/ornament/kargo/KARGO_TUM_20261107.json.
# mod=oku   : SALT OKUMA (78 taslak: state, fiyat, profil, "free shipping"; magaza profilleri) = yedek.
# mod=profil: magaza kaydi "Ornament Shipping" (LV, ulke ulke: US 9.90/0.90, 126 ulke 13.90/2.90). Ilan yazmaz.
# mod=fiyat : envanter PUT fiyat 19.90 (yalniz taslak; state ve geri okuma kapisi). Pilot tek cift, sonra TUMU.
# mod=kuru  : AG/TOKEN YOK; fiyat yolu taklit.
# DURUM.json: Drive TEMP/ORNAMENT_TASLAK/DURUM.json (yalniz okunur, geri yazilmaz). Cikti: Drive TEMP/ORNAMENT_KARGO/<mod>_<damga>/.
permissions:
  actions: read
  contents: read
on:
  workflow_dispatch:
    inputs:
      mod: { description: "oku | profil | fiyat | kuru", required: true, default: "oku" }
      ciftler: { description: "TUMU ya da virgul/bosluk ayrimli CIFT (yalniz fiyat)", required: true, default: "CANCER_LIBRA" }
env:
  O: "gdrive:ASTROLOVE/TEMP/ORNAMENT_KARGO"
jobs:
  kargo:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Girdi kapisi
        env: { M: "${{ inputs.mod }}", C: "${{ inputs.ciftler }}" }
        run: |
          [[ "$M" =~ ^(oku|profil|fiyat|kuru)$ ]] || { echo "::error::mod"; exit 1; }
          [[ "$C" =~ ^[A-Z_,\ ]+$ ]] || { echo "::error::ciftler"; exit 1; }
      - uses: actions/checkout@v4
      - name: Etsy kilidi (sira bekle, iptal yok; token indirmeden ONCE)
        if: ${{ inputs.mod != 'kuru' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Kurulum
        run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || sudo apt-get install -y -qq rclone >/dev/null
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"; echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Testler (cikis kodu ayri)
        run: python3 scripts/etsy/test_ornament_kargo.py
      - name: Token + DURUM
        env: { M: "${{ inputs.mod }}" }
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out
          echo "DAMGA=$(date -u +%Y%m%d_%H%M%S)" >> "$GITHUB_ENV"
          if [ "$M" != "kuru" ]; then rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json; fi
          if [ "$M" = "oku" ] || [ "$M" = "fiyat" ]; then
            V=$(rclone lsf "gdrive:ASTROLOVE/TEMP/ORNAMENT_TASLAK" --files-only --include DURUM.json) || { echo "::error::Drive okunamadi"; exit 1; }
            [ "$V" = "DURUM.json" ] || { echo "::error::DURUM.json bulunamadi ya da birden fazla: '$V'"; exit 1; }
            rclone copyto "gdrive:ASTROLOVE/TEMP/ORNAMENT_TASLAK/DURUM.json" _out/DURUM.json
            python3 -c 'import json; json.load(open("_out/DURUM.json"))' || { echo "::error::DURUM.json bozuk"; exit 1; }
          fi
      - name: Kos
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          OUT: _out
          C: ${{ inputs.ciftler }}
          M: ${{ inputs.mod }}
        run: python3 scripts/etsy/ornament_kargo.py --mod "$M" --ciftler "$C"
      - name: Token geri yaz + cikti Drive'a
        if: ${{ always() }}
        env: { M: "${{ inputs.mod }}" }
        run: |
          set +e
          TOKEN_RC=0; OUT_RC=0
          if [ -f _work/ETSY_TOKEN.json ]; then bash scripts/etsy/token_geri_yaz.sh || TOKEN_RC=1; fi
          rm -f _out/DURUM.json
          if ls _out/* >/dev/null 2>&1; then
            SIR_OK=1
            if [ -f _work/ETSY_TOKEN.json ]; then python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/ETSY_TOKEN.json _out || { echo "::error::ciktida sir"; SIR_OK=0; OUT_RC=1; }; fi
            if [ "$SIR_OK" = 1 ]; then rclone copy _out "$O/${M}_${DAMGA:?}" -q || OUT_RC=1
              echo "Cikti: TEMP/ORNAMENT_KARGO/${M}_$DAMGA" | tee -a "$GITHUB_STEP_SUMMARY"; fi
          fi
          [ "$TOKEN_RC" = 0 ] && [ "$OUT_RC" = 0 ] || exit 1
      - if: always()
        run: rm -rf _work _out ~/.config/rclone

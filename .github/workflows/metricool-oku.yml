name: metricool-oku

# SALT OKUMA: Metricool bagli hesaplar + Instagram ozellikleri (yalniz GET) + Metricool API sinirlamalari
# yardim sayfasi + GitHub Pages sinirlari belgesi. Metricool'a YAZMA YOK.
# Tum cikti yalniz Drive TEMP/SOSYAL/METRICOOL_OKU/ (ozet + ham yanitlar + belgeler). Depoya/dala push YOK
# (denetim 21 Eki B22, PLAN P0.2: public dal kanali kapatildi).

permissions:
  contents: read

on:
  workflow_dispatch: {}

jobs:
  oku:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: rclone + token
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            export RCLONE_CONFIG_GDRIVE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET"
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
          mkdir -p /tmp/w && rclone copyto "gdrive:ASTROLOVE/TEMP/METRICOOL_TOKEN.json" /tmp/w/mc.json
          python3 -c "import json;print('::add-mask::'+json.load(open('/tmp/w/mc.json'))['userToken'])"
      - name: Oku
        run: |
          set -euo pipefail
          mkdir -p /tmp/o
          python3 scripts/sosyal/metricool_hesaplar.py /tmp/w/mc.json /tmp/o | python3 scripts/guvenlik/sir_koru.py tee --sir-json /tmp/w/mc.json "$GITHUB_STEP_SUMMARY"
          curl -fsSL -o "/tmp/o/METRICOOL_API_SINIRLAMALAR.html" "https://help.metricool.com/api-limitations-per-social-network-n7zlr" || echo "sinirlamalar sayfasi alinamadi"
          curl -fsSL -o "/tmp/o/GITHUB_PAGES_LIMITS.html" "https://docs.github.com/en/pages/getting-started-with-github-pages/github-pages-limits" || echo "pages limits alinamadi"
          curl -fsSL -o "/tmp/o/GITHUB_LARGE_FILES.html" "https://docs.github.com/en/repositories/working-with-files/managing-large-files/about-large-files-on-github" || echo "large files alinamadi"
          python3 scripts/guvenlik/sir_koru.py tara --sir-json /tmp/w/mc.json /tmp/o || { echo "::error::ciktida sir"; exit 1; }
          rclone copy /tmp/o "gdrive:ASTROLOVE/TEMP/SOSYAL/METRICOOL_OKU/${GITHUB_RUN_ID}"
          ls -la /tmp/o | python3 scripts/guvenlik/sir_koru.py tee --sir-json /tmp/w/mc.json "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: |
          rm -rf /tmp/w ~/.config/rclone
          if [ -f "$RUNNER_TEMP/SIR_ENGEL" ]; then echo "::error::sir iceren satir engellendi (sir_koru)"; exit 1; fi

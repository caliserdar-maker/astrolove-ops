name: kisisel-uyum

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: etsy-token
  cancel-in-progress: false

jobs:
  denetle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -q -r requirements.txt
      - run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: Salt okunur OAuth girdisi
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail; umask 077
          mkdir -p ~/.config/rclone _work
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          [ -z "${GOOGLE_CLIENT_SECRET:-}" ] || echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
      - name: Aktif ilanlari denetle
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: python scripts/etsy/kisisel_uyum.py --out _work/KISISEL_UYUM.csv --summary _work/KISISEL_UYUM_OZET.json || echo "::warning::denetimde FAIL var"
      - name: Token ve TEMP raporlarini geri yaz
        if: ${{ always() }}
        run: |
          [ ! -f _work/ETSY_TOKEN.json.updated ] || rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json"
          [ ! -f _work/KISISEL_UYUM.csv ] || rclone copyto _work/KISISEL_UYUM.csv "gdrive:ASTROLOVE/TEMP/KISISEL_UYUM.csv"
          [ ! -f _work/KISISEL_UYUM_OZET.json ] || rclone copyto _work/KISISEL_UYUM_OZET.json "gdrive:ASTROLOVE/TEMP/KISISEL_UYUM_OZET.json"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: kisisel-uyum
          path: _work/KISISEL_UYUM*
          if-no-files-found: ignore
      - if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

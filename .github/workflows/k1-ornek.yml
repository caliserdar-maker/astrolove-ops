name: k1-ornek
# K1 ornek (19 Eki 2026): videonun ilk karesi. YALNIZ ORNEK URETIM; Metricool'a ve hicbir platforma YAZMA YOK.
# Cift (varsayilan AQUARIUS_LEO), muzik 2. sosyal/video_v9/video_uret.py: eski (onayli v9, degismedi) / --acilis A / --acilis B.
# 1) Onayli v9 yolu degismedi mi: Gemini & Leo --kareler + dogrula.py (her kare < 2.5); FAIL ise video uretilmez.
# 2) 3 video paralel (muzikli), 3) k1_qc.py: olcum + kapilar (PASS/FAIL) + KONTAK.jpg (3 satir x 0/0.5/1/2/3 sn).
# Cikti: Drive ASTROLOVE/TEMP/SOSYAL_K1_ORNEK_20261019/ (ESKI_/A_/B_<CIFT>.mp4, KONTAK.jpg, K1_QC.json, bilgi_*.json).
# Muzik parolasi Drive ASTROLOVE/TEMP/MUZIK_PAROLA.txt: rclone cat, hemen ::add-mask::, openssl'e env ile; cozulen .m4a Drive'a gitmez.
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      cift:
        description: 'cift anahtari (alfabetik)'
        default: AQUARIUS_LEO
jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      O: gdrive:ASTROLOVE/TEMP/SOSYAL_K1_ORNEK_20261019
      P2000: gdrive:ASTROLOVE/TEMP/PIN_V6_20261012/_POSTER2000
      REF_DIR: 1_rcZ69bhw00QfHedBiWywEoHPu9Y4bkB
      CIFT: ${{ inputs.cift }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Kurulum
      run: |
        set -euo pipefail
        pip install -q numpy==2.1.3 pillow==11.0.0 scipy==1.14.1 opencv-python-headless==4.10.0.84
        sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg fonts-dejavu-core >/dev/null
        curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
        echo "::warning::CPU $(nproc)"
    - name: rclone.conf
      env:
        RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      run: |
        set -euo pipefail
        mkdir -p ~/.config/rclone; umask 077
        printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
        if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "::add-mask::$GOOGLE_CLIENT_SECRET"
          grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true; fi
    - name: Uret + QC
      run: |
        set -uo pipefail
        case "$CIFT" in *[!A-Z_]*|'') echo "::error::cift gecersiz"; exit 1 ;; esac
        mkdir -p _w/ref _w/dg _w/m _o
        rclone copyto gdrive:AstroLoveArt_Gemini_Leo_2000.jpg _w/ref/GEMINI_LEO.jpg --drive-root-folder-id "$REF_DIR" -q
        rclone copyto "$P2000/$CIFT.jpg" "_w/$CIFT.jpg" -q || { echo "::error::poster yok: $CIFT"; exit 1; }
        # 1) onayli v9 yolu degismedi
        python3 sosyal/video_v9/video_uret.py --poster _w/ref/GEMINI_LEO.jpg --a Gemini --b Leo --out _w/dg --kareler 2,5,8,13,17,22 >/dev/null \
          && python3 sosyal/video_v9/dogrula.py _w/dg | tee _w/dg.txt; DG=${PIPESTATUS[0]}
        sed 's/^/::warning::DOGRULA /' _w/dg.txt
        [ "$DG" = 0 ] || { echo "::error::onayli v9 dogrulamasi FAIL, video uretilmedi"; exit 1; }
        # 2) muzik 2
        P=$(rclone cat "gdrive:ASTROLOVE/TEMP/MUZIK_PAROLA.txt" 2>/dev/null | tr -d '\r\n')
        [ -n "$P" ] && echo "::add-mask::$P"
        [ -n "$P" ] || { echo "::error::muzik parolasi Drive'dan okunamadi"; exit 1; }
        MUZIK_PAROLA="$P" openssl enc -d -aes-256-cbc -pbkdf2 -in sosyal/video_v9/assets/muzik_2.m4a.enc -out _w/m/muzik.m4a -pass env:MUZIK_PAROLA \
          || { unset P; echo "::error::muzik cozulemedi"; exit 1; }
        unset P
        a=$(echo "${CIFT%%_*}" | sed 's/.*/\L&/; s/^./\U&/'); b=$(echo "${CIFT#*_}" | sed 's/.*/\L&/; s/^./\U&/')
        slug=$(echo "$a-and-$b" | tr 'A-Z' 'a-z')
        T0=$(date +%s)
        for v in ESKI A B; do
          ek=""; [ "$v" = ESKI ] || ek="--acilis $v"
          python3 sosyal/video_v9/video_uret.py --poster "_w/$CIFT.jpg" --a "$a" --b "$b" --out "_w/$v" --muzik _w/m/muzik.m4a \
            --bilgi "_o/bilgi_$(echo $v | tr 'A-Z' 'a-z').json" $ek > "_w/$v.log" 2>&1 &
        done
        while [ "$(jobs -rp | wc -l)" -gt 0 ]; do
          sleep 60; echo "ETA $(for v in ESKI A B; do printf '%s: %s | ' $v "$(grep -o '[0-9]*/720 kare.*' _w/$v.log | tail -1)"; done) gecen $(( $(date +%s) - T0 )) sn"
        done
        wait
        for v in ESKI A B; do
          f="_w/$v/$slug-astroloveart-reel.mp4"
          [ -f "$f" ] && mv "$f" "_o/${v}_$CIFT.mp4" || { echo "::error::$v uretilemedi"; tail -20 "_w/$v.log"; }
        done
        echo "::warning::URETIM $(( $(date +%s) - T0 )) sn"
        # 3) QC + kontak
        cp _w/m/muzik.m4a _o/muzik.m4a
        python3 sosyal/video_v9/k1_qc.py _o "$CIFT" | tee _w/qc.txt; QC=${PIPESTATUS[0]}
        sed 's/^/::warning::QC /' _w/qc.txt | cut -c1-900
        rm -f _o/muzik.m4a; rm -rf _w/m
        rclone copy _o "$O" -q
        echo "::warning::DRIVE $(rclone lsf "$O" | tr '\n' ' ')"
        exit $QC
    - if: always()
      run: rm -rf _w _o/muzik.m4a ~/.config/rclone

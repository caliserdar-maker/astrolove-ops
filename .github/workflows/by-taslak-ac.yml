name: by-taslak-ac
# BIZIM YILIMIZ: CANCER_LIBRA TEK TASLAK (14 Eki 2026, Takip gorevi, Serdar). YAYIN YOK.
# Yazmalar yalniz yeni taslaga (kilit sinifi); canli 78 ilana yazma YOK; PATCH yalniz acil state=inactive.
# Her adim sonrasi state okunur; active gorulurse aninda inactive + DUR. Ikinci kosu ikinci ilan acmaz (DURUM.json + baslik).
permissions:
  actions: read
  contents: read
on:
  workflow_dispatch:
    inputs:
      paket_ref: { description: "bizim-yilimiz-v3 commit (CSV)", required: true, default: "6296081705126001952459a2e0f8eca2858bc2af" }
      mod: { description: "ac = yeni taslak | duzelt = eski taslagi duzelt (PATCH gerekirse sil + yeniden ac)", required: false, default: "ac" }
      eski_id: { description: "mod=duzelt icin eski taslak id", required: false, default: "" }
      oku: { description: "true = yalniz SALT OKUMA (aciklama karsilastirma), yazma yok", required: false, default: "false" }
      listing_id: { description: "oku=true icin taslak id", required: false, default: "" }
env:
  O: "gdrive:ASTROLOVE/TEMP/BY_TASLAK_CANCER_LIBRA_20261014"
jobs:
  taslak:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.paket_ref }}", path: _paket, fetch-depth: 0, sparse-checkout: BIZIM_YILIMIZ_78_ILAN_METIN.csv, sparse-checkout-cone-mode: false }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Token + gorseller + onceki durum
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _img _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
          rclone copy "gdrive:ASTROLOVE/TEMP/BIZIM_YILIMIZ_78_20261014_v2/CANCER_LIBRA/galeri" _img -q
          ls _img; [ "$(ls _img/*.jpg | wc -l)" = 10 ] || { echo "HATA galeri 10 degil"; exit 1; }
          rclone copy "$O" _out --include "/DURUM.json" -q || true
          ls -la _out
      - name: Salt okuma (aciklama)
        if: ${{ inputs.oku == 'true' }}
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          CSV: _paket/BIZIM_YILIMIZ_78_ILAN_METIN.csv
          LISTING_ID: ${{ inputs.listing_id }}
          OUT: _out
        run: python3 scripts/etsy/by_taslak_oku.py
      - name: Taslak
        if: ${{ inputs.oku != 'true' }}
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          CSV: _paket/BIZIM_YILIMIZ_78_ILAN_METIN.csv
          IMG_DIR: _img
          OUT: _out
          MOD: ${{ inputs.mod }}
          ESKI_ID: ${{ inputs.eski_id }}
        run: python3 scripts/etsy/by_taslak_ac.py
      - name: Drive'a rapor
        if: ${{ always() }}
        run: '[ -d _out ] && rclone copy _out "$O" -q && echo "::warning::rapor Drive TEMP/BY_TASLAK_CANCER_LIBRA_20261014" || true'
      - name: Token geri yaz
        if: ${{ always() }}
        run: |
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "token geri yazildi" || true
          rm -rf _work ~/.config/rclone

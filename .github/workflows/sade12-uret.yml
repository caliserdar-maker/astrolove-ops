name: sade12-uret
# Sade kupa 12 burc yeniden uretimi + dogrulama (Serdar 31 Eki ek is, Merkez 3a). ETSY YOK.
# Kod: kupa-orchard ceeb648 kupa_orchard/kapak_el/kod/sade12.sh (+ video_sade.py, baski_sade3.py) AYNEN; yalniz iki yol degisir (R kok yolu,
# glif kaynagi: kupa-printful-sonuc ac9aa718 kupa_uretim/sembol/<B>_<B>/sol.png; yerel CANCER denemesinde 9/9 JPG manifestle bayt esit).
# Dogrulama: scripts/kapak78/sade12_dogrula.py (JPG bayt = SADE12_MANIFEST.tsv; PNG piksel sha; MP4 framemd5). Surumler yerel denemeyle ayni.
# Cikti Drive TEMP/SADE12/<run_id>/<BURC>/ + V_<BURC>.json + OZET.json.
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      burclar: {description: "virgullu (bos = 12)", required: false, default: ""}
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      m: ${{ steps.m.outputs.m }}
    steps:
      - id: m
        env: {B: "${{ inputs.burclar }}"}
        run: |
          set -euo pipefail
          T="ARIES TAURUS GEMINI CANCER LEO VIRGO LIBRA SCORPIO SAGITTARIUS CAPRICORN AQUARIUS PISCES"
          L=${B:-$(echo $T | tr ' ' ',')}
          for x in ${L//,/ }; do [[ " $T " == *" $x "* ]] || { echo "::error::burc $x"; exit 1; }; done
          echo "m=$(python3 -c "import json,sys; print(json.dumps(sys.argv[1].split(',')))" "$L")" >> "$GITHUB_OUTPUT"
  uret:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        burc: ${{ fromJSON(needs.plan.outputs.m) }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: Kod ve glif
        env: {B: "${{ matrix.burc }}"}
        run: |
          set -euo pipefail
          git fetch -q --depth 1 origin ceeb648ffd06d1850ed2c6acda7cde274eca5fd0 && git worktree add -q _ko FETCH_HEAD
          git fetch -q --depth 1 origin ac9aa7185f9d7b07903f0cb99e7f366f425a631c
          git show "FETCH_HEAD:kupa_uretim/sembol/${B}_${B}/sol.png" > _glif.png
          sed -e "s#^R=/home/claude/caliserdar-maker/astrolove-ops#R=$PWD/_ko#" \
              -e "s#git -C \$R show refs/kapak78/sembol:kupa_uretim/sembol/\${B}_\${B}/sol.png > is/glif.png#cp $PWD/_glif.png is/glif.png#" \
              _ko/kupa_orchard/kapak_el/kod/sade12.sh > _s12.sh
          diff <(sed -n '1,4p;6,17p;19,99p' _ko/kupa_orchard/kapak_el/kod/sade12.sh) <(sed -n '1,4p;6,17p;19,99p' _s12.sh)   # yalniz 2 satir degisir
          grep -c "_glif.png" _s12.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Kurulum (yerel denemeyle ayni surumler)
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q numpy==2.5.3 opencv-python-headless==5.0.0.93 pillow==12.3.0 fonttools==4.60.1 scipy==1.18.1
          ffmpeg -version | head -1; nproc; grep -m1 "model name" /proc/cpuinfo
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || { sudo apt-get install -y -qq rclone >/dev/null; }
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Uret + dogrula
        env: {B: "${{ matrix.burc }}"}
        run: |
          set -uo pipefail
          mkdir -p _o && cd _o
          { echo "cpu: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2)"; echo "simd: $(grep -m1 -o 'avx512f' /proc/cpuinfo || echo yok)";
            echo "nproc: $(nproc)"; ldd --version | head -1; python3 -V; ffmpeg -version | head -1;
            python3 -c "import PIL, numpy, cv2, scipy, fontTools; print(PIL.__version__, numpy.__version__, cv2.__version__, scipy.__version__, fontTools.version)"; } > MAKINE_$B.txt 2>&1
          bash ../_s12.sh "$B" > LOG_$B.txt 2>&1; echo "URET=$?" >> "$GITHUB_ENV"
          python3 ../scripts/kapak78/sade12_dogrula.py ozet --dir "$B" --manifest ../_ko/kupa_orchard/ilan/SADE12_MANIFEST.tsv --json V_$B.json
          echo "DOGRULA=$?" >> "$GITHUB_ENV"
      - name: Drive'a yaz
        if: always()
        env: {B: "${{ matrix.burc }}"}
        run: |
          set -euo pipefail
          [ -d _o ] && rclone copy _o "gdrive:ASTROLOVE/TEMP/SADE12/${{ github.run_id }}" --exclude "*/is/*_onizleme.jpg" --immutable -q
          [ "${URET:-1}" = 0 ] && [ "${DOGRULA:-1}" = 0 ] || { echo "::error::$B uretim ${URET:-?} / dogrulama ${DOGRULA:-?} (LOG, V json)"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "v-${{ matrix.burc }}", path: "_o/V_*.json", retention-days: 3}
      - if: always()
        run: rm -rf _o ~/.config/rclone
  ozet:
    needs: uret
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: "v-*", merge-multiple: true, path: _v}
      - name: Ozet
        run: |
          python3 - <<'EOF' > OZET.json
          import json, glob
          R = [json.load(open(f)) for f in sorted(glob.glob("_v/V_*.json"))]
          t = {k: sum(r["sayim"][k] for r in R) for k in ("manifest", "jpg", "jpg_esit", "png", "png_bayt_esit", "mp4_bayt_esit", "eksik")}
          print(json.dumps(dict(burc=len(R), toplam=t, burclar={r["burc"]: r["sayim"] for r in R},
                                piksel={y: k.get("piksel") for r in R for y, k in r["dosya"].items() if "piksel" in k},
                                video={y: [k.get("kare_sayisi"), k.get("kareler_sha")] for r in R for y, k in r["dosya"].items() if y.endswith(".mp4")}), indent=1))
          EOF
          python3 -c "import json; print(json.load(open('OZET.json'))['toplam'])" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Drive'a yaz
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || { sudo apt-get install -y -qq rclone >/dev/null; }
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            export RCLONE_CONFIG_GDRIVE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET"; fi
          rclone copy OZET.json "gdrive:ASTROLOVE/TEMP/SADE12/${{ github.run_id }}" --immutable -q
          rm -rf ~/.config/rclone
          echo "::notice title=SADE12::TEMP/SADE12/${{ github.run_id }}/"

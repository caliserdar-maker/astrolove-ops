name: instagram-analiz
# Instagram anlik durum tespiti 19 Eki 2026 (SALT OKUMA). Metricool ve Instagram'a YAZMA / SILME / DEGISTIRME YOK; yalniz GET.
# scripts/sosyal/analiz/instagram.py: hesap gunluk (1 Eki+), gonderi bazinda (12 Eki+), karusel/Reel, plan/gercek (12 Eki+).
# Token: secret METRICOOL_USER_TOKEN (userId/blogId Drive METRICOOL_TOKEN.json'dan). Loga yazilmaz (::add-mask:: + sir_koru).
# mod=ig_bekleyen: scripts/sosyal/analiz/ig_bekleyen.py (bekleyen IG gonderileri + medya olcumu, yeni kapak adayi) -> SOSYAL_DEGISIM_20261020/INSTAGRAM/.
# mod=k2_link: scripts/sosyal/analiz/k2_link.py (K2 link envanteri: scheduler 12 Eki - 29 Ara, URL GET kontrolu, profil) -> .../K2_LINK/.
# Sir taramasini gecmeyen dosya _work'te kalir, Drive'a gitmez. Cikti: Drive ASTROLOVE/TEMP/SOSYAL_ANALIZ_20261019/INSTAGRAM/.
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      mod:
        description: "analiz (19 Eki Instagram tespit) | k2_link (K2 Etsy link envanteri, tum aglar) | ig_bekleyen (20 Eki bekleyen IG + kapak esleme)"
        default: analiz
jobs:
  oku:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      O: gdrive:ASTROLOVE/TEMP/${{ inputs.mod == 'ig_bekleyen' && 'SOSYAL_DEGISIM_20261020/INSTAGRAM' || inputs.mod == 'k2_link' && 'SOSYAL_ANALIZ_20261019/K2_LINK' || 'SOSYAL_ANALIZ_20261019/INSTAGRAM' }}
    steps:
      - uses: actions/checkout@v4
      - name: rclone + token
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          mkdir -p ~/.config/rclone _work _out; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Analiz (yalniz GET)
        env:
          MC_TOK: ${{ secrets.METRICOOL_USER_TOKEN }}
        run: |
          set -uo pipefail
          umask 077
          [ -n "${MC_TOK:-}" ] || { echo "::error::METRICOOL_USER_TOKEN bos"; exit 1; }
          echo "::add-mask::$MC_TOK"
          rclone copyto "gdrive:ASTROLOVE/TEMP/METRICOOL_TOKEN.json" _work/kimlik.json
          python3 -c "import json,os;d=json.load(open('_work/kimlik.json'));json.dump({'userToken':os.environ['MC_TOK'],'userId':d['userId'],'blogId':d['blogId']},open('_work/mc.json','w'))"
          python3 -c "import json;print('::add-mask::'+json.load(open('_work/kimlik.json'))['userToken'])"
          EK=""
          if [ "${{ inputs.mod }}" = "k2_link" ]; then BETIK=scripts/sosyal/analiz/k2_link.py
          elif [ "${{ inputs.mod }}" = "ig_bekleyen" ]; then
            BETIK=scripts/sosyal/analiz/ig_bekleyen.py; EK="_work/aday _work/is"; mkdir -p _work/aday
            python3 -c "import numpy, PIL" 2>/dev/null || pip install -q numpy pillow
            command -v ffprobe >/dev/null || { sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq ffmpeg >/dev/null; }
            ffprobe -version | head -1
            T=gdrive:ASTROLOVE/TEMP
            rclone lsf "$T/KAPAK_P2_78_20261019/BASLIK_A/KAPAK_A" > _work/aday/P2_A.txt || true
            rclone lsf "$T/KAPAK_P2_78_20261019/KAPAK" > _work/aday/P2.txt || true
            rclone lsf "$T/KUPA_KAPAK_78_20261019/KAPAK" > _work/aday/KUPA.txt || true
            rclone lsf "$T/KAPAK_Y1_78_20261019/KAPAK" > _work/aday/Y1.txt || true
          else BETIK=scripts/sosyal/analiz/instagram.py; fi
          python3 $BETIK _work/mc.json _out $EK | python3 scripts/guvenlik/sir_koru.py tee --sir-json _work/mc.json --sir-json _work/kimlik.json "$GITHUB_STEP_SUMMARY"
          rc=${PIPESTATUS[0]}
          mkdir -p _work/engel
          for f in _out/*; do
            python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/mc.json --sir-json _work/kimlik.json "$f" >/dev/null 2>&1 \
              || { echo "TARAMA GECMEDI (Drive'a gitmez): $(basename "$f")"; mv "$f" _work/engel/; }
          done
          python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/mc.json --sir-json _work/kimlik.json _out || exit 1
          rclone copy _out "$O" -q
          rclone lsl "$O" | python3 scripts/guvenlik/sir_koru.py tee --sir-json _work/mc.json "$GITHUB_STEP_SUMMARY"
          exit $rc
      - if: always()
        run: |
          rm -rf _work ~/.config/rclone
          if [ -f "$RUNNER_TEMP/SIR_ENGEL" ]; then echo "::error::sir iceren satir engellendi (sir_koru)"; exit 1; fi

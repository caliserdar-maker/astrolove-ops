name: wp-plate-yukle

# KARAR A 2. adim (Serdar 2 Eki): gecen plate'ler PLATES'e. 11x14 VINTAGE_B1/B2/B3 (kosu 37052384573) +
# 16x20 / 18x24 / 24x36 / A2 VINTAGE_B_<boy> (kosu 37046187292). Yalniz yeni dosya adlari; mevcut VINTAGE_<boy>
# dosyalarina dokunulmaz (varsa durur). Kaynak = hedef md5 dogrulanir. Tetik: config/wp_plate_yukle.trigger (bu dal).

permissions:
  contents: read

on:
  push:
    branches: [claude/wp-katman-baski-60sk0s]
    paths:
      - config/wp_plate_yukle.trigger

concurrency: wp-plate-yukle

jobs:
  yukle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: rclone kur
        run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONF_B64:-}" ]; then echo "HATA: RCLONE_CONF_B64 yok" >&2; exit 1; fi
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Yukle + md5 dogrula
        run: |
          set -euo pipefail
          T0=$(date +%s)
          PL=gdrive:ASTROLOVE/TEMP/SIPARIS_ISIM/PLATES
          md5() { rclone lsjson --hash "$1" | python -c "import json,sys; d=json.load(sys.stdin); print(d[0]['Hashes']['md5'] if d else '')"; }
          ikili=()
          for k in 1 2 3; do ikili+=("gdrive:ASTROLOVE/TEMP/WP_PLATE_B/37052384573/11x14/VINTAGE_B${k}_11x14.png|VINTAGE_B${k}_11x14.png"); done
          for b in 16x20 18x24 24x36 A2; do ikili+=("gdrive:ASTROLOVE/TEMP/WP_PLATE_B/37046187292/$b/VINTAGE_B_$b.png|VINTAGE_B_$b.png"); done
          for x in "${ikili[@]}"; do
            src=${x%%|*}; ad=${x##*|}
            [ -n "$(md5 "$PL/$ad")" ] && { echo "HATA: PLATES/$ad zaten var" >&2; exit 1; }
            rclone copyto "$src" "$PL/$ad"
            a=$(md5 "$src"); b=$(md5 "$PL/$ad")
            [ -n "$a" ] && [ "$a" = "$b" ] || { echo "HATA: md5 $ad $a != $b" >&2; exit 1; }
            echo "PLATES $ad md5 $b"
          done
          echo "SURE yukle $(( $(date +%s) - T0 )) sn"
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone

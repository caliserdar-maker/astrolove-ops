name: kupa-ru

# KUPA ORCHARD 78 ilan RU katmani (Serdar 19 Eki 2026). Kod: scripts/etsy/kupa_ru.py
# apply=false (varsayilan): SALT OKUMA (state, bolum, mevcut RU) + metin kontrolu. Etsy'ye yazmaz.
# apply=true KAPALI (31 Eki inceleme: eski 19 Eki RU CSV'si canli RU'yu eski metinle ezer). Yalniz kuru.
# Metin: kupa-orchard dali kupa_orchard/ilan/KUPA78_ORCHARD_METIN_RU.csv (ru_ref). Liste: Drive TEMP/KUPA_ORCHARD_TASLAK_20261019.
# Cikti: Drive ASTROLOVE/TEMP/KUPA_ORCHARD_TASLAK_20261019/RU_<zaman>/ (KUPA_RU.csv, KUPA_RU.json). Kota tabani 10.

permissions:
  actions: read
  contents: read

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "true = aktif ilanlara RU YAZ (Serdar onayi)"
        type: boolean
        default: false
      confirm:
        description: "apply=true icin tam olarak: CANLI"
        required: false
        default: ""
      ru_ref:
        description: "kupa-orchard dalinda commit (RU CSV)"
        required: false
        default: "a8cb552"

jobs:
  ru:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Onay kapisi
        env:
          APPLY_IN: ${{ inputs.apply }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$APPLY_IN" = "true" ]; then   # 31 Eki: eski 19 Eki RU CSV'si (beyansiz, Left/Right) yazilmaz; yeni kurucu ru_kupa.py
            echo "::error::kupa-ru apply KAPALI (eski 19 Eki RU metni; yeni RU scripts/etsy/ru_kupa.py, Serdar + Lena onayi sonrasi ayri yazici). DUR."; exit 1
          fi
          if [ "$APPLY_IN" = "true" ] && [ "$CONFIRM" != "CANLI" ]; then
            echo "::error::apply=true icin confirm tam olarak 'CANLI' olmali. DUR."; exit 1
          fi
          [ "$APPLY_IN" = "true" ] && echo "::warning::APPLY: Etsy RU yazma acik." || echo "KURU: Etsy yazma yok."
      - uses: actions/checkout@v4
        with: { path: main }
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: cd main && python3 scripts/etsy/kilit_bekle.py
      - uses: actions/checkout@v4
        with: { ref: kupa-orchard, path: orchard, fetch-depth: 0, sparse-checkout: kupa_orchard/ilan }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Kurulum
        run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || sudo apt-get install -y -qq rclone >/dev/null
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"; echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Token, liste, RU metni
        env:
          RU_REF: ${{ inputs.ru_ref }}
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
          rclone copyto "gdrive:ASTROLOVE/TEMP/KUPA_ORCHARD_TASLAK_20261019/KUPA_TASLAK_LISTE.csv" _work/liste.csv
          git -C orchard show "$RU_REF:kupa_orchard/ilan/KUPA78_ORCHARD_METIN_RU.csv" > _work/ru.csv
          wc -l _work/liste.csv _work/ru.csv
      - name: RU (kuru ya da yaz)
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          APPLY_IN: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          A=""; [ "$APPLY_IN" = "true" ] && A="--apply"
          python3 main/scripts/etsy/kupa_ru.py --liste _work/liste.csv --ru-csv _work/ru.csv --out _out $A --quota-min 10
      - name: Token ve cikti Drive'a
        if: ${{ always() }}
        run: |
          set -euo pipefail
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "Token geri yazildi" || true
          stamp=$(TZ=Europe/Istanbul date +%Y%m%d_%H%M)
          [ -d _out ] && rclone copy _out "gdrive:ASTROLOVE/TEMP/KUPA_ORCHARD_TASLAK_20261019/RU_${stamp}" -q && echo "Cikti: RU_${stamp}" || true
      - if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

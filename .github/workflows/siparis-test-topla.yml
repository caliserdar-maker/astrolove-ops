name: siparis-test-topla
# Siparis test ciktilarini tek Drive klasorune toplar (15 Eki 2026, Serdar). Etsy YOK, uretim YOK; yalniz Drive okuma + kopya + olcum.
# girdi: satirlar = "ALT_KLASOR|KAYNAK_DRIVE_YOLU;..." ; teslim dosyalari (_8x10/_5x7/_24x36/_A2/_11x14 ... ile biten JPG) + kontrol JSON'lari kopyalanir.
# Cikti: TEMP/SIPARIS_TEST_20261015/<ALT_KLASOR>/ + OLCUM.csv (dosya, piksel, dpi, MB).
run-name: siparis-test-topla
on:
  workflow_dispatch:
    inputs:
      satirlar: { description: "ALT|KAYNAK;ALT|KAYNAK (KAYNAK gdrive: sonrasi yol)", required: true }
permissions:
  contents: read
jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Kurulum
        run: |
          set -euo pipefail
          pip install -q pillow==12.3.0
          curl -fsSL --retry 3 -o /tmp/rc.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip || { sudo apt-get install -y -qq rclone >/dev/null; exit 0; }
          unzip -q -j /tmp/rc.zip '*/rclone' -d /tmp/rcb && sudo install -m 755 /tmp/rcb/rclone /usr/local/bin/rclone
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true; fi
      - name: Topla + olc
        env:
          SATIRLAR: ${{ inputs.satirlar }}
        run: |
          set -uo pipefail
          HEDEF="gdrive:ASTROLOVE/TEMP/SIPARIS_TEST_20261015"
          mkdir -p _out; echo "alt_klasor,dosya,piksel,dpi,MB" > _out/OLCUM.csv
          IFS=';' read -ra S <<< "$SATIRLAR"
          for s in "${S[@]}"; do
            ALT="${s%%|*}"; KAY="${s#*|}"; mkdir -p "_out/$ALT"
            rclone copy "gdrive:$KAY" "_out/$ALT" --include "*_{8x10,5x7,11x14,12x16,12x18,16x20,16x24,18x24,20x30,24x30,24x36,A4,A3,A2}.jpg" --include "*.json" --include "OZET.md" --max-depth 3 -q || echo "::warning::$ALT kaynak okunamadi"
            find "_out/$ALT" -mindepth 2 -type f -exec mv -n {} "_out/$ALT/" \; ; find "_out/$ALT" -mindepth 1 -type d -empty -delete
            for f in "_out/$ALT"/*.jpg; do [ -f "$f" ] || continue
              python3 -c "import sys,os;from PIL import Image;im=Image.open(sys.argv[1]);d=im.info.get('dpi',(0,0));print(f'{sys.argv[2]},{os.path.basename(sys.argv[1])},{im.size[0]}x{im.size[1]},{round(d[0])}x{round(d[1])},{os.path.getsize(sys.argv[1])/1e6:.2f}')" "$f" "$ALT" >> _out/OLCUM.csv
            done
          done
          cat _out/OLCUM.csv
          rclone copy _out "$HEDEF" -q && rclone check _out "$HEDEF" --one-way -q && echo "Drive: ASTROLOVE/TEMP/SIPARIS_TEST_20261015"
          rm -rf ~/.config/rclone

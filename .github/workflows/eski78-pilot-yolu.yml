name: eski78-pilot-yolu

# Serdar 24 Eki YONTEM DEGISIKLIGI: yalniz canlida kanitlanmis yol. Bu dosya 45233945'teki eski78-gorsel-yukle.yml'nin BIREBIR kopyasi;
# tek fark kodun sabit commit'ten cekilmesi (actions/checkout ref) ve sha kaniti:
#   mod kuru / yukle -> (26 Eki'ye kadar) 1059b773 (pilot yukleme kosusu 40091265199 ve 22 ilan bu kodla kostu)
#     Serdar 26 Eki onayi: kuru / yukle -> fe10f665 scripts/etsy/eski78_pilot_yukle.py (1059b773 kopyasi + sira ardindan son renk
#     bagi + girdi kapisi; rank yazimi renk bagini siler, 40232676309). Canlida henuz kosmadi: ilk gercek ilan ayri onayla.
#     96e9dcec (2. iterasyon, bagimsiz inceleme): devam plani DEVAM'da, kalan adim tahmini, sira oncesi/sonrasi bag olcumu,
#     girdi icerik kapisi. Kuru / yukle bu commit'e sabit.
#   mod bag / oku    -> 45233945048c403623aeae309fe3a7f49c517702 (pilot bag 40092623702 ve oku 40092712384 bu kodla kostu)
# Ikinci fark (Serdar 24 Eki onayi): Etsy kilidi kumesi main'in .github/workflows'undan (_main, kilit_bekle.py --kok _main).
# (Etiket push'u ajan proxy'sinde 403; izinli dal main'de olmayan bir commit tasiyor, zorla push yapilmadi.)

# 23 eski galerili poster ilani: galeriyi hedef duzene getirir - scripts/etsy/eski78_gorsel_yukle.py (Serdar 24 Eki B4; 17 Eki surumunun
# yerine). ETSY'YE YAZAR (mod=yukle, onay SERDAR_GALERI23); mod=kuru yalniz plan. Tek ilan. Once yalniz pilot 4570155846, Serdar
# gorsel onayindan sonra. Girdi: galeri23-duzelt kosusunun Drive ciktisi (DUZELT_<kosu>/<ilan>_<CIFT>/: LISTE_<ilan>.csv, DEGISEN/)
# + hedef manifest (GALERI_YAYIN/KOSU_20261021_1030/<ilan>/yedek/manifest.json). Canli galerinin tam boy yedegi KILIT ALINMADAN
# once CDN'den (KART_SIL SONRA adresleri; Etsy API yok, kota yok). Cikti Drive ASTROLOVE/TEMP/DENETIM_20261021/GALERI23_YUKLE/<run_id>/.
# Yuklenen gorsellerin CDN NCC kontrolu kilitsiz galeri-ornek ile yapilir (KILIT SURESI kurali).
# mod=bag (Serdar 24 Eki): yukleme bittikten sonra YALNIZ renk baglari, TEK variation-images cagrisi (onay SERDAR_BAG24), gorsele
# yazim yok; galeri 17 / sira / alt metin hedefle ayni degilse yazmaz. mod=oku: salt okuma (galeri + baglar + korunanlar), yazim yok.
# bag/oku icin devam_kosu = yukleme kosusu (DEVAM_<ilan>.json yuklenen kimlikleri). Cikti BAG_<ilan>.json / OKU_<ilan>.json.

permissions:
  actions: read
  contents: read

on:
  workflow_dispatch:
    inputs:
      ilan: {description: "tek ilan (yalniz rakam)", required: true, default: "4570155846"}
      duzelt_kosu: {description: "galeri23-duzelt kosusu (DUZELT_<kosu>)", required: true, default: ""}
      mod: {description: "kuru | yukle | bag | oku", required: true, default: "kuru"}
      onay: {description: "yukle icin SERDAR_GALERI23, bag icin SERDAR_BAG24", required: false, default: ""}
      bag: {description: "bag/oku: beklenen 5 bag 'Renk=image_id,...' (bos = LISTE/manifest/DEVAM'dan)", required: false, default: ""}
      devam_kosu: {description: "yarim kalan onceki yukleme kosusu (DEVAM_<ilan>.json oradan); bos = yeni", required: false, default: ""}

env:
  D: "gdrive:ASTROLOVE/TEMP"
  O: "gdrive:ASTROLOVE/TEMP/DENETIM_20261021/GALERI23_YUKLE"

jobs:
  is:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (inputs.mod == 'bag' || inputs.mod == 'oku') && '45233945048c403623aeae309fe3a7f49c517702' || '96e9dcec3b29151979f363aeafaae5889059cb3e' }}
      - name: Kod kaniti (sabit commit)
        env:
          MOD: ${{ inputs.mod }}
        run: |
          set -euo pipefail
          H=$(git rev-parse HEAD)
          case "$MOD" in bag|oku) B=45233945048c403623aeae309fe3a7f49c517702 ;; *) B=96e9dcec3b29151979f363aeafaae5889059cb3e ;; esac
          [ "$H" = "$B" ] || { echo "::error::kod $H beklenen $B degil"; exit 1; }
          echo "::notice title=KOD::mod $MOD commit $H"; echo "KOD_SHA=$H" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          [[ "${{ inputs.ilan }}" =~ ^[0-9]+$ && "${{ inputs.duzelt_kosu }}" =~ ^[0-9]+$ && "${{ inputs.mod }}" =~ ^(kuru|yukle|bag|oku)$ ]] || { echo "::error::girdi"; exit 1; }
          case "${{ inputs.mod }}" in
            yukle) [ "${{ inputs.onay }}" = SERDAR_GALERI23 ] || { echo "::error::onay yok"; exit 1; } ;;
            bag) [ "${{ inputs.onay }}" = SERDAR_BAG24 ] || { echo "::error::onay yok"; exit 1; } ;;
          esac
          case "${{ inputs.mod }}" in bag|oku) [[ "${{ inputs.devam_kosu }}" =~ ^[0-9]+$ ]] || { echo "::error::bag/oku icin devam_kosu"; exit 1; } ;; esac
          [[ "${{ inputs.bag }}" =~ ^([A-Za-z ]+=[0-9]+(,[A-Za-z ]+=[0-9]+)*)?$ ]] || { echo "::error::bag girdisi"; exit 1; }
          pip install -q requests==2.34.2 numpy==2.1.3 pillow==11.0.0
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Girdiler + canli galeri tam boy yedegi (kilit adimindan once; CDN, Etsy API yok)
        env:
          L: ${{ inputs.ilan }}
          K: ${{ inputs.duzelt_kosu }}
          MOD: ${{ inputs.mod }}
        run: |
          set -euo pipefail
          mkdir -p _work/hedef _out/YEDEK_CDN
          C=$(python3 -c "import csv,sys;print(next(r['cift'] for r in csv.DictReader(open('data/pod/pod78_ids.csv')) if r['listing_id']=='$L'))")
          P="$D/DENETIM_20261021/GALERI_PLAN23/DUZELT_$K/${L}_${C}"
          rclone copyto "$P/LISTE_$L.csv" _work/LISTE.csv
          if [ "$MOD" = bag ] || [ "$MOD" = oku ]; then
            # yalniz bag / salt okuma: LISTE + hedef manifest + yukleme kosusunun DEVAM kaydi; gorsel indirme / CDN yedegi yok
            rclone copyto "$D/GALERI_YAYIN/KOSU_20261021_1030/$L/yedek/manifest.json" _work/manifest.json
            rclone copyto "$O/${{ inputs.devam_kosu }}/DEVAM_$L.json" _work/DEVAM.json || { echo "::error::DEVAM_$L.json yok"; exit 1; }
            rmdir _out/YEDEK_CDN; exit 0
          fi
          # kart QC kapisi (24 Eki inceleme): duzeltme kosusunda bu ilanin kart raporu PASS degilse yukleme yok
          rclone copyto "$P/KART/RAPOR.json" _work/KART_RAPOR.json || { echo "::error::KART/RAPOR.json yok (kart duzeltmesi yapilmamis)"; exit 1; }
          python3 -c "import json,sys; o=json.load(open('_work/KART_RAPOR.json'))['ozet']; sys.exit(0 if not o['hata'] and o['kart'] == o['pass_'] else f'kart QC FAIL: {o}')"
          rclone copy "$P/DEGISEN" _work/hedef --include "*.jpg" -q
          rclone copyto "$D/GALERI_YAYIN/KOSU_20261021_1030/$L/yedek/manifest.json" _work/manifest.json
          S=$(rclone lsf -R --files-only "$D/DENETIM_20261021/KART_SIL" --include "SONRA_${L}.json" | sort -t/ -k1,1n | tail -1)
          # 26 Eki: S bosken copyto tum KART_SIL'i indiriyordu (IsADirectoryError, 40227384901); acik DUR, Etsy istegi yok
          [ -n "$S" ] || { echo "::error::DUR: KART_SIL altinda SONRA_${L}.json yok (canli galeri kaydi); Etsy'ye istek yok"; exit 1; }
          rclone copyto "$D/DENETIM_20261021/KART_SIL/$S" _work/simdi.json
          [ -f _work/simdi.json ] && [ -s _work/simdi.json ] || { echo "::error::DUR: KART_SIL/$S dosya degil ya da bos; Etsy'ye istek yok"; exit 1; }
          python3 - <<'PY'
          import json, urllib.request
          G = json.load(open("_work/simdi.json")).get("gorseller")
          if not isinstance(G, list) or not G:
              raise SystemExit("DUR: simdi.json 'gorseller' bos ya da liste degil; Etsy'ye istek yok")
          for x in G:
              with urllib.request.urlopen(urllib.request.Request(x["url_fullxfull"], headers={"User-Agent": "Mozilla/5.0"}), timeout=60) as r:
                  open(f"_out/YEDEK_CDN/{int(x['rank']):02d}_{x['listing_image_id']}.jpg", "wb").write(r.read())
          print("CDN yedek:", len(json.load(open("_work/simdi.json"))["gorseller"]))
          PY
          DV="${{ inputs.devam_kosu }}"
          if [ -n "$DV" ]; then
            [[ "$DV" =~ ^[0-9]+$ ]] || { echo "::error::devam_kosu"; exit 1; }
            rclone copyto "$O/$DV/DEVAM_$L.json" "_out/DEVAM_$L.json" || { echo "::error::DEVAM_$L.json yok ($DV)"; exit 1; }
          fi
          rclone copy _out "$O/${GITHUB_RUN_ID}" -q
      # Serdar 24 Eki (kilit duzeltmesi): kilit kumesi sabit commit agacindan degil main'in .github/workflows'undan okunur.
      # Sabit agacta by-baski-ekle / dijital-fiyat-390 / bu dosya yoktu (156 vs 159); 40122397497 by-baski-ekle 40122058396 ile
      # ayni anda Etsy'ye yazdi. Pilot kodu (scripts/) sabit commit'te kalir; _main yalniz kume icin okunur.
      - name: Kilit kumesi icin main is akislari (yalniz .github/workflows)
        uses: actions/checkout@v4
        with:
          ref: main
          path: _main
          sparse-checkout: .github/workflows
          persist-credentials: false
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -f _main/.github/workflows/eski78-pilot-yolu.yml ] || { echo "::error::_main is akislari yok; kilitsiz devam edilmez"; exit 1; }
          python3 scripts/etsy/kilit_bekle.py --kok _main
      - name: Token
        run: |
          set -euo pipefail
          umask 077
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
      - name: Galeri
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          L: ${{ inputs.ilan }}
          MOD: ${{ inputs.mod }}
          BAG: ${{ inputs.bag }}
        run: |
          set +e -o pipefail
          args=(--ilan "$L" --liste _work/LISTE.csv --hedef-dir _work/hedef --manifest _work/manifest.json --out _out)
          case "$MOD" in
            kuru) args+=(--kuru) ;;
            yukle) args+=(--confirm ESKI23_GALERI) ;;
            bag) args+=(--mod bag --devam _work/DEVAM.json --confirm ESKI23_BAG ${BAG:+--bag "$BAG"}) ;;
            oku) args+=(--mod oku --devam _work/DEVAM.json ${BAG:+--bag "$BAG"}) ;;
          esac
          case "$MOD" in kuru|yukle) BETIK=scripts/etsy/eski78_pilot_yukle.py ;; *) BETIK=scripts/etsy/eski78_gorsel_yukle.py ;; esac
          python3 "$BETIK" "${args[@]}" 2>&1 | tee _work/kosu.log
          echo "KOD=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
      - name: Token geri yaz + cikti Drive'a
        if: always()
        run: |
          set -euo pipefail
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "Token geri yazildi" || echo "Token yenilenmedi"
          [ -f _work/kosu.log ] && python3 scripts/guvenlik/log_suz.py < _work/kosu.log > "_out/kosu_$(date -u +%Y%m%d_%H%M).txt"
          if grep -rqE '"(access_token|refresh_token)"[[:space:]]*:[[:space:]]*"[A-Za-z0-9._-]{20,}"|x-api-key[[:space:]]*:' _out/ 2>/dev/null; then
            echo "::error::Ciktida sir bulundu; Drive'a yazilmadi"; exit 1; fi
          rclone copy _out "$O/${GITHUB_RUN_ID}" -q && echo "::notice title=GALERI23 YUKLE::Drive TEMP/DENETIM_20261021/GALERI23_YUKLE/${GITHUB_RUN_ID}/"
          [ "${KOD:-1}" = 0 ] || { echo "::error::cikis ${KOD:-?}"; exit 1; }
      - if: always()
        run: rm -rf _work ~/.config/rclone

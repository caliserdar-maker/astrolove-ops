name: yd-kontak
# YD 10'lu set kontrol paftasi (Serdar 30 Eki karar 3; SABLON / ESIK kurulmaz). ETSY API YOK, token yok, kilit yok.
# Girdi: Drive TEMP/YD_KAPAK_V1/<kapak_damga>/*_Y??.jpg (klasor degistirilmez). Kart turu basina tek pafta (Y01, Y02, Y03, Y05-Y10):
# yd78_ids.csv sirasiyla 78 kucuk gorsel + cift adi, hucre >= 300 px; ORTAK_Y04 tek gorsel. scripts/kapak78/yd_kontak.py
# Cikti: Drive TEMP/YD_KONTAK/<damga>/ (KONTAK_Y<NN>.jpg, OZET.md), --immutable.
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      kapak_damga: {description: "TEMP/YD_KAPAK_V1/<damga> (YYYYMMDD_HHMMSS)", required: true}
jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Girdi kapisi
        env: {KD: "${{ inputs.kapak_damga }}"}
        run: |
          set -euo pipefail
          [[ "$KD" =~ ^[0-9]{8}_[0-9]{6}$ ]] || { echo "::error::kapak_damga"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          sudo apt-get install -y -qq fonts-dejavu-core >/dev/null || true
          pip install -q pillow==11.0.0
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || { sudo apt-get install -y -qq rclone >/dev/null; }
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Indir + kontrol (Etsy yok)
        env: {KD: "${{ inputs.kapak_damga }}"}
        run: |
          set -euo pipefail
          mkdir -p _work/kapak _out
          echo "DAMGA=$(date -u +%Y%m%d_%H%M%S)" >> "$GITHUB_ENV"
          rclone copy "gdrive:ASTROLOVE/TEMP/YD_KAPAK_V1/$KD" _work/kapak --include "*_Y[0-9][0-9].jpg" --max-depth 1 --transfers 8 -q
          echo "indirilen: $(ls _work/kapak | wc -l)"
          set +e
          python3 scripts/kapak78/yd_kontak.py --dir _work/kapak --ciftler data/pod/yd78_ids.csv --out _out --kaynak "TEMP/YD_KAPAK_V1/$KD"
          RC=$?
          set -e
          head -4 _out/OZET.md >> "$GITHUB_STEP_SUMMARY"
          echo "RC=$RC" >> "$GITHUB_ENV"
      - name: Drive'a yaz
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if ls _out/* >/dev/null 2>&1; then
            rclone copy _out "gdrive:ASTROLOVE/TEMP/YD_KONTAK/${DAMGA:?}" --immutable -q
            echo "::notice title=YD KONTAK::TEMP/YD_KONTAK/${DAMGA}/ (cikis ${RC:-?})"
          fi
          [ "${RC:-1}" = 0 ]
      - if: always()
        run: rm -rf _work _out ~/.config/rclone

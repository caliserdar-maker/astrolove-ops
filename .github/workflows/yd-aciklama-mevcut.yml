name: yd-aciklama-mevcut
# 1st Anniversary (YD) ilan aciklamalari: CANCER_LIBRA mevcut metin + 78 ilan arasindaki farklar (Serdar 31 Eki karar 5c). ETSY API YOK,
# token yok, kilit yok: girdi Etsy okuma yedegi Drive TEMP/<yedek>/HAM/<listing_id>.json. scripts/etsy/yd_aciklama_fark.py.
# Cikti Drive TEMP/YD_ACIKLAMA_MEVCUT/<damga>/ (CANCER_LIBRA.txt, SABLON.csv, FARK.csv, PARAGRAF.csv, OZET.md), --immutable.
# Metin degistirilmez (yeni metni Merkez hazirlar, Serdar onaylar).
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      yedek: {description: "TEMP/<yedek>/HAM (Etsy okuma yedegi)", required: true, default: "YD_ENVANTER_20261026"}
jobs:
  fark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Girdi kapisi
        env: {Y: "${{ inputs.yedek }}"}
        run: '[[ "$Y" =~ ^YD_ENVANTER_[0-9]{8}(_[0-9]{6})?$ ]] || { echo "::error::yedek"; exit 1; }'
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || { sudo apt-get install -y -qq rclone >/dev/null; }
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Yedek + fark (Etsy yok)
        env: {Y: "${{ inputs.yedek }}"}
        run: |
          set -uo pipefail
          mkdir -p _h _o
          echo "DAMGA=$(date -u +%Y%m%d_%H%M%S)" >> "$GITHUB_ENV"
          rclone copy "gdrive:ASTROLOVE/TEMP/$Y/HAM" _h --include "*.json" --max-depth 1 --transfers 8 -q || exit 1
          echo "yedek: $(ls _h | wc -l) json"
          python3 scripts/etsy/yd_aciklama_fark.py --ham _h --out _o --kaynak "TEMP/$Y/HAM"
          echo "KOD=$?" >> "$GITHUB_ENV"
          cat _o/OZET.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Drive'a yaz
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if ls _o/* >/dev/null 2>&1; then
            rclone copy _o "gdrive:ASTROLOVE/TEMP/YD_ACIKLAMA_MEVCUT/${DAMGA:?}" --immutable -q
            echo "::notice title=YD ACIKLAMA::TEMP/YD_ACIKLAMA_MEVCUT/${DAMGA}/"
          fi
          [ "${KOD:-1}" = 0 ] || { echo "::error::78 ilan / cift eslesmesi tam degil (OZET.md)"; exit 1; }
      - if: always()
        run: rm -rf _h _o ~/.config/rclone

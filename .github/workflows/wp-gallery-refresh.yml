name: wp-gallery-refresh

# GALERI YENILEME (3 ILANLIK ORNEK) - 4 Eyl 2026.
# ETSY'YE YAZAR: yalniz 6 galeri gorseli yenilenir ve mevcut video silinir.
# ZIP/PDF, fiyat, metin ve state'e DOKUNULMAZ; yayinlama cagrisi YOKTUR.
# Varsayilan DRY-RUN; yazma icin apply=true gerekir.

on:
  workflow_dispatch:
    inputs:
      listings:
        description: "cift:listing_id virgullu - ILK sirada pilot"
        required: true
        default: "Cancer_Libra:4565911475,Aries_Aries:4565911379,Leo_Pisces:4565934620"
      apply:
        description: "Yazmayi gercekten uygula (kapaliysa DRY-RUN)"
        type: boolean
        default: false

concurrency:
  group: etsy-token
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null

      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi

      - name: Token + kaynak galeri gorselleri (yalniz 3 cift)
        run: |
          set -euo pipefail
          umask 077
          mkdir -p _work/mock
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
          IFS=',' read -ra L <<< "${{ inputs.listings }}"
          for item in "${L[@]}"; do
            pair="${item%%:*}"
            up=$(echo "$pair" | tr '[:lower:]' '[:upper:]')
            rclone copy "gdrive:ASTROLOVE/WALLPAPER/MOCKUP_V2/$up" "_work/mock/$up" \
              --include "WA_MOCKUP_V2_*_FINAL.jpg"
            echo "$up: $(ls "_work/mock/$up" | wc -l) gorsel"
          done

      - name: Galeri yenileme
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          set -euo pipefail
          args=(--listings "${{ inputs.listings }}" --mock-dir _work/mock
                --out _work/WP_GALLERY_REFRESH.csv --cmp-out _work/WP_GALLERY_CMP.csv)
          if [ "${{ inputs.apply }}" = "true" ]; then args+=(--apply); fi
          python scripts/etsy/wp_gallery_refresh.py "${args[@]}"

      - name: Token'i Drive'a geri yaz (yenilendiyse)
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ -f _work/ETSY_TOKEN.json.updated ]; then
            rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json"
          fi

      - name: Sonuclari Drive'a yaz
        if: ${{ always() }}
        run: |
          set -euo pipefail
          for f in WP_GALLERY_REFRESH WP_GALLERY_CMP; do
            [ -f "_work/$f.csv" ] && rclone copyto "_work/$f.csv" "gdrive:ASTROLOVE/TEMP/$f.csv" || true
          done

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: wp-gallery-refresh
          path: |
            _work/WP_GALLERY_REFRESH.csv
            _work/WP_GALLERY_CMP.csv
          if-no-files-found: ignore

      - name: Temizlik
        if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

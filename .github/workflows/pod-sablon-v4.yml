name: pod-sablon-v4 (V8.1 veri)

# V8.1 icin ek gercek medya: V5 kosusunun Aries+Leo ve Aquarius+Cancer
# videolari Drive'dan alinip dala commit'lenir. Etsy cagrisi YOK.

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  sablon:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pod-v4
      - run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: V5 videolarini indir
        run: |
          set -euo pipefail
          mkdir -p _veri/v8
          for f in Aries_Leo_4570031205_video.mp4 Aquarius_Cancer_4570125580_video.mp4; do
            rclone copyto "gdrive:ASTROLOVE/TEMP/POD_REFERANS_ORNEK_V5/$f" "_veri/v8/v5_$f"
          done
          ls -la _veri/v8
      - name: Dala commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f _veri/v8
          git commit -m "pod v8.1: ek V5 videolari (Aries+Leo, Aquarius+Cancer)" || echo "degisiklik yok"
          git push origin HEAD:pod-v4
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone

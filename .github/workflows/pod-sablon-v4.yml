name: pod-sablon-v4 (RANK3->11 uygulama)

# PLAN.csv'ye gore rank-3 gorseli rank-11'e tasir. apply=false kuru denemedir.
# Once pilot 4570031205; gecmezse toplu kosu baslamaz.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "true = Etsy'ye yaz (78 ilan)"
        type: boolean
        default: false
      confirm:
        description: "apply=true icin tam olarak RANK3_TO_11"
        required: false
        default: ""
      limit:
        description: "kac ilan (0 = hepsi)"
        default: "0"
      oku:
        description: "salt okuma: tek ilan id (apply=false ile)"
        default: ""
      duzelt:
        description: "rank duzeltme: tek ilan id"
        default: ""
      duzelt_apply:
        description: "true = duzeltmeyi Etsy'ye yaz (confirm=RANK_DUZELT)"
        type: boolean
        default: false

concurrency:
  group: etsy-token
  cancel-in-progress: false

jobs:
  rank3:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      APPLY: ${{ inputs.apply && 'true' || 'false' }}
      CONFIRM: ${{ inputs.confirm || '' }}
      DUZELT_APPLY: ${{ inputs.duzelt_apply && 'true' || 'false' }}
    steps:
      - name: Onay kapisi
        run: |
          set -euo pipefail
          if [ "$APPLY" = "true" ] && [ "$CONFIRM" != "RANK3_TO_11" ]; then
            echo "::error::apply=true icin confirm 'RANK3_TO_11' olmali. DUR."
            exit 1
          fi
          if [ "${DUZELT_APPLY:-false}" = "true" ] && [ "$CONFIRM" != "RANK_DUZELT" ]; then
            echo "::error::duzelt_apply=true icin confirm 'RANK_DUZELT' olmali. DUR."
            exit 1
          fi
          [ "$APPLY" = "true" ] && echo "::warning::APPLY: 78 ilanda rank-3 -> rank-11." || echo "KURU DENEME: Etsy yazma yok."
      - uses: actions/checkout@v4
        with:
          ref: pod-v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2 pillow==11.0.0 numpy==2.1.3
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Token
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
      - name: 'RANK3 -> RANK11'
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          LIMIT: ${{ inputs.limit || '0' }}
          OKU_LISTING: ${{ inputs.oku || '' }}
          DUZELT_LISTING: ${{ inputs.duzelt || '' }}
          DUZELT_APPLY: ${{ inputs.duzelt_apply && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [ "$APPLY" = "true" ]; then
            python scripts/pod/pod_rank3_uygula.py --apply --confirm "$CONFIRM" --limit "$LIMIT"
          elif [ -n "${DUZELT_LISTING:-}" ]; then
            if [ "$DUZELT_APPLY" = "true" ]; then
              python scripts/pod/pod_rank3_duzelt.py --listing "$DUZELT_LISTING" --apply --confirm "$CONFIRM"
            else
              python scripts/pod/pod_rank3_duzelt.py --listing "$DUZELT_LISTING"
            fi
          elif [ -n "${OKU_LISTING:-}" ]; then
            python scripts/pod/pod_rank3_oku.py
          else
            python scripts/pod/pod_rank3_uygula.py --limit "$LIMIT"
          fi
      - name: Token geri yazma
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ -f _work/ETSY_TOKEN.json.updated ]; then
            rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json"
            echo "Token geri yazildi"
          fi
      - if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

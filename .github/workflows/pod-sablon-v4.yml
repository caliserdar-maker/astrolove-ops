name: pod-sablon-v4 (galeri duzeni)

# Hedef duzen: 1 kapak | 2-3 oda | 4-8 bilgi | 9-13 edisyon (MB,DB,WP,CI,PW).
# mod=pilot: tek ilan (apply icin confirm=GALERI_DUZEN). mod=kuru: 78 ilan salt okuma.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      mod:
        description: "pilot | kuru | toplu"
        default: "kuru"
      listing:
        description: "pilot icin ilan id"
        default: "4570031205"
      hedef:
        description: "pilot icin acik hedef sira (virgulle 13 id, bos = kural)"
        default: ""
      apply:
        description: "true = Etsy'ye yaz (yalniz pilot)"
        type: boolean
        default: false
      confirm:
        description: "apply=true icin tam olarak GALERI_DUZEN"
        default: ""
      limit:
        description: "kuru: kac ilan (0 = hepsi)"
        default: "0"

concurrency:
  group: etsy-token
  cancel-in-progress: false

jobs:
  duzen:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      MOD: ${{ inputs.mod || 'kuru' }}
      APPLY: ${{ inputs.apply && 'true' || 'false' }}
      CONFIRM: ${{ inputs.confirm || '' }}
      LISTING: ${{ inputs.listing || '4570031205' }}
      HEDEF: ${{ inputs.hedef || '' }}
      LIMIT: ${{ inputs.limit || '0' }}
    steps:
      - name: Onay kapisi
        run: |
          set -euo pipefail
          if [ "$APPLY" = "true" ] && [ "$MOD" = "pilot" ] && [ "$CONFIRM" != "GALERI_DUZEN" ]; then
            echo "::error::pilot yazma icin confirm 'GALERI_DUZEN' olmali. DUR."
            exit 1
          fi
          if [ "$APPLY" = "true" ] && [ "$MOD" = "toplu" ] && [ "$CONFIRM" != "GALERI_TOPLU" ]; then
            echo "::error::toplu yazma icin confirm 'GALERI_TOPLU' olmali. DUR."
            exit 1
          fi
          if [ "$APPLY" = "true" ] && [ "$MOD" = "kuru" ]; then
            echo "::error::mod=kuru ile yazma olmaz. DUR."
            exit 1
          fi
          [ "$APPLY" = "true" ] && echo "::warning::APPLY: $LISTING galeri sirasi degisecek." || echo "KURU DENEME: Etsy yazma yok."
      - uses: actions/checkout@v4
        with:
          ref: pod-v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2 pillow==11.0.0 numpy==2.1.3
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Token
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
      - name: 'Galeri duzeni'
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          set -euo pipefail
          if [ "$MOD" = "toplu" ]; then
            if [ "$APPLY" = "true" ]; then
              python scripts/pod/pod_galeri_toplu.py --apply --confirm "$CONFIRM" --limit "$LIMIT"
            else
              python scripts/pod/pod_galeri_toplu.py --limit "$LIMIT"
            fi
          elif [ "$MOD" = "pilot" ]; then
            if [ "$APPLY" = "true" ]; then
              python scripts/pod/pod_galeri_duzen.py pilot --listing "$LISTING" --hedef "$HEDEF" --apply --confirm "$CONFIRM"
            else
              python scripts/pod/pod_galeri_duzen.py pilot --listing "$LISTING" --hedef "$HEDEF"
            fi
          else
            python scripts/pod/pod_galeri_duzen.py kuru --limit "$LIMIT"
          fi
      - name: Token geri yazma
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ -f _work/ETSY_TOKEN.json.updated ]; then
            rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json"
            echo "Token geri yazildi"
          fi
      - if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

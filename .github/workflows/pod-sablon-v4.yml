name: pod-sablon-v4 (V11 cikti yukleme)

# V11 ciktilarini Drive'a yukler (tek adim). Etsy cagrisi YOK.

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  sablon:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pod-v4
      - run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Drive'a yukle
        run: |
          set -euo pipefail
          for f in ENVANTER.md KONTROL.json KARE_KARSILASTIRMA_V11.jpg \
                   AQUARIUS_ARIES_V11.mp4 AQUARIUS_ARIES_kapak_V11.png \
                   ARIES_LEO_V11.mp4 ARIES_LEO_kapak_V11.png \
                   SCORPIO_TAURUS_V11.mp4 SCORPIO_TAURUS_kapak_V11.png \
                   AQUARIUS_GEMINI_V11.mp4 AQUARIUS_GEMINI_kapak_V11.png; do
            test -s "_veri/v11_cikti/$f"
          done
          [ "$(ls _veri/v11_cikti/KUCUK_KIRPINTI/*.jpg | wc -l)" -eq 9 ]
          rclone copy _veri/v11_cikti "gdrive:ASTROLOVE/TEMP/POD_V11" -q
          rclone copyto _veri/v11/KUTULAR.csv "gdrive:ASTROLOVE/TEMP/POD_V11/KUTULAR.csv"
          rclone lsf -R --format "sp" "gdrive:ASTROLOVE/TEMP/POD_V11"
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone

name: pod-sablon-v4 (V11 veri+envanter)

# V9 icin gercek medya: Etsy'den referans kapak+video ve ornek kapak (yalniz
# GET), Drive'dan V5 Aquarius+Aries videosu. Dosyalar dala commit'lenir.

permissions:
  contents: write

on:
  workflow_dispatch:

concurrency:
  group: etsy-token
  cancel-in-progress: false

jobs:
  sablon:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pod-v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2 numpy==2.1.3 pillow==11.0.0 opencv-python-headless==4.10.0.84
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Token
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
      - name: 'Gercek medyayi indir (salt okur)'
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          set -euo pipefail
          python scripts/pod/pod_v11_veri.py
          ls -la _veri/v11
      - name: Token geri yazma
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ -f _work/ETSY_TOKEN.json.updated ]; then
            rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json"
            echo "Token geri yazildi"
          fi
      - name: Dala commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f _veri/v11
          git commit -m "pod v11: envanter + ornek videolar (gecici)" || echo "degisiklik yok"
          git push origin HEAD:pod-v4
      - if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

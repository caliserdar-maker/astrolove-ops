name: pod-sablon-v4 (V11 PILOT yayin 4570110641)

# YALNIZ Aquarius+Aries (4570110641). apply=false kuru denemedir.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "true = Etsy'ye yaz (yalniz 4570110641)"
        type: boolean
        default: false
      confirm:
        description: "apply=true icin tam olarak PILOT_4570110641"
        required: false
        default: ""

concurrency:
  group: etsy-token
  cancel-in-progress: false

jobs:
  yayin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APPLY: ${{ inputs.apply && 'true' || 'false' }}
      CONFIRM: ${{ inputs.confirm || '' }}
    steps:
      - name: Onay kapisi
        run: |
          set -euo pipefail
          if [ "$APPLY" = "true" ] && [ "$CONFIRM" != "PILOT_4570110641" ]; then
            echo "::error::apply=true icin confirm 'PILOT_4570110641' olmali. DUR."
            exit 1
          fi
          [ "$APPLY" = "true" ] && echo "::warning::APPLY: yalniz 4570110641 medyasi degisecek." || echo "KURU DENEME: Etsy yazma yok."
      - uses: actions/checkout@v4
        with:
          ref: pod-v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2 numpy==2.1.3 pillow==11.0.0
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Token
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
      - name: 'Pilot yayin'
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          set -euo pipefail
          if [ "$APPLY" = "true" ]; then
            python scripts/pod/pod_v11_yayin.py --listing 4570110641 --apply --confirm "$CONFIRM"
          else
            python scripts/pod/pod_v11_yayin.py --listing 4570110641
          fi
      - name: Token geri yazma
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ -f _work/ETSY_TOKEN.json.updated ]; then
            rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json"
            echo "Token geri yazildi"
          fi
      - if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

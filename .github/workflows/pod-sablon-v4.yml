name: pod-sablon-v4

# Referans Aquarius+Gemini sahnesini TEK SABLON yapar: arka plan (oda, cerceve,
# isik, mum, cicek, kitaplar, kadraj) referansla ayni kalir, yalniz poster ici
# o ciftin tasarimiyla degisir. Kompozit YUV duzleminde yapilir; panel disi
# baytlara dokunulmaz. Etsy'ye YAZMA YOK (yalniz GET, --apply reddedilir).
# Cikti: ASTROLOVE/TEMP/POD_REFERANS_ORNEK_V4/

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      ornek_ids:
        description: "Ornek ilan kimlikleri (virgullu)"
        required: false
        default: "4570031205,4570125580,4570110641,4570224058,4570126104"

concurrency:
  group: etsy-token
  cancel-in-progress: false

jobs:
  sablon:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ORNEK_IDS: ${{ inputs.ornek_ids }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2 numpy==2.1.3 pillow==11.0.0 scipy==1.14.1
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg tesseract-ocr >/dev/null
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          tesseract --version | head -1
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: 'Poster on kontrolu (salt okuma, lsf)'
        env:
          POSTER_KOK: gdrive:ASTROLOVE/WALL_ART/POSTERS/ORIGINAL_HIGH_RES/MIDNIGHT_BLUE
        run: |
          set -euo pipefail
          # Drive'da dosya adlari BUYUK HARF (<ORAN>/<CIFT>.jpg) ve rclone --include
          # harf duyarli. Indirmeden once 6 ciftin de var oldugu dogrulanir.
          eksik=0
          for cift in AQUARIUS_GEMINI ARIES_LEO AQUARIUS_CANCER AQUARIUS_ARIES \
                      SCORPIO_TAURUS AQUARIUS_CAPRICORN; do
            rclone lsf -R "$POSTER_KOK" --include "**/${cift}.jpg" > "_lsf_${cift}.txt"
            adet=$(wc -l < "_lsf_${cift}.txt")
            echo "${cift}: ${adet} dosya"
            sed 's/^/  /' "_lsf_${cift}.txt"
            if [ "$adet" -lt 1 ]; then
              echo "::error::Drive'da poster yok: ${cift}"; eksik=1
            fi
          done
          rm -f _lsf_*.txt
          if [ "$eksik" -ne 0 ]; then
            echo "::error::poster on kontrolu basarisiz -> kosu durduruldu"; exit 1
          fi
      - name: Token + poster indirme
        env:
          POSTER_KOK: gdrive:ASTROLOVE/WALL_ART/POSTERS/ORIGINAL_HIGH_RES/MIDNIGHT_BLUE
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work/poster _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
          for cift in AQUARIUS_GEMINI ARIES_LEO AQUARIUS_CANCER AQUARIUS_ARIES \
                      SCORPIO_TAURUS AQUARIUS_CAPRICORN; do
            rclone copy "$POSTER_KOK" _work/poster --include "**/${cift}.jpg" -q
            adet=$(find _work/poster -iname "${cift}.jpg" | wc -l)
            if [ "$adet" -lt 1 ]; then
              echo "::error::poster indirilemedi (0 dosya): ${cift}"; exit 1
            fi
          done
          echo "poster dosyasi: $(find _work/poster -name '*.jpg' | wc -l)"
          find _work/poster -name '*.jpg' | head -20
      - name: 'Sablon uretimi (kuru deneme)'
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          set -euo pipefail
          python scripts/pod/pod_sablon_v4.py \
            --catalog scripts/etsy/seo/pod_changes_v2.json --out _out \
            --poster-kok _work/poster --ornek-ids "$ORNEK_IDS"
          boyut=$(stat -c%s _out/KARSILASTIRMA_V4.jpg)
          echo "KARSILASTIRMA_V4.jpg: $boyut bayt"
          [ "$boyut" -ge 200000 ] || { echo "::error::karsilastirma gorseli bos"; exit 1; }
      - name: Token geri yazma + cikti Drive'a
        if: ${{ always() }}
        run: |
          set -euo pipefail
          mkdir -p _out
          if [ -f _work/ETSY_TOKEN.json.updated ]; then
            rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json"
            echo "Token geri yazildi"
          fi
          rm -rf _out/_is
          if grep -rqE '"(access_token|refresh_token)"[[:space:]]*:[[:space:]]*"[A-Za-z0-9._-]{20,}"|x-api-key[[:space:]]*:[[:space:]]*[A-Za-z0-9_-]{16,}|GOCSPX-[A-Za-z0-9_-]{10,}' _out/ 2>/dev/null; then
            echo "::error::ciktida sir DEGERI bulundu, Drive'a yazilmadi"; exit 1
          fi
          rclone copy _out "gdrive:ASTROLOVE/TEMP/POD_REFERANS_ORNEK_V4" -q
          rclone lsf "gdrive:ASTROLOVE/TEMP/POD_REFERANS_ORNEK_V4"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: pod-sablon-v4
          path: _out/
          if-no-files-found: ignore
      - if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

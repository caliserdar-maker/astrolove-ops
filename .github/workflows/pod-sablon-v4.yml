name: pod-sablon-v4 (fiyat 30.99 -> 29.99)

# mod=kuru : 78 ilan salt okuma denetimi -> FIYAT_PLANI.csv (Drive POD_FIYAT_2999).
# mod=pilot: tek ilan yazma (confirm=FIYAT_2999). mod=toplu: kalan ilanlar.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      mod:
        description: "kuru | pilot | toplu | maliyet | dogrula | hpr | buyuk | yetki | yetki_test | yetki_degistir"
        default: "kuru"
      listing:
        description: "pilot icin ilan id"
        default: "4570110641"
      apply:
        description: "true = Etsy'ye yaz (pilot/toplu)"
        type: boolean
        default: false
      confirm:
        description: "apply=true icin tam olarak FIYAT_2999"
        default: ""
      limit:
        description: "kac ilan (0 = hepsi)"
        default: "0"
      kota_alt:
        description: "kota tabani (varsayilan 400)"
        default: "400"
      redirect:
        description: "yetki modlari icin kayitli redirect URI"
        default: "https://astrolove.art/oauth/callback"
      kod:
        description: "yetki_degistir: BOS BIRAK (kod Drive'daki ETSY_YETKI_KOD.txt'den okunur, loga girmez)"
        default: ""
      state:
        description: "yetki_degistir icin callback adresindeki state (PKCE ile karsilastirilir)"
        default: ""
      siparis_ref:
        description: "siparis_* : merchantReference = idempotencyKey"
        default: "etsy-1000000001-8x10"
      siparis_sku:
        description: "siparis_* : Prodigi SKU"
        default: "GLOBAL-HPR-8x10"
      siparis_adet:
        description: "siparis_* : adet"
        default: "1"
      siparis_dosya_id:
        description: "siparis_* : Drive baski dosyasi id"
        default: "1oEkU6eYEFxqd1tcS6DMcEnu43XFW38vp"
      siparis_remote:
        description: "siparis_* : Drive yolu (cift/edisyon/boy kaniti)"
        default: "gdrive:ASTROLOVE/TEMP/POD_PRINT/AQUARIUS_LIBRA/MIDNIGHT_BLUE/8x10.jpg"
      siparis_alici:
        description: "siparis_* : alici adi + adres (ad|adres1|sehir|eyalet|posta|ulke)"
        default: "MUSTERI_ADI|ADRES|SEHIR|NH|POSTAKODU|US"
      siparis_master:
        description: "siparis_* : icerik kaniti icin master"
        default: "gdrive:ASTROLOVE/WALL_ART/POSTERS/ORIGINAL_HIGH_RES/MIDNIGHT_BLUE/4X5/AQUARIUS_LIBRA.jpg"
      siparis_kontrol:
        description: "siparis_* : ayirt edicilik icin BASKA cift master"
        default: "gdrive:ASTROLOVE/WALL_ART/POSTERS/ORIGINAL_HIGH_RES/MIDNIGHT_BLUE/4X5/AQUARIUS_ARIES.jpg"

concurrency:
  group: etsy-token
  cancel-in-progress: false

jobs:
  fiyat:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      MOD: ${{ inputs.mod || 'kuru' }}
      APPLY: ${{ inputs.apply && 'true' || 'false' }}
      CONFIRM: ${{ inputs.confirm || '' }}
      LISTING: ${{ inputs.listing || '4570110641' }}
      LIMIT: ${{ inputs.limit || '0' }}
      KOTA_ALT: ${{ inputs.kota_alt || '400' }}
      REDIRECT: ${{ inputs.redirect || 'https://astrolove.art/oauth/callback' }}
      KOD: ${{ inputs.kod || '' }}
      STATE: ${{ inputs.state || '' }}
      SIPARIS_REF: ${{ inputs.siparis_ref || 'etsy-1000000001-8x10' }}
      SIPARIS_SKU: ${{ inputs.siparis_sku || 'GLOBAL-HPR-8x10' }}
      SIPARIS_ADET: ${{ inputs.siparis_adet || '1' }}
      SIPARIS_DOSYA_ID: ${{ inputs.siparis_dosya_id || '' }}
      SIPARIS_REMOTE: ${{ inputs.siparis_remote || '' }}
      SIPARIS_ALICI: ${{ inputs.siparis_alici || '' }}
      SIPARIS_MASTER: ${{ inputs.siparis_master }}
      SIPARIS_KONTROL: ${{ inputs.siparis_kontrol }}
    steps:
      - name: Onay kapisi
        run: |
          set -euo pipefail
          case "$MOD" in
            kuru|maliyet|dogrula|hpr|buyuk|yetki|yetki_test|pilot15_oku|siparis_hazirla|siparis_onizleme|siparis_izin_kapat)
              if [ "$APPLY" = "true" ]; then
                echo "::error::mod=$MOD ile yazma olmaz. DUR."; exit 1
              fi
              echo "SALT OKUMA: Etsy'ye yazma yok ($MOD)." ;;
            siparis_gonder)
              if [ "$APPLY" != "true" ] || [ "$CONFIRM" != "$SIPARIS_REF" ]; then
                echo "::error::siparis_gonder icin apply=true ve confirm '$SIPARIS_REF' olmali. DUR."; exit 1
              fi
              echo "::warning::CANLI PRODIGI SIPARISI: $SIPARIS_SKU x$SIPARIS_ADET, ref $SIPARIS_REF." ;;
            pilot15_yaz)
              if [ "$APPLY" != "true" ] || [ "$CONFIRM" != "PILOT_15" ]; then
                echo "::error::pilot15_yaz icin apply=true ve confirm 'PILOT_15' olmali. DUR."; exit 1
              fi
              echo "::warning::PILOT YAZMA: yalniz ilan $LISTING (envanter + Size Guide + aciklama)." ;;
            yetki_degistir)
              if [ "$CONFIRM" != "YETKI_DEGISTIR" ]; then
                echo "::error::yetki_degistir icin confirm 'YETKI_DEGISTIR' gerekir. DUR."; exit 1
              fi
              echo "::warning::YETKI DEGISIMI: ETSY_TOKEN.json yenilenir, eski zincir kapanir." ;;
            pilot|toplu)
              if [ "$APPLY" != "true" ] || [ "$CONFIRM" != "FIYAT_2999" ]; then
                echo "::error::pilot/toplu icin apply=true ve confirm 'FIYAT_2999' olmali. DUR."; exit 1
              fi
              echo "::warning::APPLY: 30.99 USD secenekler 29.99 olacak ($MOD)." ;;
            *) echo "::error::bilinmeyen mod: $MOD. DUR."; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          ref: pod-v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2 pillow==11.0.0 numpy==2.4.6
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Token
        if: ${{ inputs.mod != 'hpr' && inputs.mod != 'maliyet' && inputs.mod != 'buyuk' }}
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
      - name: 'Fiyat 30.99 -> 29.99'
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          set -euo pipefail
          if [ "$MOD" = "siparis_izin_kapat" ]; then
            python scripts/prodigi/manuel_siparis.py izin_kapat --file-id "$SIPARIS_DOSYA_ID" \
              --remote "$SIPARIS_REMOTE" --sku "$SIPARIS_SKU" --ref "$SIPARIS_REF" \
              --alici x --adres1 x --sehir x --posta x
          elif [ "$MOD" = "siparis_onizleme" ]; then
            python scripts/prodigi/manuel_siparis.py onizleme --file-id "$SIPARIS_DOSYA_ID" \
              --remote "$SIPARIS_REMOTE" --sku "$SIPARIS_SKU" --ref "$SIPARIS_REF" \
              --alici x --adres1 x --sehir x --posta x
          elif [ "$MOD" = "siparis_hazirla" ] || [ "$MOD" = "siparis_gonder" ]; then
            IFS='|' read -r S_AD S_ADR S_SEHIR S_EYALET S_POSTA S_ULKE <<< "$SIPARIS_ALICI"
            args=(--file-id "$SIPARIS_DOSYA_ID" --remote "$SIPARIS_REMOTE" --sku "$SIPARIS_SKU"
                  --adet "$SIPARIS_ADET" --ref "$SIPARIS_REF" --alici "$S_AD" --adres1 "$S_ADR"
                  --sehir "$S_SEHIR" --eyalet "$S_EYALET" --posta "$S_POSTA" --ulke "$S_ULKE"
                  --master "$SIPARIS_MASTER" --kontrol "$SIPARIS_KONTROL")
            if [ "$MOD" = "siparis_gonder" ]; then
              python scripts/prodigi/manuel_siparis.py gonder "${args[@]}" --confirm "$CONFIRM"
            else
              python scripts/prodigi/manuel_siparis.py hazirla "${args[@]}"
            fi
          elif [ "$MOD" = "pilot15_oku" ]; then
            python scripts/pod/pod_pilot_15.py oku --listing "$LISTING" --kota-alt "$KOTA_ALT"
          elif [ "$MOD" = "pilot15_yaz" ]; then
            python scripts/pod/pod_pilot_15.py yaz --listing "$LISTING" --kota-alt "$KOTA_ALT" --confirm "$CONFIRM"
          elif [ "$MOD" = "yetki" ]; then
            python scripts/etsy/etsy_yetki.py link --redirect "$REDIRECT"
          elif [ "$MOD" = "yetki_test" ]; then
            python scripts/etsy/etsy_yetki.py test
          elif [ "$MOD" = "yetki_degistir" ]; then
            python scripts/etsy/etsy_yetki.py degistir --redirect "$REDIRECT" --code "$KOD" --state "$STATE"
          elif [ "$MOD" = "buyuk" ]; then
            python scripts/prodigi/pod_hpr_buyuk_boy.py --is-dizin _work/buyuk
          elif [ "$MOD" = "hpr" ]; then
            python scripts/prodigi/pod_hpr_kucuk_boy.py --is-dizin _work/hpr
          elif [ "$MOD" = "dogrula" ]; then
            python scripts/pod/pod_fiyat_2999.py dogrula --limit "$LIMIT"
          elif [ "$MOD" = "maliyet" ]; then
            python scripts/prodigi/pod_maliyet_2999.py --out-dir _work/maliyet
          elif [ "$MOD" = "pilot" ]; then
            python scripts/pod/pod_fiyat_2999.py pilot --listing "$LISTING" --apply --confirm "$CONFIRM"
          elif [ "$MOD" = "toplu" ]; then
            python scripts/pod/pod_fiyat_2999.py toplu --apply --confirm "$CONFIRM" --limit "$LIMIT" --kota-alt "$KOTA_ALT"
          else
            python scripts/pod/pod_fiyat_2999.py kuru --limit "$LIMIT"
          fi
      - name: Token geri yazma
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ -f _work/ETSY_TOKEN.json.updated ]; then
            rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json"
            echo "Token geri yazildi"
          fi
      - if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

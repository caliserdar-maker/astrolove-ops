name: pod-sablon-v4 (V8 cikti yukleme)

# V8 ciktilarini Drive'a yukler (tek adim). Etsy cagrisi YOK.
# Kaynak: dalda _veri/v8_cikti/ ; hedef: ASTROLOVE/TEMP/POD_REFERANS_ORNEK_V8/

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  sablon:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pod-v4
      - run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Drive'a yukle
        run: |
          set -euo pipefail
          test -s _veri/v8_cikti/KARE_KARSILASTIRMA_V8.jpg
          rclone copy _veri/v8_cikti "gdrive:ASTROLOVE/TEMP/POD_REFERANS_ORNEK_V8" -q
          rclone lsf --format "sp" "gdrive:ASTROLOVE/TEMP/POD_REFERANS_ORNEK_V8"
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone

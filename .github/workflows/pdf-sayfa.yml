name: pdf-sayfa

# Goz kontrolu (Serdar 3 Eki, Test 6): siparis PDF'inin sayfalari TAM (1:1, yeniden kodlama yok) JPEG olarak
# Drive TEMP/SIPARIS_ISIM/DIJITAL/<receipt>/KONTROL/<RENK>_TAM/. Salt okur (PDF), Etsy / musteri YOK.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      receipt: {description: "receipt", required: true}
      renk: {description: "Warm_Parchment | Midnight_Blue | ...", required: true, default: "Warm_Parchment"}

jobs:
  sayfa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Girdi
        run: |
          jq -re '.inputs.receipt | test("^[0-9]+$")' "$GITHUB_EVENT_PATH" >/dev/null
          jq -re '.inputs.renk | test("^[A-Z][a-z]+_[A-Z][a-z]+$")' "$GITHUB_EVENT_PATH" >/dev/null
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pikepdf
      - run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Sayfalar
        run: |
          set -euo pipefail
          T0=$(date +%s)
          REC=$(jq -r '.inputs.receipt' "$GITHUB_EVENT_PATH"); R=$(jq -r '.inputs.renk' "$GITHUB_EVENT_PATH")
          H="gdrive:ASTROLOVE/TEMP/SIPARIS_ISIM/DIJITAL/$REC"
          rclone copy "$H" d --include "/AstroLoveArt_*_${R}.pdf"
          P=$(ls d/*.pdf | head -1); [ -n "$P" ] || { echo "HATA: PDF yok" >&2; exit 1; }
          U=$(echo "$R" | tr '[:lower:]' '[:upper:]')
          python scripts/siparis_dijital/pdf_sayfa.py "$P" out "$U"
          rclone copy out "$H/KONTROL/${U}_TAM/"
          rclone lsl "$H/KONTROL/${U}_TAM/"
          echo "SURE $(( $(date +%s) - T0 )) sn"
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone

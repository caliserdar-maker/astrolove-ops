name: drive-onizleme-kopya
# Tani icin: Drive ASTROLOVE/TEMP altindaki tek bir dosyayi poster-video-onizleme dalina kopyalar (SALT OKUMA; Drive'a ve
# Etsy'ye yazmaz). Ornek: KAPAK_P2_78_20261019/KAPAK/4570203229_LIBRA_TAURUS.jpg
permissions:
  contents: write   # yalniz poster-video-onizleme dalina
on:
  workflow_dispatch:
    inputs:
      yol:
        description: 'ASTROLOVE/TEMP altindaki dosya yolu'
        required: true
      klasor:
        description: 'onizleme dalindaki klasor'
        default: 'tani'
jobs:
  kopya:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: rclone + kopya
      env:
        RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        YOL: ${{ inputs.yol }}
        KL: ${{ inputs.klasor }}
      run: |
        set -euo pipefail
        case "$YOL" in *..*|/*|'') echo "::error::yol gecersiz"; exit 1 ;; esac
        case "$KL" in *[!A-Za-z0-9_]*|'') echo "::error::klasor gecersiz"; exit 1 ;; esac
        curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
        mkdir -p ~/.config/rclone; umask 077
        printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
        if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "::add-mask::$GOOGLE_CLIENT_SECRET"
          grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && export RCLONE_CONFIG_GDRIVE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET" || true; fi
        mkdir -p _k; rclone copyto "gdrive:ASTROLOVE/TEMP/$YOL" "_k/$(basename "$YOL")"
        rm -rf ~/.config/rclone
        B=poster-video-onizleme
        git config user.name "github-actions"; git config user.email "actions@github.com"
        git fetch -q origin $B && git worktree add -q _pvw origin/$B
        mkdir -p "_pvw/$KL"; cp _k/* "_pvw/$KL/"
        cd _pvw && git add -A && git commit -qm "drive onizleme kopya: $KL (kosu ${{ github.run_id }})" && git push -q origin HEAD:refs/heads/$B
        echo "::warning::ONIZLEME $B/$KL/$(basename "$YOL")"

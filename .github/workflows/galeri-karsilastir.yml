name: galeri-karsilastir
# Galeri ONCE / SONRA karsilastirmasi (78 poster; envanter + aciklama toplu yazimi kapak / galeri / renk bagi / videoya dokundu mu?).
# ETSY API YOK, token yok, kilit yok. Girdi: Drive TEMP/POSTER_GALERI_V11_YEDEK/<damga>/<lid>_<CIFT>/GALERI.json
# (galeri-v11-yedek-oku ciktisi; ONCE ornegi 20261030_170120). Kod scripts/kapak78/galeri_karsilastir.py.
# Cikti: Drive TEMP/GALERI_KARSILASTIR/<sonra_damga>_<run_id>/ (KARSILASTIR.csv, OZET.md), --immutable. Kosu FAIL = fark / eksik.
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      once_damga: {description: "ONCE: TEMP/POSTER_GALERI_V11_YEDEK/<damga> (YYYYMMDD_HHMMSS)", required: true}
      sonra_damga: {description: "SONRA: TEMP/POSTER_GALERI_V11_YEDEK/<damga> (YYYYMMDD_HHMMSS)", required: true}
jobs:
  karsilastir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Girdi kapisi
        env: {O: "${{ inputs.once_damga }}", S: "${{ inputs.sonra_damga }}"}
        run: |
          [[ "$O" =~ ^[0-9]{8}_[0-9]{6}$ ]] || { echo "::error::once_damga"; exit 1; }
          [[ "$S" =~ ^[0-9]{8}_[0-9]{6}$ ]] || { echo "::error::sonra_damga"; exit 1; }
          [ "$O" != "$S" ] || { echo "::error::once_damga = sonra_damga"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || { sudo apt-get install -y -qq rclone >/dev/null; }
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Indir + karsilastir (Etsy yok)
        env: {O: "${{ inputs.once_damga }}", S: "${{ inputs.sonra_damga }}"}
        run: |
          set -euo pipefail
          mkdir -p "_g/$O" "_g/$S" _out
          T="gdrive:ASTROLOVE/TEMP/POSTER_GALERI_V11_YEDEK"
          rclone copy "$T/$O" "_g/$O" --include "*/GALERI.json" --transfers 8 -q
          rclone copy "$T/$S" "_g/$S" --include "*/GALERI.json" --transfers 8 -q
          echo "GALERI.json once: $(find "_g/$O" -name GALERI.json | wc -l) sonra: $(find "_g/$S" -name GALERI.json | wc -l)"
          RC=0; python3 scripts/kapak78/galeri_karsilastir.py --once "_g/$O" --sonra "_g/$S" --out _out || RC=$?
          [ -f _out/OZET.md ] && head -20 _out/OZET.md >> "$GITHUB_STEP_SUMMARY" || true
          exit "$RC"
      - name: Drive'a yaz
        if: ${{ always() }}
        env: {S: "${{ inputs.sonra_damga }}"}
        run: |
          set -euo pipefail
          if ls _out/* >/dev/null 2>&1; then
            H="ASTROLOVE/TEMP/GALERI_KARSILASTIR/${S}_${GITHUB_RUN_ID}"
            rclone copy _out "gdrive:$H" --immutable -q
            echo "::notice title=GALERI KARSILASTIR::TEMP/GALERI_KARSILASTIR/${S}_${GITHUB_RUN_ID}/ ($(grep -m1 '^SONUC:' _out/OZET.md || echo 'SONUC yok'))"
          fi
      - if: always()
        run: rm -rf _g _out ~/.config/rclone

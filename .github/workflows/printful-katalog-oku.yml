name: printful-katalog-oku
# Printful katalog SALT OKUMA (Merkez 28 Eki madde 3, Serdar onayi): urun 19 White Glossy Mug olculeri (11 oz / 15 oz yukseklik, cap,
# hacim). Yalniz GET; siparis / mockup / yukleme yok, Etsy yok. Token Drive TEMP/PRINTFUL_TOKEN.json (maskeli, ciktiya yazilmaz).
# Cikti Drive TEMP/PRINTFUL_KATALOG/<damga>/ (OLCU.md + ham yanitlar). scripts/kupa_printful/katalog_olcu.py
on: workflow_dispatch
permissions:
  contents: read
jobs:
  oku:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: rclone
        timeout-minutes: 5
        run: curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || sudo apt-get install -y -qq rclone >/dev/null
      - name: rclone.conf + Printful token (maskeli)
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; export RCLONE_CONFIG_GDRIVE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET"; fi
          T=$(rclone cat "gdrive:ASTROLOVE/TEMP/PRINTFUL_TOKEN.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["api_token"].strip())')
          [ -n "$T" ] || { echo "HATA: PRINTFUL_TOKEN.json api_token bos"; exit 1; }
          echo "::add-mask::$T"
          echo "PRINTFUL_TOKEN=$T" >> "$GITHUB_ENV"
      - name: Katalog oku
        run: |
          set -o pipefail
          python3 -I scripts/kupa_printful/katalog_olcu.py _out 2>&1 | sed -u "s|${PRINTFUL_TOKEN}|***|g" | tee _log.txt
          echo "KOD=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
      - name: Drive'a yaz
        if: always()
        run: |
          set -uo pipefail
          [ -d _out ] || exit 1
          cp _log.txt _out/kosu_log.txt 2>/dev/null || true
          if [ -n "${PRINTFUL_TOKEN:-}" ] && grep -rlF "$PRINTFUL_TOKEN" _out; then echo "::error::ciktida token"; exit 1; fi
          D=$(date -u +%Y%m%d_%H%M%S)
          rclone copy _out "gdrive:ASTROLOVE/TEMP/PRINTFUL_KATALOG/$D" --immutable -q
          echo "Cikti: TEMP/PRINTFUL_KATALOG/$D" | tee -a "$GITHUB_STEP_SUMMARY"
          cat _out/OLCU.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          [ "${KOD:-1}" = 0 ]
      - if: always()
        run: rm -rf _out ~/.config/rclone

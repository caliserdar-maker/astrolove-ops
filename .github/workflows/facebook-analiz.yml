name: facebook-analiz
# Facebook anlik durum tespiti 19 Eki 2026 (SALT OKUMA). Metricool ve Facebook'a YAZMA / SILME / DEGISTIRME YOK; yalniz GET.
# scripts/sosyal/analiz/facebook.py: sayfa gunluk (1 Eki+), gonderi/Reel bazinda (12 Eki+), tur karsilastirmasi, plan/gercek (12 Eki+).
# Token: secret METRICOOL_USER_TOKEN (userId/blogId Drive METRICOOL_TOKEN.json'dan). Loga yazilmaz (::add-mask:: + sir_koru).
# Sir taramasini gecmeyen dosya _work'te kalir, Drive'a gitmez. Cikti: Drive ASTROLOVE/TEMP/SOSYAL_ANALIZ_20261019/FACEBOOK/.
# mod=degisim (20 Eki): scripts/sosyal/analiz/fb_degisim_envanter.py, bekleyen FB gonderileri + yeni kapak esleme (yalniz GET;
#   Drive'dan yalniz okuma) -> Drive ASTROLOVE/TEMP/SOSYAL_DEGISIM_20261020/FACEBOOK/ (ESLEME.csv, OZET.txt, KONTAK_REEL.jpg).
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      mod:
        description: "analiz (19 Eki tespit) | degisim (bekleyen FB gonderileri + yeni kapak esleme; cikti TEMP/SOSYAL_DEGISIM_20261020/FACEBOOK/)"
        default: analiz
jobs:
  oku:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      O: gdrive:ASTROLOVE/TEMP/SOSYAL_ANALIZ_20261019/FACEBOOK
    steps:
      - uses: actions/checkout@v4
      - name: rclone + token
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          mkdir -p ~/.config/rclone _work _out; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Analiz (yalniz GET)
        env:
          MC_TOK: ${{ secrets.METRICOOL_USER_TOKEN }}
        run: |
          set -uo pipefail
          umask 077
          [ -n "${MC_TOK:-}" ] || { echo "::error::METRICOOL_USER_TOKEN bos"; exit 1; }
          echo "::add-mask::$MC_TOK"
          rclone copyto "gdrive:ASTROLOVE/TEMP/METRICOOL_TOKEN.json" _work/kimlik.json
          python3 -c "import json,os;d=json.load(open('_work/kimlik.json'));json.dump({'userToken':os.environ['MC_TOK'],'userId':d['userId'],'blogId':d['blogId']},open('_work/mc.json','w'))"
          python3 -c "import json;print('::add-mask::'+json.load(open('_work/kimlik.json'))['userToken'])"
          if [ "${{ inputs.mod }}" = "degisim" ]; then
            O="gdrive:ASTROLOVE/TEMP/SOSYAL_DEGISIM_20261020/FACEBOOK"
            pip install -q pillow numpy >/dev/null 2>&1 || true
            T=gdrive:ASTROLOVE/TEMP; mkdir -p _work/dg
            P2A="$T/KAPAK_P2_78_20261019/BASLIK_A/KAPAK_A"; P2="$T/KAPAK_P2_78_20261019/KAPAK"; KUPA="$T/KUPA_KAPAK_78_20261019/KAPAK"
            Y1="$T/KAPAK_Y1_78_20261019/KAPAK"; YEDEK="$T/KAPAK_P2_78_20261019/YEDEK"; VK="$T/VIDEO_V9_20261012/KAPAK"
            for x in p2a:$P2A p2:$P2 kupa:$KUPA y1:$Y1 yedek:$YEDEK vk:$VK; do
              rclone lsjson "${x#*:}" --files-only --no-modtime > "_work/dg/${x%%:*}.json" || echo "[]" > "_work/dg/${x%%:*}.json"
            done
            BETIK="scripts/sosyal/analiz/fb_degisim_envanter.py _work/mc.json _out --pod78 data/pod/pod78_ids.csv --is _work/dg/is
              --ls-p2a _work/dg/p2a.json --ls-p2 _work/dg/p2.json --ls-kupa _work/dg/kupa.json --ls-y1 _work/dg/y1.json
              --ls-yedek _work/dg/yedek.json --ls-vkapak _work/dg/vk.json --kok-p2a $P2A --kok-p2 $P2 --kok-kupa $KUPA --kok-y1 $Y1
              --kok-yedek $YEDEK --kok-vkapak $VK"
          else BETIK="scripts/sosyal/analiz/facebook.py _work/mc.json _out"; fi
          python3 $BETIK | python3 scripts/guvenlik/sir_koru.py tee --sir-json _work/mc.json --sir-json _work/kimlik.json "$GITHUB_STEP_SUMMARY"
          rc=${PIPESTATUS[0]}
          mkdir -p _work/engel
          find _out -type f | while read -r f; do
            python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/mc.json --sir-json _work/kimlik.json "$f" >/dev/null 2>&1 \
              || { echo "TARAMA GECMEDI (Drive'a gitmez): $(basename "$f")"; mv "$f" _work/engel/; }
          done
          python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/mc.json --sir-json _work/kimlik.json _out || exit 1
          rclone copy _out "$O" -q
          rclone lsl "$O" | python3 scripts/guvenlik/sir_koru.py tee --sir-json _work/mc.json "$GITHUB_STEP_SUMMARY"
          exit $rc
      - if: always()
        run: |
          rm -rf _work ~/.config/rclone
          if [ -f "$RUNNER_TEMP/SIR_ENGEL" ]; then echo "::error::sir iceren satir engellendi (sir_koru)"; exit 1; fi

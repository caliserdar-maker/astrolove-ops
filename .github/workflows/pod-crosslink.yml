name: pod-crosslink

# POD ilanina dijital surum linkleri (Mo 7 Eyl 2026, ADIM 0: yalniz ARIES_LEO 4570031205).
# PLEASE NOTE / ОБРАТИТЕ ВНИМАНИЕ blogundaki "instant download" satiri kaldirilir, blogun ardina
# 5 renk + link iceren yeni bolum eklenir. Dijital ilan id'leri Etsy'den bulunur (tahmin yok);
# bir renk icin tam eslesme yoksa kosu DURUR. Diger bolumler birebir korunur (bolum bolum kontrol).
# Tek kosuda ADIM 1 dry-run (diff) -> temizse ADIM 2 apply.

on:
  workflow_dispatch:
    inputs:
      listing_id:
        description: "Tek ilan id (bos = STATE'teki tum ilanlar)"
        required: false
        default: ""
      pair:
        description: "Tek ilan icin cift adi"
        required: false
        default: ""
      limit:
        description: "En fazla N ilan (0 = hepsi)"
        required: false
        default: "0"
      apply:
        description: "true = dry-run temizse Etsy'ye YAZ"
        type: boolean
        default: true
      quota_min:
        description: "Kota tabani"
        required: false
        default: "400"

concurrency:
  group: etsy-token
  cancel-in-progress: false

jobs:
  crosslink:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LID: ${{ inputs.listing_id }}
      PAIR: ${{ inputs.pair }}
      LIMIT: ${{ inputs.limit || '0' }}
      QMIN: ${{ inputs.quota_min || '400' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
      - name: Token ve STATE
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
          rclone copyto "gdrive:ASTROLOVE/TEMP/POD_LISTING/POD_LISTINGS_STATE.csv" _work/state.csv
          if [ -n "${LID:-}" ]; then echo "ARGS=--listing-id $LID --pair $PAIR" >> "$GITHUB_ENV";
          else echo "ARGS=--state _work/state.csv --limit ${LIMIT:-0}" >> "$GITHUB_ENV"; fi
          echo "verified ilan: $(grep -c ',verified,' _work/state.csv || true)"
      - name: 'ADIM 1 - dry-run (dijital id kesfi + diff)'
        id: dry
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          set -euo pipefail
          python scripts/etsy/pod_crosslink.py $ARGS --out _out/dry --quota-min "$QMIN" --dry-run
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: 'ADIM 2 - apply (yalniz dry-run temizse)'
        if: ${{ inputs.apply && steps.dry.outputs.ok == 'true' }}
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          set -euo pipefail
          echo "::warning::APPLY: aciklamalar (EN+RU) guncellenecek ($ARGS)"
          python scripts/etsy/pod_crosslink.py $ARGS --out _out/apply --quota-min "$QMIN" --apply
      - name: Token/cikti Drive'a
        if: ${{ always() }}
        run: |
          set -euo pipefail
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "Token geri yazildi" || true
          stamp=$(TZ=Europe/Istanbul date +%Y%m%d_%H%M)
          [ -d _out ] && rclone copy _out "gdrive:ASTROLOVE/TEMP/POD_LISTING/CROSSLINK_${stamp}" -q && echo "Cikti: TEMP/POD_LISTING/CROSSLINK_${stamp}/"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: pod-crosslink
          path: _out/
          if-no-files-found: ignore
      - if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

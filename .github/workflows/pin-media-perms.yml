name: pin-media-perms

# Drive klasor agacinda "anyone" (linki olan herkes) iznini duzenler.
#   mode=fix    : agactaki anyone iznini READER'a ceker (PIN_MEDIA icin; B88'de
#                 writer kalmisti). Miras izinde sinirli erisim kullanir.
#   mode=remove : agactaki anyone iznini TAMAMEN kaldirir (klasor ozel olur);
#                 keep_id altindaki agaca dokunmaz ve onun anyone:reader
#                 izninin mirastan bagimsiz kaldigini dogrular.
# Varsayilan dry-run (yalniz rapor); apply=true ile uygular ve 3 rastgele
# dosyayi yeniden okuyup dogrular; remove modunda ayrica keep agacindan bir
# dosyanin webContentLink'ini anonim HTTP ile cekip erisimi dogrular.
# Drive REST API'ye rclone.conf'taki token ile gidilir; token maskelenir.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "fix (reader'a cek) | remove (anyone iznini kaldir)"
        type: choice
        options: [fix, remove]
        default: fix
      apply:
        description: "Degisiklikleri uygula (false = dry-run)"
        type: boolean
        default: false
      folder_id:
        description: "Hedef klasor ID (bos = PIN_MEDIA)"
        required: false
        default: ""
      keep_id:
        description: "remove modunda korunacak alt agac ID (bos = PIN_MEDIA)"
        required: false
        default: ""
      scan:
        description: "remove: kok altinda dogrudan anyone izinlerini tara (yalniz rapor; agir sorgu)"
        type: boolean
        default: false

concurrency:
  group: drive-perms
  cancel-in-progress: false

jobs:
  perms:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklar
        run: |
          set -euo pipefail
          pip install -q requests==2.34.2

      - name: rclone kur
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          rclone version | head -1

      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONF_B64:-}" ]; then
            echo "HATA: RCLONE_CONF_B64 secret'i tanimli degil." >&2
            exit 1
          fi
          mkdir -p ~/.config/rclone
          umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Izinleri duzenle
        run: |
          set -euo pipefail
          args=(--mode "${{ inputs.mode }}")
          [ "${{ inputs.apply }}" = "true" ] && args+=(--apply)
          [ -n "${{ inputs.folder_id }}" ] && args+=(--folder-id "${{ inputs.folder_id }}")
          [ -n "${{ inputs.keep_id }}" ] && args+=(--keep-id "${{ inputs.keep_id }}")
          [ "${{ inputs.scan }}" = "true" ] && args+=(--scan)
          python scripts/pinterest/pin_media_perms.py "${args[@]}"

name: pod-listing-create

# POD (Prodigi poster) YENI ILAN: createDraftListing + 10 gorsel + Color(5)xSize(13)
# varyant + renk secenegine edisyon 01 karesi. Metin docs/POD_LISTING_TEMPLATE.md,
# fiyat scripts/etsy/pod_prices.csv, gorseller Drive TEMP/POD_GALLERY/<PAIR>/<ED>/ (Mo onayi 6 Eyl).
# dry_run=true (varsayilan) YALNIZ OKUR: kesif tablosu + payload JSON.
# dry_run=false ETSY'YE YAZAR (kargo profili/bolum olusturma dahil) - yalnizca Mo onayi.
# STATE: Drive TEMP/POD_LISTING/POD_LISTINGS_STATE.csv (resume).

on:
  workflow_dispatch:
    inputs:
      pairs:
        description: "Virgullu cift listesi (or. ARIES_LEO) ya da ALL (TEMP/WA_WP_DRAFTS_STATE.csv'deki 78 cift)"
        required: true
        default: "ARIES_LEO"
      limit:
        description: "En fazla N cift (0 = hepsi)"
        required: false
        default: "0"
      dry_run:
        description: "true = yalniz raporla; false = Etsy'ye YAZ (onay gerekir)"
        type: boolean
        default: true
      primary:
        description: "Ana edisyon (6 kare buradan)"
        type: choice
        options: [MIDNIGHT_BLUE, DEEP_BLACK, WARM_PARCHMENT, CHAMPAGNE_IVORY, PURE_WHITE]
        default: MIDNIGHT_BLUE
      origin_postal_code:
        description: "Kargo profili cikis posta kodu (Mo 6 Eyl: 28216 Prodigi Charlotte)"
        required: false
        default: "28216"
      quota_min:
        description: "Etsy gunluk kota tabani; altinda yazma yok (varsayilan 400)"
        required: false
        default: "400"
      return_policy_id:
        description: "Iade politikasi id (bos = magazada tek politika varsa o)"
        required: false
        default: ""
      return_policy_spec:
        description: "Magazada iade politikasi YOKSA apply'da olusturulur (Mo 6 Eyl: iade/degisim yok; bos = olusturma)"
        required: false
        default: "returns=0,exchanges=0"

concurrency:
  group: etsy-token
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bagimliliklar
        run: |
          set -euo pipefail
          pip install -q requests==2.34.2 spylls
          mkdir -p dict
          curl -fsSL -o dict/ru_RU.dic https://raw.githubusercontent.com/LibreOffice/dictionaries/master/ru_RU/ru_RU.dic
          curl -fsSL -o dict/ru_RU.aff https://raw.githubusercontent.com/LibreOffice/dictionaries/master/ru_RU/ru_RU.aff

      - name: rclone kur
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          rclone version | head -1

      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone
          umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          # Yeni OAuth istemcisinin secret'i conf'daki degeri ezer (rclone env override).
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
          fi

      - name: Token, STATE ve cift listesini Drive'dan al
        env:
          PAIRS: ${{ inputs.pairs }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p _work _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
          test -s _work/ETSY_TOKEN.json
          rclone copyto "gdrive:ASTROLOVE/TEMP/POD_LISTING/POD_LISTINGS_STATE.csv" _work/state.csv 2>/dev/null || echo "STATE yok; yeni baslar"
          if [ "$PAIRS" = "ALL" ]; then
            rclone copyto "gdrive:ASTROLOVE/TEMP/WA_WP_DRAFTS_STATE.csv" _work/wp_state.csv
            cut -d, -f1 _work/wp_state.csv | grep -E '^[A-Za-z]+_[A-Za-z]+$' | tr a-z A-Z | sort -u > _work/pairs.txt
          else
            echo "$PAIRS" | tr ',' '\n' | sed 's/ //g' | grep -v '^$' | tr a-z A-Z > _work/pairs.txt
          fi
          echo "cift: $(wc -l < _work/pairs.txt)"

      - name: Gorselleri indir (TEMP/POD_GALLERY/<PAIR>)
        env:
          LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          n=0
          while read -r pair; do
            [ -z "$pair" ] && continue
            if [ -f _work/state.csv ] && grep -q "^$pair,[0-9]*,verified," _work/state.csv; then
              echo "$pair: verified, atlandi"; continue
            fi
            n=$((n+1)); if [ "${LIMIT:-0}" != "0" ] && [ "$n" -gt "$LIMIT" ]; then break; fi
            rclone copy "gdrive:ASTROLOVE/TEMP/POD_GALLERY/$pair" "img/$pair" --include "*/0[1-9]_*.jpg" --include "*/10_*.jpg" --transfers 8 -q || true
            echo "$pair: $(find img/$pair -name '*.jpg' 2>/dev/null | wc -l) gorsel"
          done < _work/pairs.txt

      - name: Ilanlari olustur
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          DRY_RUN: ${{ inputs.dry_run }}
          LIMIT: ${{ inputs.limit }}
          PRIMARY: ${{ inputs.primary }}
          RPID: ${{ inputs.return_policy_id }}
          RPSPEC: ${{ inputs.return_policy_spec }}
          QMIN: ${{ inputs.quota_min }}
          OZIP: ${{ inputs.origin_postal_code }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            mode=--dry-run
          else
            echo "::warning::APPLY modu: Etsy'ye ilan yazilacak."
            mode=--apply
          fi
          args=(--pairs-file _work/pairs.txt --limit "${LIMIT:-0}" --images img --state _work/state.csv --out _out --primary "$PRIMARY" --quota-min "${QMIN:-400}" --origin-postal-code "${OZIP:-28216}" --ru-dict dict/ru_RU "$mode")
          [ -n "${RPID:-}" ] && args+=(--return-policy-id "$RPID")
          [ -n "${RPSPEC:-}" ] && args+=(--return-policy-spec "$RPSPEC")
          python scripts/etsy/pod_listing_create.py "${args[@]}"

      - name: Yenilenen token'i Drive'a geri yaz
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ -f _work/ETSY_TOKEN.json.updated ]; then
            rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json"
            echo "Token dosyasi Drive'a geri yazildi."
          else
            echo "Token yenilenmedi; geri yazma yok."
          fi

      - name: STATE ve ciktilari Drive'a yaz
        if: ${{ always() }}
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" != "true" ] && [ -s _work/state.csv ]; then
            rclone copyto _work/state.csv "gdrive:ASTROLOVE/TEMP/POD_LISTING/POD_LISTINGS_STATE.csv"
            echo "STATE Drive'a yazildi."
          fi
          mode=$([ "$DRY_RUN" = "true" ] && echo DRYRUN || echo APPLY)
          stamp=$(TZ=Europe/Istanbul date +%Y%m%d_%H%M)
          [ -d _out ] && rclone copy _out "gdrive:ASTROLOVE/TEMP/POD_LISTING/${mode}_${stamp}" -q && echo "Cikti: TEMP/POD_LISTING/${mode}_${stamp}/"

      - name: Artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pod-listing-create
          path: |
            _out/
            _work/state.csv
          if-no-files-found: ignore
          retention-days: 30

      - name: Temizlik
        if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

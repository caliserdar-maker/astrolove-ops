name: tt-yt-bekleyen
# Bekleyen TikTok + YouTube Shorts video gonderileri envanteri, 20 Eki 2026 (SALT OKUMA). Metricool'a / aglara YAZMA YOK; yalniz GET.
# scripts/sosyal/analiz/tt_yt_bekleyen.py: scheduler simdi+, cift, acilis olcumu (ffmpeg URL'den ilk 1.5 sn, ig_bekleyen yontemi),
# yeni video adayi Drive TEMP/SOSYAL_VIDEO_P_78_20261020/ (Drive'dan yalniz okuma). Cikti TEMP/SOSYAL_DEGISIM_20261020/TIKTOK_YOUTUBE/.
# Token: secret METRICOOL_USER_TOKEN; loga yazilmaz (::add-mask:: + sir_koru).
permissions:
  contents: read
on:
  workflow_dispatch:
jobs:
  oku:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      O: gdrive:ASTROLOVE/TEMP/SOSYAL_DEGISIM_20261020/TIKTOK_YOUTUBE
    steps:
      - uses: actions/checkout@v4
      - name: Paketler
        run: |
          python3 -c "import numpy, PIL" 2>/dev/null || pip install -q numpy==2.1.3 pillow==11.0.0
          command -v ffprobe >/dev/null || { sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq ffmpeg >/dev/null; }
          ffprobe -version | head -1
      - name: rclone + token
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          mkdir -p ~/.config/rclone _work _out; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Analiz (yalniz GET)
        env:
          MC_TOK: ${{ secrets.METRICOOL_USER_TOKEN }}
        run: |
          set -uo pipefail
          umask 077
          [ -n "${MC_TOK:-}" ] || { echo "::error::METRICOOL_USER_TOKEN bos"; exit 1; }
          echo "::add-mask::$MC_TOK"
          rclone copyto "gdrive:ASTROLOVE/TEMP/METRICOOL_TOKEN.json" _work/kimlik.json
          python3 -c "import json,os;d=json.load(open('_work/kimlik.json'));json.dump({'userToken':os.environ['MC_TOK'],'userId':d['userId'],'blogId':d['blogId']},open('_work/mc.json','w'))"
          python3 -c "import json;print('::add-mask::'+json.load(open('_work/kimlik.json'))['userToken'])"
          mkdir -p _work/aday/video
          rclone lsf "gdrive:ASTROLOVE/TEMP/SOSYAL_VIDEO_P_78_20261020" --include "*.mp4" > _work/aday/VIDEO_P.txt || true
          echo "aday mp4: $(wc -l < _work/aday/VIDEO_P.txt)"
          rclone copy "gdrive:ASTROLOVE/TEMP/SOSYAL_VIDEO_P_78_20261020" _work/aday/video --include "*.mp4" --transfers 8 -q || echo "aday kopyalanamadi"
          python3 scripts/sosyal/analiz/tt_yt_bekleyen.py _work/mc.json _out _work/aday | python3 scripts/guvenlik/sir_koru.py tee --sir-json _work/mc.json --sir-json _work/kimlik.json "$GITHUB_STEP_SUMMARY"
          rc=${PIPESTATUS[0]}
          mkdir -p _work/engel
          for f in _out/*; do
            python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/mc.json --sir-json _work/kimlik.json "$f" >/dev/null 2>&1 \
              || { echo "TARAMA GECMEDI (Drive'a gitmez): $(basename "$f")"; mv "$f" _work/engel/; }
          done
          python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/mc.json --sir-json _work/kimlik.json _out || exit 1
          rclone copy _out "$O" -q
          rclone lsl "$O" | python3 scripts/guvenlik/sir_koru.py tee --sir-json _work/mc.json "$GITHUB_STEP_SUMMARY"
          exit $rc
      - if: always()
        run: |
          rm -rf _work ~/.config/rclone
          if [ -f "$RUNNER_TEMP/SIR_ENGEL" ]; then echo "::error::sir iceren satir engellendi (sir_koru)"; exit 1; fi

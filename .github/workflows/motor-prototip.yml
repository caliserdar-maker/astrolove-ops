name: motor-prototip

# Motor prototipi (3 Eki 2026, Serdar onayi): SCORPIO_VIRGO MAXWELL / QUINN WARM_PARCHMENT 11x14, katmanlardan.
# Deneme 2: bakir = eski sistem wp_bakir rengi ve dokusu (sabitler 'bakir', motor/bakir_olc.py, Test 5 olcumu).
# Yalniz motor dalinda push ile (main'e merge YOK). Kaynaklar: inceleme/motor-kaynak dali (Drive'dan birebir,
# MANIFEST sha). Cikti Drive TEMP/MOTOR/PROTOTIP/<kosu>/ (yalniz yazma bu klasore). Etsy YOK, musteri YOK.

on:
  push:
    branches: [motor]
    paths: [motor/prototip.trigger]

permissions:
  contents: read

jobs:
  prototip:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Kaynak paketi (inceleme/motor-kaynak)
        run: |
          set -euo pipefail
          git fetch -q --depth 1 origin inceleme/motor-kaynak
          git worktree add -q _k FETCH_HEAD
          cd _k && git log -1 --format='kaynak %H' && cat KAYNAK.txt
          python3 - <<'EOF'
          import hashlib
          for s in open('MANIFEST.txt'):
              p, n, h = s.rstrip('\n').split('\t')
              assert hashlib.sha256(open(p, 'rb').read()).hexdigest() == h, p
          print('MANIFEST sha: TAMAM')
          EOF
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q numpy pillow opencv-python-headless pymupdf
          sudo apt-get install -y -q tesseract-ocr >/dev/null
          tesseract --version | head -1
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: Motor + QC + karsilastirma
        env:
          ISIM1: MAXWELL
          ISIM2: QUINN
          MESAJ: "Written in the Stars, Always Yours"
        run: |
          set -euo pipefail
          S=motor/sabitler/SCORPIO_VIRGO_WP_11x14.json; O=_cikti; mkdir -p $O
          echo "kod $(git rev-parse HEAD)"
          python3 motor/motor.py --kaynak _k --sabit $S --isim1 "$ISIM1" --isim2 "$ISIM2" --mesaj "$MESAJ" --cikti $O
          python3 motor/qc.py --kaynak _k --sabit $S --motor $O/MOTOR.png --isim1 "$ISIM1" --isim2 "$ISIM2" --mesaj "$MESAJ" --cikti $O/QC.json
          python3 motor/karsilastir.py --orijinal _k/orijinal_WP_11x14.jpg --eski _k/test5_WP_11x14.jpeg --motor $O/MOTOR.png --cikti $O/YANYANA_TAM_SAYFA.png --jpg $O/YANYANA_TAM_SAYFA.jpg
          cd $O
          mv MOTOR.png PROTOTIP_SCORPIO_VIRGO_WP_11x14.png; mv MOTOR.pdf PROTOTIP_SCORPIO_VIRGO_WP_11x14.pdf
          mv QC.md OLCUM.md; rm -f _beklenen_maske.npy
          cp ../motor/varlik/plates/VINTAGE_B3_11x14_temiz.json ZEMIN_TEMIZ.json
          { echo "kod (motor dali): $(git rev-parse HEAD)"; echo "kaynak (inceleme/motor-kaynak): $(git -C ../_k rev-parse HEAD)";
            echo "kosu: ${{ github.run_id }}"; sha256sum PROTOTIP_* YANYANA_TAM_SAYFA.*; ls -l YANYANA_TAM_SAYFA.jpg; } > KOSU.txt
          cat KOSU.txt OLCUM.md
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Drive'a yukle (TEMP/MOTOR/PROTOTIP/<kosu>)
        run: |
          set -euo pipefail
          D="gdrive:ASTROLOVE/TEMP/MOTOR/PROTOTIP/${{ github.run_id }}"
          rclone copy _cikti "$D"
          rclone lsl "$D"
      - if: always()
        run: rm -rf ~/.config/rclone

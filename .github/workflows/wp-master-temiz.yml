name: wp-master-temiz

# MASTER'DAKI GOMULU WP DOKUSU - 5 Eyl 2026 (Mo).
# 1) TEYIT: SET03/3 ve SET04/1 koyu edisyonla (MB) uretilir; koseler kirpilir,
#    maske∩quad disindaki seridin L'si olculur.
# 2) KAYNAK: WA_SET/03_FIVE_COLOR_EDITIONS.jpg master ile ayni sahne mi.
# 3) TEMIZ MASTER: serit cerceve rengiyle doldurulur (kopya), SET03/SET04
#    yeniden uretilir. Uretim calib/master/MOCKUP_V2/DELIVERY/Etsy DEGISMEZ.

on:
  workflow_dispatch:
    inputs:
      pair:
        description: "Cift"
        required: true
        default: "Aries_Aries"
      bant:
        description: "Temizlik seridi (px)"
        required: true
        default: "14"

concurrency:
  group: wp-master-temiz
  cancel-in-progress: false

jobs:
  temiz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null

      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi

      - name: Girdiler
        run: |
          set -euo pipefail
          P="${{ inputs.pair }}"; UP=$(echo "$P" | tr '[:lower:]' '[:upper:]')
          mkdir -p _work/c0 _work/cmb/masks _work/masters _work/pilot _work/wp _work/son _work/kaynak
          rclone copy "gdrive:ASTROLOVE/WALLPAPER/MOCKUP_V2/_CALIB" _work/c0 --include "calib.json" --include "masks/*.png"
          cp -r _work/c0/masks/. _work/cmb/masks/
          rclone copy "gdrive:ASTROLOVE/WALLPAPER/MOCKUP_V2/CANCER_LIBRA" _work/masters --include "*_FINAL.jpg"
          rclone copy "gdrive:ASTROLOVE/ARCHIVE/FINAL_V2_PILOT_V1" _work/pilot --include "AstroLove_*.jpg"
          test "$(ls _work/pilot | wc -l)" = "16"
          rclone copy "gdrive:ASTROLOVE/WALLPAPER/FINAL_V2/$UP" _work/wp --include "AstroLove_*.jpg"
          rclone copyto "gdrive:ASTROLOVE/WALLPAPER/WA_SET/03_FIVE_COLOR_EDITIONS.jpg" _work/kaynak/WA_SET_03.jpg || true
          rclone copyto "gdrive:ASTROLOVE/WALLPAPER/WA_SET_FINAL/SET_03_CANCER_LIBRA.jpg" _work/kaynak/WA_SET_FINAL_03.jpg || true

      - name: 1) Koyu edisyon teyidi
        run: |
          set +e
          set -uo pipefail
          P="${{ inputs.pair }}"
          echo "=== 1) KOYU EDISYON TEYIDI ===" | tee _work/rapor.txt
          python scripts/etsy/wp_calib_edit.py --calib-json _work/c0/calib.json \
            --set "SET03:3:edition=Midnight_Blue" --set "SET03:3:mode=paste" \
            --set "SET04:1:edition=Midnight_Blue" --set "SET04:1:mode=paste" \
            --out _work/cmb/calib.json | tee -a _work/rapor.txt
          mkdir -p _work/out_mb
          python scripts/etsy/wp_mockup_render.py --calib _work/cmb --masters _work/masters \
            --pilot _work/pilot --wallpapers _work/wp --pair "$P" --scenes SET03,SET04 \
            --out _work/out_mb 2>&1 | grep -v '^ *"' | tee -a _work/rapor.txt
          echo "render koyu cikis kodu: ${PIPESTATUS[0]}" | tee -a _work/rapor.txt
          python scripts/etsy/wp_koyu_teyit.py --calib _work/cmb --render-dir _work/out_mb --pair "$P" \
            --ekran SET03:3 --ekran SET04:1 --out-dir _work/son | tee -a _work/rapor.txt
          cp "_work/out_mb/WA_MOCKUP_V2_SET03_${P}_FINAL.jpg" "_work/son/WA_MOCKUP_V2_SET03_${P}_KOYU.jpg"
          cp "_work/out_mb/WA_MOCKUP_V2_SET04_${P}_FINAL.jpg" "_work/son/WA_MOCKUP_V2_SET04_${P}_KOYU.jpg"

      - name: 2) Kaynak sahne master ile ayni mi
        run: |
          set -euo pipefail
          cat > _kaynak.py <<'PY'
          import cv2, numpy as np
          m = cv2.imread("_work/masters/WA_MOCKUP_V2_SET03_Cancer_Libra_FINAL.jpg")
          for ad in ("WA_SET_03", "WA_SET_FINAL_03"):
              k = cv2.imread(f"_work/kaynak/{ad}.jpg")
              if k is None:
                  print(f"  {ad}: yok"); continue
              h, w = k.shape[:2]
              kk = cv2.resize(k, (m.shape[1], m.shape[0]), interpolation=cv2.INTER_AREA)
              d = np.abs(kk.astype(np.float32) - m.astype(np.float32)).mean()
              print(f"  {ad}: {w}x{h}, master ile ortalama fark {d:.2f}")
          PY
          echo "=== 2) KAYNAK SAHNE ===" | tee -a _work/rapor.txt
          python _kaynak.py | tee -a _work/rapor.txt

      - name: 3) Temiz master + render
        run: |
          set +e
          set -uo pipefail
          P="${{ inputs.pair }}"
          mkdir -p _work/masters_temiz _work/out_temiz
          cp _work/masters/*.jpg _work/masters_temiz/
          echo "=== 3) TEMIZ MASTER ===" | tee -a _work/rapor.txt
          python scripts/etsy/wp_master_temizle.py --calib _work/c0 --masters _work/masters \
            --scenes SET03,SET04 --bant "${{ inputs.bant }}" --out-dir _work/masters_temiz | tee -a _work/rapor.txt
          python scripts/etsy/wp_mockup_render.py --calib _work/c0 --masters _work/masters_temiz \
            --pilot _work/pilot --wallpapers _work/wp --pair "$P" --scenes SET03,SET04 \
            --out _work/out_temiz 2>&1 | grep -v '^ *"' | tee -a _work/rapor.txt
          echo "render temiz cikis kodu: ${PIPESTATUS[0]}" | tee -a _work/rapor.txt
          cp "_work/out_temiz/WA_MOCKUP_V2_SET03_${P}_FINAL.jpg" "_work/son/WA_MOCKUP_V2_SET03_${P}_TEMIZ.jpg"
          cp "_work/out_temiz/WA_MOCKUP_V2_SET04_${P}_FINAL.jpg" "_work/son/WA_MOCKUP_V2_SET04_${P}_TEMIZ.jpg"
          cp _work/masters_temiz/WA_MOCKUP_V2_SET03_Cancer_Libra_FINAL.jpg _work/son/MASTER_TEMIZ_SET03.jpg
          cp _work/masters_temiz/WA_MOCKUP_V2_SET04_Cancer_Libra_FINAL.jpg _work/son/MASTER_TEMIZ_SET04.jpg
          ls -l _work/son

      - name: Drive'a yaz + anyone:reader
        if: ${{ always() }}
        run: |
          set -euo pipefail
          rclone mkdir "gdrive:ASTROLOVE/TEMP/FIX_TEST/MASTER_TEMIZ"
          rclone copy _work/son "gdrive:ASTROLOVE/TEMP/FIX_TEST/MASTER_TEMIZ" --include "*.jpg" || true
          [ -f _work/rapor.txt ] && rclone copyto _work/rapor.txt "gdrive:ASTROLOVE/TEMP/WP_MASTER_TEMIZ.txt" || true
          cat > _fid.py <<'PY'
          import json, sys
          print([r["ID"] for r in json.load(sys.stdin) if r["Name"] == sys.argv[1]][0])
          PY
          fid="$(rclone lsjson "gdrive:ASTROLOVE/TEMP/FIX_TEST" --dirs-only | python3 _fid.py MASTER_TEMIZ)"
          : > _work/linkler.txt
          for PAT in "WA_MOCKUP_V2_" "M16_" "MASTER_TEMIZ_"; do
            python scripts/pinterest/pin_media_perms.py --mode grant --folder-id "$fid" --pattern "$PAT" --apply \
              | grep -v '^::add-mask::' | tee -a _work/linkler.txt
          done
          rclone copyto _work/linkler.txt "gdrive:ASTROLOVE/TEMP/WP_MASTER_TEMIZ_LINKLER.txt" || true

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: wp-master-temiz
          path: |
            _work/rapor.txt
            _work/linkler.txt
          if-no-files-found: ignore

      - name: Temizlik
        if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone _fid.py _kaynak.py

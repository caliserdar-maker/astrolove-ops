          echo 'sayfa_var=1' >> "$GITHUB_OUTPUT"
          echo 'wp=["A2","16x20"]' >> "$GITHUB_OUTPUT"
          echo 'cift=PISCES_VIRGO' >> "$GITHUB_OUTPUT"
          echo 'normalize={"yapildi": false, "girdi": "PISCES_VIRGO", "cift": "PISCES_VIRGO"}' >> "$GITHUB_OUTPUT"
          echo 'yol=eski' >> "$GITHUB_OUTPUT"
      - name: ayni is adim ciktisi
        run: |

name: kupa-pin-78
# Kupa pini x78, S3 kurali (Serdar onayi 20 Eki 2026). Yayinlama yok: astrolove-media / Metricool / Etsy yazma yok.
# Girdi: Drive KUPA_KAPAK_78_20261019/KAPAK (V4 kapaklar), kupa-orchard varlik (8 sahne + Cinzel), kupa-printful-sonuc
# kupa_uretim/sembol (glif sablonlari, yalniz okunur). Cikti: Drive ASTROLOVE/TEMP/KUPA_PIN_78_20261020/
# (PIN_KUPA_<CIFT>.jpg x78, KONTAK_1..n.jpg, KONTROL.csv, OZET.txt). ciftler bos = 78; duzeltme turunda yalniz FAIL ciftler.
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      ciftler:
        description: "bos = 78 cift; ornek 'CANCER_LIBRA LEO_LEO' (duzeltme turu)"
        default: ""
jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      O: gdrive:ASTROLOVE/TEMP/KUPA_PIN_78_20261020
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: kupa-orchard
          path: _ko
          sparse-checkout: kupa_orchard/varlik
      - uses: actions/checkout@v4
        with:
          ref: kupa-printful-sonuc
          path: _ps
          sparse-checkout: kupa_uretim/sembol
      - name: rclone
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          mkdir -p ~/.config/rclone _work/KAPAK _out; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Uret + kapilar
        env:
          CIFTLER: ${{ inputs.ciftler }}
        run: |
          set -uo pipefail
          pip install -q pillow numpy >/dev/null 2>&1
          rclone copy "gdrive:ASTROLOVE/TEMP/KUPA_KAPAK_78_20261019/KAPAK" _work/KAPAK --include "*.jpg" --transfers 8 -q
          n=$(ls _work/KAPAK/*.jpg | wc -l); echo "kapak $n"
          if [ -z "$CIFTLER" ] && [ "$n" != 78 ]; then echo "::error::kapak sayisi $n (78 bekleniyor)"; exit 1; fi
          ARG=""; [ -n "$CIFTLER" ] && ARG="--ciftler $CIFTLER"
          python3 scripts/sosyal/kupa_pin_78.py --kapak _work/KAPAK --sahne _ko/kupa_orchard/varlik/sahne \
            --font "_ko/kupa_orchard/varlik/font/Cinzel[wght].ttf" --sembol _ps/kupa_uretim/sembol --cikti _out --is 4 $ARG \
            | tee -a "$GITHUB_STEP_SUMMARY"
          rc=${PIPESTATUS[0]}
          D="$O"; [ -n "$CIFTLER" ] && D="$O/DUZELTME"
          rclone copy _out/PIN "$D" --transfers 8 -q
          rclone copy _out "$D" --exclude "PIN/**" -q
          echo "Drive: $(rclone lsf "$D" --files-only | wc -l) dosya"
          exit $rc
      - if: always()
        run: rm -rf _work ~/.config/rclone

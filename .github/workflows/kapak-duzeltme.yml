name: kapak-duzeltme

# POD_KAPAK_78 duzeltme: AQUARIUS_LIBRA + ARIES_LIBRA + CAPRICORN_LIBRA. Etsy YOK.
# Serdar karari 28 Eyl aksam ("zinciri coz"):
# 1) 4. denemenin (onceki = TEMP/POD_KAPAK_78_DUZELTME/<onceki>/KAYNAK) QC PASS dosyalari POD_PRINT/CAPRICORN_LIBRA'ya
#    yazilir; FAIL olanlar eski haliyle kalir.
# 2) 5. (son) deneme YALNIZ 4. denemede FAIL olan dosyalar icin (kaynak_terazi.py, eski POD_PRINT dosyasindan);
#    PASS olanlar yazilir, FAIL olanlar eski haliyle kalir ve listelenir (YAZILDI.md).
#    Yazmadan once tum klasor TEMP/POD_PRINT_YEDEK_<damga>/CAPRICORN_LIBRA'ya yedeklenir + rclone check (0 fark);
#    her yazmadan sonra rclone check.
# 3) EJ baskisi yamali hatla (siparis-baski-v1 54363ee), uc cift POD_PRINT'ten; kapak_duzeltme.py: kapak_v8_kur (v9),
#    QC + karsilastirma. Kapak QC PASS ise yeni EJ baskilari TEMP/POD_KAPAK_V3/SIPARIS onbellegine (once yedek).
# Cikti: TEMP/POD_KAPAK_78_DUZELTME/<damga>/

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      onceki: {description: "4. deneme damgasi (KAYNAK/ QC PASS dosyalari yazilir)", required: true, default: "20260928_1533"}

jobs:
  duzelt:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Checkout (siparis-baski-v1, hat kodu)
        uses: actions/checkout@v4
        with:
          ref: siparis-baski-v1
          path: _sb
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          echo "DAMGA=$(date -u +%Y%m%d_%H%M)" >> "$GITHUB_ENV"
          pip install -q pillow numpy opencv-python-headless scipy requests fonttools
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: CAPRICORN_LIBRA kaynak - 4. deneme PASS + 5. deneme (yalniz 4. deneme FAIL)
        env:
          ONCEKI: ${{ inputs.onceki }}
        run: |
          set -euo pipefail
          [[ "$ONCEKI" =~ ^[0-9]{8}_[0-9]{4}$ ]] || { echo "::error::onceki damga bicimi. DUR."; exit 1; }
          H="gdrive:ASTROLOVE/TEMP/POD_KAPAK_78_DUZELTME/$DAMGA"
          POD="gdrive:ASTROLOVE/TEMP/POD_PRINT"
          rclone copy "gdrive:ASTROLOVE/TEMP/POD_KAPAK_78_DUZELTME/$ONCEKI/KAYNAK" _k4 --include "*/*.jpg" --include "KAYNAK_QC.json" -q
          python3 - <<'EOF'
          import json
          from pathlib import Path
          R = json.load(open('_k4/KAYNAK_QC.json'))
          assert len(R) == 75, len(R)
          p = [f"{r['renk']}/{r['boy']}.jpg" for r in R if r['pass']]
          f = [f"{r['renk']}/{r['boy']}.jpg" for r in R if not r['pass']]
          assert all(Path('_k4', x).is_file() for x in p), 'PASS dosyasi eksik'
          Path('_pass4.txt').write_text(''.join(x + '\n' for x in p)); Path('_fail4.txt').write_text(''.join(x + '\n' for x in f))
          print(f'4. deneme ({len(R)}): PASS {len(p)} | FAIL {len(f)}: {", ".join(f)}')
          EOF
          mkdir -p _cap5 _cl5 _k5
          rclone copy "$POD/CAPRICORN_LIBRA" _cap5 --files-from _fail4.txt -q
          rclone copy "$POD/CANCER_LIBRA" _cl5 --files-from _fail4.txt -q
          rclone copyto "$POD/CANCER_LIBRA/MIDNIGHT_BLUE/11x14.jpg" _cl_mb_11x14.jpg
          echo "5. deneme: $(find _cap5 -name '*.jpg' | wc -l) dosya (CL $(find _cl5 -name '*.jpg' | wc -l))"
          python scripts/pod/kaynak_terazi.py duzelt _cap5 _cl5 _k5 _cl_mb_11x14.jpg || true
          python3 - <<'EOF'
          import json
          from pathlib import Path
          R = json.load(open('_k5/KAYNAK_QC.json')) if Path('_k5/KAYNAK_QC.json').exists() else []
          p = [f"{r['renk']}/{r['boy']}.jpg" for r in R if r['pass']]
          f = [x for x in Path('_fail4.txt').read_text().split() if x not in p]     # QC'si olmayan da eski kalir
          Path('_pass5.txt').write_text(''.join(x + '\n' for x in p)); Path('_fail5.txt').write_text(''.join(x + '\n' for x in f))
          print(f'5. deneme ({len(R)}): PASS {len(p)} | FAIL {len(f)}: {", ".join(f) or "-"}')
          EOF
          rclone copy _k5 "$H/KAYNAK5" -q
      - name: POD_PRINT/CAPRICORN_LIBRA yaz (once tum klasor yedegi + rclone check)
        run: |
          set -euo pipefail
          H="gdrive:ASTROLOVE/TEMP/POD_KAPAK_78_DUZELTME/$DAMGA"
          POD="gdrive:ASTROLOVE/TEMP/POD_PRINT/CAPRICORN_LIBRA"
          Y="gdrive:ASTROLOVE/TEMP/POD_PRINT_YEDEK_$DAMGA/CAPRICORN_LIBRA"
          rclone copy "$POD" "$Y" -q
          rclone check "$POD" "$Y" -q || { echo "::error::yedek rclone check FARK. POD_PRINT'e yazilmadi. DUR."; exit 1; }
          echo "Yedek: TEMP/POD_PRINT_YEDEK_$DAMGA/CAPRICORN_LIBRA ($(rclone lsf -R --files-only "$Y" | wc -l) dosya, rclone check 0 fark)"
          rclone copy _k4 "$POD" --files-from _pass4.txt -q
          rclone check _k4 "$POD" --files-from _pass4.txt --one-way -q || { echo "::error::4. deneme yazma rclone check FARK (yedek $Y). DUR."; exit 1; }
          if [ -s _pass5.txt ]; then
            rclone copy _k5 "$POD" --files-from _pass5.txt -q
            rclone check _k5 "$POD" --files-from _pass5.txt --one-way -q || { echo "::error::5. deneme yazma rclone check FARK (yedek $Y). DUR."; exit 1; }
          fi
          {
            echo "# POD_PRINT/CAPRICORN_LIBRA yazimi ($DAMGA)"; echo
            echo "- Yedek (tum klasor): TEMP/POD_PRINT_YEDEK_$DAMGA/CAPRICORN_LIBRA, rclone check 0 fark"
            echo "- 4. deneme PASS yazildi: $(wc -l < _pass4.txt) | 5. deneme PASS yazildi: $(wc -l < _pass5.txt)"
            echo "- ESKI HALIYLE KALAN (5. deneme FAIL; siparis hatti bu dosyalarla calisir, Terazi ~%14 buyuk): $(wc -l < _fail5.txt)"
            sed 's/^/  - /' _fail5.txt
          } > _YAZILDI.md
          cat _YAZILDI.md; rclone copyto _YAZILDI.md "$H/YAZILDI.md"
          rm -rf _k4 _k5 _cap5 _cl5
      - name: Hat yamasi (yalniz bu kosunun kopyasi)
        run: grep -q 'Sembol bandinin ALTINDA' _sb/scripts/medya_v1/a1_poster.py && echo 'yama hatta zaten var' || { patch -p1 -s -d _sb < scripts/pod/hat_yama/sembol_alt_bant.patch && git -C _sb diff --stat; }
      - name: Girdiler + yamali EJ baskilari
        run: |
          set -euo pipefail
          H="gdrive:ASTROLOVE/TEMP/POD_KAPAK_78_DUZELTME/$DAMGA"
          mkdir -p _in
          rclone copyto "gdrive:ASTROLOVE/TEMP/POD_KAPAK_V3/SIPARIS/CANCER_LIBRA_MIDNIGHT_BLUE_11x14/BASKI_11x14.jpg" _in/EJ_CANCER_LIBRA.jpg
          KD=$(rclone lsf --dirs-only "gdrive:ASTROLOVE/TEMP/POD_KAPAK_78/" | tr -d '/' | grep -E '^[0-9]{8}_[0-9]{4}$' | sort | tail -1)
          echo "eski kapak kaynagi: TEMP/POD_KAPAK_78/$KD"
          for c in CANCER_LIBRA AQUARIUS_LIBRA ARIES_LIBRA CAPRICORN_LIBRA; do
            rclone copyto "gdrive:ASTROLOVE/TEMP/POD_KAPAK_78/$KD/KAPAK_$c.jpg" "_in/ESKI_KAPAK_$c.jpg"
          done
          MB64=$(printf '%s' "It Began With a Kiss in the Rain" | base64 -w0)
          for c in AQUARIUS_LIBRA ARIES_LIBRA CAPRICORN_LIBRA; do
            (cd _sb && python -c "import sys; sys.path.insert(0, 'scripts/medya_v1'); import siparis_dosyasi as s; s.SIP = '$H/SIPARIS'; sys.argv = ['siparis_dosyasi.py', '--cift', '$c', '--renk', 'MIDNIGHT_BLUE', '--boy', '11x14', '--isim1', 'EMILY', '--isim2', 'JAMES', '--mesaj-b64', '$MB64']; s.main()" > "../_log_$c.txt" 2>&1) \
              || { tail -40 "_log_$c.txt" | python3 scripts/guvenlik/log_suz.py; echo "::error::$c hat FAIL"; exit 1; }
            cp "_sb/_siparis/${c}_MIDNIGHT_BLUE_11x14/BASKI_11x14.jpg" "_in/EJ_$c.jpg"
            tail -3 "_log_$c.txt" | python3 scripts/guvenlik/log_suz.py
          done
      - name: Kapak + QC + karsilastirma
        run: |
          set -euo pipefail
          H="gdrive:ASTROLOVE/TEMP/POD_KAPAK_78_DUZELTME/$DAMGA"
          set +e
          python scripts/pod/kapak_duzeltme.py _in _out
          KOD=$?
          set -e
          cp _YAZILDI.md _out/YAZILDI.md 2>/dev/null || true
          rclone copy _out "$H" -q
          cat _out/RAPOR.md _YAZILDI.md >> "$GITHUB_STEP_SUMMARY" || true
          echo "Drive: TEMP/POD_KAPAK_78_DUZELTME/$DAMGA"
          exit "$KOD"
      - name: EJ onbellegi (TEMP/POD_KAPAK_V3/SIPARIS) yeni baskilarla (once yedek)
        run: |
          set -euo pipefail
          H="gdrive:ASTROLOVE/TEMP/POD_KAPAK_78_DUZELTME/$DAMGA"
          V1="gdrive:ASTROLOVE/TEMP/POD_KAPAK_V3/SIPARIS"
          for c in AQUARIUS_LIBRA ARIES_LIBRA CAPRICORN_LIBRA; do
            r="${c}_MIDNIGHT_BLUE_11x14"
            rclone cat "$H/SIPARIS/$r/KAPI_RAPORU.json" | python3 -c "import json,sys; sys.exit(0 if json.load(sys.stdin).get('kapilar_gecti') else 1)" \
              || { echo "::error::$c yeni baski kapi raporu PASS degil. DUR."; exit 1; }
            Y="gdrive:ASTROLOVE/TEMP/POD_KAPAK_V3_YEDEK_$DAMGA/$r"
            rclone copy "$V1/$r" "$Y" -q && rclone check "$V1/$r" "$Y" -q || { echo "::error::$c onbellek yedegi FARK. DUR."; exit 1; }
            rclone sync "$H/SIPARIS/$r" "$V1/$r" -q && rclone check "$H/SIPARIS/$r" "$V1/$r" -q || { echo "::error::$c onbellek yazma FARK. DUR."; exit 1; }
            echo "$c: onbellek guncellendi (yedek TEMP/POD_KAPAK_V3_YEDEK_$DAMGA/$r)"
          done
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone

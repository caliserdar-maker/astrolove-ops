name: kapak-duzeltme

# POD_KAPAK_78 duzeltme: AQUARIUS_LIBRA + ARIES_LIBRA + CAPRICORN_LIBRA (Serdar onayi 28 Eyl; CAPRICORN karari A). Etsy YOK.
# 4. deneme (Serdar genel onayi 28 Eyl aksam): kaynak QC 75/75 PASS ise POD_PRINT/CAPRICORN_LIBRA'ya YAZILIR:
#   once TEMP/POD_PRINT_YEDEK_<damga>/CAPRICORN_LIBRA yedegi + rclone check (0 fark), sonra yeni 75 dosya + rclone check.
#   QC 75/75 degilse POD_PRINT'e dokunulmaz (hazirlik alani <cikti>/KAYNAK/).
# Kapak QC PASS ise yeni EJ baskilari (KAPI_RAPORU ile) TEMP/POD_KAPAK_V3/SIPARIS onbellegine yazilir (once
#   TEMP/POD_KAPAK_V3_YEDEK_<damga>/ yedegi + rclone check).
# 1) scripts/pod/kaynak_terazi.py tara: 78 POD_PRINT MB 11x14 kucuk sembol olcusu (salt okur) -> SEMBOL_OLCU_78.md
# 2) kaynak_terazi.py duzelt: CAPRICORN_LIBRA 5 renk x tum boy, Terazi CANCER_LIBRA olcusune (QC PASS/FAIL)
# 3) EJ baskisi yamali hatla (siparis-baski-v1 54363ee), uc cift POD_PRINT'ten (CAPRICORN yeni kaynak);
#    kapak_duzeltme.py: kapak_v8_kur (v9), QC + karsilastirma.
# Cikti: TEMP/POD_KAPAK_78_DUZELTME/<damga>/

permissions:
  contents: read

on:
  workflow_dispatch: {}

jobs:
  duzelt:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Checkout (siparis-baski-v1, hat kodu)
        uses: actions/checkout@v4
        with:
          ref: siparis-baski-v1
          path: _sb
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          echo "DAMGA=$(date -u +%Y%m%d_%H%M)" >> "$GITHUB_ENV"
          pip install -q pillow numpy opencv-python-headless scipy requests fonttools
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: 78 kaynak sembol taramasi + CAPRICORN_LIBRA yeni kaynak (hazirlik alani; POD_PRINT'e yazilmaz)
        run: |
          set -euo pipefail
          H="gdrive:ASTROLOVE/TEMP/POD_KAPAK_78_DUZELTME/$DAMGA"
          POD="gdrive:ASTROLOVE/TEMP/POD_PRINT"
          mkdir -p _kaynak
          rclone copy "$POD" _pod78 --include "*/MIDNIGHT_BLUE/11x14.jpg" -q
          echo "tarama: $(ls _pod78 | wc -l) cift"
          python scripts/pod/kaynak_terazi.py tara _pod78 _kaynak
          rclone copy "$POD/CAPRICORN_LIBRA" _cap -q
          rclone copy "$POD/CANCER_LIBRA" _cl -q
          echo "CAPRICORN_LIBRA dosya: $(find _cap -name '*.jpg' | wc -l) | CANCER_LIBRA: $(find _cl -name '*.jpg' | wc -l)"
          set +e
          python scripts/pod/kaynak_terazi.py duzelt _cap _cl _kaynak _pod78/CANCER_LIBRA/MIDNIGHT_BLUE/11x14.jpg
          KOD=$?
          set -e
          rclone copy _kaynak "$H/KAYNAK" -q
          echo "Hazirlik: TEMP/POD_KAPAK_78_DUZELTME/$DAMGA/KAYNAK/ ($(find _kaynak -name '*.jpg' -path '*/*/*' | wc -l) dosya)"
          [ "$KOD" -eq 0 ] || { echo "::error::kaynak QC FAIL. POD_PRINT'e yazilmadi. DUR."; exit 1; }
          (cd _cap && find . -mindepth 2 -name '*.jpg' | sort) > _liste_eski.txt
          (cd _kaynak && find . -mindepth 2 -name '*.jpg' | sort) > _liste_yeni.txt
          [ "$(wc -l < _liste_yeni.txt)" -eq 75 ] && cmp -s _liste_eski.txt _liste_yeni.txt \
            || { echo "::error::yeni kaynak listesi 75 degil ya da eski liste ile ayni degil. POD_PRINT'e yazilmadi. DUR."; exit 1; }
          python3 -c "import json,sys; R=json.load(open('_kaynak/KAYNAK_QC.json')); sys.exit(0 if len(R)==75 and all(r['pass'] for r in R) else 1)" \
            || { echo "::error::KAYNAK_QC 75/75 PASS degil. DUR."; exit 1; }
          rm -rf _pod78 _cap _cl
      - name: POD_PRINT/CAPRICORN_LIBRA yaz (once yedek + rclone check)
        run: |
          set -euo pipefail
          POD="gdrive:ASTROLOVE/TEMP/POD_PRINT/CAPRICORN_LIBRA"
          Y="gdrive:ASTROLOVE/TEMP/POD_PRINT_YEDEK_$DAMGA/CAPRICORN_LIBRA"
          rclone copy "$POD" "$Y" -q
          rclone check "$POD" "$Y" -q || { echo "::error::yedek rclone check FARK. POD_PRINT'e yazilmadi. DUR."; exit 1; }
          echo "Yedek: TEMP/POD_PRINT_YEDEK_$DAMGA/CAPRICORN_LIBRA ($(rclone lsf -R --files-only "$Y" | wc -l) dosya, rclone check 0 fark)"
          rclone copy _kaynak "$POD" --include "*/*.jpg" -q
          rclone check _kaynak "$POD" --include "*/*.jpg" --one-way -q || { echo "::error::POD_PRINT yazma rclone check FARK (yedek: $Y). DUR."; exit 1; }
          echo "POD_PRINT/CAPRICORN_LIBRA: 75 dosya yazildi, rclone check 0 fark"
      - name: Hat yamasi (yalniz bu kosunun kopyasi)
        run: grep -q 'Sembol bandinin ALTINDA' _sb/scripts/medya_v1/a1_poster.py && echo 'yama hatta zaten var' || { patch -p1 -s -d _sb < scripts/pod/hat_yama/sembol_alt_bant.patch && git -C _sb diff --stat; }
      - name: Girdiler + yamali EJ baskilari
        run: |
          set -euo pipefail
          H="gdrive:ASTROLOVE/TEMP/POD_KAPAK_78_DUZELTME/$DAMGA"
          mkdir -p _in
          rclone copyto "gdrive:ASTROLOVE/TEMP/POD_KAPAK_V3/SIPARIS/CANCER_LIBRA_MIDNIGHT_BLUE_11x14/BASKI_11x14.jpg" _in/EJ_CANCER_LIBRA.jpg
          KD=$(rclone lsf --dirs-only "gdrive:ASTROLOVE/TEMP/POD_KAPAK_78/" | tr -d '/' | grep -E '^[0-9]{8}_[0-9]{4}$' | sort | tail -1)
          echo "eski kapak kaynagi: TEMP/POD_KAPAK_78/$KD"
          for c in CANCER_LIBRA AQUARIUS_LIBRA ARIES_LIBRA CAPRICORN_LIBRA; do
            rclone copyto "gdrive:ASTROLOVE/TEMP/POD_KAPAK_78/$KD/KAPAK_$c.jpg" "_in/ESKI_KAPAK_$c.jpg"
          done
          MB64=$(printf '%s' "It Began With a Kiss in the Rain" | base64 -w0)
          for c in AQUARIUS_LIBRA ARIES_LIBRA CAPRICORN_LIBRA; do
            (cd _sb && python -c "import sys; sys.path.insert(0, 'scripts/medya_v1'); import siparis_dosyasi as s; s.SIP = '$H/SIPARIS'; sys.argv = ['siparis_dosyasi.py', '--cift', '$c', '--renk', 'MIDNIGHT_BLUE', '--boy', '11x14', '--isim1', 'EMILY', '--isim2', 'JAMES', '--mesaj-b64', '$MB64']; s.main()" > "../_log_$c.txt" 2>&1) \
              || { tail -40 "_log_$c.txt" | python3 scripts/guvenlik/log_suz.py; echo "::error::$c hat FAIL"; exit 1; }
            cp "_sb/_siparis/${c}_MIDNIGHT_BLUE_11x14/BASKI_11x14.jpg" "_in/EJ_$c.jpg"
            tail -3 "_log_$c.txt" | python3 scripts/guvenlik/log_suz.py
          done
      - name: Kapak + QC + karsilastirma
        run: |
          set -euo pipefail
          H="gdrive:ASTROLOVE/TEMP/POD_KAPAK_78_DUZELTME/$DAMGA"
          set +e
          python scripts/pod/kapak_duzeltme.py _in _out
          KOD=$?
          set -e
          cp _kaynak/KAYNAK_KARSILASTIRMA.jpg _kaynak/SEMBOL_OLCU_78.md _out/ 2>/dev/null || true
          rclone copy _out "$H" -q
          cat _out/RAPOR.md _kaynak/SEMBOL_OLCU_78.md >> "$GITHUB_STEP_SUMMARY" || true
          echo "Drive: TEMP/POD_KAPAK_78_DUZELTME/$DAMGA"
          exit "$KOD"
      - name: EJ onbellegi (TEMP/POD_KAPAK_V3/SIPARIS) yeni baskilarla (once yedek)
        run: |
          set -euo pipefail
          H="gdrive:ASTROLOVE/TEMP/POD_KAPAK_78_DUZELTME/$DAMGA"
          V1="gdrive:ASTROLOVE/TEMP/POD_KAPAK_V3/SIPARIS"
          for c in AQUARIUS_LIBRA ARIES_LIBRA CAPRICORN_LIBRA; do
            r="${c}_MIDNIGHT_BLUE_11x14"
            rclone cat "$H/SIPARIS/$r/KAPI_RAPORU.json" | python3 -c "import json,sys; sys.exit(0 if json.load(sys.stdin).get('kapilar_gecti') else 1)" \
              || { echo "::error::$c yeni baski kapi raporu PASS degil. DUR."; exit 1; }
            Y="gdrive:ASTROLOVE/TEMP/POD_KAPAK_V3_YEDEK_$DAMGA/$r"
            rclone copy "$V1/$r" "$Y" -q && rclone check "$V1/$r" "$Y" -q || { echo "::error::$c onbellek yedegi FARK. DUR."; exit 1; }
            rclone sync "$H/SIPARIS/$r" "$V1/$r" -q && rclone check "$H/SIPARIS/$r" "$V1/$r" -q || { echo "::error::$c onbellek yazma FARK. DUR."; exit 1; }
            echo "$c: onbellek guncellendi (yedek TEMP/POD_KAPAK_V3_YEDEK_$DAMGA/$r)"
          done
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone

name: seo-attribute-followup

# 78 wallpaper taxonomy/property denetimi. SALT OKUR: yalniz Etsy GET.
permissions:
  contents: read

on:
  push:
    paths:
      - "config/seo_attribute_followup.trigger"
  workflow_dispatch:

concurrency:
  group: etsy-token
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone
          umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Token
        run: |
          set -euo pipefail
          umask 077
          mkdir -p _work _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
      - name: Guvenlik kontrolu
        run: |
          set -euo pipefail
          ! grep -nE 'api\.(post|put|patch|delete)\(' scripts/etsy/seo_attribute_followup.py
          python -m py_compile scripts/etsy/seo_attribute_followup.py
      - name: Wallpaper taxonomy/property denetimi
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          OUT_DIR: _out
        run: |
          set -euo pipefail
          python scripts/etsy/seo_attribute_followup.py
      - name: Token/cikti Drive'a
        if: ${{ always() }}
        run: |
          set -euo pipefail
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" || true
          stamp=$(TZ=Europe/Istanbul date +%Y%m%d_%H%M)
          [ -d _out ] && rclone copy _out "gdrive:ASTROLOVE/TEMP/SEO_ATTRIBUTE_FOLLOWUP/${stamp}" -q || true
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: seo-attribute-followup
          path: _out/
          if-no-files-found: error
      - if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

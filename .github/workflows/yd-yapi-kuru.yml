name: yd-yapi-kuru
# YD (1st Anniversary) yeni ilan yapisi KURU KOSU (Etsy'ye yazma YOK; gece isi 6, 30 Eki hazirlik; KOSTURMA AYRI ONAYLA).
# Style x Format (Digital File / Print) x Size (14 boy) = 140 urun plani, fiyat poster tablosundan, kargo profili ucretsiz kapisi.
# scripts/etsy/yd_yapi_kuru.py (yazma yontemleri kapali). Cikti: Drive TEMP/YD_YAPI/KURU_<run>/ (plan_damga = bu kosu no).
permissions:
  actions: read
  contents: read
on:
  workflow_dispatch:
    inputs:
      sadece: {description: "virgullu listing_id (bos = data/pod/yd78_ids.csv)", required: false, default: ""}
      boy_pid: {description: "Size ozelligi property_id (516 = taksonomi 121 Custom3, Serdar 31 Eki 5a; bos = betik varsayilani 516)", required: false, default: "516"}
      boy_scale_id: {description: "boy ozelligi olcekliyse scale_id (bos = yok)", required: false, default: ""}
jobs:
  oku:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - name: Girdi kapisi
        env: {S: "${{ inputs.sadece }}", BP: "${{ inputs.boy_pid }}", BS: "${{ inputs.boy_scale_id }}"}
        run: '[[ "$S" =~ ^([0-9]+(,[0-9]+)*)?$ && "$BP" =~ ^([0-9]+)?$ && "$BS" =~ ^([0-9]+)?$ ]] || { echo "::error::girdi"; exit 1; }'
      - uses: actions/checkout@v4
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || { sudo apt-get install -y -qq rclone >/dev/null; }
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Token
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
      - name: Oku (salt okuma)
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          S: ${{ inputs.sadece }}
          BP: ${{ inputs.boy_pid }}
          BS: ${{ inputs.boy_scale_id }}
        run: |
          set +e -o pipefail
          EK=(); [ -n "$BP" ] && EK+=(--boy-pid "$BP"); [ -n "$BS" ] && EK+=(--boy-scale-id "$BS")
          python3 scripts/etsy/yd_yapi_kuru.py --sadece "$S" "${EK[@]}" --out _out 2>&1 | tee _work/kosu.log
          echo "KOD=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
      - name: Token geri yaz + cikti Drive'a
        if: ${{ always() }}
        run: |
          TOKEN_RC=0; OUT_RC=0; bash scripts/etsy/token_geri_yaz.sh || TOKEN_RC=1
          [ -f _work/kosu.log ] && python3 scripts/guvenlik/log_suz.py < _work/kosu.log > _out/kosu.txt
          if ls _out/* >/dev/null 2>&1; then
            python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/ETSY_TOKEN.json _out || { echo "::error::ciktida sir"; exit 1; }
            rclone copy _out "gdrive:ASTROLOVE/TEMP/YD_YAPI/KURU_${GITHUB_RUN_ID}" --immutable -q && echo "Cikti: TEMP/YD_YAPI/KURU_${GITHUB_RUN_ID}" | tee -a "$GITHUB_STEP_SUMMARY" || OUT_RC=1
            [ -f _out/OZET.md ] && head -12 _out/OZET.md >> "$GITHUB_STEP_SUMMARY" || true
          fi
          [ "$TOKEN_RC" = 0 ] && [ "$OUT_RC" = 0 ] && [ "${KOD:-1}" = 0 ] || exit 1
      - if: always()
        run: rm -rf _work _out ~/.config/rclone

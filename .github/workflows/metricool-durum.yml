name: metricool-durum

# SALT OKUMA (yalniz GET): zamanlanmis gonderilerin yayin durumu + Facebook sayfa gonderileri/Reels (cift paylasim kontrolu).
# Metricool'a YAZMA / SILME YOK.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      idler:
        default: "394295362,394295335,394295371,394295406,394295387,394295424,394295439"
      bas:
        default: "2026-10-12T18:00:00"
      bit:
        default: "2026-10-13T12:00:00"

jobs:
  oku:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: rclone + token
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          mkdir -p ~/.config/rclone _work; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            export RCLONE_CONFIG_GDRIVE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET"; fi
          rclone copyto "gdrive:ASTROLOVE/TEMP/METRICOOL_TOKEN.json" _work/mc.json
          python3 -c "import json;print('::add-mask::'+json.load(open('_work/mc.json'))['userToken'])"
      - name: Durum (GET)
        env:
          IDLER: ${{ inputs.idler }}
          BAS: ${{ inputs.bas }}
          BIT: ${{ inputs.bit }}
        run: |
          python3 - <<'EOF' | python3 scripts/guvenlik/sir_koru.py tee --sir-json _work/mc.json "$GITHUB_STEP_SUMMARY"
          import importlib.util, json, os
          sp = importlib.util.spec_from_file_location('mpb', 'scripts/sosyal/metricool_pin_baslik.py')
          mpb = importlib.util.module_from_spec(sp); sp.loader.exec_module(mpb)
          mc = mpb.MC(json.load(open('_work/mc.json')))
          TZ = 'Europe/Istanbul'
          ps = {str(p.get('id')): p for p in mpb.veri(mc.istek('GET', '/v2/scheduler/posts', {'start': os.environ['BAS'], 'end': os.environ['BIT'], 'timezone': TZ})) or []}
          for i in os.environ['IDLER'].split(','):
              p = ps.get(i.strip())
              if not p:
                  print('GONDERI', i, 'LISTEDE YOK'); continue
              for x in p.get('providers') or []:
                  ek = {k: v for k, v in x.items() if k not in ('network', 'status', 'publicUrl', 'id', 'detailedStatus') and v not in (None, '', [], {})}
                  print('GONDERI', i, x.get('network'), 'plan', (p.get('publicationDate') or {}).get('dateTime'), x.get('status'), x.get('detailedStatus'),
                        x.get('publicUrl'), json.dumps(ek, ensure_ascii=False)[:400])
          # okuma testi: 12 Eki - 31 Ara tum gonderiler ag + durum bazinda (7 gunluk parcalar)
          from datetime import datetime, timedelta
          t, son, tum = datetime(2026, 10, 12), datetime(2026, 12, 31), {}
          while t < son:
              e = min(son, t + timedelta(days=7))
              for p in mpb.veri(mc.istek('GET', '/v2/scheduler/posts', {'start': t.strftime('%Y-%m-%dT%H:%M:%S'), 'end': e.strftime('%Y-%m-%dT%H:%M:%S'), 'timezone': TZ})) or []:
                  tum[p.get('id')] = p
              t = e
          say = {}
          for p in tum.values():
              for x in p.get('providers') or []:
                  k = (x.get('network'), x.get('status'))
                  say[k] = say.get(k, 0) + 1
          print(f'SAYIM 12 Eki-31 Ara: toplam gonderi {len(tum)}')
          for ag in sorted({k[0] for k in say}):
              print(f"  {ag}: {sum(v for k, v in say.items() if k[0] == ag)} " + str({k[1]: v for k, v in say.items() if k[0] == ag}))
          for yol in ('/v2/analytics/posts/facebook', '/v2/analytics/reels/facebook', '/v2/analytics/posts/instagram', '/v2/analytics/reels/instagram'):
              try:
                  d = mpb.veri(mc.istek('GET', yol, {'from': os.environ['BAS'], 'to': os.environ['BIT'], 'timezone': TZ})) or []
              except SystemExit as e:
                  print('ANALIZ', yol, 'HATA', str(e)[:200]); continue
              print('ANALIZ', yol, len(d), 'kayit')
              for x in d if isinstance(d, list) else []:
                  kisa = {k: x.get(k) for k in ('created', 'publishedAt', 'date', 'type', 'url', 'link', 'permalink', 'postId', 'id', 'reelId') if x.get(k) not in (None, '')}
                  m = x.get('text') or x.get('message') or x.get('content') or x.get('description') or ''
                  print('  ', json.dumps(kisa, ensure_ascii=False, default=str)[:300], '|', str(m)[:70].replace('\n', ' '))
          EOF
      - if: always()
        run: |
          rm -rf _work ~/.config/rclone
          if [ -f "$RUNNER_TEMP/SIR_ENGEL" ]; then echo "::error::sir iceren satir engellendi (sir_koru)"; exit 1; fi

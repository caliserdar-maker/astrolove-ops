name: ig-karusel-ilk-slayt-yukle

# IG karusel ilk slayt ornegi (20 Eki 2026, CANCER_LIBRA) -> Drive. Yalniz yukleme: dosyalar yerelde
# scripts/sosyal/ig_karusel_ilk_slayt.py ile uretildi ve olculdu (OLCUM.txt PASS). Metricool / Etsy yazma yok.
permissions:
  contents: read
on:
  workflow_dispatch:
jobs:
  yukle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      O: gdrive:ASTROLOVE/TEMP/IG_KARUSEL_ILK_SLAYT_20261020
    steps:
      - uses: actions/checkout@v4
      - name: Drive'a yukle
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            export RCLONE_CONFIG_GDRIVE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET"; fi
          rclone copy data/sosyal/instagram/karusel_ilk_slayt_20261020 "$O" -q
          rclone lsl "$O"
      - if: always()
        run: rm -rf ~/.config/rclone

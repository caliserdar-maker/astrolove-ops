name: doku-ai-sayfa

# DOKU_AI (4 Eki 2026, Serdar onayi, YENI YONTEM): ChatGPT'ye gidecek harf sayfalari + referans onerisi.
# Kod: motor dali motor/doku_ai_sayfa.py. Yalniz Drive yuklemesi: doku_ai/SAYFALAR -> TEMP/MOTOR/DOKU_AI/SAYFALAR,
# doku_ai/REFERANS -> TEMP/MOTOR/DOKU_AI/REFERANS. 4 Eki: referans AQUARIUS_ARIES; eski TAURUS_TAURUS sayfalari ESKI/ altina.
# C adimi: doku_ai/DONUS -> TEMP/MOTOR/DOKU_AI/DONUS (EMILY kesiti, olcumler).
# Son cila: doku_ai/CILA -> TEMP/MOTOR/DOKU_AI/CILA (Canva dokulu sayfalar, renk/parlaklik esitleme). Etsy YOK, musteri YOK.

on:
  push:
    branches: [doku-ai]
    paths: [doku_ai/**]

permissions:
  contents: read

concurrency: doku-ai-drive

jobs:
  yukle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: sha = SHA.txt
        run: cd doku_ai && sha256sum -c SHA.txt
      - name: Drive'a yukle (TEMP/MOTOR/DOKU_AI)
        run: |
          set -euo pipefail
          D="gdrive:ASTROLOVE/TEMP/MOTOR/DOKU_AI"
          E="$D/ESKI/SAYFALAR_TAURUS_TAURUS"
          if ! rclone lsf "$E" >/dev/null 2>&1 || [ -z "$(rclone lsf "$E")" ]; then
            rclone move "$D/SAYFALAR" "$E" --max-depth 1 --include 'DOKU_AI_*' --include 'SAYFA_PLANI.json'
          fi
          rclone copy doku_ai/SAYFALAR "$D/SAYFALAR"
          rclone check doku_ai/SAYFALAR "$D/SAYFALAR" --one-way --checksum
          rclone copy doku_ai/REFERANS "$D/REFERANS"
          rclone copy doku_ai/DONUS "$D/DONUS"
          rclone copy doku_ai/CILA "$D/CILA"
          rclone dedupe --dedupe-mode newest "$D"
          rclone lsl "$D"
          N=$(rclone lsf "$D/SAYFALAR" | grep -cE '^DOKU_AI_.*\.(png|json)$'); echo "sayfa dosyasi: $N"; [ "$N" = 16 ]
          N=$(rclone lsf "$D/REFERANS" | grep -cE '^REFERANS_'); echo "referans dosyasi: $N"; [ "$N" = 4 ]
          N=$(rclone lsf "$E" | grep -cE '^DOKU_AI_.*\.(png|json)$'); echo "eski: $N"; [ "$N" = 16 ]
          N=$(rclone lsf "$D/DONUS" | grep -cE '^(EMILY_AI_KESIT\.png|CANCER_LIBRA_YENI_AI_SAYFA\.jpg|DONUS_OLCUM\.json|DONUS_HIZALAMA\.json)$'); echo "donus: $N"; [ "$N" = 4 ]
          N=$(rclone lsf "$D/CILA" | grep -cE '^(CILA_KANIT\.jpg|CILA_OLCUM\.json|DOKU_AI_.*_CILA\.png)$'); echo "cila: $N"; [ "$N" = 10 ]
      - if: always()
        run: rm -rf ~/.config/rclone

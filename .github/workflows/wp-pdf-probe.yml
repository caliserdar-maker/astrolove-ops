name: wp-pdf-probe

# KURULUM PDF'I - EKSIK OLCUMU (SALT OKUR) - 4 Eyl 2026.
# Hicbir yazma/uretim/ZIP degisikligi yok. Etsy'ye tek dokunus GET
# (aciklama + RU cevirisi); token yenilemesi disinda yazma yoktur.

on:
  workflow_dispatch:
    inputs:
      skip_etsy:
        description: "Ilan metni taramasini atla (yalniz Drive + ZIP)"
        type: boolean
        default: false

concurrency:
  group: etsy-token
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null

      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi

      - name: PDF taramasi (Drive agaclari) + token + ilan listesi
        run: |
          set -euo pipefail
          umask 077
          mkdir -p _work
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
          rclone copyto "gdrive:ASTROLOVE/TEMP/WA_WP_DRAFTS_STATE.csv" _work/drafts.csv
          rclone lsjson -R "gdrive:ASTROLOVE/WALLPAPER" --files-only > _work/pdf_wallpaper.json
          rclone lsjson -R "gdrive:ASTROLOVE/TEMP"      --files-only > _work/pdf_temp.json
          rclone lsjson -R "gdrive:ASTROLOVE/ARCHIVE"   --files-only > _work/pdf_archive.json
          for f in pdf_wallpaper pdf_temp pdf_archive; do
            echo "$f: $(python3 -c "import json;print(len(json.load(open('_work/$f.json'))))") dosya"
          done

      - name: DELIVERY ZIP'leri (icerik listesi icin)
        run: |
          set -euo pipefail
          mkdir -p _work/zip
          rclone copy "gdrive:ASTROLOVE/WALLPAPER/DELIVERY" _work/zip \
            --include "*/*.zip" --transfers 8 --checkers 16
          echo "ZIP: $(find _work/zip -name '*.zip' | wc -l) dosya, $(du -sh _work/zip | cut -f1)"

      - name: Olcum
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          set -euo pipefail
          args=(--state _work/drafts.csv --zip-dir _work/zip
                --pdf-json "WALLPAPER=_work/pdf_wallpaper.json,TEMP=_work/pdf_temp.json,ARCHIVE=_work/pdf_archive.json"
                --out _work/WP_PDF_PROBE.csv)
          if [ "${{ inputs.skip_etsy }}" = "true" ]; then args+=(--skip-etsy); fi
          python scripts/etsy/wp_pdf_probe.py "${args[@]}" | tee _work/rapor.txt

      - name: Token'i Drive'a geri yaz (yenilendiyse)
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ -f _work/ETSY_TOKEN.json.updated ]; then
            rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json"
          fi

      - name: Sonuclari Drive'a yaz
        if: ${{ always() }}
        run: |
          set -euo pipefail
          [ -f _work/WP_PDF_PROBE.csv ] && rclone copyto _work/WP_PDF_PROBE.csv "gdrive:ASTROLOVE/TEMP/WP_PDF_PROBE.csv" || true
          [ -f _work/rapor.txt ] && rclone copyto _work/rapor.txt "gdrive:ASTROLOVE/TEMP/WP_PDF_RAPOR.txt" || true

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: wp-pdf-probe
          path: |
            _work/WP_PDF_PROBE.csv
            _work/rapor.txt
          if-no-files-found: ignore

      - name: Temizlik
        if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

name: by78-pin-hazirlik

# "Bizim Yilimiz" 78 ilan icin Pinterest pin HAZIRLIGI (YAYIN YOK; Metricool/Pinterest'e gonderim yok).
# mod=incele : 3 ciftin (A/B/C grubu) galeri kontak sayfasi + olculer, 78 galeri listesi, mevcut V6 pin plani saatleri.
# mod=plan   : scripts/sosyal/by78_pin_plan.py -> PIN_PLAN_BY78.csv (Drive ASTROLOVE/TEMP).
# mod=pano   : Pinterest panosu "1st Anniversary Gift Ideas" Metricool ile acilir (Serdar onayi 14 Eki); pin YOK.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      mod:
        type: choice
        options: [incele, plan, pano, pano_oku]
        default: incele

jobs:
  hazirla:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      G: gdrive:ASTROLOVE/TEMP/BIZIM_YILIMIZ_78_20261014_v2
      O: gdrive:ASTROLOVE/TEMP/BY78_PIN_HAZIRLIK
    steps:
      - uses: actions/checkout@v4
      - name: Paketler + rclone
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          pip install -q pillow==11.0.0
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          mkdir -p ~/.config/rclone _w _out; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Girdiler (galeri listesi, V6 pin plani, ilan metni)
        run: |
          set -euo pipefail
          rclone lsjson "$G" -R --files-only --include "*/galeri/*" > _w/GALERI.json
          rclone copyto "gdrive:ASTROLOVE/TEMP/PIN_V6_20261012/PLAN/PIN_V6_PLAN_YAYIN.csv" _w/PIN_V6_PLAN.csv
          git fetch -q origin bizim-yilimiz-v3 && git show origin/bizim-yilimiz-v3:BIZIM_YILIMIZ_78_ILAN_METIN.csv > _w/METIN.csv
          python3 - <<'EOF'
          import json, collections, csv
          g = json.load(open('_w/GALERI.json'))
          c = collections.Counter(x['Path'].split('/')[0] for x in g)
          print('GALERI dosya', len(g), '| cift', len(c), '| cift basina', dict(collections.Counter(c.values())))
          print('ornek adlar:', sorted({x['Name'] for x in g if x['Path'].startswith('AQUARIUS_AQUARIUS/')}))
          p = list(csv.DictReader(open('_w/PIN_V6_PLAN.csv', encoding='utf-8')))
          print('V6 plan', len(p), 'satir;', p[0]['tarih_saat'], '->', p[-1]['tarih_saat'], '| saatler', sorted({r['tarih_saat'][11:16] for r in p}))
          print('METIN', len(list(csv.DictReader(open('_w/METIN.csv', encoding='utf-8-sig')))), 'satir')
          EOF
      - name: Kontak sayfasi (mod=incele)
        if: ${{ inputs.mod == 'incele' }}
        run: |
          set -euo pipefail
          for c in AQUARIUS_AQUARIUS AQUARIUS_ARIES AQUARIUS_CANCER; do rclone copy "$G/$c/galeri" "_w/k/$c" -q; done
          python3 - <<'EOF'
          import os
          from PIL import Image, ImageDraw
          satir = []
          for c in sorted(os.listdir('_w/k')):
              fs = sorted(os.listdir(f'_w/k/{c}'))
              for f in fs:
                  im = Image.open(f'_w/k/{c}/{f}'); print(c, f, im.size)
              satir.append((c, fs))
          tw, th = 220, 330
          K = Image.new('RGB', (10 * (tw + 6) + 6, len(satir) * (th + 26) + 6), (240, 240, 240))
          d = ImageDraw.Draw(K)
          for i, (c, fs) in enumerate(satir):
              for j, f in enumerate(fs[:10]):
                  im = Image.open(f'_w/k/{c}/{f}').convert('RGB'); im.thumbnail((tw, th))
                  x, y = 6 + j * (tw + 6), 6 + i * (th + 26)
                  K.paste(im, (x, y)); d.text((x, y + th + 4), f[:30], fill=(0, 0, 0))
          K.save('_out/KONTAK_GALERI_3CIFT.jpg', quality=80)
          EOF
          rclone copy _out "$O" -q
          echo "Kontak: $O/KONTAK_GALERI_3CIFT.jpg"
      - name: Pin plani (mod=plan)
        if: ${{ inputs.mod == 'plan' }}
        run: |
          set -euo pipefail
          P=""; if rclone lsjson "gdrive:ASTROLOVE/TEMP/PIN_BY78_V1" --files-only > _w/PIN.json 2>/dev/null && [ -s _w/PIN.json ]; then P="--pin _w/PIN.json"; echo "gorsel: PIN_BY78_V1 ($(python3 -c "import json;print(len(json.load(open('_w/PIN.json'))))") dosya)"; fi
          python3 scripts/sosyal/by78_pin_plan.py --metin _w/METIN.csv --galeri _w/GALERI.json --v6 _w/PIN_V6_PLAN.csv --cikti _out/PIN_PLAN_BY78.csv $P
          python3 scripts/guvenlik/sir_koru.py tara _out || exit 1
          rclone copyto _out/PIN_PLAN_BY78.csv "gdrive:ASTROLOVE/TEMP/PIN_PLAN_BY78.csv" -q
          echo "Cikti: ASTROLOVE/TEMP/PIN_PLAN_BY78.csv"
      - name: Pinterest panosu ac (mod=pano; yalniz pano, pin yok)
        if: ${{ inputs.mod == 'pano' }}
        run: |
          set -uo pipefail
          rclone copyto "gdrive:ASTROLOVE/TEMP/METRICOOL_TOKEN.json" _w/mc.json
          python3 -c "import json;print('::add-mask::'+json.load(open('_w/mc.json'))['userToken'])"
          python3 scripts/sosyal/metricool_pano_ac.py _w/mc.json "1st Anniversary Gift Ideas" \
            "Personalized 1st anniversary gift ideas for couples: zodiac paper anniversary prints and cards with your names and date, by AstroLoveArt." _out \
            | python3 scripts/guvenlik/sir_koru.py tee --sir-json _w/mc.json "$GITHUB_STEP_SUMMARY"
          rc=${PIPESTATUS[0]}
          python3 scripts/guvenlik/sir_koru.py tara --sir-json _w/mc.json _out || exit 1
          rclone copy _out "$O" -q --include "PANO_AC.json"
          exit $rc
      - name: Pinterest panolari (mod=pano_oku; yalniz GET)
        if: ${{ inputs.mod == 'pano_oku' }}
        run: |
          set -uo pipefail
          rclone copyto "gdrive:ASTROLOVE/TEMP/METRICOOL_TOKEN.json" _w/mc.json
          python3 -c "import json;print('::add-mask::'+json.load(open('_w/mc.json'))['userToken'])"
          python3 - <<'EOF' | python3 scripts/guvenlik/sir_koru.py tee --sir-json _w/mc.json "$GITHUB_STEP_SUMMARY"
          import importlib.util, json
          sp = importlib.util.spec_from_file_location('mpb', 'scripts/sosyal/metricool_pin_baslik.py')
          mpb = importlib.util.module_from_spec(sp); sp.loader.exec_module(mpb)
          mc = mpb.MC(json.load(open('_w/mc.json')))
          liste = mpb.veri(mc.istek('GET', '/v2/scheduler/boards/pinterest', {'brandId': mc.b}))
          if isinstance(liste, dict):
              liste = next((v for v in liste.values() if isinstance(v, list)), [])
          print('PANO', len(liste))
          for b in liste:
              print(' ', b.get('id'), '|', b.get('name'), '|', (b.get('owner') or {}).get('username'), '|', b.get('privacy'), '|', (b.get('description') or '')[:120])
          EOF
      - if: always()
        run: |
          rm -rf ~/.config/rclone _w/mc.json
          if [ -f "$RUNNER_TEMP/SIR_ENGEL" ]; then echo "::error::sir iceren satir engellendi (sir_koru)"; exit 1; fi

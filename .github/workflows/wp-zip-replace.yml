name: wp-zip-replace

# TEK DIJITAL DOSYAYI DEGISTIR - 5 Eyl 2026 (pilot Cancer_Libra WP ZIP, Mo onayi).
# ETSY'YE YAZAR: hedef dosyayi sil + yenisini yukle. Diger dosyalara dokunmaz.
# Kaynak Drive WALLPAPER/DELIVERY/<CIFT>/<dosya>. Varsayilan DRY-RUN.

on:
  workflow_dispatch:
    inputs:
      listing_id:
        description: "listing_id"
        required: true
        default: "4565911475"
      pair:
        description: "cift (DELIVERY klasoru)"
        required: true
        default: "Cancer_Libra"
      filename:
        description: "degistirilecek dosya adi"
        required: true
        default: "AstroLove_Cancer_Libra_Warm_Parchment.zip"
      apply:
        description: "Yazmayi gercekten uygula"
        type: boolean
        default: false

concurrency:
  group: etsy-token
  cancel-in-progress: false

jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Token + kaynak ZIP
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work/zip
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
          up=$(echo "${{ inputs.pair }}" | tr '[:lower:]' '[:upper:]')
          rclone copyto "gdrive:ASTROLOVE/WALLPAPER/DELIVERY/$up/${{ inputs.filename }}" "_work/zip/${{ inputs.filename }}"
          ls -l _work/zip; sha256sum "_work/zip/${{ inputs.filename }}"
          python -c "import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); print('zip icerik', z.namelist()); assert z.testzip() is None" "_work/zip/${{ inputs.filename }}"
      - name: Degistir
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          set -euo pipefail
          args=(--listing-id "${{ inputs.listing_id }}" --file "_work/zip/${{ inputs.filename }}")
          if [ "${{ inputs.apply }}" = "true" ]; then args+=(--apply); fi
          python scripts/etsy/wp_zip_degistir.py "${args[@]}"
      - name: Token'i Drive'a geri yaz (yenilendiyse)
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ -f _work/ETSY_TOKEN.json.updated ]; then
            rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json"
          fi
      - name: Temizlik
        if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

name: by-boy-ornek
# 1st Anniversary (YD) 14 boy ornek dosyalari (Serdar 31 Eki karar 2a). ETSY YOK, musteri yok. scripts/siparis_by/by_boy.py: oran ailesi
# sayfasi (bizim-yilimiz-v3 by_poster, KOD_REF sabit; zemin dikey uzar, oge boyu 8x10 ile ayni) + boy basina yeniden ornekleme, 300 dpi.
# Cikti Drive TEMP/YD_BOY_ORNEK/<damga>/: <boy>.jpg (14), BOY_TABLO.csv, BOY_RAPOR.json, KONTAK_14_BOY.jpg (--immutable).
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      pair: {description: "cift", required: true, default: "CANCER_LIBRA"}
      style: {description: "1 Starlit | 2 Timeless | 3 First Page | 4 Layers | 5 Botanical", type: choice, options: ["1", "2", "3", "4", "5"], default: "1"}
      boy: {description: "14 = hepsi, ya da virgullu", required: true, default: "14"}
jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KOD_REF: e3d168cef6821d0bd6b6ae5b4dfba503025c5753   # by-siparis-ornek.yml ile ayni
    steps:
      - name: Girdi kapisi
        env: {P: "${{ inputs.pair }}", B: "${{ inputs.boy }}"}
        run: '[[ "$P" =~ ^[A-Z]+_[A-Z]+$ && "$B" =~ ^(14|[0-9A-Zx,]+)$ ]] || { echo "::error::girdi"; exit 1; }'
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: Kod
        run: |
          set -euo pipefail
          git fetch -q --depth 1 origin "$KOD_REF"
          git worktree add -q _kod FETCH_HEAD
      - name: Kurulum (by-siparis-ornek ile ayni surumler)
        run: |
          set -euo pipefail
          pip install -q numpy==2.5.3 opencv-python-headless==5.0.0.93 pillow==12.3.0 fonttools==4.60.1
          python3 -c "from PIL import features; import sys; sys.exit(0 if features.check('raqm') else 1)"
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || { sudo apt-get install -y -qq rclone >/dev/null; }
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: 14 boy
        env: {P: "${{ inputs.pair }}", S: "${{ inputs.style }}", B: "${{ inputs.boy }}"}
        run: |
          set -uo pipefail
          echo "DAMGA=$(date -u +%Y%m%d_%H%M%S)" >> "$GITHUB_ENV"
          python3 scripts/siparis_by/by_boy.py --kod _kod --pair "$P" --style "$S" --name1 EMILY --name2 JAMES --date "12 JUNE 2025" \
            --boy "$B" --scale 2 --out _o
          echo "KOD=$?" >> "$GITHUB_ENV"
          cat _o/BOY_TABLO.csv >> "$GITHUB_STEP_SUMMARY" || true
      - name: Drive'a yaz
        if: always()
        run: |
          set -euo pipefail
          if ls _o/* >/dev/null 2>&1; then
            rclone copy _o "gdrive:ASTROLOVE/TEMP/YD_BOY_ORNEK/${DAMGA:?}" --immutable -q
            echo "::notice title=YD BOY ORNEK::TEMP/YD_BOY_ORNEK/${DAMGA}/"
          fi
          [ "${KOD:-1}" = 0 ] || { echo "::error::BOY KONTROL FAIL (BOY_RAPOR.json)"; exit 1; }
      - if: always()
        run: rm -rf _o ~/.config/rclone

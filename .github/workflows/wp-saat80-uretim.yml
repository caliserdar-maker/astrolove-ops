name: wp-saat80-uretim

# SAAT SEMBOLU %80 - B ASAMASI: DOSYALAR (5 Eyl 2026, Mo). Etsy'ye yazma YOK.
#  hazirlik: TEMP/WATCH_CANVA_SAAT80 (312 dosya) dogrulanir;
#            TEMP/WATCH_CANVA -> TEMP/WATCH_CANVA_YEDEK_100, SAAT80 -> WATCH_CANVA;
#            FINAL_V2 saatleri -> WALLPAPER/FINAL_V2_YEDEK_SAAT100/<UP>/ (312),
#            yeni saatler FINAL_V2/<UP>/ uzerine (312, rclone check).
#  uretim (4 parca): cift basina 4 ZIP (4 wallpaper + LICENSE.txt, PDF YOK) ->
#            WALLPAPER/DELIVERY_SAAT80/<UP>/; eski SET07 -> MOCKUP_V2_YEDEK_SAAT100,
#            yeni SET07 -> MOCKUP_V2/<UP>/ (diger 5 sahne dokunulmaz). ETA sayaci.
#  ozet:     312 ZIP PASS sayisi, en buyuk ZIP; 5 rastgele ciftin SET07 + 4 saat
#            dosyasi TEMP/SAAT80_ORNEK_5/ altina kopyalanir, anyone:reader link.
# DELIVERY (PDF'li canli ZIP'ler) hic okunmaz/yazilmaz.

on:
  workflow_dispatch:
    inputs:
      shards:
        description: "parca sayisi"
        required: true
        default: "4"
      limit:
        description: "parca basina en fazla cift (0 = hepsi; deneme icin 1)"
        required: true
        default: "0"
      pairs:
        description: "yalniz bu ciftler (virgulle; bos = parcalar). Tekrar kosu icin swap=false"
        required: true
        default: "-"
      swap:
        description: "true: hazirlik (WATCH_CANVA takasi + FINAL_V2 saat degisimi) yapilir; false: atlanir (zaten yapildiysa)"
        required: true
        type: boolean
        default: true

concurrency:
  group: wp-saat80-uretim
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.m.outputs.shards }}
    steps:
      - id: m
        run: python3 -c "import json;n=int('${{ inputs.shards }}');print('shards='+json.dumps(list(range(n))))" >> "$GITHUB_OUTPUT"

  hazirlik:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Takas + FINAL_V2 saat degisimi
        if: ${{ inputs.swap }}
        run: |
          set -euo pipefail
          G=gdrive:ASTROLOVE
          # var olmayan klasorde lsf rc=3 verir; sayim 0 donmeli (set -e dusurmesin)
          say() { { rclone lsf -R --files-only "$1" --include "$2" 2>/dev/null || true; } | wc -l; }
          rclone dedupe --dedupe-mode newest "$G/TEMP/WATCH_CANVA_SAAT80" || true
          rclone dedupe --dedupe-mode newest "$G/TEMP/WATCH_CANVA" || true
          n80=$(say "$G/TEMP/WATCH_CANVA_SAAT80" "*/AstroLove_*_Watch.jpg"); echo "SAAT80: $n80 (beklenen 312)"
          if [ "$n80" != "312" ]; then
            echo "yinelenen adlar:"; rclone lsf -R --files-only "$G/TEMP/WATCH_CANVA_SAAT80" | sort | uniq -d | head -40
            echo "cift disi/eksik klasorler:"; rclone lsf --dirs-only "$G/TEMP/WATCH_CANVA_SAAT80" | sort | uniq -c | awk '$1!=1' | head
            exit 1
          fi
          n100=$(say "$G/TEMP/WATCH_CANVA" "*/AstroLove_*_Watch.jpg"); ny=$(say "$G/TEMP/WATCH_CANVA_YEDEK_100" "*/AstroLove_*_Watch.jpg")
          echo "WATCH_CANVA: $n100, YEDEK_100: $ny"
          if [ "$ny" = "0" ]; then
            test "$n100" -gt 0   # eski WATCH_CANVA yalniz Midnight_Blue (78) icerir
            rclone move "$G/TEMP/WATCH_CANVA" "$G/TEMP/WATCH_CANVA_YEDEK_100" --delete-empty-src-dirs
            echo "WATCH_CANVA -> WATCH_CANVA_YEDEK_100: $(say "$G/TEMP/WATCH_CANVA_YEDEK_100" "*/AstroLove_*_Watch.jpg")"
          else
            echo "YEDEK_100 dolu ($ny), takas 1 atlandi"
          fi
          rclone move "$G/TEMP/WATCH_CANVA_SAAT80" "$G/TEMP/WATCH_CANVA" --delete-empty-src-dirs
          n=$(say "$G/TEMP/WATCH_CANVA" "*/AstroLove_*_Watch.jpg"); echo "WATCH_CANVA (yeni %80): $n"; test "$n" = "312"
          # FINAL_V2 saat yedegi (idempotent: dolu ise atla). FINAL_V2'de 316 saat var (4 fazla, cift disi);
          # sayim yerine rclone check ile birebirlik dogrulanir.
          nb=$(say "$G/WALLPAPER/FINAL_V2_YEDEK_SAAT100" "*/AstroLove_*_Watch.jpg")
          if [ "$nb" = "0" ]; then
            rclone copy "$G/WALLPAPER/FINAL_V2" "$G/WALLPAPER/FINAL_V2_YEDEK_SAAT100" --include "*/AstroLove_*_Watch.jpg" --transfers 16 --checkers 16
            nb=$(say "$G/WALLPAPER/FINAL_V2_YEDEK_SAAT100" "*/AstroLove_*_Watch.jpg")
          fi
          echo "FINAL_V2_YEDEK_SAAT100: $nb"; test "$nb" -ge 312
          rclone check "$G/WALLPAPER/FINAL_V2" "$G/WALLPAPER/FINAL_V2_YEDEK_SAAT100" --one-way --include "*/AstroLove_*_Watch.jpg"
          # yeni saatler FINAL_V2 uzerine
          rclone copy "$G/TEMP/WATCH_CANVA" "$G/WALLPAPER/FINAL_V2" --include "*/AstroLove_*_Watch.jpg" --transfers 16 --checkers 16
          rclone check "$G/TEMP/WATCH_CANVA" "$G/WALLPAPER/FINAL_V2" --one-way --include "*/AstroLove_*_Watch.jpg"
          echo "FINAL_V2 saatleri %80 ile degistirildi: 312 OK"
      - name: Klasor hazirligi (parcalar ayni anda kok klasor acmasin) + yinelenen klasor birlestirme
        run: |
          set -euo pipefail
          G=gdrive:ASTROLOVE
          # 5 Eyl: 4 parca DELIVERY_SAAT80 ve MOCKUP_V2_YEDEK_SAAT100 koklerini ayni anda acti -> 2'ser kopya.
          # skip modu: yalniz ayni klasordeki BIREBIR ayni dosyalari siler, ayni adli klasorleri birlestirir.
          rclone dedupe --dedupe-mode skip "$G/WALLPAPER" || true
          for d in DELIVERY_SAAT80 MOCKUP_V2_YEDEK_SAAT100; do
            rclone mkdir "$G/WALLPAPER/$d"
            echo "$d: $(rclone lsf --dirs-only "$G/WALLPAPER" | grep -c "^$d/") kok klasor (beklenen 1)"
          done
          rclone mkdir "$G/TEMP/SAAT80_ORNEK_5"
      - name: Temizlik
        if: ${{ always() }}
        run: rm -rf ~/.config/rclone

  uretim:
    needs: [plan, hazirlik]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Girdiler (STATE, LICENSE, calib, masterlar, pilot)
        run: |
          set -euo pipefail
          mkdir -p _work/calib _work/masters _work/pilot
          rclone copyto "gdrive:ASTROLOVE/TEMP/WA_WP_DRAFTS_STATE.csv" _work/drafts.csv
          rclone copyto "gdrive:ASTROLOVE/TEMP/LICENSE.txt" _work/LICENSE.txt
          rclone copy "gdrive:ASTROLOVE/WALLPAPER/MOCKUP_V2/_CALIB" _work/calib --include "calib.json" --include "masks/*.png"
          rclone copy "gdrive:ASTROLOVE/WALLPAPER/MOCKUP_V2/CANCER_LIBRA" _work/masters --include "*_FINAL.jpg"
          rclone copy "gdrive:ASTROLOVE/ARCHIVE/FINAL_V2_PILOT_V1" _work/pilot --include "AstroLove_*.jpg"
          echo "cift: $(tail -n +2 _work/drafts.csv | wc -l), LICENSE $(wc -c < _work/LICENSE.txt) bayt, master $(ls _work/masters | wc -l), pilot $(ls _work/pilot | wc -l)"
      - name: Uretim (ZIP + SET07)
        run: |
          set -euo pipefail
          P="${{ inputs.pairs }}"; [ "$P" = "-" ] && P=""
          AD="parca${{ matrix.shard }}"; [ -n "$P" ] && AD="secim_$(date -u +%H%M%S)"
          echo "rapor_ad=$AD" >> "$GITHUB_ENV"
          python scripts/etsy/wp_saat80_uretim.py --pairs-file _work/drafts.csv --shard ${{ matrix.shard }} --shards ${{ inputs.shards }} \
            --license _work/LICENSE.txt --calib _work/calib --masters _work/masters --pilot _work/pilot --pairs-only "$P" \
            --work _work --report "_work/rapor/saat80_$AD.csv" --limit ${{ inputs.limit }} 2>&1 | grep -v '^ *"' | tee _work/parca.log
      - name: Rapor
        if: ${{ always() }}
        run: |
          set -euo pipefail
          [ -f "_work/rapor/saat80_$rapor_ad.csv" ] && rclone copyto "_work/rapor/saat80_$rapor_ad.csv" "gdrive:ASTROLOVE/TEMP/WP_SAAT80_URETIM_$rapor_ad.csv" || true
          { echo '```'; tail -n 25 _work/parca.log 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: saat80-parca-${{ matrix.shard }}
          path: |
            _work/rapor
            _work/parca.log
          if-no-files-found: ignore
      - name: Temizlik
        if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

  ozet:
    needs: [uretim]
    if: ${{ always() && needs.uretim.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Ozet + 5 ornek cift linkleri
        run: |
          set -euo pipefail
          mkdir -p _work/csv
          # tum kosularin raporlari (parca0-3 + secim_*) Drive'dan; cift bazinda birlestirilir (PASS varsa PASS)
          rclone copy "gdrive:ASTROLOVE/TEMP" _work/csv --include "WP_SAAT80_URETIM_parca*.csv" --include "WP_SAAT80_URETIM_secim_*.csv" --max-depth 1
          rclone copyto "gdrive:ASTROLOVE/TEMP/WA_WP_DRAFTS_STATE.csv" _work/drafts.csv
          python3 - <<'PY' | tee _work/ozet.txt
          import csv, glob, random
          pairs = [r[0].strip() for r in csv.reader(open("_work/drafts.csv")) if r and r[0].strip() and r[0] != "pair"]
          eds = ["Midnight_Blue", "Deep_Black", "Champagne_Ivory", "Warm_Parchment"]
          son = {}
          for f in sorted(glob.glob("_work/csv/*.csv")):
              for r in csv.DictReader(open(f)):
                  if r["pair"] not in son or son[r["pair"]]["durum"] != "PASS":
                      son[r["pair"]] = r
          rows = [son[p] for p in pairs if p in son]
          ok = [r for r in rows if r["durum"] == "PASS"]
          eksik = [p for p in pairs if p not in son]
          mx = max((int(r[f"zip_{e}"] or 0) for r in ok for e in eds), default=0)
          print(f"cift {len(pairs)}, raporlanan {len(rows)}, PASS {len(ok)}, ZIP {4*len(ok)}/{4*len(pairs)}, SET07 {len(ok)}/{len(pairs)}, en buyuk ZIP {mx/1e6:.2f} MB ({'<20MB' if mx < 20*1024*1024 else 'ASIYOR'})")
          for r in rows:
              if r["durum"] != "PASS": print("  FAIL", r["pair"], r["durum"])
          for p in eksik: print("  EKSIK", p)
          random.seed(80)
          sec = random.sample([r["pair"] for r in ok], min(5, len(ok)))
          open("_work/ornek5.txt", "w").write("\n".join(sec) + "\n")
          print("ornek 5 cift:", ", ".join(sec))
          print("SONUC B:", "PASS" if len(ok) == len(pairs) else "FAIL")
          PY
          G=gdrive:ASTROLOVE
          rclone purge "$G/TEMP/SAAT80_ORNEK_5" 2>/dev/null || true
          rclone mkdir "$G/TEMP/SAAT80_ORNEK_5"
          while read -r p; do
            [ -z "$p" ] && continue; UP=$(echo "$p" | tr '[:lower:]' '[:upper:]')
            rclone copy "$G/WALLPAPER/MOCKUP_V2/$UP" "$G/TEMP/SAAT80_ORNEK_5" --include "WA_MOCKUP_V2_SET07_${p}_FINAL.jpg"
            rclone copy "$G/WALLPAPER/FINAL_V2/$UP" "$G/TEMP/SAAT80_ORNEK_5" --include "AstroLove_${p}_*_Watch.jpg"
          done < _work/ornek5.txt
          n=$({ rclone lsf --files-only "$G/TEMP/SAAT80_ORNEK_5" || true; } | wc -l); echo "ornek dosya: $n"; test "$n" -gt 0
          fid="$(rclone lsjson "$G/TEMP" --dirs-only | python3 -c "import json,sys; print([r['ID'] for r in json.load(sys.stdin) if r['Name']=='SAAT80_ORNEK_5'][0])")"
          # ::add-mask:: satiri (erisim jetonu) rapora yazilmaz
          python scripts/pinterest/pin_media_perms.py --mode grant --folder-id "$fid" --pattern "_" --expect "$n" --apply | grep -v '::add-mask::' | tee -a _work/ozet.txt
          rclone copyto _work/ozet.txt "$G/TEMP/WP_SAAT80_URETIM_OZET.txt"
          { echo '```'; cat _work/ozet.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -q "SONUC B: PASS" _work/ozet.txt
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: saat80-ozet
          path: _work/ozet.txt
          if-no-files-found: ignore
      - name: Temizlik
        if: ${{ always() }}
        run: rm -rf _work _art ~/.config/rclone

name: yd-kapak-qc
# YD (1st Anniversary) 78 kapak olcumlu QC (plan v3 adim 4; Merkez 27 Eki). ETSY API YOK, Etsy'ye yazma yok, kilit yok, Canva yok.
# Girdi: Drive TEMP/YD_KAPAK_V1/<kapak_damga>/KAPAK_<CIFT>.jpg (yd-kapak-tasi ciktisi); kaynak gorseller (KAPAK_KAYNAK.csv tur=yd
# kaynak_url, etsystatic CDN, 2400x3000) bu isde indirilir.
#   mod olc    : 3 onayli ornek + pilot kopyasi (SAGITTARIUS_SAGITTARIUS, CAPRICORN_SAGITTARIUS, ARIES_LEO, CANCER_LIBRA) ->
#                OLCUM.json (kutu / kirp / olcek / NCC + sapma). SABLON.json bundan Merkez / Serdar onayiyla kurulur.
#   mod kontrol: 78 kapak -> QC_RAPOR.json + QC_RAPOR.md + KONTAK.jpg. esik_id bossa durum OLCUM (PASS yok).
# Cikti: Drive TEMP/YD_KAPAK_V1/<kapak_damga>/QC_<damga>/. scripts/kapak78/yd_kapak_qc.py
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      kapak_damga: {description: "TEMP/YD_KAPAK_V1/<damga> (YYYYMMDD_HHMMSS)", required: true}
      mod: {description: "olc | kontrol", required: true, default: "olc"}
      sablon_id: {description: "kontrol: Drive SABLON.json id (kutu, kaynak_kirp, maske)", required: false, default: ""}
      sahne_ref_id: {description: "kontrol: Drive onay anindaki sablon kapak goruntusu id (2400x2400)", required: false, default: ""}
      metin_kapi_id: {description: "kontrol: Drive METIN_KAPI.tsv id", required: false, default: ""}
      esik_id: {description: "kontrol: Drive ESIK.json id (poster_min, sahne_min; Serdar onayli); bos = OLCUM", required: false, default: ""}
jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Girdi kapisi
        env: {KD: "${{ inputs.kapak_damga }}", MOD: "${{ inputs.mod }}", SB: "${{ inputs.sablon_id }}", SR: "${{ inputs.sahne_ref_id }}",
              MK: "${{ inputs.metin_kapi_id }}", ES: "${{ inputs.esik_id }}"}
        run: |
          set -euo pipefail
          [[ "$KD" =~ ^[0-9]{8}_[0-9]{6}$ && "$MOD" =~ ^(olc|kontrol)$ ]] || { echo "::error::girdi"; exit 1; }
          for x in "$SB" "$SR" "$MK" "$ES"; do [[ "$x" =~ ^([A-Za-z0-9_-]{20,80})?$ ]] || { echo "::error::girdi id"; exit 1; }; done
          if [ "$MOD" = kontrol ]; then [ -n "$SB" ] && [ -n "$SR" ] && [ -n "$MK" ] || { echo "::error::kontrol: sablon_id + sahne_ref_id + metin_kapi_id gerekli"; exit 1; }; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q pillow==11.0.0 numpy==2.1.3 opencv-python-headless==4.10.0.84 requests==2.34.2
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || { sudo apt-get install -y -qq rclone >/dev/null; }
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Girdiler (Drive + CDN; Etsy API yok)
        env: {KD: "${{ inputs.kapak_damga }}", MOD: "${{ inputs.mod }}", SB: "${{ inputs.sablon_id }}", SR: "${{ inputs.sahne_ref_id }}",
              MK: "${{ inputs.metin_kapi_id }}", ES: "${{ inputs.esik_id }}"}
        run: |
          set -euo pipefail
          mkdir -p _work/kapak _work/kaynak
          rclone copy "gdrive:ASTROLOVE/TEMP/YD_KAPAK_V1/$KD" _work/kapak --include "KAPAK_*.jpg" --max-depth 1 --transfers 8 -q
          echo "kapak: $(ls _work/kapak | wc -l)"
          if [ "$MOD" = kontrol ]; then
            rclone backend copyid gdrive: "$SB" _work/SABLON.json -q
            rclone backend copyid gdrive: "$SR" _work/sahne_ref.jpg -q
            rclone backend copyid gdrive: "$MK" _work/METIN_KAPI.tsv -q
            if [ -n "$ES" ]; then rclone backend copyid gdrive: "$ES" _work/ESIK.json -q; fi
          fi
          python3 - <<'EOF'
          import csv, pathlib, requests, time
          from concurrent.futures import ThreadPoolExecutor
          rows = [r for r in csv.DictReader(open("docs/yd_kapak/KAPAK_KAYNAK.csv", encoding="utf-8")) if r["tur"] == "yd"]
          def al(r):
              p = pathlib.Path("_work/kaynak") / f"{r['kaynak_image_id']}.jpg"
              for i in range(4):
                  try:
                      g = requests.get(r["kaynak_url"], timeout=90); g.raise_for_status(); p.write_bytes(g.content); return None
                  except Exception as e:  # noqa: BLE001
                      if i == 3:
                          return f"{r['cift']}: {type(e).__name__}"
                      time.sleep(2 ** i)
          hata = [h for h in ThreadPoolExecutor(8).map(al, rows) if h]
          print(f"kaynak: {len(rows) - len(hata)}/{len(rows)}", "; ".join(hata[:5]))
          if hata:
              raise SystemExit(1)
          EOF
          echo "DAMGA=$(date -u +%Y%m%d_%H%M%S)" >> "$GITHUB_ENV"
      - name: QC
        env: {MOD: "${{ inputs.mod }}"}
        run: |
          set -euo pipefail
          mkdir -p _out
          k() { python3 -c "import csv,sys; print([r['kaynak_image_id'] for r in csv.DictReader(open('docs/yd_kapak/KAPAK_KAYNAK.csv')) if r['tur']=='yd' and r['cift']==sys.argv[1]][0])" "$1"; }
          if [ "$MOD" = olc ]; then
            A=()
            for c in SAGITTARIUS_SAGITTARIUS CAPRICORN_SAGITTARIUS ARIES_LEO CANCER_LIBRA; do
              A+=(--kapak "_work/kapak/KAPAK_$c.jpg" --kaynak "_work/kaynak/$(k $c).jpg"); done
            python3 scripts/kapak78/yd_kapak_qc.py olc "${A[@]}" --out _out/OLCUM.json
          else
            E=(); [ -f _work/ESIK.json ] && E=(--esik _work/ESIK.json)
            python3 scripts/kapak78/yd_kapak_qc.py kontrol --kapak-dir _work/kapak --kaynak-dir _work/kaynak --kaynak-csv docs/yd_kapak/KAPAK_KAYNAK.csv \
              --ciftler data/pod/yd78_ids.csv --sablon _work/SABLON.json --sahne-ref _work/sahne_ref.jpg --metin-kapi _work/METIN_KAPI.tsv "${E[@]}" --out _out
          fi
      - name: Drive'a yaz
        if: ${{ always() }}
        env: {KD: "${{ inputs.kapak_damga }}"}
        run: |
          set -euo pipefail
          if ls _out/* >/dev/null 2>&1; then
            rclone copy _out "gdrive:ASTROLOVE/TEMP/YD_KAPAK_V1/$KD/QC_${DAMGA:?}" --immutable -q
            echo "Cikti: TEMP/YD_KAPAK_V1/$KD/QC_${DAMGA}"
            [ -f _out/QC_RAPOR.md ] && head -12 _out/QC_RAPOR.md >> "$GITHUB_STEP_SUMMARY" || true
          fi
      - if: always()
        run: rm -rf _work _out ~/.config/rclone

name: ornament-78-ornek
# Merkez / Serdar 3 Kas, karar 28: ornament ornek uretimi Actions'ta (kaynaklar yalniz Drive'dan; depo public, kaynaklar ve kaynak kirpimlari depoya girmez).
# YALNIZ dal ornament-printful-katalog; tetik docs/ornament/ORNEK78_TETIK.txt degisince push.
# Serdar 4 Kas O1 + "a" (KOVA DUZELTME): yalniz CANCER_LIBRA (kontrol) + AQUARIUS_PISCES; once kaynak leke kapisi testi (bilinen PASS + FAIL;
#   FAIL ise uretim yok), uretim (kenar_onar kaydi + onarimsiz motor + yakin planlar), gercek boy olcek kontrolu (300 dpi).
# Cikti: Drive TEMP/ORNAMENT_KOVA_DUZELTME_<damga>/ (954 PNG + RAPOR/ + YAKIN/ kaynak kirpimlari + ETIKET_O2.txt); dala yalniz kucuk rapor (JSON, log,
#   onizleme). Etsy / Printful / silme yok.
on:
  push:
    branches: [ornament-printful-katalog]
    paths: [docs/ornament/ORNEK78_TETIK.txt]
permissions:
  contents: write
jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DAL: ornament-printful-katalog
      MOTOR_COMMIT: 6da763aa5b9820027420f73264fc69d30e120a33
      TEK_DOKU_COMMIT: 2a08a78216ca19dd632e7dedda31c4c53c365c25
      ACIK_COMMIT: 28774956a2561c9776dca0d1484c8a17b81f6aac
      ONAY_COMMIT: 6daab364816e4c4b8602258b9b8d8bec28231cfc
      O5: docs/ornament/ornek/ORNAMENT_5STIL_20261103_1539
      ANA_KLASOR: 1ZQGR0fI0HQNq1D2Lbmr2qlkNVbD8jRyD
      BURC_KLASOR: 1j9TBPj86_5njsmf_t0v6tczuwcDyLuXu
    steps:
      # hafif checkout (Merkez 3 Kas: tam gecmis 41 dk takildi, kosu 41682303288 iptal): sig, blobsuz, yalniz gereken yollar
      - uses: actions/checkout@v4
        with:
          ref: ornament-printful-katalog
          fetch-depth: 1
          lfs: false
          filter: blob:none
          sparse-checkout: |
            scripts/printful
            docs/ornament/zemin3/V2
          path: s
      - name: Damga (Drive / dal klasor adi; ilk adim, her adimda tanimli)
        run: echo "D=ORNAMENT_KOVA_DUZELTME_$(date -u +%Y%m%d_%H%M)_${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
      - name: Gereken commit'ler (sig, blobsuz; git show dosyalari tek tek indirir)
        run: |
          set -euo pipefail
          for c in $MOTOR_COMMIT $TEK_DOKU_COMMIT $ACIK_COMMIT $ONAY_COMMIT; do git -C s fetch -q --depth 1 --filter=blob:none origin $c; done
          git -C s log --oneline -1 HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Paketler (yerel uretimle ayni surumler)
        run: |
          pip install -q pillow==11.0.0 numpy==2.5.4 opencv-python-headless==5.0.0.93 scipy==1.18.1 scikit-image==0.26.0 potracer==0.0.4
          python3 -c "import sys, numpy, cv2, PIL, scipy, skimage; print('python', sys.version.split()[0], 'numpy', numpy.__version__, 'cv2', cv2.__version__, 'pillow', PIL.__version__, 'scipy', scipy.__version__, 'skimage', skimage.__version__)" | tee /tmp/paket.txt
          lscpu | grep -E 'Model name' | tee -a /tmp/paket.txt
      - name: rclone kur + yapilandir
        timeout-minutes: 5
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || sudo apt-get install -y -qq rclone >/dev/null
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Girdiler (Drive + git), sha ve Drive md5 kapisi
        run: |
          set -euo pipefail
          K=/tmp/kay; MD=/tmp/mg; ZE=/tmp/zemin; mkdir -p $K $MD/kure $MD/palet $MD/girdi78/ana $ZE
          for c in CANCER_LIBRA ARIES_ARIES CAPRICORN_SAGITTARIUS AQUARIUS_PISCES GEMINI_VIRGO LEO_SCORPIO; do
            rclone copy "gdrive:" "$K/" --drive-root-folder-id "$ANA_KLASOR" --include "${c}_ana.png" -q; done
          for b in aquarius aries cancer capricorn gemini leo libra pisces sagittarius scorpio taurus virgo; do
            rclone copy "gdrive:" "$K/" --drive-root-folder-id "$BURC_KLASOR" --include "${b}_symbol_gold.png" -q; done
          # Drive md5 ile butunluk (Drive kaydi)
          { rclone md5sum "gdrive:" --drive-root-folder-id "$ANA_KLASOR" --include "*_ana.png" --max-depth 1;
            rclone md5sum "gdrive:" --drive-root-folder-id "$BURC_KLASOR" --include "*_symbol_gold.png" --max-depth 1; } > /tmp/drive_md5.txt
          (cd $K && md5sum *_ana.png *_symbol_gold.png) > /tmp/yerel_md5.txt
          python3 - <<'PY'
          d = {l.split()[1]: l.split()[0] for l in open('/tmp/drive_md5.txt') if l.strip()}
          y = {l.split()[1]: l.split()[0] for l in open('/tmp/yerel_md5.txt') if l.strip()}
          bad = [f for f in y if d.get(f) != y[f]]
          print('drive md5 karsilastirma', len(y), 'dosya, uyusmayan', bad)
          assert not bad and len(y) == 18, 'DUR: Drive md5 uyusmuyor ya da dosya eksik'
          PY
          for f in motor/varlik/halka/HALKA_BLUE_16x20.png motor/font/Cinzel.ttf motor/font/EBGaramond-Italic.ttf motor/tek_doku.py; do
            git -C s show "$TEK_DOKU_COMMIT:$f" > "$K/$(basename $f)"; done
          for f in BEIGE_1264.png AGED_PAPYRUS_1264.png; do git -C s show $ACIK_COMMIT:zemin_acik/$f > $K/$f; done
          cp s/docs/ornament/zemin3/V2/RUBY_1264.png s/docs/ornament/zemin3/V2/SAPPHIRE_1264.png s/docs/ornament/zemin3/V2/EMERALD_1264.png $K/
          git -C s show $MOTOR_COMMIT:motor_gpt/girdi/LOGO_1.png > $K/LOGO_1.png
          git -C s show $MOTOR_COMMIT:motor_gpt/girdi78/ana/cancer_libra_alfa.png > $K/cancer_libra_alfa.png
          git -C s show $MOTOR_COMMIT:motor_gpt/alfa_ogeler.npz > $K/alfa_ogeler.npz
          for f in KILIT_GPTGIRDI.json golge_motor.py vektor_yuzey.py alfa_temizle.py uret_tam.py renk_uyum.py olustur_alfa_sablon.py kure/k4.npy palet/chatgpt_altin.png yerlesim78.json cember.json; do
            git -C s show $MOTOR_COMMIT:motor_gpt/$f > $MD/$f; done
          for c in cancer_libra aries_aries capricorn_sagittarius aquarius_pisces gemini_virgo leo_scorpio; do
            git -C s show $MOTOR_COMMIT:motor_gpt/girdi78/ana/${c}_alfa.png > $MD/girdi78/ana/${c}_alfa.png; done
          for r in RUBY SAPPHIRE EMERALD; do git -C s show $ONAY_COMMIT:docs/ornament/ornek/ORNAMENT_KOYU_G1/ON_OLCUM_ELIPS/${r}_ELIPS_1264.png > $ZE/${r}_1264.png; done
          mkdir -p /tmp/onayli; for r in RUBY SAPPHIRE EMERALD SADE_ALTIN FILDISI; do git -C s show $ONAY_COMMIT:$O5/CANCER_LIBRA_${r}_954.png > /tmp/onayli/CANCER_LIBRA_${r}_954.png; done
          cat > /tmp/beklenen.txt <<'EOF'
          e86c2629629305fd90bbb66494238faef9b4ad1acb815eb7b3ed55e7f44fc2d2  /tmp/kay/CANCER_LIBRA_ana.png
          2b5a32121ce8fa92ceef1a386f5ab1742a573681c30e742223be75005816cf28  /tmp/kay/cancer_symbol_gold.png
          6fe2d0355ee56f8468eb637d3ca6445fd517983b00e51bce76cac218864f6a4b  /tmp/kay/libra_symbol_gold.png
          e80d6d3fca82e2804865c887277c06bc8e958175e254b1f2d289eaeba03c9044  /tmp/zemin/RUBY_1264.png
          0d3213f8b592392aa69a3cdcd127d893a6fd2ef3d94e5913cf94ee96f4afb941  /tmp/zemin/SAPPHIRE_1264.png
          0c232cfc155ba2cbfd34cb92c6f72ffdb0fbbc54570ac9a8e987efdfdcd7f787  /tmp/zemin/EMERALD_1264.png
          2a11ac819c611eaa84e60e469316f345eaa8eb48f6e9e6113d9a7831ab2fa410  /tmp/kay/HALKA_BLUE_16x20.png
          62239238b25dbc5417dab4dc353fdbf15129599c9372737d5d8ddb86b3042061  /tmp/kay/LOGO_1.png
          1889906fb29920e9294d5c343ace09b2295d81e4c49153d2badfb8d5101ddbad  /tmp/kay/tek_doku.py
          f4d83d34d1f6c741193e4acf4b3dff9531e5a67b6aa65228d00a7db72a4e0f34  /tmp/kay/Cinzel.ttf
          bba2c4499c93c9612b90b9825d32b07da52fce2fe57562a1eb6b833553f93c4e  /tmp/kay/EBGaramond-Italic.ttf
          EOF
          sed -i 's/^ *//' /tmp/beklenen.txt
          sha256sum -c /tmp/beklenen.txt | tee /tmp/girdi_sha.txt
          (cd $K && sha256sum *_ana.png *_symbol_gold.png) | sed 's|  |  kaynak/|' | tee -a /tmp/girdi_sha.txt
          (cd $MD && find . -type f | sort | xargs sha256sum) | sed 's|  \./|  motor_gpt/|' | tee -a /tmp/girdi_sha.txt
          cat /tmp/drive_md5.txt >> /tmp/girdi_sha.txt
      - name: Kaynak leke kapisi testi (bilinen PASS + bilinen FAIL; FAIL ise uretim yok)
        id: kapi
        run: |
          set -euo pipefail
          mkdir -p /tmp/rapor
          cd s
          python3 -I scripts/printful/kova_kapi_testi.py --pass /tmp/kay/cancer_symbol_gold.png /tmp/kay/libra_symbol_gold.png \
            --pass_ana /tmp/kay/CANCER_LIBRA_ana.png --kaynak /tmp/kay/aquarius_symbol_gold.png /tmp/kay/pisces_symbol_gold.png \
            --ana /tmp/kay/AQUARIUS_PISCES_ana.png --kenar_zorunlu aquarius --cikti /tmp/rapor 2>&1 | tee /tmp/log_kapi_testi.txt
          echo "kt=0" >> "$GITHUB_OUTPUT"
      - name: Uretim (CANCER_LIBRA kontrol + AQUARIUS_PISCES, 5 stil)
        id: uretim
        env:
          ORNEK78_CIFTLER: CANCER_LIBRA,AQUARIUS_PISCES
          ORNEK78_DRIVE_EK: /tmp/drive_ek
          GERCEK_BOY_CIFTLER: AQUARIUS_PISCES
        run: |
          set +e
          set -uo pipefail
          mkdir -p /tmp/son_yok /tmp/png /tmp/drive_ek
          cd s
          python3 -I scripts/printful/ornek78.py --kaynak /tmp/kay --motor /tmp/mg --zemin /tmp/zemin \
            --son /tmp/son_yok --onayli /tmp/onayli \
            --cikti /tmp/png --rapor /tmp/rapor --font /tmp/kay/EBGaramond-Italic.ttf 2>&1 | tee /tmp/log_ornek78.txt
          k=${PIPESTATUS[0]}; echo "k=$k" >> "$GITHUB_OUTPUT"
          kp=$(python3 -c "import json; print(json.load(open('/tmp/rapor/OLCUM.json')).get('kontrol_pass'))" 2>/dev/null || echo None); echo "kp=$kp" >> "$GITHUB_OUTPUT"
          echo "::notice::ornek78 cikis $k | $(tail -1 /tmp/log_ornek78.txt | cut -c1-200)"
          exit 0                                                             # cikis kodu k ciktisinda; sonraki adimlar her durumda calisir (Serdar 4 Kas B)
      - name: Gercek boy olcek kontrolu (300 dpi, kesim r 449; PASS/FAIL)
        id: gb
        if: always() && steps.uretim.outcome == 'success'
        run: |
          set +e
          ls /tmp/rapor/GERCEK_BOY_*_300dpi.png /tmp/rapor/*GERCEK_BOY_300dpi.png 2>/dev/null
          cd s
          python3 -I scripts/printful/gercek_boy_kontrol.py $(ls /tmp/rapor/*GERCEK_BOY*_300dpi.png 2>/dev/null) --json /tmp/rapor/GERCEK_BOY_KONTROL.json 2>&1 | tee /tmp/log_gercek_boy.txt
          gb=${PIPESTATUS[0]}; echo "gb=$gb" >> "$GITHUB_OUTPUT"; echo "::notice::gercek boy kontrol cikis $gb"
          exit 0
      - name: Drive (her durumda; 954 PNG, RAPOR, YAKIN, ETIKET_O2)
        id: drive
        if: always()
        run: |
          set -euo pipefail
          T="gdrive:ASTROLOVE/TEMP/$D"
          n=$(ls /tmp/png/*_954.png 2>/dev/null | wc -l); echo "954 PNG $n"
          if [ "$n" -gt 0 ]; then rclone copy /tmp/png "$T" --include "/*_954.png" --max-depth 1 -q; else echo "::error::eksik: 954 PNG yok"; fi
          for f in OLCUM.json ONIZLEME_76mm_6CIFT.png KOVA_KAPI_TESTI.json KENAR_ONARIM.json GERCEK_BOY_AQUARIUS_PISCES_SADE_3KOYU_300dpi.png GERCEK_BOY_KONTROL.json; do
            if [ -f /tmp/rapor/$f ]; then rclone copyto /tmp/rapor/$f "$T/RAPOR/$f" -q; else echo "::error::eksik: $f"; fi; done
          ny=$(ls /tmp/drive_ek/YAKIN_*.png 2>/dev/null | wc -l); echo "YAKIN $ny"
          if [ "$ny" -gt 0 ]; then rclone copy /tmp/drive_ek "$T/YAKIN" --include "/YAKIN_*.png" --max-depth 1 -q; else echo "::error::eksik: YAKIN_*.png"; fi
          for f in /tmp/log_kapi_testi.txt /tmp/log_ornek78.txt /tmp/log_gercek_boy.txt; do
            if [ -f $f ]; then rclone copyto $f "$T/RAPOR/$(basename $f)" -q; fi; done
          if python3 -c "import json,sys; json.load(open('/tmp/rapor/OLCUM.json'))['cift']['AQUARIUS_PISCES']['sade']['carpan_L']" 2>/dev/null; then
            python3 - <<'PY' > /tmp/ETIKET_O2.txt
          import json
          c = str(json.load(open('/tmp/rapor/OLCUM.json'))['cift']['AQUARIUS_PISCES']['sade']['carpan_L']).replace('.', ',')
          print(f'SADE_ALTIN: O2 BEKLIYOR (koyulaştırma L x {c}), onay örneği değil')
          PY
            rclone copyto /tmp/ETIKET_O2.txt "$T/ETIKET_O2.txt" -q; cat /tmp/ETIKET_O2.txt
          else echo "::error::eksik: ETIKET_O2 (AQUARIUS_PISCES SADE olcumu yok)"; fi
          rclone lsjson gdrive:ASTROLOVE/TEMP --dirs-only > /tmp/temp_dirs.json
          ID=$(python3 -c "import json; m=[d['ID'] for d in json.load(open('/tmp/temp_dirs.json')) if d['Name']=='$D']; assert len(m)==1, m; print(m[0])")
          echo "$D https://drive.google.com/drive/folders/$ID" | tee /tmp/drive_link.txt
          rclone ls "$T" | tee -a /tmp/drive_link.txt
          echo "::notice::Drive TEMP/$D id $ID ($(rclone ls "$T" | wc -l) dosya)"
      - name: Dal (kucuk rapor; PNG ve kaynak kirpimi yok)
        if: always()
        run: |
          set -euo pipefail
          G=s/docs/ornament/ornek/$D; mkdir -p $G
          for f in OLCUM.json ONIZLEME_76mm_6CIFT.png KOVA_KAPI_TESTI.json KENAR_ONARIM.json GERCEK_BOY_KONTROL.json; do
            if [ -f /tmp/rapor/$f ]; then cp /tmp/rapor/$f $G/; else echo "::error::eksik: $f"; fi; done
          for f in /tmp/girdi_sha.txt /tmp/paket.txt /tmp/log_kapi_testi.txt /tmp/log_ornek78.txt /tmp/log_gercek_boy.txt /tmp/drive_link.txt /tmp/ETIKET_O2.txt; do
            if [ -f $f ]; then cp $f $G/; fi; done
          cd s && git config user.name "astrolove-bot" && git config user.email "astrolove-bot@users.noreply.github.com"
          git add --sparse docs/ornament/ornek
          DIS=$(git diff --cached --name-only | grep -v '^docs/ornament/ornek/' || true)
          [ -z "$DIS" ] || { echo "::error::izinli klasor disi: $DIS"; exit 1; }
          if git diff --cached --name-only | grep -E '_954\.png$|YAKIN_|_symbol_gold|_ana\.png$'; then echo "::error::dala PNG / kaynak kirpimi yazilmaz"; exit 1; fi
          git commit -qm "ornament kova duzeltme (kosu ${GITHUB_RUN_ID}): kapi testi ${{ steps.kapi.outcome }}, ornek78 ${{ steps.uretim.outputs.k }}, gercek boy ${{ steps.gb.outputs.gb }}" && git push -q origin "HEAD:${DAL}"
      - if: always()
        run: rm -rf ~/.config/rclone
      - name: Sonuc
        if: always()
        run: 'echo "kapi testi ${{ steps.kapi.outcome }} drive ${{ steps.drive.outcome }} ornek78 cikis ${{ steps.uretim.outputs.k }} gercek boy ${{ steps.gb.outputs.gb }}"; [ "${{ steps.kapi.outcome }}" = "success" ] && [ "${{ steps.uretim.outputs.k }}" = "0" ] && [ "${{ steps.gb.outputs.gb }}" = "0" ] && [ "${{ steps.drive.outcome }}" = "success" ]'

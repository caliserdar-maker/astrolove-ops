name: printify-fiyat-oku
# Printify FIYAT OKUMA (13 Eki 2026, Serdar onayi): katalog + shipping + taslak urun cost (olustur-oku-SIL). SIPARIS / PUBLISH YOK.
# Anahtar Drive TEMP/PRINTIFY_API_KEY.txt (gecici; is bitince cope atilir, bu dosya main'den kaldirilir). Zamanlama YOK.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oku:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Kurulum
        run: |
          set -euo pipefail
          pip install -q requests==2.32.3
          curl -fsSL -o /tmp/rc.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q -j /tmp/rc.zip '*/rclone' -d /tmp/rcb && sudo install -m 755 /tmp/rcb/rclone /usr/local/bin/rclone
          python3 -m py_compile scripts/printify/printify_fiyat_oku.py scripts/guvenlik/log_suz.py
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true; fi
      - name: Fiyat oku (katalog + taslak cost, siparis/publish YOK)
        id: oku
        run: |
          set +e -uo pipefail
          umask 077; mkdir -p _work _out
          K=$(rclone cat "gdrive,root_folder_id=12N9iS2i4byMbkH5c0Inmni_nIv2zyTzH:PRINTIFY_API_KEY.txt" | tr -d '[:space:]')
          echo "::add-mask::$K"; [ -n "$K" ] || { echo "::error::anahtar bos"; exit 1; }
          PRINTIFY_API_KEY="$K" python3 scripts/printify/printify_fiyat_oku.py _out 2>&1 | tee _work/log.txt; RC=${PIPESTATUS[0]}
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Taslak temizle + dogrula (her zaman)
        if: ${{ always() }}
        id: temiz
        run: |
          set +e -uo pipefail
          umask 077; mkdir -p _work _out
          K=$(rclone cat "gdrive,root_folder_id=12N9iS2i4byMbkH5c0Inmni_nIv2zyTzH:PRINTIFY_API_KEY.txt" | tr -d '[:space:]')
          echo "::add-mask::$K"; [ -n "$K" ] || { echo "::error::anahtar bos"; exit 1; }
          PRINTIFY_API_KEY="$K" python3 scripts/printify/printify_fiyat_oku.py _out --temizle 2>&1 | tee -a _work/log.txt; RC=${PIPESTATUS[0]}
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Drive'a yaz (her zaman)
        if: ${{ always() }}
        run: |
          set +e -uo pipefail
          K=$(rclone cat "gdrive,root_folder_id=12N9iS2i4byMbkH5c0Inmni_nIv2zyTzH:PRINTIFY_API_KEY.txt" | tr -d '[:space:]')
          echo "::add-mask::$K"
          if [ -n "$K" ] && grep -rqF "$K" _out _work/log.txt; then echo "::error::ciktida anahtar var, Drive'a yazilmaz"; exit 1; fi
          grep -E "^(OZET|HATA|katalog|cerceve renkleri|UYARI|magaza)" _work/log.txt | head -9 | sed 's/^/::warning::/'
          python3 scripts/guvenlik/log_suz.py < _work/log.txt > _out/PRINTIFY_LOG.txt
          N=$(python3 scripts/guvenlik/log_suz.py --say < _out/PRINTIFY_LOG.txt); [ "$N" = "0" ] || { echo "::error::log temizlenemedi"; exit 1; }
          R="gdrive:ASTROLOVE/TEMP/PRINTIFY_FIYAT_20261013"; rclone mkdir "$R"
          rclone copy _out "$R" -q && rclone check _out "$R" --one-way -q && echo "Drive PASS"
          rclone lsjson "$R" | python3 -c "import json,sys;[print('::warning::DOSYA',d['Name'],d['ID']) for d in json.load(sys.stdin)]"
          [ "${{ steps.oku.outputs.rc }}" = "0" ] && [ "${{ steps.temiz.outputs.rc }}" = "0" ] || { echo "::error::oku=${{ steps.oku.outputs.rc }} temizle=${{ steps.temiz.outputs.rc }}"; exit 1; }
      - if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

name: kart-determinizm
# Kupa kart determinizm KANITI (Serdar 31 Eki karar 8a + onay 3: farkli burclu en az 2 cift, AVX512'li ve AVX512'siz kosucu). ETSY YOK. Matris 4 is (ayri
# kosucular; ubuntu-24.04 ve ubuntu-latest imaji) kupa_kart78 uret --sahne-tut; her ara dosyanin (gorunum, baski, zemin z_ / k_, kart) sha256'si + kosucu CPU bilgisi + gece
# dosyasiyla piksel farki (yer: satir / sutun kutusu) Drive TEMP/KART_DETERMINIZM/<damga>/ (SHA_<is>.json, OZET.json). Kart Drive'a yazilmaz.
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      ciftler: {description: "virgullu ciftler (Serdar 31 Eki onay 3: farkli burclu en az 2)", required: true, default: "CANCER_LIBRA,ARIES_VIRGO"}
      gece: {description: "TEMP/KUPA_KART78/<damga> (kiyas)", required: true, default: "20261030_203327"}
      env_ek: {description: "uretime eklenecek ortam (orn. OPENCV_CPU_DISABLE=AVX512_SKX); bos = yok", required: false, default: ""}
jobs:
  uret:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {is: u2404a, os: ubuntu-24.04}
          - {is: u2404b, os: ubuntu-24.04}
          - {is: u2404c, os: ubuntu-24.04}
          - {is: u2404d, os: ubuntu-24.04}     # 4 is: AVX512'li ve AVX512'siz kosucu ayni kosuda gelsin (kiyas isi denetler)
    steps:
      - name: Girdi kapisi
        env: {C: "${{ inputs.ciftler }}", G: "${{ inputs.gece }}", E: "${{ inputs.env_ek }}"}
        run: '[[ "$C" =~ ^[A-Z]+_[A-Z]+(,[A-Z]+_[A-Z]+)*$ && "$G" =~ ^[0-9]{8}_[0-9]{6}$ && "$E" =~ ^([A-Z_0-9]+=[A-Za-z_0-9,]+( [A-Z_0-9]+=[A-Za-z_0-9,]+)*)?$ ]] || { echo "::error::girdi"; exit 1; }'
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: ac9aa7185f9d7b07903f0cb99e7f366f425a631c, path: _kupa, sparse-checkout: kupa_uretim/sembol}
      - uses: actions/checkout@v4
        with: {ref: 0196e37a0447d61eab42b84778a56d9261b0b201, path: _ko, sparse-checkout: kupa_orchard}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: kurulum (kupa-kart78 ile ayni surumler)
        run: |
          dpkg -s libfribidi0 >/dev/null 2>&1 || sudo apt-get install -y -qq libfribidi0 >/dev/null
          pip install -q pillow==11.0.0 numpy==2.1.3 opencv-python-headless==4.10.0.84
          python3 -m venv _v12 && _v12/bin/pip install -q numpy==2.5.3 pillow==12.3.0 scipy==1.18.1 opencv-python-headless==5.0.0.93
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || { sudo apt-get install -y -qq rclone >/dev/null; }
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: uret + sha
        env: {C: "${{ inputs.ciftler }}", G: "${{ inputs.gece }}", E: "${{ inputs.env_ek }}", IS: "${{ matrix.is }}"}
        run: |
          set -euo pipefail
          echo "$C" | tr ',' '\n' > _c.txt
          mkdir -p _gece _r
          for c in $(cat _c.txt); do rclone copy "gdrive:ASTROLOVE/TEMP/KUPA_KART78/$G" _gece --include "${c}_K0*.jpg" --max-depth 1 -q; done
          env $E python3 scripts/kapak78/kupa_kart78.py uret --ciftler _c.txt --ko _ko/kupa_orchard --sembol-kok _kupa/kupa_uretim/sembol \
            --v12 _v12/bin/python3 --is _s --out _o --sahne-tut
          for c in $(cat _c.txt); do
            mkdir -p "_ok/$c" && cp _o/${c}_K0*.jpg "_ok/$c/"
            python3 scripts/kapak78/kart_determinizm.py sha --is "_s/$c" --out-kart "_ok/$c" --gece _gece --etiket "$IS" --json "_r/SHA_${c}_${IS}.json"
          done
          echo "DAMGA=$(date -u +%Y%m%d)_${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with: {name: "sha-${{ matrix.is }}", path: "_r/SHA_*.json", retention-days: 3}
      - name: Drive'a yaz
        if: always()
        run: |
          if ls _r/* >/dev/null 2>&1; then rclone copy _r "gdrive:ASTROLOVE/TEMP/KART_DETERMINIZM/${DAMGA:-x}" -q; fi
          echo "::notice title=KART DETERMINIZM::TEMP/KART_DETERMINIZM/${DAMGA:-x}/"
      - if: always()
        run: rm -rf _s _o _ok _gece ~/.config/rclone
  kiyas:
    needs: uret
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/download-artifact@v4
        with: {pattern: "sha-*", merge-multiple: true, path: _r}
      - name: Kiyas (cift basina tum isler ayni + en az bir AVX512'li ve bir AVX512'siz kosucu)
        env: {C: "${{ inputs.ciftler }}"}
        run: |
          set -uo pipefail
          python3 - "$C" <<'EOF' | tee OZET.txt
          import json, glob, subprocess, sys
          ok = True
          for c in sys.argv[1].split(","):
              fs = sorted(glob.glob(f"_r/SHA_{c}_*.json"))
              R = [json.load(open(f)) for f in fs]
              avx = [("avx512f" in (r["cpu"].get("simd") or [])) for r in R]
              k = subprocess.run([sys.executable, "scripts/kapak78/kart_determinizm.py", "kiyas", *fs], capture_output=True, text=True)
              cpu = [(r["etiket"], r["cpu"].get("model"), a) for r, a in zip(R, avx)]
              cesit = any(avx) and not all(avx)
              print(c, "is", len(R), "kiyas", "PASS" if k.returncode == 0 else "FAIL", "avx512 cesitli", cesit, cpu)
              print(" kart sha:", {r["etiket"]: {n: h[:12] for n, h in r["kart"].items()} for r in R})
              ok &= k.returncode == 0 and len(R) >= 2 and cesit
          print("SONUC", "PASS" if ok else "FAIL (sha farkli ya da kosucu cesitliligi yok; yeniden kosun)")
          sys.exit(0 if ok else 1)
          EOF
          echo "KOD=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
      - name: Drive'a yaz
        if: always()
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || { sudo apt-get install -y -qq rclone >/dev/null; }
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            export RCLONE_CONFIG_GDRIVE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET"; fi
          rclone copyto OZET.txt "gdrive:ASTROLOVE/TEMP/KART_DETERMINIZM/$(date -u +%Y%m%d)_${GITHUB_RUN_ID}/OZET_KIYAS.txt" -q
          rm -rf ~/.config/rclone
          [ "${KOD:-1}" = 0 ] || { echo "::error::kart determinizm FAIL (OZET_KIYAS.txt)"; exit 1; }

name: video-kapak-basa

# Reel videolarinin basina 0.5 sn kapak (Serdar onayi 15 Eki 2026; sosyal-kapak-oku 38700285414 uzerine).
# sosyal/video_v9/kapak_basa.py: FINAL/<cift>-astroloveart-reel.mp4 + KAPAK/<cift>-astroloveart-kapak.jpg -> sert kesme,
# muzik 0.5 sn kaydirilir, v9 x264 ayarlari, QC (ilk kare = kapak < 2.0, kare/sure/LUFS, <= 60 sn) PASS/FAIL.
# mod ornek : cift= (virgulle) -> Drive TEMP/VIDEO_V9_20261012/KAPAKLI_ORNEK/ (video + ilk kare + 8.5 sn karesi + QC json).
# mod hepsi : 78 video -> TEMP/VIDEO_V9_20261012/FINAL_KAPAKLI/ + KAPAKLI_QC.csv. FINAL/ ve KAPAK/ DEGISMEZ.
# Metricool'a / platformlara YAZMA YOK.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      mod:
        type: choice
        options: [ornek, hepsi]
        default: ornek
      cift:
        description: 'ornek: dosya on eki (ornek capricorn-and-libra), virgulle'
        default: capricorn-and-libra

jobs:
  kapak_basa:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      D: gdrive:ASTROLOVE/TEMP/VIDEO_V9_20261012
    steps:
      - uses: actions/checkout@v4
      - name: Paketler
        run: |
          pip install -q numpy==2.1.3 pillow==11.0.0
          sudo apt-get -qq update >/dev/null && sudo apt-get install -y -qq ffmpeg >/dev/null
          echo "::warning::CPU $(nproc), $(ffmpeg -version | head -1 | cut -d' ' -f1-3)"
      - name: rclone
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true; fi
      - name: Kapak basa + QC
        env:
          MOD: ${{ inputs.mod }}
          CIFT: ${{ inputs.cift }}
        run: |
          set +e -uo pipefail
          mkdir -p _w/v _w/k _o
          if [ "$MOD" = hepsi ]; then
            rclone copy "$D/FINAL" _w/v -q --include "*-astroloveart-reel.mp4" --transfers 8
            rclone copy "$D/KAPAK" _w/k -q --include "*-astroloveart-kapak.jpg" --transfers 8
            HEDEF="$D/FINAL_KAPAKLI"
          else
            for c in ${CIFT//,/ }; do
              rclone copyto "$D/FINAL/$c-astroloveart-reel.mp4" "_w/v/$c-astroloveart-reel.mp4" -q
              rclone copyto "$D/KAPAK/$c-astroloveart-kapak.jpg" "_w/k/$c-astroloveart-kapak.jpg" -q
            done
            HEDEF="$D/KAPAKLI_ORNEK"
          fi
          ls _w/v/*.mp4 > _w/liste.txt; N=$(wc -l < _w/liste.txt); i=0; F=0; T0=$(date +%s)
          [ "$MOD" != hepsi ] || [ "$N" = 78 ] || { echo "::error::FINAL'de 78 video yok ($N)"; exit 1; }
          while read -r v; do
            i=$((i + 1)); b=$(basename "$v" -astroloveart-reel.mp4); k="_w/k/$b-astroloveart-kapak.jpg"
            if [ ! -f "$k" ]; then echo "::error::kapak yok $b"; F=$((F + 1)); continue; fi
            python3 sosyal/video_v9/kapak_basa.py --video "$v" --kapak "$k" --cikis "_o/$b-astroloveart-reel.mp4" --qc "_o/$b-kapakli-qc.json" | tail -1
            [ "${PIPESTATUS[0]}" = 0 ] || F=$((F + 1))
            if [ "$MOD" != hepsi ]; then
              ffmpeg -v error -y -i "_o/$b-astroloveart-reel.mp4" -vf "select=eq(n\,0)" -vsync 0 -frames:v 1 -q:v 2 "_o/$b-ilk-kare.jpg"
              ffmpeg -v error -y -ss 8.5 -i "_o/$b-astroloveart-reel.mp4" -frames:v 1 -q:v 2 "_o/$b-kare-8.5sn.jpg"
            fi
            G=$(( $(date +%s) - T0 )); echo "ILERLEME $i/$N %$(( 100 * i / N )) gecen ${G} sn kalan $(( G * (N - i) / i )) sn FAIL $F"
          done < _w/liste.txt
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import csv, glob, json
          q = [json.load(open(f)) for f in sorted(glob.glob('_o/*-kapakli-qc.json'))]
          alan = ['cikis', 'sonuc', 'ilk_kare_fark', 'son_kapak_fark', 'kayma_fark', 'kare_once', 'kare_sonra', 'video_sn_sonra',
                  'ses_sn_sonra', 'toplam_sn', 'bayt_once', 'bayt_sonra', 'lufs_once', 'lufs_sonra', 'uretim_sn']
          with open('_o/KAPAKLI_QC.csv', 'w', newline='') as f:
              w = csv.DictWriter(f, alan, extrasaction='ignore'); w.writeheader(); [w.writerow(x) for x in q]
          for x in q:
              print(' | '.join(f'{a}={x.get(a)}' for a in alan))
          print(f"OZET {sum(x['sonuc'] == 'PASS' for x in q)}/{len(q)} PASS")
          EOF
          rclone copy _o "$HEDEF" -q --transfers 8
          rclone lsl "$HEDEF" | tail -20
          [ "$F" = 0 ] || { echo "::error::$F video FAIL"; exit 1; }
      - if: always()
        run: rm -rf ~/.config/rclone _w

name: router-sku-test

# SALT OKUMA: CL (4570143815) canli envanteri (1 GET) ile order_router sahte siparis testi.
# Siparis OLUSTURULMAZ, Prodigi'ye cagri YOK. Prodigi SKU'lari Drive katalog CSV'sinde aranir.

permissions:
  actions: read
  contents: read

on:
  workflow_dispatch: {}


jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 135
    steps:
      - uses: actions/checkout@v4
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: |
          set -euo pipefail
          pip install -q -r requirements.txt
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Token + katalog
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
          rclone copyto "gdrive:ASTROLOVE/TEMP/PRODIGI/KATALOG/CERCEVE_KATALOG.csv" _work/katalog.csv
          echo "katalog satiri: $(wc -l < _work/katalog.csv)"
      - name: CL canli envanter (1 GET, salt okuma)
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, "scripts/etsy")
          from etsy_common import Etsy, TokenStore, mask
          k, s = os.environ["ETSY_API_KEY"], os.environ["ETSY_SHARED_SECRET"]; mask(k); mask(s)
          st = TokenStore(os.environ["TOKEN_FILE"], k, s)
          if st.needs_refresh(): st.refresh()
          api = Etsy(st)
          inv = api.get("/listings/4570143815/inventory") or {}
          json.dump(inv, open("_work/cl_inv.json", "w"))
          print(f"CL canli urun: {len(inv.get('products') or [])} | kota {api.remaining}")
          PY
      - name: Router sahte siparis testi
        run: |
          set -euo pipefail
          python scripts/prodigi/test_router_sku_v3.py --inv _work/cl_inv.json --katalog _work/katalog.csv | tee _out/ROUTER_SKU_TEST.txt
          python scripts/pod/metin_78_uret.py _out/m78 $(tail -n +2 data/pod/pod78_ids.csv | cut -d, -f2) | tail -1
      - name: Token + cikti Drive'a
        if: ${{ always() }}
        run: |
          set -euo pipefail
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "Token geri yazildi" || true
          [ -f _out/ROUTER_SKU_TEST.txt ] && rclone copyto _out/ROUTER_SKU_TEST.txt "gdrive:ASTROLOVE/TEMP/ROUTER_SKU_TEST_$(date -u +%Y%m%d_%H%M).txt" -q || true
          [ -f _out/ROUTER_SKU_TEST.txt ] && { echo '```'; cat _out/ROUTER_SKU_TEST.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
      - name: Temizlik
        if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

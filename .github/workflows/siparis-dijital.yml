name: siparis-dijital

# DIJITAL musteri siparisi (Serdar 1 Eki 2026): 5 renk x 1 PDF (5 sayfa: 4x5, 3x4, 2x3, 11x14, A serisi), 300 dpi.
# MB / DB / PW / CI: siparis-baski-v1 (8a8b370) `dijital_uret` + pdf_kapisi.
# WARM PARCHMENT: ONAYLI BAKIR (Serdar 1 Eki WP PASS) - claude/wp-katman-baski-60sk0s adfb2b9, wp_kilit TAMAM
# olmadan uretilmez; eski gri-kahve WP teslim edilmez. Sayfalar ayni pdf_yap / pdf_kapisi ile PDF olur.
# Isim / mesaj loga yazilmaz (GITHUB_EVENT_PATH'ten okunur, ::add-mask::). Etsy'ye yazma / musteriye gonderim YOK.
# Cikti: Drive ASTROLOVE/TEMP/SIPARIS_ISIM/DIJITAL/<receipt>/ ; 11x14 kesit + onizleme: inceleme/siparis-<receipt> dali.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      receipt:
        description: "Etsy receipt (yalniz rakam)"
        required: true
      cift:
        description: "Cift (orn. CANCER_LEO)"
        required: true
      isim1:
        description: "isim1 (sol burc alti)"
        required: true
      isim2:
        description: "isim2 (sag burc alti)"
        required: true
      mesaj_b64:
        description: "mesaj, base64 (UTF-8)"
        required: true
      isler:
        description: "yalniz bu isler (orn. renk:DEEP_BLACK,wp:24x36); bos = hepsi"
        required: false
        default: ""
      onceki_kosu:
        description: "PASS isleri bu kosularin artifact'lerinden al (run id'ler, bosluklu; sonraki oncekinin ustune)"
        required: false
        default: ""
      renk_ref:
        description: "MB/DB/PW/CI kodu (siparis-baski-v1 commit)"
        required: false
        default: "8a8b370edb74cb52402b4939d38ba14d2d2105fd"
      wp_pod_kod:
        description: "WP duz renk (CI/MB) baskisi kodu: v1 = renk_ref (kilitli WP dosyalari ayni; varsayilan, 1 Eki hiz + A2/16x20 duz renk); wp = wp-katman dalinin siparis_dosyasi"
        required: false
        default: "v1"

concurrency: siparis-dijital-${{ github.event.inputs.receipt }}-${{ github.event.inputs.isler }}

env:
  RENK_REF: ${{ github.event.inputs.renk_ref || '8a8b370edb74cb52402b4939d38ba14d2d2105fd' }}
  WP_REF: adfb2b99489798296936669575309b777c7e1ca7

jobs:
  plan:
    # Test 2 dersleri (Serdar 1 Eki): cift alfabetik normalize (isimler yer degistirir) + HIZLI KAYNAK DENETIMI
    # (POD_PRINT / PLATES iki rclone listesiyle; eksikse plan FAIL, hicbir is acilmaz). Kod: scripts/siparis_dijital/plan.py
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      renk: ${{ steps.p.outputs.renk }}
      sayfa: ${{ steps.p.outputs.sayfa }}
      sayfa_var: ${{ steps.p.outputs.sayfa_var }}
      wp: ${{ steps.p.outputs.wp }}
      cift: ${{ steps.p.outputs.cift }}
      normalize: ${{ steps.p.outputs.normalize }}
    steps:
      - name: Girdi denetimi + maske
        run: |
          set -euo pipefail
          for k in isim1 isim2; do v=$(jq -r ".inputs.$k" "$GITHUB_EVENT_PATH"); echo "::add-mask::$v"; echo "::add-mask::${v^^}"; done
          m=$(jq -r '.inputs.mesaj_b64' "$GITHUB_EVENT_PATH" | base64 -d); echo "::add-mask::$m"
          jq -re '.inputs.receipt | test("^[0-9]+$")' "$GITHUB_EVENT_PATH" >/dev/null || { echo "HATA: receipt rakam olmali" >&2; exit 1; }
          jq -re '.inputs.cift | test("^[A-Z]+_[A-Z]+$")' "$GITHUB_EVENT_PATH" >/dev/null || { echo "HATA: cift" >&2; exit 1; }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: scripts/siparis_dijital
      - name: rclone (dogrudan ikili; kurulum betigi + man sayfalari yok)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/rc.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q -j /tmp/rc.zip '*/rclone' -d /tmp/rcb && sudo install -m 755 /tmp/rcb/rclone /usr/local/bin/rclone
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONF_B64:-}" ]; then echo "HATA: RCLONE_CONF_B64 yok" >&2; exit 1; fi
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - id: p
        name: Cift normalize + kaynak denetimi + is matrisi
        run: |
          set -euo pipefail
          python3 scripts/siparis_dijital/plan.py >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone

  renk:
    needs: plan
    if: ${{ needs.plan.outputs.renk != '[]' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        renk: ${{ fromJSON(needs.plan.outputs.renk) }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Girdi denetimi + maske
        run: |
          set -euo pipefail
          for k in isim1 isim2; do v=$(jq -r ".inputs.$k" "$GITHUB_EVENT_PATH"); echo "::add-mask::$v"; echo "::add-mask::${v^^}"; done
          m=$(jq -r '.inputs.mesaj_b64' "$GITHUB_EVENT_PATH" | base64 -d); echo "::add-mask::$m"
          jq -re '.inputs.receipt | test("^[0-9]+$")' "$GITHUB_EVENT_PATH" >/dev/null || { echo "HATA: receipt rakam olmali" >&2; exit 1; }
          jq -re '.inputs.cift | test("^[A-Z]+_[A-Z]+$")' "$GITHUB_EVENT_PATH" >/dev/null || { echo "HATA: cift" >&2; exit 1; }
          for k in isim1 isim2; do jq -re --arg k "$k" '.inputs[$k] | test("^[A-Za-z][A-Za-z -]{0,19}$")' "$GITHUB_EVENT_PATH" >/dev/null || { echo "HATA: $k bicimi" >&2; exit 1; }; done
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Kod (siparis-baski-v1)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RENK_REF }}
          path: _kod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python bagimliliklari
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pillow opencv-python-headless numpy fonttools img2pdf pikepdf
      - name: rclone kur
        run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONF_B64:-}" ]; then echo "HATA: RCLONE_CONF_B64 yok" >&2; exit 1; fi
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Dijital uret (${{ matrix.renk }})
        run: |
          python scripts/siparis_dijital/surucu.py --asama renk --renk "${{ matrix.renk }}" --kod _kod \
            --kod-ref "siparis-baski-v1 $RENK_REF" --cikti "out/renk/${{ matrix.renk }}"
      - name: Inceleme dalina ekle (bu isin kesitleri)
        if: ${{ always() }}
        env:
          TOKEN: ${{ github.token }}
          PARCA: out/renk/${{ matrix.renk }}/inceleme
        run: |
          set -uo pipefail
          REC=$(jq -r '.inputs.receipt' "$GITHUB_EVENT_PATH"); [[ "$REC" =~ ^[0-9]+$ ]] || exit 1
          ls "$PARCA" 2>/dev/null | grep -q . || { echo "kesit yok"; exit 0; }
          B="inceleme/siparis-$REC"; U="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          G=(-c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com")
          for i in 1 2 3 4 5 6; do
            rm -rf _inc
            if git clone -q --depth 1 --branch "$B" "$U" _inc 2>/dev/null; then :; else
              git init -q _inc && git -C _inc checkout -q --orphan "$B" && git -C _inc remote add origin "$U"; fi
            mkdir -p _inc/kontrol && cp "$PARCA"/* _inc/kontrol/
            git -C _inc "${G[@]}" add kontrol
            git -C _inc "${G[@]}" commit -qm "siparis $REC: ${{ github.job }} kesitleri" || { echo "degisiklik yok"; exit 0; }
            if git -C _inc push -q origin "HEAD:refs/heads/$B"; then echo "dal: $B $(git -C _inc rev-parse --short HEAD)"; exit 0; fi
            sleep $((RANDOM % 8 + 3))
          done
          echo "HATA: dala push edilemedi" >&2; exit 1
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: renk_${{ matrix.renk }}
          path: out/renk/${{ matrix.renk }}
          retention-days: 2
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone

  sayfa:
    needs: plan
    if: ${{ needs.plan.outputs.sayfa_var == '1' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.sayfa) }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Girdi denetimi + maske
        run: |
          set -euo pipefail
          for k in isim1 isim2; do v=$(jq -r ".inputs.$k" "$GITHUB_EVENT_PATH"); echo "::add-mask::$v"; echo "::add-mask::${v^^}"; done
          m=$(jq -r '.inputs.mesaj_b64' "$GITHUB_EVENT_PATH" | base64 -d); echo "::add-mask::$m"
          jq -re '.inputs.receipt | test("^[0-9]+$")' "$GITHUB_EVENT_PATH" >/dev/null || { echo "HATA: receipt rakam olmali" >&2; exit 1; }
          jq -re '.inputs.cift | test("^[A-Z]+_[A-Z]+$")' "$GITHUB_EVENT_PATH" >/dev/null || { echo "HATA: cift" >&2; exit 1; }
          for k in isim1 isim2; do jq -re --arg k "$k" '.inputs[$k] | test("^[A-Za-z][A-Za-z -]{0,19}$")' "$GITHUB_EVENT_PATH" >/dev/null || { echo "HATA: $k bicimi" >&2; exit 1; }; done
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Kod (siparis-baski-v1)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RENK_REF }}
          path: _kod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python bagimliliklari
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pillow opencv-python-headless numpy fonttools img2pdf pikepdf
      - name: rclone kur
        run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONF_B64:-}" ]; then echo "HATA: RCLONE_CONF_B64 yok" >&2; exit 1; fi
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Dijital sayfa (${{ matrix.renk }} ${{ matrix.oran }})
        run: |
          python scripts/siparis_dijital/surucu.py --asama sayfa --renk "${{ matrix.renk }}" --oran "${{ matrix.oran }}" --kod _kod \
            --kod-ref "siparis-baski-v1 $RENK_REF" --cikti "out/renk/${{ matrix.renk }}"
      - name: Inceleme dalina ekle (bu isin kesitleri)
        if: ${{ always() }}
        env:
          TOKEN: ${{ github.token }}
          PARCA: out/renk/${{ matrix.renk }}/inceleme
        run: |
          set -uo pipefail
          REC=$(jq -r '.inputs.receipt' "$GITHUB_EVENT_PATH"); [[ "$REC" =~ ^[0-9]+$ ]] || exit 1
          ls "$PARCA" 2>/dev/null | grep -q . || { echo "kesit yok"; exit 0; }
          B="inceleme/siparis-$REC"; U="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          G=(-c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com")
          for i in 1 2 3 4 5 6; do
            rm -rf _inc
            if git clone -q --depth 1 --branch "$B" "$U" _inc 2>/dev/null; then :; else
              git init -q _inc && git -C _inc checkout -q --orphan "$B" && git -C _inc remote add origin "$U"; fi
            mkdir -p _inc/kontrol && cp "$PARCA"/* _inc/kontrol/
            git -C _inc "${G[@]}" add kontrol
            git -C _inc "${G[@]}" commit -qm "siparis $REC: ${{ github.job }} kesitleri" || { echo "degisiklik yok"; exit 0; }
            if git -C _inc push -q origin "HEAD:refs/heads/$B"; then echo "dal: $B $(git -C _inc rev-parse --short HEAD)"; exit 0; fi
            sleep $((RANDOM % 8 + 3))
          done
          echo "HATA: dala push edilemedi" >&2; exit 1
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: sayfa_${{ matrix.renk }}__${{ matrix.oran }}
          path: out/renk/${{ matrix.renk }}
          retention-days: 2
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone

  wp:
    needs: plan
    if: ${{ needs.plan.outputs.wp != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        boy: ${{ fromJSON(needs.plan.outputs.wp) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Girdi denetimi + maske
        run: |
          set -euo pipefail
          for k in isim1 isim2; do v=$(jq -r ".inputs.$k" "$GITHUB_EVENT_PATH"); echo "::add-mask::$v"; echo "::add-mask::${v^^}"; done
          m=$(jq -r '.inputs.mesaj_b64' "$GITHUB_EVENT_PATH" | base64 -d); echo "::add-mask::$m"
          jq -re '.inputs.receipt | test("^[0-9]+$")' "$GITHUB_EVENT_PATH" >/dev/null || { echo "HATA: receipt rakam olmali" >&2; exit 1; }
          jq -re '.inputs.cift | test("^[A-Z]+_[A-Z]+$")' "$GITHUB_EVENT_PATH" >/dev/null || { echo "HATA: cift" >&2; exit 1; }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Kod (wp-katman BAKIR)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WP_REF }}
          path: _wp
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python bagimliliklari
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pillow opencv-python-headless numpy fonttools img2pdf pikepdf
      - name: Kod (siparis-baski-v1; yalniz wp_pod_kod=v1)
        if: ${{ (github.event.inputs.wp_pod_kod || 'v1') == 'v1' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RENK_REF }}
          path: _v1
      - name: WP kilidi (wp_kilit testi)
        run: cd _wp && python scripts/medya_v1/test_wp_kilit.py
      - name: WP kilitli dosyalari v1 kodunun ustune (yalniz wp_pod_kod=v1)
        if: ${{ (github.event.inputs.wp_pod_kod || 'v1') == 'v1' }}
        run: |
          # 1 Eki (siparis 4188621967 WP A2): WP dalinin pod_uret'inde olcek ikinci denemesi yok -> CI A2 'olcek' FAIL,
          # duz renk MB'ye dustu (a_renk / f_kabartma / g_kontrast FAIL). Bakir kodu (kilitli dosyalar) AYNEN kopyalanir,
          # duz renk baskisi uretimdeki POD koduyla (renk_ref) yapilir. Kilit v1 kopyasinda da dogrulanir.
          set -euo pipefail
          for f in wp_bakir.py wp_katman.py wp_ornek.py wp_kilit.py wp_kilit.json wp_tani.py test_wp_kilit.py; do
            [ -e "_v1/scripts/medya_v1/$f" ] && { echo "HATA: $f v1'de zaten var" >&2; exit 1; }
            cp "_wp/scripts/medya_v1/$f" "_v1/scripts/medya_v1/$f"
          done
          (cd _v1 && python scripts/medya_v1/test_wp_kilit.py)
      - name: rclone kur
        run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONF_B64:-}" ]; then echo "HATA: RCLONE_CONF_B64 yok" >&2; exit 1; fi
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Takas alani (buyuk boy bellek; cikti degismez)
        if: ${{ matrix.boy == '24x36' || matrix.boy == 'A2' }}
        run: |
          set -euo pipefail
          free -g; df -h /mnt | tail -1
          sudo fallocate -l 32G /mnt/takas2 && sudo chmod 600 /mnt/takas2 && sudo mkswap /mnt/takas2 >/dev/null && sudo swapon /mnt/takas2
          free -g
      - name: WP BAKIR sayfa (${{ matrix.boy }})
        run: |
          if [ "${{ github.event.inputs.wp_pod_kod || 'v1' }}" = "v1" ]; then KOD=_v1; REF="claude/wp-katman-baski-60sk0s $WP_REF + siparis-baski-v1 $RENK_REF"
          else KOD=_wp; REF="claude/wp-katman-baski-60sk0s $WP_REF"; fi
          python scripts/siparis_dijital/surucu.py --asama wp --boy "${{ matrix.boy }}" --kod "$KOD" \
            --kod-ref "$REF" --cikti "out/wp/${{ matrix.boy }}"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: wp_${{ matrix.boy }}
          path: |
            out/wp/${{ matrix.boy }}/WP_${{ matrix.boy }}.jpg
            out/wp/${{ matrix.boy }}/OZET_WP_${{ matrix.boy }}.json
          retention-days: 2
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone

  paket:
    # Test 2 dersi (Serdar 1 Eki): paket = musteri PDF'leri + OZET Drive'a, bitti (hedef <= 1 dk). KONTROL / kesit /
    # onizleme 'inceleme' isinde (paket'ten sonra). Plan FAIL (eksik kaynak) ise paket de kosmaz.
    needs: [plan, renk, sayfa, wp]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - name: Girdi + maske
        run: |
          set -euo pipefail
          for k in isim1 isim2; do v=$(jq -r ".inputs.$k" "$GITHUB_EVENT_PATH"); echo "::add-mask::$v"; echo "::add-mask::${v^^}"; done
          m=$(jq -r '.inputs.mesaj_b64' "$GITHUB_EVENT_PATH" | base64 -d); echo "::add-mask::$m"
          r=$(jq -r '.inputs.receipt' "$GITHUB_EVENT_PATH"); [[ "$r" =~ ^[0-9]+$ ]] || exit 1
          echo "REC=$r" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: "Kod (wp-katman: pdf_yap / pdf_kapisi)"
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WP_REF }}
          path: _wp
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow opencv-python-headless numpy fonttools img2pdf pikepdf
      - name: Onceki kosularin artifact'leri (PASS isler)
        if: ${{ github.event.inputs.onceki_kosu != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          K=$(jq -r '.inputs.onceki_kosu' "$GITHUB_EVENT_PATH")
          i=0
          for r in $K; do
            [[ "$r" =~ ^[0-9]+$ ]] || { echo "HATA: run id" >&2; exit 1; }
            i=$((i+1)); gh run download "$r" -R "$GITHUB_REPOSITORY" -D "out/a0_$i" || echo "uyari: $r artifact yok"
          done
      - uses: actions/download-artifact@v4
        with:
          path: out/a1
      - name: Artifact yerlesimi (bu kosu oncekinin ustune)
        run: |
          set -euo pipefail
          mkdir -p out/renk out/wp out/eski out/a1
          for k in $(ls -d out/a0_* 2>/dev/null | sort -t_ -k2 -n | xargs -r -n1 basename) a1; do
            for d in out/$k/renk_*; do [ -d "$d" ] || continue; n=${d#out/$k/renk_}
              if [ -d "out/renk/$n" ]; then rm -rf "out/eski/$n"; mv "out/renk/$n" "out/eski/$n"; fi
              mv "$d" "out/renk/$n"; echo "renk $n <- $k"; done
            for d in out/$k/wp_*; do [ -d "$d" ] || continue; n=${d#out/$k/wp_}; rm -rf "out/wp/$n"; mv "$d" "out/wp/$n"; echo "wp $n <- $k"; done
            ilk=""                                     # sayfa matrisi parcalari: bu kosunun parcalari eski rengin yerine
            for d in out/$k/sayfa_*; do [ -d "$d" ] || continue; x=${d#out/$k/sayfa_}; n=${x%%__*}
              case " $ilk " in *" $n "*) ;; *) ilk="$ilk $n"
                if [ -d "out/renk/$n" ]; then rm -rf "out/eski/$n"; mv "out/renk/$n" "out/eski/$n"; fi; mkdir -p "out/renk/$n";; esac
              cp -r "$d"/. "out/renk/$n/"; rm -f "out/renk/$n/OZET_$n.json" "out/renk/$n/KAPI_RAPORU_$n.json"; echo "sayfa $x <- $k"; done
          done
      - name: WP PDF + ozet + kesitler
        id: pdf
        run: |
          set +e
          python scripts/siparis_dijital/surucu.py --asama pdf --kod _wp --cikti out; rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          ls -la out/paket out/inceleme
          exit 0
      - name: rclone (dogrudan ikili)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/rc.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q -j /tmp/rc.zip '*/rclone' -d /tmp/rcb && sudo install -m 755 /tmp/rcb/rclone /usr/local/bin/rclone
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Drive (TEMP/SIPARIS_ISIM/DIJITAL/<receipt>) - musteri PDF'leri + OZET
        run: |
          set -euo pipefail
          H="gdrive:ASTROLOVE/TEMP/SIPARIS_ISIM/DIJITAL/$REC"
          # MARKA ADI (1 Eki): yeni paket AstroLoveArt_*.pdf ise eski adli PDF'ler silinmez, _ESKI_AD/ altina tasinir
          if ls out/paket/AstroLoveArt_*.pdf >/dev/null 2>&1; then
            rclone move "$H" "$H/_ESKI_AD" --include '/AstroLove_*.pdf' || true
          fi
          # 64M parca: WP PDF (~77 MB) 8M parcalarla ~10 sirali istek; olculen yukleme 7-113 sn oynuyordu (Test 2 dersi 3)
          rclone copy out/paket "$H" --transfers 8 --drive-chunk-size 64M --stats 10s --stats-one-line -v 2>&1 | grep -v NOTICE
          echo "drive: TEMP/SIPARIS_ISIM/DIJITAL/$REC"
      - name: Inceleme parcalari (ayri isin girdisi; Drive'a 'inceleme' isi yukler)
        if: ${{ always() }}
        run: |
          set -euo pipefail
          # yalniz kucuk parcalar (kesitler + ozet / kapi json); buyuk KONTROL klasorleri renk / sayfa / wp
          # artifact'lerinden 'inceleme' isinde dogrudan alinir (paket yeniden yuklemez)
          mkdir -p out/inc_paket/renk out/inc_paket/wp
          [ -d out/inceleme ] && cp -r out/inceleme out/inc_paket/inceleme || true
          for r in out/renk/*; do [ -d "$r" ] || continue; n=$(basename "$r"); mkdir -p "out/inc_paket/renk/$n"
            cp "$r"/OZET_*.json "$r"/KAPI_RAPORU_*.json "out/inc_paket/renk/$n/" 2>/dev/null || true; done
          for w in out/wp/*; do [ -d "$w" ] || continue; cp "$w"/OZET_WP_*.json out/inc_paket/wp/ 2>/dev/null || true; done
          du -sh out/inc_paket
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: inceleme_paket
          path: out/inc_paket
          retention-days: 2
          compression-level: 0
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone
      - name: Sonuc
        run: test "${{ steps.pdf.outputs.rc }}" = "0"

  inceleme:
    # Test 2 dersi: inceleme kesitleri / onizlemeler / KONTROL paketten AYRI (musteri PDF'lerini bekletmez)
    needs: [plan, paket]
    if: ${{ always() && needs.paket.result != 'skipped' && needs.paket.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Girdi + maske
        run: |
          set -euo pipefail
          for k in isim1 isim2; do v=$(jq -r ".inputs.$k" "$GITHUB_EVENT_PATH"); echo "::add-mask::$v"; echo "::add-mask::${v^^}"; done
          m=$(jq -r '.inputs.mesaj_b64' "$GITHUB_EVENT_PATH" | base64 -d); echo "::add-mask::$m"
          r=$(jq -r '.inputs.receipt' "$GITHUB_EVENT_PATH"); [[ "$r" =~ ^[0-9]+$ ]] || exit 1
          echo "REC=$r" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: inceleme_paket
          path: out
      - name: KONTROL klasorleri (renk / sayfa / wp artifact'leri)
        uses: actions/download-artifact@v4
        with:
          pattern: "{renk,sayfa}_*"
          path: out/a
      - name: rclone (dogrudan ikili)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/rc.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q -j /tmp/rc.zip '*/rclone' -d /tmp/rcb && sudo install -m 755 /tmp/rcb/rclone /usr/local/bin/rclone
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Drive KONTROL (kesit / onizleme / kapi raporlari)
        run: |
          set -euo pipefail
          H="gdrive:ASTROLOVE/TEMP/SIPARIS_ISIM/DIJITAL/$REC/KONTROL"
          for r in out/renk/*; do [ -d "$r" ] || continue; rclone copy "$r" "$H/$(basename "$r")" --transfers 8; done
          for d in out/a/renk_* out/a/sayfa_*; do [ -d "$d/KONTROL" ] || continue
            n=$(basename "$d"); n=${n#renk_}; n=${n#sayfa_}; n=${n%%__*}
            rclone copy "$d/KONTROL" "$H/$n/KONTROL" --transfers 8; done
          [ -d out/wp ] && rclone copy out/wp "$H/WARM_PARCHMENT" --transfers 8 || true
          [ -d out/inceleme ] && rclone copy out/inceleme "$H/INCELEME_11x14" --transfers 8 || true
          echo "drive: TEMP/SIPARIS_ISIM/DIJITAL/$REC/KONTROL"
      - name: Inceleme dalina ekle (paket kesitleri)
        env:
          TOKEN: ${{ github.token }}
          PARCA: out/inceleme
        run: |
          set -uo pipefail
          ls "$PARCA" 2>/dev/null | grep -q . || { echo "kesit yok"; exit 0; }
          B="inceleme/siparis-$REC"; U="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          G=(-c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com")
          for i in 1 2 3 4 5 6; do
            rm -rf _inc
            if git clone -q --depth 1 --branch "$B" "$U" _inc 2>/dev/null; then :; else
              git init -q _inc && git -C _inc checkout -q --orphan "$B" && git -C _inc remote add origin "$U"; fi
            mkdir -p _inc/kontrol && cp "$PARCA"/* _inc/kontrol/
            git -C _inc "${G[@]}" add kontrol
            git -C _inc "${G[@]}" commit -qm "siparis $REC: paket kesitleri" || { echo "degisiklik yok"; exit 0; }
            if git -C _inc push -q origin "HEAD:refs/heads/$B"; then echo "dal: $B $(git -C _inc rev-parse --short HEAD)"; exit 0; fi
            sleep $((RANDOM % 8 + 3))
          done
          echo "HATA: dala push edilemedi" >&2; exit 1
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone

name: etsy-arama-oku

# SALT OKUR (Etsy'ye yazma YOK): 78 aktif ilanin baslik/etiket/kategori/nitelik/malzeme/stil dokumu.
# etsy-arama oturumu (10 Eki 2026). Cikti: Drive ASTROLOVE/TEMP/ETSY_ARAMA_20261010/canli/

permissions:
  actions: read
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [claude/keen-curie-2hza60]
    paths:
      - config/etsy_arama_oku.trigger

jobs:
  oku:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Token
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
      - name: Guvenlik testi (yazma metodu yok)
        run: |
          set -euo pipefail
          if grep -nE "api\.(patch|put|post|delete|post_json|put_json|post_file)" scripts/etsy/arama_oku.py; then
            echo "::error::Salt-okur betikte yazma metodu bulundu"; exit 1
          fi
      - name: Oku (yalniz GET)
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          set -euo pipefail
          python scripts/etsy/arama_oku.py --out _out --expected-count 78 2>&1 | tee _work/kosu.log
      - name: Token geri yaz + cikti Drive'a
        if: always()
        run: |
          set -euo pipefail
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "Token geri yazildi" || echo "Token yenilenmedi"
          if grep -rqE '"(access_token|refresh_token)"[[:space:]]*:[[:space:]]*"[A-Za-z0-9._-]{20,}"|x-api-key[[:space:]]*:' _out/ 2>/dev/null; then
            echo "::error::Ciktida sir bulundu; Drive'a yazilmadi"; exit 1
          fi
          [ -f _work/kosu.log ] && python3 scripts/guvenlik/log_suz.py < _work/kosu.log > _out/kosu_log.txt || true
          rclone copy _out "gdrive:ASTROLOVE/TEMP/ETSY_ARAMA_20261010/canli" -q
          echo "Cikti: ASTROLOVE/TEMP/ETSY_ARAMA_20261010/canli/"
      - if: always()
        run: rm -rf _work ~/.config/rclone

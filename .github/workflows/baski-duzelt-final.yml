name: baski-duzelt-final

# baski-duzelt SON KOSU (28 Eyl 2026, Serdar genel onayi): plate yeniden uretimi + 3 cift x 5 renk x 13 boy.
# 1) plate: WP 13 boy, CI 8x10/12x16, MB 12x18/24x36/16x24/20x30 -> HAM medyan + Canva glif dolgusu;
#    QC (plate_uret temizlik kapilari + plate slogan kapisi) PASS ise PLATES'e yazilir, once YEDEK_20260928.
#    Sonra PLATE_DURUM (5 renk x 13 boy) yeniden olculur.
# 2) test: 3 cift x 5 renk x 13 boy TEST baski dosyalari YALNIZ Drive TEMP/BASKI_DUZELT_<damga>.
# Etsy/Prodigi secret'i YOK; musteriye teslim YOK. Ayni anda en fazla 3 is.

permissions:
  contents: read

on:
  push:
    branches: [claude/gracious-meitner-i72rkr]
    paths:
      - config/baski_duzelt_final.trigger

concurrency: baski-duzelt-final

jobs:
  damga:
    runs-on: ubuntu-latest
    outputs:
      kok: ${{ steps.d.outputs.kok }}
    steps:
      - id: d
        run: echo "kok=gdrive:ASTROLOVE/TEMP/BASKI_DUZELT_$(date -u +%Y%m%d_%H%M)" >> "$GITHUB_OUTPUT"

  plate:
    needs: damga
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      KOK: ${{ needs.damga.outputs.kok }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python bagimliliklari
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pillow opencv-python-headless numpy fonttools img2pdf pikepdf pytest
      - name: rclone kur
        run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONF_B64:-}" ]; then echo "HATA: RCLONE_CONF_B64 yok" >&2; exit 1; fi
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Birim testleri
        run: |
          set -euo pipefail
          python -c "import sys; sys.path.insert(0,'scripts/medya_v1'); import siparis_dosyasi as s; s.kisisel_hazirla()"
          export KISISEL_YOL="$PWD/_siparis/kisisel/scripts/kisisel"
          PYTHONPATH="$KISISEL_YOL:scripts/medya_v1:." python -m pytest -q scripts/medya_v1
      - name: Plate yenile (19 plate)
        run: |
          set -euo pipefail
          export KISISEL_YOL="$PWD/_siparis/kisisel/scripts/kisisel"
          PYTHONPATH="$KISISEL_YOL:scripts/medya_v1:." python scripts/medya_v1/plate_yenile.py --kok "$KOK" \
            --isler "VINTAGE:8x10,11x14,12x16,12x18,16x20,16x24,18x24,20x30,24x36,30x40,A4,A3,A2;MODERN:8x10,12x16;BLUE:12x18,24x36,16x24,20x30"
      - name: Plate durumu (5 renk x 13 boy)
        if: ${{ always() }}
        run: |
          set -euo pipefail
          python scripts/medya_v1/plate_durum.py --kok "$KOK"
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone

  test:
    needs: [damga, plate]
    if: ${{ always() && needs.plate.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        cift: [AQUARIUS_GEMINI, CANCER_LIBRA, ARIES_LIBRA]
    env:
      KOK: ${{ needs.damga.outputs.kok }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python bagimliliklari
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pillow opencv-python-headless numpy fonttools img2pdf pikepdf pytest
      - name: rclone kur
        run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONF_B64:-}" ]; then echo "HATA: RCLONE_CONF_B64 yok" >&2; exit 1; fi
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: 5 renk x 13 boy
        env:
          CIFT: ${{ matrix.cift }}
        run: |
          set -euo pipefail
          R="MIDNIGHT_BLUE,DEEP_BLACK,CHAMPAGNE_IVORY,PURE_WHITE,WARM_PARCHMENT"
          ISLER=""
          for B in 8x10 11x14 12x16 12x18 16x20 16x24 18x24 20x30 24x36 30x40 A4 A3 A2; do
            ISLER="${ISLER:+$ISLER;}$B:$R"
          done
          python scripts/medya_v1/baski_tani.py --cift "$CIFT" --kok "$KOK" --isler "$ISLER"
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone

  ozet:
    needs: [damga, test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KOK: ${{ needs.damga.outputs.kok }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python bagimliliklari
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pillow opencv-python-headless numpy fonttools img2pdf pikepdf pytest
      - name: rclone kur
        run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONF_B64:-}" ]; then echo "HATA: RCLONE_CONF_B64 yok" >&2; exit 1; fi
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Tablo
        run: |
          set -euo pipefail
          rclone copy "$KOK/_TANI" _tani --include "TANI_*.json" -q
          python scripts/medya_v1/baski_tani_ozet.py _tani
          rclone copy _tani "$KOK/_TANI" --include "TABLO.*" -q
          rclone copy "$KOK" _pd --include "PLATE_DURUM.md" -q && head -12 _pd/PLATE_DURUM.md || true
          echo "Drive: ${KOK#gdrive:}"
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone

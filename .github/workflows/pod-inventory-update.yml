name: pod-inventory-update

# POD ilani duzenlemesi (Mo 6 Eyl 2026): IS 1 Size etiketleri v3 + sira (tek updateListingInventory;
# SKU/fiyat/adet/gorunurluk korunur), IS 2 aciklama yalniz "✦ 13 SIZES" blogu (EN PATCH + RU PUT),
# IS 3 renk->gorsel dogrulama (fark varsa POST). dry_run=true yalniz tablolar/diff; false Etsy'ye YAZAR (onay).
# Kota quota_min altindaysa yazma yok. Metin kaynagi docs/POD_LISTING_TEMPLATE.md + pod_listing_create.SIZE_SPEC.

on:
  workflow_dispatch:
    inputs:
      listing_id:
        description: "POD ilan id"
        required: true
        default: "4570031205"
      pair:
        description: "Cift (aciklama sablonu icin)"
        required: true
        default: "ARIES_LEO"
      expected_images:
        description: "Renk=image_id listesi (bos = script sabiti, 11. kosu)"
        required: false
        default: ""
      dry_run:
        description: "true = yalniz tablo/diff; false = Etsy'ye YAZ"
        type: boolean
        default: true
      quota_min:
        description: "Kota tabani (altinda yazma yok)"
        required: false
        default: "400"

concurrency:
  group: etsy-token
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2 spylls
          mkdir -p dict
          curl -fsSL -o dict/ru_RU.dic https://raw.githubusercontent.com/LibreOffice/dictionaries/master/ru_RU/ru_RU.dic
          curl -fsSL -o dict/ru_RU.aff https://raw.githubusercontent.com/LibreOffice/dictionaries/master/ru_RU/ru_RU.aff
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
      - name: Token
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
      - name: Envanter guncelle
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          LID: ${{ inputs.listing_id }}
          PAIR: ${{ inputs.pair }}
          EXPECT: ${{ inputs.expected_images }}
          DRY_RUN: ${{ inputs.dry_run }}
          QMIN: ${{ inputs.quota_min }}
        run: |
          set -euo pipefail
          [ "$DRY_RUN" = "true" ] && mode=--dry-run || { echo "::warning::APPLY: envanter/aciklama Etsy'ye yazilacak ($LID)"; mode=--apply; }
          python scripts/etsy/pod_inventory_update.py --listing-id "$LID" --pair "$PAIR" --out _out --quota-min "${QMIN:-400}" \
            --ru-dict dict/ru_RU --expect-images "$EXPECT" "$mode"
      - name: Token/cikti Drive'a
        if: ${{ always() }}
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "Token geri yazildi" || true
          mode=$([ "$DRY_RUN" = "true" ] && echo DRYRUN || echo APPLY)
          stamp=$(TZ=Europe/Istanbul date +%Y%m%d_%H%M)
          [ -d _out ] && rclone copy _out "gdrive:ASTROLOVE/TEMP/POD_LISTING/INVENTORY_${mode}_${stamp}" -q && echo "Cikti: TEMP/POD_LISTING/INVENTORY_${mode}_${stamp}/"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: pod-inventory-update
          path: _out/
          if-no-files-found: ignore
      - if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

name: pin-v6-yaz

# Pinterest V6 Metricool YAZIMI (Serdar karari 12 Eki 2026, yeni set 13 Eki).
# yedek: bekleyen eski yalniz-Pinterest gonderileri listele + Drive yedek | sil: yedek (Drive, dogrulanmis) + sil + yeniden oku
# tek: plan (13 Eki) + 1 pin POST + geri okuma dogrulama | hepsi: kalanlar + 234 satir geri okuma dogrulama.
# Yayinlanmis pinlere dokunulmaz. Token loga yazilmaz.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      mod:
        type: choice
        options: [yedek, sil, tek, hepsi, kontrol]
        default: yedek
      baslangic:
        description: "Plan gunu 1 (YYYY-MM-DD)"
        default: "2026-10-13"

concurrency:
  group: metricool-yazma
  cancel-in-progress: false

jobs:
  yaz:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      D: gdrive:ASTROLOVE/TEMP/PIN_V6_20261012
      URL_KOK: https://caliserdar-maker.github.io/astrolove-media/pinterest/v6
    steps:
      - uses: actions/checkout@v4
      - name: rclone + token
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            export RCLONE_CONFIG_GDRIVE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET"
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
          mkdir -p _work _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/METRICOOL_TOKEN.json" _work/mc.json
          python3 -c "import json;print('::add-mask::'+json.load(open('_work/mc.json'))['userToken'])"

      - name: Yedek / sil
        if: ${{ inputs.mod == 'yedek' || inputs.mod == 'sil' }}
        env:
          MOD: ${{ inputs.mod }}
          YEDEK_DRIVE: gdrive:ASTROLOVE/TEMP/PIN_V6_20261012/ESKI_YEDEK
        run: |
          set -uo pipefail
          python3 scripts/sosyal/metricool_pin_v6_yaz.py --token-dosya _work/mc.json --mod "$MOD" --cikti _out 2>&1 | python3 scripts/guvenlik/sir_koru.py tee --sir-json _work/mc.json "$GITHUB_STEP_SUMMARY"
          rc=${PIPESTATUS[0]}
          python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/mc.json _out || exit 1   # sir varsa Drive'a yuklenmez
          rclone copy _out "$YEDEK_DRIVE" --include "ESKI_YEDEK.csv" --include "SILME_SONUC.json"
          rclone lsl "$YEDEK_DRIVE" | python3 scripts/guvenlik/sir_koru.py tee --sir-json _work/mc.json "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Plan (baslangic) + yaz
        if: ${{ inputs.mod == 'tek' || inputs.mod == 'hepsi' || inputs.mod == 'kontrol' }}
        env:
          MOD: ${{ inputs.mod }}
          BAS: ${{ inputs.baslangic }}
        run: |
          set -uo pipefail
          rclone copyto "$D/PIN_METIN_234_LINKLI.csv" _out/PIN_METIN_234_LINKLI.csv
          rclone lsjson "$D/PINLER" --files-only --no-modtime > _out/PINLER.json
          python3 scripts/sosyal/metricool_panolar.py _work/mc.json _out > /dev/null
          python3 scripts/sosyal/pin_v6_plan.py --metin _out/PIN_METIN_234_LINKLI.csv --sira data/sosyal/pinterest/SIRA_78.csv \
            --panolar _out/PANOLAR.json --pinler _out/PINLER.json --cikti _out/PIN_V6_PLAN_YAYIN.csv --url-kok "$URL_KOK" --baslangic "$BAS" \
            | python3 scripts/guvenlik/sir_koru.py tee --sir-json _work/mc.json "$GITHUB_STEP_SUMMARY" || exit 1
          python3 scripts/sosyal/metricool_pin_v6_yaz.py --token-dosya _work/mc.json --mod "$MOD" --cikti _out --plan _out/PIN_V6_PLAN_YAYIN.csv 2>&1 | python3 scripts/guvenlik/sir_koru.py tee --sir-json _work/mc.json "$GITHUB_STEP_SUMMARY"
          rc=${PIPESTATUS[0]}
          python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/mc.json _out || exit 1   # sir varsa Drive'a yuklenmez
          rclone copy _out "$D/PLAN" --include "PIN_V6_PLAN_YAYIN.csv" --include "YAZIM_*.csv" --include "DOGRULAMA_*.txt"
          rclone lsl "$D/PLAN" | python3 scripts/guvenlik/sir_koru.py tee --sir-json _work/mc.json "$GITHUB_STEP_SUMMARY"
          exit $rc

      - if: always()
        run: |
          rm -rf _work ~/.config/rclone
          if [ -f "$RUNNER_TEMP/SIR_ENGEL" ]; then echo "::error::sir iceren satir engellendi (sir_koru)"; exit 1; fi

name: premium-tara
# DAL poster-son-ozet (main'e ALINMAZ): Etsy istegi YOK. 78 poster son okuma ozet kontrolu (Merkez 4 Kas C, inceleme KRITIK 1).
# Girdi Drive: TEMP/PREMIUM_TARAMA_20261103_230315/HAM (canli API metni, kosu 41735929664) + TEMP/POSTER_KURU_20261103_220036
# (FARK.csv, ONCE_SONRA.json, YEDEK.json). Cikti: TEMP/POSTER_YAZ_20261103_225511/SON_OZET_<damga>/.
permissions:
  contents: read
on:
  workflow_dispatch: {}
jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || { sudo apt-get install -y -qq rclone >/dev/null; }
          echo "CIKTI=SON_OZET_$(date -u +%Y%m%d_%H%M%S)" >> "$GITHUB_ENV"
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Girdi indir
        run: |
          set -euo pipefail
          mkdir -p _ham _kuru _out
          rclone copy "gdrive:ASTROLOVE/TEMP/PREMIUM_TARAMA_20261103_230315/HAM" _ham -q
          for f in FARK.csv ONCE_SONRA.json YEDEK.json; do rclone copyto "gdrive:ASTROLOVE/TEMP/POSTER_KURU_20261103_220036/$f" "_kuru/$f"; done
          echo "HAM dosya: $(ls _ham | wc -l)"; sha256sum _kuru/* | tee _out/GIRDI_SHA.txt
      - name: Kontrol
        run: |
          set -o pipefail
          python3 scripts/etsy/poster_son_ozet.py --ids data/pod/pod78_ids.csv --ham _ham --kuru _kuru --out _out 2>&1 | tee _out/LOG.txt
      - name: Cikti Drive'a
        if: ${{ always() }}
        run: |
          ls _out/* >/dev/null 2>&1 && rclone copy _out "gdrive:ASTROLOVE/TEMP/POSTER_YAZ_20261103_225511/${CIKTI:?}" --immutable -q && echo "::notice title=SON_OZET::TEMP/POSTER_YAZ_20261103_225511/$CIKTI/"
      - if: always()
        run: rm -rf ~/.config/rclone

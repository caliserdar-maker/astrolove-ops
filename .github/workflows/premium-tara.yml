name: premium-tara
# GECICI DAL gecici/kesit-yardimci (main'e ALINMAZ; siparis kapaninca dal silinir). Dijital poster siparisi yardimcisi. Etsy istegi YOK.
#   mod=kesit_tasi: uretim klasorunu OKUR (degistirmez / silmez), kapilar + 1:1 kesit (scripts/siparis_onizle/kesit_olcum.py; bant olcumden),
#     hepsi PASS ise uretim dosyalari + kesit gizli siparis klasorune KOPYALANIR ve md5 ile dogrulanir. Kaynagi bu is akisi SILMEZ.
#   mod=kosu_sil: verilen TAMAMLANMIS kosu kayitlarini siler (DELETE actions/runs), 404 dogrular.
# Girdiler opak Drive klasor id'leri ve kosu id'leri (siparis no / isim / mesaj YOK). Isim ve mesaj ilk adimda maskelenir, loga yazilmaz.
permissions:
  contents: read
  actions: write
on:
  workflow_dispatch:
    inputs:
      mod: {description: "kesit_tasi | kosu_sil", required: true}
      gpt: {description: "uretim klasoru id", required: false, default: ""}
      kis: {description: "KISISEL.json klasoru id", required: false, default: ""}
      hedef: {description: "gizli siparis klasoru id", required: false, default: ""}
      kosular: {description: "silinecek kosu id'leri (virgullu)", required: false, default: ""}
jobs:
  kesit_tasi:
    if: ${{ inputs.mod == 'kesit_tasi' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: rclone + araclar
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/rc.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q -j /tmp/rc.zip '*/rclone' -d /tmp/rcb && sudo install -m 755 /tmp/rcb/rclone /usr/local/bin/rclone
          pip install -q pillow==11.0.0 numpy==2.1.3
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true; fi
      - name: Girdi indir + maske
        env: {G: "${{ inputs.gpt }}", K: "${{ inputs.kis }}"}
        run: |
          set -euo pipefail
          [[ "$G" =~ ^[A-Za-z0-9_-]{20,}$ && "$K" =~ ^[A-Za-z0-9_-]{20,}$ ]] || { echo "::error::klasor id"; exit 1; }
          umask 077; mkdir -p _w/ur
          rclone copy "gdrive,root_folder_id=$K:" _w --include KISISEL.json -q
          rclone copy "gdrive,root_folder_id=$G:" _w/ur --include siparis.json -q
          python3 - <<'PY'
          import json
          s = set()
          for x in json.load(open('_w/KISISEL.json', encoding='utf-8'))['kalemler'][0]['varyasyon']:
              if x['ad'].startswith('Name under') or x['ad'] == 'Your message':
                  s.add(x['deger'])
          j = json.load(open('_w/ur/siparis.json', encoding='utf-8'))
          s |= {j['isim1'], j['isim2'], j['tagline']}
          m = set()
          for t in s:
              t = t.strip()
              m |= {t, t.upper(), t.lower(), t.title()}
              m |= {w.strip('.,!?;:') for w in t.split() if len(w.strip('.,!?;:')) >= 3}
              m |= {w.strip('.,!?;:').upper() for w in t.split() if len(w.strip('.,!?;:')) >= 3}
          for t in sorted(m):
              if t:
                  print('::add-mask::' + t)
          PY
          rclone copy "gdrive,root_folder_id=$G:" _w/ur -q
          ( cd _w/ur && sha256sum * > ../KAYNAK.sha256 )
          echo "uretim dosyasi sayisi: $(ls _w/ur | wc -l)"
      - name: Kapilar + 1:1 kesit (yalniz keser; teslim dosyasi degismez)
        run: python3 scripts/siparis_onizle/kesit_olcum.py _w/ur _w/KISISEL.json _out
      - name: Gizli klasore kopyala + dogrula (kaynak degismez, silinmez)
        env: {G: "${{ inputs.gpt }}", T: "${{ inputs.hedef }}"}
        run: |
          set -euo pipefail
          [[ "$T" =~ ^[A-Za-z0-9_-]{20,}$ ]] || { echo "::error::hedef id"; exit 1; }
          ( cd _w/ur && sha256sum -c ../KAYNAK.sha256 --quiet ) && echo "yerel kopya degismedi: EVET"
          rclone copy _w/ur "gdrive,root_folder_id=$T:" -q
          rclone copy _out "gdrive,root_folder_id=$T:" -q
          rclone check _w/ur "gdrive,root_folder_id=$T:" --one-way -q && echo "hedef == uretim (md5): EVET"
          rclone check _out "gdrive,root_folder_id=$T:" --one-way -q && echo "hedef kesit (md5): EVET"
          rclone check "gdrive,root_folder_id=$G:" _w/ur --one-way -q && echo "kaynak klasor degismedi (md5): EVET"
          rclone lsl "gdrive,root_folder_id=$T:" --max-depth 1 | awk '{print $1, $NF}'
      - if: always()
        run: rm -rf _w _out ~/.config/rclone
  kosu_sil:
    if: ${{ inputs.mod == 'kosu_sil' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kosu kayitlarini sil + 404 dogrula
        env:
          GH_TOKEN: ${{ github.token }}
          KOSULAR: ${{ inputs.kosular }}
        run: |
          set -uo pipefail
          [[ "$KOSULAR" =~ ^[0-9]+(,[0-9]+)*$ ]] || { echo "::error::kosu id listesi"; exit 1; }
          kotu=0
          for id in ${KOSULAR//,/ }; do
            [ "$id" = "$GITHUB_RUN_ID" ] && { echo "$id: bu kosu, atlandi"; continue; }
            durum=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq .status 2>/dev/null || echo yok)
            if [ "$durum" != "completed" ]; then echo "$id: durum $durum, silinmedi"; kotu=1; continue; fi
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" >/dev/null 2>&1; s=$?
            kod=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$id")
            echo "$id: DELETE cikis $s, yeniden okuma HTTP $kod"
            [ "$kod" = "404" ] || kotu=1
          done
          exit $kotu

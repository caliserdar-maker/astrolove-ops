name: premium-tara
# DAL onizle-yardimci (main'e ALINMAZ): siparis 8x10 baski -> onizleme + 1:1 kesit + OCR (yalniz PASS/FAIL). Etsy istegi YOK.
# Girdiler opak Drive klasor id'leri (siparis no / isim yok). Degerler ilk adimda maskelenir.
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      gpt: {description: "uretim klasoru id", required: true}
      kis: {description: "KISISEL.json klasoru id", required: true}
      hedef: {description: "gizli siparis klasoru id", required: true}
jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: rclone + araclar
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/rc.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q -j /tmp/rc.zip '*/rclone' -d /tmp/rcb && sudo install -m 755 /tmp/rcb/rclone /usr/local/bin/rclone
          sudo apt-get install -y -qq tesseract-ocr >/dev/null; pip install -q pillow==11.0.0
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true; fi
      - name: Girdi indir + maske
        env: {G: "${{ inputs.gpt }}", K: "${{ inputs.kis }}"}
        run: |
          set -euo pipefail
          umask 077; mkdir -p _w
          rclone copy "gdrive,root_folder_id=$K:" _w --include KISISEL.json -q
          python3 - <<'PY'
          import json
          v={x['ad']:x['deger'] for x in json.load(open('_w/KISISEL.json'))['kalemler'][0]['varyasyon']}
          s=set()
          for k in ('Name under Cancer','Name under Libra','Your message'):
              t=v[k]; s|={t,t.upper(),t.lower(),t.title()}
              s|={w.strip('.,!?') for w in t.split() if len(w.strip('.,!?'))>=3}
          for t in sorted(s):
              if t: print('::add-mask::'+t)
          PY
          rclone copy "gdrive,root_folder_id=$G:" _w --include "AstroLoveArt_Cancer_Libra_Deep_Black_8x10.jpg" -q
          ls _w | sed 's/^/dosya: /'
      - name: Onizleme + kesit + OCR
        run: python3 scripts/siparis_onizle/onizle_8x10.py _w/AstroLoveArt_Cancer_Libra_Deep_Black_8x10.jpg _w/KISISEL.json _out AstroLoveArt_Cancer_Libra_Deep_Black_8x10
      - name: Gizli klasore yaz
        env: {G: "${{ inputs.gpt }}", T: "${{ inputs.hedef }}"}
        run: |
          set -euo pipefail
          cp _w/AstroLoveArt_Cancer_Libra_Deep_Black_8x10.jpg _out/
          rclone copy "gdrive,root_folder_id=$G:" _out --include KAPI.json --include siparis.json --include SURE.json -q
          rclone copy _out "gdrive,root_folder_id=$T:" -q
          rclone lsl "gdrive,root_folder_id=$T:" --max-depth 2 | awk '{print $1, $NF}'
      - if: always()
        run: rm -rf _w _out ~/.config/rclone

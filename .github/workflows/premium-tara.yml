name: premium-tara
# GECICI DAL (main'e ALINMAZ): siparis 8x10 baski -> onizleme + 1:1 kesit + kapilar (yalniz True / False). Etsy istegi YOK.
# Girdiler opak Drive klasor id'leri (siparis no / isim yok). Degerler ilk adimda maskelenir. Cift / renk KISISEL.json alan adlarindan.
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      gpt: {description: "uretim klasoru id", required: true}
      kis: {description: "KISISEL.json klasoru id", required: true}
      hedef: {description: "gizli siparis klasoru id", required: true}
      kosu: {description: "uretim kosu no (SURE.json ile karsilastirilir)", required: true}
      secenek: {description: "degisiklik secenegi: A (harf sekli) | B (yeni mesaj, hedef kokundeki DEGISIKLIK_1_MESAJ.json) | C (her kelimenin ilk harfi buyuk)", required: true}
jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: rclone + araclar
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/rc.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q -j /tmp/rc.zip '*/rclone' -d /tmp/rcb
          sudo install -m 755 /tmp/rcb/rclone /usr/local/bin/rclone
          sudo apt-get update -qq >/dev/null; sudo apt-get install -y -qq tesseract-ocr >/dev/null; pip install -q pillow==11.0.0 numpy==2.1.3
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi; fi
      - name: Girdi indir + maske
        env: {G: "${{ inputs.gpt }}", K: "${{ inputs.kis }}", T: "${{ inputs.hedef }}", SEC: "${{ inputs.secenek }}"}
        run: |
          set -euo pipefail
          case "$SEC" in A|B|C) ;; *) echo "::error::secenek A, B ya da C olmali"; exit 1;; esac
          umask 077; mkdir -p _w _ur
          rclone copy "gdrive,root_folder_id=$K:" _w --include KISISEL.json -q
          if [ "$SEC" = "B" ]; then rclone copy "gdrive,root_folder_id=$T:" _w --max-depth 1 --include DEGISIKLIK_1_MESAJ.json -q; [ -s _w/DEGISIKLIK_1_MESAJ.json ]; fi
          rclone copy "gdrive,root_folder_id=$G:" _ur --max-depth 1 --include "siparis.json" -q
          python3 - <<'PY'
          import json, os
          s = set()
          def ekle(t):
              t = str(t)
              for satir in t.replace("\r", "\n").split("\n"):
                  satir = satir.strip()
                  if not satir: continue
                  s.update({satir, satir.upper(), satir.lower(), satir.title()})
          kj = json.load(open('_w/KISISEL.json', encoding='utf-8'))
          ekle(kj.get('receipt_id', ''))
          v = {x['ad']: x['deger'] for x in kj['kalemler'][0]['varyasyon']}
          for k, t in v.items():
              if k.startswith('Name under ') or k == 'Your message': ekle(t)
              if k == 'Your message': ekle(' '.join(w[:1].upper() + w[1:] for w in str(t).split(' ')))
          if os.path.exists('_w/DEGISIKLIK_1_MESAJ.json'):
              ekle(json.load(open('_w/DEGISIKLIK_1_MESAJ.json', encoding='utf-8')).get('mesaj', ''))
          if os.path.exists('_ur/siparis.json'):
              j = json.load(open('_ur/siparis.json', encoding='utf-8'))
              for k in ('isim1', 'isim2', 'tagline'):
                  if j.get(k): ekle(j[k])
          for t in sorted(s, key=len, reverse=True):
              print('::add-mask::' + t)
          PY
          rclone copy "gdrive,root_folder_id=$G:" _ur --max-depth 1 --include "AstroLoveArt_*.jpg" --include KAPI.json --include SURE.json -q
          ls _ur | sed 's/^/dosya: /'
      - name: Onizleme + kesit + kapilar
        env: {KOSU: "${{ inputs.kosu }}", SEC: "${{ inputs.secenek }}"}
        run: |
          set -euo pipefail
          [[ "$KOSU" =~ ^[0-9]+$ ]] || { echo "::error::kosu no"; exit 1; }
          python3 scripts/siparis_onizle/onizle_8x10.py _ur _w/KISISEL.json _out "$KOSU" "$SEC" _w/DEGISIKLIK_1_MESAJ.json
      - name: Gizli klasore yaz + dogrula
        env: {T: "${{ inputs.hedef }}", SEC: "${{ inputs.secenek }}"}
        run: |
          set -euo pipefail
          # uc teslim dosyasi DEGISIKLIK_1/ kokune, kayitlar (ozet, kapi, girdi, ana kopya) DEGISIKLIK_1/KAYIT_Option<X>/ altina; hedef kokune YAZILMAZ
          mkdir -p _kayit
          mv "_out/ONIZLE_OZET_Option$SEC.json" _kayit/
          cp _ur/AstroLoveArt_*.jpg _ur/KAPI.json _ur/siparis.json _ur/SURE.json _kayit/
          [ "$(ls _out | wc -l)" = "3" ]
          D="gdrive,root_folder_id=$T:DEGISIKLIK_1"
          rclone copy _out "$D" -q
          rclone check _out "$D" --one-way -q
          rclone copy _kayit "$D/KAYIT_Option$SEC" -q
          rclone check _kayit "$D/KAYIT_Option$SEC" --one-way -q
          echo "DOGRULAMA: yerel cikti ile gizli klasor ayni (rclone check, tek yon; teslim + kayit)"
          python3 -c "import json; o = json.load(open('_kayit/ONIZLE_OZET_Option$SEC.json')); print('SONUC secenek $SEC: PASS' if o['PASS'] else 'SONUC secenek $SEC: URETIM KAPISI d FAIL (yalniz d), dosyalar secenek olarak yazildi')"
          echo "icerik goz kontrolu bekliyor (1:1 kesit)"
          rclone lsf "$D" --max-depth 1 --files-only --include "AstroLoveArt_*" | sed 's/^/hedef: /'
      - if: always()
        run: rm -rf _w _ur _out _kayit ~/.config/rclone /tmp/ocr_in.png

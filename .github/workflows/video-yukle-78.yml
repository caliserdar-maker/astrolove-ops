name: video-yukle-78

# 78 POD ilanina v5 kapak videosu: YALNIZ KURU KOSU (Etsy salt okur; yukleme/silme YOK).
# scripts/etsy/video_yukle_78.py. Video kaynagi: TEMP/POD_VIDEO_V2/<damga>/ (bos = OZET.md'si olan en son damga).
# Uygulama (uploadListingVideo) ayri adim, Serdar acik onayiyla yazilir.
# Cikti: Drive TEMP/VIDEO78_YUKLE/KURU_<damga>/ (PLAN.json, PLAN.csv, report.md) + eski video yedegi
# TEMP/VIDEO78_YEDEK_<damga>/.

on:
  workflow_dispatch:
    inputs:
      video_damga: {description: "TEMP/POD_VIDEO_V2 damgasi (bos = OZET.md'si olan en son)", required: false, default: ""}


permissions:
  actions: read
  contents: read

jobs:
  kuru:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      VDAMGA_IN: ${{ inputs.video_damga }}
    steps:
      - uses: actions/checkout@v4
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          echo "STAMP=$(date -u +%Y%m%d_%H%M)" >> "$GITHUB_ENV"
          pip install -q requests opencv-python-headless numpy pillow
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Token
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
      - name: Videolar (TEMP/POD_VIDEO_V2)
        run: |
          set -euo pipefail
          K0="gdrive:ASTROLOVE/TEMP/POD_VIDEO_V2"
          VDAMGA="$VDAMGA_IN"
          if [ -z "$VDAMGA" ]; then
            for d in $(rclone lsf --dirs-only "$K0/" | tr -d '/' | grep -E '^[0-9]{8}_[0-9]{4}$' | sort -r); do
              if rclone lsf "$K0/$d/OZET.md" >/dev/null 2>&1 && [ -n "$(rclone lsf "$K0/$d/OZET.md")" ]; then VDAMGA=$d; break; fi
            done
          fi
          [[ "$VDAMGA" =~ ^[0-9]{8}_[0-9]{4}$ ]] || { echo "::error::OZET.md'si olan video damgasi yok. DUR."; exit 1; }
          rclone copy "$K0/$VDAMGA" _work/video --include "VIDEO_*.mp4" --include "QC_*.json" --include "OZET.md" -q
          OZET=$(grep '^PASS:' _work/video/OZET.md || echo '?')
          echo "kaynak: TEMP/POD_VIDEO_V2/$VDAMGA | video $(ls _work/video/VIDEO_*.mp4 | wc -l) | $OZET"
          python -c 'import json,sys;json.dump({"klasor":"TEMP/POD_VIDEO_V2/"+sys.argv[1]+"/","ozet":sys.argv[2]},open("_work/kaynak.json","w"))' "$VDAMGA" "$OZET"
      - name: Kuru kosu (Etsy salt okur)
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: python scripts/etsy/video_yukle_78.py --video-dir _work/video --kaynak-bilgi _work/kaynak.json --out _out
      - name: Token + cikti Drive'a
        if: ${{ always() }}
        run: |
          set -euo pipefail
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "Token geri yazildi" || true
          if grep -rIqE 'x-api-key|refresh_token|"access_token"' _out/ 2>/dev/null; then
            echo "::error::ciktida sir benzeri anahtar bulundu, Drive'a yazilmadi"; exit 1
          fi
          if [ -d _out/yedek ] && [ -n "$(ls -A _out/yedek)" ]; then
            rclone copy _out/yedek "gdrive:ASTROLOVE/TEMP/VIDEO78_YEDEK_${STAMP}" -q
            rclone check _out/yedek "gdrive:ASTROLOVE/TEMP/VIDEO78_YEDEK_${STAMP}" --one-way -q && echo "Yedek: TEMP/VIDEO78_YEDEK_${STAMP}/ ($(ls _out/yedek | wc -l) dosya)"
          fi
          [ -d _out ] && rclone copy _out "gdrive:ASTROLOVE/TEMP/VIDEO78_YUKLE/KURU_${STAMP}" --exclude "yedek/**" -q && echo "Cikti: TEMP/VIDEO78_YUKLE/KURU_${STAMP}/"
          [ -f _out/report.md ] && cat _out/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

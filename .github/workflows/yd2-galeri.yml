name: yd2-galeri

# YD (1st Anniversary) 2. ASAMA galeri (Serdar 2 Kas "ok"; Merkez GOREV YD2-YUKLE karar 6): rank 1 kapak + video DOKUNMA, rank 2-10 =
# Y02-Y10 (TEMP/YD_KAPAK_V1/<kapak_damga>; Y01 yuklenmez), kalan 12 eski gorsel CIKAR, Style (513) baglari Y06-Y10. Betikler DALDA (ref,
# varsayilan yd-asama2): scripts/kapak78/yd_liste_uret.py liste --profil yd2 (SET_KONTROL kapisi, alt metin data/pod/yd2_alt.csv) +
# scripts/kapak78/yd2_galeri_yukle.py (galeri_v10_yukle yd2 profili; ek kapilar: Size 516 = 14 boy, rank 1 = liste kosusundaki kapak).
# kuru=true (varsayilan): Etsy salt okuma, PLAN_YD2.json + plan_damga. ETSY'YE YAZAR yalniz kuru=false + confirm=YD_GALERI_V2 + plan_damga.
# Galeri geri alma ELLE, yedekten (TEMP/YD_KAPAK_V1_YEDEK/<yedek_damga>; Serdar kabul etti). Kilit is akisinin en basinda (yd-kapak-yukle
# ile ayni duzen; CLAUDE.md karar 6b istisnasi YALNIZ yd-kapak-yukle icindir: burada azami_dk ve girdi indirme ayni sinirlarla).
# Alt metin dosyasi depodan okunur ve sha256 ile Drive TEMP/YD2_ALT/ALT_<sha12>.csv olarak saklanir (Drive kaydi; liste OZET alt_sha).
# Durum: TEMP/YD2_GALERI/DEVAM.json, ILERLEME.json, SONUC.csv; kosu ciktisi TEMP/YD2_GALERI/KOSU/<run_id>/.

permissions:
  actions: read
  contents: read

on:
  workflow_dispatch:
    inputs:
      kapak_damga: {description: "TEMP/YD_KAPAK_V1/<damga> (YYYYMMDD_HHMMSS)", required: true, default: "20261027_141146"}
      set_id: {description: "Drive SET_KONTROL.csv id (yd-set-kontrol; Serdar 30 Eki karar 3)", required: true, default: "1SojOPuaV0OzopEMxSEWnoXHEQfMNgwCy"}
      yedek_damga: {description: "TEMP/YD_KAPAK_V1_YEDEK/<damga> (yd-kapak-yedek)", required: true, default: ""}
      envanter: {description: "TEMP/<envanter>/HAM (yd-envanter-oku)", required: true, default: "YD_ENVANTER_20261101_ASAMA1_SONRASI"}
      kuru: {description: "true = yazma yok (plan); false = yazim", required: true, default: "true"}
      confirm: {description: "yazim icin YD_GALERI_V2 (bag onarimi YD_GALERI_V2_BAG)", required: false, default: ""}
      plan_damga: {description: "yazim: kuru kosunun plan_damga degeri (<kosu>_<sha12>)", required: false, default: ""}
      sadece: {description: "yalniz bu ilanlar (virgullu listing_id); bos = 78", required: false, default: ""}
      devam_kosu: {description: "runner kaybi: o kosunun ilan DEVAM kopyalari (bos = yok)", required: false, default: ""}
      kurtar: {description: "true: hata kaydi olan ilanda kayitli plan + canli galeriyle surdur", required: false, default: "false"}
      azami_dk: {description: "yazim: kilitten bu sure sonra yeni ilana baslanmaz (dk, 1-75)", required: false, default: "75"}
      bag_onar: {description: "true: yalniz Style baglari (DEVAM kaydi olan ilanlar; confirm YD_GALERI_V2_BAG)", required: false, default: "false"}
      ref: {description: "betik dali / commit", required: true, default: "yd-asama2"}

env:
  T: "gdrive:ASTROLOVE/TEMP"
  O: "gdrive:ASTROLOVE/TEMP/YD2_GALERI"

jobs:
  is:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Girdi kapisi
        env:
          KD: ${{ inputs.kapak_damga }}
          QD: ${{ inputs.set_id }}
          YD: ${{ inputs.yedek_damga }}
          EN: ${{ inputs.envanter }}
          REF: ${{ inputs.ref }}
          KURU: ${{ inputs.kuru }}
          ONAY: ${{ inputs.confirm }}
          PD: ${{ inputs.plan_damga }}
          SA: ${{ inputs.sadece }}
          DK: ${{ inputs.devam_kosu }}
          KU: ${{ inputs.kurtar }}
          AZ: ${{ inputs.azami_dk }}
          BO: ${{ inputs.bag_onar }}
        run: |
          set -euo pipefail
          [[ "$BO" =~ ^(true|false)$ ]] || { echo "::error::girdi (bag_onar)"; exit 1; }
          [[ "$KD" =~ ^[0-9]{8}_[0-9]{6}$ && "$QD" =~ ^[A-Za-z0-9_-]{20,80}$ && "$YD" =~ ^[0-9]{8}_[0-9]{6}$ && "$EN" =~ ^YD_ENVANTER_[A-Za-z0-9_]+$ ]] || { echo "::error::girdi (kapak / set_id / yedek damga, envanter)"; exit 1; }
          [[ "$KURU" =~ ^(true|false)$ && "$KU" =~ ^(true|false)$ ]] || { echo "::error::girdi (kuru / kurtar)"; exit 1; }
          [[ "$REF" =~ ^[A-Za-z0-9._/-]{1,80}$ ]] || { echo "::error::girdi (ref)"; exit 1; }
          [[ "$SA" =~ ^([0-9]+(,[0-9]+)*)?$ && "$DK" =~ ^([0-9]+)?$ && "$AZ" =~ ^[0-9]{1,3}$ ]] || { echo "::error::girdi (sadece / devam_kosu / azami_dk)"; exit 1; }
          [ "$AZ" -ge 1 ] && [ "$AZ" -le 75 ] || { echo "::error::azami_dk 1-75 (kilit en basta; YD kapak adimi 95 dk; bekleyen Etsy kosusu en fazla 120 dk bekler)"; exit 1; }
          if [ "$BO" = true ]; then
            [ "$KURU" = false ] && [ "$ONAY" = YD_GALERI_V2_BAG ] || { echo "::error::bag onarimi icin kuru=false + confirm YD_GALERI_V2_BAG"; exit 1; }
            [[ "$PD" =~ ^[0-9]+_[0-9a-f]{12}$ ]] || { echo "::error::bag onarimi icin plan_damga"; exit 1; }
          elif [ "$KURU" = false ]; then
            [ "$ONAY" = YD_GALERI_V2 ] || { echo "::error::yazim icin confirm YD_GALERI_V2"; exit 1; }
            [[ "$PD" =~ ^[0-9]+_[0-9a-f]{12}$ ]] || { echo "::error::yazim icin plan_damga (<kosu>_<sha12>)"; exit 1; }
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Etsy kilidi (sira bekle, iptal yok; Serdar 31 Eki karar 6b, is akisinin en basinda)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/etsy/kilit_bekle.py
          echo "KILIT_T0=$(date +%s)" >> "$GITHUB_ENV"   # zaman butcesi kilit alindigi andan sayilir
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2 numpy==2.1.3 pillow==11.0.0
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Girdiler (Drive, kilit altinda; en fazla 15 dk) + liste kapilari
        timeout-minutes: 15
        env:
          KD: ${{ inputs.kapak_damga }}
          QD: ${{ inputs.set_id }}
          YD: ${{ inputs.yedek_damga }}
          EN: ${{ inputs.envanter }}
          SA: ${{ inputs.sadece }}
          KURU: ${{ inputs.kuru }}
          PD: ${{ inputs.plan_damga }}
          BO: ${{ inputs.bag_onar }}
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out _in/kapak _in/HAM
          python3 - <<'PY'
          import csv, os
          sa = {x for x in os.environ["SA"].split(",") if x}
          R = [r for r in csv.DictReader(open("data/pod/yd78_ids.csv")) if not sa or r["listing_id"] in sa]
          if sa - {r["listing_id"] for r in R}:
              raise SystemExit(f"sadece: yd78 listesinde olmayan ilan {sorted(sa - {r['listing_id'] for r in R})}")
          open("_work/kapak.txt", "w").writelines(["MANIFEST.csv\n", "ORTAK_Y04.jpg\n"]          # Merkez 27 Eki karar d: Y05 cifte ozel
                                                  + [f"{r['cift']}_Y{k:02d}.jpg\n" for r in R for k in (2, 3, 5, 6, 7, 8, 9, 10)])   # yd2: Y01 yuklenmez
          open("_work/ham.txt", "w").writelines(f"{r['listing_id']}.json\n" for r in R)
          print(f"kapsam: {len(R)} ilan")
          PY
          K="$T/YD_KAPAK_V1/$KD"
          rclone copy "$K" _in/kapak --files-from _work/kapak.txt --transfers 8 -q
          rclone backend copyid gdrive: "$QD" _work/SET_KONTROL.csv -q
          cp data/pod/yd2_alt.csv _work/ALT.csv; AS=$(sha256sum _work/ALT.csv | cut -c1-12)
          rclone copyto _work/ALT.csv "$T/YD2_ALT/ALT_$AS.csv" --immutable -q 2>/dev/null || rclone lsf "$T/YD2_ALT/ALT_$AS.csv" >/dev/null
          echo "ALT: data/pod/yd2_alt.csv sha256 $AS (Drive TEMP/YD2_ALT/ALT_$AS.csv)"
          rclone copy "$T/$EN/HAM" _in/HAM --files-from _work/ham.txt --transfers 8 -q
          # adim 5 yedegi (cdn_yedek kilit altinda YOK): OZET + dosya listesi; eski kapak dahil 13 dosya liste kapisinda dogrulanir
          Y="$T/YD_KAPAK_V1_YEDEK/$YD"
          rclone copyto "$Y/OZET.md" _work/YEDEK_OZET.md
          rclone lsjson -R "$Y" --files-only --include "*.jpg" > _work/yedek_ls.json
          echo "indirilen: kapak $(ls _in/kapak/*.jpg | wc -l), HAM $(ls _in/HAM | wc -l), yedek dosya $(python3 -c 'import json;print(len(json.load(open("_work/yedek_ls.json"))))')"
          if [ "$KURU" = false ] && [ "$BO" = false ]; then
            rclone copyto "$O/KOSU/${PD%%_*}/PLAN_YD2.json" _work/PLAN_YD2.json || { echo "::error::PLAN_YD2.json yok (KOSU/${PD%%_*})"; exit 1; }
          fi
          python3 scripts/kapak78/yd_liste_uret.py liste --ciftler data/pod/yd78_ids.csv --kaynak docs/yd_kapak/KAPAK_KAYNAK.csv \
            --ham-dir _in/HAM --kapak-dir _in/kapak --set-kontrol _work/SET_KONTROL.csv --profil yd2 --alt _work/ALT.csv \
            --yedek-ozet _work/YEDEK_OZET.md --yedek-liste _work/yedek_ls.json --out _hazir --sadece "$SA"
          cp _hazir/LISTE_OZET.md _hazir/LISTE_OZET.json _hazir/ESLEME.csv _out/
      - name: Durum dosyalari oku (kilit sonrasi)
        env:
          DK: ${{ inputs.devam_kosu }}
        run: |
          set -euo pipefail
          umask 077
          # durum kapisi (26 Eki, Serdar onayi): okuma hatasinda bos varsayilanla devam YOK
          python3 scripts/ops/durum_dosyasi.py oku --uzak "$O/DEVAM.json" --yerel _work/DEVAM.json --durum _work/DURUM_DEVAM \
            --tur json-ilanlar --ilk-kayit-izni
          python3 scripts/ops/durum_dosyasi.py oku --uzak "$O/ILERLEME.json" --yerel _work/ILERLEME.json --durum _work/DURUM_ILERLEME \
            --tur json-ilanlar --ilk-kayit-izni
          python3 scripts/ops/durum_dosyasi.py oku --uzak "$O/SONUC.csv" --yerel _work/SONUC.csv --durum _work/DURUM_SONUC \
            --tur csv --anahtar ilan --ilk-kayit-izni
          if [ -n "$DK" ]; then
            mkdir -p _work/devam_kosu
            rclone copy "$O/KOSU/$DK/devam" _work/devam_kosu --include "DEVAM_*.json" --max-depth 1 -q
            python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("_work/DEVAM.json"); d = json.loads(p.read_text())
          for f in sorted(pathlib.Path("_work/devam_kosu").glob("DEVAM_*.json")):
              lid = f.stem.split("_", 1)[1]; k = json.loads(f.read_text()); e = d["ilanlar"].get(lid) or {}
              if int(k.get("adim") or 0) >= int(e.get("adim") or 0):
                  d["ilanlar"][lid] = dict(k, cift=e.get("cift") or k.get("cift") or "-", durum=e.get("durum") or "DUR")
                  print(f"devam_kosu: {lid} adim {k.get('adim')} (onceki {e.get('adim')})")
          p.write_text(json.dumps(d, indent=1) + "\n")
          PY
          fi
      - name: Token
        run: |
          set -euo pipefail
          umask 077
          rclone copyto "$T/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
      - name: YD2 galeri
        timeout-minutes: 95
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          KURU: ${{ inputs.kuru }}
          PD: ${{ inputs.plan_damga }}
          KU: ${{ inputs.kurtar }}
          AZ: ${{ inputs.azami_dk }}
          BO: ${{ inputs.bag_onar }}
        run: |
          set +e -o pipefail
          GEC=$(( ($(date +%s) - ${KILIT_T0:?}) / 60 )); AZE=$(( AZ - GEC ))   # kilitten bu yana gecen sure butceden duser
          echo "kilit suresi: $GEC dk gecti, kalan butce $AZE dk (azami_dk $AZ)"
          [ "$AZE" -ge 1 ] || { echo "::error::zaman butcesi kilit altinda doldu ($GEC dk >= $AZ); ilan baslamadi"; echo "KOD=1" >> "$GITHUB_ENV"; exit 1; }
          args=(--hazir _hazir --out _out --devam _work/DEVAM.json --ilerleme _work/ILERLEME.json --bes-x7 yok)
          if [ "$KURU" = true ]; then args+=(--kuru)
          elif [ "$BO" = true ]; then args+=(--bag-onar --confirm YD_GALERI_V2_BAG --plan-damga "$PD")
          else
            args+=(--confirm YD_GALERI_V2 --plan _work/PLAN_YD2.json --plan-damga "$PD" --sonuc _work/SONUC.csv --azami-dk "$AZE"
                   --devam-hedef-kok "$O/KOSU/${GITHUB_RUN_ID}/devam")
            [ "$KU" = true ] && args+=(--kurtar)
          fi
          python3 scripts/kapak78/yd2_galeri_yukle.py "${args[@]}" 2>&1 | tee _work/kosu.log
          echo "KOD=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
      - name: Token + durum dosyalari + cikti Drive'a
        if: always()
        env:
          KURU: ${{ inputs.kuru }}
        run: |
          set -uo pipefail
          FAIL=""
          # ortak betik (3 deneme; basarisizsa ::error:: ve adim FAIL; inceleme 30 Eki madde 6): onceki satir hatayi "yenilenmedi" diye yutuyordu
          TOKEN_RC=0; bash scripts/etsy/token_geri_yaz.sh _work/ETSY_TOKEN.json "$T/ETSY_TOKEN.json" || TOKEN_RC=1
          [ -f _work/kosu.log ] && python3 scripts/guvenlik/log_suz.py < _work/kosu.log > "_out/kosu_$(date -u +%Y%m%d_%H%M).txt"
          if grep -rqE '"(access_token|refresh_token)"[[:space:]]*:[[:space:]]*"[A-Za-z0-9._-]{20,}"|x-api-key[[:space:]]*:' _out/ 2>/dev/null; then
            echo "::error::Ciktida sir bulundu; Drive'a yazilmadi"; exit 1; fi
          if [ "$KURU" = false ] && [ -n "${KOD:-}" ]; then
            for x in "DEVAM.json json-ilanlar" "ILERLEME.json json-ilanlar" "SONUC.csv csv"; do
              set -- $x; ek=""; [ "$2" = csv ] && ek="--anahtar ilan"
              if [ -f "_work/DURUM_${1%%.*}/ONCE" ]; then
                python3 scripts/ops/durum_dosyasi.py yaz --uzak "$O/$1" --yerel "_work/$1" --durum "_work/DURUM_${1%%.*}" --tur "$2" $ek \
                  --ilk-kayit-izni || FAIL=1
              else
                echo "::error::$1 okunamadi; Drive'a yazilmadi"; FAIL=1
              fi
            done
          fi
          [ -d _out ] && rclone copy _out "$O/KOSU/${GITHUB_RUN_ID}" -q && echo "::notice title=YD2 GALERI::Drive TEMP/YD2_GALERI/KOSU/${GITHUB_RUN_ID}/"
          [ -f _out/RAPOR.md ] && head -60 _out/RAPOR.md >> "$GITHUB_STEP_SUMMARY" || true
          [ "$TOKEN_RC" = 0 ] || { echo "::error::ETSY TOKEN GERI YAZILAMADI"; exit 1; }
          [ -z "$FAIL" ] || { echo "::error::durum dosyasi kapisi FAIL"; exit 1; }
          [ "${KOD:-1}" = 0 ] || { echo "::error::cikis ${KOD:-?}"; exit 1; }
      - if: always()
        run: rm -rf _work _in _hazir ~/.config/rclone

name: yd-sembol-qc
# YD Y02 sembol tutarlilik QC'si (Merkez 27 Eki onayi). ETSY API YOK, Canva yok, kilit yok; yalniz okur + rapor yazar.
# Girdi: Drive TEMP/YD_KAPAK_V1/<kapak_damga>/<CIFT>_Y02.jpg (yd-kart-toplu ciktisi) + adim 5 yedegi TEMP/YD_KAPAK_V1_YEDEK/<yedek_damga>/
# <ilan>_<CIFT>/GALERI.json + Botanical bagli gorsel. Cikti: TEMP/YD_KAPAK_V1/<kapak_damga>/QC_SEMBOL_<damga>/QC_SEMBOL_RAPOR.json + OZET.md
# (alt klasor: tasima yalniz ust duzey *_Y[0-9][0-9].jpg okur). scripts/kapak78/yd_sembol_qc.py
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      kapak_damga: {description: "TEMP/YD_KAPAK_V1/<damga> (yd-kart-toplu)", required: true, default: "20261027_141146"}
      yedek_damga: {description: "TEMP/YD_KAPAK_V1_YEDEK/<damga>", required: true, default: "20261027_105540"}
jobs:
  sembol:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Girdi kapisi
        env: {KD: "${{ inputs.kapak_damga }}", YD: "${{ inputs.yedek_damga }}"}
        run: '[[ "$KD" =~ ^[0-9]{8}_[0-9]{6}$ && "$YD" =~ ^[0-9]{8}_[0-9]{6}$ ]] || { echo "::error::girdi"; exit 1; }'
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q pillow==11.0.0 numpy==2.1.3 opencv-python-headless==4.10.0.84
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || { sudo apt-get install -y -qq rclone >/dev/null; }
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Girdiler (Drive; Etsy API yok)
        env: {KD: "${{ inputs.kapak_damga }}", YD: "${{ inputs.yedek_damga }}"}
        run: |
          set -euo pipefail
          mkdir -p _k _y _out
          rclone copy "gdrive:ASTROLOVE/TEMP/YD_KAPAK_V1/$KD" _k --include "*_Y02.jpg" --max-depth 1 --transfers 16 -q
          echo "Y02: $(ls _k/*_Y02.jpg | wc -l)"
          Y="gdrive:ASTROLOVE/TEMP/YD_KAPAK_V1_YEDEK/$YD"
          rclone copy "$Y" _y --include "*/GALERI.json" --transfers 16 -q
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          sat = []
          for r in csv.DictReader(open("data/pod/yd78_ids.csv")):
              d = f"{r['listing_id']}_{r['cift']}"; p = Path("_y") / d / "GALERI.json"
              if not p.exists():
                  continue
              g = json.loads(p.read_text()); rk = {x["listing_image_id"]: x["rank"] for x in g["gorseller"]}
              sat += [f"{d}/r{rk[b['image_id']]}_{b['image_id']}.jpg" for b in g["baglar"] if b["value"] == "Botanical" and b["image_id"] in rk]
          Path("_liste.txt").write_text("\n".join(sat) + "\n"); print(f"Botanical: {len(sat)}")
          PY
          rclone copy "$Y" _y --files-from _liste.txt --transfers 16 -q
          echo "DAMGA=$(date -u +%Y%m%d_%H%M%S)" >> "$GITHUB_ENV"
      - name: Sembol QC (78 cift)
        run: python3 scripts/kapak78/yd_sembol_qc.py --kart-dir _k --yedek _y --ciftler data/pod/yd78_ids.csv --out _out
      - name: Drive'a yaz
        if: ${{ always() }}
        env: {KD: "${{ inputs.kapak_damga }}"}
        run: |
          set -euo pipefail
          if [ -f _out/OZET.md ]; then
            rclone copy _out "gdrive:ASTROLOVE/TEMP/YD_KAPAK_V1/$KD/QC_SEMBOL_${DAMGA:?}" --immutable -q
            echo "Cikti: TEMP/YD_KAPAK_V1/$KD/QC_SEMBOL_${DAMGA}" | tee -a "$GITHUB_STEP_SUMMARY"
            head -8 _out/OZET.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: always()
        run: rm -rf _k _y _out ~/.config/rclone

name: pod-kapak-ekle

# POD kapak v3 (Serdar onayi, 27 Eyl 2026): tek ilanin galerisine yeni kapagi 1. siraya EKLER.
# Hicbir gorsel silinmez; eski gorseller birer sira kayar. Varsayilan KURU DENEME.
# Yazma yalniz apply=true VE confirm=KAPAK_EKLE ile. Geri okuma: 1. sira, eski id+sira,
# varyasyon gorsel baglari, videolar, state=active. Cikti: Drive TEMP/POD_KAPAK_V3/EKLE_<ilan>_<damga>/

on:
  workflow_dispatch:
    inputs:
      listing_id:
        description: "Ilan id"
        required: true
        default: "4570143815"
      image:
        description: "Repodaki kapak dosyasi ya da gdrive:ASTROLOVE/TEMP/POD_KAPAK_V3/<...>.jpg"
        required: true
        default: "data/pod/cl_referans/CL_kapak_onayli_3000x2250.jpg"
      alt_text:
        description: "Yeni kapagin alt metni"
        required: true
        default: "Cancer and Libra personalized zodiac couple wall art in a gold frame, Midnight Blue with names Emily and James"
      apply:
        description: "true = Etsy'ye YAZ (ayrica confirm=KAPAK_EKLE gerekir)"
        type: boolean
        default: false
      confirm:
        description: "Yazma icin tam olarak: KAPAK_EKLE"
        required: false
        default: ""

concurrency:
  group: etsy-token
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ekle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APPLY: ${{ inputs.apply }}
      CONFIRM: ${{ inputs.confirm }}
      LID: ${{ inputs.listing_id }}
      IMG: ${{ inputs.image }}
      ALT: ${{ inputs.alt_text }}
    steps:
      - name: Onay kapisi
        run: |
          set -euo pipefail
          if [ "$APPLY" = "true" ] && [ "$CONFIRM" != "KAPAK_EKLE" ]; then
            echo "::error::apply=true icin confirm tam olarak 'KAPAK_EKLE' olmali. DUR."; exit 1
          fi
          [ "$APPLY" = "true" ] && echo "MOD=APPLY" >> "$GITHUB_ENV" || echo "MOD=DRY" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2 pillow==12.3.0 numpy==2.4.6
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Token
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
      - name: Kapak dosyasi (repo yolu ya da Drive TEMP/POD_KAPAK_V3/)
        run: |
          set -euo pipefail
          case "$IMG" in
            gdrive:ASTROLOVE/TEMP/POD_KAPAK_V3/*.jpg)
              case "$IMG" in *..*) echo "::error::yolda '..' olamaz"; exit 1 ;; esac
              rclone copyto "$IMG" _work/kapak.jpg
              echo "KAPAK_YOL=_work/kapak.jpg" >> "$GITHUB_ENV"
              echo "Drive'dan: $IMG ($(stat -c %s _work/kapak.jpg) bayt, sha256 $(sha256sum _work/kapak.jpg | cut -c1-16))" ;;
            gdrive:*) echo "::error::Drive kapagi yalniz ASTROLOVE/TEMP/POD_KAPAK_V3/ altindan (.jpg)"; exit 1 ;;
            *) [ -f "$IMG" ] || { echo "::error::repoda yok: $IMG"; exit 1; } ;;
          esac
      - name: Kapak ekle (kuru deneme / apply)
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          set -euo pipefail
          args=(--listing-id "$LID" --image "${KAPAK_YOL:-$IMG}" --alt "$ALT" --out _out)
          if [ "$APPLY" = "true" ]; then args+=(--apply --confirm "$CONFIRM"); fi
          python scripts/etsy/pod_kapak_ekle.py "${args[@]}"
      - name: Token + cikti Drive'a
        if: ${{ always() }}
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y%m%d_%H%M)
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "Token geri yazildi" || true
          if grep -rqE 'x-api-key|refresh_token|"access_token"' _out/ 2>/dev/null; then
            echo "::error::ciktida sir benzeri anahtar bulundu, Drive'a yazilmadi"; exit 1
          fi
          hedef="gdrive:ASTROLOVE/TEMP/POD_KAPAK_V3/EKLE_${LID}_${MOD:-DRY}_${stamp}"
          [ -d _out ] && rclone copy _out "$hedef" -q && echo "Cikti: TEMP/POD_KAPAK_V3/EKLE_${LID}_${MOD:-DRY}_${stamp}/"
          [ -f _out/report.md ] && cat _out/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

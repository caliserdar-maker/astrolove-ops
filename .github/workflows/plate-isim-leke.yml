name: plate-isim-leke

# SALT OKUR olcum (29 Eyl 2026, GIFT_9518 bulgusu): 5 renk x 13 boy PLATES isim bandi lekesi.
# PLATES'e / POD_PRINT'e yazma YOK. Cikti: Drive TEMP/PLATE_ISIM_LEKE_<damga>/. Tek is.
# Tetik: config/plate_isim_leke.trigger degisikligi (bu dal).

permissions:
  contents: read

on:
  push:
    branches: [claude/gracious-meitner-i72rkr]
    paths:
      - config/plate_isim_leke.trigger

concurrency: plate-isim-leke

jobs:
  olc:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python bagimliliklari
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pillow opencv-python-headless numpy fonttools img2pdf pikepdf
      - name: rclone kur
        run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONF_B64:-}" ]; then echo "HATA: RCLONE_CONF_B64 yok" >&2; exit 1; fi
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Plate isim bandi lekesi (65 plate)
        run: |
          set -euo pipefail
          python scripts/medya_v1/plate_isim_leke.py --kok "gdrive:ASTROLOVE/TEMP/PLATE_ISIM_LEKE_$(date -u +%Y%m%d_%H%M)"
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone

name: tek-ilan-adim
# Serdar 21 Eki kararlari 2-4 (scripts/etsy/tek_ilan_adim.py). mod=oku SALT OKUMA; sale = updateShop yalniz sale_message
# Digital paragrafi; profil = yalniz ornek ilan (CANCER_LIBRA yil donumu) shipping_profile_id. Toplu yok.
# Yazan modlar icin onay SERDAR_21EKI. Cikti + yedek: Drive TEMP/TEK_ILAN_ADIM_20261021/<mod>/.
permissions:
  actions: read
  contents: read
on:
  workflow_dispatch:
    inputs:
      mod: {description: "oku | sale | profil | profil_yeni", required: true, default: "oku"}
      profil: {description: "profil modu: hedef ucretsiz kargo profil id", required: false, default: ""}
      onay: {description: "yazan modlar icin SERDAR_21EKI", required: false, default: ""}
jobs:
  adim:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - name: Onay kapisi
        env: {ONAY: "${{ inputs.onay }}", MOD: "${{ inputs.mod }}"}
        run: |
          case "$MOD" in oku) ;; sale|profil|profil_yeni) [ "$ONAY" = "SERDAR_21EKI" ] || { echo "::error::onay yok"; exit 1; } ;; *) echo "::error::mod"; exit 1 ;; esac
      - uses: actions/checkout@v4
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || { echo "rclone.org erisilemedi, apt"; sudo apt-get install -y -qq rclone >/dev/null; }
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Token (okuma hatasi = DUR)
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
      - name: Calistir
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          MOD: ${{ inputs.mod }}
          PROFIL: ${{ inputs.profil }}
        run: python3 scripts/etsy/tek_ilan_adim.py --mod "$MOD" --profil "$PROFIL" --out _out
      - name: Token geri yaz + cikti Drive'a
        if: ${{ always() }}
        env:
          MOD: ${{ inputs.mod }}
        run: |
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "token geri yazildi" || true
          if [ -d _out ] && ls _out/* >/dev/null 2>&1; then
            python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/ETSY_TOKEN.json _out || { echo "::error::ciktida sir"; exit 1; }
            rclone copy _out "gdrive:ASTROLOVE/TEMP/TEK_ILAN_ADIM_20261021/${MOD}_${GITHUB_RUN_ID}" -q && echo "Cikti: TEMP/TEK_ILAN_ADIM_20261021/${MOD}_${GITHUB_RUN_ID}/"
          fi

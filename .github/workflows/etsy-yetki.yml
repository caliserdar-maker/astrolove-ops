name: etsy-yetki

# Etsy OAuth yeniden yetkilendirme (Serdar'in sifre degisikligi token'i iptal ettiginde).
# Girdi YOK: PKCE verifier/state ve Serdar'in verdigi code Drive TEMP/ETSY_YETKI_PKCE.json'dan okunur.
# Is: code -> access + refresh token; ETSY_TOKEN.json'a yazilir (eskisi yedeklenir);
# getShop ile dogrulanir; PKCE dosyasi silinir. Sonuc TEMP/ETSY_KOTA.txt'ye yazilir. Hicbir sir loga yazilmaz.

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: etsy-token
  cancel-in-progress: false

jobs:
  yetki:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Dosyalari al
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_YETKI_PKCE.json" _work/PKCE.json
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
      - name: Code -> token, dogrula
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime, json, os, shutil, sys
          import requests
          sys.path.insert(0, "scripts/etsy")
          from etsy_common import Etsy, TokenStore, mask, TOKEN_URL
          k, s = os.environ["ETSY_API_KEY"], os.environ["ETSY_SHARED_SECRET"]
          mask(k); mask(s)
          p = json.load(open("_work/PKCE.json"))
          for f in ("code_verifier", "code", "state"):
              mask(p.get(f))
          if not p.get("code"):
              raise SystemExit("HATA: PKCE dosyasinda code yok.")
          r = requests.post(TOKEN_URL, data={
              "grant_type": "authorization_code", "client_id": k,
              "redirect_uri": p["redirect_uri"], "code": p["code"], "code_verifier": p["code_verifier"],
          }, timeout=60)
          zaman = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          if r.status_code != 200:
              satir = f"{zaman} | YETKI HATA {r.status_code}: {r.text[:200]}"
              print(satir); open("_kota.txt", "w").write(satir + "\n"); sys.exit(0)
          b = r.json()
          for f in ("access_token", "refresh_token"):
              mask(b.get(f))
          shutil.copy("_work/ETSY_TOKEN.json", "_work/ETSY_TOKEN_ONCEKI.json")
          raw = open("_work/ETSY_TOKEN.json", encoding="utf-8").read()
          d = json.loads(raw)
          d.update(access_token=b["access_token"], refresh_token=b["refresh_token"],
                   obtained_at=datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M:%S"),
                   expires_in=b.get("expires_in", 3600), token_type=b.get("token_type", "Bearer"),
                   scope=p.get("scope", d.get("scope")))
          open("_work/ETSY_TOKEN.json", "w", encoding="utf-8").write(
              json.dumps(d, indent=2 if "\n" in raw.strip() else None, ensure_ascii=False) + "\n")
          open("_work/ETSY_TOKEN.json.updated", "w").write("1")
          store = TokenStore("_work/ETSY_TOKEN.json", k, s)
          api = Etsy(store)
          sh = api.get(f"/shops/{os.environ['ETSY_SHOP_ID']}") or {}
          satir = f"{zaman} | YETKI OK | getShop OK | x-remaining-today: {api.remaining}"
          print(satir); open("_kota.txt", "w").write(satir + "\n")
          PY
      - name: Geri yaz ve temizle
        if: ${{ always() }}
        run: |
          set -euo pipefail
          [ -f _kota.txt ] && rclone copyto _kota.txt "gdrive:ASTROLOVE/TEMP/ETSY_KOTA.txt" -q || true
          if [ -f _work/ETSY_TOKEN.json.updated ]; then
            rclone copyto _work/ETSY_TOKEN_ONCEKI.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN_IPTAL_20260927.json" -q
            rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" -q
            rclone deletefile "gdrive:ASTROLOVE/TEMP/ETSY_YETKI_PKCE.json" -q || true
            echo "Token yazildi, PKCE silindi"
          else
            echo "Token degismedi"
          fi
          rm -rf _work ~/.config/rclone

name: etsy-yetki

# Etsy OAuth yeniden yetkilendirme (Serdar tum yetkileri iptal ettiginde; anahtarlar ayni).
# adim=link: PKCE verifier/state uretir, yetki URL'sini YALNIZ Drive'a yazar
#   (TEMP/ETSY_YETKI_LINK.txt + TEMP/ETSY_YETKI_PKCE.json); redirect_uri ve scope
#   ayni uygulamanin onceki link dosyasindan okunur. Loga yalniz dosya yollari yazilir.
# adim=token: Serdar'in verdigi code (girdi) PKCE dosyasiyla birlestirilir, state karsilastirilir;
#   code -> access + refresh token; ETSY_TOKEN.json'a yazilir (eskisi tarihli yedeklenir);
#   getShop ile dogrulanir; PKCE dosyasi silinir. Sonuc TEMP/ETSY_KOTA.txt'ye yazilir. Hicbir sir loga yazilmaz.

permissions:
  actions: read
  contents: read

on:
  workflow_dispatch:
    inputs:
      adim:
        description: "link = yetki linki uret (Etsy'ye yazma yok) | token = code'u token'a cevir"
        type: choice
        options: [link, token]
        default: link
      code:
        description: "adim=token: Etsy'nin redirect URL'sindeki code degeri"
        required: false
        default: ""
      state:
        description: "adim=token: redirect URL'sindeki state degeri (dosyadakiyle karsilastirilir)"
        required: false
        default: ""


jobs:
  yetki:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@v4
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Yetki linki uret (adim=link)
        if: ${{ inputs.adim == 'link' }}
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_YETKI_LINK.txt" _work/ESKI_LINK.txt 2>/dev/null \
            || rclone copyto "gdrive:ASTROLOVE/TEMP/POD_5X7/ETSY_YETKI_LINK.txt" _work/ESKI_LINK.txt
          test -s _work/ESKI_LINK.txt
          python - <<'PY2'
          import base64, hashlib, json, os, secrets
          from urllib.parse import parse_qs, urlencode, urlsplit
          k = os.environ["ETSY_API_KEY"]
          print(f"::add-mask::{k}", flush=True)
          eski = open("_work/ESKI_LINK.txt", encoding="utf-8").read().strip().split()[-1]
          q = parse_qs(urlsplit(eski).query)
          redirect_uri, scope = q["redirect_uri"][0], q["scope"][0]
          if not redirect_uri or not scope:
              raise SystemExit("HATA: eski link dosyasindan redirect_uri/scope okunamadi. DUR.")
          ver = base64.urlsafe_b64encode(secrets.token_bytes(48)).rstrip(b"=").decode()
          chal = base64.urlsafe_b64encode(hashlib.sha256(ver.encode()).digest()).rstrip(b"=").decode()
          state = base64.urlsafe_b64encode(secrets.token_bytes(12)).rstrip(b"=").decode()
          for v in (ver, chal, state):
              print(f"::add-mask::{v}", flush=True)
          url = "https://www.etsy.com/oauth/connect?" + urlencode({
              "response_type": "code", "redirect_uri": redirect_uri, "scope": scope,
              "client_id": k, "state": state, "code_challenge": chal, "code_challenge_method": "S256"})
          json.dump({"code_verifier": ver, "state": state, "redirect_uri": redirect_uri,
                     "scope": scope, "code": ""}, open("_work/PKCE_YENI.json", "w"), indent=1)
          open("_work/LINK_YENI.txt", "w").write(url + "\n")
          print(f"link uretildi | scope parca sayisi {len(scope.split())} | redirect_uri ayni uygulamadan")
          PY2
          rclone copyto _work/PKCE_YENI.json "gdrive:ASTROLOVE/TEMP/ETSY_YETKI_PKCE.json" -q
          rclone copyto _work/LINK_YENI.txt "gdrive:ASTROLOVE/TEMP/ETSY_YETKI_LINK.txt" -q
          echo "Drive'a yazildi: TEMP/ETSY_YETKI_LINK.txt + TEMP/ETSY_YETKI_PKCE.json"
      - name: Dosyalari al
        if: ${{ inputs.adim == 'token' }}
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_YETKI_PKCE.json" _work/PKCE.json
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
      - name: Code -> token, dogrula
        if: ${{ inputs.adim == 'token' }}
        env:
          CODE_IN: ${{ inputs.code }}
          STATE_IN: ${{ inputs.state }}
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime, json, os, shutil, sys
          import requests
          sys.path.insert(0, "scripts/etsy")
          from etsy_common import Etsy, TokenStore, mask, TOKEN_URL
          k, s = os.environ["ETSY_API_KEY"], os.environ["ETSY_SHARED_SECRET"]
          mask(k); mask(s)
          p = json.load(open("_work/PKCE.json"))
          ci, si = os.environ.get("CODE_IN", "").strip(), os.environ.get("STATE_IN", "").strip()
          if ci:
              p["code"] = ci
          if si and si != p.get("state"):
              raise SystemExit("HATA: state girdisi PKCE dosyasindakiyle uyusmuyor. DUR.")
          for f in ("code_verifier", "code", "state"):
              mask(p.get(f))
          if not p.get("code"):
              raise SystemExit("HATA: code yok (girdi ya da PKCE dosyasi). DUR.")
          r = requests.post(TOKEN_URL, data={
              "grant_type": "authorization_code", "client_id": k,
              "redirect_uri": p["redirect_uri"], "code": p["code"], "code_verifier": p["code_verifier"],
          }, timeout=60)
          zaman = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          if r.status_code != 200:
              satir = f"{zaman} | YETKI HATA {r.status_code}: {r.text[:200]}"
              print(satir); open("_kota.txt", "w").write(satir + "\n"); sys.exit(0)
          b = r.json()
          for f in ("access_token", "refresh_token"):
              mask(b.get(f))
          shutil.copy("_work/ETSY_TOKEN.json", "_work/ETSY_TOKEN_ONCEKI.json")
          raw = open("_work/ETSY_TOKEN.json", encoding="utf-8").read()
          d = json.loads(raw)
          d.update(access_token=b["access_token"], refresh_token=b["refresh_token"],
                   obtained_at=datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M:%S"),
                   expires_in=b.get("expires_in", 3600), token_type=b.get("token_type", "Bearer"),
                   scope=p.get("scope", d.get("scope")))
          open("_work/ETSY_TOKEN.json", "w", encoding="utf-8").write(
              json.dumps(d, indent=2 if "\n" in raw.strip() else None, ensure_ascii=False) + "\n")
          open("_work/ETSY_TOKEN.json.updated", "w").write("1")
          store = TokenStore("_work/ETSY_TOKEN.json", k, s)
          api = Etsy(store)
          sh = api.get(f"/shops/{os.environ['ETSY_SHOP_ID']}") or {}
          satir = f"{zaman} | YETKI OK | getShop OK | x-remaining-today: {api.remaining}"
          print(satir); open("_kota.txt", "w").write(satir + "\n")
          PY
      - name: Geri yaz ve temizle
        if: ${{ always() && inputs.adim == 'token' }}
        run: |
          set -euo pipefail
          [ -f _kota.txt ] && rclone copyto _kota.txt "gdrive:ASTROLOVE/TEMP/ETSY_KOTA.txt" -q || true
          if [ -f _work/ETSY_TOKEN.json.updated ]; then
            rclone copyto _work/ETSY_TOKEN_ONCEKI.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN_ONCEKI_$(date -u +%Y%m%d_%H%M).json" -q
            rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" -q
            rclone deletefile "gdrive:ASTROLOVE/TEMP/ETSY_YETKI_PKCE.json" -q || true
            echo "Token yazildi, PKCE silindi"
          else
            echo "Token degismedi"
          fi
      - name: Temizlik
        if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

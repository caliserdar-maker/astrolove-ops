name: etsy-arama-kapak

# SALT OKUR: 3 ornek ilanin kapak gorseli (GET /listings/{id}/images) + arama kucuk resmi onizlemesi.
# etsy-arama oturumu (10 Eki 2026). Cikti: Drive ASTROLOVE/TEMP/ETSY_ARAMA_20261010/KAPAK_ONIZLEME/

permissions:
  actions: read
  contents: read

on:
  push:
    branches: [claude/keen-curie-2hza60]
    paths:
      - config/etsy_arama_kapak.trigger

jobs:
  kapak:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2 pillow==11.0.0
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Token
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
      - name: Guvenlik testi (yazma metodu yok)
        run: |
          if grep -nE "api\.(patch|put|post|delete|post_json|put_json|post_file)" scripts/etsy/arama_kapak.py; then
            echo "::error::Salt-okur betikte yazma metodu bulundu"; exit 1
          fi
      - name: Kapak oku (yalniz GET)
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          set -euo pipefail
          python scripts/etsy/arama_kapak.py _out 2>&1 | tee _work/kosu.log
      - name: Token geri yaz + cikti Drive'a
        if: always()
        run: |
          set -euo pipefail
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "Token geri yazildi" || echo "Token yenilenmedi"
          [ -f _work/kosu.log ] && python3 scripts/guvenlik/log_suz.py < _work/kosu.log > _out/kosu_log.txt || true
          cp data/etsy_arama_20261010/KAPAK_KARSILASTIRMA_SABLON.md _out/ 2>/dev/null || true
          rclone copy _out "gdrive:ASTROLOVE/TEMP/ETSY_ARAMA_20261010/KAPAK_ONIZLEME" -q
          rclone lsl "gdrive:ASTROLOVE/TEMP/ETSY_ARAMA_20261010/KAPAK_ONIZLEME"
      - if: always()
        run: rm -rf _work ~/.config/rclone

name: musteri-dal-yedek
# ACIL MUSTERI VERISI (Serdar 21 Eki, madde 0): inceleme/siparis-4188621967 dali silinmeden once TEK KOSU yedek.
# Dalin son agaci (101 dosya) + tum gecmisi (git bundle, 22 commit) Drive SIPARIS_ISIM/DIJITAL/4188621967/DAL_YEDEK_20261021/
# altina; rclone check one-way ile dogrulanir. Once mevcut Drive kopyasi karsilastirilir (bilgi). Log'a dosya icerigi /
# musteri adi yazilmaz (yalniz sayilar). Etsy yok, silme yok, mevcut Drive dosyasina dokunulmaz (--ignore-existing).
permissions:
  contents: read
on:
  workflow_dispatch: {}
jobs:
  yedek:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      K: "gdrive,root_folder_id=1o-sK34SNVvZwULnoHwJ7J15KhedzMReS:"
      O: "gdrive,root_folder_id=1o-sK34SNVvZwULnoHwJ7J15KhedzMReS:DAL_YEDEK_20261021"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: inceleme/siparis-4188621967
          path: _d
          fetch-depth: 0
      - name: Agac + bundle
        run: |
          set -euo pipefail
          mkdir -p _y/AGAC
          ( cd _d && git rev-list --count HEAD && git rev-parse HEAD )
          ( cd _d && git bundle create ../_y/inceleme_siparis-4188621967.bundle HEAD )
          ( cd _d && git bundle verify ../_y/inceleme_siparis-4188621967.bundle >/dev/null && echo "bundle verify OK" )
          ( cd _d && git ls-files -z | xargs -0 -I{} cp --parents {} ../_y/AGAC/ )
          n=$(find _y/AGAC -type f | wc -l); echo "agac dosya $n"; [ "$n" = 101 ] || { echo "::error::dosya sayisi $n (101 bekleniyor)"; exit 1; }
          ( cd _y && find . -type f ! -name SHA256.txt -print0 | sort -z | xargs -0 sha256sum > SHA256.txt )
      - name: rclone
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/rc.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q -j /tmp/rc.zip '*/rclone' -d /tmp/rcb && sudo install -m 755 /tmp/rcb/rclone /usr/local/bin/rclone
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true; fi
      - name: Mevcut Drive kopyasi (bilgi; yalniz sayilar)
        run: |
          set +e
          for alt in "" "KONTROL"; do
            rclone check _y/AGAC "${K}${alt}" --one-way --size-only --combined /tmp/c.txt -q >/dev/null 2>&1
            echo "Drive '${alt:-kok}': ayni $(grep -c '^=' /tmp/c.txt) / eksik $(grep -c '^-' /tmp/c.txt) / farkli $(grep -c '^\*' /tmp/c.txt)"
          done
          echo "Drive 4188621967 toplam dosya: $(rclone lsf -R --files-only "$K" | wc -l)"
      - name: Drive'a yedek + dogrulama
        run: |
          set -euo pipefail
          rclone copy _y "$O" --ignore-existing --transfers 8 -q
          rclone check _y "$O" --one-way -q
          echo "check one-way PASS: $(find _y -type f | wc -l) dosya (101 agac + bundle + SHA256)"
      - if: always()
        run: rm -rf ~/.config/rclone _y

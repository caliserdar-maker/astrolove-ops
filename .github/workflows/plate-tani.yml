name: plate-tani

# SALT OKUR (1 Eki 2026): siparis 4188621967 DB 2x3 'PLATE KIRLI (slogan glifi yok)' tanisi; plate_slogan_kapisi
# (degismeden) cift x renk x boy; FAIL hucrelerde 1:1 kesit. Plate / kaynak DEGISMEZ. Cikti Drive TEMP/PLATE_TANI/<damga>.
# Tetik: config/plate_tani.trigger degisikligi (bu dal).

permissions:
  contents: read

on:
  push:
    branches: [claude/gracious-meitner-i72rkr]
    paths:
      - config/plate_tani.trigger

concurrency: plate-tani

jobs:
  olc:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python bagimliliklari
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pillow opencv-python-headless numpy fonttools img2pdf pikepdf
      - name: rclone kur
        run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONF_B64:-}" ]; then echo "HATA: RCLONE_CONF_B64 yok" >&2; exit 1; fi
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Plate tanisi (salt okur)
        run: |
          set -euo pipefail
          python scripts/medya_v1/plate_tani.py --ciftler CAPRICORN_LEO --renkler DEEP_BLACK --boylar 24x36 --kesit hep --cikti plate_tani/ref
          python scripts/medya_v1/plate_tani.py --ciftler CANCER_LEO --cikti plate_tani
          D=$(date -u +%Y%m%d_%H%M)
          rclone copy plate_tani "gdrive:ASTROLOVE/TEMP/PLATE_TANI/$D" && echo "drive: TEMP/PLATE_TANI/$D"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: plate_tani
          path: plate_tani
          retention-days: 3
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone

name: yd-kart-toplu
# YD 10'lu galeri: kodla uretilen kartlar 78 cift TOPLU (Serdar onayi 27 Eki, ornek 20261027_134934; Merkez). ETSY API YOK, Canva yok,
# Etsy'ye yukleme yok, kilit yok. Girdi: adim 5 yedegi TEMP/YD_KAPAK_V1_YEDEK/<yedek_damga>/<ilan>_<CIFT>/ (GALERI.json + r2 / Botanical /
# Timeless bagli gorseller). Cikti: Drive TEMP/YD_KAPAK_V1/<damga>/ <CIFT>_Y02 / Y03 / Y05 (78 x 3) + ORTAK_Y04 + MANIFEST.csv (tasima
# kaydi; Canva kapak / stil kartlari ayni damgaya yd-kapak-tasi hedef_damga ile eklenir) + KART_TOPLU.json + OZET.md + KONTAK_78.jpg.
# scripts/kapak78/yd_kart_toplu.py (kart cizimi ve kapilar yd_kart_ornek.py).
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      yedek_damga: {description: "TEMP/YD_KAPAK_V1_YEDEK/<damga>", required: true, default: "20261027_105540"}
jobs:
  toplu:
    runs-on: ubuntu-24.04   # Serdar 31 Eki 8a / onay 3: kart determinizmi (simd_calistir)
    timeout-minutes: 60
    steps:
      - name: Girdi kapisi
        env: {YD: "${{ inputs.yedek_damga }}"}
        run: '[[ "$YD" =~ ^[0-9]{8}_[0-9]{6}$ ]] || { echo "::error::girdi"; exit 1; }'
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q pillow==11.0.0 numpy==2.1.3
          sudo apt-get install -y -qq libfribidi0 >/dev/null || true
          python3 -c "from PIL import features, __version__; print('pillow', __version__, 'raqm', features.check('raqm'))"
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || { sudo apt-get install -y -qq rclone >/dev/null; }
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Girdiler (Drive yedegi; Etsy API yok)
        env: {YD: "${{ inputs.yedek_damga }}"}
        run: |
          set -euo pipefail
          mkdir -p _y _out
          Y="gdrive:ASTROLOVE/TEMP/YD_KAPAK_V1_YEDEK/$YD"
          rclone copy "$Y" _y --include "*/GALERI.json" --transfers 16 -q
          echo "GALERI.json: $(ls _y/*/GALERI.json | wc -l)"
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          sat = []
          for r in csv.DictReader(open("data/pod/yd78_ids.csv")):
              d = f"{r['listing_id']}_{r['cift']}"; p = Path("_y") / d / "GALERI.json"
              if not p.exists():
                  print(f"::warning::GALERI.json yok: {d}"); continue
              g = json.loads(p.read_text())
              rk = {x["listing_image_id"]: x["rank"] for x in g["gorseller"]}
              sat += [f"{d}/r2_{x['listing_image_id']}.jpg" for x in g["gorseller"] if x["rank"] == 2]
              sat += [f"{d}/r{rk[b['image_id']]}_{b['image_id']}.jpg" for b in g["baglar"] if b["value"] in ("Botanical", "Timeless") and b["image_id"] in rk]
          Path("_liste.txt").write_text("\n".join(sat) + "\n"); print(f"indirilecek: {len(sat)} dosya")
          PY
          rclone copy "$Y" _y --files-from _liste.txt --transfers 16 -q
          echo "indirilen jpg: $(find _y -name '*.jpg' | wc -l)"
          echo "DAMGA=$(date -u +%Y%m%d_%H%M%S)" >> "$GITHUB_ENV"
      - name: Kartlar (78 cift)
        run: python3 -I scripts/kapak78/simd_calistir.py scripts/kapak78/yd_kart_toplu.py --yedek _y --ciftler data/pod/yd78_ids.csv --out _out --kod-ref "$GITHUB_SHA" --is-sayisi 4
      - name: Drive'a yaz
        if: ${{ always() }}
        run: |
          set -euo pipefail
          rm -rf _out/_cift
          if [ -f _out/MANIFEST.csv ]; then
            sha256sum _out/*.jpg > _out/SHA256.txt; echo "jpg: $(grep -c . _out/SHA256.txt)"
            rclone copy _out "gdrive:ASTROLOVE/TEMP/YD_KAPAK_V1/${DAMGA:?}" --max-depth 1 --immutable --transfers 8 -q
            echo "Cikti: TEMP/YD_KAPAK_V1/${DAMGA} (jpg: $(ls _out/*.jpg | wc -l))" | tee -a "$GITHUB_STEP_SUMMARY"
            head -12 _out/OZET.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: always()
        run: rm -rf _y _out ~/.config/rclone

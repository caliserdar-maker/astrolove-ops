name: galeri-v10-yukle

# Poster 78 galeri v10 (9 gorsel) yukleyicisi (Merkez 26 Eki; Serdar onayi). kuru=true (varsayilan): Etsy salt okuma, PLAN_V10.json
# + plan_damga. ETSY'YE YAZAR yalniz kuru=false + confirm=GALERI_V10 + plan_damga (kuru kosunun plani; canli durum plandan farkliysa
# o ilana yazma yok). scripts/kapak78/galeri_v10_liste.py (kilit oncesi: dosya, alt metin, renk karisma kapilari) +
# scripts/kapak78/galeri_v10_yukle.py (yazim yolu eski78_gorsel_yukle.bir_ilan, hedef_n=9).
# Drive girdileri Etsy kilidi ALINMADAN once indirilir (KILIT SURESI kurali): kapak TEMP/POSTER_KAPAK_V10/20261026_153710,
# kartlar TEMP/POSTER_GALERI_V10/<galeri_damga>, yedek TEMP/POSTER_KAPAK_V10_YEDEK/20261026_144404 (GALERI.json + bagli 5 kart).
# Durum dosyalari (scripts/ops/durum_dosyasi.py kapisi; okuma Etsy kilidi ALINDIKTAN sonra (3 kucuk dosya; ayni anda iki yazim
# kosusu eski durumla calismasin, inceleme 26 Eki), yazma yalniz yazim / bag kosusunda ve okuma basariliysa):
#   TEMP/POSTER_GALERI_V10_YUKLE/DEVAM.json, ILERLEME.json (json-ilanlar), SONUC.csv (csv, anahtar ilan).
# Kosu ciktisi TEMP/POSTER_GALERI_V10_YUKLE/KOSU/<run_id>/ (RAPOR, PLAN_V10.json, ilan kayitlari; yazimda devam/DEVAM_<ilan>.json
# her yazimdan once ve sonra). Runner kaybinda: devam_kosu=<o kosu> ile ilan kopyalari DEVAM.json'a alinir (adimi buyukse).
# bag_onar=true (onay GALERI_V10_BAG + plan_damga): DEVAM kaydi olan ilanlarda YALNIZ renk baglari (eski78 bag_kur, hedef 9).
# Kilit suresi: azami_dk (varsayilan 90) sonrasi yeni ilana baslanmaz; diger Etsy kosulari kilit icin en fazla 120 dk bekler.

permissions:
  actions: read
  contents: read

on:
  workflow_dispatch:
    inputs:
      galeri_damga: {description: "TEMP/POSTER_GALERI_V10/<damga> (YYYYMMDD_HHMMSS)", required: true, default: ""}
      bes_x7: {description: "zorunlu | yok (zorunlu: envanterde 5x7 yoksa BLOK)", required: true, default: ""}
      kuru: {description: "true = yazma yok (plan); false = yazim", required: true, default: "true"}
      confirm: {description: "yazim icin GALERI_V10", required: false, default: ""}
      plan_damga: {description: "yazim: kuru kosunun plan_damga degeri (<kosu>_<sha12>)", required: false, default: ""}
      sadece: {description: "yalniz bu ilanlar (virgullu listing_id); bos = 78", required: false, default: ""}
      haric: {description: "bu ilanlar haric (virgullu listing_id)", required: false, default: ""}
      devam_kosu: {description: "runner kaybi: o kosunun ilan DEVAM kopyalari (bos = yok)", required: false, default: ""}
      kurtar: {description: "true: hata kaydi olan ilanda kayitli plan + canli galeriyle surdur", required: false, default: "false"}
      azami_dk: {description: "yazim: bu sureden sonra yeni ilana baslanmaz (dk)", required: false, default: "90"}
      bag_onar: {description: "true: yalniz renk baglari (DEVAM kaydi olan ilanlar; confirm GALERI_V10_BAG)", required: false, default: "false"}

env:
  T: "gdrive:ASTROLOVE/TEMP"
  O: "gdrive:ASTROLOVE/TEMP/POSTER_GALERI_V10_YUKLE"

jobs:
  is:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Girdi kapisi
        env:
          GD: ${{ inputs.galeri_damga }}
          BX: ${{ inputs.bes_x7 }}
          KURU: ${{ inputs.kuru }}
          ONAY: ${{ inputs.confirm }}
          PD: ${{ inputs.plan_damga }}
          SA: ${{ inputs.sadece }}
          HA: ${{ inputs.haric }}
          DK: ${{ inputs.devam_kosu }}
          KU: ${{ inputs.kurtar }}
          AZ: ${{ inputs.azami_dk }}
          BO: ${{ inputs.bag_onar }}
        run: |
          set -euo pipefail
          [[ "$BO" =~ ^(true|false)$ ]] || { echo "::error::girdi (bag_onar)"; exit 1; }
          [[ "$GD" =~ ^[0-9]{8}_[0-9]{6}$ && "$BX" =~ ^(zorunlu|yok)$ && "$KURU" =~ ^(true|false)$ && "$KU" =~ ^(true|false)$ ]] || { echo "::error::girdi (galeri_damga / bes_x7 / kuru / kurtar)"; exit 1; }
          [[ "$SA" =~ ^([0-9]+(,[0-9]+)*)?$ && "$HA" =~ ^([0-9]+(,[0-9]+)*)?$ && "$DK" =~ ^([0-9]+)?$ && "$AZ" =~ ^[0-9]{1,3}$ ]] || { echo "::error::girdi (sadece / haric / devam_kosu / azami_dk)"; exit 1; }
          if [ "$BO" = true ]; then
            [ "$KURU" = false ] && [ "$ONAY" = GALERI_V10_BAG ] || { echo "::error::bag onarimi icin kuru=false + confirm GALERI_V10_BAG"; exit 1; }
            [[ "$PD" =~ ^[0-9]+_[0-9a-f]{12}$ ]] || { echo "::error::bag onarimi icin plan_damga"; exit 1; }
          elif [ "$KURU" = false ]; then
            [ "$ONAY" = GALERI_V10 ] || { echo "::error::yazim icin confirm GALERI_V10"; exit 1; }
            [[ "$PD" =~ ^[0-9]+_[0-9a-f]{12}$ ]] || { echo "::error::yazim icin plan_damga (<kosu>_<sha12>)"; exit 1; }
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2 numpy==2.1.3 pillow==11.0.0
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Girdiler (Drive, kilit oncesi) + liste kapilari
        env:
          GD: ${{ inputs.galeri_damga }}
          SA: ${{ inputs.sadece }}
          HA: ${{ inputs.haric }}
          KURU: ${{ inputs.kuru }}
          PD: ${{ inputs.plan_damga }}
          BO: ${{ inputs.bag_onar }}
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out _in/kapak _in/galeri _in/yedek
          python3 - <<'PY'
          import csv, os
          sa = {x for x in os.environ["SA"].split(",") if x}; ha = {x for x in os.environ["HA"].split(",") if x}
          R = [r for r in csv.DictReader(open("data/pod/pod78_ids.csv")) if (not sa or r["listing_id"] in sa) and r["listing_id"] not in ha]
          open("_work/kapak.txt", "w").writelines(f"KAPAK_{r['cift']}.jpg\n" for r in R)
          open("_work/galeri.txt", "w").writelines(["ORTAK_G4.jpg\n", "ORTAK_G5.jpg\n"] + [f"{r['cift']}_G{k}.jpg\n" for r in R for k in (2, 3, 6, 7, 8, 9)])
          open("_work/yedek_json.txt", "w").writelines(f"{r['listing_id']}_{r['cift']}/GALERI.json\n" for r in R)
          print(f"kapsam: {len(R)} ilan")
          PY
          rclone copy "$T/POSTER_KAPAK_V10/20261026_153710" _in/kapak --files-from _work/kapak.txt --transfers 8 -q
          rclone copy "$T/POSTER_GALERI_V10/$GD" _in/galeri --files-from _work/galeri.txt --transfers 8 -q
          Y="$T/POSTER_KAPAK_V10_YEDEK/20261026_144404"
          rclone copy "$Y" _in/yedek --files-from _work/yedek_json.txt --transfers 8 -q
          python3 - <<'PY'
          import json, pathlib
          out = []
          for g in sorted(pathlib.Path("_in/yedek").glob("*/GALERI.json")):
              j = json.loads(g.read_text()); rk = {x["listing_image_id"]: x["rank"] for x in j["gorseller"]}
              out += [f"{g.parent.name}/r{rk.get(b['image_id'])}_{b['image_id']}.jpg\n" for b in j["baglar"]]
          open("_work/yedek_kart.txt", "w").writelines(out)
          PY
          rclone copy "$Y" _in/yedek --files-from _work/yedek_kart.txt --transfers 8 -q
          # yedek tamligi (inceleme 26 Eki): yukleyici CDN yedegi almaz; silinecek 17 gorselin Drive yedegi listeden dogrulanir
          rclone copyto "$Y/OZET.md" _work/YEDEK_OZET.md
          rclone lsjson -R "$Y" --files-only --include "*.jpg" > _work/yedek_ls.json
          echo "indirilen: kapak $(ls _in/kapak | wc -l), galeri $(ls _in/galeri | wc -l), yedek kart $(ls _in/yedek/*/*.jpg 2>/dev/null | wc -l)"
          if [ "$KURU" = false ] && [ "$BO" = false ]; then
            rclone copyto "$O/KOSU/${PD%%_*}/PLAN_V10.json" _work/PLAN_V10.json || { echo "::error::PLAN_V10.json yok (KOSU/${PD%%_*})"; exit 1; }
            YZ=--yazim
          else
            YZ=
          fi
          python3 scripts/kapak78/galeri_v10_liste.py --ciftler data/pod/pod78_ids.csv --alt data/pod/galeri_v10_alt.csv \
            --kapak-dir _in/kapak --galeri-dir _in/galeri --yedek-dir _in/yedek --yedek-ozet _work/YEDEK_OZET.md \
            --yedek-liste _work/yedek_ls.json --out _hazir --sadece "$SA" --haric "$HA" $YZ
          cp _hazir/LISTE_OZET.md _out/ && cp _hazir/LISTE_OZET.json _out/
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - name: Durum dosyalari oku (kilit sonrasi)
        env:
          DK: ${{ inputs.devam_kosu }}
        run: |
          set -euo pipefail
          umask 077
          # durum kapisi (26 Eki, Serdar onayi): okuma hatasinda bos varsayilanla devam YOK
          python3 scripts/ops/durum_dosyasi.py oku --uzak "$O/DEVAM.json" --yerel _work/DEVAM.json --durum _work/DURUM_DEVAM \
            --tur json-ilanlar --ilk-kayit-izni
          python3 scripts/ops/durum_dosyasi.py oku --uzak "$O/ILERLEME.json" --yerel _work/ILERLEME.json --durum _work/DURUM_ILERLEME \
            --tur json-ilanlar --ilk-kayit-izni
          python3 scripts/ops/durum_dosyasi.py oku --uzak "$O/SONUC.csv" --yerel _work/SONUC.csv --durum _work/DURUM_SONUC \
            --tur csv --anahtar ilan --ilk-kayit-izni
          if [ -n "$DK" ]; then
            mkdir -p _work/devam_kosu
            rclone copy "$O/KOSU/$DK/devam" _work/devam_kosu --include "DEVAM_*.json" --max-depth 1 -q
            python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("_work/DEVAM.json"); d = json.loads(p.read_text())
          for f in sorted(pathlib.Path("_work/devam_kosu").glob("DEVAM_*.json")):
              lid = f.stem.split("_", 1)[1]; k = json.loads(f.read_text()); e = d["ilanlar"].get(lid) or {}
              if int(k.get("adim") or 0) >= int(e.get("adim") or 0):
                  d["ilanlar"][lid] = dict(k, cift=e.get("cift") or k.get("cift") or "-", durum=e.get("durum") or "DUR")
                  print(f"devam_kosu: {lid} adim {k.get('adim')} (onceki {e.get('adim')})")
          p.write_text(json.dumps(d, indent=1) + "\n")
          PY
          fi
      - name: Token
        run: |
          set -euo pipefail
          umask 077
          rclone copyto "$T/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
      - name: Galeri v10
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          BX: ${{ inputs.bes_x7 }}
          KURU: ${{ inputs.kuru }}
          PD: ${{ inputs.plan_damga }}
          KU: ${{ inputs.kurtar }}
          AZ: ${{ inputs.azami_dk }}
          BO: ${{ inputs.bag_onar }}
        run: |
          set +e -o pipefail
          args=(--hazir _hazir --out _out --devam _work/DEVAM.json --ilerleme _work/ILERLEME.json --bes-x7 "$BX")
          if [ "$KURU" = true ]; then args+=(--kuru)
          elif [ "$BO" = true ]; then args+=(--bag-onar --confirm GALERI_V10_BAG --plan-damga "$PD")
          else
            args+=(--confirm GALERI_V10 --plan _work/PLAN_V10.json --plan-damga "$PD" --sonuc _work/SONUC.csv --azami-dk "$AZ"
                   --devam-hedef-kok "$O/KOSU/${GITHUB_RUN_ID}/devam")
            [ "$KU" = true ] && args+=(--kurtar)
          fi
          python3 scripts/kapak78/galeri_v10_yukle.py "${args[@]}" 2>&1 | tee _work/kosu.log
          echo "KOD=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
      - name: Token + durum dosyalari + cikti Drive'a
        if: always()
        env:
          KURU: ${{ inputs.kuru }}
        run: |
          set -uo pipefail
          FAIL=""
          # Token geri yazimi (Serdar 27 Eki): yenilenen refresh token kaybolursa tum Etsy kosulari durur. 3 deneme; olmazsa
          # kosu acik hata verir (durum dosyalari yine yazilir, cikis en sonda).
          TOKEN_FAIL=""
          if [ -f _work/ETSY_TOKEN.json.updated ]; then
            TOKEN_FAIL=1
            for n in 1 2 3; do
              if rclone copyto _work/ETSY_TOKEN.json "$T/ETSY_TOKEN.json"; then TOKEN_FAIL=""; echo "Token geri yazildi (deneme $n)"; break; fi
              echo "Token geri yazimi basarisiz (deneme $n)"; sleep 10
            done
            [ -z "$TOKEN_FAIL" ] || echo "::error::ETSY TOKEN GERI YAZILAMADI (3 deneme). Yeni refresh token kaybolabilir; Etsy kosulari baslatma, Merkez'e bildir."
          else
            echo "Token yenilenmedi (yenileme yok)"
          fi
          [ -f _work/kosu.log ] && python3 scripts/guvenlik/log_suz.py < _work/kosu.log > "_out/kosu_$(date -u +%Y%m%d_%H%M).txt"
          if grep -rqE '"(access_token|refresh_token)"[[:space:]]*:[[:space:]]*"[A-Za-z0-9._-]{20,}"|x-api-key[[:space:]]*:' _out/ 2>/dev/null; then
            echo "::error::Ciktida sir bulundu; Drive'a yazilmadi"; exit 1; fi
          if [ "$KURU" = false ] && [ -n "${KOD:-}" ]; then
            for x in "DEVAM.json json-ilanlar" "ILERLEME.json json-ilanlar" "SONUC.csv csv"; do
              set -- $x; ek=""; [ "$2" = csv ] && ek="--anahtar ilan"
              if [ -f "_work/DURUM_${1%%.*}/ONCE" ]; then
                python3 scripts/ops/durum_dosyasi.py yaz --uzak "$O/$1" --yerel "_work/$1" --durum "_work/DURUM_${1%%.*}" --tur "$2" $ek \
                  --ilk-kayit-izni || FAIL=1
              else
                echo "::error::$1 okunamadi; Drive'a yazilmadi"; FAIL=1
              fi
            done
          fi
          [ -d _out ] && rclone copy _out "$O/KOSU/${GITHUB_RUN_ID}" -q && echo "::notice title=GALERI V10::Drive TEMP/POSTER_GALERI_V10_YUKLE/KOSU/${GITHUB_RUN_ID}/"
          [ -f _out/RAPOR.md ] && head -60 _out/RAPOR.md >> "$GITHUB_STEP_SUMMARY" || true
          [ -z "$FAIL" ] || { echo "::error::durum dosyasi kapisi FAIL"; exit 1; }
          [ -z "$TOKEN_FAIL" ] || exit 1
          [ "${KOD:-1}" = 0 ] || { echo "::error::cikis ${KOD:-?}"; exit 1; }
      - if: always()
        run: rm -rf _work _in _hazir ~/.config/rclone

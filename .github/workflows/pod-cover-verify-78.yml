name: pod-cover-verify-78

# POD Gold B kapak isinin SALT OKUR dogrulamasi (Mo 18 Eyl 2026).
# Etsy'ye HICBIR yazma cagrisi yapilmaz; yalniz GET. ADIM 1 (state.json)
# gecmezse ADIM 2 (canli geri-okuma) hic baslamaz ve Etsy'ye dokunulmaz.
# Cikti: ASTROLOVE/TEMP/POD_COVER_GOLD_B_77/ altina VERIFY_<tarih>.csv

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      skip_live:
        description: "true = yalniz ADIM 1 (Etsy'ye hic dokunma)"
        type: boolean
        default: false

concurrency:
  group: etsy-token
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SKIP_LIVE: ${{ inputs.skip_live }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2 numpy==2.1.3 pillow==11.0.0
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Girdiler (state.json + token)
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/POD_COVER_GOLD_B_77/state.json" _work/state.json
          echo "state.json bayt: $(stat -c%s _work/state.json)"
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
      - name: 'ADIM 1 + ADIM 2 (salt okur)'
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          set -euo pipefail
          args=(--state _work/state.json --catalog scripts/etsy/seo/pod_changes_v2.json --out _out)
          [ "$SKIP_LIVE" = "true" ] && args+=(--skip-live)
          python scripts/etsy/pod_cover_verify_78.py "${args[@]}"
      - name: Token geri yazma + cikti Drive'a
        if: ${{ always() }}
        run: |
          set -euo pipefail
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "Token geri yazildi" || true
          if grep -rqE '"(access_token|refresh_token)"[[:space:]]*:[[:space:]]*"[A-Za-z0-9._-]{20,}"|x-api-key[[:space:]]*:[[:space:]]*[A-Za-z0-9_-]{16,}|GOCSPX-[A-Za-z0-9_-]{10,}' _out/ 2>/dev/null; then
            echo "::error::ciktida sir DEGERI bulundu, Drive'a yazilmadi"; exit 1
          fi
          rclone copy _out "gdrive:ASTROLOVE/TEMP/POD_COVER_GOLD_B_77" -q
          rclone lsf "gdrive:ASTROLOVE/TEMP/POD_COVER_GOLD_B_77" | head -20
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: pod-cover-verify-78
          path: _out/
          if-no-files-found: ignore
      - if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

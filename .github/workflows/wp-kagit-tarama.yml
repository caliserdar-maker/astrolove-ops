name: wp-kagit-tarama

# WP KAGIT TARAMASI (Serdar onayi 2 Eki, Tani 2; salt okur). 78 cift x tek boy: onayli WARM_PARCHMENT kaynagi vs
# VINTAGE_<boy> plate, uretim zemin_uyumu olcumu (scripts/wp/kagit_tarama.py) + Drive meta (btime / modtime / md5).
# Cikti yalniz Drive TEMP/WP_KAGIT_TARAMA/<run_id>/. Isim / mesaj / musteri verisi YOK. Etsy YOK.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      boy: {description: "WP boyu", required: false, default: "11x14"}
      wp_ref: {description: "WP kodu (wp_katman) commit", required: false, default: "adfb2b99489798296936669575309b777c7e1ca7"}

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BOY: ${{ inputs.boy }}
    steps:
      - name: Girdi denetimi
        run: |
          set -euo pipefail
          jq -re '.inputs.boy | test("^[0-9A-Za-z]+$")' "$GITHUB_EVENT_PATH" >/dev/null
          jq -re '.inputs.wp_ref | test("^[0-9a-f]{40}$")' "$GITHUB_EVENT_PATH" >/dev/null
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.wp_ref }}
          path: _wp
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow numpy opencv-python-headless
      - run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Indir + meta (salt okur)
        run: |
          set -euo pipefail
          T0=$(date +%s)
          P=gdrive:ASTROLOVE/TEMP/POD_PRINT
          mkdir -p out _ham _src
          rclone lsjson -R --metadata --hash "$P" --include "*/WARM_PARCHMENT/$BOY.jpg" > out/META_KAYNAK.json
          rclone lsjson --metadata --hash gdrive:ASTROLOVE/TEMP/SIPARIS_ISIM/PLATES --include "VINTAGE_*.png" > out/META_PLATE.json
          rclone copy "$P" _ham --include "*/WARM_PARCHMENT/$BOY.jpg" --transfers 12
          for d in _ham/*/; do c=$(basename "$d"); [ -f "$d/WARM_PARCHMENT/$BOY.jpg" ] && mv "$d/WARM_PARCHMENT/$BOY.jpg" "_src/$c.jpg"; done
          rclone copyto "gdrive:ASTROLOVE/TEMP/SIPARIS_ISIM/PLATES/VINTAGE_$BOY.png" _plate.png
          echo "kaynak sayisi $(ls _src | wc -l)"; echo "SURE indir $(( $(date +%s) - T0 )) sn"
      - name: Tara
        run: |
          T0=$(date +%s)
          python scripts/wp/kagit_tarama.py --wp-kod _wp/scripts/medya_v1 --plate _plate.png --dizin _src --cik out/TARAMA_$BOY.jsonl
          echo "SURE tara $(( $(date +%s) - T0 )) sn"
      - name: Drive
        if: ${{ always() }}
        run: |
          set -euo pipefail
          rclone copy out "gdrive:ASTROLOVE/TEMP/WP_KAGIT_TARAMA/${{ github.run_id }}/"
          echo "drive: TEMP/WP_KAGIT_TARAMA/${{ github.run_id }}/"
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone

name: poster-metin-yaz
# P1 poster aciklama yazimi (Serdar 4 Kas PLAN_P1.md "A", P1-K "A", P1-RU onayli). Etsy'ye YAZAR: yalniz EN aciklama + RU aciklama.
# Kod: scripts/etsy/poster_metin_yaz.py (YALNIZ P1 kipi; uyarlayici p1_poster_kuru.plan_ilan). Onayli metin + onay ozeti + yedek: Drive
# TEMP/P1_KURU_20261104_1255 (kosu 41833440548) ONCE_SONRA.json + FARK.csv; sha256 Python'da (yukle) sabitle karsilastirilir, farkliysa
# Etsy isteginden ONCE DUR. 3 Kas yolu (eski kuru klasoru, YEDEK.json) CIKARILDI. Kilit: kilit_bekle.py checkout'tan hemen
# sonra, token indirmeden ONCE. Kota: ilan basina kalan >= 20 + 10 (Serdar P1-K "A"), her istekte KOTA_SINIRI 10.
# Cikti: Drive TEMP/P1_YAZ_<UTC damga>/ (DEGISIKLIK.csv: EN_BASLADI + sonuc satiri, LOG.txt sir taramasindan gecmis).
# onay "P1-METIN-<KIP>-<ids>" (KIP: KURU | YAZ | GERI); ids zorunlu (varsayilan bos). Pilot: ids=4570165628 uygula=1
# onay=P1-METIN-YAZ-4570165628. Onay kapisi hem asagidaki bash adiminda (kilitten once) hem Python'da (onay_kontrol).
permissions:
  actions: read
  contents: read
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "ilan id'leri (virgulle; zorunlu). Pilot: 4570165628"
        required: true
        default: ""
      onay:
        description: "P1-METIN-<KURU|YAZ|GERI>-<ids> (kip + ids birebir); farkliysa kosu durur"
        required: true
        default: ""
      uygula:
        description: "1 = yaz; 0 = kuru (yazim yok)"
        default: "0"
      geri_al:
        description: "1 = geri al (P1: EN = en_once, RU = ru_geri); yalniz Serdar onayiyla"
        default: "0"
jobs:
  yaz:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - name: Onay kapisi
        env:
          IDS: ${{ inputs.ids }}
          ONAY: ${{ inputs.onay }}
          UYGULA: ${{ inputs.uygula }}
          GERI: ${{ inputs.geri_al }}
        run: |
          [[ "$IDS" =~ ^[0-9]+(,[0-9]+)*$ ]] || { echo "::error::ids bicimi"; exit 1; }
          K=KURU; [ "$UYGULA" = "1" ] && K=YAZ; [ "$UYGULA" = "1" ] && [ "$GERI" = "1" ] && K=GERI
          [ "$GERI" = "1" ] && [ "$UYGULA" != "1" ] && K=KURU
          [ "$ONAY" = "P1-METIN-$K-$IDS" ] || { echo "::error::onay girdisi P1-METIN-$K-<ids> degil"; exit 1; }
      - uses: actions/checkout@v4
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kurulum
        run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || { sudo apt-get install -y -qq rclone >/dev/null; }
          echo "CIKTI=P1_YAZ_$(date -u +%Y%m%d_%H%M%S)" >> "$GITHUB_ENV"
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"; echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Token + onayli kuru plan
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out _kuru
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
          for f in ONCE_SONRA.json FARK.csv; do
            rclone copyto "gdrive:ASTROLOVE/TEMP/P1_KURU_20261104_1255/$f" "_kuru/$f"
            [ -s "_kuru/$f" ] || { echo "::error::kuru plan dosyasi yok: $f"; exit 1; }
          done
      - name: Yaz
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          IDS: ${{ inputs.ids }}
          ONAY: ${{ inputs.onay }}
          UYGULA: ${{ inputs.uygula }}
          GERI: ${{ inputs.geri_al }}
        run: |
          set -o pipefail
          A=""; [ "$UYGULA" = "1" ] && A="--uygula"; [ "$GERI" = "1" ] && A="$A --geri-al"
          python3 scripts/etsy/poster_metin_yaz.py --kuru _kuru --ids "$IDS" --onay "$ONAY" --out _out $A 2>&1 \
            | python3 scripts/guvenlik/sir_koru.py tee --sir-json _work/ETSY_TOKEN.json _out/LOG.txt
      - name: Token geri yaz + cikti Drive'a
        if: ${{ always() }}
        run: |
          TOKEN_RC=0; OUT_RC=0; bash scripts/etsy/token_geri_yaz.sh || TOKEN_RC=1
          if ls _out/* >/dev/null 2>&1; then
            python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/ETSY_TOKEN.json _out || { echo "::error::ciktida sir"; exit 1; }
            rclone copy _out "gdrive:ASTROLOVE/TEMP/${CIKTI:?}" --immutable -q && echo "::notice title=P1-YAZ::TEMP/$CIKTI/" || OUT_RC=1
          fi
          [ "$TOKEN_RC" = 0 ] && [ "$OUT_RC" = 0 ] || exit 1
      - if: always()
        run: rm -rf _work ~/.config/rclone

name: ilan-gorsel-indir

# SALT OKUMA: ilanin canli galeri gorsellerini Drive TEMP/CANLI_GORSEL/<ilan>/ altina indirir (yalniz API anahtari).

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      ilan:
        description: "ilan id"
        default: "4570143815"
      yedek_adi:
        description: "Doluysa galeri.json Drive TEMP/POD_KAPAK_V3/<yedek_adi>.json olarak da yazilir (or. CL_ONCE)"
        required: false
        default: ""

jobs:
  indir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Indir
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ILAN: ${{ inputs.ilan }}
          YEDEK: ${{ inputs.yedek_adi }}
        run: |
          set -euo pipefail
          python scripts/etsy/ilan_gorsel_indir.py "$ILAN" "out/$ILAN"
          rclone copy "out/$ILAN" "gdrive:ASTROLOVE/TEMP/CANLI_GORSEL/$ILAN" -q
          if [ -n "${YEDEK:-}" ]; then
            rclone copyto "out/$ILAN/galeri.json" "gdrive:ASTROLOVE/TEMP/POD_KAPAK_V3/${YEDEK}.json" -q
            echo "yedek: TEMP/POD_KAPAK_V3/${YEDEK}.json"
          fi
      - if: always()
        run: rm -rf ~/.config/rclone

name: plate-iz-olc

# SALT OKUR (1 Eki 2026): BLUE_24x36 plate (temizlik oncesi YEDEK) mesaj bandi iz olcumu, hiza penceresi +-150 (2400 px).
# PLATES'e yazma YOK. Tetik: config/plate_iz_olc.trigger (bu dal).

permissions:
  contents: read

on:
  push:
    branches: [claude/gracious-meitner-i72rkr]
    paths:
      - config/plate_iz_olc.trigger

concurrency: plate-iz-olc

jobs:
  olc:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 980e45e22d3e0b611638d01398403bb8394efb98
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python bagimliliklari
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pillow opencv-python-headless numpy fonttools img2pdf pikepdf
      - name: rclone kur
        run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONF_B64:-}" ]; then echo "HATA: RCLONE_CONF_B64 yok" >&2; exit 1; fi
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: MB 24x36 plate iz olcumu (yedek, +-150)
        run: |
          set +e
          python scripts/medya_v1/plate_iz_temizle.py --renkler MIDNIGHT_BLUE --boylar 24x36 --kayma 150 \
            --plate_klasor PLATES_YEDEK_IZ_20261001_1412 --cikti plate_olc
          D=$(date -u +%Y%m%d_%H%M)
          rclone copy plate_olc "gdrive:ASTROLOVE/TEMP/PLATE_IZ_OLC/$D" --include '*.json' --include 'KESIT_*' && echo "drive: TEMP/PLATE_IZ_OLC/$D"
          exit 0
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone

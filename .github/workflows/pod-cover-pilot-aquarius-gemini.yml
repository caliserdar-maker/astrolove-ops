name: POD cover pilot — Aquarius Gemini

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pod-cover-pilot-aquarius-gemini.yml"

permissions:
  contents: read

concurrency:
  group: etsy-token
  cancel-in-progress: false

jobs:
  apply-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependencies
        run: |
          set -euo pipefail
          pip install -q -r requirements.txt
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: Configure Drive
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone
          umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
      - name: Fetch token and exact-crop pilot
        run: |
          set -euo pipefail
          umask 077
          mkdir -p _work
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
          rclone copyto "gdrive:ASTROLOVE/POD_Aquarius_Gemini_COVER_CROP_PILOT.jpg" _work/pilot.jpg
      - name: Replace only rank 1
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          set -euo pipefail
          python scripts/etsy/wp_image_replace.py --listing 4570112095 --rank 1 --file _work/pilot.jpg --min-size 2400x3000 --apply
      - name: Persist refreshed token
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ -f _work/ETSY_TOKEN.json.updated ]; then
            rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json"
          fi
      - name: Cleanup
        if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

name: pod-sablon-v5

# Poster icerigi baski dosyasindan DEGIL, ilanin KENDI videosundan alinir.
# ADIM 1: 77 ilan siniflanir (S1/S2/S3, yalniz GET).
# ADIM 2-3: S1 orneklerinde panel ici referans videonun panel kutusuna birebir
# tasinir (kompozit ham yuv420p duzleminde, panel disi referansin baytlari).
# Etsy'ye YAZMA YOK. Cikti: ASTROLOVE/TEMP/POD_REFERANS_ORNEK_V5/

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      ornek_ids:
        description: "Uretilecek ornekler (virgullu)"
        required: false
        default: "4570031205,4570125580,4570110641"
      uretmeyen_ids:
        description: "Uretilmeyecek, yalniz sinifi raporlanacak ilanlar"
        required: false
        default: "4570224058,4570126104"
      sinif_limit:
        description: "Siniflanacak ilan sayisi (0 = hepsi)"
        required: false
        default: "0"

concurrency:
  group: etsy-token
  cancel-in-progress: false

jobs:
  sablon:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      ORNEK_IDS: ${{ inputs.ornek_ids }}
      URETMEYEN_IDS: ${{ inputs.uretmeyen_ids }}
      SINIF_LIMIT: ${{ inputs.sinif_limit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2 numpy==2.1.3 pillow==11.0.0 scipy==1.14.1
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg tesseract-ocr >/dev/null
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          tesseract --version | head -1
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Token
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
      - name: 'V5 sinif + ornek uretimi (kuru deneme)'
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          set -euo pipefail
          python scripts/pod/pod_sablon_v5.py \
            --catalog scripts/etsy/seo/pod_changes_v2.json --out _out \
            --ornek-ids "$ORNEK_IDS" --uretmeyen-ids "$URETMEYEN_IDS" \
            --sinif-limit "$SINIF_LIMIT"
          boyut=$(stat -c%s _out/KARSILASTIRMA_V5.jpg)
          echo "KARSILASTIRMA_V5.jpg: $boyut bayt"
          [ "$boyut" -ge 200000 ] || { echo "::error::karsilastirma gorseli bos"; exit 1; }
      - name: Token geri yazma + cikti Drive'a
        if: ${{ always() }}
        run: |
          set -euo pipefail
          mkdir -p _out
          if [ -f _work/ETSY_TOKEN.json.updated ]; then
            rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json"
            echo "Token geri yazildi"
          fi
          rm -rf _out/_is
          if grep -rqE '"(access_token|refresh_token)"[[:space:]]*:[[:space:]]*"[A-Za-z0-9._-]{20,}"|x-api-key[[:space:]]*:[[:space:]]*[A-Za-z0-9_-]{16,}|GOCSPX-[A-Za-z0-9_-]{10,}' _out/ 2>/dev/null; then
            echo "::error::ciktida sir DEGERI bulundu, Drive'a yazilmadi"; exit 1
          fi
          rclone copy _out "gdrive:ASTROLOVE/TEMP/POD_REFERANS_ORNEK_V5" -q
          rclone lsf --format "sp" "gdrive:ASTROLOVE/TEMP/POD_REFERANS_ORNEK_V5"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: pod-sablon-v5
          path: |
            _out/*.csv
            _out/*.json
            _out/*.md
            _out/*.jpg
          if-no-files-found: ignore
      - if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

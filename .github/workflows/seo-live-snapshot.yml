name: seo-live-snapshot

# 546 aktif ilanin baslik/aciklama/etiket/kategori/nitelik snapshot'i.
# SALT OKUR: Etsy API'ye yalniz GET cagrisi yapar; ilan ve Ads ayari degistirmez.

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    paths:
      - config/seo_live_snapshot.trigger

concurrency:
  group: etsy-token
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Run SEO live snapshot'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Token
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out
          stamp=$(date -u +%Y%m%d_%H%M); echo "STAMP=$stamp" >> "$GITHUB_ENV"
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
      - name: Guvenlik testi
        run: |
          set -euo pipefail
          python -m unittest scripts/etsy/test_seo_live_snapshot.py
          if rg -n "api\.(patch|put|post|delete|post_json|put_json|post_file)" scripts/etsy/seo_live_snapshot.py; then
            echo "::error::Salt-okur betikte yazma metodu bulundu"; exit 1
          fi
      - name: Canli snapshot (yalniz GET)
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          set -euo pipefail
          python scripts/etsy/seo_live_snapshot.py --out _out --expected-count 546 --quota-buffer 60
      - name: Token ve cikti Drive'a
        if: ${{ always() }}
        run: |
          set -euo pipefail
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" || true
          if grep -rqE '"(access_token|refresh_token)"[[:space:]]*:[[:space:]]*"[A-Za-z0-9._-]{20,}"|x-api-key[[:space:]]*:' _out/ 2>/dev/null; then
            echo "::error::Ciktida sir bulundu; Drive'a yazilmadi"; exit 1
          fi
          [ -d _out ] && rclone copy _out "gdrive:ASTROLOVE/TEMP/SEO_LIVE_SNAPSHOT/${STAMP}" -q
          echo "Cikti: ASTROLOVE/TEMP/SEO_LIVE_SNAPSHOT/${STAMP}/"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: seo-live-snapshot
          path: _out/
          if-no-files-found: ignore
      - if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

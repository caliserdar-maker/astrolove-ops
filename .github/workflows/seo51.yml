name: seo51

# 78 POD ilani yeni baslik + 13 etiket + aciklama ilk 2 cumle + Subject/Room/Holiday (Serdar onayi, Merkez 11 Eki).
# mod yedek: SALT OKUMA -> Drive TEMP/ETSY_ARAMA_20261010/51_YEDEK_ONCE.json + 51_ON_DENETIM.csv (ustune yazilmaz).
# mod yaz  : ETSY'YE YAZAR (onay SEO51). Once pilot cift=CANCER_LEO,SCORPIO_SCORPIO,CAPRICORN_SAGITTARIUS; kayit 51_YAZIM/rapor,
#            rapor 52_YAZIM_RAPORU.csv. Yapilan PASS ilan tekrar yazilmaz. Ilk FAIL'de DUR.
# mod ham  : SALT OKUMA, 78 ilan ham geri okuma -> 53_GERI_OKUMA_HAM.json (Merkez bagimsiz kontrol).
# mod geri : ETSY'YE YAZAR (onay GERIAL): yedekten eski hal. YALNIZ Serdar onayiyla.
# Etsy kilidi (kilit_bekle.py), token geri yazilir, sir loga yazilmaz.

permissions:
  actions: read
  contents: read

on:
  workflow_dispatch:
    inputs:
      mod: {description: "yedek | yaz | geri", required: true, type: choice, options: [yedek, yaz, geri, ham]}
      cift: {description: "yaz/geri: virgullu cift listesi (bos = hepsi)", required: false, default: ""}
      onay: {description: "yaz icin SEO51, geri icin GERIAL", required: false, default: ""}

jobs:
  is:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kurulum
        run: |
          set -euo pipefail
          pip install -q numpy==2.1.3 pillow==11.0.0 requests==2.34.2
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true; fi
      - name: Etsy (yedek / yaz / geri)
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          MOD: ${{ inputs.mod }}
          CIFT: ${{ inputs.cift }}
          ONAY: ${{ inputs.onay }}
        run: |
          set +e -uo pipefail   # varsayilan bash -e: sonucsuz grep adimi durdurmasin (11 Eki yedek kosusu)
          case "$CIFT" in *[!A-Z_,]*) echo "::error::cift A-Z_ ve virgul"; exit 1 ;; esac
          umask 077; mkdir -p _work _out
          T="gdrive:ASTROLOVE/TEMP"; E="$T/ETSY_ARAMA_20261010"; K=data/seo/50_KARAR_YAZIM_20261011.csv
          rclone copyto "$T/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
          if [ "$MOD" = "ham" ]; then
            # Merkez bagimsiz kontrolu (11 Eki): 78 ilan API'den geldigi gibi, karsilastirma yok
            python3 scripts/etsy/seo51_yaz.py ham --karar $K --out _out | tee _work/log.txt; RC=${PIPESTATUS[0]}
            H="$E/53_GERI_OKUMA_HAM.json"; [ -n "$(rclone lsf "$H" 2>/dev/null)" ] && H="$E/53_GERI_OKUMA_HAM_$(date -u +%Y%m%d_%H%M%S).json"
            rclone copyto _out/53_GERI_OKUMA_HAM.json "$H" -q && echo "::warning::HAM $H"
          elif [ "$MOD" = "yedek" ]; then
            [ -z "$(rclone lsf "$E/51_YEDEK_ONCE.json" 2>/dev/null)" ] || { echo "::error::51_YEDEK_ONCE.json zaten var, ustune yazilmaz"; exit 1; }
            rclone copyto "$E/46_NITELIK_SECENEK.csv" _work/46.csv -q
            python3 scripts/etsy/seo51_yaz.py yedek --karar $K --nitelik _work/46.csv --out _out | tee _work/log.txt; RC=${PIPESTATUS[0]}
            rclone copyto _out/51_YEDEK_ONCE.json "$E/51_YEDEK_ONCE.json" -q && rclone copyto _out/51_ON_DENETIM.csv "$E/51_ON_DENETIM.csv" -q
            rclone check _out "$E" --include "51_*" --one-way -q && echo "::warning::yedek Drive'da dogrulandi (rclone check)"
            grep FAIL _out/51_ON_DENETIM.csv | head -5 | sed 's/^/::warning::ON_DENETIM /' || true
          else
            rclone copyto "$E/51_YEDEK_ONCE.json" _work/51_YEDEK_ONCE.json -q || { echo "::error::yedek yok"; exit 1; }
            rclone copy "$E/51_YAZIM" _out -q 2>/dev/null || true
            if [ "$MOD" = "yaz" ]; then
              [ "$ONAY" = "SEO51" ] || { echo "::error::onay SEO51 degil, yazma yok"; exit 1; }
              # Ek kural (Merkez + Serdar 11 Eki): on denetimde tek ilan bile FAIL ise hicbir ilana yazilmaz
              rclone copyto "$E/51_ON_DENETIM.csv" _work/51_ON_DENETIM.csv -q || { echo "::error::on denetim yok"; exit 1; }
              NF=$(awk -F, 'NR>1 && $3!="PASS"' _work/51_ON_DENETIM.csv | wc -l); NP=$(awk -F, 'NR>1 && $3=="PASS"' _work/51_ON_DENETIM.csv | wc -l)
              [ "$NF" = 0 ] && [ "$NP" = 78 ] || { echo "::error::on denetim FAIL $NF / PASS $NP, yazma yok"; exit 1; }
              python3 scripts/etsy/seo51_yaz.py yaz --karar $K --yedek _work/51_YEDEK_ONCE.json --out _out --confirm SEO51 --cift "$CIFT" | tee _work/log.txt; RC=${PIPESTATUS[0]}
            else
              [ "$ONAY" = "GERIAL" ] || { echo "::error::onay GERIAL degil, yazma yok"; exit 1; }
              python3 scripts/etsy/seo51_yaz.py geri --yedek _work/51_YEDEK_ONCE.json --out _out --confirm GERIAL --cift "$CIFT" | tee _work/log.txt; RC=${PIPESTATUS[0]}
            fi
            rclone copy _out "$E/51_YAZIM" -q
            [ -f _out/52_YAZIM_RAPORU.csv ] && rclone copyto _out/52_YAZIM_RAPORU.csv "$E/52_YAZIM_RAPORU.csv" -q
          fi
          grep -E "OZET|DUR|HATA|FAIL|\] [A-Z_]+ (PASS|FAIL)" _work/log.txt | tail -8 | sed 's/^/::warning::/' || true
          echo "RC=$RC" >> "$GITHUB_ENV"
      - name: Token + kontrol
        if: ${{ always() }}
        run: |
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "Token geri yazildi" || true
          if grep -rqE 'x-api-key|refresh_token|"access_token"' _out/ 2>/dev/null; then echo "::error::ciktida sir benzeri anahtar"; exit 1; fi
          [ "${RC:-1}" = "0" ]
      - if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

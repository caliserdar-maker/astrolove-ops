name: ornament-taslak
# ORNAMENT 78 Etsy TASLAK (Serdar 6 Kas gece: taslak olustur, yayin sabah ayri onay; gece onaylari Merkez'de). YAYIN YOK, Etsy Ads YOK.
# Kod: scripts/etsy/ornament_taslak.py. Metin: data/pod/ORNAMENT78_METIN.csv. Ayar: docs/ornament/ORN_ETSY_AYAR.json.
# mod=oku : SALT OKUMA (kategori/nitelik, hazirlik, iade, ortak, bolum, kargo, taslaklar).
# mod=kur : yalniz yoksa: hazirlik 3-5 is gunu, kargo profili "Ornament Free Worldwide" (LV, ucretsiz), bolum "Zodiac Couple Ornaments".
# mod=kuru: AG/TOKEN YOK; galeri indirilir, gonderilecek istekler KURU_<CIFT>.json.
# mod=yaz : cift basina 1 YENI taslak + tam geri okuma. PATCH yalniz acil state=inactive. DELETE yok.
# Galeri: Drive ASTROLOVE/TEMP/<galeri>/<CIFT>/ (ornament-galeri78 ciktisi). Rapor: Drive TEMP/ORNAMENT_TASLAK/ (DURUM.json kalici).
permissions:
  actions: read
  contents: read
on:
  workflow_dispatch:
    inputs:
      mod: { description: "oku | kur | kuru | yaz", required: true, default: "oku" }
      ciftler: { description: "TUMU ya da virgul/bosluk ayrimli CIFT", required: true, default: "CANCER_LIBRA" }
      galeri: { description: "Drive ASTROLOVE/TEMP/<galeri> (ORNAMENT_GALERI78_...)", required: false, default: "" }
env:
  O: "gdrive:ASTROLOVE/TEMP/ORNAMENT_TASLAK"
jobs:
  taslak:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - name: Girdi kapisi
        env: { M: "${{ inputs.mod }}", C: "${{ inputs.ciftler }}", G: "${{ inputs.galeri }}" }
        run: |
          [[ "$M" =~ ^(oku|kur|kuru|yaz)$ ]] || { echo "::error::mod"; exit 1; }
          [[ "$C" =~ ^[A-Z_,\ ]+$ ]] || { echo "::error::ciftler"; exit 1; }
          [[ -z "$G" || "$G" =~ ^ORNAMENT_GALERI78_[A-Za-z0-9_]+$ ]] || { echo "::error::galeri (ORNAMENT_GALERI78_...)"; exit 1; }
          if [[ "$M" =~ ^(kuru|yaz)$ && -z "$G" ]]; then echo "::error::galeri gerekli"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Kurulum
        run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || sudo apt-get install -y -qq rclone >/dev/null
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"; echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Galeri + video (kuru, yaz; KILITSIZ, CLAUDE.md KILIT SURESI)
        if: ${{ inputs.mod == 'kuru' || inputs.mod == 'yaz' }}
        env:
          C: ${{ inputs.ciftler }}
          G: ${{ inputs.galeri }}
        run: |
          set -euo pipefail
          L=$(cd scripts/etsy && python3 -c 'import os, ornament_taslak as k; print(" ".join(k.cift_listesi(os.environ["C"])))')
          echo "CIFT_LISTE=$L" >> "$GITHUB_ENV"; n=0; t0=$(date +%s); top=$(echo $L | wc -w)
          mkdir -p _img _olcum
          for c in $L; do
            rclone copy "gdrive:ASTROLOVE/TEMP/$G/$c" "_img/$c" --include "*_[01][0-9]_*.jpg" --include "*_VIDEO.mp4" --transfers 8 -q
            rclone copyto "gdrive:ASTROLOVE/TEMP/$G/$c/${c}_OLCUM.json" "_olcum/${c}_OLCUM.json" -q
            n=$((n+1)); g=$(( $(date +%s)-t0 )); echo "indir [$n/$top] $c $(ls _img/$c | wc -l) dosya | gecen $g sn | kalan ~$(( g*(top-n)/n )) sn | %$((100*n/top))"
            [ "$(ls _img/$c | wc -l)" = 12 ] || { echo "::error::$c medya $(ls _img/$c | wc -l) (12 olmali)"; exit 1; }
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); sys.exit(0 if d.get("sonuc")=="PASS" and (d.get("dosya") or {}).get("ok") is True else 1)' "_olcum/${c}_OLCUM.json" \
              || { echo "::error::$c galeri OLCUM sonuc PASS degil"; exit 1; }
          done
      - name: Etsy kilidi (sira bekle, iptal yok; token indirmeden ONCE)
        if: ${{ inputs.mod != 'kuru' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/etsy/kilit_bekle.py
          echo "KILIT_T0=$(date +%s)" >> "$GITHUB_ENV"
      - name: Token + DURUM
        env: { M: "${{ inputs.mod }}" }
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out
          echo "DAMGA=$(date -u +%Y%m%d_%H%M%S)" >> "$GITHUB_ENV"
          if [ "$M" != "kuru" ]; then rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json; fi
          if [ "$M" = "yaz" ]; then
            V=$(rclone lsf "$O" --include DURUM.json) || { echo "::error::Drive $O okunamadi (DURUM varligi bilinmiyor)"; exit 1; }
            if [ "$V" = "DURUM.json" ]; then rclone copyto "$O/DURUM.json" _out/DURUM.json || { echo "::error::DURUM.json var ama inmedi"; exit 1; }
              python3 -c 'import json; json.load(open("_out/DURUM.json"))' || { echo "::error::DURUM.json bozuk"; exit 1; }
            else echo "DURUM.json yok (ilk yaz kosusu)"; fi
          fi
      - name: Kos
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          OUT: _out
          IMG_ROOT: _img
          C: ${{ inputs.ciftler }}
          M: ${{ inputs.mod }}
        run: python3 scripts/etsy/ornament_taslak.py --mod "$M" --ciftler "$C"
      - name: Token geri yaz + DURUM + cikti Drive'a
        if: ${{ always() }}
        env: { M: "${{ inputs.mod }}" }
        run: |
          set +e
          TOKEN_RC=0; OUT_RC=0; DURUM_RC=0
          if [ -f _work/ETSY_TOKEN.json ]; then bash scripts/etsy/token_geri_yaz.sh || TOKEN_RC=1; fi
          # DURUM (yalniz listing id'ler) sir taramasindan BAGIMSIZ ve once: kosu ne olursa olsun kalici
          if [ "$M" = "yaz" ] && [ -f _out/DURUM.json ]; then
            python3 -c 'import json,re,sys; d=json.load(open("_out/DURUM.json")); t=json.dumps(d); sys.exit(0 if set(d)<={"ciftler","tamam","video"} and not re.search(r"(token|secret|Bearer)",t,re.I) else 1)' \
              && rclone copyto _out/DURUM.json "$O/DURUM.json" -q || DURUM_RC=1
          fi
          if ls _out/* >/dev/null 2>&1; then
            SIR_OK=1
            if [ -f _work/ETSY_TOKEN.json ]; then python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/ETSY_TOKEN.json _out || { echo "::error::ciktida sir"; SIR_OK=0; OUT_RC=1; }; fi
            if [ "$SIR_OK" = 1 ]; then rclone copy _out "$O/${M}_${DAMGA:?}" -q || OUT_RC=1
              echo "Cikti: TEMP/ORNAMENT_TASLAK/${M}_$DAMGA" | tee -a "$GITHUB_STEP_SUMMARY"; fi
          fi
          [ "$DURUM_RC" = 0 ] || echo "::error::DURUM.json Drive'a yazilamadi"
          [ "$TOKEN_RC" = 0 ] && [ "$OUT_RC" = 0 ] && [ "$DURUM_RC" = 0 ] || exit 1
      - if: always()
        run: rm -rf _work _out _img _olcum ~/.config/rclone

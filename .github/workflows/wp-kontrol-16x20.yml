name: wp-kontrol-16x20

# KARAR A 1. adim (Serdar 2 Eki): PISCES_SCORPIO 16x20 WP, SIPARIS YOLUYLA AYNI kurulum: main surucu.py --asama wp,
# _v1 = renk_ref b8c8c4b (siparis-baski-v1) + WP_REF adayi efdeb26'nin kilitli WP dosyalari. Plate B TEMP'ten yerel
# onbellege (_v1/_siparis/plates); PLATES'e yazma YOK. Test 4 isimleri. Cikti yalniz Drive TEMP/WP_KONTROL_16x20/<run_id>/.
# Etsy / musteri YOK. Tetik: config/wp_kontrol_16x20.trigger (bu dal).

permissions:
  contents: read

on:
  push:
    branches: [claude/wp-katman-baski-60sk0s]
    paths:
      - config/wp_kontrol_16x20.trigger

concurrency: wp-kontrol-16x20

env:
  RENK_REF: b8c8c4b17478fd956167577fa69913d06b9eb955
  WP_REF: efdeb2627113e1974ed53ae69d13dea3f965770f
  PLATE_SRC: gdrive:ASTROLOVE/TEMP/WP_PLATE_B/37046187292/16x20/VINTAGE_B_16x20.png
  CIK: gdrive:ASTROLOVE/TEMP/WP_KONTROL_16x20/${{ github.run_id }}

jobs:
  wp:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.WP_REF }}
          path: _wp
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RENK_REF }}
          path: _v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python bagimliliklari
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pillow opencv-python-headless numpy fonttools img2pdf pikepdf
      - name: WP kilidi + kilitli dosyalar v1 ustune (siparis-dijital ile ayni)
        run: |
          set -euo pipefail
          (cd _wp && python scripts/medya_v1/test_wp_kilit.py)
          for f in wp_bakir.py wp_katman.py wp_ornek.py wp_kilit.py wp_kilit.json wp_tani.py test_wp_kilit.py; do
            [ -e "_v1/scripts/medya_v1/$f" ] && { echo "HATA: $f v1'de zaten var" >&2; exit 1; }
            cp "_wp/scripts/medya_v1/$f" "_v1/scripts/medya_v1/$f"
          done
          (cd _v1 && python scripts/medya_v1/test_wp_kilit.py)
          git -C _v1 rev-parse HEAD; git -C _wp rev-parse HEAD; git rev-parse HEAD
      - name: rclone kur
        run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONF_B64:-}" ]; then echo "HATA: RCLONE_CONF_B64 yok" >&2; exit 1; fi
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Plate B (TEMP -> yerel onbellek; PLATES'e yazma yok) + girdi
        run: |
          set -euo pipefail
          mkdir -p _v1/_siparis/plates
          rclone copyto "$PLATE_SRC" _v1/_siparis/plates/VINTAGE_B_16x20.png
          md5sum _v1/_siparis/plates/VINTAGE_B_16x20.png
          M=$(printf '%s' 'Perfectly Paired by Zodiac Kisses' | base64 -w0)
          printf '{"receipt":"9000000004","cift":"PISCES_SCORPIO","isim1":"JAKOB","isim2":"ZOFIA","mesaj_b64":"%s"}' "$M" > girdi.json
      - name: WP BAKIR sayfa 16x20 (surucu --asama wp, _v1)
        env:
          SIPARIS_GIRDI_JSON: ${{ github.workspace }}/girdi.json
        run: |
          set +e
          T0=$(date +%s)
          python scripts/siparis_dijital/surucu.py --asama wp --boy 16x20 --kod _v1 \
            --kod-ref "claude/wp-katman-baski-60sk0s $WP_REF + siparis-baski-v1 $RENK_REF" --cikti out/wp/16x20; rc=$?
          echo "SURE wp $(( $(date +%s) - T0 )) sn rc=$rc"
          python - <<'PY'
          import json
          o = json.load(open('out/wp/16x20/OZET_WP_16x20.json'))
          print('KONTROL', json.dumps({'durum': o.get('durum'), 'kapilar_gecti': o.get('kapilar_gecti'),
                                       'kapilar': o.get('kapilar'), 'kapi_sayilari': o.get('kapi_sayilari'),
                                       'duz_renk': (o.get('wp_bakir') or {}).get('duz_renk')}, default=str))
          PY
          exit $rc
      - name: Drive (TEMP)
        if: ${{ always() }}
        run: '[ -d out/wp/16x20 ] && rclone copy out/wp/16x20 "$CIK/" --exclude "ara/**" && echo "drive: TEMP/WP_KONTROL_16x20/${{ github.run_id }}/"'
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone

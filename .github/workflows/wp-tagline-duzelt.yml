name: wp-tagline-duzelt

# WP TAGLINE CIFT BASKI DUZELTMESI (Serdar 9 Eki). Etsy / main / onayli ref / mevcut Drive dosyasi YAZILMAZ.
# Kod (salt okur checkout): main 400e76f (onayli siparis surucusu), renk_ref b8c8c4b, WP eski 58bed04 / yeni 360cbef.
# eski  : onayli WP (58bed04) uretimi: Test 5 tekrari (SCORPIO_VIRGO 11x14) + CANCER_LIBRA 24x36 ELENA / SERDAR (2 tagline).
# yeni  : duzeltilmis WP (360cbef) ayni vakalar; eski cikti ve Test 5 teslim sayfasi yeni kapidan; eski | yeni tam cozunurluk.
# renk  : 4 renk (CI, MB, DB, PW) siparis yolu renk asamasi; eski = renk_ref yalniz (siparisteki gibi), yeni = renk_ref +
#         yeni WP dosyalari; goruntu md5 karsilastirmasi.
# Cikti yalniz Drive TEMP/WP_TAGLINE_20261009/<run_id>/. Tetik: config/wp_tagline_duzelt.trigger (bu dal).

permissions:
  contents: read

on:
  push:
    branches: [wp-tagline-duzelt]
    paths:
      - config/wp_tagline_duzelt.trigger

concurrency: wp-tagline-duzelt

env:
  MAIN_REF: 400e76f78114999cde6ab74a3b65d96711ebf54b
  RENK_REF: b8c8c4b17478fd956167577fa69913d06b9eb955
  WP_ESKI: 58bed04f7817169a70eec18c920106f879643024
  WP_YENI: 360cbef947994c7d4b3c9ae95275f778a18af716
  CIK: gdrive:ASTROLOVE/TEMP/WP_TAGLINE_20261009/${{ github.run_id }}

jobs:
  eski:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {vaka: T5, cift: SCORPIO_VIRGO, boy: 11x14, i1: MAXWELL, i2: QUINN, mesaj: 'Written in the Stars, Always Yours'}
          - {vaka: CL_YILDIZ, cift: CANCER_LIBRA, boy: 24x36, i1: ELENA, i2: SERDAR, mesaj: 'Written in the Stars'}
          - {vaka: CL_VE, cift: CANCER_LIBRA, boy: 24x36, i1: ELENA, i2: SERDAR, mesaj: 'You & Me, Always & Forever'}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MAIN_REF }}
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: wp-tagline-duzelt
          path: _arac
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.WP_ESKI }}
          path: _wp
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RENK_REF }}
          path: _v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python bagimliliklari
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pillow opencv-python-headless numpy fonttools img2pdf pikepdf
      - name: WP kilidi + kilitli dosyalar v1 ustune (siparis-dijital ile ayni)
        run: |
          set -euo pipefail
          (cd _wp && python scripts/medya_v1/test_wp_kilit.py)
          for f in wp_bakir.py wp_katman.py wp_ornek.py wp_kilit.py wp_kilit.json wp_tani.py test_wp_kilit.py; do
            [ -e "_v1/scripts/medya_v1/$f" ] && { echo "HATA: $f v1'de zaten var" >&2; exit 1; }
            cp "_wp/scripts/medya_v1/$f" "_v1/scripts/medya_v1/$f"
          done
          (cd _v1 && python scripts/medya_v1/test_wp_kilit.py)
          echo "KOD main $(git rev-parse HEAD) wp $(git -C _wp rev-parse HEAD) renk $(git -C _v1 rev-parse HEAD)"
      - name: Takas (24x36 bellek)
        if: ${{ matrix.boy == '24x36' }}
        run: |
          sudo fallocate -l 32G /mnt/takas8 && sudo chmod 600 /mnt/takas8 && sudo mkswap /mnt/takas8 >/dev/null && sudo swapon /mnt/takas8
          free -g
      - name: rclone kur
        run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONF_B64:-}" ]; then echo "HATA: RCLONE_CONF_B64 yok" >&2; exit 1; fi
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Onayli WP uretimi (58bed04)
        run: |
          python _arac/scripts/medya_v1/wp_dogrula.py calis --surucu scripts/siparis_dijital/surucu.py --kod _v1 \
            --hucreler "${{ matrix.cift }}:${{ matrix.boy }}" --isim1 "${{ matrix.i1 }}" --isim2 "${{ matrix.i2 }}" \
            --mesaj "${{ matrix.mesaj }}" --onizleme --etiket "eski_${{ matrix.vaka }}" --cikti out
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: eski_${{ matrix.vaka }}
          path: |
            out/ONIZLEME_*.jpg
            out/DOGRULA_*.json
          retention-days: 3
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone

  yeni:
    needs: eski
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {vaka: T5, cift: SCORPIO_VIRGO, boy: 11x14, i1: MAXWELL, i2: QUINN, mesaj: 'Written in the Stars, Always Yours'}
          - {vaka: CL_YILDIZ, cift: CANCER_LIBRA, boy: 24x36, i1: ELENA, i2: SERDAR, mesaj: 'Written in the Stars'}
          - {vaka: CL_VE, cift: CANCER_LIBRA, boy: 24x36, i1: ELENA, i2: SERDAR, mesaj: 'You & Me, Always & Forever'}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MAIN_REF }}
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: wp-tagline-duzelt
          path: _arac
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.WP_YENI }}
          path: _wp
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RENK_REF }}
          path: _v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python bagimliliklari
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pillow opencv-python-headless numpy fonttools img2pdf pikepdf
      - name: WP kilidi + kilitli dosyalar v1 ustune (siparis-dijital ile ayni)
        run: |
          set -euo pipefail
          (cd _wp && python scripts/medya_v1/test_wp_kilit.py)
          for f in wp_bakir.py wp_katman.py wp_ornek.py wp_kilit.py wp_kilit.json wp_tani.py test_wp_kilit.py; do
            [ -e "_v1/scripts/medya_v1/$f" ] && { echo "HATA: $f v1'de zaten var" >&2; exit 1; }
            cp "_wp/scripts/medya_v1/$f" "_v1/scripts/medya_v1/$f"
          done
          (cd _v1 && python scripts/medya_v1/test_wp_kilit.py)
          echo "KOD main $(git rev-parse HEAD) wp $(git -C _wp rev-parse HEAD) renk $(git -C _v1 rev-parse HEAD)"
      - name: Takas (24x36 bellek)
        if: ${{ matrix.boy == '24x36' }}
        run: |
          sudo fallocate -l 32G /mnt/takas8 && sudo chmod 600 /mnt/takas8 && sudo mkswap /mnt/takas8 >/dev/null && sudo swapon /mnt/takas8
          free -g
      - name: rclone kur
        run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONF_B64:-}" ]; then echo "HATA: RCLONE_CONF_B64 yok" >&2; exit 1; fi
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - uses: actions/download-artifact@v4
        with:
          name: eski_${{ matrix.vaka }}
          path: _eski
      - name: Teslim edilmis Test 5 sayfasi (salt okur; yalniz T5)
        if: ${{ matrix.vaka == 'T5' }}
        run: |
          set -euo pipefail
          mkdir -p _t
          rclone backend copyid gdrive: 1mS2COdqaXUQKHfEHHa5wWj-SvLu2NX2B _t/t5.pdf
          python _arac/scripts/medya_v1/wp_dogrula.py pdf --pdf _t/t5.pdf --etiket T5 --cikti _t
      - name: Duzeltilmis WP uretimi (360cbef) + eski ciktilar yeni kapidan
        run: |
          set -euo pipefail
          E=$(ls _eski/ONIZLEME_*.jpg | head -1)
          T=("ESKI|${{ matrix.boy }}|$E|")
          [ -f _t/T5_11x14.jpg ] && T+=("TESLIM_T5|11x14|_t/T5_11x14.jpg|")
          python _arac/scripts/medya_v1/wp_dogrula.py calis --surucu scripts/siparis_dijital/surucu.py --kod _v1 \
            --hucreler "${{ matrix.cift }}:${{ matrix.boy }}" --isim1 "${{ matrix.i1 }}" --isim2 "${{ matrix.i2 }}" \
            --mesaj "${{ matrix.mesaj }}" --onizleme --teslim "${T[@]}" --etiket "yeni_${{ matrix.vaka }}" --cikti out
      - name: Eski | yeni tam cozunurluk + 1:1 kesit
        run: |
          set -euo pipefail
          E=$(ls _eski/ONIZLEME_*.jpg | head -1); Y=$(ls out/ONIZLEME_*.jpg | head -1)
          K=$(python -c "import json,glob; h=json.load(open(glob.glob('out/DOGRULA_*.json')[0]))['hucreler'][0]; t=(h.get('teslim') or {}).get('ESKI') or {}; print(json.dumps(t['kutu']) if t.get('var') else '')")
          python _arac/scripts/medya_v1/wp_tagline_kanit.py yanyana --eski "$E" --yeni "$Y" --ad "${{ matrix.vaka }}_${{ matrix.cift }}_${{ matrix.boy }}" --kutu "$K" --cik out
          cp "$E" "out/ESKI_${{ matrix.vaka }}_${{ matrix.cift }}_${{ matrix.boy }}.jpg"
          mv "$Y" "out/YENI_${{ matrix.vaka }}_${{ matrix.cift }}_${{ matrix.boy }}.jpg"
      - name: Drive (TEMP)
        if: ${{ always() }}
        run: '[ -d out ] && rclone copy out "$CIK/${{ matrix.vaka }}/" --exclude "ara/**" && echo "drive: TEMP/WP_TAGLINE_20261009/${{ github.run_id }}/${{ matrix.vaka }}/"'
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: yeni_${{ matrix.vaka }}
          path: out/*.json
          retention-days: 3
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone

  renk:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        renk: [CHAMPAGNE_IVORY, MIDNIGHT_BLUE, DEEP_BLACK, PURE_WHITE]
        kod: [eski, yeni]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MAIN_REF }}
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: wp-tagline-duzelt
          path: _arac
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RENK_REF }}
          path: _kod
      - uses: actions/checkout@v4
        if: ${{ matrix.kod == 'yeni' }}
        with:
          ref: ${{ env.WP_YENI }}
          path: _wp
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python bagimliliklari
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pillow opencv-python-headless numpy fonttools img2pdf pikepdf
      - name: yeni = renk_ref + yeni WP dosyalari (en kotu durum; sipariste renk isinde WP dosyasi yok)
        if: ${{ matrix.kod == 'yeni' }}
        run: |
          set -euo pipefail
          for f in wp_bakir.py wp_katman.py wp_ornek.py wp_kilit.py wp_kilit.json wp_tani.py test_wp_kilit.py; do
            cp "_wp/scripts/medya_v1/$f" "_kod/scripts/medya_v1/$f"
          done
      - name: rclone kur
        run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONF_B64:-}" ]; then echo "HATA: RCLONE_CONF_B64 yok" >&2; exit 1; fi
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Dijital uret (siparis yolu renk asamasi)
        env:
          SIPARIS_GIRDI_JSON: ${{ github.workspace }}/girdi.json
        run: |
          set -euo pipefail
          M=$(printf '%s' 'You & Me, Always & Forever' | base64 -w0)
          printf '{"receipt":"9000000009","cift":"CANCER_LIBRA","isim1":"ELENA","isim2":"SERDAR","mesaj_b64":"%s"}' "$M" > girdi.json
          T0=$(date +%s)
          python scripts/siparis_dijital/surucu.py --asama renk --renk "${{ matrix.renk }}" --kod _kod \
            --kod-ref "siparis-baski-v1 $RENK_REF" --cikti "out/${{ matrix.kod }}_${{ matrix.renk }}" || echo "RENK rc=$?"
          echo "SURE renk $(( $(date +%s) - T0 )) sn"
          python -I _arac/scripts/medya_v1/wp_tagline_kanit.py renk_md5 --kok "out/${{ matrix.kod }}_${{ matrix.renk }}" \
            --cik "out/${{ matrix.kod }}_${{ matrix.renk }}/MD5_${{ matrix.kod }}_${{ matrix.renk }}.json"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: renk_${{ matrix.kod }}_${{ matrix.renk }}
          path: out/*/MD5_*.json
          retention-days: 3
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone

  toplam:
    needs: [yeni, renk]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow numpy pikepdf
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Renk piksel karsilastirmasi (eski / yeni)
        run: |
          mkdir -p ozet; for d in art/renk_*; do cp -r "$d"/* art/ 2>/dev/null || true; done; ls art
          python -I scripts/medya_v1/wp_tagline_kanit.py renk_karsilastir --kok art --renkler CHAMPAGNE_IVORY,MIDNIGHT_BLUE,DEEP_BLACK,PURE_WHITE --cik ozet/RENK_TABLO.md
      - name: WP kapi ozeti
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json, glob
          for p in sorted(glob.glob('art/yeni_*/DOGRULA_*.json')):
              for h in json.load(open(p))['hucreler']:
                  t = {a: {k: v.get(k) for k in ('var', 'gecti', 'en_buyuk', 'esik_alan', 'bilesen', 'kutu')} for a, v in (h.get('teslim') or {}).items()}
                  print('WP', h['cift'], h['boy'], 'yeni_kapilar_gecti', h['kapilar_gecti'], 'yeni_ikinci_metin', json.dumps(h.get('ikinci_metin')),
                        'eski_ve_teslim', json.dumps(t), 'hizalama_yedek', len(h.get('hizalama_yedek') or []), 'sure', h['sure_sn'])
          PY
      - name: rclone kur
        if: ${{ always() }}
        run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: Drive (TEMP)
        if: ${{ always() }}
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && export RCLONE_CONFIG_GDRIVE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET"
          fi
          [ -d ozet ] && rclone copy ozet "$CIK/"
          rm -rf ~/.config/rclone

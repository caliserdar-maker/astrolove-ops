name: ornament-78-uretim
# Serdar 4 Kas (PLAN_78_URETIM.md 9f88868 onaylari): ornament matrix uretimi. Bolum docs/ornament/URETIM78_CIFTLER.json "aktif" alanindan
# ("ornek": 2 parca x 4 denenmemis cift; "78": 75 cift, 6 parca). Her parcada CANCER_LIBRA ilk ve YALNIZ kontrol (onayli 6daab364'e <= 1 seviye / 10 px).
# Tetik: YALNIZ docs/ornament/URETIM78_TETIK.txt (dal ornament-printful-katalog). Eski ornament-78-ornek.yml ve ORNEK78_TETIK.txt ayri, degismedi.
# Isler: hazirlik (parcalar, siparis kontrolu, tek Drive klasoru + alt klasorler, kapi testi, kenar onarimi on olcumu, onayli printful bilgi) ->
#   parca (matrix; cift sonu kancasi: Drive'a tek yukleme, ETA, temizlik) -> birlestir (tekillestirme, Drive sha kiyasi, beklenti, dal tek yazici).
# Depo public: kaynak tasarim, kirpim, 954 / gercek boy / onizleme PNG'leri dala ve artifact'a GIRMEZ (yalniz Drive). Etsy / Printful / silme yok.
on:
  push:
    branches: [ornament-printful-katalog]
    paths: [docs/ornament/URETIM78_TETIK.txt]
permissions: {}
concurrency:
  group: ornament-78-uretim
  cancel-in-progress: false
env:
  DAL: ornament-printful-katalog
  MOTOR_COMMIT: 6da763aa5b9820027420f73264fc69d30e120a33
  TEK_DOKU_COMMIT: 2a08a78216ca19dd632e7dedda31c4c53c365c25
  ACIK_COMMIT: 28774956a2561c9776dca0d1484c8a17b81f6aac
  ONAY_COMMIT: 6daab364816e4c4b8602258b9b8d8bec28231cfc
  O5: docs/ornament/ornek/ORNAMENT_5STIL_20261103_1539
  ANA_KLASOR: 1ZQGR0fI0HQNq1D2Lbmr2qlkNVbD8jRyD
  BURC_KLASOR: 1j9TBPj86_5njsmf_t0v6tczuwcDyLuXu
  ONAYLI_KOVA_GV_KLASOR: 1o6XqbGpJacW3yQ6Kc2mFpC-okVgBwsOZ
jobs:
  hazirlik:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    outputs:
      parcalar: ${{ steps.parca.outputs.parcalar }}
      max_parallel: ${{ steps.parca.outputs.max_parallel }}
      parca_sayisi: ${{ steps.parca.outputs.parca_sayisi }}
      aktif: ${{ steps.parca.outputs.aktif }}
      D: ${{ steps.klasor.outputs.D }}
      kok_id: ${{ steps.klasor.outputs.kok_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ornament-printful-katalog
          fetch-depth: 1
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/printful/
            docs/ornament/URETIM78_CIFTLER.json
            docs/ornament/zemin3/V2/
          path: s
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Parcalar (URETIM78_CIFTLER.json aktif bolum)
        id: parca
        run: |
          set -euo pipefail
          mkdir -p /tmp/hz
          python3 -I s/scripts/printful/uretim78.py parcalar --json s/docs/ornament/URETIM78_CIFTLER.json --cikti /tmp/hz/PARCALAR.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          P = json.load(open('/tmp/hz/PARCALAR.json'))
          inc = [dict(parca=p['parca'], ciftler=','.join(p['ciftler']), kenar=','.join(p['kenar_zorunlu']), gercek_boy=','.join(p['gercek_boy'])) for p in P['parcalar']]
          print('parcalar=' + json.dumps(inc, separators=(',', ':')))
          print(f"max_parallel={P['max_parallel']}"); print(f"parca_sayisi={P['parca_sayisi']}"); print(f"aktif={P['aktif']}")
          PY
      - name: Siparis kosusu kontrolu (main siparis|order akislari; etkin varsa DUR)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -I s/scripts/printful/uretim78.py siparis --depo "$GITHUB_REPOSITORY" --cikti /tmp/hz/SIPARIS_HAZIRLIK.json --dur
      - name: Gereken commit'ler ve paketler
        run: |
          set -euo pipefail
          for c in $MOTOR_COMMIT $TEK_DOKU_COMMIT $ACIK_COMMIT $ONAY_COMMIT; do git -C s fetch -q --depth 1 --filter=blob:none origin $c; done
          pip install -q pillow==11.0.0 numpy==2.5.4 opencv-python-headless==5.0.0.93 scipy==1.18.1 scikit-image==0.26.0 potracer==0.0.4
          python3 -c "import sys, numpy, cv2, PIL; print('python', sys.version.split()[0], 'numpy', numpy.__version__, 'cv2', cv2.__version__, 'pillow', PIL.__version__)" | tee /tmp/hz/paket.txt
          { nproc; free -m; df -h /tmp; } | tee -a /tmp/hz/paket.txt
      - name: rclone kur + yapilandir
        timeout-minutes: 5
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || sudo apt-get install -y -qq rclone >/dev/null
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Tek Drive klasoru + alt klasorler (bir kez; ayni ad kontrolu)
        id: klasor
        run: |
          set -euo pipefail
          A=$(python3 -c "import json; print(json.load(open('/tmp/hz/PARCALAR.json'))['aktif'])")
          [ "$A" = "78" ] && B=URETIM || B=ORNEK
          D=ORNAMENT_78${B}_$(date -u +%Y%m%d_%H%M)_${GITHUB_RUN_ID}; echo "D=$D" >> "$GITHUB_OUTPUT"
          rclone mkdir "gdrive:ASTROLOVE/TEMP/$D"
          rclone lsjson gdrive:ASTROLOVE/TEMP --dirs-only > /tmp/temp_dirs.json     # dala / artifact'a girmez (Drive ad + ID listesi)
          KOK=$(python3 -c "import json; m=[d['ID'] for d in json.load(open('/tmp/temp_dirs.json')) if d['Name']=='$D']; assert len(m)==1, ('ayni adli klasor', len(m)); print(m[0])")
          echo "kok_id=$KOK" >> "$GITHUB_OUTPUT"
          N=$(python3 -c "import json; print(json.load(open('/tmp/hz/PARCALAR.json'))['parca_sayisi'])")
          for a in FAIL GERCEK_BOY ONIZLEME YAKIN RAPOR; do rclone mkdir "gdrive:$a" --drive-root-folder-id "$KOK"; done
          for n in $(seq 1 $N); do rclone mkdir "gdrive:RAPOR/PARCA_$n" --drive-root-folder-id "$KOK"; done
          rclone lsjson "gdrive:" --drive-root-folder-id "$KOK" -R --dirs-only > /tmp/kok_dirs.json
          python3 -I s/scripts/printful/uretim78.py klasor --lsjson /tmp/kok_dirs.json | tee /tmp/hz/klasor_tekligi.txt
          rclone about "gdrive:" --json > /tmp/drive_about.json 2>/dev/null || echo '{}' > /tmp/drive_about.json   # kota: dala / loga yazilmaz
          python3 -c "import json; f=json.load(open('/tmp/drive_about.json')).get('free'); print('drive bos alan >= 2 GB:', None if f is None else f >= 2*1024**3)" | tee /tmp/hz/drive_bos_alan.txt
          echo "::notice::Drive TEMP/$D kok $KOK"
      - name: Girdiler (kapi testi, kenar on olcumu, onayli printful bilgi)
        run: |
          set -euo pipefail
          K=/tmp/kay; mkdir -p $K /tmp/onayli_cl /tmp/onayli_kg
          C=$(python3 -c "import json; P=json.load(open('/tmp/hz/PARCALAR.json')); print(','.join(sorted({c for p in P['parcalar'] for c in p['uretim']})))")
          echo "$C" > /tmp/hz/kenar_ciftler.txt
          { for c in ${C//,/ } CANCER_LIBRA AQUARIUS_PISCES; do echo "/${c}_ana.png"; done; } | sort -u > /tmp/inc_ana.txt
          rclone copy "gdrive:" "$K/" --drive-root-folder-id "$ANA_KLASOR" --include-from /tmp/inc_ana.txt --max-depth 1 -q
          rclone copy "gdrive:" "$K/" --drive-root-folder-id "$BURC_KLASOR" --include "/*_symbol_gold.png" --max-depth 1 -q
          { rclone md5sum "gdrive:" --drive-root-folder-id "$ANA_KLASOR" --include "*_ana.png" --max-depth 1;
            rclone md5sum "gdrive:" --drive-root-folder-id "$BURC_KLASOR" --include "*_symbol_gold.png" --max-depth 1; } > /tmp/drive_md5.txt
          (cd $K && md5sum *_ana.png *_symbol_gold.png) > /tmp/yerel_md5.txt
          python3 - <<'PY'
          d = {l.split()[1]: l.split()[0] for l in open('/tmp/drive_md5.txt') if l.strip()}
          y = {l.split()[1]: l.split()[0] for l in open('/tmp/yerel_md5.txt') if l.strip()}
          n_ana = sum(1 for l in open('/tmp/inc_ana.txt') if l.strip())
          bad = [f for f in y if d.get(f) != y[f]]
          print('drive md5', len(y), 'dosya, uyusmayan', bad, '| beklenen', n_ana + 12)
          assert not bad and len(y) == n_ana + 12, 'DUR: Drive md5 uyusmuyor ya da dosya eksik'
          PY
          cp /tmp/yerel_md5.txt /tmp/hz/girdi_md5.txt
          for r in RUBY SAPPHIRE EMERALD SADE_ALTIN FILDISI; do git -C s show $ONAY_COMMIT:$O5/CANCER_LIBRA_${r}_954.png > /tmp/onayli_cl/CANCER_LIBRA_${r}_954.png; done
          rclone copy "gdrive:" /tmp/onayli_kg/ --drive-root-folder-id "$ONAYLI_KOVA_GV_KLASOR" --include "/AQUARIUS_PISCES_*_954.png" --include "/GEMINI_VIRGO_*_954.png" --max-depth 1 -q
      - name: Kaynak leke kapisi testi (bir kez; FAIL ise uretim yok)
        run: |
          set -euo pipefail
          cd s
          python3 -I scripts/printful/kova_kapi_testi.py --pass /tmp/kay/cancer_symbol_gold.png /tmp/kay/libra_symbol_gold.png \
            --pass_ana /tmp/kay/CANCER_LIBRA_ana.png --kaynak /tmp/kay/aquarius_symbol_gold.png /tmp/kay/pisces_symbol_gold.png \
            --ana /tmp/kay/AQUARIUS_PISCES_ana.png --kenar_zorunlu aquarius --cikti /tmp/hz 2>&1 | tee /tmp/hz/log_kapi_testi.txt
      - name: Kenar onarimi on olcumu (motor yolu) ve onayli printful bilgi
        run: |
          set -euo pipefail
          cd s
          python3 -I scripts/printful/uretim78.py kenar_on --kaynak /tmp/kay --ciftler "$(cat /tmp/hz/kenar_ciftler.txt)" --cikti /tmp/hz/KENAR_ON_OLCUM.json 2>&1 | tee /tmp/hz/log_kenar_on.txt
          python3 -I scripts/printful/uretim78.py onayli --klasor /tmp/onayli_cl /tmp/onayli_kg --cikti /tmp/hz/ONAYLI_PRINTFUL_BILGI.json 2>&1 | tee /tmp/hz/log_onayli.txt
          df -h /tmp | tee -a /tmp/hz/paket.txt
      - name: Hazirlik raporu Drive RAPOR/ (tek kopya)
        if: always() && steps.klasor.outcome == 'success'
        run: |
          set -euo pipefail
          for i in 1 2 3; do rclone copy /tmp/hz "gdrive:RAPOR" --drive-root-folder-id "${{ steps.klasor.outputs.kok_id }}" --include "*.json" --include "*.txt" --max-depth 1 -q && break; sleep $((5*i)); done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hazirlik
          path: |
            /tmp/hz/*.json
            /tmp/hz/*.txt
          if-no-files-found: warn
      - if: always()
        run: rm -rf ~/.config/rclone

  parca:
    needs: hazirlik
    if: needs.hazirlik.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    permissions:
      actions: read
      contents: read
    concurrency:
      group: ornament-78-uretim-${{ github.run_id }}-parca-${{ matrix.parca }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.hazirlik.outputs.max_parallel) }}
      matrix:
        include: ${{ fromJSON(needs.hazirlik.outputs.parcalar) }}
    env:
      ORNEK78_CIFTLER: ${{ matrix.ciftler }}
      ORNEK78_PARCA: ${{ matrix.parca }}
      ORNEK78_KENAR_ZORUNLU: ${{ matrix.kenar }}
      GERCEK_BOY_CIFTLER: ${{ matrix.gercek_boy }}
      ORNEK78_DRIVE_KOK_ID: ${{ needs.hazirlik.outputs.kok_id }}
      ORNEK78_DRIVE_EK: /tmp/drive_ek
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ornament-printful-katalog
          fetch-depth: 1
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/printful/
            docs/ornament/zemin3/V2/
          path: s
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Siparis kontrolu (parca basi; karar 7, varsa devam + rapor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p /tmp/rapor
          python3 -I s/scripts/printful/uretim78.py siparis --depo "$GITHUB_REPOSITORY" --cikti /tmp/rapor/SIPARIS.json || echo "::warning::siparis kontrolu okunamadi"
          python3 -c "import json; e=json.load(open('/tmp/rapor/SIPARIS.json'))['etkin']; print('::warning::etkin siparis kosusu (devam):', e) if e else print('siparis yok')" || true
      - name: Commit'ler, paketler, rclone
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          for c in $MOTOR_COMMIT $TEK_DOKU_COMMIT $ACIK_COMMIT $ONAY_COMMIT; do git -C s fetch -q --depth 1 --filter=blob:none origin $c; done
          pip install -q pillow==11.0.0 numpy==2.5.4 opencv-python-headless==5.0.0.93 scipy==1.18.1 scikit-image==0.26.0 potracer==0.0.4
          { nproc; free -m; df -h /tmp; } | tee /tmp/rapor/paket.txt
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || sudo apt-get install -y -qq rclone >/dev/null
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Girdiler (parcanin ciftleri + CL; md5 ve sha kapisi)
        run: |
          set -euo pipefail
          K=/tmp/kay; MD=/tmp/mg; ZE=/tmp/zemin; mkdir -p $K $MD/kure $MD/palet $MD/girdi78/ana $ZE /tmp/onayli
          { for c in ${ORNEK78_CIFTLER//,/ }; do echo "/${c}_ana.png"; done; } | sort -u > /tmp/inc_ana.txt
          rclone copy "gdrive:" "$K/" --drive-root-folder-id "$ANA_KLASOR" --include-from /tmp/inc_ana.txt --max-depth 1 -q
          rclone copy "gdrive:" "$K/" --drive-root-folder-id "$BURC_KLASOR" --include "/*_symbol_gold.png" --max-depth 1 -q
          { rclone md5sum "gdrive:" --drive-root-folder-id "$ANA_KLASOR" --include "*_ana.png" --max-depth 1;
            rclone md5sum "gdrive:" --drive-root-folder-id "$BURC_KLASOR" --include "*_symbol_gold.png" --max-depth 1; } > /tmp/drive_md5.txt
          (cd $K && md5sum *_ana.png *_symbol_gold.png) > /tmp/yerel_md5.txt
          python3 - <<'PY'
          d = {l.split()[1]: l.split()[0] for l in open('/tmp/drive_md5.txt') if l.strip()}
          y = {l.split()[1]: l.split()[0] for l in open('/tmp/yerel_md5.txt') if l.strip()}
          n_ana = sum(1 for l in open('/tmp/inc_ana.txt') if l.strip())
          bad = [f for f in y if d.get(f) != y[f]]
          print('drive md5', len(y), 'dosya, uyusmayan', bad, '| beklenen', n_ana + 12)
          assert not bad and len(y) == n_ana + 12, 'DUR: Drive md5 uyusmuyor ya da dosya eksik'
          PY
          for f in motor/varlik/halka/HALKA_BLUE_16x20.png motor/font/Cinzel.ttf motor/font/EBGaramond-Italic.ttf motor/tek_doku.py; do
            git -C s show "$TEK_DOKU_COMMIT:$f" > "$K/$(basename $f)"; done
          for f in BEIGE_1264.png AGED_PAPYRUS_1264.png; do git -C s show $ACIK_COMMIT:zemin_acik/$f > $K/$f; done
          cp s/docs/ornament/zemin3/V2/RUBY_1264.png s/docs/ornament/zemin3/V2/SAPPHIRE_1264.png s/docs/ornament/zemin3/V2/EMERALD_1264.png $K/
          git -C s show $MOTOR_COMMIT:motor_gpt/girdi/LOGO_1.png > $K/LOGO_1.png
          git -C s show $MOTOR_COMMIT:motor_gpt/girdi78/ana/cancer_libra_alfa.png > $K/cancer_libra_alfa.png
          git -C s show $MOTOR_COMMIT:motor_gpt/alfa_ogeler.npz > $K/alfa_ogeler.npz
          for f in KILIT_GPTGIRDI.json golge_motor.py vektor_yuzey.py alfa_temizle.py uret_tam.py renk_uyum.py olustur_alfa_sablon.py kure/k4.npy palet/chatgpt_altin.png yerlesim78.json cember.json; do
            git -C s show $MOTOR_COMMIT:motor_gpt/$f > $MD/$f; done
          for c in ${ORNEK78_CIFTLER//,/ }; do lc=$(echo "$c" | tr 'A-Z' 'a-z'); git -C s show $MOTOR_COMMIT:motor_gpt/girdi78/ana/${lc}_alfa.png > $MD/girdi78/ana/${lc}_alfa.png; done
          for r in RUBY SAPPHIRE EMERALD; do git -C s show $ONAY_COMMIT:docs/ornament/ornek/ORNAMENT_KOYU_G1/ON_OLCUM_ELIPS/${r}_ELIPS_1264.png > $ZE/${r}_1264.png; done
          for r in RUBY SAPPHIRE EMERALD SADE_ALTIN FILDISI; do git -C s show $ONAY_COMMIT:$O5/CANCER_LIBRA_${r}_954.png > /tmp/onayli/CANCER_LIBRA_${r}_954.png; done
          cat > /tmp/beklenen.txt <<'EOF'
          e86c2629629305fd90bbb66494238faef9b4ad1acb815eb7b3ed55e7f44fc2d2  /tmp/kay/CANCER_LIBRA_ana.png
          2b5a32121ce8fa92ceef1a386f5ab1742a573681c30e742223be75005816cf28  /tmp/kay/cancer_symbol_gold.png
          6fe2d0355ee56f8468eb637d3ca6445fd517983b00e51bce76cac218864f6a4b  /tmp/kay/libra_symbol_gold.png
          e80d6d3fca82e2804865c887277c06bc8e958175e254b1f2d289eaeba03c9044  /tmp/zemin/RUBY_1264.png
          0d3213f8b592392aa69a3cdcd127d893a6fd2ef3d94e5913cf94ee96f4afb941  /tmp/zemin/SAPPHIRE_1264.png
          0c232cfc155ba2cbfd34cb92c6f72ffdb0fbbc54570ac9a8e987efdfdcd7f787  /tmp/zemin/EMERALD_1264.png
          2a11ac819c611eaa84e60e469316f345eaa8eb48f6e9e6113d9a7831ab2fa410  /tmp/kay/HALKA_BLUE_16x20.png
          62239238b25dbc5417dab4dc353fdbf15129599c9372737d5d8ddb86b3042061  /tmp/kay/LOGO_1.png
          1889906fb29920e9294d5c343ace09b2295d81e4c49153d2badfb8d5101ddbad  /tmp/kay/tek_doku.py
          f4d83d34d1f6c741193e4acf4b3dff9531e5a67b6aa65228d00a7db72a4e0f34  /tmp/kay/Cinzel.ttf
          bba2c4499c93c9612b90b9825d32b07da52fce2fe57562a1eb6b833553f93c4e  /tmp/kay/EBGaramond-Italic.ttf
          EOF
          sed -i 's/^ *//' /tmp/beklenen.txt
          sha256sum -c /tmp/beklenen.txt | tee /tmp/rapor/girdi_sha.txt
          (cd $K && sha256sum *_ana.png *_symbol_gold.png) | sed 's|  |  kaynak/|' >> /tmp/rapor/girdi_sha.txt
      - name: Uretim (ornek78; cift sonu kancasi Drive'a yazar; karar birlestirmede)
        id: uretim
        run: |
          set +e
          set -uo pipefail
          mkdir -p /tmp/son_yok /tmp/png /tmp/drive_ek
          cd s
          python3 -I scripts/printful/ornek78.py --kaynak /tmp/kay --motor /tmp/mg --zemin /tmp/zemin \
            --son /tmp/son_yok --onayli /tmp/onayli \
            --cikti /tmp/png --rapor /tmp/rapor --font /tmp/kay/EBGaramond-Italic.ttf 2>&1 | tee /tmp/rapor/log_ornek78.txt
          k=${PIPESTATUS[0]}; echo "k=$k" >> "$GITHUB_OUTPUT"; echo "::notice::parca $ORNEK78_PARCA ornek78 cikis $k"
          df -h /tmp | tee -a /tmp/rapor/paket.txt
          exit 0
      - name: Gercek boy kontrolu (parca)
        if: always() && steps.uretim.outcome == 'success'
        run: |
          set +e
          cd s
          F=$(find /tmp/rapor -maxdepth 1 -name 'GERCEK_BOY_*_300dpi.png' | sort); echo "$F"
          if [ -n "$F" ]; then python3 -I scripts/printful/gercek_boy_kontrol.py $F --json /tmp/rapor/GERCEK_BOY_KONTROL.json 2>&1 | tee /tmp/rapor/log_gercek_boy.txt; fi
          exit 0
      - name: Parca raporu Drive RAPOR/PARCA_n (tek kopya, 3 deneme)
        if: always()
        run: |
          set -uo pipefail
          for i in 1 2 3; do rclone copy /tmp/rapor "gdrive:RAPOR/PARCA_${ORNEK78_PARCA}" --drive-root-folder-id "$ORNEK78_DRIVE_KOK_ID" \
            --include "*.json" --include "*.txt" --max-depth 1 -q && break; echo "::warning::rapor yukleme deneme $i"; sleep $((5*i)); done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parca-${{ matrix.parca }}
          path: |
            /tmp/rapor/*.json
            /tmp/rapor/*.txt
          if-no-files-found: warn
      - if: always()
        run: rm -rf ~/.config/rclone

  birlestir:
    needs: [hazirlik, parca]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    concurrency:
      group: ornament-78-uretim-${{ github.run_id }}-birlestir
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ornament-printful-katalog
          fetch-depth: 1
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/printful/
            docs/ornament/URETIM78_CIFTLER.json
          path: s
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/art
      - name: rclone (hazirlik basariliysa)
        if: needs.hazirlik.result == 'success'
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || sudo apt-get install -y -qq rclone >/dev/null
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Birlestir (CL tekillestirme, eksik parca, Drive sha, klasor tekligi, gercek boy, beklenti)
        id: bir
        env:
          KOK: ${{ needs.hazirlik.outputs.kok_id }}
          N: ${{ needs.hazirlik.outputs.parca_sayisi }}
          AKTIF: ${{ needs.hazirlik.outputs.aktif }}
        run: |
          set +e
          set -uo pipefail
          mkdir -p /tmp/bir /tmp/parcalar
          if [ "${{ needs.hazirlik.result }}" != "success" ]; then
            echo '{"gecti": false, "neden": "hazirlik FAIL; uretim yok"}' > /tmp/bir/BIRLESIK.json; echo "b=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          for d in /tmp/art/parca-*; do [ -d "$d" ] && n=${d##*-} && mkdir -p /tmp/parcalar/PARCA_$n && cp -r "$d"/. /tmp/parcalar/PARCA_$n/; done
          mkdir -p /tmp/bir_ozel                                                   # Drive dosya ID listeleri: dala / artifact'a girmez
          rclone lsjson "gdrive:" --drive-root-folder-id "$KOK" -R --hash > /tmp/bir_ozel/drive_lsjson.json; l1=$?
          rclone lsjson "gdrive:" --drive-root-folder-id "$KOK" -R --dirs-only > /tmp/bir_ozel/drive_dirs.json; l2=$?
          cd s
          python3 -I scripts/printful/uretim78.py klasor --lsjson /tmp/bir_ozel/drive_dirs.json 2>&1 | tee /tmp/bir/log_klasor.txt; kk=${PIPESTATUS[0]}
          python3 -I scripts/printful/uretim78.py birlestir --parca_dir /tmp/parcalar --parca_sayisi "$N" --drive_lsjson /tmp/bir_ozel/drive_lsjson.json \
            --cikti /tmp/bir/BIRLESIK.json 2>&1 | tee /tmp/bir/log_birlestir.txt; bb=${PIPESTATUS[0]}
          python3 - <<'PY' > /tmp/bir/GERCEK_BOY_TOPLU.json
          import glob, json
          R = []
          for f in sorted(glob.glob('/tmp/parcalar/PARCA_*/GERCEK_BOY_KONTROL.json')):
              R += json.load(open(f))
          print(json.dumps(dict(dosya=R, gecti=bool(R) and all(x['gecti'] for x in R)), indent=1))
          PY
          gb=$(python3 -c "import json; print(0 if json.load(open('/tmp/bir/GERCEK_BOY_TOPLU.json'))['gecti'] else 1)")
          be=0
          if [ "$AKTIF" = "ornek" ]; then
            python3 -I scripts/printful/uretim78_beklenen.py --birlesik /tmp/bir/BIRLESIK.json --kapi /tmp/art/hazirlik/KOVA_KAPI_TESTI.json \
              --kenar_on /tmp/art/hazirlik/KENAR_ON_OLCUM.json --siparis /tmp/art/hazirlik/SIPARIS_HAZIRLIK.json --parca_dir /tmp/parcalar \
              --ciftler_json docs/ornament/URETIM78_CIFTLER.json --cikti /tmp/bir/BEKLENEN_SONUC_ORNEK.json 2>&1 | tee /tmp/bir/log_beklenen.txt; be=${PIPESTATUS[0]}
          fi
          echo "lsjson $l1/$l2 klasor $kk birlestir $bb gercek_boy $gb beklenen $be" | tee /tmp/bir/SONUC.txt
          b=$(( l1 || l2 || kk || bb || gb || be ? 1 : 0 )); echo "b=$b" >> "$GITHUB_OUTPUT"
          for i in 1 2 3; do rclone copy /tmp/bir "gdrive:RAPOR" --drive-root-folder-id "$KOK" --include "*.json" --include "*.txt" --max-depth 1 -q && break; sleep $((5*i)); done
          exit 0
      - name: Dal (tek yazici; yalniz JSON / MD / log; rebase ile yeniden deneme)
        if: always()
        env:
          D: ${{ needs.hazirlik.outputs.D }}
        run: |
          set -euo pipefail
          G=docs/ornament/ornek/${D:-ORNAMENT_78_HAZIRLIK_FAIL_${GITHUB_RUN_ID}}
          mkdir -p s/$G
          cp /tmp/bir/*.json /tmp/bir/*.txt s/$G/ 2>/dev/null || true
          [ -d /tmp/art/hazirlik ] && mkdir -p s/$G/HAZIRLIK && cp /tmp/art/hazirlik/*.json /tmp/art/hazirlik/*.txt s/$G/HAZIRLIK/ 2>/dev/null || true
          for d in /tmp/parcalar/PARCA_*; do [ -d "$d" ] && mkdir -p s/$G/$(basename $d) && cp "$d"/*.json "$d"/*.txt s/$G/$(basename $d)/ 2>/dev/null || true; done
          cd s && git config user.name "astrolove-bot" && git config user.email "astrolove-bot@users.noreply.github.com"
          git add --sparse "$G"
          python3 -I scripts/printful/uretim78.py dal_kapisi $(git diff --cached --name-only)
          DIS=$(git diff --cached --name-only | grep -v "^docs/ornament/ornek/" || true)
          [ -z "$DIS" ] || { echo "::error::izinli klasor disi: $DIS"; exit 1; }
          git commit -qm "ornament 78 uretim (kosu ${GITHUB_RUN_ID}, ${{ needs.hazirlik.outputs.aktif }}): birlestir ${{ steps.bir.outputs.b }}"
          ok=0; for i in 1 2 3 4; do
            git fetch -q --depth 20 --filter=blob:none origin "$DAL" && git rebase -q "origin/$DAL" && git push -q origin "HEAD:${DAL}" && { ok=1; break; }
            git rebase --abort 2>/dev/null || true; echo "::warning::dal push deneme $i"; sleep $((4*i)); done
          [ "$ok" = 1 ] || { echo "::error::dal push basarisiz"; exit 1; }
      - if: always()
        run: rm -rf ~/.config/rclone
      - name: Sonuc
        if: always()
        run: 'echo "hazirlik ${{ needs.hazirlik.result }} parca ${{ needs.parca.result }} birlestir ${{ steps.bir.outputs.b }}"; [ "${{ needs.hazirlik.result }}" = "success" ] && [ "${{ steps.bir.outputs.b }}" = "0" ]'

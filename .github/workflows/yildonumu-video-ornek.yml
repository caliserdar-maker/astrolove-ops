name: yildonumu-video-ornek
# Yil donumu (Y1) ilan videosu ORNEGI (20 Eki 2026, Serdar): onayli V6 mantigi ve kodu (sosyal/poster_video/yildonumu_video.py,
# V6 motoru birebir), sahne = KAPAK_Y1_78_20261019/KAPAK/<CIFT>.jpg. Etsy'ye ve Metricool'a YAZMA YOK; Etsy API yok; toplu uretim yok.
# QC: sosyal/poster_video/yildonumu_qc.py (tek script, PASS/FAIL). Cikti: Drive ASTROLOVE/TEMP/YILDONUMU_VIDEO_ORNEK_20261020/
permissions:
  contents: write   # yalniz poster-video-onizleme dalina kucuk onizleme
on:
  workflow_dispatch:
    inputs:
      cift:
        description: 'cift (KAPAK_Y1_78 KAPAK/<CIFT>.jpg)'
        default: CANCER_LIBRA
jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      O: gdrive:ASTROLOVE/TEMP/YILDONUMU_VIDEO_ORNEK_20261020
      K: gdrive:ASTROLOVE/TEMP/KAPAK_Y1_78_20261019/KAPAK
      CIFT: ${{ inputs.cift }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Kurulum
      run: |
        set -euo pipefail
        pip install -q numpy==2.1.3 pillow==11.0.0 scipy==1.14.1 opencv-python-headless==4.10.0.84
        sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg fonts-dejavu-core >/dev/null
        curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
    - name: rclone.conf
      env:
        RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      run: |
        set -euo pipefail
        mkdir -p ~/.config/rclone; umask 077
        printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
        if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "::add-mask::$GOOGLE_CLIENT_SECRET"
          grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true; fi
    - name: Uret + QC + Drive
      run: |
        set +e -uo pipefail
        case "$CIFT" in *[!A-Z_]*|'') echo "::error::cift gecersiz"; exit 1 ;; esac
        mkdir -p _w _o
        rclone copyto "$K/$CIFT.jpg" _w/kapak.jpg -q || { echo "::error::kapak yok"; exit 1; }
        T0=$(date +%s)
        python3 -I sosyal/poster_video/yildonumu_qc.py _w/kapak.jpg "$CIFT" _o _w/is | tee _w/qc.txt; QC=${PIPESTATUS[0]}
        grep -E '^\{|SONUC' _w/qc.txt | sed 's/^/::warning::QC /' | cut -c1-3500
        echo "::warning::SURE $(( $(date +%s) - T0 )) sn"
        rclone copy _o "$O" -q
        echo "::warning::DRIVE $(rclone lsf "$O" | tr '\n' ' ')"
        mkdir -p _pv; cp _o/*.jpg _o/QC.json _pv/ 2>/dev/null
        echo "RC=$QC" >> "$GITHUB_ENV"
    - name: Onizleme dali
      if: ${{ always() }}
      run: |
        set +e -uo pipefail
        [ -n "$(ls -A _pv 2>/dev/null)" ] || exit 0
        B=poster-video-onizleme; PV=yildonumu_ornek
        git config user.name "github-actions"; git config user.email "actions@github.com"
        for i in 1 2 3; do
          rm -rf _pvw; git worktree prune
          git fetch -q origin $B && git worktree add -q _pvw origin/$B || break
          rm -rf "_pvw/$PV"; mkdir -p "_pvw/$PV"; cp _pv/* "_pvw/$PV/"
          (cd _pvw && git add -A && git commit -qm "yil donumu video ornegi (kosu ${{ github.run_id }})" && git push -q origin HEAD:refs/heads/$B) && { echo "::warning::ONIZLEME $B/$PV"; break; }
          sleep 5
        done
    - name: Sonuc
      if: ${{ always() }}
      run: |
        rm -rf _w ~/.config/rclone
        [ "${RC:-1}" = "0" ]

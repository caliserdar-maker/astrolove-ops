name: pin78-toplu
# Pinterest 78 cift x 4 pin (poster, kart, altin yakin cekim, video) TOPLU URETIM (Merkez "BASLA" 25 Kas 2026; Serdar KARARLAR_20261125_49/
# _50/_51/_57 + 25 Kas: video v5 onayi, altin ad karari A, kart basliginda "+" yerine sonsuz logo, ABD metin/takvim kurallari, platform
# boylari + mobil onizleme). Yayin YOK; Metricool / Pinterest / Etsy YAZMA YOK. Drive OFIS/<klasor>:
#   PINTEREST_2x3/<slug>-poster.jpg, <slug>-kart.jpg, <slug>-altin.jpg     (1000x1500)
#   VIDEO/<slug>-pin-video.mp4                                              (1080x1920, 15.0 sn; Yayin Araci ayni dosyayi kullanir)
#   GONDERI_4x5/<slug>-poster-4x5.jpg, -kart-4x5.jpg, -altin-4x5.jpg       (1080x1350; IG / FB / Threads)
#   ONIZLEME/ONIZLEME_PAFTA_<slug>.jpg, QC/<slug>/..., METIN_PIN78_20261125.csv, TAKVIM_PIN78_20261125.csv
#   Herhangi bir kapisi FAIL olan ciftin tum dosyalari FAIL/<slug>/ altina gider (yayin klasorlerine girmez).
# slug: <a>-and-<b> kucuk harf (or. cancer-and-leo); cift anahtari alfabetik (data/pod/pod78_ids.csv).
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      ciftler:
        description: 'HEPSI ya da virgulle cift anahtarlari (or. CANCER_LEO)'
        default: HEPSI
      klasor:
        description: 'OFIS altindaki cikti klasoru'
        default: PINTEREST_PIN78_20261125
env:
  OFIS: 1KBuisCudYyac5ThyLs19eZW4MQZgwp0W
  REF_DIR: 1_rcZ69bhw00QfHedBiWywEoHPu9Y4bkB
  P2000: gdrive:ASTROLOVE/TEMP/PIN_V6_20261012/_POSTER2000
  KAPAKD: gdrive:ASTROLOVE/TEMP/VIDEO_V9_20261012/KAPAK
  PVID: gdrive:ASTROLOVE/TEMP/SOSYAL_VIDEO_P_78_20261020
  KARTD: gdrive:ASTROLOVE/TEMP/POSTER_GALERI_V11_YEDEK/20261106_090016
  SURE: '15'
  SURE_R: '15.9'
  KLASOR: ${{ inputs.klasor }}
jobs:
  hazirlik:
    runs-on: ubuntu-latest
    outputs:
      parcalar: ${{ steps.p.outputs.parcalar }}
    steps:
    - uses: actions/checkout@v4
    - id: p
      env:
        CIFTLER: ${{ inputs.ciftler }}
      run: |
        set -euo pipefail
        case "$CIFTLER" in *[!A-Z_,]*|'') echo "::error::ciftler gecersiz"; exit 1 ;; esac
        case "$KLASOR" in *[!A-Za-z0-9_]*|'') echo "::error::klasor gecersiz"; exit 1 ;; esac
        python3 - <<'PY' >> "$GITHUB_OUTPUT"
        import csv, json, os
        tum = [r['cift'] for r in csv.DictReader(open('data/pod/pod78_ids.csv'))]
        assert len(tum) == 78, len(tum)
        c = os.environ['CIFTLER']
        sec = tum if c == 'HEPSI' else list(dict.fromkeys(c.split(',')))     # tekrar eden cift bir kez
        bad = [x for x in sec if x not in tum]
        assert not bad, f'bilinmeyen cift {bad}'
        p = [','.join(sec[i:i + 6]) for i in range(0, len(sec), 6)]
        print('parcalar=' + json.dumps(p))
        PY
    - name: Drive klasorleri (paralel islerden ONCE, tek kez)
      env:
        RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      run: |
        set -euo pipefail
        # emsal video-v7-birlesik.yml:44 (26 Eki): paralel isler ayni adla birden cok Drive klasoru acti. Klasorler burada acilir.
        curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
        mkdir -p ~/.config/rclone; umask 077
        printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
        if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "::add-mask::$GOOGLE_CLIENT_SECRET"
          grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && export RCLONE_CONFIG_GDRIVE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET" || true; fi
        N=$(rclone lsf gdrive: --drive-root-folder-id "$OFIS" --dirs-only | grep -cx "$KLASOR/" || true)
        [ "$N" -le 1 ] || { echo "::error::OFIS altinda $N adet $KLASOR"; exit 1; }
        for d in PINTEREST_2x3 VIDEO GONDERI_4x5 ONIZLEME QC FAIL; do rclone mkdir "gdrive:$KLASOR/$d" --drive-root-folder-id "$OFIS"; done
        rclone lsf "gdrive:$KLASOR" --drive-root-folder-id "$OFIS" --dirs-only
        rm -rf ~/.config/rclone
  uret:
    needs: hazirlik
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        parca: ${{ fromJSON(needs.hazirlik.outputs.parcalar) }}
    env:
      PARCA: ${{ matrix.parca }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Kurulum
      run: |
        set -euo pipefail
        pip install -q numpy==2.1.3 pillow==11.0.0 scipy==1.14.1 opencv-python-headless==4.10.0.84 requests
        sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg fonts-dejavu-core fonts-texgyre >/dev/null
        PG=/usr/share/texmf/fonts/opentype/public/tex-gyre/texgyrepagella-regular.otf
        test -s $PG
        echo "$(md5sum $PG | cut -c1-32) Pagella (yerel olcum ee927992843e53183a6e7c09838e9f82)"
        [ "$(md5sum $PG | cut -c1-32)" = ee927992843e53183a6e7c09838e9f82 ] || { echo "::error::Pagella yerel olcumden farkli (baslik olcumleri bu dosyaya bagli)"; exit 1; }
        curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
        curl -fsSL --retry 3 "https://raw.githubusercontent.com/google/fonts/main/ofl/ebgaramond/EBGaramond%5Bwght%5D.ttf" -o "$RUNNER_TEMP/EBGaramond[wght].ttf"
        mkdir -p "$RUNNER_TEMP/font"
        curl -fsSL --retry 3 "https://raw.githubusercontent.com/google/fonts/main/ofl/opensans/OpenSans%5Bwdth,wght%5D.ttf" -o "$RUNNER_TEMP/font/OpenSans.ttf"
        # kart etiket yazi tipi: yerel olcumle ayni dosya (Open Sans SemiBold esleme bu dosyayla yapildi)
        [ "$(md5sum "$RUNNER_TEMP/font/OpenSans.ttf" | cut -c1-32)" = 591d60b5878e7b8b62f7ea553dbdf8c2 ] || { echo "::error::OpenSans md5 farkli"; exit 1; }
    - name: rclone.conf
      env:
        RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      run: |
        set -euo pipefail
        mkdir -p ~/.config/rclone; umask 077
        printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
        if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "::add-mask::$GOOGLE_CLIENT_SECRET"
          grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true; fi
    - name: Ortak girdi
      run: |
        set -euo pipefail
        mkdir -p _s _o
        rclone backend copyid gdrive: 1-U_CIzLqT7nIkbUlrHNXcOjFwRbD_RWs _s/PIN_01_v6.jpg -q
        rclone backend copyid gdrive: 13gIzmVN51F0DUF3c5vl4p77jXsq2tSo_ _s/PIN_02_v6.jpg -q
        rclone backend copyid gdrive: 1X0LFYUuVeAyIN_fm9J3xPOx23X5FQ9vt _s/PIN_03_v6.jpg -q
        printf '%s\n' "0d1fd25bc4f0b42d6ae50cab98bb9d86  _s/PIN_01_v6.jpg" "a17f8c4bf99949d292d8f66817b55d79  _s/PIN_02_v6.jpg" \
          "aebf5a4bacf01029a5efff9ebdb80115  _s/PIN_03_v6.jpg" > _s/md5.txt
        md5sum -c _s/md5.txt || { echo "::error::onayli v6 sablon md5 farkli"; exit 1; }
        rclone lsf "$KARTD" -R --files-only --include "*/r2_*.jpg" > _s/r2.txt
        [ "$(wc -l < _s/r2.txt)" = 78 ] || { echo "::error::r2 kart sayisi 78 degil: $(wc -l < _s/r2.txt)"; exit 1; }
        # onayli v9 yolu degismedi (bir kez)
        V=sosyal/video_v9; mkdir -p _s/ref _s/dg
        rclone copyto gdrive:AstroLoveArt_Gemini_Leo_2000.jpg _s/ref/GEMINI_LEO.jpg --drive-root-folder-id "$REF_DIR" -q
        python3 $V/video_uret.py --poster _s/ref/GEMINI_LEO.jpg --a Gemini --b Leo --out _s/dg --kareler 2,5,8,13,17,22 >/dev/null
        python3 $V/dogrula.py _s/dg > _s/dogrula.txt || { tail -3 _s/dogrula.txt; echo "::error::onayli v9 dogrulamasi FAIL"; exit 1; }
        tail -1 _s/dogrula.txt
        # muzik 2 (bir kez cozulur, ilk SURE sn + son 2 sn kisilma kopyasi)
        P=$(rclone cat "gdrive:ASTROLOVE/TEMP/MUZIK_PAROLA.txt" 2>/dev/null | tr -d '\r\n')
        [ -n "$P" ] || { echo "::error::muzik parolasi okunamadi"; exit 1; }
        echo "::add-mask::$P"
        MUZIK_PAROLA="$P" openssl enc -d -aes-256-cbc -pbkdf2 -in $V/assets/muzik_2.m4a.enc -out _s/muzik.m4a -pass env:MUZIK_PAROLA \
          || { echo "::error::muzik cozulemedi"; exit 1; }
        unset P
        FO=$(python3 -c "print(float('$SURE')-2.0)")
        ffmpeg -v error -y -i _s/muzik.m4a -af "atrim=0:$SURE,afade=t=out:st=$FO:d=2,asetpts=N/SR/TB" -c:a aac -b:a 192k _s/muzik_k.m4a
    - name: Uretim + QC (cift cift)
      run: |
        set +e -uo pipefail
        V=sosyal/video_v9; Q=scripts/sosyal; F="$RUNNER_TEMP/font"; GENEL=0; T0=$(date +%s)
        N=$(echo "$PARCA" | tr ',' '\n' | wc -l); i=0
        for C in ${PARCA//,/ }; do
          i=$((i + 1)); RC=0
          [ -n "$C" ] || continue
          A=$(python3 -c "import sys; print(sys.argv[1].split('_')[0].title())" "$C"); B=$(python3 -c "import sys; print(sys.argv[1].split('_')[1].title())" "$C")
          SLUG=$(echo "$A-and-$B" | tr 'A-Z' 'a-z')
          [ -n "$A" ] && [ -n "$B" ] && [ -n "$SLUG" ] || { echo "::error::$C ad bos"; GENEL=1; continue; }
          echo "::group::$C ($i/$N, gecen $(( $(date +%s) - T0 )) sn)"
          rm -rf _w; mkdir -p _w/kb _w/kp _w/v _p/$SLUG/QC
          D=_p/$SLUG; QD=$D/QC
          rclone copyto "$P2000/$C.jpg" _w/poster.jpg -q || RC=1
          rclone copyto "$KAPAKD/$SLUG-astroloveart-kapak.jpg" _w/kapak.jpg -q || RC=1
          rclone copyto "$PVID/$SLUG-astroloveart-reel.mp4" _w/onayli_P.mp4 -q || RC=1
          LID=$(awk -F, -v c="$C" '$2==c{print $1}' data/pod/pod78_ids.csv)
          R2=$(grep "^${LID}_$C/r2_" _s/r2.txt | head -1)     # kart klasoru = ilan no + cift (pod78_ids ile eslesme)
          [ -n "$LID" ] || { echo "::error::$C ilan no yok"; RC=1; }
          [ -n "$R2" ] && rclone copyto "$KARTD/$R2" _w/kart_r2.jpg -q || RC=1
          [ -s _w/poster.jpg ] && [ -s _w/kapak.jpg ] && [ -s _w/onayli_P.mp4 ] && [ -s _w/kart_r2.jpg ] || { echo "::error::$C girdi eksik"; RC=1; }
          if [ "$RC" = 0 ]; then
            python3 $Q/pin78_poster_kart_pin.py --tur poster --kaynak _w/poster.jpg --a "$A" --b "$B" --sablon _s/PIN_01_v6.jpg --font_dir "$F" \
              --out "$D/$SLUG-poster.jpg" --qc_json $QD/qc_poster.json > $QD/qc_poster.txt || RC=$((RC + 1))
            python3 $Q/pin78_poster_kart_pin.py --tur kart --kaynak _w/kart_r2.jpg --a "$A" --b "$B" --sablon _s/PIN_02_v6.jpg --font_dir "$F" \
              --out "$D/$SLUG-kart.jpg" --qc_json $QD/qc_kart.json > $QD/qc_kart.txt || RC=$((RC + 1))
            python3 $Q/pin78_altin_pin.py --poster _w/poster.jpg --a "$A" --b "$B" --cerceve _s/PIN_03_v6.jpg --baslik "$D/$SLUG-poster.jpg" \
              --kart "$D/$SLUG-kart.jpg" --out _w/al > $QD/qc_altin.txt || RC=$((RC + 1))
            mv _w/al/PIN_ALTIN_*.jpg "$D/$SLUG-altin.jpg" && mv _w/al/QC_ALTIN_PIN.json $QD/qc_altin.json || RC=$((RC + 1))
            # video: onayli v5 yolu (B, sessiz SURE_R) -> kapak_son (muzik) -> kapak_basa
            python3 $V/acilis_p.py --poster _w/poster.jpg --a "$A" --b "$B" --font "$RUNNER_TEMP/EBGaramond[wght].ttf" --out _w/P_kare.png >/dev/null || RC=$((RC + 1))
            K=0.5,2,5,8,10.5,11.5,12.5,13.5,14.5
            python3 $V/video_uret.py --poster _w/poster.jpg --a "$A" --b "$B" --out _w/kb --kareler $K --acilis B --sure "$SURE_R" --bilgi _w/bilgi.json >/dev/null || RC=$((RC + 1))
            python3 $V/video_uret.py --poster _w/poster.jpg --a "$A" --b "$B" --out _w/kp --kareler $K --acilis P --acilis_kare _w/P_kare.png >/dev/null || RC=$((RC + 1))
            python3 $V/video_uret.py --poster _w/poster.jpg --a "$A" --b "$B" --out _w/v --acilis B --sure "$SURE_R" > _w/v.log 2>&1 || RC=$((RC + 1))
            f="_w/v/$SLUG-astroloveart-reel.mp4"
            [ -f "$f" ] || { echo "::error::$C video uretilemedi"; tail -5 _w/v.log; RC=$((RC + 1)); }
            python3 $V/kapak_son.py --video "$f" --kapak _w/kapak.jpg --cikis _w/son.mp4 --sure "$SURE" --tam 0.5 --gecis 0.5 \
              --muzik _s/muzik.m4a --qc $QD/kapak_son_qc.json > $QD/kapak_son_log.txt 2>&1 || RC=$((RC + 1))
            OUT="$D/$SLUG-pin-video.mp4"
            python3 $V/kapak_basa.py --video _w/son.mp4 --kapak _w/kapak.jpg --cikis "$OUT" --tam 0.5 --gecis 0.5 --qc $QD/kapak_basa_qc.json > $QD/kapak_basa_log.txt 2>&1 || RC=$((RC + 1))
            python3 $Q/pin78_video_qc.py --b _w/kb --p _w/kp --bilgi _w/bilgi.json --sure $SURE --video "$OUT" --kapak_qc $QD/kapak_basa_qc.json \
              --kapak _w/kapak.jpg --kapak_son_qc $QD/kapak_son_qc.json --son_kapak 1.0 --muzik _s/muzik_k.m4a --onayli_mp4 _w/onayli_P.mp4 > $QD/qc_video.txt || RC=$((RC + 1))
            # platform boylari + mobil onizleme + okunurluk kapisi
            python3 $Q/platform_boy.py --poster "$D/$SLUG-poster.jpg" --kart "$D/$SLUG-kart.jpg" --altin "$D/$SLUG-altin.jpg" --video "$OUT" \
              --out "$D/P" --slug "$SLUG" --a "$A" --b "$B" > $QD/qc_platform.txt || RC=$((RC + 1))
          fi
          cp _w/v.log $QD/video_uret_log.txt 2>/dev/null; cp _w/bilgi.json $QD/video_bilgi.json 2>/dev/null
          grep -hE "^FAIL" $QD/*.txt 2>/dev/null | head -8 | sed "s/^/::warning::$C /"
          echo "$C RC=$RC" | tee -a _o/SONUC_PARCA.txt
          # dagitim: PASS -> yayin klasorleri; FAIL -> FAIL/<slug>/
          if [ "$RC" = 0 ]; then
            mkdir -p _o/PINTEREST_2x3 _o/VIDEO _o/GONDERI_4x5 _o/ONIZLEME _o/QC/$SLUG
            mv "$D/$SLUG-poster.jpg" "$D/$SLUG-kart.jpg" "$D/$SLUG-altin.jpg" _o/PINTEREST_2x3/
            mv "$D/$SLUG-pin-video.mp4" _o/VIDEO/
            mv "$D"/P/*-4x5.jpg _o/GONDERI_4x5/; mv "$D"/P/ONIZLEME_PAFTA_*.jpg _o/ONIZLEME/; mv "$D"/P/QC_PLATFORM_*.json $QD/
            mv $QD/* _o/QC/$SLUG/
          else
            GENEL=1; mkdir -p _o/FAIL; mv "$D" "_o/FAIL/$SLUG"
          fi
          echo "::endgroup::"
          echo "ETA $i/$N cift | gecen $(( $(date +%s) - T0 )) sn | kalan ~$(( ($(date +%s) - T0) / i * (N - i) )) sn | %$(( 100 * i / N ))"
        done
        rm -f _s/muzik.m4a _s/muzik_k.m4a
        echo "GENEL=$GENEL" >> "$GITHUB_ENV"
    - name: Drive
      if: ${{ always() }}
      run: |
        set +e -uo pipefail
        rm -f _s/muzik.m4a _s/muzik_k.m4a
        [ -d _o ] || exit 1
        mv _o/SONUC_PARCA.txt "_o/QC/SONUC_${{ strategy.job-index }}.txt" 2>/dev/null || { mkdir -p _o/QC; mv _o/SONUC_PARCA.txt "_o/QC/SONUC_${{ strategy.job-index }}.txt"; }
        rclone copy _o "gdrive:$KLASOR" --drive-root-folder-id "$OFIS" -q; R=$?
        echo "::warning::DRIVE OFIS/$KLASOR yukleme rc=$R; $(cat _o/QC/SONUC_*.txt | tr '\n' ' ')"
        rm -rf _w ~/.config/rclone
        [ "$R" = 0 ] && [ "${GENEL:-1}" = 0 ]
  metin:
    needs: hazirlik
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: rclone
      env:
        RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      run: |
        set -euo pipefail
        pip install -q requests      # etsy_common (metin yasak kapisi tek kaynagi) requests ithal eder
        curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
        mkdir -p ~/.config/rclone; umask 077
        printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
        if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "::add-mask::$GOOGLE_CLIENT_SECRET"
          grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true; fi
    - name: Metin + takvim + Drive
      run: |
        set +e -uo pipefail
        mkdir -p _m/QC; Q=scripts/sosyal
        python3 $Q/pin78_metin.py --cikti /dev/null --oz-test > _m/QC/metin_oz_test.txt 2>&1; MO=$?
        python3 $Q/pin78_metin.py --cikti _m/METIN_PIN78_20261125.csv > _m/QC/metin_qc.txt 2>&1; MT=$?
        python3 $Q/pin78_takvim.py --cikti /dev/null --oz-test > _m/QC/takvim_oz_test.txt 2>&1; TO=$?
        python3 $Q/pin78_takvim.py --cikti _m/TAKVIM_PIN78_20261125.csv --simdi "$(TZ=Europe/Istanbul date '+%Y-%m-%d %H:%M')" > _m/QC/takvim_qc.txt 2>&1; TQ=$?
        tail -3 _m/QC/metin_qc.txt _m/QC/takvim_qc.txt | sed 's/^/::warning::/'
        RC=$(( MO + MT + TO + TQ ))
        [ "$RC" = 0 ] || { mkdir -p _m/FAIL_METIN; mv _m/*.csv _m/FAIL_METIN/ 2>/dev/null; }
        rclone copy _m "gdrive:$KLASOR" --drive-root-folder-id "$OFIS" -q; R=$?
        rm -rf ~/.config/rclone
        echo "::warning::METIN_RC=$RC drive=$R"
        [ "$RC" = 0 ] && [ "$R" = 0 ]
  ozet:
    needs: [uret, metin]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Ozet + takvim/metin durum (dosyasi hazir olmayan pin isaretlenir)
      env:
        CIFTLER: ${{ inputs.ciftler }}
        RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      run: |
        set +e -uo pipefail
        curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
        mkdir -p ~/.config/rclone; umask 077
        printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
        if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "::add-mask::$GOOGLE_CLIENT_SECRET"
          grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && export RCLONE_CONFIG_GDRIVE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET" || true; fi
        R="gdrive:$KLASOR"; X="--drive-root-folder-id $OFIS"
        mkdir -p _z
        for d in PINTEREST_2x3 VIDEO GONDERI_4x5 ONIZLEME FAIL; do rclone lsf "$R/$d" $X > "_z/$d.txt"; done
        rclone lsf "$R" $X --dirs-only > _z/kok.txt
        rclone copyto "$R/TAKVIM_PIN78_20261125.csv" _z/T.csv $X -q; rclone copyto "$R/METIN_PIN78_20261125.csv" _z/M.csv $X -q
        python3 - <<'PY' > _z/OZET_PIN78.txt; PR=$?
        import csv, collections, os, sys
        L = {d: set(x.strip().rstrip('/') for x in open(f'_z/{d}.txt')) for d in ('PINTEREST_2x3', 'VIDEO', 'GONDERI_4x5', 'ONIZLEME', 'FAIL')}
        kok = [x.strip() for x in open('_z/kok.txt')]
        tum = [(r['cift'], r['a'].lower() + '-and-' + r['b'].lower()) for r in csv.DictReader(open('data/pod/pod78_ids.csv'))]
        sec = [c for c, _ in tum] if os.environ['CIFTLER'] == 'HEPSI' else list(dict.fromkeys(os.environ['CIFTLER'].split(',')))
        def hazir(s):   # FAIL klasorunde olan cift hazir sayilmaz (eski koşudan kalan dosya olsa bile); onizleme de gerekir
            return s not in L['FAIL'] and f'ONIZLEME_PAFTA_{s}.jpg' in L['ONIZLEME'] \
                and all(f'{s}-{t}.jpg' in L['PINTEREST_2x3'] for t in ('poster', 'kart', 'altin')) and f'{s}-pin-video.mp4' in L['VIDEO'] \
                and all(f'{s}-{t}-4x5.jpg' in L['GONDERI_4x5'] for t in ('poster', 'kart', 'altin'))
        H = [c for c, s in tum if hazir(s)]
        print('KLASOR', os.environ['KLASOR'])
        print('AYNI ADLI KLASOR (olmamali):', [k for k, n in collections.Counter(kok).items() if n > 1])
        print('PINTEREST_2x3', len(L['PINTEREST_2x3']), '/ 234; VIDEO', len(L['VIDEO']), '/ 78; GONDERI_4x5', len(L['GONDERI_4x5']),
              '/ 234; ONIZLEME', len(L['ONIZLEME']), '/ 78; FAIL', sorted(L['FAIL']))
        print('SECILEN', len(sec), '| HAZIR CIFT (secilen icinde)', len([c for c in sec if c in H]), '/', len(sec),
              '| HAZIR OLMAYAN', [c for c in sec if c not in H])
        sorun = [k for k, n in collections.Counter(kok).items() if n > 1]
        for ad in ('T', 'M'):
            if not os.path.exists(f'_z/{ad}.csv'):
                print(ad, 'csv yok'); sorun.append(ad + ' yok'); continue
            rows = list(csv.DictReader(open(f'_z/{ad}.csv', encoding='utf-8')))
            if not rows:
                print(ad, 'csv bos'); sorun.append(ad + ' bos'); continue
            for r in rows:
                r['dosya_hazir'] = 'EVET' if r['cift'] in H else 'HAYIR'
            out = '_z/TAKVIM_PIN78_20261125_DURUM.csv' if ad == 'T' else '_z/METIN_PIN78_20261125_DURUM.csv'
            with open(out, 'w', newline='', encoding='utf-8') as f:
                w = csv.DictWriter(f, fieldnames=list(rows[0]), lineterminator='\n'); w.writeheader(); w.writerows(rows)
            print(ad, 'satir', len(rows), 'dosya_hazir=HAYIR', sum(r['dosya_hazir'] == 'HAYIR' for r in rows))
        tamam = not sorun and all(c in H for c in sec)
        print('OZET_SONUC', 'PASS' if tamam else 'FAIL', sorun)
        sys.exit(0 if tamam else 1)
        PY
        cat _z/OZET_PIN78.txt | sed 's/^/::warning::/'
        rclone copy _z "$R" $X --include "OZET_PIN78.txt" --include "*_DURUM.csv" -q
        rm -rf ~/.config/rclone
        [ "$PR" = 0 ]

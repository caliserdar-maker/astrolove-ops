name: sembol-risk

# SALT OKUR tani (Drive okur, Drive'a tek rapor yazar; Etsy YOK): scripts/pod/sembol_risk.py.
# EJ KAPI_RAPORU.json (TEMP/POD_KAPAK_V3/SIPARIS) -> TEMP/POD_VIDEO_V2/SEMBOL_RISK.md

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Tara
        run: |
          set -euo pipefail
          rclone copy "gdrive:ASTROLOVE/TEMP/POD_KAPAK_V3/SIPARIS" _sip --include "*/KAPI_RAPORU.json" -q
          python3 scripts/pod/sembol_risk.py _sip
          cat SEMBOL_RISK.md >> "$GITHUB_STEP_SUMMARY"
          rclone copyto SEMBOL_RISK.md "gdrive:ASTROLOVE/TEMP/POD_VIDEO_V2/SEMBOL_RISK.md" -q
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone

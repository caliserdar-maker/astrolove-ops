name: kupa-alt78
# Kupa galeri 78 x 14 alt metni (ONAYLI sablon) -> Drive TEMP/KUPA_GALERI78/ALT78/<damga>/. ETSY YOK.
permissions:
  contents: read
on:
  workflow_dispatch:
jobs:
  alt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: Uret + Drive
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          python3 scripts/etsy/kupa_alt78.py --out _o
          cp data/pod/kupa_galeri78_alt.csv _o/SABLON_ONAYLI.csv
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || { sudo apt-get install -y -qq rclone >/dev/null; }
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            export RCLONE_CONFIG_GDRIVE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET"; fi
          D=$(date -u +%Y%m%d_%H%M%S)
          rclone copy _o "gdrive:ASTROLOVE/TEMP/KUPA_GALERI78/ALT78/$D" --immutable -q
          rm -rf ~/.config/rclone
          echo "::notice title=ALT78::TEMP/KUPA_GALERI78/ALT78/$D/"

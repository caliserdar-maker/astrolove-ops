name: start-here-append

# Drive'daki START_HERE dokumaninin sonuna depodaki bir B-kaydi dosyasini
# ekler (Google Docs API, rclone.conf token'i). Ayni numarali kayit zaten
# varsa yazmaz. Hicbir sir degeri loga dusmez.

on:
  workflow_dispatch:
    inputs:
      record_file:
        description: "Depodaki kayit dosyasi, or. docs/start_here/B94.txt (duzenleme modunda kullanilmaz)"
        required: false
        default: "docs/start_here/B94.txt"
      dry_run:
        description: "Yalniz kontrol et, yazma"
        type: boolean
        default: false
      tail:
        description: "Yazdiktan sonra dokumanin son N satirini yazdir (0 = kapali)"
        required: false
        default: "0"
      anchor:
        description: "Doluysa EKLEME MODU: bu satirin ardina record_file eklenir (yazilmis kaydin icine)"
        required: false
        default: ""
      occurrence:
        description: "Ekleme modu: capa birden cok geciyorsa tek | ilk | son"
        type: choice
        options: [tek, ilk, son]
        default: tek
      ops_file:
        description: "Doluysa DUZENLEME MODU: JSON islem listesi (satir/blok degistir, ekle)"
        required: false
        default: ""

concurrency:
  group: start-here
  cancel-in-progress: false

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklar
        run: |
          set -euo pipefail
          pip install -q requests==2.34.2

      - name: rclone kur
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          rclone version | head -1

      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONF_B64:-}" ]; then
            echo "HATA: RCLONE_CONF_B64 secret'i tanimli degil." >&2
            exit 1
          fi
          mkdir -p ~/.config/rclone
          umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          # Yeni OAuth istemcisinin secret'i conf'daki degeri ezer (rclone env override).
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
          fi

      - name: Kaydi duzenle (islem listesi)
        if: ${{ inputs.ops_file != '' }}
        env:
          OPS: ${{ inputs.ops_file }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--ops "$OPS")
          [ "$DRY" = "true" ] && args+=(--dry-run)
          python scripts/common/start_here_edit.py "${args[@]}"

      - name: Kaydin icine satir ekle (capa modu)
        if: ${{ inputs.ops_file == '' && inputs.anchor != '' }}
        env:
          ANCHOR: ${{ inputs.anchor }}
          RECORD: ${{ inputs.record_file }}
          OCC: ${{ inputs.occurrence }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--anchor "$ANCHOR" --text-file "$RECORD" --occurrence "$OCC")
          [ "$DRY" = "true" ] && args+=(--dry-run)
          python scripts/common/start_here_insert.py "${args[@]}"

      - name: Kaydi ekle
        if: ${{ inputs.ops_file == '' && inputs.anchor == '' }}
        run: |
          set -euo pipefail
          args=(--file "${{ inputs.record_file }}")
          [ "${{ inputs.dry_run }}" = "true" ] && args+=(--dry-run)
          [ -n "${{ inputs.tail }}" ] && [ "${{ inputs.tail }}" != "0" ] && args+=(--tail "${{ inputs.tail }}")
          python scripts/common/start_here_append.py "${args[@]}"

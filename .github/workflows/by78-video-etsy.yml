name: by78-video-etsy
# BIZIM YILIMIZ: ilan videosu (uploadListingVideo) Drive v3/<CIFT>/vitrin/00_Video.mp4 (Serdar 15 Eki). YAYIN/PATCH/SILME YOK.
# Varsayilan YALNIZ CANCER_LIBRA. Kalan 77 icin Serdar onayi gerekir (ciftler girdisi bilerek verilir).
permissions:
  actions: read
  contents: read
on:
  workflow_dispatch:
    inputs:
      ciftler: { description: "taslak ciftleri (bosluklu); varsayilan yalniz CANCER_LIBRA", required: true, default: "CANCER_LIBRA" }
env:
  V3: "gdrive:ASTROLOVE/TEMP/BIZIM_YILIMIZ_78_20261014_v3"
  O: "gdrive:ASTROLOVE/TEMP/BY78_TASLAK_20261014"
jobs:
  etsy:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Token + taslak listesi
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
          rclone copyto "$O/BY78_TASLAKLAR.csv" _work/BY78_TASLAKLAR.csv
      - name: Video (Etsy)
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          TASLAK_CSV: _work/BY78_TASLAKLAR.csv
          OUT: _out
          DRIVE_OUT: ${{ env.O }}
          CIFTLER: ${{ inputs.ciftler }}
        run: python3 scripts/etsy/by78_video_etsy.py
      - name: Token geri yaz
        if: ${{ always() }}
        run: |
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "token geri yazildi" || true
          rm -rf _work ~/.config/rclone

name: size-sira

# 78 POD ilaninda Size menusu sirasi (Serdar genel onayi 28 Eyl 2026). scripts/pod/size_sira.py
# Hedef: 8x10, 11x14, 12x16, 12x18, 16x20, 16x24, 18x24, 20x30, 24x30, 24x36, A4, A3, A2. Yalniz products sirasi degisir.
# mod=kuru salt okuma (boy kumesi + Print fiyat sirasi). mod=yaz + confirm=SIZESIRA Etsy'ye YAZAR: ilan basina yedek
# (Drive TEMP/SIZE_SIRA/YEDEK_<damga>/, dogrulanir) -> PUT -> birebir geri okuma; ilk FAIL'de DUR. Once CL (yalniz=4570143815).
# Ilerleme TEMP/SIZE_SIRA/ILERLEME.json (kota bitince ertesi kosu devam).

permissions:
  actions: read
  contents: read

on:
  workflow_dispatch:
    inputs:
      mod: {description: "kuru | yaz", default: "kuru"}
      confirm: {description: "yaz icin tam olarak: SIZESIRA", default: ""}
      yalniz: {description: "yalniz bu listing_id'ler (virgul)", default: ""}
      haric: {description: "dokunulmayacak listing_id'ler (virgul)", default: ""}
      kota_taban: {description: "bu kotanin altinda temiz dur", default: "150"}

jobs:
  sira:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          echo "DAMGA=$(date -u +%Y%m%d_%H%M)" >> "$GITHUB_ENV"
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Token + ilerleme
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
          rclone copyto "gdrive:ASTROLOVE/TEMP/SIZE_SIRA/ILERLEME.json" _work/ILERLEME.json 2>/dev/null && echo "ilerleme: devam" || echo "ilerleme: yok"
      - name: Oz-test (sahte API)
        run: python scripts/pod/test_size_sira.py > /dev/null && echo "selftest PASS"
      - name: Size sirasi
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          MOD: ${{ inputs.mod }}
          CONFIRM: ${{ inputs.confirm }}
          YALNIZ: ${{ inputs.yalniz }}
          HARIC: ${{ inputs.haric }}
          TABAN: ${{ inputs.kota_taban }}
        run: |
          python scripts/pod/size_sira.py --mod "$MOD" --confirm "$CONFIRM" --out _out --yalniz "$YALNIZ" --haric "$HARIC" \
            --ilerleme _work/ILERLEME.json --kota-taban "$TABAN" --yedek-drive "gdrive:ASTROLOVE/TEMP/SIZE_SIRA/YEDEK_${DAMGA}"
      - name: Token + rapor + ilerleme Drive'a
        if: ${{ always() }}
        run: |
          set -euo pipefail
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "Token geri yazildi" || true
          if grep -rqE 'x-api-key|refresh_token|"access_token"' _out/ 2>/dev/null; then echo "::error::ciktida sir benzeri anahtar"; exit 1; fi
          H="gdrive:ASTROLOVE/TEMP/SIZE_SIRA"
          [ -d _out ] && rclone copy _out "$H/${{ inputs.mod }}_$DAMGA" --exclude "YEDEK/**" -q || true
          [ "${{ inputs.mod }}" = "yaz" ] && [ -f _out/ILERLEME.json ] && rclone copyto _out/ILERLEME.json "$H/ILERLEME.json" -q || true
          [ -f _out/RAPOR.md ] && cat _out/RAPOR.md >> "$GITHUB_STEP_SUMMARY" || true
          echo "Cikti: TEMP/SIZE_SIRA/${{ inputs.mod }}_$DAMGA/"
      - name: Temizlik
        if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

name: desen-uret
# SALT OKUMA (PLAN.md KAYIT 22 Eki): musteri desen listesinin kaynaktan (Etsy makbuzlari + Drive musteri klasorleri) yeniden
# uretilebildigini gosterir. DEGER YAZILMAZ: yalniz tuzlu sha256 Drive TEMP/DENETIM_20261021/DESEN_URET_<run>/HASH.txt (sahip-ozel);
# log'a yalniz sayi. scripts/guvenlik/desen_uret.py. Tuz girdi DEGIL: betik uretir, maskeler, yalniz Drive'a TUZ.txt (Serdar 22 Eki 6a).
# Ayrica main agaci BELLEKTE desen listesiyle taranir (FAZ 1 kabul yolu): yer listesi TARAMA.json yalniz Drive'a, log'a sayi.
permissions:
  actions: read
  contents: read
on:
  workflow_dispatch:
    inputs:
      dallar: {description: "ek taranacak dallar (virgulle; orn. temiz/siparis-gpt,temiz/kupa-orchard); bos = yalniz main", required: false, default: ""}
      ocr: {description: "true = main + dallardaki gorseller OCR ile taranir (P0.5)", required: false, default: "false"}
jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }          # commit mesaji taramasi icin main gecmisi
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || { sudo apt-get install -y -qq rclone >/dev/null; }
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Token + Drive klasor kimlikleri (log'a yazilmaz)
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
          rclone lsjson --dirs-only "gdrive:ASTROLOVE/TEMP/SIPARIS_ISIM/DIJITAL" > _work/d1.json 2>/dev/null || echo "[]" > _work/d1.json
          rclone lsjson --dirs-only --include "SIPARIS_*/" "gdrive:ASTROLOVE/TEMP" > _work/d2.json 2>/dev/null || echo "[]" > _work/d2.json
          echo "drive klasor: $(python3 -c "import json;print(len(json.load(open('_work/d1.json'))), len(json.load(open('_work/d2.json'))))")"
          # izin listesi (Serdar onayli, sahip-ozel); icerik loga yazilmaz
          rclone copyto "gdrive:ASTROLOVE/TEMP/DENETIM_20261021/IZIN_LISTESI.json" _work/izin.json -q 2>/dev/null || echo "izin listesi yok"
      - name: Ek agaclar (dallar) + gorsel OCR (P0.5; metin yalniz runner'da)
        env: {DALLAR: "${{ inputs.dallar }}", OCR: "${{ inputs.ocr }}"}
        run: |
          set -euo pipefail
          EK=""; AGAC=(.)
          IFS=',' read -ra D <<< "${DALLAR:-}"
          for r in "${D[@]}"; do
            [ -n "$r" ] || continue
            [[ "$r" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::dal adi"; exit 1; }
            git fetch -q origin "+refs/heads/$r:refs/remotes/origin/$r"
            w="_ek/$(echo "$r" | tr '/' '_')"; git worktree add -q --detach "$w" "origin/$r"
            EK="$EK,$r=$w"; AGAC+=("$w")
          done
          if [ "$OCR" = "true" ]; then
            sudo apt-get install -y -qq tesseract-ocr ffmpeg > /dev/null
            pip install -q pillow
            python3 scripts/guvenlik/gorsel_ocr.py --out _ek/ocr "${AGAC[@]}"
            EK="$EK,ocr=_ek/ocr"
          fi
          echo "TARA_EK=${EK#,}" >> "$GITHUB_ENV"
      - name: Uret (salt okuma; yalniz sayi)
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: python3 scripts/guvenlik/desen_uret.py --out _out --drive-json _work/d1.json,_work/d2.json --tara . --izin _work/izin.json --tara-ek "${TARA_EK:-}"
      - name: Token geri yaz + HASH Drive'a
        if: ${{ always() }}
        run: |
          if [ -f _work/ETSY_TOKEN.json.updated ]; then
            rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "token geri yazildi" \
              || { echo "::error::yenilenen token Drive'a geri yazilamadi"; exit 1; }
          fi
          if [ -f _out/HASH.txt ]; then
            python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/ETSY_TOKEN.json _out || { echo "::error::ciktida sir"; exit 1; }
            rclone copy _out "gdrive:ASTROLOVE/TEMP/DENETIM_20261021/DESEN_URET_${GITHUB_RUN_ID}" -q && echo "HASH: DESEN_URET_${GITHUB_RUN_ID} ($(wc -l < _out/HASH.txt) satir)"
          fi
      - if: always()
        run: rm -rf _work _out _ek ~/.config/rclone

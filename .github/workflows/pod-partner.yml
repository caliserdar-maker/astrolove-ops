name: pod-partner

# 78 POD ilanina magazadaki tek production partner kaydini baglar + 'Prodigi' gecisini sayar. scripts/etsy/pod_partner_bagla.py
# mod=kuru salt okuma; mod=yaz + confirm=PARTNER yazar (aktif olmayan ilan atlanir), limit=N ilk N ilan.

permissions:
  actions: read
  contents: read

on:
  workflow_dispatch:
    inputs:
      mod: {description: "kuru | yaz", default: "kuru"}
      confirm: {description: "yaz icin tam olarak: PARTNER", default: ""}
      limit: {description: "0 = hepsi", default: "0"}

jobs:
  partner:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          echo "DAMGA=$(date -u +%Y%m%d_%H%M)" >> "$GITHUB_ENV"
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Partner
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          MOD: ${{ inputs.mod }}
          CONFIRM: ${{ inputs.confirm }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
          python scripts/etsy/pod_partner_bagla.py --mod "$MOD" --confirm "$CONFIRM" --limit "$LIMIT" --out _out
      - name: Token + rapor Drive'a
        if: ${{ always() }}
        run: |
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "Token geri yazildi" || true
          [ -d _out ] && rclone copy _out "gdrive:ASTROLOVE/TEMP/POD_PARTNER/${{ inputs.mod }}_${DAMGA}" -q && echo "Cikti: TEMP/POD_PARTNER/${{ inputs.mod }}_${DAMGA}/" || true
          [ -f _out/RAPOR.md ] && cat _out/RAPOR.md >> "$GITHUB_STEP_SUMMARY" || true
          rm -rf _work ~/.config/rclone

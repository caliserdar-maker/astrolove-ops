name: kupa-yd-oku
# SALT OKUMA (Etsy'ye yazma YOK; Serdar 31 Eki karar 3b + 5a). scripts/etsy/kupa_yd_oku.py
#  kupa: 78 kupa ilaninin canli EN + RU metni (1 batch istegi), kupa RU kurucusu girdisi.
#  yd  : 1st Anniversary pilot ilanin canli varyasyonlari + ilan nitelikleri + taksonomi ozellikleri (4 istek), boy (Size) id'si.
# Kupa ilan listesi Drive TEMP/KUPA_ORCHARD_TASLAK_20261019/KUPA_TASLAK_LISTE.csv. Cikti Drive TEMP/KUPA_YD_OKU/<damga>/ (--immutable).
permissions:
  actions: read
  contents: read
on:
  workflow_dispatch:
    inputs:
      mod: {description: "kupa | yd | ikisi | kisisel (ayni burclu 12 kupa sorusu, 13 istek)", required: true, default: "ikisi", type: choice, options: [ikisi, kupa, yd, kisisel]}
      pilot: {description: "YD pilot listing_id", required: false, default: "4595350971"}
jobs:
  oku:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Girdi kapisi
        env: {PILOT: "${{ inputs.pilot }}"}
        run: '[[ "$PILOT" =~ ^[0-9]+$ ]] || { echo "::error::pilot"; exit 1; }'
      - uses: actions/checkout@v4
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || { sudo apt-get install -y -qq rclone >/dev/null; }
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Token + kupa listesi
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out
          echo "DAMGA=$(date -u +%Y%m%d_%H%M%S)" >> "$GITHUB_ENV"
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
          rclone copyto "gdrive:ASTROLOVE/TEMP/KUPA_ORCHARD_TASLAK_20261019/KUPA_TASLAK_LISTE.csv" _work/KUPA_LISTE.csv
      - name: Oku (salt okur)
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          MOD: ${{ inputs.mod }}
          PILOT: ${{ inputs.pilot }}
        run: python3 scripts/etsy/kupa_yd_oku.py --mod "$MOD" --kupa-liste _work/KUPA_LISTE.csv --pilot "$PILOT" --out _out
      - name: Token geri yaz + cikti Drive'a
        if: ${{ always() }}
        run: |
          TOKEN_RC=0; OUT_RC=0; bash scripts/etsy/token_geri_yaz.sh || TOKEN_RC=1
          if ls _out/* >/dev/null 2>&1; then
            python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/ETSY_TOKEN.json _out || { echo "::error::ciktida sir"; exit 1; }
            rclone copy _out "gdrive:ASTROLOVE/TEMP/KUPA_YD_OKU/${DAMGA:?}" --immutable -q && echo "::notice title=KUPA YD OKU::TEMP/KUPA_YD_OKU/${DAMGA}/" || OUT_RC=1
          fi
          [ "$TOKEN_RC" = 0 ] && [ "$OUT_RC" = 0 ] || exit 1
      - if: always()
        run: rm -rf _work ~/.config/rclone

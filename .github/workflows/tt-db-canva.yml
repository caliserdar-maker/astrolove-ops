name: tt-db-canva

# TAURUS_TAURUS Deep Black 11x14 zemin (Serdar karari 30 Eyl): onay paketi Drive ASTROLOVE/TEMP/TT_DB_ONAY/.
# ONCE = POD_PRINT/TAURUS_TAURUS/DEEP_BLACK/11x14.jpg (dokulu), KOMSU = POD_PRINT/SCORPIO_VIRGO/DEEP_BLACK/11x14.jpg,
# YENI_ZEMIN = config/tt_db/TT_DB_zemin_3300x4200.png (BLACK_11x14 medyan plate, cember yayi silinmis; Canva'ya
# yuklenecek zemin), SONRA_SIMULASYON = ONCE'nin ogeleri YENI_ZEMIN uzerinde (Canva ciktisi DEGIL, yaklasik).
# 30 Eyl: Canva DAHPcxEOzDc s.76 zemini MAHWsBpuP5A ile degisti; CANVA_GERCEK_RENDER = Canva'nin kendi sayfa
# renderlari (once s.76 / sonra s.76 / komsu s.75, 396x504, gercek oran 3300:4200). POD_PRINT'e YAZMAZ. Etsy'ye dokunmaz.

permissions:
  contents: read

on:
  push:
    branches: [claude/gracious-meitner-i72rkr]
    paths:
      - config/tt_db.trigger

concurrency: tt-db-canva

jobs:
  is:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow numpy
      - run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
              echo "::add-mask::$GOOGLE_CLIENT_SECRET"
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Gercek Canva render -> Drive TEMP/TT_DB_ONAY/CANVA_GERCEK_RENDER
        run: |
          set -euo pipefail
          K="gdrive:ASTROLOVE/TEMP/TT_DB_ONAY"
          # onceki simulasyon (Canva ciktisi degil) karismasin: _ESKI_SIMULASYON altina tasinir
          for f in 2_SONRA_SIMULASYON_TAURUS_TAURUS_DB_11x14.jpg UCLU_KARSILASTIRMA.jpg; do
            rclone moveto "$K/$f" "$K/_ESKI_SIMULASYON/$f" 2>/dev/null || true
          done
          rclone copy config/tt_db/onay "$K/CANVA_GERCEK_RENDER"
          rclone check config/tt_db/onay "$K/CANVA_GERCEK_RENDER" --one-way
          rclone lsl "$K"
      - if: ${{ always() }}
        run: rm -rf dl ~/.config/rclone

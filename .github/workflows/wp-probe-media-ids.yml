name: wp-probe-media-ids

# SALT OKUR: bir ilandan cikarilmis gorsel/video ID'lerinin Etsy'de hala var
# olup olmadigini sorar (silindi mi, yoksa yalniz ilandan mi cikti). Yazma/silme
# YOK. Tek yan etki: OAuth token yenilenirse Drive'daki TEMP/ETSY_TOKEN.json
# geri yazilir (docs/SECRETS.md).

on:
  workflow_dispatch:
    inputs:
      listing_id:
        required: true
        default: "4565911475"
      image_ids:
        description: "Virgullu eski listing_image_id listesi"
        required: false
        default: ""
      old_video_id:
        description: "Kontrol edilecek eski video_id"
        required: false
        default: ""

concurrency:
  group: etsy-token
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Token al
        run: |
          set -euo pipefail
          umask 077
          mkdir -p _work
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
      - name: ID'leri sorgula (salt okur)
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          LISTING_ID: ${{ inputs.listing_id }}
          IMAGE_IDS: ${{ inputs.image_ids }}
          OLD_VIDEO_ID: ${{ inputs.old_video_id }}
        run: python scripts/etsy/_probe_media_ids.py
      - name: Token'i Drive'a geri yaz (yenilendiyse)
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ -f _work/ETSY_TOKEN.json.updated ]; then
            rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json"
          fi
      - if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

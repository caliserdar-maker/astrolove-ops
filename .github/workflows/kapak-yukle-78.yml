name: kapak-yukle-78

# 78 POD ilaninda v9 kapak yukleme + eski 1. sira kapagi yedekleyip silme (Serdar acik onayi 28 Eyl):
# scripts/etsy/kapak_yukle_78.py. Kapak kaynagi TEK: TEMP/POD_KAPAK_78/<EN SON damga>/ (OZET 78/78 PASS).
# Varsayilan KURU KOSU (Etsy salt okur): on kontrol + yedek (GALERI_ONCE.json + eski rank 1 dosyalari)
# Drive TEMP/KAPAK78_YEDEK_<damga>/ + PLAN.json + silinecek 78 image_id + bag tasinacak ilanlar.
# Renk bagli ilanda (Serdar 28 Eyl): yukle -> geri oku -> baglari yedekle -> updateVariationImages (yalniz
# eski kapaga bagli deger yeni kapaga) -> geri oku -> sil -> geri oku. updateListing CAGRILMAZ.
# Yazma yalniz apply=true VE confirm=KAPAK78_YUKLE_SIL VE plan_damga (kuru kosunun damgasi) ile; apply
# plana kilitlidir (kapak sha256 + canli galeri), ilk hatada DURUR. Yedek: KAPAK78_YEDEK_<plan_damga>/
# Cikti: Drive TEMP/KAPAK78_YUKLE/<KURU|APPLY>_<damga>/
# TEK SEFERLIK ZAMANLAMA (Serdar onayi 28 Eyl): 29 Eyl 2026 00:05 UTC, Etsy kotasi yenilenince kalan 28 ilan;
# plan 20260928_1006, haric 4570113157 (AQUARIUS_LIBRA) + 4570163164 (CAPRICORN_LIBRA; Terazi QC bekliyor).
# Kapi isi yalniz 20260929 tarihinde calisir; baska gunlerdeki cron tetiklemeleri hicbir sey yapmaz.

on:
  workflow_dispatch:
    inputs:
      plan_damga: {description: "apply: kuru kosu cikti damgasi (TEMP/KAPAK78_YUKLE/KURU_<damga>/PLAN.json)", required: false, default: ""}
      apply: {description: "true = Etsy'ye YAZ + eski kapak SIL (confirm gerekir)", type: boolean, default: false}
      confirm: {description: "Yazma icin tam olarak: KAPAK78_YUKLE_SIL", required: false, default: ""}
      devam: {description: "apply: yarim ilan LISTING:YENI_IMAGE:ESKI_IMAGE (kesin id; virgulle birden cok)", required: false, default: ""}
      haric: {description: "apply: bu kosuda dokunulmayacak LISTING_ID'ler (virgulle)", required: false, default: ""}
      kapak_ek: {description: "TEMP altinda duzeltilmis kapak klasoru (KAPAK_*.jpg son damganin USTUNE; RAPOR.md SONUC PASS sart). kuru+apply AYNI deger", required: false, default: ""}
      yenile: {description: "kuru: ayni alt+boyutta olsa da degistirilecek CIFT'ler (virgulle)", required: false, default: ""}
      sadece: {description: "kuru: yalniz bu CIFT'ler okunur ve planlanir (tamamlananlar Etsy'den okunmaz; virgulle)", required: false, default: ""}
  schedule:
    - cron: "5 0 29 9 *"   # tek seferlik: 2026-09-29 00:05 UTC (kapi isi tarihi dogrular)


permissions:
  actions: read
  contents: read

jobs:
  kapi:
    runs-on: ubuntu-latest
    outputs:
      calis: ${{ steps.k.outputs.calis }}
    steps:
      - id: k
        env:
          OLAY: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$OLAY" != "schedule" ]; then echo "calis=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          gun=$(date -u +%Y%m%d)
          if [ "$gun" = "20260929" ]; then
            echo "tek seferlik zamanlama: $gun, kalan ilanlar (plan 20260928_1006, haric 4570113157,4570163164)"
            echo "calis=true" >> "$GITHUB_OUTPUT"
          else
            echo "tek seferlik zamanlama yalniz 20260929; bugun $gun -> hicbir sey yapilmaz"
            echo "calis=false" >> "$GITHUB_OUTPUT"
          fi

  yukle:
    needs: kapi
    if: needs.kapi.outputs.calis == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 270
    env:
      APPLY: ${{ github.event_name == 'schedule' && 'true' || inputs.apply }}
      CONFIRM: ${{ github.event_name == 'schedule' && 'KAPAK78_YUKLE_SIL' || inputs.confirm }}
      PDAMGA: ${{ github.event_name == 'schedule' && '20260928_1006' || inputs.plan_damga }}
      DEVAM: ${{ inputs.devam }}
      HARIC: ${{ github.event_name == 'schedule' && '4570113157,4570163164' || inputs.haric }}
      KAPAK_EK: ${{ inputs.kapak_ek }}
      YENILE: ${{ inputs.yenile }}
      SADECE: ${{ inputs.sadece }}
    steps:
      - name: Onay kapisi
        run: |
          set -euo pipefail
          if [ "$APPLY" = "true" ]; then
            [ "$CONFIRM" = "KAPAK78_YUKLE_SIL" ] || { echo "::error::apply=true icin confirm tam olarak 'KAPAK78_YUKLE_SIL' olmali. DUR."; exit 1; }
            [[ "$PDAMGA" =~ ^[0-9]{8}_[0-9]{4}$ ]] || { echo "::error::apply icin plan_damga (kuru kosu damgasi) gerekli. DUR."; exit 1; }
            [ -z "$DEVAM" ] || [[ "$DEVAM" =~ ^[0-9]+:[0-9]+:[0-9]+(,[0-9]+:[0-9]+:[0-9]+)*$ ]] || { echo "::error::devam bicimi LISTING:YENI:ESKI"; exit 1; }
            [ -z "$HARIC" ] || [[ "$HARIC" =~ ^[0-9]+(,[0-9]+)*$ ]] || { echo "::error::haric bicimi LISTING[,LISTING]"; exit 1; }
            echo "MOD=APPLY" >> "$GITHUB_ENV"
          else
            echo "MOD=KURU" >> "$GITHUB_ENV"
          fi
          echo "STAMP=$(date -u +%Y%m%d_%H%M)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2 pillow==12.3.0 numpy==2.4.6
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Token
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
      - name: Kapaklar (TEMP/POD_KAPAK_78 en son damga) (+ plan)
        run: |
          set -euo pipefail
          KDAMGA=$(rclone lsf --dirs-only "gdrive:ASTROLOVE/TEMP/POD_KAPAK_78/" | tr -d '/' | grep -E '^[0-9]{8}_[0-9]{4}$' | sort | tail -1)
          [ -n "$KDAMGA" ] || { echo "::error::POD_KAPAK_78 altinda damgali klasor yok. DUR."; exit 1; }
          K="gdrive:ASTROLOVE/TEMP/POD_KAPAK_78/$KDAMGA"
          echo "kaynak: $K"
          rclone copy "$K" _work/kapak --include "KAPAK_*.jpg" --include "OZET.md" -q
          grep -q "^SONUC PASS" _work/kapak/OZET.md || { echo "::error::OZET.md SONUC PASS degil. DUR."; exit 1; }
          OZET=$(grep '^PASS:' _work/kapak/OZET.md)
          if [ -n "${KAPAK_EK:-}" ]; then
            [[ "$KAPAK_EK" =~ ^[A-Za-z0-9_/.-]+$ ]] && [[ "$KAPAK_EK" != *..* ]] || { echo "::error::kapak_ek bicimi. DUR."; exit 1; }
            rclone copyto "gdrive:ASTROLOVE/TEMP/$KAPAK_EK/RAPOR.md" _work/ek_rapor.md
            grep -q "^SONUC PASS" _work/ek_rapor.md || { echo "::error::kapak_ek RAPOR.md SONUC PASS degil. DUR."; exit 1; }
            rclone copy "gdrive:ASTROLOVE/TEMP/$KAPAK_EK" _work/kapak --include "KAPAK_*.jpg" -q
            echo "kapak_ek (ustune): TEMP/$KAPAK_EK -> $(rclone lsf "gdrive:ASTROLOVE/TEMP/$KAPAK_EK" --include 'KAPAK_*.jpg' | tr '\n' ' ')"
            OZET="$OZET | ek: TEMP/$KAPAK_EK (SONUC PASS)"
          fi
          echo "kapak: $(ls _work/kapak/KAPAK_*.jpg | wc -l) | $OZET"
          CL=$(rclone lsjson "$K/KAPAK_CANCER_LIBRA.jpg" | python -c 'import json,sys;l=json.load(sys.stdin);print(json.dumps(l[0] if l else {}))')
          python -c 'import json,sys;json.dump({"klasor":"TEMP/POD_KAPAK_78/"+sys.argv[1]+"/","ozet":sys.argv[2],"cancer_libra":json.loads(sys.argv[3])},open("_work/kaynak.json","w"))' "$KDAMGA" "$OZET" "$CL"
          cat _work/kaynak.json; echo
          if [ "$MOD" = "APPLY" ]; then
            rclone copyto "gdrive:ASTROLOVE/TEMP/KAPAK78_YUKLE/KURU_${PDAMGA}/PLAN.json" _work/PLAN.json
            echo "plan: KURU_${PDAMGA}/PLAN.json ($(stat -c %s _work/PLAN.json) bayt)"
          fi
      - name: Kapak yukle + eski kapak sil (kuru / apply)
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          set -euo pipefail
          args=(--kapak-dir _work/kapak --kaynak-bilgi _work/kaynak.json --out _out)
          if [ "$MOD" = "APPLY" ]; then
            args+=(--plan _work/PLAN.json --yedek-drive "gdrive:ASTROLOVE/TEMP/KAPAK78_YEDEK_${PDAMGA}" --apply --confirm "$CONFIRM" --devam "$DEVAM" --haric "$HARIC")
          else
            args+=(--yedek-drive "gdrive:ASTROLOVE/TEMP/KAPAK78_YEDEK_${STAMP}" --yenile "$YENILE" --sadece "$SADECE")
          fi
          python scripts/etsy/kapak_yukle_78.py "${args[@]}"
      - name: Token + cikti Drive'a
        if: ${{ always() }}
        run: |
          set -euo pipefail
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "Token geri yazildi" || true
          if grep -rIqE 'x-api-key|refresh_token|"access_token"' _out/ 2>/dev/null; then
            echo "::error::ciktida sir benzeri anahtar bulundu, Drive'a yazilmadi"; exit 1
          fi
          if [ "${MOD:-KURU}" = "KURU" ] && [ -d _out/yedek ]; then
            y="gdrive:ASTROLOVE/TEMP/KAPAK78_YEDEK_${STAMP}"
            rclone copy _out/yedek "$y" -q
            if rclone check _out/yedek "$y" --one-way -q; then
              echo "Yedek: TEMP/KAPAK78_YEDEK_${STAMP}/ ($(ls _out/yedek | wc -l) dosya, rclone check 0 fark)"
            else
              echo "::error::yedek rclone check FARK var"; exit 1
            fi
          fi
          hedef="gdrive:ASTROLOVE/TEMP/KAPAK78_YUKLE/${MOD:-KURU}_${STAMP}"
          [ -d _out ] && rclone copy _out "$hedef" --exclude "yedek/*.jpg" -q && echo "Cikti: TEMP/KAPAK78_YUKLE/${MOD:-KURU}_${STAMP}/"
          [ -f _out/report.md ] && cat _out/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

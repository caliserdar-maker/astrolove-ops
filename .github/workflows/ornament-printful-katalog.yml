          DIS=$(git diff --cached --name-only | grep -v "^$U/" || true)
          [ -z "$DIS" ] || { echo "::error::izinli klasor disi: $DIS"; exit 1; }
          git commit -qm "printful urun taramasi $MOD (kosu ${GITHUB_RUN_ID}, $ALT)" && git push -q origin "HEAD:${DAL}"
          exit $k

      - name: Printful urun taramasi (urun1 / urun2; yalniz GET + kargo ucreti)
        if: env.MOD == 'urun1' || env.MOD == 'urun2' || env.MOD == 'urun3'
        env:
          ALT: ${{ inputs.alt }}
          VERI: ${{ inputs.veri }}
        run: |
          set -euo pipefail
          [ -n "$ALT" ] || { echo "::error::alt (damga) bos"; exit 1; }
          U="docs/printful_urun/$ALT"; mkdir -p "s/$U"
          sansur() { sed -u "s|${PRINTFUL_TOKEN}|***|g"; }
          set +e
          if [ "$MOD" = urun1 ]; then
            python3 -I main/scripts/printful/urun_katalog.py liste "s/$U/ham" 2>&1 | sansur | tee "s/$U/KOSU_LOG_1.txt"; k=${PIPESTATUS[0]}
            [ $k = 0 ] && { python3 -I main/scripts/printful/urun_katalog.py tablo "s/$U" 2>&1 | tee -a "s/$U/KOSU_LOG_1.txt"; k=${PIPESTATUS[0]}; }
          elif [ "$MOD" = urun3 ]; then
            [ -n "$VERI" ] || { echo "::error::veri (secilen urun id listesi) bos"; exit 1; }
            L="s/$U/KOSU_LOG_3.txt"
            python3 -I main/scripts/printful/urun_katalog.py ek3 "s/$U/ham" "$VERI" 2>&1 | sansur | tee "$L"; k=${PIPESTATUS[0]}
            [ $k = 0 ] && { python3 -I main/scripts/printful/urun_katalog.py tablo "s/$U" 2>&1 | tee -a "$L"; k=${PIPESTATUS[0]}; }
            [ $k = 0 ] && { python3 -I main/scripts/printful/urun_katalog.py secilen "s/$U" "$VERI" 2>&1 | tee -a "$L"; k=${PIPESTATUS[0]}; }
            [ $k = 0 ] && { python3 -I main/scripts/printful/urun_rapor.py "s/$U" 2>&1 | tee -a "$L"; k=${PIPESTATUS[0]}; }
          else
            [ -n "$VERI" ] || { echo "::error::veri (urun id listesi) bos"; exit 1; }
            python3 -I main/scripts/printful/urun_katalog.py detay "s/$U/ham" "$VERI" 2>&1 | sansur | tee "s/$U/KOSU_LOG_2.txt"; k=${PIPESTATUS[0]}
            [ $k = 0 ] && { python3 -I main/scripts/printful/urun_katalog.py secilen "s/$U" "$VERI" 2>&1 | tee -a "s/$U/KOSU_LOG_2.txt"; k=${PIPESTATUS[0]}; }
          fi
          set -e
          if grep -rlF "$PRINTFUL_TOKEN" "s/$U" >/dev/null; then echo "::error::ciktida token, yazilmadi"; exit 1; fi
          rclone copy "s/$U" "gdrive:ASTROLOVE/TEMP/PRINTFUL_URUN_$ALT" -q
          echo "::notice::Drive TEMP/PRINTFUL_URUN_$ALT | cikis $k | $(tail -1 s/$U/KOSU_LOG_*.txt | tr '\n' ' ' | cut -c1-300)"
          cd s && git config user.name "astrolove-bot" && git config user.email "astrolove-bot@users.noreply.github.com"

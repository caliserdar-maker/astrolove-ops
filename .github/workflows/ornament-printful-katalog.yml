name: ornament-printful-katalog
# Serdar 2 Kas 2026: Printful ornament urunleri SALT OKUMA. Yalniz GET + kargo ucreti sorgusu (POST /shipping/rates,
# POST /v2/shipping-rates; izin listesi betikte). Siparis / urun / sablon / mockup gorevi OLUSTURULMAZ. Etsy'ye dokunmaz.
# Token: Drive TEMP/PRINTFUL_TOKEN.json (printful-kupa-15oz deseni, maskeli, ciktiya yazilmaz).
# Cikti: Drive TEMP/ORNAMENT_PRINTFUL_20261102/ (CSV, MD, ham/) + dal ornament-printful-katalog docs/ornament/ (normal commit).
# mod=rapor: API'ye gitmez, daldaki docs/ornament/ham'dan raporu yeniden uretir.
# mod=ek (Serdar 2 Kas onayi): yalniz v2'de olan urunler (1664, 1729) icin GET + POST /v2/shipping-rates; daldaki ham'a ekler.
#   Bu mod dal ornament-printful-katalog'dan tetiklenir (ref=ornament-printful-katalog).
# mod=zemin3 (Serdar 2 Kas onayi): Canva disa aktarim linklerinden (gecici, imzali) 3 zemin PNG indirir; yalniz GET. veri = base64
#   "AD URL" satirlari. Cikti Drive TEMP/ORNAMENT_ZEMIN3_20261102/ + dal docs/ornament/zemin3/. Printful / Etsy istegi yok.
# mod=ornek (Serdar 2 Kas onayi): CANCER_LIBRA ornament ORNEK baski dosyalari (scripts/printful/ornament_ornek.py). Kaynaklar Drive
#   dosya kimligiyle + dal ornek-tek-doku / siparis-gpt (git show); Printful CDN sablon gorseli yalniz GET (olmazsa devam).
#   Cikti Drive TEMP/ORNAMENT_ORNEK_<damga>/ (+ STIL3/) + dal docs/ornament/ornek/<damga>/. Etsy / Printful API istegi yok.
# mod=ornek2 (Merkez inceleme + Serdar 2 Kas): yalniz STIL3 V2 (scripts/printful/ornament_ornek2.py). Cikti Drive
#   TEMP/ORNAMENT_ORNEK_<damga>/STIL3_V2/ + dal docs/ornament/ornek/<damga>/STIL3_V2/.
# mod=ornek3 (Merkez STIL3_V3, Serdar 2 Kas): halkali + halkasiz x 3 zemin (zemin3/V2), scripts/printful/ornament_ornek3.py; cikti STIL3_V3/.
on:
  workflow_dispatch:
    inputs:
      mod:
        description: "tam (API oku + rapor) / ek (1664/1729 v2 kargo + rapor) / rapor (daldaki ham JSON'dan, API yok)"
        default: "tam"
      veri:
        description: "zemin3: base64('AD URL' satirlari)"
        default: ""
      alt:
        description: "zemin3: alt klasor (bos = kok; ornek V2)"
        default: ""
permissions:
  contents: write
jobs:
  oku:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MOD: ${{ inputs.mod }}
      DAL: ornament-printful-katalog
      DRIVE: gdrive:ASTROLOVE/TEMP/ORNAMENT_PRINTFUL_20261102
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - uses: actions/checkout@v4
        with:
          ref: ornament-printful-katalog
          path: s
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Girdi
        run: |
          case "$MOD" in tam|ek|rapor|zemin3|ornek|ornek2|ornek3) ;; *) echo "::error::mod tam, ek, rapor, zemin3, ornek, ornek2 ya da ornek3 ($MOD)"; exit 1;; esac
          if [ "$MOD" != tam ] && [ ! -f s/docs/ornament/ham/_adaylar.json ]; then echo "::error::dalda ham yok"; exit 1; fi
          echo "ref ${GITHUB_REF_NAME} | betik $(git -C main rev-parse --short HEAD) | dal $(git -C s rev-parse --short HEAD)"
      - name: rclone kur
        timeout-minutes: 5
        run: curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || sudo apt-get install -y -qq rclone >/dev/null
      - name: rclone.conf + Printful token (maskeli)
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; export RCLONE_CONFIG_GDRIVE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET"; fi
          if [ "$MOD" = tam ] || [ "$MOD" = ek ]; then
            T=$(rclone cat "gdrive:ASTROLOVE/TEMP/PRINTFUL_TOKEN.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["api_token"].strip())')
            [ -n "$T" ] || { echo "HATA: PRINTFUL_TOKEN.json api_token bos"; exit 1; }
            echo "::add-mask::$T"
            echo "PRINTFUL_TOKEN=$T" >> "$GITHUB_ENV"
            echo "token okundu (maskeli)"
          fi
      - name: Zemin3 indir (Canva linkleri, yalniz GET) + Drive + dal
        if: env.MOD == 'zemin3'
        env:
          VERI: ${{ inputs.veri }}
          ALT: ${{ inputs.alt }}
        run: |
          set -euo pipefail
          ZD="docs/ornament/zemin3${ALT:+/$ALT}"; export ZD
          mkdir -p s/$ZD
          printf '%s' "$VERI" | base64 -d > /tmp/liste.txt
          while read -r ad url; do
            [ -n "$ad" ] || continue
            echo "::add-mask::$url"
            kod=$(curl -sS -m 120 --retry 3 -o "s/$ZD/${ad}_1264.png" -w '%{http_code}' "$url")
            echo "$ad HTTP $kod $(stat -c %s s/$ZD/${ad}_1264.png) bayt"
            [ "$kod" = 200 ] || { echo "::error::$ad indirilemedi (HTTP $kod)"; exit 1; }
          done < /tmp/liste.txt
          rm -f /tmp/liste.txt
          pip install -q pillow==11.0.0 numpy
          python3 - <<'PY'
          import hashlib, json, glob, os
          from PIL import Image
          import numpy as np
          r = {}
          for f in sorted(glob.glob('s/' + os.environ['ZD'] + '/*_1264.png')):
              im = Image.open(f); a = np.asarray(im.convert('RGB'))
              r[f.split('/')[-1]] = dict(boyut=im.size, mod=im.mode, sha256=hashlib.sha256(open(f, 'rb').read()).hexdigest(),
                                         ortalama_rgb=[round(float(v), 1) for v in a.reshape(-1, 3).mean(0)])
              assert im.size == (1264, 1264), (f, im.size)
          json.dump(r, open('s/' + os.environ['ZD'] + '/ZEMIN3.json', 'w'), indent=1)
          print(json.dumps(r, indent=1))
          PY
          rclone copy "s/$ZD" "gdrive:ASTROLOVE/TEMP/ORNAMENT_ZEMIN3_20261102${ALT:+/$ALT}" -q
          echo "::notice::Drive TEMP/ORNAMENT_ZEMIN3_20261102${ALT:+/$ALT}: $(ls s/$ZD | tr '\n' ' ')"
          cd s && git config user.name "astrolove-bot" && git config user.email "astrolove-bot@users.noreply.github.com"
          git add "$ZD"
          DIS=$(git diff --cached --name-only | grep -v "^$ZD/" || true)
          [ -z "$DIS" ] || { echo "::error::izinli klasor disi: $DIS"; exit 1; }
          git commit -qm "ornament zemin3: Canva zeminleri (kosu ${GITHUB_RUN_ID})" && git push -q origin "HEAD:${DAL}"
          echo "::notice::dal commit $(git rev-parse --short HEAD)"
      - name: Ornek uret (CANCER_LIBRA ornament) + Drive + dal
        if: env.MOD == 'ornek'
        run: |
          set -euo pipefail
          K=/tmp/kay; O=/tmp/ornek; mkdir -p $K $O
          # Drive (dosya kimligi): ana sembol, kucuk semboller, BLUE / MODERN plakalari
          rclone backend copyid gdrive: 17V0yS8Uo0nFJO3QpoUfnSaOWjv_o0x5p "$K/" 1xY_Pcr11EM4pMQYyZynLM_4zyS1GJUjS "$K/" \
            1FHwFRdgOcN5LGYS5PkGBghmCqJo16t7B "$K/" 1nZ1Efkyox7ku4cEyQhAEcoiZT9G7yAvh "$K/" 1nt6r8k2QV7HJUZL7vxMtU5qGu-M1zATJ "$K/"
          git -C main fetch -q --depth=1 origin ornek-tek-doku:refs/remotes/origin/ornek-tek-doku siparis-gpt:refs/remotes/origin/siparis-gpt
          for f in motor/varlik/halka/HALKA_BLUE_16x20.png motor/varlik/halka/HALKA_16x20.png motor/font/Cinzel.ttf motor/font/EBGaramond-Italic.ttf motor/tek_doku.py; do
            git -C main show "origin/ornek-tek-doku:$f" > "$K/$(basename $f)"; done
          git -C main show origin/siparis-gpt:motor_gpt/alfa_ogeler.npz > $K/alfa_ogeler.npz
          git -C main show origin/siparis-gpt:motor_gpt/girdi78/ana/cancer_libra_alfa.png > $K/cancer_libra_alfa.png
          cp s/docs/ornament/zemin3/*_1264.png $K/
          { echo "ornek-tek-doku $(git -C main rev-parse --short origin/ornek-tek-doku)"; echo "siparis-gpt $(git -C main rev-parse --short origin/siparis-gpt)";
            echo "betik $(git -C main rev-parse --short HEAD)"; } > $O/KAYNAK_COMMIT.txt
          mkdir -p $O/sablon
          curl -fsS -m 60 -o $K/sablon_Circle.png "https://files.cdn.printful.com/m/ceramic_ornament/medium/templates/Circle.png?v=1749493366" && cp $K/sablon_Circle.png $O/sablon/ || echo "sablon Circle indirilemedi"
          curl -fsS -m 60 -o $O/sablon/sablon_circle_base.png "https://files.cdn.printful.com/m/ceramic_ornament/medium/flat/circle/04_ceramicornaments_circle_base_whitebg.png?v=1749145637" || echo "sablon base indirilemedi"
          ls -la $K $O/sablon
          pip install -q pillow==11.0.0 numpy==2.5.4 opencv-python-headless==5.0.0.93
          set +e
          python3 -I main/scripts/printful/ornament_ornek.py --kaynak $K --cikti $O 2>&1 | tee $O/KOSU_LOG.txt; k=${PIPESTATUS[0]}
          set -e
          D=ORNAMENT_ORNEK_$(date -u +%Y%m%d_%H%M)
          rclone copy $O "gdrive:ASTROLOVE/TEMP/$D" -q
          echo "::notice::Drive TEMP/$D | betik cikis $k | $(grep '^KAPI' $O/KOSU_LOG.txt || true)"
          mkdir -p s/docs/ornament/ornek/$D && cp -r $O/. s/docs/ornament/ornek/$D/
          cd s && git config user.name "astrolove-bot" && git config user.email "astrolove-bot@users.noreply.github.com"
          git add docs/ornament/ornek
          DIS=$(git diff --cached --name-only | grep -v '^docs/ornament/ornek/' || true)
          [ -z "$DIS" ] || { echo "::error::izinli klasor disi: $DIS"; exit 1; }
          git commit -qm "ornament ornek: CANCER_LIBRA (kosu ${GITHUB_RUN_ID}, $D)" && git push -q origin "HEAD:${DAL}"
          echo "::notice::dal commit $(git rev-parse --short HEAD)"
          exit $k
      - name: Ornek V2 uret (STIL3_V2) + Drive + dal
        if: env.MOD == 'ornek2'
        run: |
          set -euo pipefail
          K=/tmp/kay; O=/tmp/ornek/STIL3_V2; mkdir -p $K $O
          rclone backend copyid gdrive: 17V0yS8Uo0nFJO3QpoUfnSaOWjv_o0x5p "$K/" 1xY_Pcr11EM4pMQYyZynLM_4zyS1GJUjS "$K/" 1FHwFRdgOcN5LGYS5PkGBghmCqJo16t7B "$K/"
          git -C main fetch -q --depth=1 origin ornek-tek-doku:refs/remotes/origin/ornek-tek-doku siparis-gpt:refs/remotes/origin/siparis-gpt
          for f in motor/varlik/halka/HALKA_BLUE_16x20.png motor/font/Cinzel.ttf motor/font/EBGaramond-Italic.ttf motor/tek_doku.py; do
            git -C main show "origin/ornek-tek-doku:$f" > "$K/$(basename $f)"; done
          git -C main show origin/siparis-gpt:motor_gpt/alfa_ogeler.npz > $K/alfa_ogeler.npz
          git -C main show origin/siparis-gpt:motor_gpt/girdi78/ana/cancer_libra_alfa.png > $K/cancer_libra_alfa.png
          cp s/docs/ornament/zemin3/*_1264.png $K/
          { echo "ornek-tek-doku $(git -C main rev-parse --short origin/ornek-tek-doku)"; echo "siparis-gpt $(git -C main rev-parse --short origin/siparis-gpt)";
            echo "betik $(git -C main rev-parse --short HEAD)"; } > $O/KAYNAK_COMMIT.txt
          ls -la $K
          pip install -q pillow==11.0.0 numpy==2.5.4 opencv-python-headless==5.0.0.93
          set +e
          python3 -I main/scripts/printful/ornament_ornek2.py --kaynak $K --cikti $O 2>&1 | tee $O/KOSU_LOG.txt; k=${PIPESTATUS[0]}
          set -e
          D=ORNAMENT_ORNEK_$(date -u +%Y%m%d_%H%M)
          rclone copy /tmp/ornek "gdrive:ASTROLOVE/TEMP/$D" -q
          echo "::notice::Drive TEMP/$D/STIL3_V2 | betik cikis $k | $(grep '^KAPI' $O/KOSU_LOG.txt || true)"
          mkdir -p s/docs/ornament/ornek/$D && cp -r /tmp/ornek/. s/docs/ornament/ornek/$D/
          cd s && git config user.name "astrolove-bot" && git config user.email "astrolove-bot@users.noreply.github.com"
          git add docs/ornament/ornek
          DIS=$(git diff --cached --name-only | grep -v '^docs/ornament/ornek/' || true)
          [ -z "$DIS" ] || { echo "::error::izinli klasor disi: $DIS"; exit 1; }
          git commit -qm "ornament ornek V2: STIL3_V2 (kosu ${GITHUB_RUN_ID}, $D)" && git push -q origin "HEAD:${DAL}"
          echo "::notice::dal commit $(git rev-parse --short HEAD)"
          exit $k
      - name: Ornek V3 uret (STIL3_V3) + Drive + dal
        if: env.MOD == 'ornek3'
        run: |
          set -euo pipefail
          K=/tmp/kay; O=/tmp/ornek/STIL3_V3; mkdir -p $K $O
          rclone backend copyid gdrive: 17V0yS8Uo0nFJO3QpoUfnSaOWjv_o0x5p "$K/" 1xY_Pcr11EM4pMQYyZynLM_4zyS1GJUjS "$K/" 1FHwFRdgOcN5LGYS5PkGBghmCqJo16t7B "$K/"
          git -C main fetch -q --depth=1 origin ornek-tek-doku:refs/remotes/origin/ornek-tek-doku siparis-gpt:refs/remotes/origin/siparis-gpt
          for f in motor/varlik/halka/HALKA_BLUE_16x20.png motor/font/Cinzel.ttf motor/font/EBGaramond-Italic.ttf motor/tek_doku.py; do
            git -C main show "origin/ornek-tek-doku:$f" > "$K/$(basename $f)"; done
          git -C main show origin/siparis-gpt:motor_gpt/alfa_ogeler.npz > $K/alfa_ogeler.npz
          git -C main show origin/siparis-gpt:motor_gpt/girdi78/ana/cancer_libra_alfa.png > $K/cancer_libra_alfa.png
          cp s/docs/ornament/zemin3/V2/*_1264.png $K/
          { echo "ornek-tek-doku $(git -C main rev-parse --short origin/ornek-tek-doku)"; echo "siparis-gpt $(git -C main rev-parse --short origin/siparis-gpt)";
            echo "betik $(git -C main rev-parse --short HEAD)"; } > $O/KAYNAK_COMMIT.txt
          ls -la $K
          pip install -q pillow==11.0.0 numpy==2.5.4 opencv-python-headless==5.0.0.93
          set +e
          python3 -I main/scripts/printful/ornament_ornek3.py --kaynak $K --cikti $O 2>&1 | tee $O/KOSU_LOG.txt; k=${PIPESTATUS[0]}
          set -e
          D=ORNAMENT_ORNEK_$(date -u +%Y%m%d_%H%M)
          rclone copy /tmp/ornek "gdrive:ASTROLOVE/TEMP/$D" -q
          echo "::notice::Drive TEMP/$D/STIL3_V3 | betik cikis $k | $(grep '^KAPI' $O/KOSU_LOG.txt || true)"
          mkdir -p s/docs/ornament/ornek/$D && cp -r /tmp/ornek/. s/docs/ornament/ornek/$D/
          cd s && git config user.name "astrolove-bot" && git config user.email "astrolove-bot@users.noreply.github.com"
          git add docs/ornament/ornek
          DIS=$(git diff --cached --name-only | grep -v '^docs/ornament/ornek/' || true)
          [ -z "$DIS" ] || { echo "::error::izinli klasor disi: $DIS"; exit 1; }
          git commit -qm "ornament ornek V3: STIL3_V3 (kosu ${GITHUB_RUN_ID}, $D)" && git push -q origin "HEAD:${DAL}"
          echo "::notice::dal commit $(git rev-parse --short HEAD)"
          exit $k
      - name: Printful oku (GET + kargo ucreti)
        if: env.MOD == 'tam'
        run: |
          set -o pipefail
          rm -rf s/docs/ornament/ham; mkdir -p s/docs/ornament
          python3 -I main/scripts/printful/ornament_katalog.py oku s/docs/ornament/ham 2>&1 | sed -u "s|${PRINTFUL_TOKEN}|***|g" | tee s/docs/ornament/KOSU_LOG.txt
          k=${PIPESTATUS[0]}; echo "::notice::oku cikis $k"; exit $k
      - name: Printful ek (1664/1729, yalniz GET + /v2/shipping-rates)
        if: env.MOD == 'ek'
        run: |
          set -o pipefail
          python3 -I main/scripts/printful/ornament_katalog.py ek s/docs/ornament/ham 2>&1 | sed -u "s|${PRINTFUL_TOKEN}|***|g" | tee s/docs/ornament/KOSU_LOG_EK.txt
          k=${PIPESTATUS[0]}; echo "::notice::ek cikis $k | $(grep '^EK ISTEK' s/docs/ornament/KOSU_LOG_EK.txt)"; exit $k
      - name: Rapor + dogrulama
        if: always() && env.MOD != 'zemin3' && env.MOD != 'ornek' && env.MOD != 'ornek2' && env.MOD != 'ornek3'
        run: |
          set -o pipefail
          cd s/docs/ornament
          python3 -I "$GITHUB_WORKSPACE/main/scripts/printful/ornament_katalog.py" rapor . 2>&1 | tee -a KOSU_LOG.txt; r=${PIPESTATUS[0]}
          python3 -I "$GITHUB_WORKSPACE/main/scripts/printful/ornament_dogrula.py" . 2>&1 | tee DOGRULAMA.txt | tail -30; d=${PIPESTATUS[0]}
          echo "::notice::rapor $r | $(tail -1 DOGRULAMA.txt)"
          cat PRINTFUL_ORNAMENT.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          [ $r = 0 ] && [ $d = 0 ]
      - name: Drive + dal (token kontrolu)
        if: always() && env.MOD != 'zemin3' && env.MOD != 'ornek' && env.MOD != 'ornek2' && env.MOD != 'ornek3'
        run: |
          set -euo pipefail
          cd s
          [ -d docs/ornament/ham ] || { echo "::error::yazilacak cikti yok"; exit 1; }
          if [ -n "${PRINTFUL_TOKEN:-}" ] && grep -rlF "$PRINTFUL_TOKEN" docs/ornament; then echo "::error::DUR: ciktida token, yazilmadi"; exit 1; fi
          if grep -rlE "Bearer [A-Za-z0-9]" docs/ornament; then echo "::error::DUR: ciktida Bearer, yazilmadi"; exit 1; fi
          rclone copy docs/ornament "$DRIVE" -q
          echo "::notice::Drive: TEMP/ORNAMENT_PRINTFUL_20261102 ($(find docs/ornament -type f | wc -l) dosya)"
          git config user.name "astrolove-bot"; git config user.email "astrolove-bot@users.noreply.github.com"
          git add -A docs/ornament
          DIS=$(git diff --cached --name-only | grep -v '^docs/ornament/' || true)
          [ -z "$DIS" ] || { echo "::error::docs/ornament disi degisiklik: $DIS"; exit 1; }
          git diff --cached --quiet && { echo "::notice::dalda degisiklik yok"; exit 0; }
          git commit -qm "ornament printful katalog ($MOD): kosu ${GITHUB_RUN_ID}"
          git push -q origin "HEAD:${DAL}"
          echo "::notice::dal ${DAL} commit $(git rev-parse --short HEAD)"
      - if: always()
        run: rm -rf ~/.config/rclone

name: pw-ru-fill

# Pure White dijital ilanlarina RU cevirisi (Mo 8 Eyl 2026). Kaynak: ayni ciftin CANLI
# Champagne Ivory ilanindaki RU cevirisi; baslikta edisyon adi donusur, govde ve 13 etiket
# birebir kopyalanir. Yeni ceviri URETILMEZ. Yalniz RU yazilir, EN'e dokunulmaz.
# Kaynak/cikti dogrulamasi saglanmayan ilan ATLANIR (kalinti taramasi: Latin + Kiril).
# apply=false (varsayilan) yalniz dry-run + ornek uretir. dry_limit kota tasarrufu icindir.
# NOT: cron "2 0 * * *" TEK SEFERLIK (9 Eyl 2026, 00:02 UTC) — Etsy kotasi sifirlandiktan hemen
# sonra 78 PW ilaninin tam kosusu (schedule ile apply=true, limit=0, dry_limit=3).
# Kosu bitince bu schedule blogu KALDIRILIR.

on:
  schedule:
    - cron: "2 0 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "true = dry-run temizse Etsy'ye YAZ (onay gerekir)"
        type: boolean
        default: false
      limit:
        description: "En fazla N ilan (0 = hepsi)"
        required: false
        default: "3"
      dry_limit:
        description: "Dry-run kapisi icin N ilan (bos = limit ile ayni)"
        required: false
        default: ""
      quota_min:
        description: "Kota tabani"
        required: false
        default: "400"

concurrency:
  group: etsy-token
  cancel-in-progress: false

jobs:
  pwru:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # schedule ile tetiklenirse: apply=true, limit=0 (tum ilanlar), dry-run kapisi 3 ilan
      APPLY: ${{ inputs.apply || github.event_name == 'schedule' }}
      LIMIT: ${{ inputs.limit || '0' }}
      DRYLIMIT: ${{ inputs.dry_limit || (github.event_name == 'schedule' && '3') || inputs.limit || '0' }}
      QMIN: ${{ inputs.quota_min || '400' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
      - name: Token ve STATE
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
          rclone copyto "gdrive:ASTROLOVE/TEMP/POD_LISTING/POD_LISTINGS_STATE.csv" _work/pod_state.csv
          rclone copyto "gdrive:ASTROLOVE/TEMP/POD_LISTING/PW_RU_STATE.csv" _work/pwru.csv 2>/dev/null || echo "PW_RU STATE yok; yeni baslar"
      - name: 'ADIM 1 - dry-run'
        id: dry
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          set -euo pipefail
          python scripts/etsy/pw_ru_fill.py --pod-state _work/pod_state.csv --state _work/pwru.csv \
            --out _out/dry --limit "$DRYLIMIT" --quota-min "$QMIN" --dry-run
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d = json.load(open("_out/dry/pw_ru_result.json"))
          bad = [r for r in d["rows"] if r[2] in ("FAIL", "SIRA DISI", "ATLANDI")]
          hazir = [r for r in d["rows"] if r[2] == "HAZIR"]
          print(f"ok={'true' if hazir and not bad else 'false'}")
          print(f"ozet={len(hazir)} yazilacak, {len(bad)} sorunlu, kalan {d['kalan']}")
          PY
      - name: 'ADIM 2 - apply (yalniz onayla ve dry-run temizse)'
        if: ${{ env.APPLY == 'true' && steps.dry.outputs.ok == 'true' }}
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          set -euo pipefail
          echo "::warning::APPLY: Pure White ilanlarina RU cevirisi yazilacak — ${{ steps.dry.outputs.ozet }}"
          python scripts/etsy/pw_ru_fill.py --pod-state _work/pod_state.csv --state _work/pwru.csv \
            --out _out/apply --limit "$LIMIT" --quota-min "$QMIN" --apply
      - name: Token/STATE/cikti Drive'a
        if: ${{ always() }}
        run: |
          set -euo pipefail
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "Token geri yazildi" || true
          [ -s _work/pwru.csv ] && rclone copyto _work/pwru.csv "gdrive:ASTROLOVE/TEMP/POD_LISTING/PW_RU_STATE.csv" && echo "PW_RU STATE yazildi" || true
          stamp=$(TZ=Europe/Istanbul date +%Y%m%d_%H%M)
          [ -d _out ] && rclone copy _out "gdrive:ASTROLOVE/TEMP/POD_LISTING/PW_RU_${stamp}" -q && echo "Cikti: TEMP/POD_LISTING/PW_RU_${stamp}/"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: pw-ru-fill
          path: _out/
          if-no-files-found: ignore
      - if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

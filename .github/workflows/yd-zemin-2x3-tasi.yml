name: yd-zemin-2x3-tasi
# YD buyuk boy: Merkez'in Canva'da urettigi 3 yeni 2:3 zemin dokusunu (Timeless, FirstPage, Botanical) Drive TEMP/YD_ZEMIN_YENI/'ye tasir.
# Girdi: Drive TSV (ad, url) dosya id ile; imzali URL loga yazilmaz. Kapi: PNG, 2400x3600. Etsy yok, Canva API yok.
# Yalniz yd-zemin-tasi dalina push ile calisir (main'e girmez).
on:
  push:
    branches: [yd-zemin-tasi]
    paths: [.github/workflows/yd-zemin-2x3-tasi.yml]
permissions:
  contents: read
jobs:
  tasi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TSV_ID: 159swqt6Di8DWBcTPeJM2mq83R6khZAKR
      HEDEF: gdrive:ASTROLOVE/TEMP/YD_ZEMIN_YENI
    steps:
      - name: rclone
        run: curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || { sudo apt-get install -y -qq rclone >/dev/null; }
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Indir + kontrol + Drive
        run: |
          set -euo pipefail
          umask 077; mkdir -p _w _o
          rclone backend copyid gdrive: "$TSV_ID" _w/girdi.tsv -q
          N=0
          while IFS=$'\t' read -r AD URL; do
            [ "$AD" = ad ] && continue
            [[ "$AD" =~ ^[0-9]_[A-Za-z]+_2x3_kaynak\.png$ ]] || { echo "::error::ad $AD"; exit 1; }
            echo "::add-mask::$URL"
            curl -fsS --retry 3 -o "_o/$AD" "$URL" || { echo "::error::indirilemedi $AD"; exit 1; }
            python3 -c "import struct,sys; d=open(sys.argv[1],'rb').read(32); assert d[:8]==b'\x89PNG\r\n\x1a\n', 'PNG degil'; w,h=struct.unpack('>II', d[16:24]); print(sys.argv[1], w, h); assert (w,h)==(2400,3600), (w,h)" "_o/$AD"
            sha256sum "_o/$AD" | awk '{print $1}' > "_o/$AD.sha256.txt"
            N=$((N+1))
          done < _w/girdi.tsv
          [ "$N" = 3 ] || { echo "::error::3 dosya beklenir, $N"; exit 1; }
          rclone copy _o "$HEDEF" --immutable -q
          echo "Drive: TEMP/YD_ZEMIN_YENI ($N dosya)" | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: rm -rf _w _o ~/.config/rclone

name: yd-kapak-yedek
# YD (1st Anniversary) 78 ilan galeri yedegi (plan v3 adim 5; Merkez 27 Eki). ETSY API YOK, Etsy'ye yazma yok, Etsy kilidi yok.
# KOSTURMA yalniz Merkez onayiyla. Girdi: Drive TEMP/<envanter>/HAM/<listing_id>.json (yd-envanter-oku; url_fullxfull) + data/pod/yd78_ids.csv.
# 78 x 13 gorsel etsystatic CDN'den -> Drive TEMP/YD_KAPAK_V1_YEDEK/<damga>/<listing_id>_<CIFT>/r<rank>_<id>.jpg + GALERI.json,
# OZET.md (ilan basina 13 dosya, boyut = JSON), BAGLAR.csv. Yeni klasor, --immutable. scripts/kapak78/yd_yedek.py
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      envanter: {description: "TEMP altindaki envanter klasoru (HAM/ iceren)", required: true, default: "YD_ENVANTER_20261026"}
jobs:
  yedek:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Girdi kapisi
        env: {EN: "${{ inputs.envanter }}"}
        run: '[[ "$EN" =~ ^YD_ENVANTER_[0-9]{8}(_[0-9]{6})?$ ]] || { echo "::error::girdi"; exit 1; }'
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q pillow==11.0.0 numpy==2.1.3 requests==2.34.2
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || { sudo apt-get install -y -qq rclone >/dev/null; }
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: HAM (Drive)
        env: {EN: "${{ inputs.envanter }}"}
        run: |
          set -euo pipefail
          mkdir -p _work/HAM
          rclone copy "gdrive:ASTROLOVE/TEMP/$EN/HAM" _work/HAM --include "*.json" --max-depth 1 --transfers 8 -q
          echo "HAM: $(ls _work/HAM | wc -l) json"
          echo "DAMGA=$(date -u +%Y%m%d_%H%M%S)" >> "$GITHUB_ENV"
      - name: Yedek + kontrol (CDN; Etsy API yok)
        run: python3 scripts/kapak78/yd_yedek.py --ham-dir _work/HAM --ciftler data/pod/yd78_ids.csv --out _out
      - name: Drive'a yaz
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if ls _out/* >/dev/null 2>&1; then
            rclone copy _out "gdrive:ASTROLOVE/TEMP/YD_KAPAK_V1_YEDEK/${DAMGA:?}" --immutable --transfers 8 -q
            echo "Cikti: TEMP/YD_KAPAK_V1_YEDEK/${DAMGA}"
            [ -f _out/OZET.md ] && head -4 _out/OZET.md >> "$GITHUB_STEP_SUMMARY" || true
          fi
      - if: always()
        run: rm -rf _work _out ~/.config/rclone

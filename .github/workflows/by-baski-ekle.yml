name: by-baski-ekle
run-name: "by-baski-ekle ${{ inputs.mod }} ${{ inputs.ilanlar || 'hepsi' }}"

# Serdar onayi 24 Eki 2026 (Genel Merkez): yil donumu (bolum 60895624) ilanlarina "Shipped print 8x10" $29 + baski ayarlari
# (v2: hazirlik 4-7 gun, uretim ortagi 5817638, materials, SKU; kargo: baski profili 318080539024, secenek B her yere ucretsiz).
# oku = plan (yazma yok); yaz = BASKI_EKLE (tek/liste), ilanlar bos = 78 ilan icin BASKI_EKLE_HEPSI.
# Cikti: Drive TEMP/BY_BASKI_EKLE/<kosu>/

permissions:
  actions: read
  contents: read

on:
  workflow_dispatch:
    inputs:
      mod:
        description: "oku | yaz | profil_oku | profil_yaz"
        required: true
        default: "oku"
      ilanlar:
        description: "virgullu ilan id (bos = 78 ilan)"
        default: ""
      onay:
        description: "yaz: BASKI_EKLE (ilanlar bos: BASKI_EKLE_HEPSI); profil_yaz: PROFIL_UCRETSIZ"
        default: ""

jobs:
  baski:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Baski ekle (${{ inputs.mod }})
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          MOD: ${{ inputs.mod }}
          ILANLAR: ${{ inputs.ilanlar }}
          ONAY: ${{ inputs.onay }}
        run: |
          set -euo pipefail
          case "$MOD" in oku|yaz|profil_oku|profil_yaz) ;; *) echo "HATA: mod $MOD"; exit 1;; esac
          if [ "$MOD" = profil_yaz ] && [ "$ONAY" != PROFIL_UCRETSIZ ]; then echo "HATA: onay PROFIL_UCRETSIZ degil"; exit 1; fi
          if [ "$MOD" = yaz ]; then
            if [ -n "$ILANLAR" ]; then [ "$ONAY" = BASKI_EKLE ] || { echo "HATA: onay BASKI_EKLE degil"; exit 1; }
            else [ "$ONAY" = BASKI_EKLE_HEPSI ] || { echo "HATA: 78 ilan icin onay BASKI_EKLE_HEPSI"; exit 1; }; fi
          fi
          umask 077; mkdir -p _work
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
          if [ -n "$ILANLAR" ]; then SEC=(--ilanlar "$ILANLAR"); else SEC=(--hepsi); fi
          case "$MOD" in profil_*) SEC=();; esac
          T="gdrive:ASTROLOVE/TEMP/BY_BASKI_EKLE/TAMAM.txt"
          rclone copyto "$T" _work/tamam.txt 2>/dev/null || : > _work/tamam.txt
          rc=0; python scripts/etsy/by_baski_ekle.py "$MOD" ${SEC[@]+"${SEC[@]}"} --confirm "$ONAY" --tamam _work/tamam.txt || rc=$?
          if [ -d out ]; then
            python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/ETSY_TOKEN.json out || { echo "::error::ciktida sir"; exit 1; }
            rclone copy out "gdrive:ASTROLOVE/TEMP/BY_BASKI_EKLE/${GITHUB_RUN_ID}" -q || { echo "::error::Drive yukleme basarisiz"; exit 1; }
          fi
          if [ "$MOD" = yaz ] && [ -s out/TAMAM_EK.txt ]; then
            { cat _work/tamam.txt out/TAMAM_EK.txt | grep -E '^[0-9]+$' || true; } | sort -u > _work/tamam_yeni.txt
            rclone copyto _work/tamam_yeni.txt "$T" -q || { echo "::error::TAMAM listesi yazilamadi"; exit 1; }
          fi
          exit $rc
      - name: Token geri yaz
        if: always()
        run: |
          if [ -f _work/ETSY_TOKEN.json.updated ]; then
            rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "token geri yazildi" \
              || { echo "::error::yenilenen token Drive'a geri yazilamadi"; exit 1; }
          else
            echo "token yenilenmedi"
          fi
      - if: always()
        run: rm -rf _work out ~/.config/rclone

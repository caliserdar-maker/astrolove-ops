name: wp-kisisel-ornek

# Duvar kagidi kisisellestirme ORNEGI (Serdar 25 Eyl 2026).
# ETSY ERISIMI YOK. Drive'da yalniz TEMP/DIJITAL_78/WALLPAPER_ORNEK/ altina yazar.
# Kaynak: WALLPAPER/DELIVERY_SAAT80/<CIFT>/*.zip (salt okur). Saat dosyasina DOKUNULMAZ.

on:
  push:
    branches: [dijital-v1]
    paths:
      - 'config/wp_kisisel.trigger'

concurrency:
  group: wp-kisisel
  cancel-in-progress: false

permissions:
  contents: read

env:
  KAYNAK: "gdrive:ASTROLOVE/WALLPAPER/DELIVERY_SAAT80"
  CIKTI: "gdrive:ASTROLOVE/TEMP/DIJITAL_78/WALLPAPER_ORNEK"
  ISIMLER: "EMILY,JAMES"
  MESAJ: "It Began With a Kiss in the Rain"

jobs:
  ornek:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bagimliliklar
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade pip
          python -m pip install -q pillow==12.3.0 numpy==2.4.6 opencv-python-headless scipy
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          rclone version > _rc.txt 2>&1 || true; sed -n 1p _rc.txt; rm -f _rc.txt
          command -v rclone unzip

      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi

      - name: kisisel-v1 render kodu (degistirilmez)
        run: |
          set -euo pipefail
          git fetch --depth 1 origin kisisel-v1
          mkdir -p _kis
          git archive FETCH_HEAD scripts/kisisel assets | tar -x -C _kis
          ls _kis/assets/fonts/Cinzel.ttf _kis/assets/fonts/EBGaramond-Italic.ttf

      - name: Kaynak duvar kagitlari (salt okur)
        if: ${{ !contains(github.event.head_commit.message, '[rapor]') && !contains(github.event.head_commit.message, '[v2]') }}
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          mkdir -p _zip _wp/ARIES_LEO _wp/AQUARIUS_AQUARIUS
          case "$MSG" in
            *"[eksik3]"*)
              # Serdar onayi 25 Eyl 2026: yalnizca ilk kosuda olcum hatasi veren
              # 3 dosya yeniden uretilir; digerleri Drive'da oldugu gibi kalir.
              echo "EKSIK3 modu"; echo "eksik3" > _mod
              rclone copy "$KAYNAK/ARIES_LEO/AstroLove_Aries_Leo_Champagne_Ivory.zip" _zip -q
              rclone copy "$KAYNAK/ARIES_LEO/AstroLove_Aries_Leo_Deep_Black.zip" _zip -q
              rclone copy "$KAYNAK/ARIES_LEO/AstroLove_Aries_Leo_Warm_Parchment.zip" _zip -q
              unzip -o -j -q _zip/AstroLove_Aries_Leo_Champagne_Ivory.zip '*Phone.jpg' -d _wp/ARIES_LEO
              unzip -o -j -q _zip/AstroLove_Aries_Leo_Deep_Black.zip '*Desktop.jpg' -d _wp/ARIES_LEO
              unzip -o -j -q _zip/AstroLove_Aries_Leo_Warm_Parchment.zip '*Desktop.jpg' -d _wp/ARIES_LEO
              rmdir _wp/AQUARIUS_AQUARIUS
              ;;
            *)
              case "$MSG" in *"[son]"*) echo "SON modu: onceki ciktilar da indirilir"
                mkdir -p _eski
                rclone copy "$CIKTI" _eski -q --include "*/AstroLove*.jpg"
                echo "_eski: $(find _eski -name '*.jpg' | wc -l) dosya" ;;
              esac
              for e in Midnight_Blue Deep_Black Champagne_Ivory Warm_Parchment; do
                rclone copy "$KAYNAK/ARIES_LEO/AstroLove_Aries_Leo_$e.zip" _zip -q
              done
              rclone copy "$KAYNAK/AQUARIUS_AQUARIUS/AstroLove_Aquarius_Aquarius_Midnight_Blue.zip" _zip/aqua -q
              for z in _zip/*.zip; do
                unzip -o -j -q "$z" '*Phone.jpg' '*Tablet.jpg' '*Desktop.jpg' -d _wp/ARIES_LEO
              done
              unzip -o -j -q _zip/aqua/*.zip '*Phone.jpg' -d _wp/AQUARIUS_AQUARIUS
              ;;
          esac
          ls _wp/ARIES_LEO | sed 's/^/  - /'
          du -sh _wp

      - name: Uretim + kapilar
        if: ${{ !contains(github.event.head_commit.message, '[rapor]') && !contains(github.event.head_commit.message, '[v2]') }}
        run: |
          set -euo pipefail
          RAPOR=WP_KISISEL_RAPOR.json
          [ -f _mod ] && RAPOR=WP_KISISEL_RAPOR_EKSIK3.json
          ESKI=""
          [ -d _eski ] && ESKI="--eski _eski"
          python scripts/wp_kisisel/uret.py --girdi _wp --cikti _out \
            --kisisel _kis --isimler "$ISIMLER" --mesaj "$MESAJ" --rapor "$RAPOR" $ESKI

      - name: V2 - temiz plaka + poster murekkebi ([v2] uretim / [olcum] yalniz 1. asama)
        if: ${{ contains(github.event.head_commit.message, '[v2]') || contains(github.event.head_commit.message, '[olcum]') }}
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          mkdir -p _v2/posterler _v2/plakalar _v2/temiz _v2/orijinal
          for E in MIDNIGHT_BLUE DEEP_BLACK CHAMPAGNE_IVORY WARM_PARCHMENT; do
            rclone copy "gdrive:ASTROLOVE/WALL_ART/POSTERS/OPTIMIZED_FOR_PRODUCTION/$E/3X4/WA_POSTER_ARIES_LEO_${E}_3X4.jpg" _v2/posterler -q
          done
          rclone copy "gdrive:ASTROLOVE/TEMP/WP_PLATES" _v2/plakalar -q --include "MEDIAN_*.png" --include "GEOM_*.json" --max-depth 1
          rclone copy "gdrive:ASTROLOVE/TEMP/WP_PLATES/CLEAN" _v2/temiz -q --include "PLATE_*_CLEAN.png"
          rclone copy "gdrive:ASTROLOVE/WALLPAPER/FINAL_V2/ARIES_LEO" _v2/orijinal -q --include "AstroLove_*.jpg"
          echo "poster $(ls _v2/posterler | wc -l) | plaka $(ls _v2/plakalar | wc -l) | temiz $(ls _v2/temiz | wc -l) | orijinal $(ls _v2/orijinal | wc -l)"
          free -g | head -2; df -h / | tail -1
          mkdir -p _out2
          EK=""
          case "$MSG" in *"[olcum]"*) EK="--sadece-olcum";; *) cp docs/operations/WP_V2_HATA_27_DURUM.md _out2/;; esac
          python scripts/wp_kisisel/wp_v2.py --posterler _v2/posterler --plakalar _v2/plakalar \
            --temiz _v2/temiz --orijinal _v2/orijinal --kisisel _kis --cikti _out2 \
            --cift Aries_Leo --isimler "$ISIMLER" --mesaj "$MESAJ" $EK

      - name: V2 Drive'a yaz (yalniz [v2]; [olcum] Drive'a yazmaz)
        if: ${{ always() && contains(github.event.head_commit.message, '[v2]') }}
        run: |
          set -euo pipefail
          [ -d _out2 ] || exit 0
          rclone copy _out2 "gdrive:ASTROLOVE/TEMP/DIJITAL_78/WALLPAPER_ORNEK_V2" -q
          echo "WALLPAPER_ORNEK_V2 (dosya | bayt | Drive id)"
          rclone lsf "gdrive:ASTROLOVE/TEMP/DIJITAL_78/WALLPAPER_ORNEK_V2" --format "psi" --separator " | " --files-only | sed 's/^/  - /'

      - name: Rapor birlestir (yalniz [rapor])
        if: ${{ contains(github.event.head_commit.message, '[rapor]') }}
        run: |
          set -euo pipefail
          mkdir -p _rap
          rclone copy "$CIKTI/WP_KISISEL_RAPOR.json" _rap -q
          rclone copy "$CIKTI/WP_KISISEL_RAPOR_EKSIK3.json" _rap -q
          python scripts/wp_kisisel/rapor_birlestir.py _rap
          rclone copyto _rap/WP_KISISEL_RAPOR.json "$CIKTI/WP_KISISEL_RAPOR.json" -q
          rclone deletefile "$CIKTI/WP_KISISEL_RAPOR_EKSIK3.json" || true
          rclone lsf "$CIKTI" --format "psi" --separator " | " --files-only | sed 's/^/  - /'

      - name: Drive'a yaz
        if: ${{ always() }}
        run: |
          set -euo pipefail
          [ -d _out ] || exit 0
          rclone copy _out "$CIKTI" -q
          echo "WALLPAPER_ORNEK (dosya | bayt | Drive id)"
          rclone lsf "$CIKTI" --format "psi" --separator " | " --files-only -R | sed 's/^/  - /'

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: wp-kisisel-ornek
          path: |
            _out/
            _out2/
          if-no-files-found: ignore

      - if: ${{ always() }}
        run: rm -rf _zip _wp _eski _v2 ~/.config/rclone

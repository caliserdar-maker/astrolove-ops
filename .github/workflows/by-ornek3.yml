name: by-ornek3
# 1st Anniversary Starlit 12x18 ORNEK 3 (Merkez 31 Eki; Serdar karari a: yeni yuksek cozunurluklu zemin). ETSY YOK. scripts/siparis_by/by_ornek3.py:
# Canva 2:3 doku (Drive TEMP/YD_ZEMIN_YENI/1_Starlit_2x3_kaynak.png, sha256 kapisi) -> Real-ESRGAN x2plus (resmi agirlik, sha256 kapisi;
# YALNIZ zemin) -> esit olcek 3600x5400 + kodla cerceve / yay + 8x10'dan tepe yildizi + by_poster ogeleri (esit olcek, dikeyde ortali);
# yaninda ayni ayarlarla 8x10. Cikti Drive TEMP/YD_BOY_ORNEK3/<damga>/.
# DAL yd-stil4 (Denetim 20261101F): bu dalda is akisi kalan 4 stilin 12x18 ORNEGINI uretir (scripts/siparis_by/by_stil4.py):
# Timeless / FirstPage / Botanical yeni Canva 2:3 dokular (TEMP/YD_ZEMIN_YENI, sha256 kapisi) + Layers A/B. Cikti TEMP/YD_STIL4_ORNEK/<damga>/.
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      pair: {description: "cift", required: true, default: "CANCER_LIBRA"}
      n1: {description: "isim 1", required: true, default: "EMMA"}
      n2: {description: "isim 2", required: true, default: "JAMES"}
jobs:
  ornek:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      KOD_REF: e3d168cef6821d0bd6b6ae5b4dfba503025c5753   # by-boy-ornek2 / by-zemin-8x10 ile ayni
      SHA_T: 2af9fb94c19fc30d23e697f721d07e7b9674e46ee4da36ef18aa993c79de3759   # 2_Timeless_2x3_kaynak.png (.sha256.txt, kosu 41298943459)
      SHA_F: 93e5d7f6d622cfb01e8afe2481cef8443bb7ef9605101ad2e4a912ae60b749c2   # 3_FirstPage_2x3_kaynak.png
      SHA_B: 7a68c2b76d481a4c715b2aa8599651f375b14b84678345ca82c05ecaafdf96b0   # 5_Botanical_2x3_kaynak.png
      ESRGAN_SHA: 49fafd45f8fd7aa8d31ab2a22d14d91b536c34494a5cfe31eb5d89c2fa266abb
    steps:
      - name: Girdi kapisi
        env: {P: "${{ inputs.pair }}", A: "${{ inputs.n1 }}", B: "${{ inputs.n2 }}"}
        run: '[[ "$P" =~ ^[A-Z]+_[A-Z]+$ && "$A" =~ ^[A-Z]{1,11}$ && "$B" =~ ^[A-Z]{1,11}$ ]] || { echo "::error::girdi"; exit 1; }'
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: Kod
        run: |
          set -euo pipefail
          git fetch -q --depth 1 origin "$KOD_REF"
          git worktree add -q _kod FETCH_HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kurulum
        run: |
          set -euo pipefail
          pip install -q torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q spandrel==0.4.1 numpy==2.5.3 opencv-python-headless==5.0.0.93 pillow==12.3.0 fonttools==4.60.1
          python3 -c "from PIL import features; import sys; sys.exit(0 if features.check('raqm') else 1)"
          curl -fsSL --retry 3 -o _x2plus.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.1/RealESRGAN_x2plus.pth
          echo "$ESRGAN_SHA  _x2plus.pth" | sha256sum -c -
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || { sudo apt-get install -y -qq rclone >/dev/null; }
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Stil4 ornek
        env: {P: "${{ inputs.pair }}", A: "${{ inputs.n1 }}", B: "${{ inputs.n2 }}"}
        run: |
          set -uo pipefail
          echo "DAMGA=$(date -u +%Y%m%d_%H%M%S)" >> "$GITHUB_ENV"
          mkdir -p _o _doku
          for f in "2_Timeless:$SHA_T" "3_FirstPage:$SHA_F" "5_Botanical:$SHA_B"; do
            n="${f%%:*}_2x3_kaynak.png"
            rclone copyto "gdrive:ASTROLOVE/TEMP/YD_ZEMIN_YENI/$n" "_doku/$n" -q || { echo "::error::$n indirilemedi"; echo "KOD=1" >> "$GITHUB_ENV"; exit 0; }
            echo "${f#*:}  _doku/$n" | sha256sum -c - >> _o/ZEMIN_SHA.txt 2>&1 || { cat _o/ZEMIN_SHA.txt; echo "KOD=1" >> "$GITHUB_ENV"; exit 0; }
          done
          { grep -m1 "model name" /proc/cpuinfo; nproc; python3 -c "import torch; print('torch', torch.__version__)"; } > _o/MAKINE.txt
          BY_SCALE=2 python3 scripts/siparis_by/by_stil4.py --kod _kod --doku-dizin _doku --esrgan _x2plus.pth --out _o \
            --pair "$P" --n1 "$A" --n2 "$B" > _o/LOG.txt 2>&1
          echo "KOD=$?" >> "$GITHUB_ENV"
          tail -25 _o/LOG.txt
      - name: Drive'a yaz
        if: always()
        run: |
          set -euo pipefail
          if ls _o/* >/dev/null 2>&1; then
            rclone copy _o "gdrive:ASTROLOVE/TEMP/YD_STIL4_ORNEK/${DAMGA:?}" --immutable -q
            echo "::notice title=YD STIL4::TEMP/YD_STIL4_ORNEK/${DAMGA}/"
          fi
          [ "${KOD:-1}" = 0 ] || { echo "::error::by_stil4 hata (LOG.txt)"; exit 1; }
      - if: always()
        run: rm -rf _o _doku ~/.config/rclone

name: kupa-pin-ornek
# Kupa pini ORNEK (20 Eki 2026, deneme 3; Merkez secenek (a), Serdar onayli): yalniz CANCER_LIBRA, toplu uretim yok.
# Metricool / Etsy / Pinterest'e yazma yok. Girdi: Drive KUPA_KAPAK_78_20261019/KAPAK/<lid>_CANCER_LIBRA.jpg,
# kupa-orchard dali varlik/sahne/orange_k40.png + Cinzel[wght].ttf. Cikti: Drive ASTROLOVE/TEMP/KUPA_PIN_ORNEK_20261020/.
permissions:
  contents: read
on:
  workflow_dispatch:
jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      O: gdrive:ASTROLOVE/TEMP/KUPA_PIN_ORNEK_20261020
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: kupa-orchard
          path: _ko
          sparse-checkout: kupa_orchard/varlik
      - name: rclone
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          mkdir -p ~/.config/rclone _work _out; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Uret + olc
        run: |
          set -euo pipefail
          pip install -q pillow numpy >/dev/null 2>&1
          rclone copy "gdrive:ASTROLOVE/TEMP/KUPA_KAPAK_78_20261019/KAPAK" _work --include "*_CANCER_LIBRA.jpg" -q
          ls _work/*_CANCER_LIBRA.jpg | tee /dev/stderr | wc -l | grep -qx 1 || { echo "::error::CANCER_LIBRA kapagi tek degil"; exit 1; }
          K=$(ls _work/*_CANCER_LIBRA.jpg)
          set +e
          python3 scripts/sosyal/kupa_pin_ornek.py "$K" _ko/kupa_orchard/varlik/sahne/orange_k40.png "_ko/kupa_orchard/varlik/font/Cinzel[wght].ttf" _out \
            | tee -a "$GITHUB_STEP_SUMMARY"
          rc=${PIPESTATUS[0]}
          set -e
          sha256sum _out/PIN_KUPA_CANCER_LIBRA.jpg "$K"
          rclone copy _out "$O" -q
          rclone lsl "$O"
          exit $rc
      - if: always()
        run: rm -rf _work ~/.config/rclone

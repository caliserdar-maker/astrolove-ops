name: by-siparis-ornek
# BIZIM YILIMIZ musteri dosyasi (14 Eki 2026, Serdar onayi). ELLE baslatilir. Etsy'ye yazma YOK, musteriye gonderim YOK.
# tur=ONIZLEME: 1000 px + "AstroLoveArt PREVIEW" filigrani (tam dosya Drive'a gitmez). tur=NIHAI: tam 300 dpi dosya.
# Kod: bizim-yilimiz-v3 sabit commit (KOD_REF); sarmalayici scripts/siparis_by/by_siparis.py (main).
# Cikti: Drive ASTROLOVE/SIPARIS_ISIM/BIZIM_YILIMIZ/<siparis_no | ONIZLEME_YYYYMMDD_ISIM1_ISIM2>/
# Repo herkese acik: isim/tarih/satir ilk adimda maskelenir (loga acik yazilmaz).
run-name: by-siparis ${{ inputs.tur }} ${{ inputs.pair }} stil ${{ inputs.style }} ${{ inputs.format }} ${{ inputs.boy }}
on:
  workflow_dispatch:
    inputs:
      tur: { description: "ONIZLEME (filigranli 1000 px) | NIHAI (tam 300 dpi)", type: choice, options: [ONIZLEME, NIHAI], default: ONIZLEME }
      siparis_no: { description: "Etsy receipt (yalniz rakam; ONIZLEME'de bos)", required: false, default: "" }
      pair: { description: "Cift, alfabetik (orn. CANCER_LIBRA)", required: true }
      name1: { description: "Ilk burcun ismi (solda), en fazla 11", required: true }
      name2: { description: "Ikinci burcun ismi (sagda), en fazla 11", required: true }
      date: { description: "Tarih (orn. 12 JUNE 2025)", required: true }
      heading: { description: "Poster basligi (kartta her zaman Happy First Anniversary)", type: choice, options: ["Paper Anniversary", "Our First Year"], default: "Paper Anniversary" }
      line: { description: "Kisa satir, en fazla 20 (bos = YEAR ONE)", required: false, default: "" }
      style: { description: "1 Starlit | 2 Timeless | 3 First Page | 4 Layers | 5 Botanical", type: choice, options: ["1", "2", "3", "4", "5"], default: "1" }
      format: { description: "poster 8x10 | kart 5x7 | ikisi (boy verilirse poster)", type: choice, options: [poster, kart, ikisi], default: ikisi }
      boy: { description: "yeni yapi boyu (Serdar 31 Eki 2a): bos = eski 8x10/5x7; 5x7 8x10 11x14 12x16 12x18 16x20 16x24 18x24 20x30 24x30 24x36 A4 A3 A2", type: choice, options: ["", "5x7", "8x10", "11x14", "12x16", "12x18", "16x20", "16x24", "18x24", "20x30", "24x30", "24x36", "A4", "A3", "A2"], default: "" }
permissions:
  contents: read
concurrency:            # ayni anda tek kosu (14 Eki: paralel iki kosu ayni Drive klasorunu iki kez acti); iptal yok, sira
  group: by-siparis
  cancel-in-progress: false
jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KOD_REF: e3d168cef6821d0bd6b6ae5b4dfba503025c5753   # bizim-yilimiz-v3 (latin-ext + kart LINE); kod degisince guncellenir
    steps:
      - name: Musteri metnini maskele
        run: |
          python3 - <<'EOF'
          import json, os, unicodedata
          i = json.load(open(os.environ['GITHUB_EVENT_PATH'])).get('inputs') or {}
          def asc(s):   # klasor adindaki bicim (by_siparis.ascii_ad)
              s = s.replace('ı', 'i').replace('İ', 'I')
              s = ''.join(c for c in unicodedata.normalize('NFKD', s) if not unicodedata.combining(c))
              return ''.join(c if c.isalnum() else '_' for c in s).strip('_')
          for k in ('name1', 'name2', 'date', 'line'):
              v = ' '.join(str(i.get(k) or '').split())
              for s in {v, v.upper(), asc(v.upper())} - {''}:
                  print('::add-mask::' + s)
          EOF
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: Kod (bizim-yilimiz-v3 sabit commit)
        run: |
          set -euo pipefail
          git fetch -q --depth 1 origin "$KOD_REF"
          git worktree add -q _kod FETCH_HEAD
          echo "KOD $(git -C _kod rev-parse HEAD)"
      - name: Kurulum
        run: |
          set -euo pipefail
          pip install -q numpy==2.5.3 opencv-python-headless==5.0.0.93 pillow==12.3.0 fonttools==4.60.1
          python3 -c "from PIL import features; import sys; sys.exit(0 if features.check('raqm') else 1)"
          curl -fsSL -o /tmp/rc.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q -j /tmp/rc.zip '*/rclone' -d /tmp/rcb && sudo install -m 755 /tmp/rcb/rclone /usr/local/bin/rclone
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true; fi
      - name: Uret + kontrol (PASS/FAIL)
        env:
          TUR: ${{ inputs.tur }}
          SIPARIS_NO: ${{ inputs.siparis_no }}
          PAIR: ${{ inputs.pair }}
          NAME1: ${{ inputs.name1 }}
          NAME2: ${{ inputs.name2 }}
          DATE: ${{ inputs.date }}
          HEADING: ${{ inputs.heading }}
          LINE: ${{ inputs.line }}
          STYLE: ${{ inputs.style }}
          FORMAT: ${{ inputs.format }}
          BOY: ${{ inputs.boy }}
        run: |
          set -euo pipefail
          KOD=_kod KOD_SHA="$KOD_REF" CIKTI=_out python3 scripts/siparis_by/by_siparis.py
      - name: Drive'a yukle
        run: |
          set -euo pipefail
          K=$(cat _out/KLASOR.txt)
          D="gdrive:ASTROLOVE/SIPARIS_ISIM/BIZIM_YILIMIZ/$K"
          # Ayni anda TEK kosu: paralel iki kosu ayni adli Drive klasorunu iki kez acabilir (14 Eki testi)
          rclone copy "_out/$K" "$D" -q && rclone check "_out/$K" "$D" --one-way -q
          rclone lsjson "$D" | python3 -c "import json,sys;[print('DRIVE',d['Name'],d['Size'],'https://drive.google.com/file/d/'+d['ID']+'/view') for d in json.load(sys.stdin)]"
          echo "Drive: ASTROLOVE/SIPARIS_ISIM/BIZIM_YILIMIZ/$K"
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone _out

name: wp-kesit-a

# KARAR A (Serdar onayli 2 Eki) GORSEL ONAY: yeni plate denemesi YOK, PLATES'e yazma YOK.
# Uretim = WP_REF adayi (efdeb26, plate_adi) cift_boy; isimler Test 4: JAKOB / ZOFIA, "Perfectly Paired by Zodiac Kisses".
# Plate'ler TEMP'ten yerel plate onbellegine (_siparis/plates): 11x14 VINTAGE_B3 (kosu 37052384573), diger boylar
# VINTAGE_B_<boy> (kosu 37046187292). Kesit: onayli | yeni WP 1:1 (kagit penceresi, isim, mesaj/tagline bandi).
# Cikti yalniz Drive TEMP/WP_KESIT_A/<run_id>/. Etsy / musteri YOK. Tetik: config/wp_kesit_a.trigger (bu dal).

permissions:
  contents: read

on:
  push:
    branches: [claude/wp-katman-baski-60sk0s]
    paths:
      - config/wp_kesit_a.trigger

concurrency: wp-kesit-a

env:
  WP_REF_ADAY: efdeb2627113e1974ed53ae69d13dea3f965770f
  B11: gdrive:ASTROLOVE/TEMP/WP_PLATE_B/37052384573
  BDIGER: gdrive:ASTROLOVE/TEMP/WP_PLATE_B/37046187292
  CIK: gdrive:ASTROLOVE/TEMP/WP_KESIT_A/${{ github.run_id }}
  ISIM1: JAKOB
  ISIM2: ZOFIA
  MESAJ: Perfectly Paired by Zodiac Kisses

jobs:
  kesit:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - {cift: PISCES_SCORPIO, boy: 11x14}
          - {cift: PISCES_SCORPIO, boy: 16x20}
          - {cift: PISCES_SCORPIO, boy: 18x24}
          - {cift: PISCES_SCORPIO, boy: 24x36}
          - {cift: PISCES_SCORPIO, boy: A2}
          - {cift: SCORPIO_VIRGO, boy: 11x14}
    env:
      CIFT: ${{ matrix.cift }}
      BOY: ${{ matrix.boy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.WP_REF_ADAY }}
          path: ref
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python bagimliliklari
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pillow opencv-python-headless numpy fonttools img2pdf pikepdf
      - name: Kod + kilit (WP_REF adayi)
        run: git -C ref rev-parse HEAD && python ref/scripts/medya_v1/test_wp_kilit.py
      - name: Takas
        if: ${{ matrix.boy == '24x36' || matrix.boy == 'A2' }}
        run: |
          sudo fallocate -l 32G /mnt/takas6 && sudo chmod 600 /mnt/takas6 && sudo mkswap /mnt/takas6 >/dev/null && sudo swapon /mnt/takas6
          free -g
      - name: rclone kur
        run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONF_B64:-}" ]; then echo "HATA: RCLONE_CONF_B64 yok" >&2; exit 1; fi
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Plate (TEMP -> yerel onbellek; PLATES'e yazma yok) + onayli kaynak
        run: |
          set -euo pipefail
          T0=$(date +%s); mkdir -p _siparis/plates _onayli
          if [ "$BOY" = "11x14" ]; then AD=VINTAGE_B3_11x14.png; SRC="$B11/11x14/$AD"; else AD=VINTAGE_B_$BOY.png; SRC="$BDIGER/$BOY/$AD"; fi
          rclone copyto "$SRC" "_siparis/plates/$AD"
          rclone copyto "gdrive:ASTROLOVE/TEMP/POD_PRINT/$CIFT/WARM_PARCHMENT/$BOY.jpg" "_onayli/$BOY.jpg"
          echo "PLATE_AD=$AD" >> "$GITHUB_ENV"; md5sum "_siparis/plates/$AD"
          echo "SURE indir $(( $(date +%s) - T0 )) sn"
      - name: WP uretimi (uretimin cift_boy, Test 4 isimleri)
        run: |
          T0=$(date +%s)
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'ref/scripts/medya_v1')
          import siparis_dosyasi as sd
          import wp_ornek as wo
          c, boy = os.environ['CIFT'], os.environ['BOY']
          sd.kisisel_hazirla()
          P_ed, P_blue = sd.EdisyonPoster(), sd.BluePoster()
          no, _ = sd.sayfa_no_tablosu()
          ad = wo.plate_adi(c, no[c], boy)
          print('PLATE_ADI', c, no[c], boy, ad, flush=True)
          assert ad == os.environ['PLATE_AD'], (ad, os.environ['PLATE_AD'])
          cik = sd.W / 'WP_ORNEK' / c; cik.mkdir(parents=True, exist_ok=True)
          R, _ = wo.cift_boy(c, boy, P_ed, P_blue, no, cik, isim=(os.environ['ISIM1'], os.environ['ISIM2']),
                             mesaj=os.environ['MESAJ'])
          (cik / f'RAPOR_{boy}.json').write_text(json.dumps(R, ensure_ascii=False, indent=1, default=str))
          print('WPK', json.dumps({'cift': c, 'boy': boy, 'durum': R.get('durum'), 'gecti': R.get('gecti'),
                                   'plate_gecti': R.get('plate_gecti'), 'qc': R.get('qc')}, default=str), flush=True)
          PY
          echo "SURE uretim $(( $(date +%s) - T0 )) sn"
      - name: Kesit (onayli | WP, 1:1)
        run: |
          python scripts/medya_v1/plate_b.py kesit_a --cift "$CIFT" --boy "$BOY" --onayli "_onayli/$BOY.jpg" \
            --sonra "_siparis/WP_ORNEK/$CIFT" --plates "_siparis/plates/$PLATE_AD" --isim "$ISIM1 / $ISIM2" \
            --mesaj "$MESAJ" --cik out
      - name: Drive (TEMP)
        if: ${{ always() }}
        run: |
          D="$CIK/${CIFT}_$BOY"
          [ -d out ] && rclone copy out "$D/"
          for f in "WP_${CIFT}_${BOY}_BASKI.jpg" "RAPOR_${BOY}.json" "WP_${CIFT}_${BOY}_YANYANA.jpg"; do
            [ -f "_siparis/WP_ORNEK/$CIFT/$f" ] && rclone copyto "_siparis/WP_ORNEK/$CIFT/$f" "$D/$f"
          done
          echo "drive: TEMP/WP_KESIT_A/${{ github.run_id }}/${CIFT}_$BOY/"
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone

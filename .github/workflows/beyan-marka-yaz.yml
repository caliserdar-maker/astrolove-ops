name: beyan-marka-yaz

# AI beyani (EN aciklama) + marka adi (RU aciklama) - scripts/etsy/beyan_marka_yaz.py (Serdar 22 Eki: AI beyani karari, marka plani B).
# kuru: SALT OKUMA (234 aktif ilan sayimi + --ilan plani + istege bagli galeri gorsel indirme).
# yaz : ETSY'YE YAZAR, yalniz 1 ilan, onay SERDAR_BEYAN_PILOT (once 4570143815 -> geri okuma -> Merkez canli kontrol -> Serdar onayi).
# toplu: ETSY'YE YAZAR, tek aile, en fazla `limit` ilan, onay SERDAR_BEYAN_TOPLU (Serdar 23 Eki: once 10, DUR, Merkez kontrol).
#        Her ilanda kapi 1b (yedek vs geri okuma); ilk FAIL/DUR'da kosu durur. Beyani tam ilan atlanir (yeniden baslatilabilir).
# Cikti Drive ASTROLOVE/TEMP/DENETIM_20261021/BEYAN_MARKA/<run_id>/.

permissions:
  actions: read
  contents: read

on:
  workflow_dispatch:
    inputs:
      mod: {description: "kuru | yaz | toplu", required: true, default: "kuru"}
      ilan: {description: "ilan kimligi (yaz: tam 1; toplu: bos = ailedeki tum aktif)", required: false, default: ""}
      aile: {description: "toplu: poster | kupa | yil", required: false, default: ""}
      limit: {description: "toplu: en fazla yazilacak ilan", required: false, default: "10"}
      onay: {description: "yaz icin onay sozcugu", required: false, default: ""}
      gorsel_indir: {description: "kuru: --ilan galeri gorsellerini indir (evet/hayir)", required: false, default: "hayir"}

env:
  D: "gdrive:ASTROLOVE/TEMP/DENETIM_20261021/BEYAN_MARKA"

jobs:
  is:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Token
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
      - name: Beyan / marka
        env:
          MOD: ${{ inputs.mod }}
          ILAN: ${{ inputs.ilan }}
          ONAY: ${{ inputs.onay }}
          AILE: ${{ inputs.aile }}
          LIMIT: ${{ inputs.limit }}
          GORSEL: ${{ inputs.gorsel_indir }}
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          set +e -o pipefail
          [[ "$MOD" =~ ^(kuru|yaz|toplu)$ ]] || { echo "::error::mod"; exit 1; }
          [[ "$ILAN" =~ ^[0-9,]*$ ]] || { echo "::error::ilan"; exit 1; }
          args=(--mod "$MOD" --ilan "$ILAN" --out _out)
          [ "$MOD" != kuru ] && args+=(--onay "$ONAY")
          if [ "$MOD" = toplu ]; then
            [[ "$AILE" =~ ^(poster|kupa|yil)$ && "$LIMIT" =~ ^[0-9]+$ ]] || { echo "::error::aile/limit"; exit 1; }
            args+=(--aile "$AILE" --limit "$LIMIT")
          fi
          [ "$GORSEL" = evet ] && args+=(--gorsel-indir)
          python3 scripts/etsy/beyan_marka_yaz.py "${args[@]}" 2>&1 | tee _work/kosu.log
          echo "KOD=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
      - name: Token geri yaz + cikti Drive'a
        if: always()
        run: |
          set -euo pipefail
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "Token geri yazildi" || echo "Token yenilenmedi"
          [ -f _work/kosu.log ] && python3 scripts/guvenlik/log_suz.py < _work/kosu.log > "_out/kosu_$(date -u +%Y%m%d_%H%M).txt"
          if grep -rqE '"(access_token|refresh_token)"[[:space:]]*:[[:space:]]*"[A-Za-z0-9._-]{20,}"|x-api-key[[:space:]]*:' _out/ 2>/dev/null; then
            echo "::error::Ciktida sir bulundu; Drive'a yazilmadi"; exit 1; fi
          rclone copy _out "$D/${GITHUB_RUN_ID}" -q && echo "Cikti: TEMP/DENETIM_20261021/BEYAN_MARKA/${GITHUB_RUN_ID}/"
          [ "${KOD:-1}" = 0 ] || { echo "::error::cikis ${KOD:-?}"; exit 1; }
      - if: always()
        run: rm -rf _work ~/.config/rclone

name: pin-sample-v3

# Pinterest pin gorseli V3 ornegi: POSTERIN KENDISI (mockup yok), edisyon
# basina 4 filigran turu (F1 kose metin, F2 kose logo, F3 doku, F4 alt bant)
# + kontak sayfasi + 300x300 yakin cekimler. Kaynak
# POSTERS/OPTIMIZED_FOR_PRODUCTION/<ED>/2X3 (rclone), cikti
# TEMP/PIN_SAMPLE_V3/<PAIR>/. Toplu uretim DEGILDIR; Pinterest'e dokunmaz.

on:
  workflow_dispatch:
    inputs:
      pair:
        description: "Cift, or. CAPRICORN_VIRGO"
        required: true
        default: "CAPRICORN_VIRGO"
      editions:
        description: "Edisyonlar (virgullu)"
        required: true
        default: "WARM_PARCHMENT,MIDNIGHT_BLUE"

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bagimliliklar
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-ebgaramond fonts-liberation fonts-dejavu-core
          pip install -q -r requirements.txt

      - name: rclone kur
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          rclone version | head -1

      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONF_B64:-}" ]; then
            echo "HATA: RCLONE_CONF_B64 secret'i tanimli degil." >&2
            exit 1
          fi
          mkdir -p ~/.config/rclone
          umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf

      - name: Ornek pinleri uret
        run: |
          set -euo pipefail
          python scripts/pinterest/build_pin_sample_v3.py --pair "${{ inputs.pair }}" --editions "${{ inputs.editions }}"

      - name: Ciktilari artifact olarak sakla
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pin-sample-v3
          path: _out/
          if-no-files-found: ignore
          retention-days: 30

name: galeri-ci11-dosya-kapi

# Galeri CI rank 11 (Serdar 30 Eki) DOSYA KAPISI. Etsy YOK, token YOK, Etsy kilidi YOK (KILIT SURESI, Serdar 23 Eki: OCR / toplu
# indirme kilitli kosuda yapilmaz). Girdi: Drive TEMP/POSTER_GALERI_V11/<galeri_damga>/<CIFT>_W01_KAPAK.jpg + MANIFEST.csv (+ istege
# bagli B3 KAPI/<kapi_kosu>/KAPI.csv). scripts/kapak78/ci11_dosya_kapi.py: JPEG + 3000x2250 + dosya adi cifti = ilan cifti + MANIFEST /
# KAPI sha256 (FAIL = yukleyicide BLOK); tesseract "Frame not included" ve "<A> & <B>" OCR raporu (engellemez).
# Cikti Drive TEMP/POSTER_GALERI_CI11/DOSYA_KAPI/<run_id>/ (CI_KAPI.csv, CI_KAPI.md, GALERI_DAMGA.txt); galeri-ci11-yukle dosya_kapi_kosu.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      galeri_damga: {description: "TEMP/POSTER_GALERI_V11/<damga> (CI W01 dosyalari)", required: true, default: "20261029_103607"}
      kapi_kosu: {description: "B3 KAPI/<kosu> (KAPI.csv W01_KAPAK PASS + sha256 kapisi; bos = yok)", required: false, default: ""}
      sadece: {description: "yalniz bu ilanlar (virgullu listing_id); bos = 78", required: false, default: ""}
      haric: {description: "bu ilanlar haric (virgullu listing_id)", required: false, default: ""}

env:
  T: "gdrive:ASTROLOVE/TEMP"
  O: "gdrive:ASTROLOVE/TEMP/POSTER_GALERI_CI11/DOSYA_KAPI"

jobs:
  kapi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Girdi kapisi
        env:
          GD: ${{ inputs.galeri_damga }}
          KK: ${{ inputs.kapi_kosu }}
          SA: ${{ inputs.sadece }}
          HA: ${{ inputs.haric }}
        run: |
          set -euo pipefail
          [[ "$GD" =~ ^[0-9]{8}_[0-9]{6}$ && "$KK" =~ ^([0-9]+)?$ ]] || { echo "::error::girdi (galeri_damga / kapi_kosu)"; exit 1; }
          [[ "$SA" =~ ^([0-9]+(,[0-9]+)*)?$ && "$HA" =~ ^([0-9]+(,[0-9]+)*)?$ ]] || { echo "::error::girdi (sadece / haric)"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q pillow==11.0.0
          sudo apt-get install -y -q tesseract-ocr >/dev/null
          tesseract --version | head -1
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: CI dosyalari (Drive) + dosya kapisi
        env:
          GD: ${{ inputs.galeri_damga }}
          KK: ${{ inputs.kapi_kosu }}
          SA: ${{ inputs.sadece }}
          HA: ${{ inputs.haric }}
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out _in
          G="$T/POSTER_GALERI_V11/$GD"
          rclone copy "$G" _in --max-depth 1 --include "*_W01_KAPAK.jpg" --transfers 16 -q
          rclone copyto "$G/MANIFEST.csv" _work/MANIFEST.csv || { echo "::error::MANIFEST.csv yok (POSTER_GALERI_V11/$GD)"; exit 1; }
          KA=()
          if [ -n "$KK" ]; then
            rclone copyto "$G/KAPI/$KK/KAPI.csv" _work/KAPI.csv || { echo "::error::KAPI.csv yok (KAPI/$KK)"; exit 1; }
            KA=(--kapi-csv _work/KAPI.csv)
          fi
          echo "indirilen W01: $(ls _in | wc -l)"
          echo "$GD" > _out/GALERI_DAMGA.txt
          set +e
          python3 scripts/kapak78/ci11_dosya_kapi.py --dir _in --ciftler data/pod/pod78_ids.csv --manifest _work/MANIFEST.csv "${KA[@]}" \
            --sadece "$SA" --haric "$HA" --out _out 2>&1 | tee _work/kosu.log
          echo "KOD=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
      - name: Cikti Drive'a
        if: always()
        run: |
          set -uo pipefail
          [ -f _work/kosu.log ] && python3 scripts/guvenlik/log_suz.py < _work/kosu.log > "_out/kosu_$(date -u +%Y%m%d_%H%M).txt"
          [ -d _out ] && rclone copy _out "$O/${GITHUB_RUN_ID}" -q && echo "::notice title=CI DOSYA KAPISI::Drive TEMP/POSTER_GALERI_CI11/DOSYA_KAPI/${GITHUB_RUN_ID}/"
          [ -f _out/CI_KAPI.md ] && head -60 _out/CI_KAPI.md >> "$GITHUB_STEP_SUMMARY" || true
          [ "${KOD:-1}" = 0 ] || { echo "::error::dosya kapisi FAIL (cikis ${KOD:-?})"; exit 1; }
      - if: always()
        run: rm -rf _work _in ~/.config/rclone

name: pod-gorsel-sira

# Mevcut ilan gorselini yeniden siralar + alt metin yazar (Serdar onayi, 27 Eyl 2026): scripts/etsy/pod_gorsel_sira.py.
# YENI DOSYA YUKLENMEZ, SILME YOK. Varsayilan KURU DENEME; yazma yalniz apply=true VE confirm=SIRA_ATA ile.
# Geri okuma: hedef sirada, siralar 1..n tekil, alt metin, id kumesi, varyasyon baglari, video, state.
# Cikti: Drive TEMP/POD_KAPAK_V3/SIRA_<ilan>_<MOD>_<damga>/

on:
  workflow_dispatch:
    inputs:
      listing_id: {description: "Ilan id", required: true, default: "4570143815"}
      image_id: {description: "Mevcut listing_image_id", required: true, default: "8634239409"}
      rank: {description: "Hedef sira", required: true, default: "1"}
      alt_text:
        description: "Alt metin"
        required: true
        default: "Cancer and Libra personalized zodiac couple wall art print in a gold frame, Midnight Blue with names Emily and James"
      apply: {description: "true = Etsy'ye YAZ (confirm=SIRA_ATA gerekir)", type: boolean, default: false}
      confirm: {description: "Yazma icin tam olarak: SIRA_ATA", required: false, default: ""}

concurrency:
  group: etsy-token
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sira:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APPLY: ${{ inputs.apply }}
      CONFIRM: ${{ inputs.confirm }}
      LID: ${{ inputs.listing_id }}
      IID: ${{ inputs.image_id }}
      RANK: ${{ inputs.rank }}
      ALT: ${{ inputs.alt_text }}
    steps:
      - name: Onay kapisi
        run: |
          set -euo pipefail
          if [ "$APPLY" = "true" ] && [ "$CONFIRM" != "SIRA_ATA" ]; then
            echo "::error::apply=true icin confirm tam olarak 'SIRA_ATA' olmali. DUR."; exit 1
          fi
          [ "$APPLY" = "true" ] && echo "MOD=APPLY" >> "$GITHUB_ENV" || echo "MOD=DRY" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2 pillow==12.3.0 numpy==2.4.6
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Token
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
      - name: Sira ata (kuru deneme / apply)
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          set -euo pipefail
          args=(--listing-id "$LID" --image-id "$IID" --rank "$RANK" --alt "$ALT" --out _out)
          if [ "$APPLY" = "true" ]; then args+=(--apply --confirm "$CONFIRM"); fi
          python scripts/etsy/pod_gorsel_sira.py "${args[@]}"
      - name: Token + cikti Drive'a
        if: ${{ always() }}
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y%m%d_%H%M)
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "Token geri yazildi" || true
          if grep -rqE 'x-api-key|refresh_token|"access_token"' _out/ 2>/dev/null; then
            echo "::error::ciktida sir benzeri anahtar bulundu, Drive'a yazilmadi"; exit 1
          fi
          hedef="gdrive:ASTROLOVE/TEMP/POD_KAPAK_V3/SIRA_${LID}_${MOD:-DRY}_${stamp}"
          [ -d _out ] && rclone copy _out "$hedef" -q && echo "Cikti: TEMP/POD_KAPAK_V3/SIRA_${LID}_${MOD:-DRY}_${stamp}/"
          [ -f _out/report.md ] && cat _out/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

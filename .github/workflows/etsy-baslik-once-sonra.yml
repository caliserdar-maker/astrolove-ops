name: etsy-baslik-once-sonra

# SALT OKUMA (Etsy'ye yazma YOK): 78 poster ilani baslik + 13 etiket, SEO51 (11 Eki) oncesi / bugun karsilastirmasi.
# ONCE: Drive TEMP/ETSY_ARAMA_20261010/51_YEDEK_ONCE.json (+ canli/canli_78.csv capraz), ARA: 53_GERI_OKUMA_HAM.json,
# ZAMAN: 51_YAZIM/rapor ModTime + 52_YAZIM_RAPORU.csv. SONRA: GET /shops/{id} + GET /listings/batch (2 cagri; sinir 80, kota tabani 10).
# scripts/etsy/baslik_once_sonra.py. Cikti: Drive TEMP/ETSY_ADS_TESPIT_20261020/ (BASLIK_ETIKET_ONCE_SONRA.csv, OZET.txt, HAM_SONRA.json).

permissions:
  actions: read
  contents: read

on:
  workflow_dispatch:

jobs:
  oku:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Token + ONCE kaynaklari
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work
          E="gdrive:ASTROLOVE/TEMP/ETSY_ARAMA_20261010"
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
          rclone copyto "$E/51_YEDEK_ONCE.json" _work/once.json
          rclone copyto "$E/canli/canli_78.csv" _work/canli.csv || echo "canli_78.csv yok"
          rclone copyto "$E/53_GERI_OKUMA_HAM.json" _work/ham.json || echo "53 yok"
          rclone copyto "$E/52_YAZIM_RAPORU.csv" _work/yazim.csv || echo "52 yok"
          rclone lsjson "$E/51_YAZIM/rapor" --files-only > _work/rapor.json || echo "[]" > _work/rapor.json
      - name: Oku + karsilastir (salt okur)
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          set -euo pipefail
          python scripts/etsy/baslik_once_sonra.py --once _work/once.json --canli _work/canli.csv --ham _work/ham.json \
            --rapor-ls _work/rapor.json --yazim _work/yazim.csv --out out
          rclone copy out "gdrive:ASTROLOVE/TEMP/ETSY_ADS_TESPIT_20261020" --include "BASLIK_ETIKET_ONCE_SONRA.csv" \
            --include "OZET.txt" --include "HAM_SONRA.json" -q
          rclone lsl "gdrive:ASTROLOVE/TEMP/ETSY_ADS_TESPIT_20261020" --include "BASLIK_*" --include "OZET.txt" --include "HAM_SONRA.json"
      - name: Token geri yaz
        if: always()
        run: |
          set -euo pipefail
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "Token geri yazildi" || echo "Token yenilenmedi"
      - if: always()
        run: rm -rf _work ~/.config/rclone

name: etsy-arama-yukle

# etsy-arama ciktilarini (data/etsy_arama_20261010) Drive'a kopyalar. Etsy API YOK, yazma YOK.
# Cikti: Drive ASTROLOVE/TEMP/ETSY_ARAMA_20261010/

permissions:
  contents: read

on:
  push:
    branches: [claude/keen-curie-2hza60]
    paths:
      - config/etsy_arama_yukle.trigger

jobs:
  yukle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: rclone kur + conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Drive'a
        run: |
          set -euo pipefail
          rclone copy data/etsy_arama_20261010 "gdrive:ASTROLOVE/TEMP/ETSY_ARAMA_20261010" -q
          rclone lsl "gdrive:ASTROLOVE/TEMP/ETSY_ARAMA_20261010" --max-depth 1
      - if: always()
        run: rm -rf ~/.config/rclone

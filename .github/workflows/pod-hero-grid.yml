name: pod-hero-grid

# Hero'lar uzerine koordinat izgarasi + kenar cetveli (Mo 14 Eyl 2026).
# Amac: kirpma kutularini (x, y, w, h - kaynak px) elle okumak. Otomatik tespit yok.
# Cikti: Drive TEMP/POD_HERO_CROP/<out_dir>/GRID/grid_<ED>.png
# Etsy'ye DOKUNMAZ; yalniz Drive okur/yazar.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      pair:
        description: "Cift (klasor adi)"
        required: true
        default: "AQUARIUS_AQUARIUS"
      out_dir:
        description: "TEMP/POD_HERO_CROP altindaki hedef klasor"
        required: false
        default: "AQU_AQU"

jobs:
  grid:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAIR: ${{ inputs.pair }}
      OUTDIR: ${{ inputs.out_dir || 'AQU_AQU' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Bagimliliklar + import dogrulamasi
        run: |
          set -euo pipefail
          pip install -q pillow==12.3.0
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          python - <<'PY'
          import re, subprocess, sys, pathlib
          src = pathlib.Path("scripts/pod/hero_grid.py").read_text(encoding="utf-8")
          mods = set(re.findall(r"^\s*(?:import|from)\s+([A-Za-z_][A-Za-z0-9_]*)", src, re.M))
          std = {"argparse", "pathlib"}
          pip_ad = {"PIL": "pillow"}
          kurulu = {l.split()[0].lower() for l in
                    subprocess.run([sys.executable, "-m", "pip", "list"], capture_output=True,
                                   text=True).stdout.splitlines()[2:] if l.strip()}
          eksik = [m for m in mods - std if pip_ad.get(m, m).lower() not in kurulu]
          print("import:", sorted(mods - std), "| pip list:", sorted(kurulu & {"pillow"}))
          if eksik:
              raise SystemExit(f"HATA: kurulu olmayan import: {eksik}")
          PY
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Hero'lari indir
        run: |
          set -euo pipefail
          mkdir -p _work/heroes _out
          for ed in MIDNIGHT_BLUE DEEP_BLACK WARM_PARCHMENT CHAMPAGNE_IVORY PURE_WHITE; do
            if rclone copyto "gdrive:ASTROLOVE/TEMP/POD_GALLERY/${PAIR}/${ed}/01.jpg" "_work/heroes/${ed}.jpg" 2>/dev/null; then
              echo "$ed: TEMP/POD_GALLERY"
            else
              f=$(rclone lsf "gdrive:ASTROLOVE/WALL_ART/LISTING_MEDIA/ETSY_UPLOAD_SETS/${ed}/${PAIR}" --include "01_*" | head -1)
              [ -n "$f" ] || { echo "HATA: $ed hero bulunamadi"; exit 1; }
              rclone copyto "gdrive:ASTROLOVE/WALL_ART/LISTING_MEDIA/ETSY_UPLOAD_SETS/${ed}/${PAIR}/$f" "_work/heroes/${ed}.jpg"
              echo "$ed: ETSY_UPLOAD_SETS/$f"
            fi
          done
          ls -l _work/heroes
      - name: Izgara uret
        run: |
          set -euo pipefail
          python scripts/pod/hero_grid.py --out _out \
            --hero "MB=_work/heroes/MIDNIGHT_BLUE.jpg,DB=_work/heroes/DEEP_BLACK.jpg,WP=_work/heroes/WARM_PARCHMENT.jpg,CI=_work/heroes/CHAMPAGNE_IVORY.jpg,PW=_work/heroes/PURE_WHITE.jpg"
      - name: Drive'a yaz
        if: ${{ always() }}
        run: |
          set -euo pipefail
          [ -d _out ] || exit 0
          rclone copy _out "gdrive:ASTROLOVE/TEMP/POD_HERO_CROP/${OUTDIR}/GRID" -q
          echo "Cikti: TEMP/POD_HERO_CROP/${OUTDIR}/GRID/"
          rclone lsf -l "gdrive:ASTROLOVE/TEMP/POD_HERO_CROP/${OUTDIR}/GRID"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: pod-hero-grid
          path: _out/
          if-no-files-found: ignore
      - if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

name: wp-katman-tani

# WP katman TANI (1 Eki 2026, salt olcum): UCTAN UCA dusuklugunun nedeni (metin / konum / olcek / font)
# ve plate iz olcutu. POD_PRINT / PLATES salt okunur; cikti yalniz Drive TEMP/WP_ORNEK/TANI + artifact.
# Etsy/Prodigi secret'i YOK. Tetik: config/wp_tani.trigger (bu dal).

permissions:
  contents: read

on:
  push:
    branches: [claude/wp-katman-baski-60sk0s]
    paths:
      - config/wp_tani.trigger

concurrency: wp-katman-tani

jobs:
  tani:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        cift: [AQUARIUS_CANCER, ARIES_SCORPIO, CANCER_LIBRA]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python bagimliliklari
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pillow opencv-python-headless numpy fonttools img2pdf pikepdf pytesseract
          sudo apt-get install -y -qq tesseract-ocr >/dev/null
      - name: rclone kur
        run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONF_B64:-}" ]; then echo "HATA: RCLONE_CONF_B64 yok" >&2; exit 1; fi
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Sentetik test
        run: python scripts/medya_v1/test_wp_katman.py
      - name: WP katman tanisi (salt olcum)
        run: python scripts/medya_v1/wp_tani.py --cift "${{ matrix.cift }}" --boylar 11x14,8x10
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tani-${{ matrix.cift }}
          path: _siparis/TANI
          retention-days: 3
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone


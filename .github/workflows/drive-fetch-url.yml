name: drive-fetch-url

# Verilen URL'den bir dosyayi indirip Drive'a (ASTROLOVE altinda) yazar.
# Claude'un sandbox'i bazi hostlara cikamaz (ornek: export-download.canva.com,
# kurum ag politikasi 403); indirme bu yuzden runner'da yapilir.
# URL loga yazilmaz (::add-mask::). Etsy'ye dokunmaz.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Indirilecek dosyanin tam URL'si (imzali link olabilir)"
        required: true
      dest:
        description: "Drive hedef yolu (ASTROLOVE altinda, dosya adi dahil); BOS = Drive'a yazma, yalniz olc"
        required: false
        default: "WALLPAPER/FINAL_V2/_CANDIDATE/CANVA_TEST.png"
      alpha_check:
        description: "PNG alfa kanalini olc (alfa=0 orani, sol ust 200x200 ort alfa)"
        type: boolean
        default: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Indir, olc, Drive'a yaz
        env:
          SRC_URL: ${{ inputs.url }}
          DEST: ${{ inputs.dest }}
          ALPHA: ${{ inputs.alpha_check }}
        run: |
          set -euo pipefail
          echo "::add-mask::$SRC_URL"
          mkdir -p _dl
          name="$(basename "${DEST:-indirilen.png}")"
          curl -fsSL --max-time 300 -o "_dl/$name" "$SRC_URL"
          ls -l "_dl/$name"
          if [ "$ALPHA" = "true" ]; then
            pip install -q pillow numpy
            python3 -c 'import sys, numpy as np; from PIL import Image; Image.MAX_IMAGE_PIXELS=None; im=Image.open(sys.argv[1]); a=np.asarray(im.convert("RGBA"))[...,3]; z=float((a==0).mean())*100; tl=float(a[:200,:200].mean()); mn=int(a.min()); mx=int(a.max()); print(f"{im.size[0]}x{im.size[1]} mod {im.mode} | alfa=0 orani %{z:.1f} | sol ust 200x200 ort alfa {tl:.1f} | alfa min {mn} maks {mx} -> " + ("SEFFAF" if z>70 else ("ZEMIN VAR" if mn==255 else "KISMI")))' "_dl/$name" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$DEST" ]; then
            rclone copyto "_dl/$name" "gdrive:ASTROLOVE/$DEST"
            rclone lsjson "gdrive:ASTROLOVE/$(dirname "$DEST")" --files-only \
              | python3 -c "import json,sys;[print(f\"{r['Name']}  {r['Size']} bayt  id={r.get('ID','')}\") for r in json.load(sys.stdin) if r['Name']=='$name']" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "dest bos: Drive'a yazilmadi." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - if: ${{ always() }}
        run: rm -rf _dl ~/.config/rclone

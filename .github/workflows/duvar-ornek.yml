name: duvar-ornek

# Galeri gorsellerinin kapak duvari zeminli ornegi (Serdar 28 Eyl; salt Drive, Etsy YOK).
# 02_format: kart02_duvar_kur.py; 15_renk_midnight_blue: renk_varyasyon_kur.py (poster onayli karttan birebir kirpim).
# GUCLU zemin + 3 aydinlik secenegi (acik1/2/3; duvar_zemin.py). QC: duvar_qc.py.
# Cikti: Drive ASTROLOVE/TEMP/DUVAR_ORNEK_<damga>/ (<secenek>/JPEG + ONIZLEME_ACIK*.jpg + KARSILASTIRMA_ACIK.jpg + QC.txt).

permissions:
  contents: read

on:
  workflow_dispatch: {}

jobs:
  kur:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q numpy==2.1.3 pillow==11.0.0 scipy==1.14.1 opencv-python-headless==4.10.0.84
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          mkdir -p fonts; base=https://raw.githubusercontent.com/google/fonts/main/ofl
          curl -fsSL "$base/ebgaramond/EBGaramond%5Bwght%5D.ttf" -o 'fonts/EBGaramond[wght].ttf'
          curl -fsSL "$base/montserrat/Montserrat%5Bwght%5D.ttf" -o 'fonts/Montserrat[wght].ttf'
          curl -fsSL "$base/lato/Lato-Regular.ttf" -o fonts/Lato-Regular.ttf
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Kur, QC, Drive'a yaz
        run: |
          set -euo pipefail
          F=data/pod/cl_galeri_final19; Z=data/pod/kapak_sahne_v9.png; mkdir -p _work/out
          python3 -c "from PIL import Image; Image.open('$F/15_renk_midnight_blue.jpg').crop((810, 150, 2189, 1905)).save('_work/p15.png')"
          QC=0
          for sv in guclu acik1 acik2 acik3; do
            O=_work/out/$sv; mkdir -p $O
            if [ "$sv" = "guclu" ]; then python3 scripts/pod/duvar_zemin.py $Z guclu _work/duvar_$sv.png
            else python3 scripts/pod/duvar_zemin.py $Z guclu _work/duvar_$sv.png $sv; fi
            python3 scripts/pod/kart02_duvar_kur.py $F/02_format.jpg _work/duvar_$sv.png fonts $O/02_format.jpg
            python3 scripts/pod/renk_varyasyon_kur.py _work/p15.png "Midnight Blue" "fonts/Montserrat[wght].ttf" $O/15_renk_midnight_blue.jpg _work/duvar_$sv.png
            echo "== $sv" | tee -a _work/out/QC.txt
            set +e
            python3 scripts/pod/duvar_qc.py _work/duvar_$sv.png $Z $O/02_format.jpg $F/02_format.jpg \
              $O/15_renk_midnight_blue.jpg $F/15_renk_midnight_blue.jpg | tee -a _work/out/QC.txt
            [ "${PIPESTATUS[0]}" = "0" ] || QC=1
            set -e
          done
          python3 scripts/pod/duvar_aydinlik_onizleme.py _work/out _work/out $F/01_kapak.jpg "fonts/Montserrat[wght].ttf" _work/out/guclu
          find _work/out -name '*.json' -delete
          DAMGA=$(date -u +%Y%m%d_%H%M); HEDEF="gdrive:ASTROLOVE/TEMP/DUVAR_ORNEK_${DAMGA}"
          rclone copy _work/out "$HEDEF" -q
          echo "Dosyalar:"; rclone lsf -R "$HEDEF"
          echo "Paylasim linki: $(rclone link "$HEDEF")"
          exit "$QC"
      - if: always()
        run: rm -rf _work ~/.config/rclone

name: sosyal-5p-plan

# KURU: IG + FB + Threads + TikTok + YouTube Shorts 78 gunluk takvim (Metricool'a GONDERI YOK).
# 1) Drive listeleri (KARUSEL, VIDEO FINAL)  2) YouTube kategori katalogu (GET)
# 3) s3_test: 1 video Metricool S3'e yuklenir (gonderi OLUSTURULMAZ)  4) pages: karusel gorselleri astrolove-media instagram/v6 + prob
# 5) plan_5p.py -> Drive TEMP/SOSYAL_PLAN_20261012/PLAN_5_PLATFORM.csv

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      baslangic:
        default: "2026-10-14"
      s3_test:
        type: boolean
        default: true
      pages:
        type: boolean
        default: true

concurrency:
  group: pin-media-sync
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      K: gdrive:ASTROLOVE/TEMP/IG_V6_20261012/KARUSEL
      V: gdrive:ASTROLOVE/TEMP/VIDEO_V9_20261012/FINAL
      O: gdrive:ASTROLOVE/TEMP/SOSYAL_PLAN_20261012
      URL_KOK: https://caliserdar-maker.github.io/astrolove-media/instagram/v6
    steps:
      - uses: actions/checkout@v4
      - name: rclone + token
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            export RCLONE_CONFIG_GDRIVE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET"
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
          mkdir -p _work _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/METRICOOL_TOKEN.json" _work/mc.json
          python3 -c "import json;print('::add-mask::'+json.load(open('_work/mc.json'))['userToken'])"

      - name: Listeler + YouTube kategorileri
        run: |
          set -euo pipefail
          rclone lsjson -R "$K" --no-modtime > _out/KARUSEL.json
          rclone lsjson "$V" --files-only --no-modtime > _out/VIDEO.json
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          k = [x for x in json.load(open('_out/KARUSEL.json')) if not x['IsDir']]
          v = [x for x in json.load(open('_out/VIDEO.json')) if x['Name'].endswith('.mp4')]
          print(f"KARUSEL dosya {len(k)}, klasor {len({x['Path'].split('/')[0] for x in k})}, toplam {sum(x['Size'] for x in k)/1e6:.1f} MB")
          print(f"VIDEO mp4 {len(v)}, toplam {sum(x['Size'] for x in v)/1e6:.1f} MB, en buyuk {max((x['Size'] for x in v), default=0)/1e6:.1f} MB")
          EOF
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import importlib.util, json
          sp = importlib.util.spec_from_file_location('mpb', 'scripts/sosyal/metricool_pin_baslik.py')
          mpb = importlib.util.module_from_spec(sp); sp.loader.exec_module(mpb)
          mc = mpb.MC(json.load(open('_work/mc.json')))
          try:
              y = mpb.veri(mc.istek('GET', '/v2/scheduler/catalogs/youtube/categories', {'lang': 'en'}))
          except SystemExit as e:
              y = {'HATA': str(e)}
          json.dump(y, open('_out/YT_KATEGORI.json', 'w'), ensure_ascii=False, indent=1)
          print('YT_KATEGORI', json.dumps(y, ensure_ascii=False)[:1500])
          EOF

      - name: S3 yukleme testi (1 video, gonderi YOK)
        if: ${{ inputs.s3_test == true }}
        run: |
          set -uo pipefail
          rclone copyto "$V/gemini-and-leo-astroloveart-reel.mp4" _work/test.mp4
          ls -la _work/test.mp4
          python3 scripts/sosyal/metricool_s3_test.py _work/mc.json _work/test.mp4 _out/S3_TEST.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Medya reposunu al
        if: ${{ inputs.pages == true }}
        uses: actions/checkout@v4
        with:
          repository: caliserdar-maker/astrolove-media
          token: ${{ secrets.OPS_ADMIN_TOKEN }}
          path: media

      - name: Karusel -> Pages (instagram/v6) + prob
        if: ${{ inputs.pages == true }}
        run: |
          set -euo pipefail
          rclone copy "$K" _kar --include "*.jpg" --include "*.jpeg" --include "*.png" --stats-one-line -v 2>&1 | tail -1
          du -sh _kar; find _kar -type f | wc -l
          mkdir -p media/instagram/v6 && cp -r _kar/. media/instagram/v6/
          (cd media && git add -A instagram/v6 && n=$(git diff --cached --name-only | wc -l) && echo "degisen: $n" && \
            if [ "$n" != "0" ]; then git config user.name astrolove-ops; git config user.email actions@users.noreply.github.com; \
            git commit -qm "instagram/v6: karusel ($(date -u +%Y-%m-%d))"; git push; fi)
          (cd _kar && find . -type f | sed 's|^\./||' | sort) > _out/karusel_dosyalar.txt
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import os, subprocess, sys, time, urllib.parse
          k = os.environ['URL_KOK']; ad = open('_out/karusel_dosyalar.txt').read().split('\n'); ad = [a for a in ad if a]
          def prob(u):
              o = subprocess.run(['curl', '-s', '-o', '/dev/null', '-m', '60', '-w', '%{http_code}|%{content_type}|%{redirect_url}', u], capture_output=True, text=True).stdout
              return (o.split('|') + ['', '', ''])[:3]
          for i in range(60):
              if prob(f'{k}/{urllib.parse.quote(ad[-1])}?v={i}')[0] == '200': break
              time.sleep(15)
          hata = []
          for a in ad:
              for j in range(5):  # tekil 5xx (Pages 503) gecici: 5 deneme, 10 sn ara
                  c, t, r = prob(f'{k}/{urllib.parse.quote(a)}')
                  if c == '200' or not c.startswith('5'): break
                  time.sleep(10)
              if c != '200' or not t.startswith('image/') or r: hata.append(f'{a} {c} {t} {r}')
          print(f'KARUSEL PROB {len(ad) - len(hata)}/{len(ad)} PASS' + ''.join('\n  ' + h for h in hata[:10]))
          sys.exit(1 if hata else 0)
          EOF

      - name: Plan
        env:
          BAS: ${{ inputs.baslangic }}
        run: |
          set -uo pipefail
          python3 scripts/sosyal/plan_5p.py --metin-dir data/sosyal/metin --karusel _out/KARUSEL.json --video _out/VIDEO.json \
            --url-kok "$URL_KOK" --baslangic "$BAS" --cikti _out/PLAN_5_PLATFORM.csv 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          rc=${PIPESTATUS[0]}
          rclone copy _out "$O" --include "PLAN_5_PLATFORM*.csv" --include "S3_TEST.json" --include "YT_KATEGORI.json" --include "KARUSEL.json" --include "VIDEO.json"
          rclone lsl "$O" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $rc

      - if: always()
        run: rm -rf _work ~/.config/rclone

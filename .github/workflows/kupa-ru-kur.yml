name: kupa-ru-kur
# Kupa 78 ilan: hedef EN + yeni RU aciklama (Serdar 31 Eki karar 3b). ETSY YOK, token yok, kilit yok, YAZIM YOK.
# Girdi: Drive TEMP/KUPA_YD_OKU/<okuma>/KUPA_CANLI.json (kupa-yd-oku salt okuma). Kod: scripts/etsy/ru_kupa.py + ru_kupa_78.py.
# Cikti: Drive TEMP/KUPA_RU_KUR/<damga>/ (--immutable): KUPA_RU_78.csv/json, OZET.md, ORNEK_YANYANA.html + ayni icerik Google Doc.
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      okuma: {description: "TEMP/KUPA_YD_OKU/<damga>", required: true}
      ornek: {description: "yan yana ornek ciftler", required: false, default: "CANCER_LIBRA,LEO_LEO"}
jobs:
  kur:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Girdi kapisi
        env: {O: "${{ inputs.okuma }}", C: "${{ inputs.ornek }}"}
        run: '[[ "$O" =~ ^[0-9]{8}_[0-9]{6}$ && "$C" =~ ^[A-Z_,]+$ ]] || { echo "::error::girdi"; exit 1; }'
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || { sudo apt-get install -y -qq rclone >/dev/null; }
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Kur (Etsy yok)
        env: {O: "${{ inputs.okuma }}", C: "${{ inputs.ornek }}"}
        run: |
          set -uo pipefail
          mkdir -p _w _o
          echo "DAMGA=$(date -u +%Y%m%d_%H%M%S)" >> "$GITHUB_ENV"
          rclone copyto "gdrive:ASTROLOVE/TEMP/KUPA_YD_OKU/$O/KUPA_CANLI.json" _w/KUPA_CANLI.json || exit 1
          python3 scripts/etsy/test_ru_kupa.py > _o/TEST.txt; T=$?
          python3 scripts/etsy/ru_kupa_78.py --canli _w/KUPA_CANLI.json --ornek "$C" --out _o; K=$?
          echo "KOD=$(( T | K ))" >> "$GITHUB_ENV"
          tail -1 _o/TEST.txt; cat _o/OZET.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Drive'a yaz
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if ls _o/* >/dev/null 2>&1; then
            D="gdrive:ASTROLOVE/TEMP/KUPA_RU_KUR/${DAMGA:?}"
            rclone copy _o "$D" --immutable -q
            if [ -f _o/ORNEK_YANYANA.html ]; then
              cp _o/ORNEK_YANYANA.html _w/ORNEK_YANYANA_DOC.html
              rclone copy _w/ORNEK_YANYANA_DOC.html "$D" --drive-import-formats html -q || echo "::warning::Google Doc donusumu yapilamadi (html Drive'da)"
            fi
            echo "::notice title=KUPA RU KUR::TEMP/KUPA_RU_KUR/${DAMGA}/"
          fi
          [ "${KOD:-1}" = 0 ] || { echo "::error::78/78 PASS degil ya da test FAIL (OZET.md, TEST.txt)"; exit 1; }
      - if: always()
        run: rm -rf _w _o ~/.config/rclone

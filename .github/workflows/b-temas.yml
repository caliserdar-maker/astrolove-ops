name: b-temas

# B goz kontrolu temas sayfasi (Serdar 24 Eki madde 3): galeri23-duzelt kosusunun ONCE_SONRA gorsellerini (sol once, sag sonra)
# tek sayfada toplar, scripts/pod/b_temas.py. Etsy YOK, Etsy kilidi YOK. Girdi Drive GALERI_PLAN23/DUZELT_<kosu>/<ilan>_<CIFT>/KART/
# ONCE_SONRA/<NN>.jpg; cikti GALERI_PLAN23/TEMAS_<kosu>_<run_id>.jpg.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      kosu: {description: "galeri23-duzelt kosusu", required: true, default: "40085594407"}
      satirlar: {description: "virgullu <ilan>_<CIFT>_<NN> (NN kart sirasi)", required: true}
      baslik: {description: "iki satir baslik, | ile ayrilir (bos = SOL 17 Eki hedef galeri yedegi / SAG duzeltilmis)", required: false, default: ""}

env:
  D: "gdrive:ASTROLOVE/TEMP/DENETIM_20261021/GALERI_PLAN23"

jobs:
  temas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Girdi
        env: {K: "${{ inputs.kosu }}", SAT: "${{ inputs.satirlar }}"}
        run: |
          set -euo pipefail
          [[ "$K" =~ ^[0-9]+$ && "$SAT" =~ ^[0-9]+_[A-Z]+_[A-Z]+_[0-9]{2}(,[0-9]+_[A-Z]+_[A-Z]+_[0-9]{2})*$ ]] || { echo "::error::girdi"; exit 1; }
          pip install -q pillow==11.0.0
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: ONCE_SONRA indir + temas
        env: {K: "${{ inputs.kosu }}", SAT: "${{ inputs.satirlar }}", BAS: "${{ inputs.baslik }}"}
        run: |
          set -euo pipefail
          mkdir -p _w/os
          for s in ${SAT//,/ }; do
            L=${s%%_*}; R=${s#*_}; C=${R%_*}; N=${R##*_}
            rclone copyto "$D/DUZELT_$K/${L}_${C}/KART/ONCE_SONRA/$N.jpg" "_w/os/$s.jpg"
          done
          python3 scripts/pod/b_temas.py --dir _w/os --sira "$SAT" ${BAS:+--baslik "$BAS"} --font 'assets/fonts/Montserrat[wght].ttf' --out "_w/TEMAS_${K}_${GITHUB_RUN_ID}.jpg"
          rclone copyto "_w/TEMAS_${K}_${GITHUB_RUN_ID}.jpg" "$D/TEMAS_${K}_${GITHUB_RUN_ID}.jpg"
          echo "::notice title=TEMAS::Drive TEMP/DENETIM_20261021/GALERI_PLAN23/TEMAS_${K}_${GITHUB_RUN_ID}.jpg"
      - if: always()
        run: rm -rf _w ~/.config/rclone

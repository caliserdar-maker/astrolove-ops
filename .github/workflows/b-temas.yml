name: b-temas

# B goz kontrolu temas sayfasi (Serdar 24 Eki madde 3): galeri23-duzelt kosusunun ONCE_SONRA gorsellerini (sol once, sag sonra)
# tek sayfada toplar, scripts/pod/b_temas.py. Etsy YOK, Etsy kilidi YOK. Girdi Drive GALERI_PLAN23/DUZELT_<kosu>/<ilan>_<CIFT>/KART/
# ONCE_SONRA/<NN>.jpg; cikti GALERI_PLAN23/TEMAS_<kosu>_<run_id>.jpg.
# sutun dolu (Serdar 24 Eki 22 ilan hazirlik 4b): satirlar = <ilan>_<CIFT>, her satirda sutun kartlari (orn. 04,09) yan yana, son
# gorseller (KART/NN_*.jpg; yoksa DEGISEN, yoksa hedef yedek), QC cercevesi yok; ayni burclu cift isaretli.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      kosu: {description: "galeri23-duzelt kosusu", required: true, default: "40085594407"}
      satirlar: {description: "virgullu <ilan>_<CIFT>_<NN> (NN kart sirasi); sutun doluysa <ilan>_<CIFT>", required: true}
      sutun: {description: "bos = once/sonra; orn. 04,09 = ilan basina satir, kartlar yan yana (son gorsel, cercevesiz)", required: false, default: ""}
      cikti: {description: "bos = GALERI_PLAN23 altina TEMAS_<kosu>_<run>.jpg; dolu = GALERI_PLAN23/<cikti>/ klasorune (orn. DUZELT_<kosu>/GOSTERIM)", required: false, default: ""}
      baslik: {description: "iki satir baslik, | ile ayrilir (bos = SOL 17 Eki hedef galeri yedegi / SAG duzeltilmis)", required: false, default: ""}

env:
  D: "gdrive:ASTROLOVE/TEMP/DENETIM_20261021/GALERI_PLAN23"

jobs:
  temas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Girdi
        env: {K: "${{ inputs.kosu }}", SAT: "${{ inputs.satirlar }}", SUT: "${{ inputs.sutun }}", CK: "${{ inputs.cikti }}"}
        run: |
          set -euo pipefail
          [[ "$K" =~ ^[0-9]+$ && "$SUT" =~ ^([0-9]{2}(,[0-9]{2})*)?$ && "$CK" =~ ^[A-Za-z0-9_/]*$ && "$CK" != *..* ]] || { echo "::error::girdi"; exit 1; }
          if [ -z "$SUT" ]; then
            [[ "$SAT" =~ ^[0-9]+_[A-Z]+_[A-Z]+_[0-9]{2}(,[0-9]+_[A-Z]+_[A-Z]+_[0-9]{2})*$ ]] || { echo "::error::girdi"; exit 1; }
          else
            [[ "$SAT" =~ ^[0-9]+_[A-Z]+_[A-Z]+(,[0-9]+_[A-Z]+_[A-Z]+)*$ ]] || { echo "::error::girdi"; exit 1; }
          fi
          pip install -q pillow==11.0.0
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: ONCE_SONRA indir + temas
        env: {K: "${{ inputs.kosu }}", SAT: "${{ inputs.satirlar }}", BAS: "${{ inputs.baslik }}", SUT: "${{ inputs.sutun }}", CK: "${{ inputs.cikti }}"}
        run: |
          set -euo pipefail
          mkdir -p _w/os _w/t
          if [ -z "$SUT" ]; then
            for s in ${SAT//,/ }; do
              L=${s%%_*}; R=${s#*_}; C=${R%_*}; N=${R##*_}
              rclone copyto "$D/DUZELT_$K/${L}_${C}/KART/ONCE_SONRA/$N.jpg" "_w/os/$s.jpg"
            done
          else
            for s in ${SAT//,/ }; do
              L=${s%%_*}; C=${s#*_}
              for N in ${SUT//,/ }; do
                rm -rf _w/t/*; Y=""
                for kay in "$D/DUZELT_$K/${L}_${C}/KART" "$D/DUZELT_$K/${L}_${C}/DEGISEN" "gdrive:ASTROLOVE/TEMP/GALERI_YAYIN/YEDEK/${L}_${C}"; do
                  rclone copy "$kay" _w/t --include "${N}_*.jpg" --max-depth 1 -q || true
                  F=$(ls _w/t/${N}_*.jpg 2>/dev/null | head -1 || true)
                  if [ -n "$F" ]; then Y=$kay; mv "$F" "_w/os/${s}_${N}.jpg"; break; fi
                done
                [ -n "$Y" ] || { echo "::error::$s kart $N bulunamadi"; exit 1; }
                echo "$s kart $N <- ${Y#gdrive:ASTROLOVE/TEMP/}"
              done
            done
          fi
          AD="TEMAS_${K}_${GITHUB_RUN_ID}.jpg"; HED="$D/$AD"
          [ -n "$CK" ] && HED="$D/$CK/$AD"
          python3 scripts/pod/b_temas.py --dir _w/os --sira "$SAT" ${SUT:+--sutun "$SUT"} ${BAS:+--baslik "$BAS"} --font 'assets/fonts/Montserrat[wght].ttf' --out "_w/$AD"
          rclone copyto "_w/$AD" "$HED"
          if [ -n "$SUT" ]; then
            # olcum (Serdar 24 Eki 22 ilan hazirlik 3): satirlardaki her ilanin DEGISEN gorselleri boyut + adet
            mkdir -p _w/d
            for s in ${SAT//,/ }; do
              L=${s%%_*}; C=${s#*_}
              rclone copy "$D/DUZELT_$K/${L}_${C}/DEGISEN" "_w/d/$s" --include "*.jpg" -q
            done
            python3 - "${HED%/*}" <<'PY2'
          import csv, os, sys
          from PIL import Image
          rows, oz = [], []
          for s in sorted(os.listdir("_w/d")):
              fs = sorted(f for f in os.listdir(f"_w/d/{s}") if f.endswith(".jpg"))
              bz = [Image.open(f"_w/d/{s}/{f}").size for f in fs]
              rows += [dict(ilan_cift=s, dosya=f, w=w, h=h) for f, (w, h) in zip(fs, bz)]
              iyi = sum(b == (3000, 2250) for b in bz)
              oz.append(f"{s} DEGISEN {len(fs)} | 3000x2250 {iyi}/{len(fs)} | {'PASS' if fs and iyi == len(fs) else 'FAIL'}")
          w = csv.DictWriter(open("_w/OLCUM.csv", "w", newline=""), fieldnames=["ilan_cift", "dosya", "w", "h"]); w.writeheader(); w.writerows(rows)
          open("_w/OLCUM.txt", "w").write("\n".join(oz) + "\n"); print("\n".join(oz))
          PY2
            rclone copyto _w/OLCUM.csv "${HED%/*}/OLCUM_${GITHUB_RUN_ID}.csv"; rclone copyto _w/OLCUM.txt "${HED%/*}/OLCUM_${GITHUB_RUN_ID}.txt"
          fi
          echo "::notice title=TEMAS::Drive ${HED#gdrive:ASTROLOVE/}"
      - if: always()
        run: rm -rf _w ~/.config/rclone

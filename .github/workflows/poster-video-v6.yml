name: poster-video-v6
# V6 ORNEKLERI (19 Eki 2026, Serdar). Etsy API KULLANILMAZ; Etsy'ye ve Metricool'a YAZMA YOK. Toplu uretim yok.
# A) kupa V6 = kupa-orchard video6b.py (cift.py Cancer Libra Emily James katmanlari), yalniz N 10400 ve sigma 0.45 (referans).
# B) poster V6 = sosyal/poster_video/poster_video_v6.py, sosyal/poster_video/v6_kalibre.py ile kupaya gore ayarlanir
#    (parcacik sayisi: sembol alanina gore toz yogunlugu; murekkep egrisi: gorunen oran). Cikti: .../POSTER_VIDEO_ORNEK_20261019/V6/.
permissions:
  contents: write   # yalniz poster-video-onizleme dalina kucuk onizleme
on:
  workflow_dispatch:
    inputs:
      kapak:
        description: 'KAPAK/ altindaki kapak dosyasi'
        default: 4570143815_CANCER_LIBRA.jpg
jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      O: gdrive:ASTROLOVE/TEMP/POSTER_VIDEO_ORNEK_20261019/V6
      K: gdrive:ASTROLOVE/TEMP/KAPAK_P2_78_20261019/KAPAK
      KAPAK: ${{ inputs.kapak }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Kurulum
      run: |
        set -euo pipefail
        pip install -q numpy==2.1.3 pillow==11.0.0 scipy==1.14.1 opencv-python-headless==4.10.0.84
        sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg fonts-dejavu-core >/dev/null
        curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
    - name: rclone.conf
      env:
        RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      run: |
        set -euo pipefail
        mkdir -p ~/.config/rclone; umask 077
        printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
        if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "::add-mask::$GOOGLE_CLIENT_SECRET"
          grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true; fi
    - name: Uret + kalibre + QC
      run: |
        set +e -uo pipefail   # QC FAIL olsa da ciktilar Drive'a gitsin
        case "$KAPAK" in *[!A-Za-z0-9_.]*|'') echo "::error::kapak adi gecersiz"; exit 1 ;; esac
        mkdir -p _w/k _o
        git fetch -q origin kupa-orchard && git archive origin/kupa-orchard kupa_orchard | tar -x -C _w/k
        bash _w/k/kupa_orchard/kod/sembol_al.sh CANCER_LIBRA _w/sem
        T0=$(date +%s)
        (cd _w/k/kupa_orchard && python3 -I kod/cift.py Cancer Libra Emily James "My favorite place is with you" ../../sem ../../kupa) > _w/cift.log 2>&1; CR=$?
        tail -2 _w/cift.log; echo "::warning::KUPA KATMANLARI rc=$CR $(( $(date +%s) - T0 )) sn"
        rclone copyto "$K/$KAPAK" _w/kapak.jpg -q || { echo "::error::kapak yok"; exit 1; }
        python3 -I sosyal/poster_video/v6_kalibre.py _w/kapak.jpg _w/kupa/video _w/kupa/galeri/01_Orange_Blossom_kapak.jpg \
          _w/k/kupa_orchard/kod/video6b.py _o _w/is | tee _w/qc.txt; QC=${PIPESTATUS[0]}
        grep -E '^\{|TUR|TABLO|SONUC' _w/qc.txt | sed 's/^/::warning::QC /' | cut -c1-3000
        echo "::warning::SURE $(( $(date +%s) - T0 )) sn"
        rclone copy _o "$O" -q
        echo "::warning::DRIVE $(rclone lsf "$O" | tr '\n' ' ')"
        mkdir -p _pv; cp _o/*.jpg _o/QC.json _pv/ 2>/dev/null
        echo "RC=$(( QC + CR ))" >> "$GITHUB_ENV"
    - name: Onizleme dali
      if: ${{ always() }}
      run: |
        set +e -uo pipefail
        [ -n "$(ls -A _pv 2>/dev/null)" ] || exit 0
        B=poster-video-onizleme; PV=ornek_v6
        git config user.name "github-actions"; git config user.email "actions@github.com"
        for i in 1 2 3; do
          rm -rf _pvw; git worktree prune
          git fetch -q origin $B 2>/dev/null && git worktree add -q _pvw origin/$B 2>/dev/null || { git worktree add -q --detach _pvw; (cd _pvw && git checkout -q --orphan tmp && git rm -rqf . ); }
          rm -rf "_pvw/$PV"; mkdir -p "_pvw/$PV"; cp _pv/* "_pvw/$PV/"
          (cd _pvw && git add -A && git commit -qm "poster video v6 onizleme (kosu ${{ github.run_id }})" && git push -q origin HEAD:refs/heads/$B) && { echo "::warning::ONIZLEME $B/$PV"; break; }
          sleep 5
        done
    - name: Sonuc
      if: ${{ always() }}
      run: |
        rm -rf _w ~/.config/rclone
        [ "${RC:-1}" = "0" ]

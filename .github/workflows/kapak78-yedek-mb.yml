name: kapak78-yedek-mb
# Poster 78 kapak plan adim 1-2 (Merkez 26 Eki; Serdar onayi). ETSY API YOK, ETSY'YE YAZMA YOK (Etsy kilidi gerekmez).
# A) 78 ilanin tum galeri gorselleri (POSTER_GORSEL.json url_fullxfull, etsystatic) -> Drive TEMP/POSTER_KAPAK_V10_YEDEK/<damga>/
# B) Midnight Blue kart (rank 13) poster kutusu olcumu -> MB_KONTROL.csv (ayni klasor). scripts/kapak78/yedek_mb_kontrol.py
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      poster_json_id: {description: "Drive POSTER_GORSEL.json id", required: true, default: "1vah4Vp6YpA1de-wTE5VxMCCpDQmc-mll"}
      kaynak_csv_id: {description: "Drive KAPAK_KAYNAK.csv id", required: true, default: "18OaDABiN7FEBYTv6oQgjhy2_A7YdwJsc"}
jobs:
  yedek:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Girdi kapisi
        env: {PJ: "${{ inputs.poster_json_id }}", KC: "${{ inputs.kaynak_csv_id }}"}
        run: '[[ "$PJ" =~ ^[A-Za-z0-9_-]{20,80}$ && "$KC" =~ ^[A-Za-z0-9_-]{20,80}$ ]] || { echo "::error::girdi"; exit 1; }'
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q pillow==11.0.0 numpy==2.1.3 requests==2.34.2
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || { sudo apt-get install -y -qq rclone >/dev/null; }
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Girdiler (Drive, id ile)
        env: {PJ: "${{ inputs.poster_json_id }}", KC: "${{ inputs.kaynak_csv_id }}"}
        run: |
          set -euo pipefail
          mkdir -p _work
          rclone backend copyid gdrive: "$PJ" _work/POSTER_GORSEL.json -q
          rclone backend copyid gdrive: "$KC" _work/KAPAK_KAYNAK.csv -q
          ls -l _work
          echo "DAMGA=$(date -u +%Y%m%d_%H%M%S)" >> "$GITHUB_ENV"
      - name: A yedek + B MB kontrol
        run: python3 scripts/kapak78/yedek_mb_kontrol.py --poster-json _work/POSTER_GORSEL.json --kaynak-csv _work/KAPAK_KAYNAK.csv --out _out
      - name: Drive'a yaz
        if: ${{ always() }}
        run: |
          if ls _out/* >/dev/null 2>&1; then
            rclone copy _out/YEDEK "gdrive:ASTROLOVE/TEMP/POSTER_KAPAK_V10_YEDEK/${DAMGA}" --transfers 8 -q || exit 1
            for f in MB_KONTROL.csv MB_REFERANS.txt REF_SAGITTARIUS_SAGITTARIUS.jpg REF_CANCER_LIBRA.jpg; do
              [ -f "_out/$f" ] && rclone copyto "_out/$f" "gdrive:ASTROLOVE/TEMP/POSTER_KAPAK_V10_YEDEK/${DAMGA}/$f" -q; done
            echo "Cikti: TEMP/POSTER_KAPAK_V10_YEDEK/${DAMGA} ($(find _out/YEDEK -name '*.jpg' | wc -l) jpg)"
          fi
      - if: always()
        run: rm -rf _work _out ~/.config/rclone

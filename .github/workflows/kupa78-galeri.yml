name: kupa78-galeri
# Kupa 78 cift galeri toplu uretim (Serdar 18 Eki). Etsy'ye YUKLEME YOK; yalniz uretim + Drive TEMP/KUPA78_GALERI_20261018/.
# Kod: dal kupa-printful-sonuc, klasor kupa_uretim/ (uret_cift.sh, ortam degiskeni verilmez). printful-kupa-mockup.yml'e dokunulmaz.
# Sira: cl_dogrula (CANCER_LIBRA baskilari dalin tasarim/ dosyalariyla fark 0; degilse DUR, uretim kosmaz) -> 13 grup x 6 cift -> topla.
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      ciftler:
        description: "HEPSI ya da bosluklu cift listesi"
        default: "HEPSI"
env:
  DRIVE: "gdrive:ASTROLOVE/TEMP/KUPA78_GALERI_20261018"
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      gruplar: ${{ steps.p.outputs.gruplar }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kupa-printful-sonuc
          sparse-checkout: kupa_uretim/sembol
      - id: p
        env:
          CIFTLER: ${{ inputs.ciftler }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, json
          k = sorted(os.listdir("kupa_uretim/sembol"))
          s = os.environ["CIFTLER"].split()
          if s != ["HEPSI"]:
              k = [x for x in k if x in s]
          g = [" ".join(k[i:i + 6]) for i in range(0, len(k), 6)]
          print("gruplar=" + json.dumps(g))
          PY

  cl_dogrula:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - uses: actions/checkout@v4
        with:
          ref: kupa-printful-sonuc
          path: kupa
          sparse-checkout: |
            kupa_uretim
            tasarim
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q numpy==2.5.3 scipy==1.18.1 pillow==12.3.0
      - name: CANCER_LIBRA baski = tasarim/ (fark 0)
        run: |
          set -euo pipefail
          cd kupa/kupa_uretim
          CIFT='{"isim1":"Emily","isim2":"James","burc":"CANCER · LIBRA"}' python3 -I kod/kupa_7stil.py sembol/CANCER_LIBRA font susleme /tmp/cl >/dev/null
          python3 - <<'PY'
          import glob, os, numpy as np
          from PIL import Image
          f = {}
          for p in sorted(glob.glob("/tmp/cl/KUPA_*_baski_2700x1050.png")):
              r = os.path.join("../tasarim", os.path.basename(p))
              A = np.asarray(Image.open(p).convert("RGBA")).astype(int); B = np.asarray(Image.open(r).convert("RGBA")).astype(int)
              f[os.path.basename(p)] = int(np.abs(A - B).max()) if A.shape == B.shape else -1
          print(f)
          if len(f) != 7 or any(v != 0 for v in f.values()):
              print(f"::error::DUR: CANCER_LIBRA baskilari tasarim/ ile ayni degil {f}"); raise SystemExit(1)
          print("::notice::CANCER_LIBRA 7/7 baski tasarim/ ile birebir (fark 0)")
          PY

  uret:
    needs: [plan, cl_dogrula]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 13
      matrix:
        grup: ${{ fromJson(needs.plan.outputs.gruplar) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - uses: actions/checkout@v4
        with:
          ref: kupa-printful-sonuc
          path: kupa
          sparse-checkout: |
            kupa_uretim
            tasarim
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Kurulum
        run: |
          set -euo pipefail
          pip install -q numpy==2.5.3 scipy==1.18.1 pillow==12.3.0 opencv-python-headless   # video_kupa.py cv2 kullanir
          sudo apt-get -qq update >/dev/null
          sudo apt-get -qq install -y tesseract-ocr ffmpeg >/dev/null
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null 2>&1 || sudo apt-get -qq install -y rclone >/dev/null
          ffmpeg -version | head -1
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true; fi
      - name: Uret + kontrol + Drive
        env:
          GRUP: ${{ matrix.grup }}
        run: |
          cd kupa/kupa_uretim
          mkdir -p /tmp/out /tmp/qc
          n=0; t0=$(date +%s); top=$(echo $GRUP | wc -w)
          for KOD in $GRUP; do
            n=$((n+1)); a=${KOD%%_*}; b=${KOD#*_}
            B1="$(echo ${a:0:1})$(echo ${a:1} | tr A-Z a-z)"; B2="$(echo ${b:0:1})$(echo ${b:1} | tr A-Z a-z)"
            s=$(date +%s)
            if bash kod/uret_cift.sh "$KOD" "$B1" "$B2" "sembol/$KOD" "/tmp/out/$KOD" > "/tmp/qc/${KOD}_log.txt" 2>&1; then
              python3 "$GITHUB_WORKSPACE/main/scripts/kupa/kupa78_kontrol.py" "$KOD" "/tmp/out/$KOD" ../tasarim "/tmp/qc/${KOD}.json" | tee -a /tmp/qc/OZET.txt
            else
              python3 -c "import json,sys;t=open(sys.argv[2]).read()[-400:];json.dump(dict(cift=sys.argv[1],PASS=False,sorun=['uret_cift.sh hata: '+t]),open(sys.argv[3],'w'))" "$KOD" "/tmp/qc/${KOD}_log.txt" "/tmp/qc/${KOD}.json"
              echo "FAIL $KOD uret_cift.sh hata" | tee -a /tmp/qc/OZET.txt
            fi
            cp "/tmp/qc/${KOD}.json" "/tmp/out/$KOD/_QC.json" 2>/dev/null || true
            rclone copy "/tmp/out/$KOD" "$DRIVE/$KOD" -q --transfers 8 --exclude "ara/**" --exclude "baski/tasarim/**" || echo "FAIL $KOD drive" | tee -a /tmp/qc/OZET.txt
            g=$(( $(date +%s) - t0 )); echo "[$n/$top] $KOD $(( $(date +%s) - s ))s | gecen ${g}s | kalan ~$(( g * (top - n) / n ))s | %$(( 100 * n / top ))"
          done
          rclone copy /tmp/qc "$DRIVE/_qc" -q --include "*.json" --include "*_log.txt"
          F=$(grep -c '^FAIL' /tmp/qc/OZET.txt || true); P=$(grep -c '^PASS' /tmp/qc/OZET.txt || true)
          echo "::warning::GRUP PASS $P FAIL $F | $(grep '^FAIL' /tmp/qc/OZET.txt | tr '\n' ';' | cut -c1-700)"
          rm -rf ~/.config/rclone

  topla:
    needs: [uret]
    if: ${{ always() && needs.uret.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kupa-printful-sonuc
          sparse-checkout: kupa_uretim/font
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          pip install -q pillow==12.3.0
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null 2>&1 || sudo apt-get -qq install -y rclone >/dev/null
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true; fi
      - name: Kapak paftasi + ozet
        run: |
          set -euo pipefail
          mkdir -p k q
          rclone copy "$DRIVE" k -q --include "*/galeri/01_*.jpg" --transfers 16
          rclone copy "$DRIVE/_qc" q -q --include "*.json"
          python3 - <<'PY'
          import glob, json, os
          from PIL import Image, ImageDraw, ImageFont
          K = sorted(d for d in os.listdir("k") if not d.startswith("_"))
          T, G, C = 400, 12, 13; R = (len(K) + C - 1) // C
          S = Image.new("RGB", (C * (T + G) + G, 90 + R * (T + 46 + G)), (250, 248, 245)); d = ImageDraw.Draw(S)
          f = ImageFont.truetype("kupa_uretim/font/EBGaramond[wght].ttf", 46); f.set_variation_by_axes([600])
          k = ImageFont.truetype("kupa_uretim/font/EBGaramond[wght].ttf", 22); k.set_variation_by_axes([500])
          d.text((G, 22), f"Kupa 78 cift, galeri 01 kapak ({len(K)})", font=f, fill=(40, 36, 34))
          for i, c in enumerate(K):
              p = glob.glob(f"k/{c}/galeri/01_*.jpg")
              x, y = G + (i % C) * (T + G), 90 + (i // C) * (T + 46 + G)
              if p:
                  S.paste(Image.open(p[0]).convert("RGB").resize((T, T), Image.LANCZOS), (x, y))
              d.text((x, y + T + 8), c.replace("_", " + "), font=k, fill=(40, 36, 34))
          S.save("KAPAK78_PAFTA.jpg", quality=88); print("pafta", len(K), S.size)
          q = [json.load(open(p)) for p in sorted(glob.glob("q/*.json"))]
          P = [x["cift"] for x in q if x.get("PASS")]; F = [x for x in q if not x.get("PASS")]
          eksik = sorted(set(K) ^ {x["cift"] for x in q})
          print(f"::warning::KUPA78 PASS {len(P)} / FAIL {len(F)} / toplam qc {len(q)} / kapak {len(K)} | eksik {eksik} | "
                + "; ".join(f"{x['cift']}: {' | '.join(x.get('sorun') or [])[:150]}" for x in F)[:700])
          PY
          rclone copyto KAPAK78_PAFTA.jpg "$DRIVE/KAPAK78_PAFTA.jpg" -q
          K=$(rclone lsjson gdrive:ASTROLOVE/TEMP --dirs-only | python3 -c "import json,sys;print([x['ID'] for x in json.load(sys.stdin) if x['Name']=='KUPA78_GALERI_20261018'][0])"); echo "::warning::KLASOR KUPA78_GALERI_20261018 $K"
          rm -rf ~/.config/rclone

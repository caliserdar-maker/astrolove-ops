name: p1g-w05-yukle
# P1-G (Serdar 6 Kas, kalan 77 = 4570155846 + gruplar 5, 20, 25, 26). BU COMMIT: GRUP 2 (20 ilan) YALNIZ KURU (Serdar 7 Kas "GRUP 2 evet, Ga evet,
# Gb evet"). kip kuru YALNIZ: sadece = GRUP 2 dizesi BIREBIR (eksik / fazla / sira / tekrar ayni kontrolde kapanir) + onay W05-KURU-GRUP2
# + plan_damga BOS + GITHUB_RUN_ATTEMPT 1 + ref main. kip yaz bu commit'te HICBIR girdiyle kabul edilmez (GRUP 2 yazimi ayri onay + ayri
# commit). GRUP 1 dizesi, 4570155846, 4570143815 ve liste disi her ilan: token oncesi DUR (Onay kapisi) ve ayni kural token adiminda (KAPI2).
# GRUP 2 dizesi: 4570127160,4570113157,4570113675,4570128546,4570114301,4570150148,4570136319,4570151370,4570151950,4570152410,4570152820,4570031205,4570153208,4570138967,4570154042,4570139913,4570140539,4570141945,4570157258,4570157716
# Kapi degisiklikleri (Serdar 7 Kas): gevseyen (a) kip kuru yeniden acik (yalniz GRUP 2 + W05-KURU-GRUP2 + bos damga; kuru'da betik yalniz
# --kuru alir, salt_okur GET disini kapatir, --confirm / W05_KILIT yok), (b) tek kullanimlik kilit (KILIT1) yalniz kip yaz'da calisir (kuru
# Etsy'ye yazmaz, her kuru kendi plan_damga'sini uretir; bos damgada KILIT1 deseni "" iceren her JSON'a eslesirdi). Sikilasan: GRUP 1 yazim
# yolu kapali; kuru'da plan_damga bos olmak zorunda. Yaz yolu (KILIT1, ISARET, kuru RAPOR kapisi) olu kod olarak durur ve testlidir.
# Yazilanlar (kosu no: Actions gecmisi): 4570143815 CANCER_LIBRA (42210656786 DUR, panel silmesi, 42213841977; Drive PILOT/yaz_42210656786), 4570155846 ARIES_VIRGO
# (42233642909 PASS, PILOT/yaz_42233642909; 42234074980 UYGUN), GRUP 1 5 ilan (kuru 42256985849, yazim 42264647009 PASS=5,
# PILOT/yaz_42264647009; 42265188608 UYGUN 5). Kalan gruplar: 25, 26 (her biri ayri kod + kuru + onay + yazim).
# Yazim kipi (ayri commit'te acilinca) Etsy'ye YAZAR: galeri rank 5 W05_SUREC
# (yeni kart yukle, eski W05'i sil) + renk baglarini plandaki AYNI haliyle yeniden yazma. Baska alan YOK; updateListing / PATCH YOK.
# GALERI istisnasi (Serdar 5 Kas yontem b): yalniz W05_SUREC, yalniz P1-G. Kod scripts/kapak78/w05_degistir.py (etsy alt komutu).
# Kart + MANIFEST: TEMP/P1G_W05_20261106_090016 (p1g-w05-uret 42194064189). Canli okuma: TEMP/POSTER_GALERI_V11_YEDEK/20261106_090016.
#   kuru: plan YALNIZ listedeki ilanlar icin (liste sirasiyla) kurulur (plan_damga = <bu kosu>_<sha12>), sonra Etsy SALT OKUMA (ilan basina
#         3 GET) + kart sha256 = plan. Kart / canli GALERI.json eksikse Etsy cagrisi ve token ONCESI DUR.
#   yaz : plan yeniden KURULMAZ; PLAN_W05.json + RAPOR.json, plan_damga'nin "_" oncesindeki kuru kosusunun PILOT/kuru_<kosu>/ klasorunden
#         okunur (kuru RAPOR: mod kuru, ayni damga, HAZIR = liste uzunlugu, ilanlar = liste ayni sirayla; degilse token ve Etsy cagrisi
#         ONCESI DUR). Kuru YENIDEN DENENMEZ (yeniden deneme
#         kaydi kuru_<kosu>_a<N>'e gider, yaz onu okumaz): yeni kuru dispatch.
# Kilit: kilit_bekle.py checkout'tan hemen sonra, token indirmeden ONCE. Kayit: TEMP/P1G_W05_20261106_090016/PILOT/<kip>_<run>/
# (PLAN, RAPOR, SONUC, ilanlar/YEDEK|ARA|SONRA|TANI, LOG.txt sir taramasindan gecmis), --immutable. Kalan 77 ilan: AYRI onay + AYRI commit.
permissions:
  actions: read
  contents: read
on:
  workflow_dispatch:
    inputs:
      kip:
        description: "kuru (Etsy salt okuma) | yaz (Etsy'ye yazar)"
        type: choice
        options: [kuru, yaz]
        default: kuru
      sadece:
        description: "virgullu ilan listesi (bu commit: yalniz GRUP 2 dizesi, 20 ilan, basliktaki sirayla; yalniz kuru)"
        required: true
        default: ""
      onay:
        description: "bu commit: W05-KURU-GRUP2 (kip yaz kapali)"
        required: true
        default: ""
      plan_damga:
        description: "bu commit'te BOS olmali (kip kuru; plan_damga kurunun kendisinde uretilir)"
        required: false
        default: ""
env:
  P1G: "ASTROLOVE/TEMP/P1G_W05_20261106_090016"
  YEDEK: "ASTROLOVE/TEMP/POSTER_GALERI_V11_YEDEK/20261106_090016"
jobs:
  yukle:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Onay kapisi
        env:
          KIP: ${{ inputs.kip }}
          SADECE: ${{ inputs.sadece }}
          ONAY: ${{ inputs.onay }}
          DAMGA: ${{ inputs.plan_damga }}
        run: |
          G2="4570127160,4570113157,4570113675,4570128546,4570114301,4570150148,4570136319,4570151370,4570151950,4570152410,4570152820,4570031205,4570153208,4570138967,4570154042,4570139913,4570140539,4570141945,4570157258,4570157716"
          [ "$KIP" = kuru ] || { echo "::error::bu commit'te yalniz kip kuru (GRUP 2 yazimi ayri onay + ayri commit)"; exit 1; }
          [ "$SADECE" = "$G2" ] || { echo "::error::sadece GRUP 2 dizesiyle birebir ayni degil"; exit 1; }
          [ -z "$DAMGA" ] || { echo "::error::kip kuru'da plan_damga bos olmali"; exit 1; }
          [ "$ONAY" = "W05-KURU-GRUP2" ] || { echo "::error::onay girdisi W05-KURU-GRUP2 degil"; exit 1; }
          [ "${GITHUB_RUN_ATTEMPT:-}" = 1 ] || { echo "::error::yeniden deneme (Re-run) yok: GITHUB_RUN_ATTEMPT ${GITHUB_RUN_ATTEMPT:-bos}"; exit 1; }
          [ "${GITHUB_REF:-}" = refs/heads/main ] || { echo "::error::yalniz main'den (GITHUB_REF ${GITHUB_REF:-bos})"; exit 1; }
      - uses: actions/checkout@v4
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kurulum
        env:
          KIP: ${{ inputs.kip }}
        run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || { sudo apt-get install -y -qq rclone >/dev/null; }
          E=""; [ "${GITHUB_RUN_ATTEMPT:-1}" = 1 ] || E="_a${GITHUB_RUN_ATTEMPT}"   # yeniden denemede kayit kaybolmasin (--immutable)
          echo "CIKTI=$P1G/PILOT/${KIP}_${GITHUB_RUN_ID}${E}" >> "$GITHUB_ENV"
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"; echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Token + girdiler (kart, plan)
        env:
          KIP: ${{ inputs.kip }}
          SADECE: ${{ inputs.sadece }}
          ONAY: ${{ inputs.onay }}
          DAMGA: ${{ inputs.plan_damga }}
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out _kart _plan
          G2="4570127160,4570113157,4570113675,4570128546,4570114301,4570150148,4570136319,4570151370,4570151950,4570152410,4570152820,4570031205,4570153208,4570138967,4570154042,4570139913,4570140539,4570141945,4570157258,4570157716"  # KAPI2
          [ "$KIP" = kuru ] && [ "$SADECE" = "$G2" ] && [ -z "$DAMGA" ] && [ "$ONAY" = "W05-KURU-GRUP2" ] && [ "${GITHUB_RUN_ATTEMPT:-}" = 1 ] && [ "${GITHUB_REF:-}" = refs/heads/main ] || { echo "::error::KAPI2: yalniz kip kuru + GRUP 2 + bos damga + W05-KURU-GRUP2 + deneme 1 + main"; exit 1; }  # KAPI2
          # tek kullanimlik kilit (fail-closed): ayni damgayla onceki yazim kosusu (PILOT/yaz_*/KURU_KAPI.json ya da RAPOR.json) varsa DUR;
          # liste ya da var olan dosya okunamazsa da DUR. YALNIZ kip yaz'da (Serdar 7 Kas Gb): kuru'da damga bos, desen "" iceren her JSON'a eslesirdi
          if [ "$KIP" = yaz ]; then  # KILIT1
          rclone lsf --dirs-only "gdrive:$P1G/PILOT/" < /dev/null > _work/pilot_dirs.txt || { echo "::error::PILOT listesi okunamadi; kilit denetlenemedi"; exit 1; }  # KILIT1
          while read -r -u 4 d; do case "$d" in yaz_*) ;; *) continue ;; esac  # KILIT1
            DD="gdrive:$P1G/PILOT/${d%/}"  # KILIT1
            FL=$(rclone lsf --files-only "$DD/" < /dev/null) || { echo "::error::kilit: ${d%/} listelenemedi; DUR"; exit 1; }  # KILIT1
            for f in KURU_KAPI.json RAPOR.json; do case $'\n'"$FL"$'\n' in *$'\n'"$f"$'\n'*) ;; *) continue ;; esac  # KILIT1
              KK=$(rclone cat "$DD/$f" < /dev/null) || { echo "::error::kilit: ${d%/}/$f okunamadi; DUR"; exit 1; }  # KILIT1
              case "$KK" in *"\"$DAMGA\""*) echo "::error::tek kullanimlik kilit: ${d%/} ayni damgayla yazim kosusu; yeni yazim yok"; exit 1 ;; esac  # KILIT1
            done  # KILIT1
          done 4< _work/pilot_dirs.txt  # KILIT1
          fi  # KILIT1
          python3 - "$SADECE" > _work/ilan_cift.txt <<'PY'
          import csv, sys
          m = {r["listing_id"]: r["cift"] for r in csv.DictReader(open("data/pod/pod78_ids.csv"))}
          ids = sys.argv[1].split(",")
          if not ids or not all(ids) or len(set(ids)) != len(ids) or any(i not in m for i in ids):
              raise SystemExit(f"::error::ilan listesi pod78_ids.csv ile eslesmiyor / tekrar / bos ({sys.argv[1]})")
          for i in ids:
              print(i, m[i])
          PY
          while read -r -u 3 ID CIFT; do   # liste fd 3'ten: dongu govdesi stdin'i tuketemez
            rclone copyto "gdrive:$P1G/${CIFT}_W05_SUREC.jpg" "_kart/${CIFT}_W05_SUREC.jpg" < /dev/null \
              || { echo "::error::kart indirilemedi ($ID $CIFT); token ve Etsy cagrisi yok"; exit 1; }
            [ -s "_kart/${CIFT}_W05_SUREC.jpg" ] || { echo "::error::kart bos ($ID $CIFT); token ve Etsy cagrisi yok"; exit 1; }
            if [ "$KIP" = kuru ]; then
              mkdir -p "_canli/${ID}_${CIFT}"
              rclone copyto "gdrive:$YEDEK/${ID}_${CIFT}/GALERI.json" "_canli/${ID}_${CIFT}/GALERI.json" < /dev/null \
                || { echo "::error::canli GALERI.json indirilemedi ($ID $CIFT); token ve Etsy cagrisi yok"; exit 1; }
              [ -s "_canli/${ID}_${CIFT}/GALERI.json" ] || { echo "::error::canli GALERI.json bos ($ID $CIFT); token ve Etsy cagrisi yok"; exit 1; }
            fi
          done 3< _work/ilan_cift.txt
          if [ "$KIP" = kuru ]; then
            rclone copyto "gdrive:$P1G/MANIFEST_W05.csv" _work/MANIFEST_W05.csv < /dev/null || { echo "::error::MANIFEST_W05.csv indirilemedi; token ve Etsy cagrisi yok"; exit 1; }
            python3 -c "import csv,sys; R={x['listing_id']: x for x in csv.DictReader(open('data/pod/pod78_ids.csv'))}; ids=sys.argv[1].split(','); w=csv.DictWriter(open('_work/cift.csv','w',newline=''),fieldnames=list(R[ids[0]])); w.writeheader(); w.writerows(R[i] for i in ids)" "$SADECE"
            python3 scripts/kapak78/w05_degistir.py plan --canli-dir _canli --manifest _work/MANIFEST_W05.csv --ciftler _work/cift.csv --out _out \
              || { echo "::error::plan BLOK (ilan basina neden: PILOT/<kosu>/PLAN_W05.md); token ve Etsy cagrisi yok"; exit 1; }
            D=$(python3 -c "import json; print(json.load(open('_out/PLAN_W05.json'))['plan_damga'])")
            cp _out/PLAN_W05.json _plan/PLAN_W05.json
          else
            K="${DAMGA%%_*}"
            rclone copyto "gdrive:$P1G/PILOT/kuru_${K}/PLAN_W05.json" _plan/PLAN_W05.json
            rclone copyto "gdrive:$P1G/PILOT/kuru_${K}/RAPOR.json" _plan/KURU_RAPOR.json
            [ -s _plan/PLAN_W05.json ] && [ -s _plan/KURU_RAPOR.json ] || { echo "::error::kuru plani / raporu yok (PILOT/kuru_$K)"; exit 1; }
            python3 - "$DAMGA" "$SADECE" <<'PY'
          import json, sys
          r = json.load(open("_plan/KURU_RAPOR.json"))
          ids = sys.argv[2].split(",")
          ok = r.get("mod") == "kuru" and r.get("plan_damga") == sys.argv[1] and r.get("sayilar") == {"HAZIR": len(ids)} \
              and [x.get("ilan") for x in r.get("ilanlar") or []] == ids
          json.dump(dict(kuru_kapisi="PASS" if ok else "FAIL", mod=r.get("mod"), plan_damga=r.get("plan_damga"), sayilar=r.get("sayilar")),
                    open("_out/KURU_KAPI.json", "w"))
          if not ok:
              raise SystemExit(f"::error::kuru kosusu PASS degil ya da damga / ilan farkli (mod {r.get('mod')}, sayilar {r.get('sayilar')}); yazim yok")
          PY
            cp _plan/PLAN_W05.json _out/PLAN_W05_KULLANILAN.json
            # kilit isareti token ve Etsy cagrisi ONCESI Drive'a (sonraki dispatch'i KILIT1 durdurur); yazilamazsa DUR
            rclone copyto _out/KURU_KAPI.json "gdrive:${CIKTI:?}/KURU_KAPI.json" < /dev/null || { echo "::error::kilit isareti Drive'a yazilamadi; token ve Etsy cagrisi yok"; exit 1; }  # ISARET
            D="$DAMGA"
          fi
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json   # token: kapilar + girdiler tamamlandiktan SONRA
          echo "PLAN_DAMGA=$D" >> "$GITHUB_ENV"; echo "::notice title=W05 plan_damga::$D"
      - name: W05 degisim (betik)
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          KIP: ${{ inputs.kip }}
          SADECE: ${{ inputs.sadece }}
        run: |
          set -o pipefail
          # betige giden onay SADECE'den turetilir (betik W05-YAZ-<virgullu liste> bekler); is akisi onay girdisi iki kapida denetlendi
          if [ "$KIP" = yaz ]; then A=(--confirm W05_DEGISTIR --onay "W05-YAZ-$SADECE"); export W05_KILIT=1; else A=(--kuru); fi
          python3 scripts/kapak78/w05_degistir.py etsy "${A[@]}" --plan _plan/PLAN_W05.json --plan-damga "${PLAN_DAMGA:?}" \
            --dosya-dir _kart --sadece "$SADECE" --out _out 2>&1 \
            | python3 scripts/guvenlik/sir_koru.py tee --sir-json _work/ETSY_TOKEN.json _out/LOG.txt
      - name: Token geri yaz + kayit Drive'a
        if: ${{ always() }}
        run: |
          [ -f scripts/etsy/token_geri_yaz.sh ] || { echo "checkout yok (onay kapisinda durdu); kayit yok"; exit 0; }
          TOKEN_RC=0; OUT_RC=0; bash scripts/etsy/token_geri_yaz.sh || TOKEN_RC=1
          if ls _out/* >/dev/null 2>&1; then
            python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/ETSY_TOKEN.json _out || { echo "::error::ciktida sir"; exit 1; }
            rclone copy _out "gdrive:${CIKTI:?}" --immutable -q && echo "::notice title=W05 kayit::${CIKTI#ASTROLOVE/}/" || OUT_RC=1
          fi
          [ "$TOKEN_RC" = 0 ] && [ "$OUT_RC" = 0 ] || exit 1
      - if: always()
        run: rm -rf _work _kart _plan _canli ~/.config/rclone

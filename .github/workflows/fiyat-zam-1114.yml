name: fiyat-zam-1114

# Serdar 13-14 Kas 2026 (Genel Merkez): poster ve 1st Anniversary ilanlarinda Digital File 3.90 -> 9.90, Print her boy +5 USD;
# kupa (cift 78; sade 12 icin Serdar teyidi gerekir) 11 oz 12.90 -> 24.90, 15 oz 16.90 -> 29.90, kargo ayni (scripts/etsy/kupa_zam_1114.py).
# mod oku = salt okuma (plan + kapilar; ATLA uygulanmaz); mod yaz = onay (poster FIYAT_1114, yd FIYAT_1114_YD, kupa KUPA_ZAM_1114;
# kupa_sade yazimi kodda kapali). Once 1 ilan, canli kontrol, sonra kalanlar. TAMAM okuma/yazma hatasi ve Drive yukleme hatasi
# 14 Kas'tan beri tum ailelerde koşuyu kirmizi bitirir.
# Cikti: Drive TEMP/POD_ORDERS/FIYAT_1114/<aile>_<kosu>/

permissions:
  actions: read
  contents: read

on:
  workflow_dispatch:
    inputs:
      mod:
        description: "oku | yaz"
        required: true
        default: "oku"
      ilanlar:
        description: "virgullu ilan id (bos = bolumdeki ilanlarin hepsi)"
        default: ""
      aile:
        description: "poster | yd (yil donumu, bolum 60895624) | kupa (cift, bolum 60980873) | kupa_sade (Zodiac Sign Mugs)"
        required: true
        default: "poster"
      atla:
        description: "hepsi modunda atlanacak (zaten yazilmis) ilanlar, virgullu"
        default: ""
      onay:
        description: "yaz icin poster FIYAT_1114, yd FIYAT_1114_YD, kupa KUPA_ZAM_1114, kupa_sade KUPA_ZAM_1114_SADE (ilanlar bos = hepsi: sonuna _HEPSI)"
        default: ""

jobs:
  fiyat:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Fiyat zammi (${{ inputs.mod }} ${{ inputs.aile }})
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          MOD: ${{ inputs.mod }}
          ILANLAR: ${{ inputs.ilanlar }}
          ONAY: ${{ inputs.onay }}
          AILE: ${{ inputs.aile }}
          ATLA: ${{ inputs.atla }}
        run: |
          set -euo pipefail
          case "$MOD" in oku|yaz) ;; *) echo "HATA: mod $MOD"; exit 1;; esac
          case "$AILE" in poster|yd|kupa|kupa_sade) ;; *) echo "HATA: aile $AILE"; exit 1;; esac
          umask 077; mkdir -p _work
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
          K="gdrive:ASTROLOVE/TEMP/POD_ORDERS/FIYAT_1114"
          T="$K/${AILE}_TAMAM.txt"
          LS=$(rclone lsf "$K" --files-only) || { echo "::error::FIYAT_1114 klasoru okunamadi"; exit 1; }
          if grep -qxF "${AILE}_TAMAM.txt" <<< "$LS"; then
            rclone copyto "$T" _work/tamam.txt || { echo "::error::TAMAM okunamadi"; exit 1; }
          else : > _work/tamam.txt; fi
          export TAMAM_LISTE="$(tr '\n' ',' < _work/tamam.txt)"
          export ATLA="${TAMAM_LISTE},${ATLA}"
          if [ -n "$ILANLAR" ]; then SEC=(--ilanlar "$ILANLAR"); else SEC=(--hepsi); fi
          rc=0
          case "$AILE" in
            kupa) python scripts/etsy/kupa_zam_1114.py "$MOD" "${SEC[@]}" --confirm "$ONAY" --aile cift || rc=$? ;;
            kupa_sade) python scripts/etsy/kupa_zam_1114.py "$MOD" "${SEC[@]}" --confirm "$ONAY" --aile sade || rc=$? ;;
            *) python scripts/pod/fiyat_zam_1114.py "$MOD" "${SEC[@]}" --confirm "$ONAY" --aile "$AILE" || rc=$? ;;
          esac
          H="$K/${AILE}_${GITHUB_RUN_ID}"
          if [ -d out ]; then rclone copy out "$H" -q || { echo "::error::Drive yukleme basarisiz"; exit 1; }; fi
          if [ "$MOD" = yaz ] && [ -s out/TAMAM_EK.txt ]; then   # kayitlar Drive'a yuklendikten SONRA
            { cat _work/tamam.txt out/TAMAM_EK.txt | grep -E '^[0-9]+$' || true; } | sort -u > _work/tamam_yeni.txt
            rclone copyto _work/tamam_yeni.txt "$T" -q || { echo "::error::TAMAM listesi yazilamadi"; exit 1; }
          fi
          exit $rc
      - name: Token geri yaz
        if: always()
        run: |
          set -euo pipefail
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "Token geri yazildi" || echo "Token yenilenmedi"
      - if: always()
        run: rm -rf _work out ~/.config/rclone

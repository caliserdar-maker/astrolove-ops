name: ai-beyan-test
# AI beyan kapisi kalici testi (Serdar 31 Eki, Gorev E): scripts/etsy/test_ai_beyan.py (kapi birimi, Etsy._call yolu, dogrudan requests
# korumasi (AST + mutasyon), kacis yollari, surec cikisi, eski kaynak metni FAIL). ETSY YOK, sir yok, ag yok. Canli yukleyiciler --canli.
permissions:
  contents: read
on:
  push: {}   # yol filtresi YOK (Serdar 14 Kas 2026): CI testleri data/, docs/, config/ dosyalarini da okur; her push kosar
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Kurulum
        run: pip install -q requests==2.34.2
      - name: AI beyan kapisi testi
        run: python3 scripts/etsy/test_ai_beyan.py
  v2-test:
    # AI beyan v2 + kota olcum kilidi (Denetim 20261101A, Serdar 1 Kas): sahte Etsy testleri. ETSY YOK, sir yok. YD yukleyici
    # degisiklikleri bu dala ALINMADI (Serdar 1 Kas: yalniz AI beyan v2 main'e); YD testleri yd-kapak dalinda.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Kurulum (yd-kapak-yukle ile ayni surumler)
        run: pip install -q requests==2.34.2 numpy==2.1.3 pillow==11.0.0 pyyaml==6.0.2
      - name: Kapi + yazicilar (karar 1-5)
        run: |
          set -euo pipefail
          for t in scripts/etsy/test_ru_kapisi.py scripts/etsy/test_beyan_marka_yaz.py \
                   scripts/etsy/test_pod_5x7_yaz.py scripts/etsy/test_kota_esik.py scripts/etsy/test_kupa_galeri78.py \
                   scripts/etsy/test_secret_gecis.py scripts/etsy/test_urun_ayar.py scripts/etsy/test_ornament_taslak.py \
                   scripts/etsy/test_canli_yapi_olc.py scripts/etsy/test_ornament_metin_canli.py scripts/etsy/test_kupa_zam_1114.py \
                   scripts/etsy/test_ornament_metin.py scripts/etsy/test_magaza_parca_yaz.py; do
            echo "== $t"; python3 "$t" > _t.log 2>&1 || { tail -40 _t.log; exit 1; }; tail -1 _t.log
          done
      - name: etsy-kota olcum kilidi (madde 7) + workflow denetimi
        run: |
          set -euo pipefail
          python3 scripts/etsy/test_etsy_kota_kilit.py
          python3 scripts/ops/test_workflows.py
          python3 scripts/guvenlik/test_receipt_log_kapi.py   # IP adim 0 c (17 Kas): siparis no loga acik yazilmaz
          python3 scripts/guvenlik/test_veri_maske.py   # IP adim 0 c: veriden gelen siparis no (ilan_satis_oku, siparis_oku) opak kod
          python3 scripts/guvenlik/test_maske_calisma.py   # IP adim 0 c3: 3 siparis aracinin gercek main() kosusu + kanal_oku + LISTING / ekstra_tesis maskesi
  siparis-onizle-test:
    # 19 Kas (GOREV HALKA_KALICI_2 E, inceleme G ORTA 8): Midnight Blue halka duzeltmesi + halka kapisi + siparis yardimcisi testleri. Motor
    # surumleri (siparis-giris yeni isi ile ayni). test_halka_yama d2b414ee motor_gpt'yi okur (main gecmisinde yok: SHA ile cekilir). Ag YOK.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: d2b414ee (motor tabani) + kurulum
        run: |
          set -euo pipefail
          git fetch -q --depth=1 origin d2b414ee270ec029bd5abcef4a6535414ae7d1e1
          python3 -m venv /tmp/v                                         # alt surecler -I ile kosar: kullanici site-packages gorulmez, venv gorulur
          /tmp/v/bin/pip install -q numpy==2.5.3 opencv-python-headless==5.0.0.93 pillow==12.3.0 scipy==1.18.1 pyyaml==6.0.2
      - name: siparis_onizle testleri (her biri tek basina, cikis kodu ayri)
        run: |
          set -euo pipefail
          for t in scripts/siparis_onizle/test_halka_yama.py scripts/siparis_onizle/test_halka_kapi.py scripts/siparis_onizle/test_premium_tara_kabuk.py \
                   scripts/siparis_onizle/test_siparis_v2_girdi.py scripts/siparis_onizle/test_kesit_olcum.py \
                   scripts/siparis_onizle/test_halka_23_akis.py; do
            echo "== $t"; /tmp/v/bin/python "$t" > _t.log 2>&1 || { tail -40 _t.log; exit 1; }; tail -1 _t.log
          done

name: ai-beyan-test
# AI beyan kapisi kalici testi (Serdar 31 Eki, Gorev E): scripts/etsy/test_ai_beyan.py (kapi birimi, Etsy._call yolu, dogrudan requests
# korumasi, aciklama yazan betik kapsami, eski kaynak metni FAIL). ETSY YOK, sir yok, ag yok.
permissions:
  contents: read
on:
  push:
    paths: ["scripts/etsy/**", "scripts/pod/**", "scripts/kapak78/**", ".github/workflows/ai-beyan-test.yml"]
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Kurulum
        run: pip install -q requests==2.32.3
      - name: AI beyan kapisi testi
        run: python3 scripts/etsy/test_ai_beyan.py

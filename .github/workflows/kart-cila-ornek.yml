name: kart-cila-ornek

# CL sahne kartlari 06/09/10/11: ChatGPT cilali cerceveli bos sahneler + gercek posterler (salt Drive; Etsy YOK).
# Girdi: data/pod/gpt_sahne_cila (sahne), data/pod/cl_galeri_final19 (ust etiket + alt serit pikselleri),
#        Drive TEMP/POD_KAPAK_V3/SIPARIS/CANCER_LIBRA_MIDNIGHT_BLUE_11x14/BASKI_11x14.jpg (MB),
#        Drive TEMP/CANLI_GORSEL/4570143815/05_8581517848.jpg (canli palet karti 'Five palettes'; kart14/15/16'daki canli 04: CI, DB, PW)
# Cikti: Drive ASTROLOVE/TEMP/KART_CILA_ORNEK_<damga>/ (kurulan JPEG'ler) + KONTROL/ (kayipsiz PNG + QC.txt) + link
# kartlar: kurulup yuklenecekler. onayli: onayli_klasor'den indirilip v2 geometrisiyle yalniz QC'lenir (yuklenmez).
# pakete_yaz=evet: QC PASS ise 06/09/10/11 (onayli ya da yeni) data/pod/cl_galeri_final19'a yazilir ve main'e
# commit edilir; diger 15 dosyaya dokunulmaz (Serdar 28 Eyl onayi).

permissions:
  contents: write   # yalniz pakete_yaz=evet iken data/pod/cl_galeri_final19'a 4 sahne karti commit edilir

on:
  workflow_dispatch:
    inputs:
      kartlar:
        description: "Kurulup yuklenecek kartlar"
        default: "06,09,10,11"
      onayli:
        description: "Yalniz QC'lenecek onayli kartlar (virgullu, bos olabilir)"
        default: ""
      onayli_klasor:
        description: "Onayli kartlarin Drive klasoru (TEMP altinda)"
        default: "KART_CILA_ORNEK_20260928_1038"
      pakete_yaz:
        description: "evet: QC PASS ise 4 sahne kartini cl_galeri_final19'a commit et"
        default: "hayir"

jobs:
  kur:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q numpy==2.1.3 pillow==11.0.0 scipy==1.14.1 opencv-python-headless==4.10.0.84
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          mkdir -p fonts
          curl -fsSL 'https://raw.githubusercontent.com/google/fonts/main/ofl/ebgaramond/EBGaramond%5Bwght%5D.ttf' -o 'fonts/EBGaramond[wght].ttf'
          curl -fsSL 'https://raw.githubusercontent.com/google/fonts/main/ofl/montserrat/Montserrat%5Bwght%5D.ttf' -o 'fonts/Montserrat[wght].ttf'
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Kur, QC, Drive'a yaz
        env:
          KARTLAR: ${{ inputs.kartlar }}
          ONAYLI: ${{ inputs.onayli }}
          ONAYLI_KLASOR: ${{ inputs.onayli_klasor }}
          PAKETE_YAZ: ${{ inputs.pakete_yaz }}
        run: |
          set -euo pipefail
          mkdir -p _work/out/KONTROL _work/qc/KONTROL
          rclone copyto "gdrive:ASTROLOVE/TEMP/POD_KAPAK_V3/SIPARIS/CANCER_LIBRA_MIDNIGHT_BLUE_11x14/BASKI_11x14.jpg" _work/BASKI_11x14.jpg
          rclone copyto "gdrive:ASTROLOVE/TEMP/CANLI_GORSEL/4570143815/05_8581517848.jpg" _work/CANLI_04.jpg
          python3 - <<'EOF'
          from PIL import Image
          import numpy as np
          B = Image.open('_work/BASKI_11x14.jpg'); C = Image.open('_work/CANLI_04.jpg').convert('RGB')
          print('BASKI', B.size, '| CANLI_04', C.size)
          assert C.width >= 2733 and C.height >= 1960, 'canli 04 boyutu kirpim kutularina uymuyor'
          for ad, k in [('CI', (2208, 499, 2733, 1152)), ('DB', (1240, 500, 1760, 1150)), ('PW', (755, 1310, 1275, 1960))]:
              print(ad, 'ort parlaklik', round(float(np.asarray(C.crop(k)).mean()), 1))
          EOF
          for k in 06:06_hediye_sahne:SAHNE_HEDIYE:BASKI_11x14 09:09_yatak_sahne:SAHNE_YATAK:CANLI_04 \
                   10:10_calisma_sahne:SAHNE_CALISMA:CANLI_04 11:11_yemek_sahne:SAHNE_YEMEK:CANLI_04; do
            IFS=: read -r n ad sh src <<<"$k"
            if [[ ",$ONAYLI," == *",$n,"* ]]; then
              rclone copyto "gdrive:ASTROLOVE/TEMP/$ONAYLI_KLASOR/$ad.jpg" "_work/qc/$ad.jpg"
              rclone copyto "gdrive:ASTROLOVE/TEMP/$ONAYLI_KLASOR/KONTROL/$ad.png" "_work/qc/KONTROL/$ad.png"
              echo "$n onayli: $ONAYLI_KLASOR/$ad.jpg (yalniz QC)"; continue
            fi
            [[ ",$KARTLAR," == *",$n,"* ]] || continue
            python3 scripts/pod/kart_cila_kur.py "$n" "data/pod/gpt_sahne_cila/$sh.png" "_work/$src.jpg" \
              "data/pod/cl_galeri_final19/$ad.jpg" "fonts/EBGaramond[wght].ttf" "fonts/Montserrat[wght].ttf" \
              "_work/out/$ad.jpg" "_work/out/KONTROL/$ad.png"
            cp "_work/out/$ad.jpg" _work/qc/; cp "_work/out/KONTROL/$ad.png" _work/qc/KONTROL/
          done
          set +e
          python3 scripts/pod/kart_cila_qc.py _work/qc _work/qc/KONTROL data/pod/gpt_sahne_cila \
            _work/BASKI_11x14.jpg _work/CANLI_04.jpg "$ONAYLI" | tee _work/out/KONTROL/QC.txt
          QC=${PIPESTATUS[0]}
          set -e
          DAMGA=$(date -u +%Y%m%d_%H%M)
          HEDEF="gdrive:ASTROLOVE/TEMP/KART_CILA_ORNEK_${DAMGA}"
          rclone copy _work/out "$HEDEF" -q
          echo "Dosyalar:"; rclone lsf -R "$HEDEF"
          echo "Paylasim linki: $(rclone link "$HEDEF")"
          if [ "$PAKETE_YAZ" = "evet" ]; then
            [ "$QC" = "0" ] || { echo "QC FAIL: pakete yazilmadi"; exit "$QC"; }
            for ad in 06_hediye_sahne 09_yatak_sahne 10_calisma_sahne 11_yemek_sahne; do
              cp "_work/qc/$ad.jpg" "data/pod/cl_galeri_final19/$ad.jpg"
            done
            DEGISEN=$(git status --porcelain --untracked-files=no | awk '{print $2}' | sort | tr '\n' ' ')
            echo "Degisen: $DEGISEN"
            BEKLENEN="data/pod/cl_galeri_final19/06_hediye_sahne.jpg data/pod/cl_galeri_final19/09_yatak_sahne.jpg data/pod/cl_galeri_final19/10_calisma_sahne.jpg data/pod/cl_galeri_final19/11_yemek_sahne.jpg "
            # yalniz bu 4 dosya degisebilir (degismeyen biri varsa listede olmaz, o da kabul)
            for f in $DEGISEN; do [[ " $BEKLENEN" == *" $f "* ]] || { echo "BEKLENMEYEN degisiklik: $f"; exit 1; }; done
            echo "Paket dosya sayisi: $(ls data/pod/cl_galeri_final19 | wc -l)"
            sha256sum data/pod/cl_galeri_final19/{06,09,10,11}_*.jpg
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/pod/cl_galeri_final19/{06,09,10,11}_*.jpg
            git commit -q -m "cl_galeri_final19: 06/09/10/11 cilali sahne kartlari (Serdar 28 Eyl onayi; 06 $ONAYLI_KLASOR, 09/10/11 yeni kurulum; QC 4/4 PASS)"
            for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((2**i)); done
            git log --oneline -1
          fi
          exit "$QC"
      - if: always()
        run: rm -rf _work ~/.config/rclone

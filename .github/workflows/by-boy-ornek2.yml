name: by-boy-ornek2
# 1st Anniversary (YD) boy yontemi 2. tur (Serdar 31 Eki: dikey uzatma reddedildi). ETSY YOK. scripts/siparis_by/by_boy2.py:
# a) esit olcek + kenar kirpma (kapi: kirpilan bantta oge yok), b) esit olcek 1 + zemin duz rengi / gecisi + olculu gren (ayna yok).
# Cikti Drive TEMP/YD_BOY_ORNEK2/<damga>/: <stil>_<boy>_<yontem>.jpg, <stil>_8x10.jpg, TABLO.csv, OLCUM.json, KONTAK_YONTEM.jpg.
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      pair: {description: "cift", required: true, default: "CANCER_LIBRA"}
      stiller: {description: "virgullu stil no (1 Starlit, 2 Timeless ...)", required: true, default: "1,2"}
      boylar: {description: "virgullu boy", required: true, default: "12x18,A2"}
jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KOD_REF: e3d168cef6821d0bd6b6ae5b4dfba503025c5753   # by-siparis-ornek.yml ile ayni
    steps:
      - name: Girdi kapisi
        env: {P: "${{ inputs.pair }}", S: "${{ inputs.stiller }}", B: "${{ inputs.boylar }}"}
        run: '[[ "$P" =~ ^[A-Z]+_[A-Z]+$ && "$S" =~ ^[1-5](,[1-5])*$ && "$B" =~ ^[0-9A-Zx,]+$ ]] || { echo "::error::girdi"; exit 1; }'
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: Kod
        run: |
          set -euo pipefail
          git fetch -q --depth 1 origin "$KOD_REF"
          git worktree add -q _kod FETCH_HEAD
      - name: Kurulum (by-siparis-ornek ile ayni surumler)
        run: |
          set -euo pipefail
          pip install -q numpy==2.5.3 opencv-python-headless==5.0.0.93 pillow==12.3.0 fonttools==4.60.1
          python3 -c "from PIL import features; import sys; sys.exit(0 if features.check('raqm') else 1)"
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || { sudo apt-get install -y -qq rclone >/dev/null; }
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Yontem ornekleri
        env: {P: "${{ inputs.pair }}", S: "${{ inputs.stiller }}", B: "${{ inputs.boylar }}"}
        run: |
          set -uo pipefail
          echo "DAMGA=$(date -u +%Y%m%d_%H%M%S)" >> "$GITHUB_ENV"
          python3 scripts/siparis_by/by_boy2.py --kod _kod --pair "$P" --stiller "$S" --boylar "$B" --scale 2 --out _o
          echo "KOD=$?" >> "$GITHUB_ENV"
          cat _o/TABLO.csv >> "$GITHUB_STEP_SUMMARY" || true
      - name: Drive'a yaz
        if: always()
        run: |
          set -euo pipefail
          if ls _o/* >/dev/null 2>&1; then
            rclone copy _o "gdrive:ASTROLOVE/TEMP/YD_BOY_ORNEK2/${DAMGA:?}" --immutable -q
            echo "::notice title=YD BOY ORNEK2::TEMP/YD_BOY_ORNEK2/${DAMGA}/"
          fi
          [ "${KOD:-1}" = 0 ] || { echo "::error::by_boy2 hata (OLCUM.json)"; exit 1; }
      - if: always()
        run: rm -rf _o ~/.config/rclone

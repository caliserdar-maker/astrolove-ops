name: kisisel-pilot

# Kisisellestirme pilotu icin genel kosucu (Mo onayi, 21 Eyl 2026).
# Drive'a erisim yalniz Actions'ta mumkun oldugu icin agir is buraya tasinir:
# secilen daldaki bir script'i rclone yetkili runner'da kosar.
#
# Kapsam siniri: YALNIZ Drive (rclone) kimligi verilir. Etsy ve Prodigi
# secret'lari bu workflow'a hic girmez; Etsy'ye yazan hicbir adim yoktur.
# Tetik yalniz workflow_dispatch'tir (cron yok, push yok).
# Hicbir sir loga yazilmaz.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Script'in okunacagi dal"
        required: true
        default: "kisisel-v1"
      script:
        description: "Kosulacak script yolu (depo koku baz; scripts/ altinda olmali)"
        required: true
        default: "scripts/kisisel/kisisel_pilot.py"
      args:
        description: "Script'e gecilecek ek argumanlar"
        required: false
        default: ""
      kilit_commit:
        description: "Onayli kilitleri depoya yaz (yalniz onayli/ ve ORAN_SABITLERI.json)"
        required: false
        default: "false"

concurrency: kisisel-pilot

jobs:
  kosu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Yazma izni yalniz kilit commit'i icin; asagidaki adim SADECE
    # scripts/kisisel/onayli/** ve scripts/kisisel/ORAN_SABITLERI.json
    # yollarini ekler ve baska bir sey staged ise HATA ile durur.
    permissions:
      contents: write

    steps:
      - name: Checkout (secilen dal)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          set -euo pipefail
          pip install -q pillow opencv-python-headless numpy fonttools
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Script'i kosu
        env:
          SCRIPT: ${{ inputs.script }}
          ARGS: ${{ inputs.args }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          case "$SCRIPT" in
            scripts/*) : ;;
            *) echo "HATA: script yolu scripts/ altinda olmali: $SCRIPT" >&2; exit 1 ;;
          esac
          case "$SCRIPT" in
            *..*) echo "HATA: script yolunda '..' olamaz." >&2; exit 1 ;;
          esac
          if [ ! -f "$SCRIPT" ]; then
            echo "HATA: script bulunamadi: $SCRIPT" >&2
            exit 1
          fi
          set -f            # ARGS icinde imzali URL olabilir; ? ve * glob olmasin
          # shellcheck disable=SC2086
          python "$SCRIPT" $ARGS

      - name: Onayli kilitleri depoya yaz
        if: inputs.kilit_commit == 'true'
        env:
          DAL: ${{ inputs.branch }}
          SCRIPT: ${{ inputs.script }}
        run: |
          set -euo pipefail
          IZIN="scripts/kisisel/onayli scripts/kisisel/ORAN_SABITLERI.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # shellcheck disable=SC2086
          git add -A -- $IZIN
          # Izin verilen yollarin disinda staged dosya olmamali.
          DISARIDA="$(git diff --cached --name-only \
            | grep -Ev '^scripts/kisisel/(onayli/|ORAN_SABITLERI\.json$)' || true)"
          if [ -n "$DISARIDA" ]; then
            echo "HATA: izin verilmeyen yollar staged:" >&2
            echo "$DISARIDA" >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "kilitlerde degisiklik yok, commit atlaniyor"
            exit 0
          fi
          git diff --cached --stat
          git commit -m "kisisel: onayli kilitler (Serdar onayi 22 Eyl 2026)" \
                     -m "Kosu: $SCRIPT (run ${GITHUB_RUN_ID})"
          git push origin "HEAD:${DAL}"
          echo "DOGRULAMA: $(git rev-parse --short HEAD) -> ${DAL}"
          git show --stat --oneline HEAD | head -40

      - name: Kosu ciktilarini artifact yap
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kisisel-pilot-out
          path: out/
          if-no-files-found: ignore
          retention-days: 7

      - name: Kimligi sil
        if: always()
        run: rm -rf ~/.config/rclone

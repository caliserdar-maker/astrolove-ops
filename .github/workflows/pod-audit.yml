name: pod-audit

# 78 POD ilaninin TAM DENETIMI - SALT OKUR (Mo 7 Eyl 2026). Etsy'ye HICBIR yazma yapmaz.
# Ilan basina 7 GET: listing, images, videos, inventory, translations/ru, variation-images, properties.
# Beklenen: sablon (docs/POD_LISTING_TEMPLATE.md) + sabitler + referans ilan (ARIES_LEO) ozellik haritasi.
# Cikti: yalniz sapma tablosu (AUDIT_REPORT.md) + audit_result.json. Kota quota_min altina inince durur.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "En fazla N ilan (0 = hepsi)"
        required: false
        default: "0"
      quota_min:
        description: "Kota tabani (altinda durur)"
        required: false
        default: "400"
      ref_id:
        description: "Referans ilan id (ozellik haritasi)"
        required: false
        default: "4570031205"

concurrency:
  group: etsy-token
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
      - name: Token ve STATE
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
          rclone copyto "gdrive:ASTROLOVE/TEMP/POD_LISTING/POD_LISTINGS_STATE.csv" _work/state.csv
          echo "verified ilan: $(grep -c ',verified,' _work/state.csv || true)"
      - name: Denetim (salt okur)
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          LIMIT: ${{ inputs.limit }}
          QMIN: ${{ inputs.quota_min }}
          REF_ID: ${{ inputs.ref_id }}
        run: |
          set -euo pipefail
          python scripts/etsy/pod_audit.py --state _work/state.csv --out _out \
            --limit "${LIMIT:-0}" --quota-min "${QMIN:-400}" --ref-id "${REF_ID:-4570031205}"
      - name: Token/cikti Drive'a
        if: ${{ always() }}
        run: |
          set -euo pipefail
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "Token geri yazildi" || true
          stamp=$(TZ=Europe/Istanbul date +%Y%m%d_%H%M)
          [ -d _out ] && rclone copy _out "gdrive:ASTROLOVE/TEMP/POD_LISTING/AUDIT_${stamp}" -q && echo "Cikti: TEMP/POD_LISTING/AUDIT_${stamp}/"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: pod-audit
          path: _out/
          if-no-files-found: ignore
      - if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

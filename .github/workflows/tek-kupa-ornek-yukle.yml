name: tek-kupa-ornek-yukle
# Tek kupa ornegi (21 Eki 2026, yalniz CANCER_LIBRA): yerelde uretilen KAPAK_TEK, GALERI2_ON_ARKA, PIN_TEK, ONIZLEME_KIRPIM,
# OLCUM.txt gecici/tek-kupa-ornek dalindan Drive ASTROLOVE/TEMP/TEK_KUPA_ORNEK_20261021/ klasorune kopyalanir.
# Etsy / Metricool / Pinterest yok; yalniz Drive'a dosya kopyasi. Uretim kodu: scripts/sosyal/tek_kupa_ornek.py
permissions:
  contents: read
on:
  workflow_dispatch:
jobs:
  yukle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      O: gdrive:ASTROLOVE/TEMP/TEK_KUPA_ORNEK_20261021
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gecici/tek-kupa-ornek
      - name: Yukle
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          sha256sum -c TEK.sha256
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            export RCLONE_CONFIG_GDRIVE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET"; fi
          rclone copy TEK "$O" -q
          rclone lsl "$O"
      - if: always()
        run: rm -rf ~/.config/rclone

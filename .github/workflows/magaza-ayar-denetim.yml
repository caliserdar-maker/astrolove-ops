name: magaza-ayar-denetim

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: etsy-token
  cancel-in-progress: false

jobs:
  denetle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -q -r requirements.txt
      - run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: Tokenu salt okunur kaynaktan al
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone _work; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          [ -z "${GOOGLE_CLIENT_SECRET:-}" ] || echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
      - name: Magaza ayarlarini denetle (Etsy'ye yazma yok)
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          set -euo pipefail
          python scripts/etsy/magaza_ayar_denetim.py etsy _work/MAGAZA_SNAPSHOT.json
          python scripts/etsy/magaza_ayar_denetim.py denetle _work/MAGAZA_SNAPSHOT.json _work/MAGAZA_AYAR.csv _work/MAGAZA_AYAR_ONERI.txt || echo "::warning::denetimde FAIL var"
      - name: Token geri yaz (yalniz yenilendiyse)
        if: always()
        run: |
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" || true
      - name: TEMP raporlarini yaz
        if: always()
        run: |
          [ -f _work/MAGAZA_AYAR.csv ] && rclone copyto _work/MAGAZA_AYAR.csv "gdrive:ASTROLOVE/TEMP/MAGAZA_AYAR.csv" || true
          [ -f _work/MAGAZA_AYAR_ONERI.txt ] && rclone copyto _work/MAGAZA_AYAR_ONERI.txt "gdrive:ASTROLOVE/TEMP/MAGAZA_AYAR_ONERI.txt" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: magaza-ayar-denetim
          path: |
            _work/MAGAZA_AYAR.csv
            _work/MAGAZA_AYAR_ONERI.txt
      - if: always()
        run: rm -rf _work ~/.config/rclone

name: sosyal-takvim-plan-v2
# Sosyal takvim PLANI v2 + KURU uygulama (Serdar kararlari 20 Eki 2026). Metricool'a YAZMA YOK, Etsy'ye YAZMA YOK.
# 1) Etsy: 4 kupa + 4 yil donumu ilaninin state'i, tek GET /listings/batch (scripts/etsy/ilan_durum_oku.py; kilit_bekle, kota tabani 10).
# 2) Metricool: bekleyen IG/FB/Threads/TikTok/YouTube (yalniz GET) -> 28 Eki'den P K Y P K Y P sirasi, yalniz active ilanlarin
#    yeri acilir, yerinden cikan poster grubu 29 Ara'dan ardisik gunlere (ayni saat). Medya adaylari Drive'dan indirilip olculur.
# scripts/sosyal/analiz/takvim_v2.py. Cikti Drive TEMP/SOSYAL_TAKVIM_PLAN_20261020/V2/ (PLAN_V2.csv, OZET_V2.txt,
# KURU_UYGULAMA.txt, KURU_ISTEKLER.json, ETSY_DURUM.json).
permissions:
  actions: read
  contents: read
on:
  workflow_dispatch:
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      O: gdrive:ASTROLOVE/TEMP/SOSYAL_TAKVIM_PLAN_20261020/V2
      T: gdrive:ASTROLOVE/TEMP
      IDS: "4598525642,4598523005,4598541811,4598525779,4595350971,4595377314,4595402683,4595364151"
    steps:
      - uses: actions/checkout@v4
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2 pillow==11.0.0
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          command -v ffprobe >/dev/null || { sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq ffmpeg >/dev/null; }
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone _work _out; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Etsy ilan durumu (yalniz GET)
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          set -euo pipefail
          umask 077
          rclone copyto "$T/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
          python3 scripts/etsy/ilan_durum_oku.py --ids "$IDS" --out _out/ETSY_DURUM.json
      - name: Token geri yaz
        if: always()
        run: |
          set -euo pipefail
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "$T/ETSY_TOKEN.json" && echo "Token geri yazildi" || echo "Token yenilenmedi"
          rm -f _work/ETSY_TOKEN.json _work/ETSY_TOKEN.json.updated
      - name: Medya adaylari (indir + liste)
        run: |
          set -euo pipefail
          inc=(); for c in CANCER_LIBRA AQUARIUS_LIBRA SCORPIO_TAURUS ARIES_LIBRA; do inc+=(--include "*${c}*"); done
          echo '{}' > _work/ls.json
          for kv in "KUPA_KAPAK=KUPA_KAPAK_78_20261019/KAPAK" "Y1_KAPAK=KAPAK_Y1_78_20261019/KAPAK" "ILAN_VIDEO_KUPA=ILAN_VIDEO_78_20261020/KUPA" \
                    "ILAN_VIDEO_YD=ILAN_VIDEO_78_20261020/YILDONUMU" "YD_REEL=SOSYAL_VIDEO_YD_ORNEK_20261020"; do
            k=${kv%%=*}; y=${kv#*=}
            rclone lsjson "$T/$y" -R --files-only "${inc[@]}" > _work/l.json 2>/dev/null || echo '[]' > _work/l.json
            rclone copy "$T/$y" "_work/m/$k" "${inc[@]}" -q || true
            python3 -c "import json,sys;d=json.load(open('_work/ls.json'));d[sys.argv[1]]=json.load(open('_work/l.json'));json.dump(d,open('_work/ls.json','w'))" "$k"
            echo "$k ($y): $(python3 -c "import json;print(len(json.load(open('_work/l.json'))))") dosya"
          done
      - name: Plan + KURU (Metricool yalniz GET)
        env:
          MC_TOK: ${{ secrets.METRICOOL_USER_TOKEN }}
        run: |
          set -uo pipefail
          umask 077
          [ -n "${MC_TOK:-}" ] || { echo "::error::METRICOOL_USER_TOKEN bos"; exit 1; }
          echo "::add-mask::$MC_TOK"
          rclone copyto "$T/METRICOOL_TOKEN.json" _work/kimlik.json
          python3 -c "import json,os;d=json.load(open('_work/kimlik.json'));json.dump({'userToken':os.environ['MC_TOK'],'userId':d['userId'],'blogId':d['blogId']},open('_work/mc.json','w'))"
          python3 -c "import json;print('::add-mask::'+json.load(open('_work/kimlik.json'))['userToken'])"
          python3 scripts/sosyal/analiz/takvim_v2.py _work/mc.json _out --durum _out/ETSY_DURUM.json --medya-ls _work/ls.json --medya-dir _work/m \
            | python3 scripts/guvenlik/sir_koru.py tee --sir-json _work/mc.json --sir-json _work/kimlik.json "$GITHUB_STEP_SUMMARY"
          rc=${PIPESTATUS[0]}
          mkdir -p _work/engel
          find _out -type f | while read -r f; do
            python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/mc.json --sir-json _work/kimlik.json "$f" >/dev/null 2>&1 \
              || { echo "TARAMA GECMEDI (Drive'a gitmez): $(basename "$f")"; mv "$f" _work/engel/; }
          done
          python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/mc.json --sir-json _work/kimlik.json _out || exit 1
          rclone copy _out "$O" -q
          rclone lsl "$O" --exclude "HAM_*" | python3 scripts/guvenlik/sir_koru.py tee --sir-json _work/mc.json "$GITHUB_STEP_SUMMARY"
          exit $rc
      - if: always()
        run: |
          rm -rf _work ~/.config/rclone
          if [ -f "$RUNNER_TEMP/SIR_ENGEL" ]; then echo "::error::sir iceren satir engellendi (sir_koru)"; exit 1; fi

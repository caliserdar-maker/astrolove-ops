name: wa-video-kare
# ETSY API YOK, KILITSIZ (KILIT SURESI kurali): wa-video-oku kaydindan canli video ilk/son kare <-> canli kapak ve <-> v7d kaynak kare farki.
# Kod: scripts/etsy/wa_video_kare.py. Girdi: TEMP/<klasor>/VIDEO_KAYIT.json + TEMP/VIDEO_V7D_YUKLE_KAYNAK/20261030_144551/*.mp4.
# Cikti: ayni klasorde KARE/ (TABLO.csv + ornek kareler). Esik yok; degerler raporlanir.
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      klasor: {description: "TEMP altinda WA_VIDEO_KONTROL_<damga>", required: true}
jobs:
  kare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Girdi kapisi
        env: {K: "${{ inputs.klasor }}"}
        run: '[[ "$K" =~ ^WA_VIDEO_KONTROL_[0-9]{8}_[0-9]{6}$ ]] || { echo "::error::klasor"; exit 1; }'
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q numpy==2.1.3 pillow==11.0.0
          sudo apt-get install -y -qq ffmpeg >/dev/null
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || { sudo apt-get install -y -qq rclone >/dev/null; }
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Girdiler
        env: {K: "${{ inputs.klasor }}"}
        run: |
          set -euo pipefail
          mkdir -p _in/v7d _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/$K/VIDEO_KAYIT.json" _in/VIDEO_KAYIT.json
          rclone copy "gdrive:ASTROLOVE/TEMP/VIDEO_V7D_YUKLE_KAYNAK/20261030_144551" _in/v7d --include "*.mp4" --transfers 8 -q
          echo "v7d: $(ls _in/v7d | wc -l)"
      - name: Kare olcumu
        run: python3 scripts/etsy/wa_video_kare.py --kayit _in/VIDEO_KAYIT.json --v7d-dir _in/v7d --out _out
      - name: Drive'a
        if: ${{ always() }}
        env: {K: "${{ inputs.klasor }}"}
        run: |
          [ -d _out ] && rclone copy _out "gdrive:ASTROLOVE/TEMP/$K/KARE" --immutable -q && echo "::notice title=WAKARE::TEMP/$K/KARE/"
          rm -rf ~/.config/rclone

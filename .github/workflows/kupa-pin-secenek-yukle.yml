name: kupa-pin-secenek-yukle
# Kupa pin secenekleri (20 Eki 2026, Serdar izni, tek kosu): yerelde uretilen S1, S3, KONTAK_SECENEK, YAKIN_*, OLCUM.txt
# gecici/kupa-pin-secenek dalindan Drive ASTROLOVE/TEMP/KUPA_PIN_ORNEK_20261020/SECENEK/ klasorune kopyalanir. S2 elendi.
# Etsy / Metricool / Pinterest yok; yalniz Drive'a dosya kopyasi.
permissions:
  contents: read
on:
  workflow_dispatch:
jobs:
  yukle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      O: gdrive:ASTROLOVE/TEMP/KUPA_PIN_ORNEK_20261020/SECENEK
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gecici/kupa-pin-secenek
      - name: Yukle
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          sha256sum -c SECENEK.sha256
          test ! -e SECENEK/S2.jpg
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            export RCLONE_CONFIG_GDRIVE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET"; fi
          rclone copy SECENEK "$O" -q
          rclone lsl "$O"
      - if: always()
        run: rm -rf ~/.config/rclone

name: pod-referans-ornek

# Referans (Aquarius+Gemini) kapak/video hattini TOPLU betikle 4 ornek ilanda
# yerel olarak uretir. Etsy'ye YAZMA YOK: yalniz GET; betikte --apply devre disi.
# Cikti: ASTROLOVE/TEMP/POD_REFERANS_ORNEK/

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      only_ids:
        description: "Virgullu ilan kimlikleri (bos = referans + 4 ornek)"
        required: false
        default: "4570112095,4570126104,4570125580,4570031205,4570224058"

concurrency:
  group: etsy-token
  cancel-in-progress: false

jobs:
  ornek:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ONLY_IDS: ${{ inputs.only_ids }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2 numpy==2.1.3 pillow==11.0.0 scipy==1.14.1
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Token
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
      - name: 'Uretim (kuru deneme, yazma kodu yok)'
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          set -euo pipefail
          python scripts/pod/pod_referans_hatti_batch.py \
            --catalog scripts/etsy/seo/pod_changes_v2.json --out _out \
            --only-ids "$ONLY_IDS" --dry-run
      - name: 'Karsilastirma gorseli + TARIF.md'
        run: |
          set -euo pipefail
          python scripts/pod/pod_referans_ornek_rapor.py \
            --uretim _out/URETIM_SONUC.json --out _out
      - name: Token geri yazma + cikti Drive'a
        if: ${{ always() }}
        run: |
          set -euo pipefail
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "Token geri yazildi" || true
          rm -rf _out/_is _out/_kare
          if grep -rqE '"(access_token|refresh_token)"[[:space:]]*:[[:space:]]*"[A-Za-z0-9._-]{20,}"|x-api-key[[:space:]]*:[[:space:]]*[A-Za-z0-9_-]{16,}|GOCSPX-[A-Za-z0-9_-]{10,}' _out/ 2>/dev/null; then
            echo "::error::ciktida sir DEGERI bulundu, Drive'a yazilmadi"; exit 1
          fi
          rclone copy _out "gdrive:ASTROLOVE/TEMP/POD_REFERANS_ORNEK" -q
          rclone lsf "gdrive:ASTROLOVE/TEMP/POD_REFERANS_ORNEK"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: pod-referans-ornek
          path: _out/
          if-no-files-found: ignore
      - if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

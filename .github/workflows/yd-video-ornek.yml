name: yd-video-ornek
# YD (1st Anniversary) ilan videosu ORNEGI (Merkez 27 Eki gorev B): tek cift, poster v7b ile ayni sure ve tarz (1440x1080, 6 sn).
# ETSY API YOK, Canva yok, kilit yok, Etsy'ye yukleme yok. Girdi: Drive TEMP/YD_KAPAK_V1/<kapak_damga>/<CIFT>_Y01.jpg (yd-ornek-indir).
# Uretim sosyal/poster_video/yd_video.py (v7b motoru birebir + YD sahne ayristirmasi; v7 78 ile ayni ortam: V7_DOLGU=nk, V6_C,
# V6_N 58000 x bolge / 44274). QC v7_qc.py (a-e + silinme_hayalet; d kutu orani v7 posteri 1,29-1,31 icin, YD 4:5 posterde bilgi).
# Cikti: Drive TEMP/YD_VIDEO_ORNEK/<damga>/ <CIFT>_yd_video.mp4, ONIZLEME.png (2,5 sn karesi, PNG < 290 KB, 300 KB sinirina pay), KONTAK.jpg, QC.json,
# ic.json, uretim.log.
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      kapak_damga: {description: "TEMP/YD_KAPAK_V1/<damga>", required: true, default: "20261027_141146"}
      cift: {description: "CIFT (yd78_ids.csv)", required: true, default: "CANCER_LIBRA"}
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Girdi kapisi
        env: {KD: "${{ inputs.kapak_damga }}", C: "${{ inputs.cift }}"}
        run: '[[ "$KD" =~ ^[0-9]{8}_[0-9]{6}$ && "$C" =~ ^[A-Z]+_[A-Z]+$ ]] || { echo "::error::girdi"; exit 1; }'
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kurulum
        timeout-minutes: 15
        run: |
          set -euo pipefail
          pip install -q numpy==2.1.3 pillow==11.0.0 scipy==1.14.1 opencv-python-headless==4.10.0.84
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg fonts-dejavu-core >/dev/null
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || { sudo apt-get install -y -qq rclone >/dev/null; }
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Uretim + QC
        env: {KD: "${{ inputs.kapak_damga }}", C: "${{ inputs.cift }}"}
        run: |
          set -euo pipefail
          grep -q ",$C," data/pod/yd78_ids.csv || grep -q ",$C$" data/pod/yd78_ids.csv || { echo "::error::cift yd78_ids.csv'de yok"; exit 1; }
          mkdir -p _w _o
          rclone copyto "gdrive:ASTROLOVE/TEMP/YD_KAPAK_V1/$KD/${C}_Y01.jpg" _w/KAPAK.jpg -q
          V7_DOLGU=nk V6_C=sosyal/poster_video/v6_c_egri.json V6_N=58000 V6_BOLGE_REF=44274 V6_N_REF=58000 \
            python3 -I sosyal/poster_video/yd_video.py _w/KAPAK.jpg "_o/${C}_yd_video.mp4" > _o/uretim.log 2>&1 || { tail -20 _o/uretim.log; exit 1; }
          grep -v '^  kare' _o/uretim.log
          set +e; python3 -I sosyal/poster_video/v7_qc.py "_o/${C}_yd_video.mp4" _w/KAPAK.jpg _o/uretim.log _w/qc; QC=$?; set -e
          cp _w/qc/QC.json _w/qc/KONTAK.jpg _o/; mv "_o/${C}_yd_video.mp4.ic.json" _o/ic.json; rm -f _o/*.sembol_maske.png
          ffmpeg -v error -y -ss 2.5 -i "_o/${C}_yd_video.mp4" -frames:v 1 _w/kare.png
          python3 - <<'PY'
          from PIL import Image
          import os
          im = Image.open("_w/kare.png").convert("RGB")
          for w in (960, 800, 720, 640, 560, 480):   # once tam renk, sigmazsa 256 renk paletli (yerel: 720 paletli 249 KB)
              k = im.resize((w, w * 3 // 4), Image.LANCZOS)
              for tur, x in (("RGB", k), ("P256", k.quantize(256, method=Image.Quantize.MEDIANCUT))):
                  x.save("_o/ONIZLEME.png", optimize=True); b = os.path.getsize("_o/ONIZLEME.png")
                  if b < 290_000:
                      break
              if b < 290_000:
                  break
          print(f"ONIZLEME.png {w}x{w * 3 // 4} {tur} {b} bayt"); assert b < 290_000
          PY
          echo "QC_CIKIS=$QC" >> "$GITHUB_ENV"
          echo "DAMGA=$(date -u +%Y%m%d_%H%M%S)" >> "$GITHUB_ENV"
      - name: Drive'a yaz
        run: |
          set -euo pipefail
          rclone copy _o "gdrive:ASTROLOVE/TEMP/YD_VIDEO_ORNEK/${DAMGA:?}" --immutable -q
          { echo "Cikti: TEMP/YD_VIDEO_ORNEK/$DAMGA (v7_qc cikis $QC_CIKIS)"; python3 -c "
          import json; q = json.load(open('_o/QC.json'))
          for k, v in q['kontrol'].items(): print(k, 'PASS' if v['gecti'] else 'FAIL', json.dumps(v.get('deger'))[:160])"; } | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: rm -rf _w _o ~/.config/rclone

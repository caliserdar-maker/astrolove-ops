name: yd-video-ornek
# YD (1st Anniversary) ilan videosu ORNEGI (Merkez 27 Eki gorev B): tek cift, poster v7b ile ayni sure ve tarz (1440x1080, 6 sn).
# ETSY API YOK, Canva yok, kilit yok, Etsy'ye yukleme yok. Girdi: Drive TEMP/YD_KAPAK_V1/<kapak_damga>/<CIFT>_Y01.jpg (yd-ornek-indir).
# Uretim sosyal/poster_video/yd_video.py (v7b motoru birebir + YD sahne ayristirmasi; v7 78 ile ayni ortam: V7_DOLGU=nk, V6_C,
# V6_N 58000 x bolge / 44274). QC v7_qc.py (a-e + silinme_hayalet). d kutu orani esigi (1,29-1,31) v7 posterine ozgu; YD 4:5 icin
# gecerli degil ve YD kapisi tanimli degil: sonuc oldugu gibi FAIL raporlanir (esik degisikligi yalniz Serdar onayiyla). Ek olcum
# MESAJ.json (inceleme 27 Eki): 0,5 sn karesinde mesaj yazisinin (kapakta oran > 0,3) hala koyu kalan orani; esik yok, olcum.
# Cikti: Drive TEMP/YD_VIDEO_ORNEK/<damga>/ <CIFT>_yd_video.mp4, ONIZLEME.png (2,5 sn karesi, PNG < 290 KB, 300 KB sinirina pay), KONTAK.jpg, QC.json,
# ic.json, uretim.log.
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      kapak_damga: {description: "TEMP/YD_KAPAK_V1/<damga>", required: true, default: "20261027_141146"}
      cift: {description: "CIFT (yd78_ids.csv)", required: true, default: "CANCER_LIBRA"}
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Girdi kapisi
        env: {KD: "${{ inputs.kapak_damga }}", C: "${{ inputs.cift }}"}
        run: '[[ "$KD" =~ ^[0-9]{8}_[0-9]{6}$ && "$C" =~ ^[A-Z]+_[A-Z]+$ ]] || { echo "::error::girdi"; exit 1; }'
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 27 Eki kosu 40554449316: tek 'Kurulum' adimi 15 dk'ya dayandi (apt / pip / rclone; 26 Eki v7-78'de de). Adimlar ayrildi,
      # ffmpeg once apt index yenilemeden denenir (takilan genelde 'apt-get update').
      - name: pip
        timeout-minutes: 6
        run: pip install -q numpy==2.1.3 pillow==11.0.0 scipy==1.14.1 opencv-python-headless==4.10.0.84
      - name: ffmpeg
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo apt-get -qq install -y --no-install-recommends ffmpeg >/dev/null 2>&1 \
            || { sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y --no-install-recommends ffmpeg >/dev/null; }
          ffmpeg -version | sed -n 1p; ffprobe -version | sed -n 1p
      - name: rclone
        timeout-minutes: 6
        run: curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || { sudo apt-get install -y -qq rclone >/dev/null; }
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Uretim + QC
        env: {KD: "${{ inputs.kapak_damga }}", C: "${{ inputs.cift }}"}
        run: |
          set -euo pipefail
          grep -q ",$C," data/pod/yd78_ids.csv || grep -q ",$C$" data/pod/yd78_ids.csv || { echo "::error::cift yd78_ids.csv'de yok"; exit 1; }
          mkdir -p _w _o
          rclone copyto "gdrive:ASTROLOVE/TEMP/YD_KAPAK_V1/$KD/${C}_Y01.jpg" _w/KAPAK.jpg -q
          V7_DOLGU=nk V6_C=sosyal/poster_video/v6_c_egri.json V6_N=58000 V6_BOLGE_REF=44274 V6_N_REF=58000 \
            python3 -I sosyal/poster_video/yd_video.py _w/KAPAK.jpg "_o/${C}_yd_video.mp4" > _o/uretim.log 2>&1 || { tail -20 _o/uretim.log; exit 1; }
          grep -v '^  kare' _o/uretim.log
          set +e; python3 -I sosyal/poster_video/v7_qc.py "_o/${C}_yd_video.mp4" _w/KAPAK.jpg _o/uretim.log _w/qc; QC=$?; set -e
          for f in QC.json KONTAK.jpg; do [ -f "_w/qc/$f" ] && cp "_w/qc/$f" _o/ || echo "::warning::QC $f yok"; done
          mv "_o/${C}_yd_video.mp4.ic.json" _o/ic.json; rm -f _o/*.sembol_maske.png
          ffmpeg -v error -y -ss 0.5 -i "_o/${C}_yd_video.mp4" -frames:v 1 _w/k05.png
          python3 - <<'PY'
          import json, re
          import numpy as np, cv2
          from PIL import Image
          log = open("_o/uretim.log").read()
          px, py_, pw = map(int, re.search(r"poster kapakta (\d+),(\d+) (\d+)x", log).groups())
          mx, my, mw, mh = map(int, re.search(r"YD mesaj: .*kutu \((\d+), (\d+), (\d+), (\d+)\)", log).groups())
          s = pw / 2000; f = 1440 / 3000
          xa, ya, xb, yb = [int(round(v * f)) for v in (px + mx * s, py_ + my * s, px + (mx + mw) * s, py_ + (my + mh) * s)]
          k = cv2.resize(np.asarray(Image.open("_w/KAPAK.jpg").convert("RGB")), (1440, 1080), interpolation=cv2.INTER_AREA).astype(np.float32)
          bg = cv2.medianBlur(k.astype(np.uint8), 31).astype(np.float32); ink = np.float32([47, 70, 56])
          def oran(im):
              v = ink - bg
              return ((im - bg) * v).sum(2) / np.maximum((v * v).sum(2), 1)
          yazi = oran(k)[ya:yb, xa:xb] > 0.3
          fr = np.asarray(Image.open("_w/k05.png").convert("RGB")).astype(np.float32)
          kal = float((oran(fr)[ya:yb, xa:xb][yazi] > 0.3).mean())
          json.dump(dict(kutu_video=[xa, ya, xb, yb], yazi_px=int(yazi.sum()), sn=0.5, hala_koyu_orani=round(kal, 3)), open("_o/MESAJ.json", "w"))
          print(f"MESAJ silinme (0,5 sn): yazi {int(yazi.sum())} px, hala koyu orani {kal:.3f}")
          PY
          ffmpeg -v error -y -ss 2.5 -i "_o/${C}_yd_video.mp4" -frames:v 1 _w/kare.png
          python3 - <<'PY'
          from PIL import Image
          import os
          im = Image.open("_w/kare.png").convert("RGB")
          for w in (960, 800, 720, 640, 560, 480):   # once tam renk, sigmazsa 256 renk paletli (yerel: 720 paletli 249 KB)
              k = im.resize((w, w * 3 // 4), Image.LANCZOS)
              for tur, x in (("RGB", k), ("P256", k.quantize(256, method=Image.Quantize.MEDIANCUT))):
                  x.save("_o/ONIZLEME.png", optimize=True); b = os.path.getsize("_o/ONIZLEME.png")
                  if b < 290_000:
                      break
              if b < 290_000:
                  break
          print(f"ONIZLEME.png {w}x{w * 3 // 4} {tur} {b} bayt"); assert b < 290_000
          PY
          echo "QC_CIKIS=$QC" >> "$GITHUB_ENV"
          echo "DAMGA=$(date -u +%Y%m%d_%H%M%S)" >> "$GITHUB_ENV"
      - name: Drive'a yaz
        run: |
          set -euo pipefail
          rclone copy _o "gdrive:ASTROLOVE/TEMP/YD_VIDEO_ORNEK/${DAMGA:?}" --immutable -q
          { python3 -c "
          import json; q = json.load(open('_o/QC.json')); f = [k for k, v in q['kontrol'].items() if not v['gecti']]
          print('QC SONUC: ' + ('FAIL (' + ', '.join(f) + ')' if f else 'PASS'))
          print('Cikti: TEMP/YD_VIDEO_ORNEK/$DAMGA (v7_qc cikis $QC_CIKIS)')
          for k, v in q['kontrol'].items(): print(k, 'PASS' if v['gecti'] else 'FAIL', json.dumps(v.get('deger'))[:160])
          print('MESAJ', open('_o/MESAJ.json').read())"; } | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: rm -rf _w _o ~/.config/rclone

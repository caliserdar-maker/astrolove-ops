name: wp-zip-verify

# TESLIM ZIP'LERI DOGRULAMA (SALT OKUR) - 4 Eyl 2026.
# DELIVERY'deki 312 ZIP cift cift indirilir, acilir ve olculur; hicbir sey
# yazilmaz, Etsy'ye dokunulmaz. Cikti: TEMP/WP_ZIP_VERIFY.csv + rapor.

on:
  workflow_dispatch:
    inputs:
      sample:
        description: "PDF sayfa sayisi acilacak ornek ZIP adedi"
        required: true
        default: "5"

concurrency:
  group: wp-zip-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null

      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi

      - name: Girdiler (cift listesi + referans dosyalar)
        run: |
          set -euo pipefail
          mkdir -p _work
          rclone copyto "gdrive:ASTROLOVE/TEMP/WA_WP_DRAFTS_STATE.csv" _work/drafts.csv
          cut -d, -f1 _work/drafts.csv | sed '/^$/d' > _work/pairs.txt
          wc -l < _work/pairs.txt
          rclone copyto "gdrive:ASTROLOVE/TEMP/LICENSE.txt" _work/LICENSE.txt
          rclone copyto "gdrive:ASTROLOVE/TEMP/HOW_TO_SET_YOUR_WALLPAPER.pdf" _work/HOW_TO_SET_YOUR_WALLPAPER.pdf

      - name: Dogrula
        run: |
          set -euo pipefail
          python scripts/etsy/wp_zip_verify.py --pairs-file _work/pairs.txt \
            --license _work/LICENSE.txt --guide _work/HOW_TO_SET_YOUR_WALLPAPER.pdf \
            --sample "${{ inputs.sample }}" --work _work/verify \
            --out _work/WP_ZIP_VERIFY.csv | tee _work/rapor.txt

      - name: Sonuclari Drive'a yaz
        if: ${{ always() }}
        run: |
          set -euo pipefail
          [ -f _work/WP_ZIP_VERIFY.csv ] && rclone copyto _work/WP_ZIP_VERIFY.csv "gdrive:ASTROLOVE/TEMP/WP_ZIP_VERIFY.csv" || true
          [ -f _work/rapor.txt ] && rclone copyto _work/rapor.txt "gdrive:ASTROLOVE/TEMP/WP_ZIP_VERIFY.txt" || true
          tail -30 _work/rapor.txt || true

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: wp-zip-verify
          path: |
            _work/WP_ZIP_VERIFY.csv
            _work/rapor.txt
          if-no-files-found: ignore

      - name: Temizlik
        if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

name: yildonumu-video-78
# 78 yil donumu ilan videosu (20 Eki 2026, Serdar ornek onayi): yildonumu_video.py (f57fd17) ile birebir; sahne =
# KAPAK_Y1_78_20261019/KAPAK/<CIFT>.jpg; toz rengi her kapagin kendi sembol murekkebi (%78) + acik vurgu (%22).
# N: 49200 x bolge / CL Y1 bolgesi; 2,0-4,0 sn +-%10 tutmazsa tek duzeltme turu (yildonumu_qc.py YD_TOPLU=1).
# Etsy'ye ve Metricool'a YAZMA YOK. Cikti: Drive ASTROLOVE/TEMP/ILAN_VIDEO_78_20261020/YILDONUMU/ (78 mp4, KONTROL_YD.csv,
# OZET_YD.txt, KONTAK_YD_*.jpg) + ILAN_VIDEO_78_20261020/YUKLEME_LISTESI.csv'ye 78 yildonumu satiri.
permissions:
  contents: write   # yalniz poster-video-onizleme dalina
on:
  workflow_dispatch:
    inputs:
      ciftler:
        description: 'TUMU ya da virgulle CIFT listesi'
        default: 'TUMU'
      grup:
        description: 'paralel is sayisi'
        default: '13'
env:
  O: gdrive:ASTROLOVE/TEMP/ILAN_VIDEO_78_20261020
  K: gdrive:ASTROLOVE/TEMP/KAPAK_Y1_78_20261019/KAPAK
jobs:
  liste:
    runs-on: ubuntu-latest
    outputs:
      matris: ${{ steps.m.outputs.matris }}
    steps:
    - id: m
      env:
        CIFTLER: ${{ inputs.ciftler }}
        GRUP: ${{ inputs.grup }}
      run: |
        python3 - <<'EOF'
        import itertools, json, os, re
        Z = ['ARIES', 'TAURUS', 'GEMINI', 'CANCER', 'LEO', 'VIRGO', 'LIBRA', 'SCORPIO', 'SAGITTARIUS', 'CAPRICORN', 'AQUARIUS', 'PISCES']
        tum = sorted('_'.join(sorted(p)) for p in itertools.combinations_with_replacement(Z, 2))
        g = os.environ['CIFTLER'].strip()
        sec = tum if g.upper() == 'TUMU' else [c.strip().upper() for c in re.split(r'[,\s]+', g) if c.strip()]
        assert not [c for c in sec if c not in tum], 'bilinmeyen cift'
        n = max(1, min(int(os.environ['GRUP']), len(sec)))
        m = {'include': [{'no': i + 1, 'ciftler': ' '.join(sec[i::n])} for i in range(n) if sec[i::n]]}
        print(json.dumps(m)); open(os.environ['GITHUB_OUTPUT'], 'a').write('matris=' + json.dumps(m) + '\n')
        EOF

  uret:
    needs: liste
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.liste.outputs.matris) }}
    name: uret ${{ matrix.no }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Kurulum
      run: |
        set -euo pipefail
        pip install -q numpy==2.1.3 pillow==11.0.0 scipy==1.14.1 opencv-python-headless==4.10.0.84
        sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg fonts-dejavu-core >/dev/null
        curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
    - name: rclone.conf
      env:
        RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      run: |
        set -euo pipefail
        mkdir -p ~/.config/rclone; umask 077
        printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
        if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "::add-mask::$GOOGLE_CLIENT_SECRET"
          grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true; fi
    - name: Uret + kontrol + Drive
      env:
        CIFTLER: ${{ matrix.ciftler }}
      run: |
        set +e -uo pipefail
        mkdir -p _o _k
        T0=$(date +%s); N=$(echo $CIFTLER | wc -w); I=0; HATA=0
        for C in $CIFTLER; do
          I=$((I+1))
          rclone copyto "$K/$C.jpg" "_k/$C.jpg" -q || { echo "::error::$C kapak yok"; HATA=1; continue; }
          YD_TOPLU=1 python3 -I sosyal/poster_video/yildonumu_qc.py "_k/$C.jpg" "$C" _o _w/is || { echo "::error::$C uretim hatasi"; HATA=1; }
          [ -f "_o/${C}_yd_video.mp4" ] && { rclone copy "_o/${C}_yd_video.mp4" "$O/YILDONUMU" -q || { echo "::error::$C drive"; HATA=1; }; }
          rm -f "_o/${C}_yd_video.mp4" "_k/$C.jpg"; rm -rf _w/is
          G=$(( $(date +%s) - T0 )); echo "[$I/$N %$((100*I/N))] $C (gecen ${G}s, kalan ~$(( G*(N-I)/I ))s)"
        done
        echo "HATA=$HATA" >> "$GITHUB_ENV"
    - uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: yd-satir-${{ matrix.no }}
        path: |
          _o/satir
          _o/kare
        if-no-files-found: warn
    - name: Sonuc
      if: ${{ always() }}
      run: |
        rm -rf _w _k ~/.config/rclone
        [ "${HATA:-1}" = "0" ]

  rapor:
    needs: uret
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Kurulum
      run: |
        set -euo pipefail
        pip install -q pillow==11.0.0
        sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg fonts-dejavu-core >/dev/null
        curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
    - name: rclone.conf
      env:
        RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      run: |
        set -euo pipefail
        mkdir -p ~/.config/rclone; umask 077
        printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
        if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "::add-mask::$GOOGLE_CLIENT_SECRET"
          grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true; fi
    - uses: actions/download-artifact@v4
      with:
        pattern: yd-satir-*
        path: _a
        merge-multiple: true
    - name: KONTROL_YD + kontak + YUKLEME_LISTESI + Drive
      run: |
        set +e -uo pipefail
        mkdir -p _v _r
        rclone copy "$O/YILDONUMU" _v -q --include '*_yd_video.mp4'
        rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_ILK_GORSEL_20261019/ILANLAR.csv" _ilanlar.csv -q
        rclone copyto "$O/YUKLEME_LISTESI.csv" _yl.csv -q
        echo "video $(ls _v | wc -l), satir $(ls _a/satir 2>/dev/null | wc -l)"
        python3 -I sosyal/poster_video/yildonumu78_rapor.py _a/satir _a/kare _v _ilanlar.csv _yl.csv _r | tee _r_log.txt; RC=${PIPESTATUS[0]}
        sed 's/^/::warning::OZET /' _r/OZET_YD.txt | cut -c1-3000
        mkdir -p _r/SATIR_YD && cp _a/satir/*.json _r/SATIR_YD/ 2>/dev/null
        rclone copy _r "$O/YILDONUMU" -q --exclude 'YUKLEME_LISTESI.csv'
        [ -s _r/YUKLEME_LISTESI.csv ] && rclone copyto _r/YUKLEME_LISTESI.csv "$O/YUKLEME_LISTESI.csv" -q
        echo "::warning::DRIVE YILDONUMU mp4 $(rclone lsf "$O/YILDONUMU" --files-only --include '*.mp4' | wc -l), $(rclone lsf "$O/YILDONUMU" --files-only --exclude '*.mp4' | tr '\n' ' ')"
        echo "RC=$RC" >> "$GITHUB_ENV"
    - name: Onizleme dali
      if: ${{ always() }}
      run: |
        set +e -uo pipefail
        [ -d _r ] || exit 0
        B=poster-video-onizleme; PV=yildonumu78
        git config user.name "github-actions"; git config user.email "actions@github.com"
        for i in 1 2 3; do
          rm -rf _pvw; git worktree prune
          git fetch -q origin $B && git worktree add -q _pvw origin/$B || break
          rm -rf "_pvw/$PV"; mkdir -p "_pvw/$PV"; cp _r/*.jpg _r/*.csv _r/OZET_YD.txt "_pvw/$PV/"
          (cd _pvw && git add -A && git commit -qm "yil donumu 78 onizleme (kosu ${{ github.run_id }})" && git push -q origin HEAD:refs/heads/$B) && { echo "::warning::ONIZLEME $B/$PV"; break; }
          sleep 5
        done
    - name: Sonuc
      if: ${{ always() }}
      run: |
        rm -rf ~/.config/rclone _v
        [ "${RC:-1}" = "0" ]

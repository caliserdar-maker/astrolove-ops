name: kupa-siparis

# Orchard kupa siparisi -> Printful baski dosyasi (Serdar 19 Eki 2026). scripts/kupa_siparis/kupa_siparis.py
# Etsy'ye YAZMAZ (yalniz GET), musteriye DOKUNMAZ, Printful'a GONDERMEZ: kapilar PASS/GOZ ise baski + onizleme +
# PRINTFUL_TASLAK.json (confirm=false yuku) + musteri mesaji TASLAGI Drive ASTROLOVE/KUPA_SIPARIS/<receipt>/<transaction>/.
# Siparis BEKLETILMEZ (Serdar 19.10). Printful siparisini Serdar ELLE verir (ELLE_SIPARIS.txt); API gonderimi ve cron YOK.
# pod-order-router KUPA- SKU'larini POD disi sayip atlar (parse_tx); bu akis ondan bagimsizdir.
# Kod: kupa-orchard dali kupa_orchard/ (baski_kes, kontrol_burc, mesaj sablonlari). Sembol: kupa-printful-sonuc (yalniz okunur).
# printful-kupa-mockup.yml ve printful-kupa-tasarim.yml ile ILGISI YOK; onlar calistirilmaz.
# Depo HERKESE ACIK: log/annotation'da receipt yerine opak kod; isim/adres/mesaj ve baski dosyasi artifact'a konmaz.

permissions:
  actions: read
  contents: read

on:
  # Cron Serdar onayi ile acilir (13 Eki: router cron kapali; kupa yalniz dosya hazirlar, gondermez):
  # schedule:
  #   - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      receipt_id:
        description: "Tek receipt (yalniz rakam); bos = son N gunu tara"
        default: ""
      since_days:
        description: "Tarama: son N gun"
        default: "3"
      sahte_receipt:
        description: "Depodaki sahte receipt JSON (kuru deneme; Etsy okunmaz, STATE'e yazilmaz)"
        default: ""
      hedef:
        description: "Drive alt klasoru (ASTROLOVE/<hedef>)"
        default: "KUPA_SIPARIS"
      kod_ref:
        description: "kupa-orchard dalinda commit ya da dal"
        default: "0196e37a0447d61eab42b84778a56d9261b0b201"   # temiz/kupa-orchard (kupa_orchard/ birebir; A3 kiyasi 39850054681 PASS)

jobs:
  kilit:
    runs-on: ubuntu-latest
    timeout-minutes: 125
    outputs:
      atla: ${{ steps.k.outputs.atla }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/etsy/kilit_bekle.py
            .github/workflows
      - id: k
        name: Etsy kilidi (cron mesgulse atla, elle sira bekle)
        env:
          GH_TOKEN: ${{ github.token }}
          EV: ${{ github.event_name }}
          SAHTE: ${{ inputs.sahte_receipt }}
        run: |
          if [ -n "${SAHTE:-}" ]; then echo "atla=false" >> "$GITHUB_OUTPUT"; echo "sahte receipt: Etsy okunmaz, kilit gerekmez"
          elif [ "$EV" = "schedule" ]; then python3 scripts/etsy/kilit_bekle.py --mod atla
          else python3 scripts/etsy/kilit_bekle.py; fi

  uret:
    needs: kilit
    if: ${{ needs.kilit.outputs.atla != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.kod_ref || '0196e37a0447d61eab42b84778a56d9261b0b201' }}
          path: _kod
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Kurulum (kupa-orchard78 ile ayni surumler)
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq libraqm0 >/dev/null
          python -m pip install -q numpy==2.5.3 pillow==12.3.0 scipy==1.18.1 fonttools==4.60.1 requests==2.34.2
          python -c "from PIL import features; assert features.check('raqm'), 'raqm yok'"
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Token ve STATE
        if: ${{ inputs.sahte_receipt == '' }}
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
          rclone copyto "gdrive:ASTROLOVE/${{ inputs.hedef || 'KUPA_SIPARIS' }}/STATE.csv" _work/STATE.csv 2>/dev/null || echo "STATE yok; yeni baslar"
      - name: Uret, kapilar, Drive'a yaz
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          RID: ${{ inputs.receipt_id }}
          GUN: ${{ inputs.since_days || '3' }}
          SAHTE: ${{ inputs.sahte_receipt }}
          HEDEF: ${{ inputs.hedef || 'KUPA_SIPARIS' }}
        run: |
          set +e -uo pipefail     # FAIL kalem cikis 1 verir; Drive/STATE adimlari yine kosar, koşu sonda kirmizi (Serdar'a bildirim)
          args=(--kod _kod/kupa_orchard --cikti _out --drive "gdrive:ASTROLOVE/$HEDEF")
          if [ -n "${SAHTE:-}" ]; then args+=(--receipt-json "$SAHTE")
          elif [ -n "${RID:-}" ]; then [[ "$RID" =~ ^[0-9]+$ ]] || { echo "receipt yalniz rakam"; exit 1; }; args+=(--receipt-id "$RID" --state _work/STATE.csv)
          else args+=(--tara "$GUN" --state _work/STATE.csv); fi
          python scripts/kupa_siparis/kupa_siparis.py "${args[@]}"
          echo "KOD=$?" >> "$GITHUB_ENV"
      - name: Token/STATE Drive'a
        if: ${{ always() && inputs.sahte_receipt == '' }}
        run: |
          set -euo pipefail
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "Token geri yazildi" || true
          [ -s _work/STATE.csv ] && rclone copyto _work/STATE.csv "gdrive:ASTROLOVE/${{ inputs.hedef || 'KUPA_SIPARIS' }}/STATE.csv" && echo "STATE yazildi" || true
      - name: Sonuc
        if: ${{ always() }}
        run: |
          rm -rf _out _work ~/.config/rclone
          exit "${KOD:-1}"

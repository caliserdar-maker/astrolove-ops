name: galeri23-duzelt

# 23 eski galerili poster ilani, sira 8 galeri isi (Serdar 24 Eki B1-B3): PLAN ve ORNEK. Etsy'ye yazma YOK, Etsy API YOK, Etsy
# kilidi YOK (kilit kumesinde degil). Ilan basina AYRI is (matrix, is basina 30 dk; Serdar 24 Eki: 4 paralel tek is 90 dk'ya
# sigmadi, kosu 40073991943):
#   1) scripts/pod/kart_nokta_marka.py (kart_ilanlar): hedef kartlarin metin duzeltmesi + QC PASS/FAIL (olcum, kutle, TASMA,
#      bilesen, kutu disi fark, OCR)
#   2) duzeltilmis hedef = hedef yedek (yalniz manifest dosyalari) + PASS kartlar (duz_ilanlar); digerlerinde ozgun hedef
#   3) scripts/etsy/galeri_ornek.py: canli galeri (KART_SIL SONRA_<ilan>.json ya da envanter-oku SONRA) ile hedef: LISTE_<ilan>.csv/.md,
#      HEDEF_GALERI, YAN_YANA, DEGISEN (%100)
# Cikti Drive ASTROLOVE/TEMP/DENETIM_20261021/GALERI_PLAN23/DUZELT_<run_id>/<ilan>_<CIFT>/ + OZET.txt.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      ilanlar: {description: "virgullu ilan listesi ya da HEPSI (KOSU_20261021_1030 altindaki 23 ilan)", required: true, default: "4570155846"}
      haric: {description: "HEPSI'den cikarilacak ilanlar (virgullu)", required: false, default: ""}
      kart_ilanlar: {description: "kart metin duzeltmesi + tasma kontrolu (virgullu ya da HEPSI)", required: false, default: "4570155846"}
      duz_ilanlar: {description: "LISTE'si duzeltilmis kartlarla kurulacak ilanlar (digerleri ozgun hedefe gore)", required: false, default: "4570155846"}
      simdi_kosu: {description: "KART_SIL SONRA'si olmayan ilan icin envanter-oku kosusu (BURC_GIFT_20261022/envanter_oku_<kosu>/SONRA_<ilan>.json)", required: false, default: ""}

env:
  D: "gdrive:ASTROLOVE/TEMP"

jobs:
  liste:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Girdi
        run: |
          set -euo pipefail
          for v in "${{ inputs.ilanlar }}" "${{ inputs.kart_ilanlar }}"; do [[ "$v" =~ ^(HEPSI|[0-9]+(,[0-9]+)*)$ ]] || { echo "::error::girdi $v"; exit 1; }; done
          for v in "${{ inputs.haric }}" "${{ inputs.duz_ilanlar }}"; do [[ "$v" =~ ^([0-9]+(,[0-9]+)*)?$ ]] || { echo "::error::girdi $v"; exit 1; }; done
          [[ "${{ inputs.simdi_kosu }}" =~ ^[0-9]*$ ]] || { echo "::error::simdi_kosu"; exit 1; }
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - id: m
        name: Matrix
        run: |
          set -euo pipefail
          rclone lsf "$D/GALERI_YAYIN/KOSU_20261021_1030" --dirs-only | tr -d '/' | grep -E '^[0-9]+$' | sort > kosu.txt
          echo "KOSU_20261021_1030 ilan: $(wc -l < kosu.txt)"
          python3 - "${{ inputs.ilanlar }}" "${{ inputs.haric }}" <<'PY' >> "$GITHUB_OUTPUT"
          import csv, json, sys
          c = {r["listing_id"]: r["cift"] for r in csv.DictReader(open("data/pod/pod78_ids.csv"))}
          kosu = open("kosu.txt").read().split()
          sec = kosu if sys.argv[1] == "HEPSI" else sys.argv[1].split(",")
          haric = set(x for x in sys.argv[2].split(",") if x)
          bad = [l for l in sec if l not in kosu]
          assert not bad, f"KOSU_20261021_1030'da yok: {bad}"
          m = [dict(ilan=l, cift=c[l]) for l in sec if l not in haric]
          assert m, "bos liste"
          print("matrix=" + json.dumps(dict(include=m)))
          PY
          cat "$GITHUB_OUTPUT"
      - if: always()
        run: rm -rf ~/.config/rclone

  ilan:
    needs: liste
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJson(needs.liste.outputs.matrix) }}
    env:
      L: ${{ matrix.ilan }}
      C: ${{ matrix.cift }}
      KART_ILANLAR: ${{ inputs.kart_ilanlar }}
      DUZ_ILANLAR: ${{ inputs.duz_ilanlar }}
      SIMDI_KOSU: ${{ inputs.simdi_kosu }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kurulum
        run: |
          set -euo pipefail
          echo "S0=$(date +%s)" >> "$GITHUB_ENV"
          pip install -q numpy==2.1.3 pillow==11.0.0 scipy==1.14.1 opencv-python-headless==4.10.0.84
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y tesseract-ocr >/dev/null
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Fontlar + duvar + girdiler (yalniz manifest dosyalari)
        run: |
          set -euo pipefail
          mkdir -p fonts W/hedef W/duz O; base=https://raw.githubusercontent.com/google/fonts/main/ofl
          curl -fsSL --retry 3 "$base/ebgaramond/EBGaramond%5Bwght%5D.ttf" -o 'fonts/EBGaramond[wght].ttf'
          curl -fsSL --retry 3 "$base/lato/Lato-Regular.ttf" -o fonts/Lato-Regular.ttf
          cp 'assets/fonts/Montserrat[wght].ttf' fonts/
          python3 scripts/pod/duvar_zemin.py data/pod/kapak_sahne_v9.png guclu W/duvar.png acik3
          rclone copyto "$D/GALERI_YAYIN/KOSU_20261021_1030/$L/yedek/manifest.json" W/manifest.json
          python3 -c "import json;[print('%02d_%s.jpg' % (int(g['rank']), g['listing_image_id'])) for g in json.load(open('W/manifest.json'))['galeri']]" > W/dosyalar.txt
          rclone copy "$D/GALERI_YAYIN/YEDEK/${L}_${C}" W/hedef --files-from W/dosyalar.txt -q
          echo "hedef: $(ls W/hedef | wc -l) / $(wc -l < W/dosyalar.txt) dosya | $(( $(date +%s) - S0 )) sn"
          [ "$(ls W/hedef | wc -l)" = "$(wc -l < W/dosyalar.txt)" ] || { echo "::error::manifest dosyalari eksik"; exit 1; }
          cp W/hedef/*.jpg W/duz/
      - name: Kart duzeltme + tasma
        run: |
          set +e
          K=yok
          if [ "$KART_ILANLAR" = HEPSI ] || [[ ",$KART_ILANLAR," == *",$L,"* ]]; then
            python3 scripts/pod/kart_nokta_marka.py --hedef-dir W/hedef --manifest W/manifest.json --duvar W/duvar.png --fd fonts --cift $C --out O/KART > O/kart.log 2>&1
            K=$?; tail -20 O/kart.log | cut -c1-400
          fi
          DZ=ozgun
          if [[ ",$DUZ_ILANLAR," == *",$L,"* ]]; then cp O/KART/[0-9][0-9]_*.jpg W/duz/ 2>/dev/null; DZ=duzeltilmis; fi
          TAS=$(grep -c "TASMA" O/kart.log 2>/dev/null)
          echo "K=$K" >> "$GITHUB_ENV"; echo "DZ=$DZ" >> "$GITHUB_ENV"; echo "TAS=${TAS:-0}" >> "$GITHUB_ENV"
          echo "kart $K | tasma ${TAS:-0} | liste $DZ | $(( $(date +%s) - S0 )) sn"
      - name: Ornek (LISTE, HEDEF_GALERI, YAN_YANA, DEGISEN)
        run: |
          set +e
          S=$(rclone lsf -R "$D/DENETIM_20261021/KART_SIL" --include "SONRA_${L}.json" | sort -t/ -k1,1n | tail -1)
          G=SONRA_yok; SAY=; KY=yok
          if [ -n "$S" ] && rclone copyto "$D/DENETIM_20261021/KART_SIL/$S" W/simdi.json -q; then KY="KART_SIL/$S"
          elif [ -n "$SIMDI_KOSU" ] && rclone copyto "$D/BURC_GIFT_20261022/envanter_oku_$SIMDI_KOSU/SONRA_${L}.json" W/simdi.json -q; then KY="envanter_oku_$SIMDI_KOSU"; fi
          if [ -f W/simdi.json ]; then
            python3 scripts/etsy/galeri_ornek.py --hedef-manifest W/manifest.json --hedef-dir W/duz --simdi W/simdi.json --out O > O/ornek.log 2>&1
            G=$?; SAY=$(grep -o '"sayim": {[^}]*}' O/ornek.log | tr -d ' '); tail -3 O/ornek.log
          else echo "::warning::$L canli galeri kaydi yok (KART_SIL SONRA / envanter-oku), LISTE uretilmedi"; fi
          echo "$L $C kart=$K tasma=$TAS liste=$DZ ornek=$G kaynak=$KY sure=$(( $(date +%s) - S0 ))sn $SAY" | tee O/OZET_SATIR.txt
          rclone copy O "$D/DENETIM_20261021/GALERI_PLAN23/DUZELT_${GITHUB_RUN_ID}/${L}_${C}" -q
          bad=0; [[ "$G" =~ ^[1-9] ]] && bad=1
          [ "$DZ" = duzeltilmis ] && [ "$K" != 0 ] && bad=1
          exit $bad
      - if: always()
        run: rm -rf W ~/.config/rclone

  ozet:
    needs: ilan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: rclone
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: OZET
        run: |
          set -euo pipefail
          P="$D/DENETIM_20261021/GALERI_PLAN23/DUZELT_${GITHUB_RUN_ID}"
          mkdir -p o
          rclone copy "$P" o --include "*/OZET_SATIR.txt" -q || true
          find o -name OZET_SATIR.txt -exec cat {} \; | sort | tee OZET.txt
          rclone copyto OZET.txt "$P/OZET.txt" -q
          echo "::notice title=GALERI23::Drive TEMP/DENETIM_20261021/GALERI_PLAN23/DUZELT_${GITHUB_RUN_ID}/ ($(wc -l < OZET.txt) ilan)"
      - if: always()
        run: rm -rf ~/.config/rclone

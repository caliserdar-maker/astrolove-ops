name: artifact-sil

# Tek bir Actions artifact'ini siler (Serdar 23 Eki A4: pod-audit herkese acik ciktisi). Yalniz verilen kimlik; once adi ve kosusu
# beklenenle karsilastirilir, tutmazsa silmez. Silme sonrasi API'den yeniden okunur (404 = gitti). Etsy / Drive yok.

permissions:
  actions: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      artifact_id: {description: "artifact kimligi (yalniz rakam)", required: true}
      beklenen_ad: {description: "artifact adi (guvenlik)", required: true}
      beklenen_kosu: {description: "artifact'in kosu kimligi (guvenlik)", required: true}

jobs:
  sil:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Kontrol + sil + dogrula
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ inputs.artifact_id }}
          AD: ${{ inputs.beklenen_ad }}
          KOSU: ${{ inputs.beklenen_kosu }}
          R: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$ID" =~ ^[0-9]+$ && "$KOSU" =~ ^[0-9]+$ ]] || { echo "::error::kimlik"; exit 1; }
          A="https://api.github.com/repos/$R/actions/artifacts/$ID"
          H=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          curl -fsS "${H[@]}" "$A" > a.json
          python3 - "$AD" "$KOSU" <<'PY'
          import json, sys
          a = json.load(open("a.json"))
          ok = a["name"] == sys.argv[1] and str(a["workflow_run"]["id"]) == sys.argv[2]
          print(f"artifact {a['id']} {a['name']} kosu {a['workflow_run']['id']} {a['size_in_bytes']} bayt expired {a['expired']}")
          sys.exit(0 if ok else 1)
          PY
          kod=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE "${H[@]}" "$A"); echo "DELETE HTTP $kod"
          [ "$kod" = 204 ] || { echo "::error::silinemedi ($kod)"; exit 1; }
          kod2=$(curl -sS -o /dev/null -w '%{http_code}' "${H[@]}" "$A"); echo "yeniden okuma HTTP $kod2"
          [ "$kod2" = 404 ] && echo "::notice title=ARTIFACT SILINDI::$ID ($AD, kosu $KOSU) yeniden okuma 404" || { echo "::error::hala var ($kod2)"; exit 1; }

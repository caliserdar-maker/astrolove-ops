name: motor-kaynak-sosyal78

# ADIM 3 (3 Eki 2026, Serdar onayi) kaynak paketi: 78 cift sosyal medya posteri, MIDNIGHT_BLUE 16x20 (4x5).
# Drive SALT OKUNUR: 78 orijinal satis posteri (POD_PRINT/<CIFT>/MIDNIGHT_BLUE/16x20.jpg), BLUE_16x20 plate, 78 ana
# sembol + 12 kucuk sembol altin katmani, liste CSV (TEMP/SOSYAL/INSTAGRAM/IG_78_ORNEK_ISIM_TAGLINE.csv).
# Manifest (boyut, sha256) ile inceleme/motor-kaynak-sosyal78 dalina (orphan). Etsy YOK, musteri YOK.

on:
  push:
    branches: [motor]
    paths: [motor/kaynak_sosyal78.trigger]

permissions:
  contents: write

jobs:
  kaynak:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q pymupdf
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Drive'dan indir (salt okuma)
        run: |
          set -euo pipefail
          O=_kaynak; mkdir -p $O/plates $O/orijinal; A=gdrive:ASTROLOVE; T=$A/TEMP; L=$A/ARCHIVE/LEGACY_COMPONENTS
          rclone copyto "$T/SOSYAL/INSTAGRAM/IG_78_ORNEK_ISIM_TAGLINE.csv" $O/liste.csv
          rclone copyto "$T/SIPARIS_ISIM/PLATES/BLUE_16x20.png" $O/plates/BLUE_16x20.png
          tail -n +2 $O/liste.csv | python3 -c "import csv,sys; [print(r[1]) for r in csv.reader(sys.stdin)]" > _ciftler.txt
          wc -l _ciftler.txt
          for c in $(cat _ciftler.txt); do echo "$c/MIDNIGHT_BLUE/16x20.jpg"; done > _pod.txt
          for c in $(cat _ciftler.txt); do echo "$(echo $c | tr A-Z a-z)_gold.png"; done > _main.txt
          for b in aries taurus gemini cancer leo virgo libra scorpio sagittarius capricorn aquarius pisces; do echo "${b}_symbol_gold.png"; done > _sym.txt
          rclone copy "$T/POD_PRINT" _pod --files-from _pod.txt --transfers 8
          rclone copy "$L/main_symbols" _main --files-from _main.txt --transfers 8
          rclone copy "$L/zodiac_symbols_gold" _sym --files-from _sym.txt --transfers 8
          for c in $(cat _ciftler.txt); do mv _pod/$c/MIDNIGHT_BLUE/16x20.jpg $O/orijinal/$c.jpg; l=$(echo $c | tr A-Z a-z); mv _main/${l}_gold.png $O/main_${l}_gold.png; done
          for f in _sym/*_symbol_gold.png; do b=$(basename $f _symbol_gold.png); mv $f $O/sym_${b}_gold.png; done
          ls $O/orijinal | wc -l; ls $O/main_* | wc -l; du -sh $O
      - name: Manifest + parcala
        run: |
          set -euo pipefail
          cd _kaynak
          python3 - <<'EOF' > MANIFEST.txt
          import hashlib, os
          for r, _, fs in sorted(os.walk('.')):
              for f in sorted(fs):
                  p = os.path.join(r, f)
                  if f == 'MANIFEST.txt': continue
                  print(f"{p}\t{os.path.getsize(p)}\t{hashlib.sha256(open(p, 'rb').read()).hexdigest()}")
          EOF
          cat MANIFEST.txt
          find . -type f -size +90M | while read f; do split -b 90M -d "$f" "$f.parca"; rm "$f"; echo "parcalandi $f"; done
      - name: Commit (inceleme/motor-kaynak-sosyal78, orphan)
        run: |
          set -euo pipefail
          K=$(git rev-parse HEAD)
          cd _kaynak
          git init -q -b inceleme/motor-kaynak-sosyal78
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "motor dali $K, kosu ${{ github.run_id }}" > KAYNAK.txt
          git add -A
          git commit -q -m "motor-kaynak-sosyal78: 78 cift MB 16x20 kaynaklari (motor $K, kosu ${{ github.run_id }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:inceleme/motor-kaynak-sosyal78
          git log -1 --format='%H'
      - if: always()
        run: rm -rf ~/.config/rclone

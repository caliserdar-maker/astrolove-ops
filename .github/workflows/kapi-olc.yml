name: kapi-olc

# SALT OKUR kapi olcumu (30 Eyl 2026): eski (e62e35d) / yeni kod karsilastirmasi + WP kimlik render
# kalibrasyonu. Drive'a / PLATES'e / musteriye YAZMA YOK; sonuc yalniz logda (OLC satirlari).
# Tetik: config/kapi_olc.trigger degisikligi (bu dal). Isler: config/kapi_olc_isler.json

permissions:
  contents: read

on:
  push:
    branches: [claude/gracious-meitner-i72rkr]
    paths:
      - config/kapi_olc.trigger

concurrency: siparis-plates

jobs:
  olc:
    strategy:
      fail-fast: false
      matrix:
        is: [s1, s2, s3, eski]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python bagimliliklari
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pillow opencv-python-headless numpy fonttools img2pdf pikepdf
      - name: rclone kur
        run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONF_B64:-}" ]; then echo "HATA: RCLONE_CONF_B64 yok" >&2; exit 1; fi
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Kapi olcumu (salt okur, yalniz log)
        env:
          IS: ${{ matrix.is }}
        run: |
          set -euo pipefail
          ISLER="$(python3 -c "import json,os;print(json.load(open('config/kapi_olc_isler.json'))[os.environ['IS']])")"
          if [ "$IS" = "eski" ]; then
            git fetch -q --depth 1 origin e62e35d3154bcfd977d3abc22b0d5e55a5996804
            git worktree add -q /tmp/eski FETCH_HEAD
            cp scripts/medya_v1/kapi_olc.py /tmp/eski/scripts/medya_v1/kapi_olc.py
            cd /tmp/eski
          fi
          python scripts/medya_v1/kapi_olc.py --etiket "$IS" --isler "$ISLER"
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone

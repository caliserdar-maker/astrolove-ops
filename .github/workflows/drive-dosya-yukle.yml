name: drive-dosya-yukle
# Bir daldaki dosyayi Drive ASTROLOVE/TEMP/DENETIM_* altina kopyalar (sahip-yalniz). Etsy/Metricool'a dokunmaz.
# Yalniz veri/* dallari ve DENETIM_ ile baslayan hedef klasor kabul edilir; dosya sir taramasindan gecer.
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      dal: {description: "veri/ ile baslayan dal", required: true}
      yol: {description: "daldaki dosya yolu (veri/ altinda)", required: true}
      hedef: {description: "Drive klasoru (TEMP altinda, DENETIM_ ile baslar)", required: true, default: "DENETIM_20261021"}
jobs:
  yukle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Girdi kapisi
        env: {DAL: "${{ inputs.dal }}", YOL: "${{ inputs.yol }}", HEDEF: "${{ inputs.hedef }}"}
        run: |
          [[ "$DAL" =~ ^veri/[A-Za-z0-9._-]+$ ]] || { echo "::error::dal"; exit 1; }
          [[ "$YOL" =~ ^veri/[A-Za-z0-9._/-]+$ && "$YOL" != *..* ]] || { echo "::error::yol"; exit 1; }
          [[ "$HEDEF" =~ ^DENETIM_[A-Za-z0-9_]+$ ]] || { echo "::error::hedef"; exit 1; }
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.dal }}", path: _veri}
      - uses: actions/checkout@v4
        with: {sparse-checkout: scripts/guvenlik, path: _ops}
      - name: Yukle
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOL: ${{ inputs.yol }}
          HEDEF: ${{ inputs.hedef }}
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            export RCLONE_CONFIG_GDRIVE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET"; fi
          test -f "_veri/$YOL"
          mkdir -p _tara && cp "_veri/$YOL" _tara/
          echo '{}' > _bos.json
          python3 _ops/scripts/guvenlik/sir_koru.py tara --sir-json _bos.json _tara
          rclone copy "_veri/$YOL" "gdrive:ASTROLOVE/TEMP/$HEDEF" -q
          rclone lsl "gdrive:ASTROLOVE/TEMP/$HEDEF" --include "$(basename "$YOL")"
      - if: always()
        run: rm -rf ~/.config/rclone

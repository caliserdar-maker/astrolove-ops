name: prodigi-quote

# Prodigi pilot katalog + ABD fiyat/kargo okuma (salt okur, siparis yok).
# Anahtar Drive TEMP/PRODIGI_TOKEN.json'dan rclone ile okunur; GitHub secret yok,
# workflow girdisi olarak asla sir verilmez. Cikti Drive TEMP/PRODIGI/ + artifact.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Gecerli SKU sayisi (0 = hepsi; 3 = sinif basina 1 deneme)"
        required: false
        default: "0"
      discover:
        description: "prodigi.com sayfalarindan SKU kesfi (pilot_pages.txt)"
        type: boolean
        default: false
      skus:
        description: "Aday listesini ez: virgullu SKU listesi (bos = pilot_skus.csv)"
        required: false
        default: ""
      mode:
        description: "pilot = pilot_skus.csv (US) | hpr_sizes = hpr_sizes.txt (US + DE) | ship_everywhere = 8 ulke Standard kargo (18x24) | inserts = branded insert fiyat/ozellik (8 tip, US + DE) | maliyet_api = 16 HPR boy x 7 ulke Budget/Standard + net (DIJITAL_78) | ekstra_tesis = kartpostal/sticker: canli siparis tesis + fatura kalemi (yalniz GET) + ECB kuru"
        type: choice
        options: [pilot, hpr_sizes, ship_everywhere, inserts, maliyet_api, ekstra_tesis]
        default: pilot

concurrency:
  group: prodigi-quote
  cancel-in-progress: false

jobs:
  quote:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bagimliliklar
        run: |
          set -euo pipefail
          pip install -q requests==2.34.2

      - name: rclone kur
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          rclone version | head -1

      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONF_B64:-}" ]; then
            echo "HATA: RCLONE_CONF_B64 secret'i tanimli degil." >&2
            exit 1
          fi
          mkdir -p ~/.config/rclone
          umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          # Yeni OAuth istemcisinin secret'i conf'daki degeri ezer (rclone env override).
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi

      - name: Teklifleri oku
        env:
          LIMIT: ${{ inputs.limit }}
          DISCOVER: ${{ inputs.discover }}
          SKUS: ${{ inputs.skus }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "hpr_sizes" ]; then
            python scripts/prodigi/prodigi_hpr_sizes.py --out-dir out
            exit 0
          fi
          if [ "$MODE" = "inserts" ]; then
            python scripts/prodigi/prodigi_inserts_quote.py --self-test
            python scripts/prodigi/prodigi_inserts_quote.py --out-dir out
            cat out/PRODIGI_INSERTS_QUOTE.md >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$MODE" = "ekstra_tesis" ]; then
            # Yalniz GET /orders (+ ECB kuru). Musteri verisi yazilmaz; cikti TEMP/PRODIGI.
            python scripts/prodigi/prodigi_ekstra_tesis.py --self-test
            python scripts/prodigi/prodigi_ekstra_tesis.py --out-dir out > /dev/null
            cat out/PRODIGI_EKSTRA_TESIS.md >> "$GITHUB_STEP_SUMMARY"
            head -40 out/PRODIGI_EKSTRA_TESIS.md
            rclone copy out "gdrive:ASTROLOVE/TEMP/PRODIGI" --include "PRODIGI_EKSTRA_TESIS.*" -q
            exit 0
          fi
          if [ "$MODE" = "maliyet_api" ]; then
            # Yalniz POST /quotes (siparis yok). Cikti DIJITAL_78'e.
            python scripts/prodigi/prodigi_maliyet_api.py --self-test
            python scripts/prodigi/prodigi_maliyet_api.py --out-dir out
            cat out/PRODIGI_MALIYET_API_OZET.md >> "$GITHUB_STEP_SUMMARY"
            rclone copy out "gdrive:ASTROLOVE/TEMP/DIJITAL_78" --include "PRODIGI_MALIYET_API*" -q
            rclone copy out/raw "gdrive:ASTROLOVE/TEMP/DIJITAL_78/PRODIGI_MALIYET_API_RAW" -q
            exit 0
          fi
          if [ "$MODE" = "ship_everywhere" ]; then
            rc=0; python scripts/prodigi/prodigi_ship_everywhere.py --out-dir out || rc=$?
            cat out/PRODIGI_SHIP_EVERYWHERE.md >> "$GITHUB_STEP_SUMMARY" || true
            rclone copy out "gdrive:ASTROLOVE/TEMP/PRODIGI" --include "PRODIGI_SHIP_EVERYWHERE.*" -q
            [ "$rc" = "2" ] && echo "::warning::DUR: sapma/eksik var (rapor TEMP/PRODIGI/PRODIGI_SHIP_EVERYWHERE.md)"
            exit $rc
          fi
          args=(--limit "${LIMIT:-0}" --out-dir out)
          [ "$DISCOVER" = "true" ] && args+=(--discover)
          [ -n "${SKUS:-}" ] && args+=(--skus "$SKUS")
          python scripts/prodigi/prodigi_pilot_quote.py "${args[@]}"

      - name: Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prodigi-quotes
          path: out/
          if-no-files-found: ignore

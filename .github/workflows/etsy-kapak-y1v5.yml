name: etsy-kapak-y1v5

# Yil donumu kapagi Y1_v5, ORNEK CANCER_LIBRA (19 Eki 2026, Serdar). Etsy API cagrisi YOK, Etsy'ye yazma YOK.
# scripts/etsy/analiz/kapak_y1_v5.py: baslik blogu %10 kucuk, bosluk 146, poster esit olcekle en buyuk (4:3 pencerede pay 10); QC OLCUM.txt.
# Girdi: Drive KAPAK_ADAY_20261019/Y1_V4/Y1_v4.jpg, BIZIM_YILIMIZ_78_20261014_v3 poster; tasarim kodu bizim-yilimiz-v3 (sabit SHA).
# Cikti: Drive ASTROLOVE/TEMP/KAPAK_ADAY_20261019/Y1_V5/

permissions:
  contents: read

on:
  workflow_dispatch:

env:
  BY_REF: b90f3341eb70973800c395620692ce12f65aba0f
  HEDEF: "gdrive:ASTROLOVE/TEMP/KAPAK_ADAY_20261019/Y1_V5"

jobs:
  y1v5:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kurulum
        run: |
          set -euo pipefail
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y libfribidi0 libraqm0 >/dev/null || true
          pip install -q numpy==2.5.3 pillow==12.3.0 opencv-python-headless==5.0.0.93
          python3 -c "from PIL import features; import sys; sys.exit(0 if features.check('raqm') else 1)"
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true; fi
      - name: Kaynaklar (Drive + bizim-yilimiz-v3 kodu)
        run: |
          set -euo pipefail
          K=_k; mkdir -p $K/by/cikti/CANCER_LIBRA/poster
          rclone copyto "gdrive:ASTROLOVE/TEMP/BIZIM_YILIMIZ_78_20261014_v3/CANCER_LIBRA/poster/4_Layers_8x10.jpg" $K/by/cikti/CANCER_LIBRA/poster/4_Layers_8x10.jpg
          rclone copyto "gdrive:ASTROLOVE/TEMP/KAPAK_ADAY_20261019/Y1_V4/Y1_v4.jpg" $K/Y1_v4.jpg
          git fetch -q --depth 1 origin "$BY_REF"
          git archive "$BY_REF" galeri/logo_sonsuz_duz.png galeri/fonts kod/by_kapak.py | tar -x -C $K/by
          ls -la $K $K/by/cikti/CANCER_LIBRA/poster
      - name: Uret + QC
        run: |
          set -o pipefail
          python3 scripts/etsy/analiz/kapak_y1_v5.py --kaynak _k --cikti _out 2>&1 | tee _out_log.txt
          echo "KOD=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
      - name: Drive'a yaz
        if: ${{ always() }}
        run: |
          set -euo pipefail
          mkdir -p _out; cp _out_log.txt _out/kosu_log.txt 2>/dev/null || true
          rclone copy _out "$HEDEF" -q
          rclone lsl "$HEDEF"
          [ "${KOD:-1}" = 0 ] || { echo "::error::QC FAIL (OLCUM.txt)"; exit 1; }
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone

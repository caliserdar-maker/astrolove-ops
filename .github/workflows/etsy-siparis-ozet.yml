name: etsy-siparis-ozet

# SALT OKUMA (Etsy'ye yazma YOK, mesaj YOK): son N siparisin ozeti.
# Cikti: Drive ASTROLOVE/TEMP/SIPARIS_OZET_<damga>/ (SIPARIS_OZET.md + receipts_ham.json).
# Loga musteri bilgisi yazilmaz; id ve takip numaralari maskeli.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      adet:
        description: "kac siparis (en yeniden geriye)"
        required: true
        default: "3"

concurrency:
  group: etsy-token
  cancel-in-progress: false

jobs:
  oku:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Token
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
      - name: Oku (salt okur)
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          set -euo pipefail
          python scripts/etsy/siparis_ozet.py "${{ inputs.adet }}"
      - name: Drive'a yaz
        if: ${{ always() }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y%m%d_%H%M)
          [ -d _out ] && rclone copy _out "gdrive:ASTROLOVE/TEMP/SIPARIS_OZET_$STAMP" -q || true
          rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" || true
          echo "Drive: TEMP/SIPARIS_OZET_$STAMP"
          rm -rf _work _out ~/.config/rclone

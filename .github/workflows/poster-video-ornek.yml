name: poster-video-ornek
# Poster ilan videosu ORNEK (19 Eki 2026). Etsy'ye ve Metricool'a YAZMA YOK; yalniz Drive'a ornek.
# sosyal/poster_video/poster_ilan_video.py: kupa ilan videosu (kupa-orchard kupa_orchard/kod/video6b.py) zamanlamasi ve tozu,
# sahne = onayli poster kapagi (Drive TEMP/KAPAK_P2_78_20261019/KAPAK/<listing>_<CIFT>.jpg); sembol/glif maskeleri kapaktaki posterden.
# Etsy yardim sayfasi (listing video sartlari) kosucudan okunur, ilgili cumleler ETSY_VIDEO_SARTLARI.txt'ye yazilir.
# Cikti: Drive ASTROLOVE/TEMP/POSTER_VIDEO_ORNEK_20261019/ (<CIFT>_ilan_video.mp4, KONTAK.jpg, <CIFT>_QC.json).
permissions:
  contents: write   # yalniz poster-video-onizleme dalina kucuk onizleme (KONTAK.jpg, MASKE.jpg, QC.json)
on:
  workflow_dispatch:
    inputs:
      kapak:
        description: 'KAPAK/ altindaki kapak dosyasi'
        default: 4570143815_CANCER_LIBRA.jpg
      surum:
        description: 'v1 (ilk ornek) | v2 (toz 5 kat, sembol tozla birlikte, sonsuzluktan da toz; V2/) | v3 (sembol 2,2-4,7 sn duzgun, zarif toz; V3/)'
        default: v3
jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      O: gdrive:ASTROLOVE/TEMP/POSTER_VIDEO_ORNEK_20261019
      K: gdrive:ASTROLOVE/TEMP/KAPAK_P2_78_20261019/KAPAK
      KAPAK: ${{ inputs.kapak }}
      SURUM: ${{ inputs.surum }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Kurulum
      run: |
        set -euo pipefail
        pip install -q numpy==2.1.3 pillow==11.0.0 scipy==1.14.1 opencv-python-headless==4.10.0.84
        sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg fonts-dejavu-core >/dev/null
        curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
    - name: rclone.conf
      env:
        RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      run: |
        set -euo pipefail
        mkdir -p ~/.config/rclone; umask 077
        printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
        if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "::add-mask::$GOOGLE_CLIENT_SECRET"
          grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true; fi
    - name: Uret + QC
      run: |
        set +e -uo pipefail   # QC FAIL olsa da ciktilar Drive'a gitsin
        case "$KAPAK" in *[!A-Za-z0-9_.]*|'') echo "::error::kapak adi gecersiz"; exit 1 ;; esac
        CIFT=$(echo "$KAPAK" | sed -E 's/^[0-9]+_//; s/\.jpg$//')
        case "$SURUM" in v1) EK=""; PV=ornek ;; v2) EK="--v2"; O="$O/V2"; PV=ornek_v2 ;; v3) EK="--v3"; O="$O/V3"; PV=ornek_v3 ;;
          *) echo "::error::surum v1|v2|v3"; exit 1 ;; esac
        echo "PV=$PV" >> "$GITHUB_ENV"
        mkdir -p _w _o
        rclone copyto "$K/$KAPAK" _w/kapak.jpg -q || { echo "::error::kapak yok"; exit 1; }
        python3 -c "from PIL import Image;print('::warning::GIRDI kapak', Image.open('_w/kapak.jpg').size)"
        # Etsy listing video sartlari (resmi yardim sayfasi)
        for u in https://help.etsy.com/hc/en-us/articles/360053206073-How-to-Add-Listing-Videos https://help.etsy.com/hc/en-us/articles/360053206073; do
          curl -sSL -m 60 -A "Mozilla/5.0" "$u" -o _w/etsy.html; echo "URL $u HTTP $(curl -sSL -m 60 -A 'Mozilla/5.0' -o /dev/null -w '%{http_code}' "$u")"
        done | tee _o/ETSY_VIDEO_SARTLARI.txt
        python3 -c "
        import re, html
        t = html.unescape(re.sub(r'<script.*?</script>|<style.*?</style>', ' ', open('_w/etsy.html', errors='ignore').read(), flags=re.S))
        t = re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', t))
        seen = set()
        for m in re.finditer(r'[^.]*\b(seconds?|MB|resolution|px|pixels|audio|sound|aspect ratio|file size|formats?)\b[^.]*\.', t, re.I):
            s = m.group(0).strip()
            if s not in seen and len(s) < 400: seen.add(s); print('-', s)
        " | head -40 | tee -a _o/ETSY_VIDEO_SARTLARI.txt
        sed 's/^/::warning::ETSY /' _o/ETSY_VIDEO_SARTLARI.txt | head -40
        python3 -I sosyal/poster_video/poster_ilan_video.py _w/kapak.jpg _o "$CIFT" $EK | tee _w/log.txt; RC=${PIPESTATUS[0]}
        grep -E '^\{|SONUC' _w/log.txt | sed 's/^/::warning::QC /' | cut -c1-3000
        rclone copy _o "$O" -q
        echo "::warning::DRIVE $(rclone lsf "$O" | tr '\n' ' ')"
        mkdir -p _pv; cp _o/KONTAK.jpg _o/MASKE.jpg _o/*QC.json _o/ETSY_VIDEO_SARTLARI.txt _o/YAKIN_*.jpg _pv/ 2>/dev/null
        echo "RC=$RC" >> "$GITHUB_ENV"
    - name: Onizleme dali
      if: ${{ always() }}
      run: |
        set +e -uo pipefail
        [ -n "$(ls -A _pv 2>/dev/null)" ] || exit 0
        B=poster-video-onizleme
        git config user.name "github-actions"; git config user.email "actions@github.com"
        for i in 1 2 3; do
          rm -rf _pvw; git worktree prune
          git fetch -q origin $B 2>/dev/null && git worktree add -q _pvw origin/$B 2>/dev/null || { git worktree add -q --detach _pvw; (cd _pvw && git checkout -q --orphan tmp && git rm -rqf . ); }
          rm -rf "_pvw/$PV"; mkdir -p "_pvw/$PV"; cp _pv/* "_pvw/$PV/"
          (cd _pvw && git add -A && git commit -qm "poster video onizleme (kosu ${{ github.run_id }})" && git push -q origin HEAD:refs/heads/$B) && { echo "::warning::ONIZLEME $B/$PV"; break; }
          sleep 5
        done
    - name: Sonuc
      if: ${{ always() }}
      run: '[ "${RC:-1}" = "0" ]'
    - if: always()
      run: rm -rf _w ~/.config/rclone

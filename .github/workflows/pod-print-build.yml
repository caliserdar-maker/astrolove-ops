name: pod-print-build

# POD baski dosyalari: 78 cift x 5 edisyon x 13 boyut = 5.070 JPEG (300 dpi, q95).
# Kaynak WALL_ART/POSTERS/ORIGINAL_HIGH_RES/<ED>/<RATIO>/<PAIR>.jpg; hedef piksel Prodigi
# API print-area (plan isi okur, TEMP/PRODIGI/PRODIGI_HPR_PRINT_AREAS.json). Cikti Drive
# TEMP/POD_PRINT/<PAIR>/<ED>/<SIZE>.jpg (paylasim YOK; siparis aninda gecici link).
# STATE shard TEMP/POD_PRINT_STATE/shard_<n>.csv -> birlesik TEMP/POD_PRINT_STATE.csv + rapor.

on:
  workflow_dispatch:
    inputs:
      pairs:
        description: "ALL (ORIGINAL_HIGH_RES/MIDNIGHT_BLUE/2X3 dosyalari) ya da virgullu liste"
        required: true
        default: "ALL"
      shards:
        description: "Parca sayisi"
        required: true
        default: "6"
      force:
        description: "true = PASS olanlari da yeniden uret"
        type: boolean
        default: false

concurrency:
  group: pod-print-build
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.m.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
      - name: Prodigi print-area pikselleri (salt okur, anahtar maskeli)
        run: |
          set -euo pipefail
          python scripts/prodigi/prodigi_print_areas.py --out sizes.json
          grep -q "api_key" sizes.json && { echo "HATA: sizinti"; exit 1; } || true
          rclone copyto sizes.json "gdrive:ASTROLOVE/TEMP/PRODIGI/PRODIGI_HPR_PRINT_AREAS.json"
      - id: m
        run: |
          python3 -c "import json;n=int('${{ inputs.shards }}');print('shards='+json.dumps(list(range(n))))" >> "$GITHUB_OUTPUT"
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          set -euo pipefail
          pip install -q pillow==12.3.0
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
      - name: Cift listesi, boyutlar, STATE
        env:
          PAIRS: ${{ inputs.pairs }}
        run: |
          set -euo pipefail
          mkdir -p _work
          rclone copyto "gdrive:ASTROLOVE/TEMP/PRODIGI/PRODIGI_HPR_PRINT_AREAS.json" _work/sizes.json
          if [ "$PAIRS" = "ALL" ]; then
            rclone lsf "gdrive:ASTROLOVE/WALL_ART/POSTERS/ORIGINAL_HIGH_RES/MIDNIGHT_BLUE/2X3" --files-only --include "*.jpg" | sed 's/\.jpg$//' | tr a-z A-Z | sort -u > _work/pairs.txt
          else
            echo "$PAIRS" | tr ',' '\n' | sed 's/ //g' | grep -v '^$' | tr a-z A-Z | sort -u > _work/pairs.txt
          fi
          echo "cift: $(wc -l < _work/pairs.txt)"
          rclone copyto "gdrive:ASTROLOVE/TEMP/POD_PRINT_STATE/shard_${{ matrix.shard }}.csv" _work/state.csv 2>/dev/null || echo "STATE yok; yeni baslar"
      - name: Uret (shard ${{ matrix.shard }})
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          args=(--pairs-file _work/pairs.txt --sizes-json _work/sizes.json --src src --out out --state _work/state.csv
                --shard "${{ matrix.shard }}" --shards "${{ inputs.shards }}"
                --rclone-src "gdrive:ASTROLOVE/WALL_ART/POSTERS/ORIGINAL_HIGH_RES" --rclone-out "gdrive:ASTROLOVE/TEMP/POD_PRINT")
          [ "$FORCE" = "true" ] && args+=(--force)
          python scripts/pod/pod_print_build.py "${args[@]}"
      - name: STATE'i Drive'a yaz
        if: ${{ always() }}
        run: |
          set -euo pipefail
          [ -s _work/state.csv ] && rclone copyto _work/state.csv "gdrive:ASTROLOVE/TEMP/POD_PRINT_STATE/shard_${{ matrix.shard }}.csv" && echo "STATE shard_${{ matrix.shard }} yazildi" || echo "STATE yok"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: pod-print-shard-${{ matrix.shard }}
          path: _work/state.csv
          if-no-files-found: ignore
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone

  merge:
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
      - name: STATE birlestir + rapor + Drive sayimi
        run: |
          set -euo pipefail
          mkdir -p _st
          rclone copy "gdrive:ASTROLOVE/TEMP/POD_PRINT_STATE" _st --include "shard_*.csv" -q
          n_drive=$(rclone lsf "gdrive:ASTROLOVE/TEMP/POD_PRINT" -R --files-only --include "*.jpg" | wc -l)
          echo "Drive TEMP/POD_PRINT jpg: $n_drive"
          N_DRIVE="$n_drive" python3 - <<'PY'
          import csv, glob, os
          rows = {}
          for f in sorted(glob.glob("_st/shard_*.csv")):
              for r in csv.DictReader(open(f, encoding="utf-8")):
                  if r["pair"] not in rows or r["ts_utc"] > rows[r["pair"]]["ts_utc"]:
                      rows[r["pair"]] = r
          cols = ["pair", "status", "files", "fail", "secs", "ts_utc"]
          with open("_st/POD_PRINT_STATE.csv", "w", newline="", encoding="utf-8") as fh:
              w = csv.DictWriter(fh, fieldnames=cols); w.writeheader()
              for k in sorted(rows): w.writerow({c: rows[k].get(c, "") for c in cols})
          n_pass = sum(1 for r in rows.values() if r["status"] == "PASS")
          files = sum(int(r.get("files") or 0) for r in rows.values())
          secs = sum(float(r.get("secs") or 0) for r in rows.values())
          md = [f"# POD baski dosyalari: {n_pass}/{len(rows)} cift PASS, {len(rows)-n_pass} FAIL; dosya {files} (STATE) / {os.environ['N_DRIVE']} (Drive); toplam cift suresi {secs/60:.1f} dk", "",
                "| cift | durum | dosya | sure sn | hata |", "|---|---|---|---|---|"]
          md += [f"| {r['pair']} | {r['status']} | {r['files']} | {r['secs']} | {r['fail'][:200].replace('|','/')} |" for r in (rows[k] for k in sorted(rows))]
          open("_st/POD_PRINT_REPORT.md", "w", encoding="utf-8").write("\n".join(md) + "\n")
          open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8").write("\n".join(md) + "\n")
          PY
          rclone copyto _st/POD_PRINT_STATE.csv "gdrive:ASTROLOVE/TEMP/POD_PRINT_STATE.csv"
          rclone copyto _st/POD_PRINT_REPORT.md "gdrive:ASTROLOVE/TEMP/POD_PRINT_REPORT.md"
          head -1 _st/POD_PRINT_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: pod-print-state
          path: _st/
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone

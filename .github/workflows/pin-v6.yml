name: pin-v6

# Pinterest pin v6 (Serdar onayli tasarim 12 Eki 2026), paket sosyal/pin_v6/.
# mod ornek : 78 poster (Drive POSTER78_CHATGPT_7200x10800_20261008, 9 Eki surumu) -> 2000x3000 (yalniz olcekleme),
#             poster kapisi (olcu, lacivert, OCR'da Serdar/Lena yok) + POSTER_KONTAK, Gemini & Leo onayli/ dogrulamasi,
#             CAPRICORN_SAGITTARIUS ornegi -> TEMP/PIN_V6_20261012/ORNEK/. 2000'lik posterler TEMP/PIN_V6_20261012/_POSTER2000/.
# mod hepsi : 78 cift x 3 pin + parcalar + QC (PASS/FAIL) + KONTAK_P2 / KONTAK_PARCA -> TEMP/PIN_V6_20261012/PINLER/.
# mod link  : PIN_METIN_234.csv etsy_link doldurma. ETSY SALT OKUMA (public GET, yalniz API anahtari, token yok).
# Onizleme (kucuk dosyalar) pin-v6-onizleme dalina yazilir. Sir loga yazilmaz.

permissions:
  actions: read
  contents: write

on:
  workflow_dispatch:
    inputs:
      mod: {description: "ornek | hepsi | link", required: true, type: choice, options: [ornek, hepsi, link]}

jobs:
  is:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      D: gdrive:ASTROLOVE/TEMP/PIN_V6_20261012
      SRC_ID: 1E-vvy7BVE2C2VEuRDoVUf6g9PZpvh5-H
      REF_DIR: 1_rcZ69bhw00QfHedBiWywEoHPu9Y4bkB
    steps:
      - uses: actions/checkout@v4
      - name: Etsy kilidi (sira bekle, iptal yok)
        if: ${{ inputs.mod == 'link' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kurulum
        run: |
          set -euo pipefail
          pip install -q numpy==2.1.3 pillow==11.0.0 scipy==1.14.1 opencv-python-headless==4.10.0.84 requests==2.34.2
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          if [ "${{ inputs.mod }}" = "ornek" ]; then sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y tesseract-ocr >/dev/null; fi
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true; fi
      - name: ornek
        if: ${{ inputs.mod == 'ornek' }}
        run: |
          set +e -uo pipefail   # Actions varsayilani bash -e; kapilar sonuna kadar kossun
          mkdir -p _w/P2000 _w/big _o/ORNEK _o/DOGRULA_REF _o/DOGRULA_78 _o/KONTROL _pv
          rclone lsf gdrive: --drive-root-folder-id "$SRC_ID" --files-only --include "*_7200x10800.jpg" | sort > _w/liste.txt
          N=$(wc -l < _w/liste.txt); echo "::warning::KAYNAK $N poster (POSTER78_CHATGPT_7200x10800_20261008)"
          [ "$N" = 78 ] || { echo "::error::78 poster yok ($N)"; exit 1; }
          cat > _w/olcekle.py <<'PY'
          import sys
          from PIL import Image
          Image.MAX_IMAGE_PIXELS = None
          src, dst = sys.argv[1], sys.argv[2]
          im = Image.open(src).convert('RGB')
          assert im.size == (7200, 10800), im.size
          im.resize((2000, 3000), Image.LANCZOS).save(dst, quality=95, subsampling=0)
          PY
          T0=$(date +%s)
          cat _w/liste.txt | xargs -P 6 -I{} sh -c 'k=$(basename "{}" _7200x10800.jpg); rclone copyto gdrive:"{}" "_w/big/{}" --drive-root-folder-id "'$SRC_ID'" -q && python3 _w/olcekle.py "_w/big/{}" "_w/P2000/$k.jpg" && rm -f "_w/big/{}" && echo "$(ls _w/P2000 | wc -l)/78 $k"'
          echo "::warning::OLCEKLEME $(ls _w/P2000/*.jpg | wc -l)/78, $(( $(date +%s) - T0 )) sn"
          python3 sosyal/pin_v6/poster_kontrol.py _w/P2000 _o/KONTROL | tee _w/pk.txt; PK=${PIPESTATUS[0]}
          grep OZET _w/pk.txt | sed 's/^/::warning::/'
          # dogrulama: (a) Drive AstroLoveArt_Gemini_Leo_2000.jpg, (b) 78 setindeki GEMINI_LEO
          mkdir -p _w/refp && rclone copyto gdrive:AstroLoveArt_Gemini_Leo_2000.jpg _w/refp/GEMINI_LEO.jpg --drive-root-folder-id "$REF_DIR" -q
          python3 -c "from PIL import Image;import numpy as np;a=np.asarray(Image.open('_w/refp/GEMINI_LEO.jpg').convert('RGB')).astype(int);b=np.asarray(Image.open('_w/P2000/GEMINI_LEO.jpg').convert('RGB')).astype(int);print('::warning::REF_vs_78 GEMINI_LEO poster ortalama fark',round(float(abs(a-b).mean()),3) if a.shape==b.shape else ('olcu',a.shape,b.shape))"
          python3 sosyal/pin_v6/pin_toplu.py --posters _w/refp --out _o/DOGRULA_REF --pairs GEMINI_LEO > /dev/null
          python3 sosyal/pin_v6/dogrula.py _o/DOGRULA_REF | sed 's/^/::warning::REF /'; DR=${PIPESTATUS[0]}
          python3 sosyal/pin_v6/pin_toplu.py --posters _w/P2000 --out _o/DOGRULA_78 --pairs GEMINI_LEO > /dev/null
          python3 sosyal/pin_v6/dogrula.py _o/DOGRULA_78 | sed 's/^/::warning::BILGI_78 (onayli EMILY-JAMES posterinden, setteki GEMINI_LEO baska isimli) /'; D78=${PIPESTATUS[0]}
          python3 sosyal/pin_v6/pin_toplu.py --posters _w/P2000 --out _o/ORNEK --pairs CAPRICORN_SAGITTARIUS | tee _w/orn.txt; OR=${PIPESTATUS[0]}
          grep OZET _w/orn.txt | sed 's/^/::warning::ORNEK /'
          rclone copy _w/P2000 "$D/_POSTER2000" -q --transfers 8
          rclone copy _o/ORNEK "$D/ORNEK" -q
          rclone copy _o/KONTROL "$D/KONTROL" -q
          rclone copy _o/DOGRULA_REF "$D/DOGRULA/REF_2000" -q; rclone copy _o/DOGRULA_78 "$D/DOGRULA/SET78" -q
          echo "::warning::DRIVE _POSTER2000 $(rclone lsf "$D/_POSTER2000" | wc -l) dosya, ORNEK $(rclone lsf "$D/ORNEK" | wc -l) dosya"
          cp _o/ORNEK/*.jpg _o/ORNEK/QC.* _pv/ 2>/dev/null; cp _o/KONTROL/* _pv/; cp _o/DOGRULA_78/gemini-and-leo-*p*.jpg _pv/ 2>/dev/null
          echo "PK=$PK DR=$DR D78=$D78 OR=$OR" | tee _pv/SONUC.txt
          echo "RC=$(( PK + DR + OR ))" >> "$GITHUB_ENV"
      - name: hepsi
        if: ${{ inputs.mod == 'hepsi' }}
        run: |
          set +e -uo pipefail   # Actions varsayilani bash -e; kapilar sonuna kadar kossun
          mkdir -p _w/P2000 _o/PINLER _pv
          rclone copy "$D/_POSTER2000" _w/P2000 -q --transfers 8
          N=$(ls _w/P2000/*.jpg | wc -l); echo "::warning::POSTER2000 $N"; [ "$N" = 78 ] || { echo "::error::78 poster yok"; exit 1; }
          python3 sosyal/pin_v6/pin_toplu.py --posters _w/P2000 --out _o/PINLER --kontak | tee _w/log.txt; RC=${PIPESTATUS[0]}
          grep OZET _w/log.txt | sed 's/^/::warning::/'
          rclone copy _o/PINLER "$D/PINLER" -q --transfers 8
          echo "::warning::DRIVE PINLER $(rclone lsf "$D/PINLER" | wc -l) dosya"
          cp _o/PINLER/QC.* _o/PINLER/FAIL.txt _pv/
          python3 -c "
          from PIL import Image
          for k in ('KONTAK_P2','KONTAK_PARCA'):
              im=Image.open('_o/PINLER/'+k+'.jpg'); im.thumbnail((2400,2400)); im.save('_pv/'+k+'_kucuk.jpg',quality=80)"
          echo "RC=$RC" >> "$GITHUB_ENV"
      - name: link (Etsy salt okuma)
        if: ${{ inputs.mod == 'link' }}
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
        run: |
          set +e -uo pipefail   # Actions varsayilani bash -e; kapilar sonuna kadar kossun
          mkdir -p _o/LINK _pv
          python3 sosyal/pin_v6/etsy_link.py sosyal/pin_v6/PIN_METIN_234.csv _o/LINK | tee _w_link.txt; RC=${PIPESTATUS[0]}
          grep OZET _w_link.txt | sed 's/^/::warning::/'
          rclone copyto _o/LINK/PIN_METIN_234_LINKLI.csv "$D/PIN_METIN_234_LINKLI.csv" -q
          rclone copyto _o/LINK/ETSY_ESLESME.csv "$D/ETSY_ESLESME.csv" -q
          cp _o/LINK/* _pv/
          echo "RC=$RC" >> "$GITHUB_ENV"
      - name: Onizleme dali
        if: ${{ always() }}
        run: |
          set +e -uo pipefail   # Actions varsayilani bash -e; kapilar sonuna kadar kossun
          [ -n "$(ls -A _pv 2>/dev/null)" ] || exit 0
          if grep -rqE 'x-api-key|refresh_token|"access_token"' _pv/ 2>/dev/null; then echo "::error::onizlemede sir benzeri anahtar"; exit 1; fi
          B=pin-v6-onizleme; M="${{ inputs.mod }}"
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git fetch -q origin $B 2>/dev/null && git worktree add -q _pvw origin/$B 2>/dev/null || { git worktree add -q --detach _pvw; (cd _pvw && git checkout -q --orphan tmp && git rm -rqf . ); }
          rm -rf "_pvw/$M"; mkdir -p "_pvw/$M"; cp -r _pv/* "_pvw/$M/"
          cd _pvw && git add -A && git commit -qm "pin-v6 onizleme: $M (kosu ${{ github.run_id }})" && git push -q origin HEAD:refs/heads/$B && echo "::warning::ONIZLEME $B/$M"
      - name: Sonuc
        if: ${{ always() }}
        run: |
          rm -rf ~/.config/rclone
          [ "${RC:-1}" = "0" ]

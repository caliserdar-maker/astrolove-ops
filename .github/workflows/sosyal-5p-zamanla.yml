name: sosyal-5p-zamanla

# 5 platform 77 gun Metricool zamanlama (Serdar onayi 13 Eki 2026). Plan: Drive SOSYAL_PLAN_20261012/PLAN_5_PLATFORM.csv
# (539 satir, GEMINI_LEO haric). Her cift: video + kapak (kapak_v1) Metricool S3'e, 7 gonderi POST, hemen geri okuma;
# FAIL -> DUR. Saati gecmis satir atlanir. Zaten var olan (ag + metin) tekrar yazilmaz.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      gunler:
        description: "plan gun araligi, orn. 2-2 ya da 3-78"
        default: "2-2"
      mod:
        type: choice
        options: [kuru, yaz]
        default: kuru

concurrency:
  group: metricool-5p-yaz
  cancel-in-progress: false

jobs:
  zamanla:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      KD: gdrive:ASTROLOVE/TEMP/VIDEO_V9_20261012/KAPAK
      V: gdrive:ASTROLOVE/TEMP/VIDEO_V9_20261012/FINAL
      O: gdrive:ASTROLOVE/TEMP/SOSYAL_PLAN_20261012
    steps:
      - uses: actions/checkout@v4
      - name: rclone + token
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            export RCLONE_CONFIG_GDRIVE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET"
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
          mkdir -p _work _out _w/kapak _w/video
          rclone copyto "gdrive:ASTROLOVE/TEMP/METRICOOL_TOKEN.json" _work/mc.json
          python3 -c "import json;print('::add-mask::'+json.load(open('_work/mc.json'))['userToken'])"

      - name: Plan + kapak + video (yalniz bu gunler)
        env:
          GUNLER: ${{ inputs.gunler }}
        run: |
          set -euo pipefail
          rclone copyto "$O/PLAN_5_PLATFORM.csv" _w/PLAN.csv
          rclone copy "$KD" _w/kapak -q --transfers 8 --include "*-kapak.jpg"
          python3 - <<'EOF' > _w/videolar.txt
          import csv, os
          g1, g2 = (int(x) for x in os.environ['GUNLER'].split('-'))
          print('\n'.join(sorted({r['video_dosya'] for r in csv.DictReader(open('_w/PLAN.csv', encoding='utf-8'))
                                  if g1 <= int(r['gun']) <= g2 and r['video_dosya']})))
          EOF
          rclone copy "$V" _w/video -q --transfers 8 --files-from _w/videolar.txt
          echo "PLAN $(($(wc -l < _w/PLAN.csv) - 1)) satir; kapak $(ls _w/kapak | wc -l); video $(ls _w/video | wc -l)/$(wc -l < _w/videolar.txt)" | python3 scripts/guvenlik/sir_koru.py tee --sir-json _work/mc.json "$GITHUB_STEP_SUMMARY"

      - name: Zamanla (mod=${{ inputs.mod }}, gunler=${{ inputs.gunler }})
        env:
          GUNLER: ${{ inputs.gunler }}
          MOD: ${{ inputs.mod }}
        run: |
          set -uo pipefail
          python3 scripts/sosyal/metricool_5p_yaz.py --token-dosya _work/mc.json --plan _w/PLAN.csv --gunler "$GUNLER" --mod "$MOD" \
            --video-dir _w/video --kapak-dir _w/kapak --cikti _out 2>&1 | python3 scripts/guvenlik/sir_koru.py tee --sir-json _work/mc.json "$GITHUB_STEP_SUMMARY"
          rc=${PIPESTATUS[0]}
          python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/mc.json _out || exit 1   # sir varsa Drive'a yuklenmez
          rclone copy _out "$O" --include "*.json"
          rclone lsl "$O" --include "YAZIM_*.json" --include "KURU_*.json" | python3 scripts/guvenlik/sir_koru.py tee --sir-json _work/mc.json "$GITHUB_STEP_SUMMARY"
          exit $rc

      - if: always()
        run: |
          rm -rf _work ~/.config/rclone
          if [ -f "$RUNNER_TEMP/SIR_ENGEL" ]; then echo "::error::sir iceren satir engellendi (sir_koru)"; exit 1; fi

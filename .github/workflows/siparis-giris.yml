name: siparis-giris
# KISISEL DIJITAL SIPARIS GIRISI (9 Eki 2026, Serdar): musteriye 1 dosya = secilen renk + secilen olcu.
# Yonlendirme: MIDNIGHT_BLUE -> YENI YOL (siparis-gpt kodu, sabit SHA; yontem B olcu) ANCAK anahtar aciksa
#   (repo degiskeni SIPARIS_GPT_ACIK == '1'; varsayilan KAPALI) ya da girdi yeni_yol=ac (yalniz test).
#   Diger renkler -> ESKI YOL (siparis-dijital, isler=renk:<R>, renk_ref acik). WARM_PARCHMENT -> DUR (su an teslim edilemez).
# kuru=true: yalniz yonlendirme karari yazilir, uretim YOK. Isim/mesaj loga yazilmaz (::add-mask::, girdiler olay dosyasindan okunur).
# Etsy'ye yazma / musteriye gonderim YOK. Geri donus: SIPARIS_GPT_ACIK degiskenini silmek (ya da 0) -> tum renkler eski yola.
on:
  workflow_dispatch:
    inputs:
      receipt: { description: "Etsy receipt (yalniz rakam)", required: true }
      cift: { description: "Cift (orn. CANCER_LIBRA)", required: true }
      isim1: { description: "isim1 (cift adindaki ilk burc, solda)", required: true }
      isim2: { description: "isim2", required: true }
      mesaj_b64: { description: "tagline, base64 (UTF-8)", required: true }
      renk:
        description: "renk"
        required: true
        type: choice
        options: [MIDNIGHT_BLUE, DEEP_BLACK, PURE_WHITE, CHAMPAGNE_IVORY, WARM_PARCHMENT]
      olcu:
        description: "olcu"
        required: true
        type: choice
        options: ["8x10", "11x14", "12x16", "12x18", "16x20", "16x24", "18x24", "20x30", "24x30", "24x36", "A4", "A3", "A2"]
      yeni_yol:
        description: "anahtar = repo degiskeni SIPARIS_GPT_ACIK; ac = yalniz test icin yeni yol (Midnight Blue)"
        required: true
        type: choice
        default: anahtar
        options: [anahtar, ac]
      kuru:
        description: "true = yalniz yonlendirme karari, uretim yok"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
env:
  GPT_REF: ${{ vars.SIPARIS_GPT_REF || '103dbf45187560f97f44c76a726bf8ef93845f8f' }}
  ESKI_RENK_REF: ${{ vars.ESKI_RENK_REF || 'b8c8c4b17478fd956167577fa69913d06b9eb955' }}
jobs:
  yonlendir:
    runs-on: ubuntu-latest
    outputs:
      yol: ${{ steps.k.outputs.yol }}
    steps:
      - id: k
        name: Karar
        env:
          ACIK: ${{ vars.SIPARIS_GPT_ACIK || '0' }}
        run: |
          set -euo pipefail
          E="$GITHUB_EVENT_PATH"
          for k in isim1 isim2; do v=$(jq -r ".inputs.$k" "$E"); echo "::add-mask::$v"; echo "::add-mask::${v^^}"; done
          m=$(jq -r '.inputs.mesaj_b64' "$E" | base64 -d); echo "::add-mask::$m"
          jq -re '.inputs.receipt | test("^[0-9]+$")' "$E" >/dev/null || { echo "HATA: receipt rakam olmali" >&2; exit 1; }
          jq -re '.inputs.cift | test("^[A-Z]+_[A-Z]+$")' "$E" >/dev/null || { echo "HATA: cift" >&2; exit 1; }
          R=$(jq -r '.inputs.renk' "$E"); O=$(jq -r '.inputs.olcu' "$E"); Y=$(jq -r '.inputs.yeni_yol' "$E"); KURU=$(jq -r '.inputs.kuru' "$E")
          if [ "$R" = "WARM_PARCHMENT" ]; then YOL=dur
          elif [ "$R" = "MIDNIGHT_BLUE" ] && { [ "$Y" = "ac" ] || [ "$ACIK" = "1" ]; }; then YOL=yeni
          else YOL=eski; fi
          [ "$KURU" = "true" ] && Z=kuru || Z=uret
          echo "::notice title=YONLENDIRME::renk=$R olcu=$O anahtar=$ACIK yeni_yol=$Y -> $YOL ($Z)"
          { echo "### Siparis yonlendirme"; echo "renk $R, olcu $O, anahtar $ACIK, yeni_yol $Y -> **$YOL** ($Z)"; } >> "$GITHUB_STEP_SUMMARY"
          [ "$Z" = "kuru" ] && echo "yol=kuru-$YOL" >> "$GITHUB_OUTPUT" || echo "yol=$YOL" >> "$GITHUB_OUTPUT"
          if [ "$YOL" = "dur" ] && [ "$Z" = "uret" ]; then echo "::error title=DUR::Warm Parchment su an teslim edilemez (Serdar karari)"; exit 1; fi

  eski:
    needs: yonlendir
    if: ${{ needs.yonlendir.outputs.yol == 'eski' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Eski yolu tetikle (siparis-dijital, tek renk)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          E="$GITHUB_EVENT_PATH"
          for k in isim1 isim2; do v=$(jq -r ".inputs.$k" "$E"); echo "::add-mask::$v"; echo "::add-mask::${v^^}"; done
          m=$(jq -r '.inputs.mesaj_b64' "$E" | base64 -d); echo "::add-mask::$m"
          gh workflow run siparis-dijital.yml -R "$GITHUB_REPOSITORY" --ref main \
            -f receipt="$(jq -r .inputs.receipt "$E")" -f cift="$(jq -r .inputs.cift "$E")" \
            -f isim1="$(jq -r .inputs.isim1 "$E")" -f isim2="$(jq -r .inputs.isim2 "$E")" -f mesaj_b64="$(jq -r .inputs.mesaj_b64 "$E")" \
            -f isler="renk:$(jq -r .inputs.renk "$E")" -f renk_ref="$ESKI_RENK_REF" -f wp_pod_kod=v1 > /dev/null
          echo "::notice title=ESKI YOL::siparis-dijital tetiklendi (renk:$(jq -r .inputs.renk "$E"), renk_ref $ESKI_RENK_REF)"

  yeni:
    needs: yonlendir
    if: ${{ needs.yonlendir.outputs.yol == 'yeni' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: siparis-gpt
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.GPT_REF }}", fetch-depth: 1, sparse-checkout: "motor_gpt" }
      - name: Girdi + maske
        run: |
          set -euo pipefail
          E="$GITHUB_EVENT_PATH"
          jq '.inputs | {receipt, cift, isim1, isim2, mesaj_b64, renk, olcu}' "$E" > /tmp/istek.json
          for k in isim1 isim2; do v=$(jq -r ".$k" /tmp/istek.json); echo "::add-mask::$v"; echo "::add-mask::${v^^}"; done
          m=$(jq -r '.mesaj_b64' /tmp/istek.json | base64 -d); echo "::add-mask::$m"
          C=$(jq -r '.cift' /tmp/istek.json | tr '_' '\n' | sort | paste -sd_)
          echo "CIFT=$C" >> "$GITHUB_ENV"; echo "RECEIPT=$(jq -r .receipt /tmp/istek.json)" >> "$GITHUB_ENV"
          echo "RENK=$(jq -r .renk /tmp/istek.json)" >> "$GITHUB_ENV"; echo "OLCU=$(jq -r .olcu /tmp/istek.json)" >> "$GITHUB_ENV"
          echo "T_BAS=$(date -u +%s)" >> "$GITHUB_ENV"
          echo "::notice title=YENI YOL::siparis-gpt kodu $GPT_REF"
      - name: rclone
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/rc.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q -j /tmp/rc.zip '*/rclone' -d /tmp/rcb && sudo install -m 755 /tmp/rcb/rclone /usr/local/bin/rclone
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true; fi
      - name: Kaynak indir (katman + standart alfa + standart poster) ve motor ortami (paralel)
        run: |
          set -euo pipefail
          K="gdrive,root_folder_id=1ZQGR0fI0HQNq1D2Lbmr2qlkNVbD8jRyD:"
          P="gdrive,root_folder_id=1E-vvy7BVE2C2VEuRDoVUf6g9PZpvh5-H:"
          mkdir -p /tmp/k /tmp/ref
          ( rclone copy "$K" /tmp/k --include "${CIFT}_ana.png" --include "${CIFT}_ana.png.json" --include "${CIFT}_std_alfa.npz" --include "ek/**"
            rclone copy "$P" /tmp/ref --include "${CIFT}_7200x10800.jpg" ) &
          sudo mkdir -p /home/claude/ao/KANIT /home/claude/motor_klon/motor && sudo chown -R "$USER" /home/claude
          ln -s "$GITHUB_WORKSPACE/motor_gpt" /home/claude/blender
          ln -s "$GITHUB_WORKSPACE/motor_gpt/font" /home/claude/motor_klon/motor/font
          ln -s "$GITHUB_WORKSPACE/motor_gpt/ref" /home/claude/ref
          python3 -m venv /home/claude/blender/venv
          /home/claude/blender/venv/bin/pip install -q numpy==2.5.3 opencv-python-headless==5.0.0.93 pillow==12.3.0 scipy==1.18.1 scikit-image==0.26.0 potracer==0.0.4
          wait
          ls -la /tmp/k /tmp/k/ek /tmp/ref
          ln -s /tmp/k/ek/SCORPIO_VIRGO_T5_FAIL_tam.png /home/claude/ao/KANIT/SCORPIO_VIRGO_T5_FAIL_tam.png
      - name: Uret
        run: |
          set -euo pipefail
          I=/tmp/istek.json
          /home/claude/blender/venv/bin/python /home/claude/blender/siparis_uret.py "$(jq -r .cift $I)" "$(jq -r .isim1 $I)" "$(jq -r .isim2 $I)" "$(jq -r .mesaj_b64 $I)" "/tmp/k/${CIFT}_ana.png" /tmp/is
      - name: Kapilar
        run: |
          set +e
          REF_ALFA=/tmp/k/${CIFT}_std_alfa.npz /home/claude/blender/venv/bin/python /home/claude/blender/siparis_kapi.py /tmp/is /tmp/ref/${CIFT}_7200x10800.jpg --json /tmp/is/KAPI.json
          echo "KAPI_RC=$?" >> "$GITHUB_ENV"
      - name: Drive'a yaz
        if: always()
        run: |
          set -euo pipefail
          D="gdrive,root_folder_id=12N9iS2i4byMbkH5c0Inmni_nIv2zyTzH:SIPARIS_ISIM/GPT/AstroLoveArt_${RECEIPT}"
          python3 -c "import json,os; json.dump(dict(kosu=os.environ['GITHUB_RUN_ID'], is_basi_utc=int(os.environ['T_BAS']), giris='siparis-giris', gpt_ref=os.environ['GPT_REF']), open('/tmp/is/SURE.json','w'))"
          rclone copy /tmp/is "$D" --include "AstroLoveArt_*.jpg" --include "KAPI.json" --include "SURE.json" --include "siparis.json" --exclude "*"
          rclone lsl "$D"
      - name: Sonuc
        run: '[ "${KAPI_RC:-1}" = "0" ]'
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone

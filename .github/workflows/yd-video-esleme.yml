name: yd-video-esleme
# YD 1. asama (Serdar 1 Kas karar 2): 78 cift icin TEMP/YD_VIDEO_ORNEK43 altindaki EN SON basarili video (klasorde mp4 = o cift o kosuda
# uretim + ffprobe kapisini gecti); 3 yeni kapakli cift ZORUNLU kosu 41292904564 klasorunden. ETSY YOK, KILIT YOK (Etsy istegi yok).
# Cikti Drive TEMP/YD_VIDEO_ESLEME/<damga>/ VIDEO_ESLEME.csv + .md + SECIM.json + KOSU.json (damga -> kosu no, GitHub loglarindan).
# Kapi: 78 satir, tekrar 0, eksik 0, 1440x1080. Kod: scripts/kapak78/yd_video_esleme.py
permissions:
  actions: read
  contents: read
on:
  workflow_dispatch:
    inputs:
      zorunlu_kosu: {description: "3 yeni kapakli ciftin kosusu", required: true, default: "41292904564"}
jobs:
  esle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Kurulum
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq ffmpeg >/dev/null
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || sudo apt-get install -y -qq rclone >/dev/null
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"; echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Kosu -> damga (GitHub loglari)
        env:
          GH_TOKEN: ${{ github.token }}
          ZK: ${{ inputs.zorunlu_kosu }}
        run: |
          set -euo pipefail
          [[ "$ZK" =~ ^[0-9]+$ ]] || { echo "::error::zorunlu_kosu"; exit 1; }
          echo "DAMGA=$(date -u +%Y%m%d_%H%M%S)" >> "$GITHUB_ENV"
          mkdir -p _o _v
          gh api "repos/${{ github.repository }}/actions/workflows/yd-video-ornek43.yml/runs?per_page=100" --jq '.workflow_runs[] | "\(.id) \(.conclusion)"' > _o/kosular.txt
          echo "{" > _o/KOSU.json; ilk=1
          while read -r id son; do
            d=$(gh api "repos/${{ github.repository }}/actions/runs/$id/logs" > _l.zip 2>/dev/null && unzip -p _l.zip 2>/dev/null | grep -oE "TEMP/YD_VIDEO_ORNEK43/[0-9]{8}_[0-9]{6}" | head -1 | cut -d/ -f3 || true)
            [ -n "$d" ] || continue
            [ $ilk = 1 ] || echo "," >> _o/KOSU.json; ilk=0
            echo "\"$d\": \"$id ($son)\"" >> _o/KOSU.json
            [ "$id" = "$ZK" ] && echo "ZD=$d" >> "$GITHUB_ENV"
          done < _o/kosular.txt
          echo "}" >> _o/KOSU.json; rm -f _l.zip
          cat _o/KOSU.json
      - name: Secim + indirme + olcum
        run: |
          set -uo pipefail
          [ -n "${ZD:-}" ] || { echo "::error::zorunlu kosunun damgasi loglarda bulunamadi"; exit 1; }
          K="gdrive:ASTROLOVE/TEMP/YD_VIDEO_ORNEK43"
          rclone lsjson -R "$K" --files-only --no-modtime --no-mimetype --include "/*/*_yd_video_43.mp4" > _o/LS.json
          python3 scripts/kapak78/yd_video_esleme.py sec _o/LS.json data/pod/yd78_ids.csv _o \
            --zorunlu "ARIES_LEO=$ZD" --zorunlu "CAPRICORN_SAGITTARIUS=$ZD" --zorunlu "SAGITTARIUS_SAGITTARIUS=$ZD"; R1=$?
          rclone copy "$K" _v --files-from _o/INDIR.txt --transfers 8 -q
          python3 scripts/kapak78/yd_video_esleme.py olc _o/SECIM.json _v _o/KOSU.json data/pod/yd78_ids.csv _o; R2=$?
          echo "SONUC=$R1$R2" >> "$GITHUB_ENV"
          head -12 _o/VIDEO_ESLEME.md
      - name: Drive'a yaz
        if: always()
        run: |
          [ -d _o ] && rclone copy _o "gdrive:ASTROLOVE/TEMP/YD_VIDEO_ESLEME/${DAMGA:-yok}" --immutable -q && echo "::notice::TEMP/YD_VIDEO_ESLEME/${DAMGA:-yok}/" || true
          rm -rf _v ~/.config/rclone
          [ "${SONUC:-x}" = "00" ] || { echo "::error::esleme kapisi FAIL ($SONUC)"; exit 1; }

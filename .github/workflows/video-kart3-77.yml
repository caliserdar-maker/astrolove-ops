name: video-kart3-77

# video-v1: 77 cift KART 3 (Serdar onayi 25 Eyl 2026). scripts/video_v1/kart3_77.py (video-v1 dali).
# 8 paralel is (her biri ciftlerin 1/8'i), sonra tek serit isi (77 kartlik serit + FAIL raporu).
# Kapsam: YALNIZ Drive (rclone). Etsy/Prodigi secret'i yok; Etsy'ye yazan adim yok. Tetik yalniz workflow_dispatch.

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency: video-kart3-77

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        parca: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Checkout (video-v1)
        uses: actions/checkout@v4
        with:
          ref: video-v1

      - name: Python bagimliliklari
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pillow opencv-python-headless numpy scipy

      - name: rclone kur
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          rclone version | head -1

      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONF_B64:-}" ]; then
            echo "HATA: RCLONE_CONF_B64 secret'i tanimli degil." >&2
            exit 1
          fi
          mkdir -p ~/.config/rclone
          umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
          echo "rclone.conf yazildi ($(wc -c < ~/.config/rclone/rclone.conf) bayt)."

      - name: Kart 3 (parca ${{ matrix.parca }}/8)
        env:
          PARCA: ${{ matrix.parca }}
        run: python scripts/video_v1/kart3_77.py uret "$PARCA" 8

  serit:
    needs: uret
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (video-v1)
        uses: actions/checkout@v4
        with:
          ref: video-v1

      - name: Python bagimliliklari
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pillow numpy

      - name: rclone kur
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          rclone version | head -1

      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONF_B64:-}" ]; then
            echo "HATA: RCLONE_CONF_B64 secret'i tanimli degil." >&2
            exit 1
          fi
          mkdir -p ~/.config/rclone
          umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
          echo "rclone.conf yazildi ($(wc -c < ~/.config/rclone/rclone.conf) bayt)."

      - name: Serit + FAIL raporu
        run: python scripts/video_v1/kart3_77.py serit

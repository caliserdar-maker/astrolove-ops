name: motor-kaynak-siparis

# ADIM 1 (3 Eki 2026, Serdar onayi) kaynak paketi: SCORPIO_VIRGO tam siparis seti, 5 renk x 5 boy (16x20, 18x24, 24x36,
# 11x14, A2). Drive SALT OKUNUR: 25 orijinal satis posteri, renk x boy plate'leri (VINTAGE_B_<boy>, VINTAGE_B1/B2/B3_11x14),
# altin katmanlar, Test 5 PDF sayfalari (gomulu goruntu birebir). Manifest (boyut, sha256) ile inceleme/motor-kaynak-siparis
# dalina (orphan). 90 MB ustu dosya parcalanir (birebir). Yalniz motor dalinda push ile. Etsy YOK, musteri YOK.

on:
  push:
    branches: [motor]
    paths: [motor/kaynak_siparis.trigger]

permissions:
  contents: write

jobs:
  kaynak:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q pymupdf
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Drive'dan indir (salt okuma)
        run: |
          set -euo pipefail
          O=_kaynak; mkdir -p $O/plates $O/orijinal $O/test5; A=gdrive:ASTROLOVE; T=$A/TEMP; L=$A/ARCHIVE/LEGACY_COMPONENTS
          for r in MIDNIGHT_BLUE DEEP_BLACK PURE_WHITE CHAMPAGNE_IVORY WARM_PARCHMENT; do
            for b in 16x20 18x24 24x36 11x14 A2; do
              rclone copyto "$T/POD_PRINT/SCORPIO_VIRGO/$r/$b.jpg" $O/orijinal/${r}_$b.jpg
            done
          done
          for b in 16x20 18x24 24x36 11x14 A2; do
            for e in BLUE BLACK PURE_WHITE MODERN; do rclone copyto "$T/SIPARIS_ISIM/PLATES/${e}_$b.png" $O/plates/${e}_$b.png; done
            [ $b = 11x14 ] || rclone copyto "$T/SIPARIS_ISIM/PLATES/VINTAGE_B_$b.png" $O/plates/VINTAGE_B_$b.png
          done
          for k in 1 2 3; do rclone copyto "$T/SIPARIS_ISIM/PLATES/VINTAGE_B${k}_11x14.png" $O/plates/VINTAGE_B${k}_11x14.png; done
          rclone copyto "$L/main_symbols/scorpio_virgo_gold.png" $O/main_scorpio_virgo_gold.png
          for b in scorpio virgo; do
            rclone copyto "$L/zodiac_symbols_gold/${b}_symbol_gold.png" $O/sym_${b}_gold.png
            rclone copyto "$L/zodiac_names/${b}_name_gold.png" $O/name_${b}_gold.png
          done
          rclone copyto "$L/zodiac_names/cancer_name_gold.png" $O/name_cancer_gold.png
          for r in Midnight_Blue Deep_Black Pure_White Champagne_Ivory Warm_Parchment; do
            rclone copyto "$T/SIPARIS_ISIM/DIJITAL/9000000005/AstroLoveArt_Scorpio_Virgo_$r.pdf" _t5_$r.pdf
          done
          du -sh $O $O/*
      - name: Test 5 sayfalari (gomulu goruntu birebir)
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import fitz, json
          BOY = {(16, 20): '16x20', (18, 24): '18x24', (24, 36): '24x36', (11, 14): '11x14', (16.535, 23.386): 'A2'}
          kay = {}
          for r in ('Midnight_Blue', 'Deep_Black', 'Pure_White', 'Champagne_Ivory', 'Warm_Parchment'):
              d = fitz.open(f'_t5_{r}.pdf'); R = r.upper()
              for i, p in enumerate(d):
                  w, h = p.rect.width / 72, p.rect.height / 72
                  b = [v for k, v in BOY.items() if abs(k[0] - w) < 0.05 and abs(k[1] - h) < 0.05]
                  im = p.get_images(full=True)
                  x = d.extract_image(im[0][0])
                  ad = f"test5/{R}_{b[0]}.{x['ext']}"
                  open('_kaynak/' + ad, 'wb').write(x['image'])
                  kay[f'{R}_{b[0]}'] = {'sayfa': i + 1, 'inc': [round(w, 3), round(h, 3)], 'dosya': ad,
                                       'goruntu_px': [x['width'], x['height']], 'goruntu_sayisi': len(im)}
          json.dump(kay, open('_kaynak/test5_sayfalar.json', 'w'), indent=1); print(json.dumps(kay, indent=1))
          EOF
      - name: Manifest + parcala
        run: |
          set -euo pipefail
          cd _kaynak
          python3 - <<'EOF' > MANIFEST.txt
          import hashlib, os
          for r, _, fs in sorted(os.walk('.')):
              for f in sorted(fs):
                  p = os.path.join(r, f)
                  if f == 'MANIFEST.txt': continue
                  print(f"{p}\t{os.path.getsize(p)}\t{hashlib.sha256(open(p, 'rb').read()).hexdigest()}")
          EOF
          cat MANIFEST.txt
          find . -type f -size +90M | while read f; do split -b 90M -d "$f" "$f.parca"; rm "$f"; echo "parcalandi $f"; done
      - name: Commit (inceleme/motor-kaynak-siparis, orphan)
        run: |
          set -euo pipefail
          K=$(git rev-parse HEAD)
          cd _kaynak
          git init -q -b inceleme/motor-kaynak-siparis
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "motor dali $K, kosu ${{ github.run_id }}" > KAYNAK.txt
          git add -A
          git commit -q -m "motor-kaynak-siparis: SCORPIO_VIRGO 5 renk x 5 boy kaynaklari (motor $K, kosu ${{ github.run_id }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:inceleme/motor-kaynak-siparis
          git log -1 --format='%H'
      - if: always()
        run: rm -rf ~/.config/rclone

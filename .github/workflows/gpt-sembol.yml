name: gpt-sembol
# ChatGPT resim modeli (OpenAI API) ile ana sembol baglantilari. Girdi: gpt_sembol/ (bu dal). Cikti: gpt-sembol-veri-<kosu no> dali (paralel kosular birbirini ezmez).
# Anahtar Drive TEMP/OPENAI_API_KEY.txt'den okunur ve maskelenir. Etsy'ye ve musteriye dokunmaz.
on:
  push:
    branches: [gpt-sembol]
    paths: [gpt_sembol/is.txt]
permissions:
  contents: write
jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: rclone kur
        run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: "OpenAI anahtari (maskeli)"
        run: |
          set -euo pipefail
          K=$(rclone cat "gdrive,root_folder_id=12N9iS2i4byMbkH5c0Inmni_nIv2zyTzH:OPENAI_API_KEY.txt" | tr -d '[:space:]')
          echo "::add-mask::$K"
          [ -n "$K" ] || { echo "anahtar bos"; exit 1; }
          echo "OPENAI_API_KEY=$K" >> "$GITHUB_ENV"
      - name: "Bakiye (API, 8 Eki)"
        run: |
          mkdir -p cikti
          python3 - <<'PY'
          import json, os, urllib.request, time
          K = os.environ['OPENAI_API_KEY']; out = {}
          uclar = {'credit_grants': 'https://api.openai.com/v1/dashboard/billing/credit_grants',
                   'costs_30g': 'https://api.openai.com/v1/organization/costs?start_time=%d&limit=30' % (time.time() - 30 * 86400)}
          for ad, u in uclar.items():
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers={'Authorization': 'Bearer ' + K}), timeout=60)
                  d = json.load(r); out[ad] = dict(kod=200, veri={k: d[k] for k in ('total_granted', 'total_used', 'total_available') if k in d} or str(d)[:1500])
              except urllib.error.HTTPError as e:
                  out[ad] = dict(kod=e.code, hata=e.read().decode()[:300])
              except Exception as e:
                  out[ad] = dict(hata=repr(e)[:300])
          json.dump(out, open('cikti/bakiye_once.json', 'w'), indent=1); print(json.dumps(out)[:2000])
          PY
      - name: "Uret"
        run: |
          pip install -q requests
          python3 scripts/gpt_sembol/uret.py || echo "URET_FAIL=1" >> "$GITHUB_ENV"
      - name: "Veri dalina yaz (gpt-sembol-veri)"
        if: always()
        run: |
          set -euo pipefail
          mkdir -p cikti; cd cikti
          echo "${{ github.run_id }}" > KOSU.txt
          git init -q -b gpt-sembol-veri-${{ github.run_number }}
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -qm "gpt-sembol ciktisi (kosu ${{ github.run_id }})"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gpt-sembol-veri-${{ github.run_number }}
      - name: "Sonuc"
        run: '[ -z "${URET_FAIL:-}" ]'

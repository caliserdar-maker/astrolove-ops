name: ornament-son-uretim
# Serdar 3 Kas, karar 22: ORNAMENT SON URETIM, 6 renk, Actions'ta yeniden uretim (CLAUDE.md KARAR 3). Bu is akisi YALNIZ dal
# ornament-printful-katalog'da (main'e alinmaz; Serdar). Tetik: dalda docs/ornament/SON_URETIM_TETIK.txt degisince push.
# Girdiler: Drive dosya kimlikleri (rclone copyid) + dal git show (sabit commit); hepsinin sha256'si BEKLENEN listeyle karsilastirilir, fark DUR.
# Uretim: ornament_son.py (BEIGE, AGED_PAPYRUS), ornament_motor.py (RUBY, SAPPHIRE, EMERALD, deneme 4), ORN_DUMP + ornament_sade.py (SADE ALTIN).
#   111 MB katman dosyasi Drive'dan INDIRILMEZ: ayni koddan Actions'ta yeniden uretilir (yerel pkl sha'si bilgi olarak loglanir).
# Kapi: 6 PNG onayli PNG'lerle (e5412718, a5e3ea2, 029a670d) PIKSEL PIKSEL ayni. Fark varsa DUR: Drive yok, yalniz log dala.
# PASS: Drive TEMP/ORNAMENT_SON_<damga>/ (6 PNG + ONIZLEME_76mm_6RENK + MOCKUP_1 + OLCUM) ve eski TEMP/ORNAMENT_ORNEK_20261103_SON/STIL3_SON
#   -> STIL3_SON_ESKI (yeniden adlandirma; SILME YOK). Etsy / Printful API yok, token yok.
on:
  push:
    branches: [ornament-printful-katalog]
    paths: [docs/ornament/SON_URETIM_TETIK.txt]
permissions:
  contents: write
jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DAL: ornament-printful-katalog
      MOTOR_COMMIT: 6da763aa5b9820027420f73264fc69d30e120a33
      TEK_DOKU_COMMIT: 2a08a78216ca
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ornament-printful-katalog
          fetch-depth: 0
          path: s
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Paketler (yerel uretimle ayni surumler)
        run: |
          pip install -q pillow==11.0.0 numpy==2.5.4 opencv-python-headless==5.0.0.93 scipy==1.18.1 scikit-image==0.26.0 potracer==0.0.4
          python3 -c "import sys, numpy, cv2, PIL, scipy, skimage; print('python', sys.version.split()[0], 'numpy', numpy.__version__, 'cv2', cv2.__version__, 'pillow', PIL.__version__, 'scipy', scipy.__version__, 'skimage', skimage.__version__)" | tee /tmp/paket.txt
          pip freeze | grep -i potrace | tee -a /tmp/paket.txt
          lscpu | grep -E 'Model name|Flags' | cut -c1-200 | tee -a /tmp/paket.txt
      - name: rclone kur + yapilandir
        timeout-minutes: 5
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || sudo apt-get install -y -qq rclone >/dev/null
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Girdiler (Drive + git) ve sha256 kapisi
        run: |
          set -euo pipefail
          K=/tmp/kay; MD=/tmp/mg; mkdir -p $K $MD/kure $MD/palet $MD/girdi78/ana
          rclone backend copyid gdrive: 17V0yS8Uo0nFJO3QpoUfnSaOWjv_o0x5p "$K/" 1xY_Pcr11EM4pMQYyZynLM_4zyS1GJUjS "$K/" 1FHwFRdgOcN5LGYS5PkGBghmCqJo16t7B "$K/"
          git -C s fetch -q origin ornek-tek-doku siparis-gpt gecici/ornament-sembol-renk
          for f in motor/varlik/halka/HALKA_BLUE_16x20.png motor/font/Cinzel.ttf motor/font/EBGaramond-Italic.ttf motor/tek_doku.py; do
            git -C s show "$TEK_DOKU_COMMIT:$f" > "$K/$(basename $f)"; done
          for f in BEIGE_1264.png AGED_PAPYRUS_1264.png; do git -C s show 2877495:zemin_acik/$f > $K/$f; done
          cp s/docs/ornament/zemin3/V2/RUBY_1264.png s/docs/ornament/zemin3/V2/SAPPHIRE_1264.png s/docs/ornament/zemin3/V2/EMERALD_1264.png $K/
          git -C s show $MOTOR_COMMIT:motor_gpt/girdi/LOGO_1.png > $K/LOGO_1.png
          git -C s show $MOTOR_COMMIT:motor_gpt/girdi78/ana/cancer_libra_alfa.png > $K/cancer_libra_alfa.png
          git -C s show $MOTOR_COMMIT:motor_gpt/alfa_ogeler.npz > $K/alfa_ogeler.npz
          for f in KILIT_GPTGIRDI.json golge_motor.py vektor_yuzey.py alfa_temizle.py uret_tam.py renk_uyum.py olustur_alfa_sablon.py kure/k4.npy palet/chatgpt_altin.png yerlesim78.json cember.json girdi78/ana/cancer_libra_alfa.png; do
            git -C s show $MOTOR_COMMIT:motor_gpt/$f > $MD/$f; done
          cat > /tmp/beklenen.txt <<'EOF'
          e86c2629629305fd90bbb66494238faef9b4ad1acb815eb7b3ed55e7f44fc2d2  /tmp/kay/CANCER_LIBRA_ana.png
          2b5a32121ce8fa92ceef1a386f5ab1742a573681c30e742223be75005816cf28  /tmp/kay/cancer_symbol_gold.png
          6fe2d0355ee56f8468eb637d3ca6445fd517983b00e51bce76cac218864f6a4b  /tmp/kay/libra_symbol_gold.png
          0dfe2f2db5c1996bae7268c77d463b311d85c2b0f7f24d03dc4b2d13b2dd3988  /tmp/kay/AGED_PAPYRUS_1264.png
          a55e7703f65ca3bdaeba6ff5055517f0d4f2ecb2920ee3e5b04d021bbf58d29b  /tmp/kay/BEIGE_1264.png
          f0d1483b42810dd0f99e85af3e9ec05f2873d4fdca24c2f0a8f35b0f7492efd1  /tmp/kay/EMERALD_1264.png
          7c009226598720039dc47350018fb23a9881007b7d97cd48a9ee1390d650f939  /tmp/kay/RUBY_1264.png
          29df83c0cf1d0df42e765304e6e9950d3171fbf9fc5ca300978801d6647e7ee0  /tmp/kay/SAPPHIRE_1264.png
          2a11ac819c611eaa84e60e469316f345eaa8eb48f6e9e6113d9a7831ab2fa410  /tmp/kay/HALKA_BLUE_16x20.png
          62239238b25dbc5417dab4dc353fdbf15129599c9372737d5d8ddb86b3042061  /tmp/kay/LOGO_1.png
          1889906fb29920e9294d5c343ace09b2295d81e4c49153d2badfb8d5101ddbad  /tmp/kay/tek_doku.py
          f4d83d34d1f6c741193e4acf4b3dff9531e5a67b6aa65228d00a7db72a4e0f34  /tmp/kay/Cinzel.ttf
          bba2c4499c93c9612b90b9825d32b07da52fce2fe57562a1eb6b833553f93c4e  /tmp/kay/EBGaramond-Italic.ttf
          f946f5611431bdf976dce3475db8fd653faf1242ca267c365e2e29c8b3c8a8c2  /tmp/kay/cancer_libra_alfa.png
          d373403191a6245eccf386f0aa01d6380996b72e22d20e3ae8c7c5f6839d16e9  /tmp/kay/alfa_ogeler.npz
          EOF
          sed -i 's/^ *//' /tmp/beklenen.txt
          sha256sum -c /tmp/beklenen.txt | tee /tmp/girdi_sha.txt
          (cd $MD && find . -type f | sort | xargs sha256sum) | tee -a /tmp/girdi_sha.txt
      - name: Uretim (yerel betiklerle ayni komutlar)
        run: |
          set -euo pipefail
          K=/tmp/kay; MD=/tmp/mg; U=/tmp/uretim; mkdir -p $U /tmp/son /tmp/motor /tmp/sade
          cd s
          python3 -I scripts/printful/ornament_son.py --kaynak $K --cikti /tmp/son 2>&1 | tee /tmp/log_son.txt | tail -5
          python3 -I scripts/printful/ornament_motor.py --kaynak $K --motor $MD --cikti /tmp/motor --son /tmp/son 2>&1 | tee /tmp/log_motor.txt | tail -4 || true
          ORN_DUMP=/tmp/katman.pkl python3 -I scripts/printful/ornament_motor.py --kaynak $K --motor $MD --cikti /tmp/motor_dump --son /tmp/son 2>&1 | tee /tmp/log_dump.txt | tail -2
          sha256sum /tmp/katman.pkl | tee /tmp/katman_sha.txt
          python3 -I scripts/printful/ornament_sade.py --katman /tmp/katman.pkl --cikti /tmp/sade 2>&1 | tee /tmp/log_sade.txt | tail -2 || true
          for r in RUBY SAPPHIRE EMERALD; do cp /tmp/motor/CANCER_LIBRA_${r}_954.png $U/; done
          for r in BEIGE AGED_PAPYRUS; do cp /tmp/son/CANCER_LIBRA_${r}_954.png $U/; done
          cp /tmp/sade/SADE_1_ALTIN_TONU_954.png $U/CANCER_LIBRA_SADE_ALTIN_954.png
          ls -la $U
      - name: Kapi (piksel piksel) + paket
        id: kapi
        run: |
          set -uo pipefail
          ON=/tmp/onayli; mkdir -p $ON; cd s
          for r in RUBY SAPPHIRE EMERALD; do git show e5412718:docs/ornament/ornek/ORNAMENT_ORNEK_20261103_ALTIN_MOTOR/CANCER_LIBRA_${r}_954.png > $ON/CANCER_LIBRA_${r}_954.png; done
          for r in BEIGE AGED_PAPYRUS; do git show a5e3ea2:docs/ornament/ornek/ORNAMENT_ORNEK_20261103_SON/STIL3_SON/CANCER_LIBRA_${r}_954.png > $ON/CANCER_LIBRA_${r}_954.png; done
          git show 029a670d:docs/ornament/ornek/ORNAMENT_SADE_8/SADE_1_ALTIN_TONU_954.png > $ON/CANCER_LIBRA_SADE_ALTIN_954.png
          git show 029a670d:docs/ornament/ornek/ORNAMENT_SADE_8/MOCKUP_1.jpg > /tmp/MOCKUP_1.jpg
          D=ORNAMENT_SON_$(date -u +%Y%m%d_%H%M); echo "D=$D" >> "$GITHUB_ENV"
          python3 - <<PY
          import json, subprocess
          b = dict(kosu='${GITHUB_RUN_ID}', dal_commit=subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), motor_commit='${MOTOR_COMMIT}',
                   tek_doku_commit='${TEK_DOKU_COMMIT}', paket=open('/tmp/paket.txt').read(), katman_pkl=open('/tmp/katman_sha.txt').read().strip(),
                   katman_pkl_yerel_bilgi='yerel sade4/motor_katman.pkl (OLCUM SADE_8 karar.katman alaninda sha)', girdi_sha=open('/tmp/girdi_sha.txt').read())
          json.dump(b, open('/tmp/bilgi.json', 'w'), indent=1, ensure_ascii=False)
          PY
          python3 -I scripts/printful/ornament_son_uretim.py --uretim /tmp/uretim --onayli $ON --mockup /tmp/MOCKUP_1.jpg --kaynak /tmp/kay \
            --cikti /tmp/$D --bilgi /tmp/bilgi.json 2>&1 | tee /tmp/log_kapi.txt
          k=${PIPESTATUS[0]}; echo "k=$k" >> "$GITHUB_OUTPUT"
          echo "::notice::kapi cikis $k | $(tail -1 /tmp/log_kapi.txt)"
      - name: Drive (yalniz kapi PASS)
        if: steps.kapi.outputs.k == '0'
        run: |
          set -euo pipefail
          rclone copy /tmp/$D "gdrive:ASTROLOVE/TEMP/$D" -q
          ESKI="gdrive:ASTROLOVE/TEMP/ORNAMENT_ORNEK_20261103_SON"
          if rclone lsf "$ESKI" --dirs-only | grep -qx 'STIL3_SON/'; then
            if rclone lsf "$ESKI" --dirs-only | grep -qx 'STIL3_SON_ESKI/'; then echo "::error::STIL3_SON_ESKI zaten var, adlandirma yapilmadi"; exit 1; fi
            rclone moveto "$ESKI/STIL3_SON" "$ESKI/STIL3_SON_ESKI"
            echo "eski klasor: STIL3_SON -> STIL3_SON_ESKI (silme yok)" | tee /tmp/drive_eski.txt
          else echo "::warning::eski STIL3_SON bulunamadi" | tee /tmp/drive_eski.txt; fi
          rclone lsf "$ESKI" --dirs-only | tee -a /tmp/drive_eski.txt
          ID=$(rclone lsjson gdrive:ASTROLOVE/TEMP --dirs-only | python3 -c "import json,sys; print([d['ID'] for d in json.load(sys.stdin) if d['Name']=='$D'][0])")
          echo "https://drive.google.com/drive/folders/$ID" | tee /tmp/drive_link.txt
          rclone ls "gdrive:ASTROLOVE/TEMP/$D" | tee -a /tmp/drive_link.txt
          echo "::notice::Drive TEMP/$D https://drive.google.com/drive/folders/$ID"
      - name: Dal (log + OLCUM + ONIZLEME; PNG kopyasi yok)
        if: always()
        run: |
          set -euo pipefail
          G=s/docs/ornament/ornek/${D:-ORNAMENT_SON_HATA}; mkdir -p $G
          cp /tmp/log_*.txt /tmp/girdi_sha.txt /tmp/paket.txt $G/ 2>/dev/null || true
          cp /tmp/drive_*.txt $G/ 2>/dev/null || true
          [ -n "${D:-}" ] && cp /tmp/$D/OLCUM.json /tmp/$D/ONIZLEME_76mm_6RENK.png $G/ 2>/dev/null || true
          cd s && git config user.name "astrolove-bot" && git config user.email "astrolove-bot@users.noreply.github.com"
          git add docs/ornament/ornek
          DIS=$(git diff --cached --name-only | grep -v '^docs/ornament/ornek/' || true)
          [ -z "$DIS" ] || { echo "::error::izinli klasor disi: $DIS"; exit 1; }
          git commit -qm "ornament son uretim (kosu ${GITHUB_RUN_ID}): kapi cikis ${{ steps.kapi.outputs.k }}" && git push -q origin "HEAD:${DAL}"
      - if: always()
        run: rm -rf ~/.config/rclone
      - name: Sonuc
        if: always()
        run: '[ "${{ steps.kapi.outputs.k }}" = "0" ]'

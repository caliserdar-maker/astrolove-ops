name: by78-taslak
# BIZIM YILIMIZ 78 TASLAK (14 Eki 2026, Takip gorevi, Serdar onayi). YAYIN YOK, PATCH YOK (yalniz acil state=inactive).
# Kota kapisi (ilan x 31 + 500); eski CANCER_LIBRA taslagi silinir; 78 taslak asamali; her asamada state okunur;
# active -> inactive + TUM IS DURUR. BY78_TASLAKLAR.csv Drive'a olusturma aninda yazilir; tekrar kosu kaldigi yerden (cift ilan yok).
permissions:
  actions: read
  contents: read
on:
  workflow_dispatch:
    inputs:
      paket_ref: { description: "bizim-yilimiz-v3 commit (CSV)", required: true, default: "7e3b3f3c28d1260b8888c31ca11050e5541997c3" }
      eski_id: { description: "silinecek eski CANCER_LIBRA taslagi", required: false, default: "4595329616" }
      ciftler: { description: "yalniz bu ciftler (bosluklu); bos = 78", required: false, default: "" }
env:
  O: "gdrive:ASTROLOVE/TEMP/BY78_TASLAK_20261014"
  V3: "gdrive:ASTROLOVE/TEMP/BIZIM_YILIMIZ_78_20261014_v3"
jobs:
  taslak:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.paket_ref }}", path: _paket, fetch-depth: 0, sparse-checkout: BIZIM_YILIMIZ_78_ILAN_METIN.csv, sparse-checkout-cone-mode: false }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Token + onceki durum
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
          rclone copy "$O" _out --include "/BY78_TASLAKLAR.csv" -q || true
          ls -la _out
      - name: 78 taslak
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          CSV: _paket/BIZIM_YILIMIZ_78_ILAN_METIN.csv
          OUT: _out
          DRIVE_OUT: ${{ env.O }}
          ESKI_ID: ${{ inputs.eski_id }}
          CIFTLER: ${{ inputs.ciftler }}
        run: python3 scripts/etsy/by78_taslak.py
      - name: Drive'a rapor
        if: ${{ always() }}
        run: '[ -d _out ] && rclone copy _out "$O" -q && echo "::warning::rapor Drive TEMP/BY78_TASLAK_20261014" || true'
      - name: Token geri yaz
        if: ${{ always() }}
        run: |
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "token geri yazildi" || true
          rm -rf _work ~/.config/rclone

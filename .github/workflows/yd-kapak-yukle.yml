name: yd-kapak-yukle

# YD (1st Anniversary) 78 kapak yukleyicisi (plan v3 adim 7; Merkez 27 Eki). KOSTURMA: kuru kosu, pilot ve yukleme ayri Serdar onayiyla,
# poster galerisi 78/78 bittikten sonra. kuru=true (varsayilan): Etsy salt okuma, PLAN_YD.json + plan_damga. ETSY'YE YAZAR yalniz
# kuru=false + confirm=YD_KAPAK + plan_damga (kuru kosunun plani; canli durum plandan farkliysa o ilana yazma yok).
# scripts/kapak78/yd_liste_uret.py (kilit oncesi: HAM, dosya / sha / QC / yedek kapilari) + scripts/kapak78/yd_kapak_yukle.py
# (yazim yolu eski78_gorsel_yukle.bir_ilan, YD profili: hedef 10, Style 513, eski 13 silinir, cdn=False).
# Drive girdileri Etsy kilidi ALINMADAN once indirilir (KILIT SURESI kurali; cdn_yedek kilit altinda YOK, adim 5 yedegi
# TEMP/YD_KAPAK_V1_YEDEK/<yedek_damga> liste kapisinda dogrulanir): 10'lu galeri TEMP/YD_KAPAK_V1/<kapak_damga> (<CIFT>_Y<NN>.jpg,
# ORTAK_Y04/Y05 + MANIFEST.csv), QC .../QC_<qc_damga>/QC_RAPOR.json, Canva alt metinleri (alt_id: ALT.csv cift, kart_no, alt),
# HAM TEMP/<envanter>/HAM/<ilan>.json. Serdar 27 Eki: kapak + galeri tek seferde, ilan basina 10 gorsel, eski 13 silinir.
# Durum dosyalari (scripts/ops/durum_dosyasi.py; okuma kilit SONRASI, yazma yalniz yazim / bag kosusunda):
#   TEMP/YD_KAPAK_V1_YUKLE/DEVAM.json, ILERLEME.json (json-ilanlar; set = hedef = 10), SONUC.csv (csv, anahtar ilan).
# Kosu ciktisi TEMP/YD_KAPAK_V1_YUKLE/KOSU/<run_id>/. bag_onar=true (onay YD_KAPAK_BAG + plan_damga): yalniz Style baglari.
# Kilit suresi: azami_dk (varsayilan 90) sonrasi yeni ilana baslanmaz.

permissions:
  actions: read
  contents: read

on:
  workflow_dispatch:
    inputs:
      kapak_damga: {description: "TEMP/YD_KAPAK_V1/<damga> (YYYYMMDD_HHMMSS)", required: true, default: ""}
      qc_damga: {description: "QC klasoru QC_<damga> (yd-kapak-qc kontrol, esikli)", required: true, default: ""}
      yedek_damga: {description: "TEMP/YD_KAPAK_V1_YEDEK/<damga> (yd-kapak-yedek)", required: true, default: ""}
      alt_id: {description: "Drive ALT.csv id (cift, kart_no, alt; Canva alt_text'leri)", required: true, default: ""}
      envanter: {description: "TEMP/<envanter>/HAM (yd-envanter-oku)", required: true, default: "YD_ENVANTER_20261026"}
      kuru: {description: "true = yazma yok (plan); false = yazim", required: true, default: "true"}
      confirm: {description: "yazim icin YD_KAPAK", required: false, default: ""}
      plan_damga: {description: "yazim: kuru kosunun plan_damga degeri (<kosu>_<sha12>)", required: false, default: ""}
      sadece: {description: "yalniz bu ilanlar (virgullu listing_id); bos = 78", required: false, default: ""}
      devam_kosu: {description: "runner kaybi: o kosunun ilan DEVAM kopyalari (bos = yok)", required: false, default: ""}
      kurtar: {description: "true: hata kaydi olan ilanda kayitli plan + canli galeriyle surdur", required: false, default: "false"}
      azami_dk: {description: "yazim: bu sureden sonra yeni ilana baslanmaz (dk)", required: false, default: "90"}
      bag_onar: {description: "true: yalniz Style baglari (DEVAM kaydi olan ilanlar; confirm YD_KAPAK_BAG)", required: false, default: "false"}

env:
  T: "gdrive:ASTROLOVE/TEMP"
  O: "gdrive:ASTROLOVE/TEMP/YD_KAPAK_V1_YUKLE"

jobs:
  is:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Girdi kapisi
        env:
          KD: ${{ inputs.kapak_damga }}
          QD: ${{ inputs.qc_damga }}
          YD: ${{ inputs.yedek_damga }}
          EN: ${{ inputs.envanter }}
          AL: ${{ inputs.alt_id }}
          KURU: ${{ inputs.kuru }}
          ONAY: ${{ inputs.confirm }}
          PD: ${{ inputs.plan_damga }}
          SA: ${{ inputs.sadece }}
          DK: ${{ inputs.devam_kosu }}
          KU: ${{ inputs.kurtar }}
          AZ: ${{ inputs.azami_dk }}
          BO: ${{ inputs.bag_onar }}
        run: |
          set -euo pipefail
          [[ "$BO" =~ ^(true|false)$ ]] || { echo "::error::girdi (bag_onar)"; exit 1; }
          [[ "$KD" =~ ^[0-9]{8}_[0-9]{6}$ && "$QD" =~ ^[0-9]{8}_[0-9]{6}$ && "$YD" =~ ^[0-9]{8}_[0-9]{6}$ && "$EN" =~ ^YD_ENVANTER_[0-9]{8}(_[0-9]{6})?$ ]] || { echo "::error::girdi (kapak / qc / yedek damga, envanter)"; exit 1; }
          [[ "$KURU" =~ ^(true|false)$ && "$KU" =~ ^(true|false)$ ]] || { echo "::error::girdi (kuru / kurtar)"; exit 1; }
          [[ "$AL" =~ ^[A-Za-z0-9_-]{20,80}$ ]] || { echo "::error::girdi (alt_id)"; exit 1; }
          [[ "$SA" =~ ^([0-9]+(,[0-9]+)*)?$ && "$DK" =~ ^([0-9]+)?$ && "$AZ" =~ ^[0-9]{1,3}$ ]] || { echo "::error::girdi (sadece / devam_kosu / azami_dk)"; exit 1; }
          if [ "$BO" = true ]; then
            [ "$KURU" = false ] && [ "$ONAY" = YD_KAPAK_BAG ] || { echo "::error::bag onarimi icin kuru=false + confirm YD_KAPAK_BAG"; exit 1; }
            [[ "$PD" =~ ^[0-9]+_[0-9a-f]{12}$ ]] || { echo "::error::bag onarimi icin plan_damga"; exit 1; }
          elif [ "$KURU" = false ]; then
            [ "$ONAY" = YD_KAPAK ] || { echo "::error::yazim icin confirm YD_KAPAK"; exit 1; }
            [[ "$PD" =~ ^[0-9]+_[0-9a-f]{12}$ ]] || { echo "::error::yazim icin plan_damga (<kosu>_<sha12>)"; exit 1; }
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2 numpy==2.1.3 pillow==11.0.0
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Girdiler (Drive, kilit oncesi) + liste kapilari
        env:
          KD: ${{ inputs.kapak_damga }}
          QD: ${{ inputs.qc_damga }}
          YD: ${{ inputs.yedek_damga }}
          EN: ${{ inputs.envanter }}
          AL: ${{ inputs.alt_id }}
          SA: ${{ inputs.sadece }}
          KURU: ${{ inputs.kuru }}
          PD: ${{ inputs.plan_damga }}
          BO: ${{ inputs.bag_onar }}
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out _in/kapak _in/HAM
          python3 - <<'PY'
          import csv, os
          sa = {x for x in os.environ["SA"].split(",") if x}
          R = [r for r in csv.DictReader(open("data/pod/yd78_ids.csv")) if not sa or r["listing_id"] in sa]
          if sa - {r["listing_id"] for r in R}:
              raise SystemExit(f"sadece: yd78 listesinde olmayan ilan {sorted(sa - {r['listing_id'] for r in R})}")
          open("_work/kapak.txt", "w").writelines(["MANIFEST.csv\n", "ORTAK_Y04.jpg\n", "ORTAK_Y05.jpg\n"]
                                                  + [f"{r['cift']}_Y{k:02d}.jpg\n" for r in R for k in (1, 2, 3, 6, 7, 8, 9, 10)])
          open("_work/ham.txt", "w").writelines(f"{r['listing_id']}.json\n" for r in R)
          print(f"kapsam: {len(R)} ilan")
          PY
          K="$T/YD_KAPAK_V1/$KD"
          rclone copy "$K" _in/kapak --files-from _work/kapak.txt --transfers 8 -q
          rclone copyto "$K/QC_$QD/QC_RAPOR.json" _work/QC_RAPOR.json
          rclone backend copyid gdrive: "$AL" _work/ALT.csv -q
          rclone copy "$T/$EN/HAM" _in/HAM --files-from _work/ham.txt --transfers 8 -q
          # adim 5 yedegi (cdn_yedek kilit altinda YOK): OZET + dosya listesi; eski kapak dahil 13 dosya liste kapisinda dogrulanir
          Y="$T/YD_KAPAK_V1_YEDEK/$YD"
          rclone copyto "$Y/OZET.md" _work/YEDEK_OZET.md
          rclone lsjson -R "$Y" --files-only --include "*.jpg" > _work/yedek_ls.json
          echo "indirilen: kapak $(ls _in/kapak/*.jpg | wc -l), HAM $(ls _in/HAM | wc -l), yedek dosya $(python3 -c 'import json;print(len(json.load(open("_work/yedek_ls.json"))))')"
          if [ "$KURU" = false ] && [ "$BO" = false ]; then
            rclone copyto "$O/KOSU/${PD%%_*}/PLAN_YD.json" _work/PLAN_YD.json || { echo "::error::PLAN_YD.json yok (KOSU/${PD%%_*})"; exit 1; }
          fi
          python3 scripts/kapak78/yd_liste_uret.py liste --ciftler data/pod/yd78_ids.csv --kaynak docs/yd_kapak/KAPAK_KAYNAK.csv \
            --ham-dir _in/HAM --kapak-dir _in/kapak --qc _work/QC_RAPOR.json --alt _work/ALT.csv --yedek-ozet _work/YEDEK_OZET.md \
            --yedek-liste _work/yedek_ls.json --out _hazir --sadece "$SA"
          cp _hazir/LISTE_OZET.md _hazir/LISTE_OZET.json _hazir/ESLEME.csv _out/
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - name: Durum dosyalari oku (kilit sonrasi)
        env:
          DK: ${{ inputs.devam_kosu }}
        run: |
          set -euo pipefail
          umask 077
          # durum kapisi (26 Eki, Serdar onayi): okuma hatasinda bos varsayilanla devam YOK
          python3 scripts/ops/durum_dosyasi.py oku --uzak "$O/DEVAM.json" --yerel _work/DEVAM.json --durum _work/DURUM_DEVAM \
            --tur json-ilanlar --ilk-kayit-izni
          python3 scripts/ops/durum_dosyasi.py oku --uzak "$O/ILERLEME.json" --yerel _work/ILERLEME.json --durum _work/DURUM_ILERLEME \
            --tur json-ilanlar --ilk-kayit-izni
          python3 scripts/ops/durum_dosyasi.py oku --uzak "$O/SONUC.csv" --yerel _work/SONUC.csv --durum _work/DURUM_SONUC \
            --tur csv --anahtar ilan --ilk-kayit-izni
          if [ -n "$DK" ]; then
            mkdir -p _work/devam_kosu
            rclone copy "$O/KOSU/$DK/devam" _work/devam_kosu --include "DEVAM_*.json" --max-depth 1 -q
            python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("_work/DEVAM.json"); d = json.loads(p.read_text())
          for f in sorted(pathlib.Path("_work/devam_kosu").glob("DEVAM_*.json")):
              lid = f.stem.split("_", 1)[1]; k = json.loads(f.read_text()); e = d["ilanlar"].get(lid) or {}
              if int(k.get("adim") or 0) >= int(e.get("adim") or 0):
                  d["ilanlar"][lid] = dict(k, cift=e.get("cift") or k.get("cift") or "-", durum=e.get("durum") or "DUR")
                  print(f"devam_kosu: {lid} adim {k.get('adim')} (onceki {e.get('adim')})")
          p.write_text(json.dumps(d, indent=1) + "\n")
          PY
          fi
      - name: Token
        run: |
          set -euo pipefail
          umask 077
          rclone copyto "$T/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
      - name: YD kapak
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          KURU: ${{ inputs.kuru }}
          PD: ${{ inputs.plan_damga }}
          KU: ${{ inputs.kurtar }}
          AZ: ${{ inputs.azami_dk }}
          BO: ${{ inputs.bag_onar }}
        run: |
          set +e -o pipefail
          args=(--hazir _hazir --out _out --devam _work/DEVAM.json --ilerleme _work/ILERLEME.json)
          if [ "$KURU" = true ]; then args+=(--kuru)
          elif [ "$BO" = true ]; then args+=(--bag-onar --confirm YD_KAPAK_BAG --plan-damga "$PD")
          else
            args+=(--confirm YD_KAPAK --plan _work/PLAN_YD.json --plan-damga "$PD" --sonuc _work/SONUC.csv --azami-dk "$AZ"
                   --devam-hedef-kok "$O/KOSU/${GITHUB_RUN_ID}/devam")
            [ "$KU" = true ] && args+=(--kurtar)
          fi
          python3 scripts/kapak78/yd_kapak_yukle.py "${args[@]}" 2>&1 | tee _work/kosu.log
          echo "KOD=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
      - name: Token + durum dosyalari + cikti Drive'a
        if: always()
        env:
          KURU: ${{ inputs.kuru }}
        run: |
          set -uo pipefail
          FAIL=""
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "$T/ETSY_TOKEN.json" && echo "Token geri yazildi" || echo "Token yenilenmedi"
          [ -f _work/kosu.log ] && python3 scripts/guvenlik/log_suz.py < _work/kosu.log > "_out/kosu_$(date -u +%Y%m%d_%H%M).txt"
          if grep -rqE '"(access_token|refresh_token)"[[:space:]]*:[[:space:]]*"[A-Za-z0-9._-]{20,}"|x-api-key[[:space:]]*:' _out/ 2>/dev/null; then
            echo "::error::Ciktida sir bulundu; Drive'a yazilmadi"; exit 1; fi
          if [ "$KURU" = false ] && [ -n "${KOD:-}" ]; then
            for x in "DEVAM.json json-ilanlar" "ILERLEME.json json-ilanlar" "SONUC.csv csv"; do
              set -- $x; ek=""; [ "$2" = csv ] && ek="--anahtar ilan"
              if [ -f "_work/DURUM_${1%%.*}/ONCE" ]; then
                python3 scripts/ops/durum_dosyasi.py yaz --uzak "$O/$1" --yerel "_work/$1" --durum "_work/DURUM_${1%%.*}" --tur "$2" $ek \
                  --ilk-kayit-izni || FAIL=1
              else
                echo "::error::$1 okunamadi; Drive'a yazilmadi"; FAIL=1
              fi
            done
          fi
          [ -d _out ] && rclone copy _out "$O/KOSU/${GITHUB_RUN_ID}" -q && echo "::notice title=YD KAPAK::Drive TEMP/YD_KAPAK_V1_YUKLE/KOSU/${GITHUB_RUN_ID}/"
          [ -f _out/RAPOR.md ] && head -60 _out/RAPOR.md >> "$GITHUB_STEP_SUMMARY" || true
          [ -z "$FAIL" ] || { echo "::error::durum dosyasi kapisi FAIL"; exit 1; }
          [ "${KOD:-1}" = 0 ] || { echo "::error::cikis ${KOD:-?}"; exit 1; }
      - if: always()
        run: rm -rf _work _in _hazir ~/.config/rclone

name: printful-kupa-mockup (gecici)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  calis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: rclone kur
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || { echo "rclone.org erisilemedi, apt"; sudo apt-get install -y -qq rclone >/dev/null; }
          rclone version | head -1
      - name: Printful token (Drive TEMP/PRINTFUL_TOKEN.json, maskeli)
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            export RCLONE_CONFIG_GDRIVE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET"; fi
          T=$(rclone cat "gdrive:ASTROLOVE/TEMP/PRINTFUL_TOKEN.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["api_token"].strip())')
          rm -rf ~/.config/rclone
          [ -n "$T" ] || { echo "HATA: PRINTFUL_TOKEN.json api_token bos"; exit 1; }
          echo "::add-mask::$T"
          echo "PRINTFUL_TOKEN=$T" >> "$GITHUB_ENV"
          echo "token okundu (maskeli)"
      - name: Kalibrasyon dosyasi -> kupa-printful-sonuc dali
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/s && cd /tmp/s
          git init -q -b kupa-printful-sonuc
          git config user.name "astrolove-bot"
          git config user.email "astrolove-bot@users.noreply.github.com"
          python "$GITHUB_WORKSPACE/scripts/kupa_printful/kalibrasyon.py" KALIBRASYON_2700x1050.png
          git add -A && git commit -qm "kupa kalibrasyon dosyasi"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" kupa-printful-sonuc
          sleep 15
      - name: Printful mockup
        run: |
          set -o pipefail
          cd /tmp/s && mkdir -p sonuc
          # log proxy'den okunamiyor: cikti (token sansurlu) dala da yazilir
          python "$GITHUB_WORKSPACE/scripts/kupa_printful/mockup.py" \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/kupa-printful-sonuc/KALIBRASYON_2700x1050.png" sonuc 2>&1 \
            | sed -u "s|${PRINTFUL_TOKEN}|***|g" | tee /tmp/s/MOCKUP_LOG.txt
      - name: Sonuclari dala yaz
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/s
          git add -A && git commit -qm "printful kupa mockup sonuclari" || true
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" kupa-printful-sonuc

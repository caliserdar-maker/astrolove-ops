name: wp-tagline

# WP TAGLINE CIFT BASKI (Serdar 3 Eki, Test 5). Etsy / musteri YOK; PLATES'e yazma YOK; cikti Drive TEMP/WP_TAGLINE/<run_id>/.
# Uretim = siparis yolu: main surucu.py wp_bakir_uret_v1, _v1 = renk_ref b8c8c4b + WP_REF adayi (29ece9f) kilitli dosyalari.
# teshis : Test 5 (SCORPIO_VIRGO, MAXWELL / QUINN) ve Test 4 / kesit (PISCES_SCORPIO, SCORPIO_VIRGO 11x14; JAKOB / ZOFIA)
#          teslim edilmis sayfalari yeni ikinci metin kapisindan; 1:1 kesit (teslim | yeni); yeni tam sayfa onizleme.
# dogrula: 78 cift x 5 boy siparis yolunda (Test 5 isimleri), kapilar (c_iz icinde ikinci metin) + e_kagit istisnasi.
# toplam : 390 hucre ozeti. Tetik: config/wp_tagline.trigger (bu dal).

permissions:
  contents: read

on:
  push:
    branches: [claude/wp-katman-baski-60sk0s]
    paths:
      - config/wp_tagline.trigger

concurrency: wp-tagline

env:
  RENK_REF: b8c8c4b17478fd956167577fa69913d06b9eb955
  WP_REF: 29ece9f5f3dc2bb46f2d3b4c52c074006e952755
  CIK: gdrive:ASTROLOVE/TEMP/WP_TAGLINE/${{ github.run_id }}
  KESIT: gdrive:ASTROLOVE/TEMP/WP_KESIT_A/37055961309

jobs:
  teshis:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {et: T5, cift: SCORPIO_VIRGO, boy: 11x14}
          - {et: T5, cift: SCORPIO_VIRGO, boy: 16x20}
          - {et: T5, cift: SCORPIO_VIRGO, boy: 18x24}
          - {et: T5, cift: SCORPIO_VIRGO, boy: 24x36}
          - {et: T5, cift: SCORPIO_VIRGO, boy: A2}
          - {et: T4, cift: PISCES_SCORPIO, boy: 11x14}
          - {et: T4, cift: PISCES_SCORPIO, boy: 16x20}
          - {et: T4, cift: PISCES_SCORPIO, boy: 18x24}
          - {et: T4, cift: PISCES_SCORPIO, boy: 24x36}
          - {et: T4, cift: PISCES_SCORPIO, boy: A2}
          - {et: KSV, cift: SCORPIO_VIRGO, boy: 11x14}
    env:
      ET: ${{ matrix.et }}
      CIFT: ${{ matrix.cift }}
      BOY: ${{ matrix.boy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: claude/wp-katman-baski-60sk0s
          path: _arac
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.WP_REF }}
          path: _wp
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RENK_REF }}
          path: _v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python bagimliliklari
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pillow opencv-python-headless numpy fonttools img2pdf pikepdf
      - name: WP kilidi + kilitli dosyalar v1 ustune (siparis-dijital ile ayni)
        run: |
          set -euo pipefail
          (cd _wp && python scripts/medya_v1/test_wp_kilit.py && python scripts/medya_v1/test_wp_ikinci_metin.py && python scripts/medya_v1/test_wp_istisna.py)
          for f in wp_bakir.py wp_katman.py wp_ornek.py wp_kilit.py wp_kilit.json wp_tani.py test_wp_kilit.py; do
            [ -e "_v1/scripts/medya_v1/$f" ] && { echo "HATA: $f v1'de zaten var" >&2; exit 1; }
            cp "_wp/scripts/medya_v1/$f" "_v1/scripts/medya_v1/$f"
          done
          (cd _v1 && python scripts/medya_v1/test_wp_kilit.py)
          git -C _wp rev-parse HEAD; git -C _v1 rev-parse HEAD; git rev-parse HEAD
      - name: Takas (buyuk boy bellek)
        if: ${{ matrix.boy == '24x36' || matrix.boy == 'A2' || matrix.boy == '18x24' }}
        run: |
          sudo fallocate -l 32G /mnt/takas7 && sudo chmod 600 /mnt/takas7 && sudo mkswap /mnt/takas7 >/dev/null && sudo swapon /mnt/takas7
          free -g
      - name: rclone kur
        run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONF_B64:-}" ]; then echo "HATA: RCLONE_CONF_B64 yok" >&2; exit 1; fi
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Teslim edilmis sayfalar (salt okur)
        run: |
          set -euo pipefail
          T0=$(date +%s); mkdir -p _t; T=()
          A=python; D=_arac/scripts/medya_v1/wp_dogrula.py
          if [ "$ET" = "T5" ]; then
            rclone backend copyid gdrive: 1mS2COdqaXUQKHfEHHa5wWj-SvLu2NX2B _t/t5.pdf
            $A $D pdf --pdf _t/t5.pdf --etiket T5 --cikti _t
            T+=("T5|$BOY|_t/T5_$BOY.jpg|")
          elif [ "$ET" = "T4" ]; then
            rclone backend copyid gdrive: 1ioxQLgijHJixzagpvrSQQbQmFXy1sc7A _t/t4.pdf
            $A $D pdf --pdf _t/t4.pdf --etiket T4 --cikti _t
            rclone copyto "gdrive:ASTROLOVE/TEMP/SIPARIS_ISIM/PLATES/VINTAGE_$BOY.png" "_t/VINTAGE_$BOY.png"
            T+=("T4|$BOY|_t/T4_$BOY.jpg|_t/VINTAGE_$BOY.png")
            rclone copyto "$KESIT/PISCES_SCORPIO_$BOY/WP_PISCES_SCORPIO_${BOY}_BASKI.jpg" "_t/K_$BOY.jpg"
            T+=("KESIT|$BOY|_t/K_$BOY.jpg|")
          else
            rclone copyto "$KESIT/SCORPIO_VIRGO_11x14/WP_SCORPIO_VIRGO_11x14_BASKI.jpg" "_t/K_11x14.jpg"
            T+=("KESIT|$BOY|_t/K_11x14.jpg|")
          fi
          ls -la _t
          printf '%s\n' "${T[@]}" > _t/teslim.txt
          echo "SURE indir $(( $(date +%s) - T0 )) sn"
      - name: Uretim (siparis yolu) + teslim kapisi + kesit + onizleme
        run: |
          set -euo pipefail
          if [ "$ET" = "T5" ]; then I1=MAXWELL; I2=QUINN; M='Written in the Stars, Always Yours'
          else I1=JAKOB; I2=ZOFIA; M='Perfectly Paired by Zodiac Kisses'; fi
          mapfile -t T < _t/teslim.txt
          python _arac/scripts/medya_v1/wp_dogrula.py calis --surucu scripts/siparis_dijital/surucu.py --kod _v1 \
            --hucreler "$CIFT:$BOY" --isim1 "$I1" --isim2 "$I2" --mesaj "$M" --onizleme --teslim "${T[@]}" \
            --etiket "teshis_${ET}_$BOY" --cikti out
      - name: Drive (TEMP)
        if: ${{ always() }}
        run: '[ -d out ] && rclone copy out "$CIK/teshis/${ET}_$BOY/" --exclude "ara/**" && echo "drive: TEMP/WP_TAGLINE/${{ github.run_id }}/teshis/${ET}_$BOY/"'
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: teshis_${{ matrix.et }}_${{ matrix.boy }}
          path: out/*.json
          retention-days: 3
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone _t

  dogrula:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - {boy: 11x14, parca: '0/4', no: 0}
          - {boy: 11x14, parca: '1/4', no: 1}
          - {boy: 11x14, parca: '2/4', no: 2}
          - {boy: 11x14, parca: '3/4', no: 3}
          - {boy: 16x20, parca: '0/5', no: 0}
          - {boy: 16x20, parca: '1/5', no: 1}
          - {boy: 16x20, parca: '2/5', no: 2}
          - {boy: 16x20, parca: '3/5', no: 3}
          - {boy: 16x20, parca: '4/5', no: 4}
          - {boy: 18x24, parca: '0/6', no: 0}
          - {boy: 18x24, parca: '1/6', no: 1}
          - {boy: 18x24, parca: '2/6', no: 2}
          - {boy: 18x24, parca: '3/6', no: 3}
          - {boy: 18x24, parca: '4/6', no: 4}
          - {boy: 18x24, parca: '5/6', no: 5}
          - {boy: 24x36, parca: '0/9', no: 0}
          - {boy: 24x36, parca: '1/9', no: 1}
          - {boy: 24x36, parca: '2/9', no: 2}
          - {boy: 24x36, parca: '3/9', no: 3}
          - {boy: 24x36, parca: '4/9', no: 4}
          - {boy: 24x36, parca: '5/9', no: 5}
          - {boy: 24x36, parca: '6/9', no: 6}
          - {boy: 24x36, parca: '7/9', no: 7}
          - {boy: 24x36, parca: '8/9', no: 8}
          - {boy: A2, parca: '0/5', no: 0}
          - {boy: A2, parca: '1/5', no: 1}
          - {boy: A2, parca: '2/5', no: 2}
          - {boy: A2, parca: '3/5', no: 3}
          - {boy: A2, parca: '4/5', no: 4}
    env:
      BOY: ${{ matrix.boy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: claude/wp-katman-baski-60sk0s
          path: _arac
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.WP_REF }}
          path: _wp
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RENK_REF }}
          path: _v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python bagimliliklari
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pillow opencv-python-headless numpy fonttools img2pdf pikepdf
      - name: WP kilidi + kilitli dosyalar v1 ustune (siparis-dijital ile ayni)
        run: |
          set -euo pipefail
          (cd _wp && python scripts/medya_v1/test_wp_kilit.py && python scripts/medya_v1/test_wp_ikinci_metin.py && python scripts/medya_v1/test_wp_istisna.py)
          for f in wp_bakir.py wp_katman.py wp_ornek.py wp_kilit.py wp_kilit.json wp_tani.py test_wp_kilit.py; do
            [ -e "_v1/scripts/medya_v1/$f" ] && { echo "HATA: $f v1'de zaten var" >&2; exit 1; }
            cp "_wp/scripts/medya_v1/$f" "_v1/scripts/medya_v1/$f"
          done
          (cd _v1 && python scripts/medya_v1/test_wp_kilit.py)
          git -C _wp rev-parse HEAD; git -C _v1 rev-parse HEAD; git rev-parse HEAD
      - name: Takas (buyuk boy bellek)
        if: ${{ matrix.boy == '24x36' || matrix.boy == 'A2' || matrix.boy == '18x24' }}
        run: |
          sudo fallocate -l 32G /mnt/takas7 && sudo chmod 600 /mnt/takas7 && sudo mkswap /mnt/takas7 >/dev/null && sudo swapon /mnt/takas7
          free -g
      - name: rclone kur
        run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONF_B64:-}" ]; then echo "HATA: RCLONE_CONF_B64 yok" >&2; exit 1; fi
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: 390 hucre parcasi (siparis yolu, Test 5 isimleri)
        run: |
          python _arac/scripts/medya_v1/wp_dogrula.py calis --surucu scripts/siparis_dijital/surucu.py --kod _v1 \
            --boy "$BOY" --parca "${{ matrix.parca }}" --etiket "dogrula_${BOY}_${{ matrix.no }}" --cikti out
      - name: Drive (TEMP)
        if: ${{ always() }}
        run: '[ -d out ] && rclone copy out "$CIK/dogrula/" --exclude "ara/**"'
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: dogrula_${{ matrix.boy }}_${{ matrix.no }}
          path: out/*.json
          retention-days: 3
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone

  toplam:
    needs: [teshis, dogrula]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow numpy
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Teshis ozeti (teslim edilen sayfalar)
        run: |
          python - <<'PY'
          import json, glob
          for p in sorted(glob.glob('art/teshis_*/DOGRULA_*.json')):
              for h in json.load(open(p))['hucreler']:
                  t = {a: {k: v.get(k) for k in ('var', 'gecti', 'en_buyuk', 'esik_alan', 'kutu', 'kesit', 'hata')}
                       for a, v in (h.get('teslim') or {}).items()}
                  print('TESHIS', h['cift'], h['boy'], 'yeni', h['kapilar_gecti'], json.dumps(h.get('ikinci_metin')),
                        'teslim', json.dumps(t), 'onizleme', h.get('onizleme'), 'sure', h['sure_sn'])
          PY
      - name: 390 hucre
        run: python scripts/medya_v1/wp_dogrula.py toplam --cikti art --etiket dogrula --beklenen 390
      - name: rclone kur
        if: ${{ always() }}
        run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: Drive (TEMP)
        if: ${{ always() }}
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && export RCLONE_CONFIG_GDRIVE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET"
          fi
          ls art/TOPLAM_* >/dev/null 2>&1 && rclone copy art "$CIK/" --include "TOPLAM_*" && echo "drive: TEMP/WP_TAGLINE/${{ github.run_id }}/"
          rm -rf ~/.config/rclone

name: ornament-poster-burc
# Serdar 8 Kas: sembol kartinda burclar yeni dokuda olsun; kaynak POSTER78_CHATGPT_7200x10800_20261008 (hazir, yeniden uretim yok).
# Bu is: posterden kucuk burclari kodla keser (scripts/ornament_galeri/v9/poster_burc.py), Drive TEMP/ORNAMENT_POSTER_BURC/ (onizleme + RGBA PNG).
# Etsy / Printful YOK. Tetik: docs/ornament/POSTER_BURC_TETIK.txt (dal ornament-printful-katalog).
on:
  push:
    branches: [ornament-printful-katalog]
    paths: [docs/ornament/POSTER_BURC_TETIK.txt]
permissions: {}
concurrency:
  group: ornament-poster-burc
  cancel-in-progress: false
jobs:
  kes:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/ornament_galeri/v9/
            docs/ornament/POSTER_BURC.json
          path: s
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Paketler + rclone
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          pip install -q pillow==12.3.0 numpy==2.5.3 opencv-python-headless==5.0.0.93
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || sudo apt-get install -y -qq rclone >/dev/null
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Posterler + kesim
        run: |
          set -euo pipefail
          mkdir -p /tmp/p /tmp/o
          python3 -c "import json; print('\n'.join(f'{c}_7200x10800.jpg' for c in json.load(open('s/docs/ornament/POSTER_BURC.json'))['posterler']))" > /tmp/l.txt
          rclone copy "gdrive:ASTROLOVE/POSTER78_CHATGPT_7200x10800_20261008" /tmp/p --files-from /tmp/l.txt --no-traverse -q
          ls -la /tmp/p
          python3 s/scripts/ornament_galeri/v9/poster_burc.py s/docs/ornament/POSTER_BURC.json /tmp/p /tmp/o
          rclone copy /tmp/o "gdrive:ASTROLOVE/TEMP/ORNAMENT_POSTER_BURC/$(date -u +%Y%m%d_%H%M)_${GITHUB_RUN_ID}" -q
          echo "::notice::Drive TEMP/ORNAMENT_POSTER_BURC/$(date -u +%Y%m%d_%H%M)_${GITHUB_RUN_ID}"

name: wp-description-78-apply-once

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths: [config/wp_description_78_apply_authorization.json]

concurrency:
  group: etsy-token
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Tek seferlik yetkiyi dogrula
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p = json.load(open("config/wp_description_78_apply_authorization.json"))
          assert p == {
              "authorized_at": "2026-09-16",
              "task": "wallpaper_description_78",
              "scope": "78 Digital wallpaper listings; English description only",
              "change": "Replace em/en dashes with ASCII hyphen using the verified Batch 4 approval CSV",
              "confirm": "CANLI",
              "approval_text": "78 wallpaper açıklamasını tek seferlik otomatik tetiklemeyle Etsy’de uygula",
              "nonce": "wp-desc-78-20260916-0615",
          }
          PY
      - run: |
          set -euo pipefail
          pip install -q -r requirements.txt
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf ve girdiler
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone _work _out; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
          fi
          rclone copyto gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json _work/ETSY_TOKEN.json
          rclone copyto gdrive:ASTROLOVE/TEMP/BATCH_4/20260915_2054/wallpaper_title_description_approval.csv _work/approval.csv
          test -s _work/ETSY_TOKEN.json && test -s _work/approval.csv
      - name: 78 wallpaper aciklamasini uygula
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          set -euo pipefail
          python scripts/etsy/wp_description_78_apply.py --plan _work/approval.csv --out _out \
            --apply --confirm CANLI --quota-min 250
      - name: Token ve kaniti Drive'a yaz
        if: ${{ always() }}
        run: |
          set -euo pipefail
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json || true
          if grep -rqE '"(access_token|refresh_token)"[[:space:]]*:[[:space:]]*"[A-Za-z0-9._-]{20,}"' _out 2>/dev/null; then
            echo "::error::Ciktida token bulundu; Drive yazimi durduruldu"; exit 1
          fi
          stamp=$(date -u +%Y%m%d_%H%M)
          target="gdrive:ASTROLOVE/TEMP/WP_DESCRIPTION_78_APPLY/$stamp"
          rclone copy _out "$target" -q
          echo "Drive: ASTROLOVE/TEMP/WP_DESCRIPTION_78_APPLY/$stamp/"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: wp-description-78-apply
          path: _out/
          if-no-files-found: error
          retention-days: 30
      - if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

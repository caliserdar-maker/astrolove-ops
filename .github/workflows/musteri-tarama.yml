name: musteri-tarama
# Acik depoda MUSTERI BILGISI taramasi (14 Eki 2026, Takip gorevi). SALT OKUR: hicbir kosu/artifact/dal silinmez, degistirilmez.
# Tarayici scripts/guvenlik/musteri_tara.py DEGER YAZMAZ: acik loga yalniz tur + sayi + workflow adi; ayrinti (kosu no, artifact no,
# maskeli yol, commit) yalniz Drive TEMP/MUSTERI_TARAMA_<tarih>/ altina. Etsy API YOK.
# GitHub istekleri yalniz GET; OPS_ADMIN_TOKEN hiz siniri icin (GITHUB_TOKEN 1000/saat yetmez).
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        kaynak: [loglar, artifactlar, git]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: "${{ matrix.kaynak == 'git' && '0' || '1' }}" }
      - name: rclone
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Tum uzak dallar (yalniz git)
        if: ${{ matrix.kaynak == 'git' }}
        run: |
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
          echo "dal $(git branch -r | wc -l) | nesne $(git count-objects -vH | grep size-pack)"
      - name: Tarama (deger yazilmaz)
        env:
          GH_TOKEN: ${{ secrets.OPS_ADMIN_TOKEN }}
          KAYNAK: ${{ matrix.kaynak }}
        run: |
          set -euo pipefail
          python3 scripts/guvenlik/musteri_tara.py --out _out --kaynak "$KAYNAK"
      - name: Drive'a (ayrinti yalniz Drive'da)
        if: ${{ always() }}
        env:
          KAYNAK: ${{ matrix.kaynak }}
        run: |
          set -euo pipefail
          [ -d _out ] || exit 0
          mv _out/OZET.md "_out/OZET_${KAYNAK}.md" 2>/dev/null || true
          rclone copy _out "gdrive:ASTROLOVE/TEMP/MUSTERI_TARAMA_20261014" -q
          echo "Drive: ASTROLOVE/TEMP/MUSTERI_TARAMA_20261014/ ($(ls _out | tr '\n' ' '))"
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone _out

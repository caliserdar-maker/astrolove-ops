name: poster-video-v5
# v5 ORNEKLERI (19 Eki 2026, Serdar). Etsy API KULLANILMAZ; Etsy'ye ve Metricool'a YAZMA YOK. Toplu uretim yok.
# A) sosyal/poster_video/poster_video_v5.py (v4 ana dosya + toz 26000, tane sigma 0.45, murekkep yalniz toz birikince).
# B) kupa: kupa-orchard cift.py (Cancer Libra Emily James) yeniden uretilir (= canli 4598525642 videosu, v4 kaniti); ayni
#    video6b.py yalniz parcacik sigma 0.9 -> 0.45 ile tekrar kosulur; toz kapali kopya yalniz QC (toz disi fark).
# sosyal/poster_video/v5_qc.py: kontaklar, %200 yakin kirpimlar, QC. Cikti: Drive ASTROLOVE/TEMP/POSTER_VIDEO_ORNEK_20261019/V5/.
permissions:
  contents: write   # yalniz poster-video-onizleme dalina kucuk onizleme
on:
  workflow_dispatch:
    inputs:
      kapak:
        description: 'KAPAK/ altindaki kapak dosyasi'
        default: 4570143815_CANCER_LIBRA.jpg
jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      O: gdrive:ASTROLOVE/TEMP/POSTER_VIDEO_ORNEK_20261019/V5
      K: gdrive:ASTROLOVE/TEMP/KAPAK_P2_78_20261019/KAPAK
      KAPAK: ${{ inputs.kapak }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Kurulum
      run: |
        set -euo pipefail
        pip install -q numpy==2.1.3 pillow==11.0.0 scipy==1.14.1 opencv-python-headless==4.10.0.84
        sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg fonts-dejavu-core >/dev/null
        curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
    - name: rclone.conf
      env:
        RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      run: |
        set -euo pipefail
        mkdir -p ~/.config/rclone; umask 077
        printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
        if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "::add-mask::$GOOGLE_CLIENT_SECRET"
          grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true; fi
    - name: Uret + QC
      run: |
        set +e -uo pipefail   # QC FAIL olsa da ciktilar Drive'a gitsin
        case "$KAPAK" in *[!A-Za-z0-9_.]*|'') echo "::error::kapak adi gecersiz"; exit 1 ;; esac
        mkdir -p _w/k _o
        git fetch -q origin kupa-orchard && git archive origin/kupa-orchard kupa_orchard | tar -x -C _w/k
        bash _w/k/kupa_orchard/kod/sembol_al.sh CANCER_LIBRA _w/sem
        T0=$(date +%s)
        (cd _w/k/kupa_orchard && python3 -I kod/cift.py Cancer Libra Emily James "My favorite place is with you" ../../sem ../../kupa) > _w/cift.log 2>&1; CR=$?
        tail -2 _w/cift.log; echo "::warning::KUPA YENIDEN URETIM rc=$CR $(( $(date +%s) - T0 )) sn"
        VD=_w/kupa/video; V6=_w/k/kupa_orchard/kod/video6b.py; KK=_w/kupa/galeri/01_Orange_Blossom_kapak.jpg
        [ "$(grep -c '(0, 0), 0.9)' $V6)" = 2 ] || { echo "::error::video6b sigma satirlari beklenen gibi degil"; exit 1; }
        sed 's/GaussianBlur(al, (0, 0), 0.9)/GaussianBlur(al, (0, 0), 0.45)/; s/GaussianBlur(kat, (0, 0), 0.9)/GaussianBlur(kat, (0, 0), 0.45)/' $V6 > _w/video6b_ince.py
        sed 's/a3 = np.clip(al, 0, 0.9)\[..., None\]/a3 = np.clip(al, 0, 0.9)[..., None] * 0/' $V6 > _w/video6b_tozsuz.py
        diff $V6 _w/video6b_ince.py | sed 's/^/::warning::KUPA FARK /'
        python3 -I _w/video6b_ince.py "$VD/" $KK _o/KUPA_CANCER_LIBRA_ince_toz.mp4 | tail -1
        python3 -I _w/video6b_tozsuz.py "$VD/" $KK _w/kupa_tozsuz.mp4 | tail -1
        rclone copyto "$K/$KAPAK" _w/kapak.jpg -q || { echo "::error::kapak yok"; exit 1; }
        V5=_o/CANCER_LIBRA_ilan_video_v5.mp4
        python3 -I sosyal/poster_video/poster_video_v5.py _w/kapak.jpg "$V5" murekkep | grep -v '  kare'
        python3 -I sosyal/poster_video/v5_qc.py poster "$V5" _w/kapak.jpg _o | tail -1 | tee _w/qp.txt; QP=${PIPESTATUS[0]}
        python3 -I sosyal/poster_video/v5_qc.py kupa $VD/ORCHARD_Cancer_Libra_video_6sn.mp4 _o/KUPA_CANCER_LIBRA_ince_toz.mp4 _w/kupa_tozsuz.mp4 \
          $VD/k_mask_nosym.png $VD/k_beyaz.png _o | tail -1 | tee _w/qk.txt; QK=${PIPESTATUS[0]}
        python3 -c "import json;json.dump({'poster_v5': json.load(open('_o/QC_poster.json')), 'kupa_ince_toz': json.load(open('_o/QC_kupa.json'))}, open('_o/QC.json','w'), indent=1)"
        rm -f _o/QC_poster.json _o/QC_kupa.json _o/*.sembol_maske.png _o/*.ic.json
        python3 -c "
        import json; d = json.load(open('_o/QC.json')); p, k = d['poster_v5'], d['kupa_ince_toz']
        print('::warning::POSTER', p['sonuc'], p['kapi'], 'ilk', p['ilk_kare_fark'], 'son', p['son_kare_fark'], 'taban', p['taban_420'], 'tam', p['sembol_tam_kare'])
        print('::warning::POSTER TABLO', {t: (v['murekkep'], v['toz_birikimi']) for t, v in p['tablo_0_5sn'].items()})
        print('::warning::KUPA', k['sonuc'], k['kapi'], k['toz_disi_fark'], k['toz_ici_fark_ortalama_en_buyuk'], k['toz_piksel_3sn'])"
        rclone copy _o "$O" -q
        echo "::warning::DRIVE $(rclone lsf "$O" | tr '\n' ' ')"
        mkdir -p _pv; cp _o/*.jpg _o/QC.json _pv/ 2>/dev/null
        echo "RC=$(( QP + QK + CR ))" >> "$GITHUB_ENV"
    - name: Onizleme dali
      if: ${{ always() }}
      run: |
        set +e -uo pipefail
        [ -n "$(ls -A _pv 2>/dev/null)" ] || exit 0
        B=poster-video-onizleme; PV=ornek_v5
        git config user.name "github-actions"; git config user.email "actions@github.com"
        for i in 1 2 3; do
          rm -rf _pvw; git worktree prune
          git fetch -q origin $B 2>/dev/null && git worktree add -q _pvw origin/$B 2>/dev/null || { git worktree add -q --detach _pvw; (cd _pvw && git checkout -q --orphan tmp && git rm -rqf . ); }
          rm -rf "_pvw/$PV"; mkdir -p "_pvw/$PV"; cp _pv/* "_pvw/$PV/"
          (cd _pvw && git add -A && git commit -qm "poster video v5 onizleme (kosu ${{ github.run_id }})" && git push -q origin HEAD:refs/heads/$B) && { echo "::warning::ONIZLEME $B/$PV"; break; }
          sleep 5
        done
    - name: Sonuc
      if: ${{ always() }}
      run: |
        rm -rf _w ~/.config/rclone
        [ "${RC:-1}" = "0" ]

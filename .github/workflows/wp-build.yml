name: wp-build

# Wallpaper uretimi (16 dosya / cift) OPTIMIZED 3X4 posterlerden.
# step=templates: pilot (Cancer_Libra) FINAL_V2 + N cift posterinden edisyon
#   zemini, sablonlar ve kural (b) alanlarini uretir -> WALLPAPER/FINAL_V2/_TEMPLATES
# step=build: bir ciftin 16 wallpaper'i + kontak sayfasi -> WALLPAPER/FINAL_V2/_CANDIDATE/<CIFT>
#   (pilot cift verilirse FINAL_V2 ile piksel kiyas raporu). Etsy'ye dokunmaz.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "templates | build"
        type: choice
        options: [templates, build]
        default: build
      pair:
        description: "build: cift (Aries_Leo)"
        required: false
        default: "Aries_Leo"
      mode:
        description: "build: rule = kural (b) sentez; template = pilot zemin sablonu"
        type: choice
        options: [rule, template]
        default: rule
      bg_pairs:
        description: "templates: zemin icin cift listesi (virgullu)"
        required: false
        default: "Cancer_Libra,Aries_Leo,Taurus_Virgo,Gemini_Scorpio,Leo_Sagittarius,Aquarius_Pisces"
      out_dir:
        description: "build: cikti klasoru (Drive); bos = WALLPAPER/FINAL_V2/_CANDIDATE/<CIFT>"
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bagimliliklar
        run: |
          set -euo pipefail
          pip install -q -r requirements.txt

      - name: rclone kur
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null

      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone
          umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
          fi

      - name: Posterleri al
        run: |
          set -euo pipefail
          mkdir -p _work/posters _work/pilot _work/tpl
          if [ "${{ inputs.step }}" = "templates" ]; then pairs="${{ inputs.bg_pairs }}"; else pairs="${{ inputs.pair }}"; fi
          for pr in ${pairs//,/ }; do
            up="$(echo "$pr" | tr '[:lower:]' '[:upper:]')"
            for ed in CHAMPAGNE_IVORY MIDNIGHT_BLUE WARM_PARCHMENT DEEP_BLACK; do
              rclone copy "gdrive:ASTROLOVE/WALL_ART/POSTERS/OPTIMIZED_FOR_PRODUCTION/$ed/3X4" _work/posters \
                --include "WA_POSTER_${up}_${ed}_3X4.jpg"
            done
          done
          rclone copy "gdrive:ASTROLOVE/WALLPAPER/FINAL_V2/CANCER_LIBRA" _work/pilot --include "AstroLove_*.jpg"
          ls _work/posters | wc -l; ls _work/pilot | wc -l

      - name: Sablonlari uret
        if: ${{ inputs.step == 'templates' }}
        run: |
          set -euo pipefail
          python scripts/etsy/wp_build.py templates --pilot-dir _work/pilot --posters _work/posters \
            --bg-pairs "${{ inputs.bg_pairs }}" --out _out/tpl
          rclone sync _out/tpl "gdrive:ASTROLOVE/WALLPAPER/FINAL_V2/_TEMPLATES"
          rclone lsl "gdrive:ASTROLOVE/WALLPAPER/FINAL_V2/_TEMPLATES" | head -60
          { echo "## wp-build sablonlar"; echo; echo '```'; cat _out/tpl/templates.json | head -120; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Uret + kiyas
        if: ${{ inputs.step == 'build' }}
        run: |
          set -euo pipefail
          pair="${{ inputs.pair }}"; up="$(echo "$pair" | tr '[:lower:]' '[:upper:]')"
          out_dir="${{ inputs.out_dir }}"; [ -n "$out_dir" ] || out_dir="WALLPAPER/FINAL_V2/_CANDIDATE/$up"
          echo "OUT_DIR=$out_dir" >> "$GITHUB_ENV"
          rclone copy "gdrive:ASTROLOVE/WALLPAPER/FINAL_V2/_TEMPLATES" _work/tpl
          cmp=""; [ "$up" = "CANCER_LIBRA" ] && cmp="--compare _work/pilot"
          python scripts/etsy/wp_build.py build --mode "${{ inputs.mode }}" --pair "$pair" --posters _work/posters \
            --templates _work/tpl --out _out/build $cmp
          rclone copy _out/build "gdrive:ASTROLOVE/$out_dir"
          rclone lsl "gdrive:ASTROLOVE/$out_dir"
          { echo "## wp-build: $pair (${{ inputs.mode }}) -> $out_dir"; echo; cat _out/build/report.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: wp-build-${{ inputs.step }}-${{ inputs.pair }}
          path: |
            _out/build/CONTACT_*.jpg
            _out/build/report.md
            _out/build/report.json
            _out/tpl/templates.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Temizlik
        if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

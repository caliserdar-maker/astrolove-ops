name: siparis-revizyon-ara
# Serdar 21 Eki madde 3 (ikinci onay: tek kosu; 403 ise neden yazilir, DUR): SIPARIS_ISIM/DIJITAL/9000000000 dosyalarinin Drive revizyonlari (duzeltme oncesi sayfalar) SALT OKUNUR
# listelenir; bas (guncel) revizyon disindaki her revizyon Drive TEMP/SIPARIS_HAT_TANI_20261021/ESKI_REVIZYON/ altina kopyalanir.
# Musteri dosyasina dokunulmaz (revizyon / keepForever / silme yok). Log'a yalniz sayi, zaman, boyut, md5 yazilir; isim / mesaj yok.
# Artifact yok. Gecici is akisi: P8 ile kaldirilir.
permissions:
  contents: read
on:
  workflow_dispatch: {}
jobs:
  ara:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      K: "gdrive,root_folder_id=1o-sK34SNVvZwULnoHwJ7J15KhedzMReS:"
      O: "gdrive,root_folder_id=1aUqcYzHzFR_MWor1r1yfZQ9-hZii81Pi:ESKI_REVIZYON"
    steps:
      - name: rclone
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/rc.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q -j /tmp/rc.zip '*/rclone' -d /tmp/rcb && sudo install -m 755 /tmp/rcb/rclone /usr/local/bin/rclone
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true; fi
      - name: Revizyon listesi + eski revizyonlarin kopyasi
        run: |
          set -euo pipefail
          rclone lsjson -R --files-only "$K" > /tmp/dosya.json            # ayni zamanda token tazeler
          T=$(rclone config dump | jq -r '.gdrive.token' | jq -r '.access_token'); echo "::add-mask::$T"
          [ -n "$T" ] && [ "$T" != null ] || { echo "HATA: token yok" >&2; exit 1; }
          mkdir -p _r
          # api <tur> <url> <cikti>: 2xx degilse hangi cagri / http kodu / Google hata nedeni yazilir ve DUR (icerik yazilmaz)
          api() { c=$(curl -sS -o "$3" -w '%{http_code}' -H "Authorization: Bearer $T" "$2"); case "$c" in 2??) return 0;; esac
            echo "HATA cagri=$1 dosya#=$no http=$c $(jq -c '{status: .error.status, reason: .error.errors[0].reason, domain: .error.errors[0].domain, msg: .error.message}' "$3" 2>/dev/null || head -c 300 "$3")"
            exit 1; }
          jq -c '.[] | select(.Path | startswith("DAL_YEDEK_20261021/") | not) | {p: .Path, id: .ID, m: .MimeType}' /tmp/dosya.json > /tmp/liste.jsonl
          echo "mime: $(jq -r .m /tmp/liste.jsonl | sort | uniq -c | tr -s ' ' | tr '\n' ';')"
          echo "dosya: $(wc -l < /tmp/liste.jsonl)"
          echo '[' > _r/REVIZYON_LISTE.json; ilk=1; ns=0; nk=0; no=0
          while read -r s; do
            no=$((no + 1))
            p=$(jq -r .p <<<"$s"); id=$(jq -r .id <<<"$s")
            api revisions.list "https://www.googleapis.com/drive/v3/files/$id/revisions?pageSize=200&fields=revisions(id,modifiedTime,size,md5Checksum,keepForever)" /tmp/r.json
            R=$(cat /tmp/r.json)
            n=$(jq '.revisions | length' <<<"$R"); ns=$((ns + n))
            [ $ilk = 1 ] || echo ',' >> _r/REVIZYON_LISTE.json; ilk=0
            jq -c --arg p "$p" --arg id "$id" '{yol: $p, id: $id, revizyonlar: .revisions}' <<<"$R" >> _r/REVIZYON_LISTE.json
            if [ "$n" -gt 1 ]; then
              # son (bas) revizyon guncel dosya; digerleri indirilir
              while read -r v; do
                rid=$(jq -r .id <<<"$v"); t=$(jq -r .modifiedTime <<<"$v" | tr -d ':-' | cut -c1-15)
                h="_r/DOSYA/$(dirname "$p")/${t}__$(basename "$p")"; mkdir -p "$(dirname "$h")"
                api revisions.get_media "https://www.googleapis.com/drive/v3/files/$id/revisions/$rid?alt=media" "$h"
                m=$(md5sum "$h" | cut -c1-32); [ "$m" = "$(jq -r .md5Checksum <<<"$v")" ] || { echo "HATA: md5 farki" >&2; exit 1; }
                echo "  rev $t $(stat -c %s "$h") bayt md5 ${m:0:8} OK"
              done < <(jq -c '.revisions[:-1][]' <<<"$R")
            fi
            echo "dosya#$no $(jq -r .m <<<"$s") revizyon $n"
          done < /tmp/liste.jsonl
          echo ']' >> _r/REVIZYON_LISTE.json
          jq -e . _r/REVIZYON_LISTE.json >/dev/null
          nk=$(find _r/DOSYA -type f 2>/dev/null | wc -l)
          echo "TOPLAM: dosya $(wc -l < /tmp/liste.jsonl), revizyon $ns, indirilen eski revizyon $nk"
          jq -r '[.[] | .revizyonlar[] | .modifiedTime] | sort | "en eski \(.[0]) en yeni \(.[-1])"' _r/REVIZYON_LISTE.json
      - name: Drive TEMP'e kopya + dogrulama
        run: |
          set -euo pipefail
          rclone copy _r "$O" --transfers 8 -q
          rclone check _r "$O" --one-way -q
          echo "check one-way PASS: $(find _r -type f | wc -l) dosya"
      - if: always()
        run: rm -rf ~/.config/rclone _r /tmp/dosya.json /tmp/liste.jsonl

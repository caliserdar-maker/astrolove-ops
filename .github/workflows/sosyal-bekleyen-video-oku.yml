name: sosyal-bekleyen-video-oku

# SALT OKUMA (Serdar 15 Eki 2026): Metricool'daki BEKLEYEN video gonderilerinin KURU listesi (yalniz GET /v2/scheduler/posts).
# Metricool'a YAZMA / SILME / DEGISTIRME YOK. scripts/sosyal/bekleyen_video_oku.py -> Drive TEMP/SOSYAL_BEKLEYEN_<tarih>/
# (BEKLEYEN_VIDEO.csv / .json, BEKLEYEN_ORNEK_GONDERI.json: platform basina 1 gonderinin tam yapisi, URL'ler sorgusuz).

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      bit:
        default: "2026-12-31T23:59:59"

jobs:
  oku:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Paketler
        run: |
          pip install -q numpy==2.1.3 pillow==11.0.0
          echo "O=gdrive:ASTROLOVE/TEMP/SOSYAL_BEKLEYEN_$(TZ=Europe/Istanbul date +%Y%m%d)" >> "$GITHUB_ENV"
      - name: rclone + token
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          mkdir -p ~/.config/rclone _work _out; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            export RCLONE_CONFIG_GDRIVE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET"
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
          rclone copyto "gdrive:ASTROLOVE/TEMP/METRICOOL_TOKEN.json" _work/mc.json
          python3 -c "import json;print('::add-mask::'+json.load(open('_work/mc.json'))['userToken'])"

      - name: Bekleyen video gonderileri (yalniz GET)
        env:
          BIT: ${{ inputs.bit }}
        run: |
          set -uo pipefail
          python3 scripts/sosyal/bekleyen_video_oku.py --token _work/mc.json --cikti _out --bit "$BIT" 2>&1 \
            | python3 scripts/guvenlik/sir_koru.py tee --sir-json _work/mc.json "$GITHUB_STEP_SUMMARY" _out/OZET.txt
          rc=${PIPESTATUS[0]}
          python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/mc.json _out || exit 1   # sir varsa Drive'a yuklenmez
          rclone copy _out "$O" -q
          rclone lsl "$O" | python3 scripts/guvenlik/sir_koru.py tee --sir-json _work/mc.json "$GITHUB_STEP_SUMMARY"
          exit $rc

      - if: always()
        run: |
          rm -rf _work ~/.config/rclone
          if [ -f "$RUNNER_TEMP/SIR_ENGEL" ]; then echo "::error::sir iceren satir engellendi (sir_koru)"; exit 1; fi

name: dijital-arastirma
# DIJITAL URUN ARASTIRMASI (Serdar onayi 25 Kas 2026: Etsy resmi API salt okuma). SALT OKUMA: yalniz GET, yalniz API anahtari
# (OAuth token indirilmez / yenilenmez). Betik scripts/etsy/dijital_arastirma.py, test scripts/etsy/test_dijital_arastirma.py.
# Depo herkese acik: toplanan veri commit'e, loga, artifact'e GIRMEZ. Cikti ve devam durumu yalniz gizli Drive:
# ASTROLOVE/DIJITAL_ARASTIRMA_20261125/ (kosu basinda indirilir, sonunda geri yazilir). Logda yalniz sayilar (KimlikSuz).
# Kilit: kilit_bekle (Etsy kumesi). Kosu en fazla --dk dk Etsy okur; kilit kumesinde baska aktif kosu gorurse 60 sn icinde yol
# verir (durum kaydedilir, cikis 4). Kota: kalan < %20 gunluk sinir -> DUR (cikis 3); etsy_common sert tabani 10 aynen.
# Tetik: yalniz main'de config/dijital_arastirma.trigger degisikligi (emsal pod-audit) ya da elle. Zamanlama YOK.
on:
  push:
    branches: [main]
    paths:
      - "config/dijital_arastirma.trigger"
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  oku:
    runs-on: ubuntu-latest
    timeout-minutes: 180     # kilit_bekle en fazla 120 dk + okuma --dk + Drive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kurulum
        run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null
      - name: Yerel test (sahte Etsy, ag yok)
        run: |
          set -euo pipefail
          python scripts/etsy/test_dijital_arastirma.py > _t.log 2>&1 || { grep -E "^(FAIL|SONUC)" _t.log; exit 1; }
          grep -E "^SONUC" _t.log
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
          fi
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - name: Durumu Drive'dan al (kilitten sonra)
        run: |
          set -euo pipefail
          umask 077; mkdir -p out
          rclone lsf "gdrive:ASTROLOVE" --dirs-only -q > /dev/null || { echo "::error::Drive ASTROLOVE okunamadi"; exit 1; }
          rclone mkdir "gdrive:ASTROLOVE/DIJITAL_ARASTIRMA_20261125" -q || { echo "::error::Drive klasoru acilamadi"; exit 1; }
          rclone copy "gdrive:ASTROLOVE/DIJITAL_ARASTIRMA_20261125" out -q || { echo "::error::Drive okunamadi"; exit 1; }
          echo "durum dosyasi: $([ -f out/durum.json ] && echo var || echo yok) | dosya $(find out -type f | wc -l)"
      - name: Oku (salt okur)
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          set +e
          DK=$(python3 -c "import json; print(float(json.load(open('config/dijital_arastirma.trigger')).get('dk', 40)))" 2>/dev/null)
          [ -n "$DK" ] || DK=40
          python scripts/etsy/dijital_arastirma.py --out out --dk "$DK"
          kod=$?
          echo "KOD=$kod" >> "$GITHUB_ENV"
          echo "::notice::dijital_arastirma cikis $kod (0 tamam/sure, 3 kota, 4 yol verildi, 1 hata)"
          exit 0
      - name: Drive'a yaz (sir taramasi)
        if: always()
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
        run: |
          set -euo pipefail
          [ -f out/durum.json ] || { echo "durum yok, yazilmadi"; exit 0; }
          for v in "${ETSY_API_KEY:-}" "${ETSY_SHARED_SECRET:-}" "${RCLONE_CONFIG_GDRIVE_CLIENT_SECRET:-}"; do
            if [ -n "$v" ] && grep -rqF -- "$v" out; then echo "::error::DUR: ciktida sir, Drive'a yazilmadi"; exit 1; fi
          done
          find out -name '*.tmp' -delete
          rclone copy out "gdrive:ASTROLOVE/DIJITAL_ARASTIRMA_20261125" -q
          A=$(python3 -c "import json; d=json.load(open('out/durum.json')); print(d.get('asama'), d.get('kosu'))")
          echo "::notice::Drive: ASTROLOVE/DIJITAL_ARASTIRMA_20261125/ ($(find out -type f | wc -l) dosya) | asama/kosu $A"
      - if: always()
        run: rm -rf ~/.config/rclone out _t.log
      - name: Sonuc (1 ise kirmizi)
        run: |
          echo "cikis kodu: ${KOD:-?}"
          [ "${KOD:-1}" != "1" ]

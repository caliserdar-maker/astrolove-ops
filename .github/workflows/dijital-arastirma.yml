name: dijital-arastirma
# DIJITAL URUN ARASTIRMASI: DERIN TOPLAYICI (huni Asama 2; Serdar 26 Kas "Evet derhal basla", KARARLAR_20261126_2). SALT OKUMA: yalniz
# GET, yalniz API anahtari (OAuth token indirilmez / yenilenmez). Betik scripts/etsy/dijital_arastirma.py, test
# scripts/etsy/test_dijital_arastirma.py. Girdi: Serdar'in isaretledigi 1-8 terim (config/dijital_terimler.txt icinden).
# Depo herkese acik: toplanan veri commit'e, loga, artifact'e GIRMEZ. Cikti ve devam durumu yalniz gizli Drive:
# ASTROLOVE/DIJITAL_ARASTIRMA_20261125/DERIN_<etiket>/ (kosu basinda indirilir, sonunda geri yazilir; ust klasordeki 25 Kas
# taksonomi verisine dokunulmaz). Durum terim kumesine baglidir: baska kume icin baska etiket. Logda yalniz sayilar (KimlikSuz).
# Kilit: kilit_bekle (Etsy kumesi). Kosu en fazla --dk dk Etsy okur; kilit kumesinde baska aktif kosu gorurse 60 sn icinde yol
# verir (durum kaydedilir, cikis 4). Kota: kalan < %20 gunluk sinir -> DUR (cikis 3); etsy_common sert tabani 10 aynen.
# Tetik YALNIZ elle (workflow_dispatch). 26 Kas (Serdar huni karari): saatlik schedule, config tetigi ve kendini yeniden tetikleyen
# zincir KALDIRILDI; devam icin kosu elle yeniden baslatilir (ayni terimler + ayni etiket).
on:
  workflow_dispatch:
    inputs:
      terimler:
        description: "1-8 terim, ';' ile ayrilmis (config/dijital_terimler.txt icinden)"
        required: true
      etiket:
        description: "Drive alt klasoru DERIN_<etiket> (harf, rakam, _ -; en cok 20)"
        required: true
        default: "1"
      dk:
        description: "Etsy okuma suresi (dk, en cok 45)"
        required: false
        default: "40"
permissions:
  contents: read
  actions: read
jobs:
  oku:
    runs-on: ubuntu-latest
    timeout-minutes: 180     # kilit_bekle en fazla 120 dk + okuma --dk + Drive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Girdi kapisi
        env:
          DK_G: ${{ github.event.inputs.dk }}
          ETIKET_G: ${{ github.event.inputs.etiket }}
        run: |
          set -euo pipefail
          DK="${DK_G:-40}"
          case "$DK" in ''|*[!0-9]*) echo "::error::dk tam sayi olmali"; exit 1;; esac
          [ "$DK" -ge 1 ] && [ "$DK" -le 45 ] || { echo "::error::dk 1-45 olmali"; exit 1; }
          [ -n "${ETIKET_G:-}" ] || { echo "::error::etiket bos"; exit 1; }
          printf '%s' "$ETIKET_G" | grep -qE '^[A-Za-z0-9_-]{1,20}$' || { echo "::error::etiket gecersiz"; exit 1; }
          echo "DK=$DK" >> "$GITHUB_ENV"
          echo "ETIKET=$ETIKET_G" >> "$GITHUB_ENV"
      - name: Kurulum
        run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null
      - name: Yerel test (sahte Etsy, ag yok)
        run: |
          set -euo pipefail
          python scripts/etsy/test_dijital_arastirma.py > _t.log 2>&1 || { grep -E "^(FAIL|SONUC)" _t.log; exit 1; }
          grep -E "^SONUC" _t.log
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
          fi
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - name: Durumu Drive'dan al (kilitten sonra)
        run: |
          set -euo pipefail
          umask 077; mkdir -p out
          [ -n "${ETIKET:-}" ] || { echo "::error::etiket bos"; exit 1; }
          U="gdrive:ASTROLOVE/DIJITAL_ARASTIRMA_20261125/DERIN_${ETIKET}"
          rclone lsf "gdrive:ASTROLOVE" --dirs-only -q > /dev/null || { echo "::error::Drive ASTROLOVE okunamadi"; exit 1; }
          rclone mkdir "$U" -q || { echo "::error::Drive klasoru acilamadi"; exit 1; }
          rclone copy "$U" out -q || { echo "::error::Drive okunamadi"; exit 1; }
          echo "durum dosyasi: $([ -f out/durum.json ] && echo var || echo yok) | dosya $(find out -type f | wc -l)"
      - name: Oku (salt okur)
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          GH_TOKEN: ${{ github.token }}
          TERIMLER: ${{ github.event.inputs.terimler }}
        run: |
          set -uo pipefail
          set +e
          umask 077; mkdir -p out          # sir_koru tee log dosyasini betikten once acar
          SJ="$RUNNER_TEMP/sir.json"
          python3 -c 'import json, os, sys; json.dump({"etsy_api_key": os.environ["ETSY_API_KEY"], "etsy_shared_secret": os.environ["ETSY_SHARED_SECRET"]}, open(sys.argv[1], "w"))' "$SJ"
          python scripts/etsy/dijital_arastirma.py --out out --dk "$DK" --terimler="${TERIMLER:-}" 2>&1 \
            | python3 scripts/guvenlik/sir_koru.py tee --sir-json "$SJ" out/DERIN_KOSU_LOG.txt
          RC=("${PIPESTATUS[@]}")
          rm -f "$SJ"
          kod="${RC[0]}"
          [ "${RC[1]}" = 0 ] || { echo "::error::log sir taramasi FAIL"; kod=1; }
          echo "KOD=$kod" >> "$GITHUB_ENV"
          echo "::notice::dijital_arastirma cikis $kod (0 tamam/sure, 3 kota, 4 yol verildi, 1 hata)"
          exit 0
      - name: Drive'a yaz (sir taramasi)
        if: always()
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
        run: |
          set -euo pipefail
          [ -f out/durum.json ] || { echo "durum yok, yazilmadi"; exit 0; }
          [ -n "${ETIKET:-}" ] || { echo "::error::etiket bos"; exit 1; }
          for v in "${ETSY_API_KEY:-}" "${ETSY_SHARED_SECRET:-}" "${RCLONE_CONFIG_GDRIVE_CLIENT_SECRET:-}"; do
            if [ -n "$v" ] && grep -rqF -- "$v" out; then echo "::error::DUR: ciktida sir, Drive'a yazilmadi"; exit 1; fi
          done
          T=(out/durum.json); [ -f out/DERIN_KOSU_LOG.txt ] && T+=(out/DERIN_KOSU_LOG.txt)
          python3 scripts/guvenlik/sir_koru.py tara "${T[@]}" || { echo "::error::DUR: log / durumda sir deseni, Drive'a yazilmadi"; exit 1; }
          find out -name '*.tmp' -delete
          rclone copy out "gdrive:ASTROLOVE/DIJITAL_ARASTIRMA_20261125/DERIN_${ETIKET}" -q
          A=$(python3 -c "import json; d=json.load(open('out/durum.json')); print(d.get('asama'), d.get('kosu'), d.get('istek_toplam'))")
          echo "::notice::Drive: DERIN_${ETIKET}/ ($(find out -type f | wc -l) dosya) | asama / kosu / toplam istek: $A"
      - if: always()
        run: rm -rf ~/.config/rclone out _t.log
      - name: Sonuc (0 / 3 / 4 disi kirmizi)
        run: |
          echo "cikis kodu: ${KOD:-?}"
          case "${KOD:-}" in 0|3|4) exit 0;; *) exit 1;; esac      # yalniz 0 / 3 (kota) / 4 (yol verildi) yesil

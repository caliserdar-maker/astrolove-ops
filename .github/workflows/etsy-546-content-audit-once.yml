name: etsy-546-content-audit-once

on:
  push:
    branches:
      - codex/etsy-546-content-audit-20260916
    paths:
      - .audit/etsy-546-trigger.txt

permissions:
  contents: read

concurrency:
  group: etsy-token
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: Connect read-only sources
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone _work _out
          umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
          rclone copyto "gdrive:ASTROLOVE/TEMP/POD_LISTING/POD_LISTINGS_STATE.csv" _work/pod_state.csv || true\n          rclone copyto "gdrive:ASTROLOVE/TEMP/ADS/etsy_ads_stats_2026-09-16.csv" _work/etsy_ads.csv
      - name: Read all 546 live listings and audit content
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          set -euo pipefail
          python scripts/night2/catalog.py --out _out --files-cache _work/no-files-cache.csv --pod-state _work/pod_state.csv
          python scripts/night2/ads_kpi.py --csv _work/etsy_ads.csv --out _out/ads
          python - <<'PY'
          import csv, json, pathlib
          out=pathlib.Path("_out")
          catalog=list(csv.DictReader((out/"full_etsy_catalog.csv").open(encoding="utf-8")))
          ads={r["listing_id"]:r for r in csv.DictReader(open("_work/etsy_ads.csv",encoding="utf-8-sig"))}
          assert len(catalog)==546, f"catalog {len(catalog)} != 546"
          assert len({r["listing_id"] for r in catalog})==546
          assert len(ads)==546
          rows=[]
          for r in catalog:
              a=ads.get(r["listing_id"],{})
              rows.append({**r,
                "ads_impressions":a.get("impressions","0"),
                "ads_clicks":a.get("clicks","0"),
                "ads_spend":a.get("spend","0"),
                "ads_orders":a.get("orders","0"),
                "ads_revenue":a.get("revenue","0")})
          p=out/"CONTENT_AUDIT_546_WITH_ADS.csv"
          with p.open("w",newline="",encoding="utf-8") as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0]));w.writeheader();w.writerows(rows)
          (out/"CONTENT_AUDIT_546_PROOF.json").write_text(json.dumps({
            "rows":len(rows),"unique_ids":len({r["listing_id"] for r in rows}),
            "families":{k:sum(x["urun_ailesi"]==k for x in rows) for k in sorted({x["urun_ailesi"] for x in rows})},
            "ads_totals":{
              "impressions":sum(int(x["ads_impressions"] or 0) for x in rows),
              "clicks":sum(int(x["ads_clicks"] or 0) for x in rows),
              "spend":round(sum(float(x["ads_spend"] or 0) for x in rows),2),
              "orders":sum(int(x["ads_orders"] or 0) for x in rows)
            }
          },indent=2),encoding="utf-8")
          print((out/"CONTENT_AUDIT_546_PROOF.json").read_text())
          PY
      - name: Save evidence
        if: always()
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y%m%d_%H%M)
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" || true
          if grep -rqE 'access_token|refresh_token|x-api-key' _out 2>/dev/null; then
            echo "::error::secret-like output detected"; exit 1
          fi
          rclone copy _out "gdrive:ASTROLOVE/TEMP/CONTENT_AUDIT_546/$stamp" -q
          echo "Drive: ASTROLOVE/TEMP/CONTENT_AUDIT_546/$stamp"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etsy-546-content-audit
          path: _out/
          if-no-files-found: error
      - if: always()
        run: rm -rf _work ~/.config/rclone

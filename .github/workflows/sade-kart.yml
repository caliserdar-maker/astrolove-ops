name: sade-kart
# Sade kupa bilgi kartlari ORNEK (Serdar 31 Eki is 9): tek burc, 5 kart (galeri 2-6, cift kartlariyla ayni sira ve stil), 3000x2250.
# scripts/kapak78/sade_kart.py: sahne (_v12 ortami: baski_kes_sade kupa-orchard dc4a432 (v2) + kapak_canva3 temiz/kupa-orchard 0196e37a) -> kart
# (kart ortami: kupa_zemin + wa_kupa_kart_ornek kapilari). SIMD sabit (Serdar 31 Eki 8a). ETSY YOK. Cikti Drive TEMP/SADE_KART_V2/<damga>/.
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      burclar: {description: "virgullu BUYUK harf; bos = 12 burc", required: false, default: ""}
      on_yazi: {description: "on yazi (en fazla 12)", required: true, default: "EMILY"}
      mesaj: {description: "arka mesaj (en fazla 30)", required: true, default: "My favorite place is with you"}
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      m: ${{ steps.m.outputs.m }}
      damga: ${{ steps.m.outputs.damga }}
    steps:
      - id: m
        env: {B: "${{ inputs.burclar }}"}
        run: |
          set -euo pipefail
          T="ARIES TAURUS GEMINI CANCER LEO VIRGO LIBRA SCORPIO SAGITTARIUS CAPRICORN AQUARIUS PISCES"
          L=${B:-$(echo $T | tr ' ' ',')}
          for x in ${L//,/ }; do [[ " $T " == *" $x "* ]] || { echo "::error::burc $x"; exit 1; }; done
          echo "m=$(python3 -c "import json,sys; print(json.dumps(sys.argv[1].split(',')))" "$L")" >> "$GITHUB_OUTPUT"
          echo "damga=$(date -u +%Y%m%d_%H%M%S)" >> "$GITHUB_OUTPUT"
  kart:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        burc: ${{ fromJSON(needs.plan.outputs.m) }}
    env: {DAMGA: "${{ needs.plan.outputs.damga }}"}
    steps:
      - name: Girdi kapisi
        env: {B: "${{ matrix.burc }}", O: "${{ inputs.on_yazi }}", M: "${{ inputs.mesaj }}"}
        run: '[[ "$B" =~ ^(ARIES|TAURUS|GEMINI|CANCER|LEO|VIRGO|LIBRA|SCORPIO|SAGITTARIUS|CAPRICORN|AQUARIUS|PISCES)$ && ${#O} -le 12 && ${#M} -le 30 ]] || { echo "::error::girdi"; exit 1; }'
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: Kaynaklar (SHA ile)
        env: {B: "${{ matrix.burc }}"}
        run: |
          set -euo pipefail
          git fetch -q --depth 1 origin dc4a4323c9218200447979a06ec7557e6f194e6d && git worktree add -q _kos FETCH_HEAD   # sade v2 (Serdar 31 Eki)
          git fetch -q --depth 1 origin 0196e37a0447d61eab42b84778a56d9261b0b201 && git worktree add -q _ko FETCH_HEAD
          git fetch -q --depth 1 origin ac9aa7185f9d7b07903f0cb99e7f366f425a631c
          git show "FETCH_HEAD:kupa_uretim/sembol/${B}_${B}/sol.png" > _glif.png
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kurulum (kupa-kart78 ile ayni surumler)
        run: |
          set -euo pipefail
          pip install -q pillow==11.0.0 numpy==2.1.3 opencv-python-headless==4.10.0.84
          python3 -m venv _v12 && _v12/bin/pip install -q numpy==2.5.3 pillow==12.3.0 scipy==1.18.1 opencv-python-headless==5.0.0.93 fonttools==4.60.1
          python3 -c "from PIL import features; import sys; sys.exit(0 if features.check('raqm') else 1)"
          _v12/bin/python3 -c "from PIL import features; import sys; sys.exit(0 if features.check('raqm') else 1)"   # baski metni de raqm ile
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || { sudo apt-get install -y -qq rclone >/dev/null; }
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Sahne + kart
        env: {B: "${{ matrix.burc }}", O: "${{ inputs.on_yazi }}", M: "${{ inputs.mesaj }}"}
        run: |
          set -uo pipefail
          mkdir -p _o
          BB=$(python3 -c "import sys; print(sys.argv[1].capitalize())" "$B")
          { grep -m1 "model name" /proc/cpuinfo; grep -m1 -o avx512f /proc/cpuinfo || echo "avx512 yok"; } > _o/MAKINE.txt
          ( _v12/bin/python3 -I scripts/kapak78/sade_kart.py sahne --ko _ko/kupa_orchard --kos _kos/kupa_orchard --glif _glif.png \
              --on "$O" --mesaj "$M" --out _s \
            && python3 -I scripts/kapak78/sade_kart.py kart --burc "$BB" --glif _glif.png --gorunum _s/gorunum --sahne _z --out _o ) > _o/LOG.txt 2>&1
          echo "KOD=$?" >> "$GITHUB_ENV"
          tail -5 _o/LOG.txt
      - name: Drive'a yaz
        if: always()
        env: {B: "${{ matrix.burc }}"}
        run: |
          set -euo pipefail
          if ls _o/* >/dev/null 2>&1; then
            mkdir -p _up/$B && cp _o/* _up/$B/ && mv _up/$B/MAKINE.txt _up/$B/MAKINE_$B.txt && mv _up/$B/LOG.txt _up/$B/LOG_$B.txt
            rclone copy _up "gdrive:ASTROLOVE/TEMP/SADE_KART_V2/${DAMGA:?}" --immutable -q
            echo "::notice title=SADE KART::TEMP/SADE_KART_V2/${DAMGA}/"
          fi
          [ "${KOD:-1}" = 0 ] || { echo "::error::sade_kart hata (LOG.txt)"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "k-${{ matrix.burc }}", path: "_o/SADE_*_K0*.jpg", retention-days: 3}
      - if: always()
        run: rm -rf _o _up ~/.config/rclone
  kontak:
    needs: [plan, kart]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: "k-*", merge-multiple: true, path: _k}
      - name: KONTAK (12 burc x 5 kart, galeri sirasi)
        run: |
          set -euo pipefail
          pip install -q pillow==11.0.0
          python3 - <<'EOF'
          from pathlib import Path
          from PIL import Image
          T = "ARIES TAURUS GEMINI CANCER LEO VIRGO LIBRA SCORPIO SAGITTARIUS CAPRICORN AQUARIUS PISCES".split()
          K = ["K02_SEMBOL", "K03_KISISEL", "K05_BOYUT", "K07_SUREC", "K04_STIL"]
          B = [b for b in T if Path(f"_k/SADE_{b}_K02_SEMBOL.jpg").exists()]
          w, h = 600, 450
          s = Image.new("RGB", (5 * (w + 10) + 10, len(B) * (h + 10) + 10), (230, 230, 230))
          for i, b in enumerate(B):
              for j, k in enumerate(K):
                  p = Path(f"_k/SADE_{b}_{k}.jpg")
                  if p.exists():
                      s.paste(Image.open(p).resize((w, h), Image.LANCZOS), (10 + j * (w + 10), 10 + i * (h + 10)))
          s.save("KONTAK_SADE_12.jpg", quality=85)
          print(len(B), "burc")
          EOF
      - name: Drive'a yaz
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DAMGA: ${{ needs.plan.outputs.damga }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || { sudo apt-get install -y -qq rclone >/dev/null; }
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            export RCLONE_CONFIG_GDRIVE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET"; fi
          rclone copyto KONTAK_SADE_12.jpg "gdrive:ASTROLOVE/TEMP/SADE_KART_V2/$DAMGA/KONTAK_SADE_12.jpg" --immutable -q
          rm -rf ~/.config/rclone
          echo "::notice title=SADE KART 12::TEMP/SADE_KART_V2/$DAMGA/"

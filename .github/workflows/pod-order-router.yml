name: pod-order-router

# Etsy POD siparisi -> Prodigi (scripts/prodigi/order_router.py).
# ONAYLI MOD (Mo 7 Eyl 2026, varsayilan): kosu yalniz PAKET HAZIRLAR - yeni her POD receipt'i icin
# Prodigi siparis govdesi + teklif/marj TEMP/POD_ORDERS/<receipt_id>.json'a yazilir, STATE "bekliyor";
# Prodigi'ye SIPARIS GONDERILMEZ, Etsy'ye kargo bildirimi YAZILMAZ (yalniz loglanir).
# Gonderim: workflow_dispatch girdisi submit=<receipt_id> -> yalniz o paket canli Prodigi'ye gider
# (--apply); ayni receipt ikinci kez gonderilemez (STATE + .result.json + Prodigi idempotencyKey).
# Cron 30 dk: env=live, onayli mod (Etsy ~48 cagri/gun). STATE Drive TEMP/POD_ORDERS_STATE.csv.

permissions:
  contents: read

on:
  # CRON BEKLEMEDE (7 Eyl 2026): Etsy access token'inda transactions_r kapsami YOK
  # (GET /shops/{id}/receipts -> 403 "requires scope: transactions_r", run 34097249381).
  # Kapsam olmadan her cron kosusu hata verir ve etsy-token grubunu mesgul eder.
  # Mo Etsy uygulamasini transactions_r (+ ileride tracking icin transactions_w) ile yeniden
  # yetkilendirip ETSY_TOKEN.json'i yeniledikten sonra asagidaki iki satir acilir:
  # 21 Eyl 2026 (Serdar onayi): transactions_r + transactions_w alindi, cron CANLI otomatik moda acildi.
  # NOT: schedule yalniz VARSAYILAN DALDAKI (main) surumden tetiklenir.
  schedule:
    - cron: "*/15 * * * *"        # canli otomatik mod: kosu basina en fazla 1 siparis + takip yazma
  workflow_dispatch:
    inputs:
      submit:
        description: "Receipt id: YALNIZ bu hazir paketi Prodigi'ye GONDER (onay). Bos = paket hazirla"
        required: false
        default: ""
      approve_mode:
        description: "true = onayli mod (paket hazirla, gonderme)"
        type: boolean
        default: true
      env:
        description: "Prodigi ortami"
        type: choice
        options: [live, sandbox]
        default: live
      since_days:
        description: "Yalniz son N gunun receipt'leri (0 = hepsi)"
        required: false
        default: "7"
      test_receipt:
        description: "Drive'da test receipt JSON (or. TEMP/POD_ORDERS/TEST_RECEIPT.json); bos = Etsy'den oku"
        required: false
        default: ""
      etsy_writes:
        description: "true = kargo takibini Etsy'ye yaz (onayli mod kapaliyken; onay)"
        type: boolean
        default: false
      only_size:
        description: "Yalniz bu boyun kalemleri islenir (or. 5x7); bos = tum boylar"
        required: false
        default: ""
      otomatik:
        description: "true = CANLI otomatik mod: kendi siparisimizi ac + takibi Etsy'ye yaz"
        type: boolean
        default: false
      max_orders:
        description: "otomatik modda kosu basina en fazla siparis"
        required: false
        default: "1"
      sadece_test:
        description: "true = yalniz sahte receipt kuru testi (Etsy okunmaz, siparis yok)"
        type: boolean
        default: false

concurrency:
  group: etsy-token
  cancel-in-progress: false

jobs:
  route:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.POD_ROUTER_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Girdiler (cron = live + onayli mod)
        env:
          EV: ${{ github.event_name }}
          IN_SUBMIT: ${{ inputs.submit }}
          IN_APPROVE: ${{ inputs.approve_mode }}
          IN_ENV: ${{ inputs.env }}
          IN_DAYS: ${{ inputs.since_days }}
          IN_TR: ${{ inputs.test_receipt }}
          IN_EW: ${{ inputs.etsy_writes }}
          IN_ONLY: ${{ inputs.only_size }}
          IN_OTO: ${{ inputs.otomatik }}
          IN_MAX: ${{ inputs.max_orders }}
        run: |
          set -euo pipefail
          if [ "$EV" = "schedule" ]; then
            { echo "R_ENV=live"; echo "R_APPROVE=off"; echo "R_SUBMIT="; echo "R_DAYS=7"; echo "R_TR=";
              echo "R_EW=--etsy-writes"; echo "R_ONLY="; echo "R_OTO=true"; echo "R_MAX=1"; } >> "$GITHUB_ENV"
          else
            echo "R_ENV=${IN_ENV:-live}" >> "$GITHUB_ENV"
            echo "R_SUBMIT=${IN_SUBMIT}" >> "$GITHUB_ENV"
            echo "R_DAYS=${IN_DAYS:-7}" >> "$GITHUB_ENV"
            echo "R_TR=${IN_TR}" >> "$GITHUB_ENV"
            echo "R_ONLY=${IN_ONLY}" >> "$GITHUB_ENV"
            echo "R_OTO=${IN_OTO:-false}" >> "$GITHUB_ENV"
            echo "R_MAX=${IN_MAX:-1}" >> "$GITHUB_ENV"
            if [ -n "${IN_SUBMIT}" ]; then
              echo "R_APPROVE=off" >> "$GITHUB_ENV"; echo "R_EW=" >> "$GITHUB_ENV"
            else
              [ "$IN_APPROVE" = "false" ] && echo "R_APPROVE=off" >> "$GITHUB_ENV" || echo "R_APPROVE=on" >> "$GITHUB_ENV"
              [ "$IN_EW" = "true" ] && echo "R_EW=--etsy-writes" >> "$GITHUB_ENV" || echo "R_EW=" >> "$GITHUB_ENV"
            fi
          fi
      - name: Token, STATE, hazir paketler
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out _work/packages
          if [ "${{ inputs.sadece_test }}" != "true" ]; then
            rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
          fi
          rclone copyto "gdrive:ASTROLOVE/TEMP/POD_ORDERS_STATE.csv" _work/state.csv 2>/dev/null || echo "STATE yok; yeni baslar"
          rclone copy "gdrive:ASTROLOVE/TEMP/POD_ORDERS" _work/packages --include "*.json" -q 2>/dev/null || true
          echo "hazir paket: $(ls _work/packages/*.json 2>/dev/null | wc -l)"
          # kisisellestirme musteri mesaji sablonlari (yoksa kartta "sablon eksik" yazar)
          rclone copyto "gdrive:ASTROLOVE/TEMP/SIPARIS_ISIM/MUSTERI_MESAJLARI.md" _work/MUSTERI_MESAJLARI.md 2>/dev/null \
            && echo "musteri mesaj sablonlari alindi" || echo "musteri mesaj sablonlari YOK (TEMP/SIPARIS_ISIM/MUSTERI_MESAJLARI.md)"
          if [ -n "${R_TR:-}" ]; then
            case "$R_TR" in
              TEMP/*) rclone copyto "gdrive:ASTROLOVE/$R_TR" _work/test_receipt.json ;;
              *)      cp "$R_TR" _work/test_receipt.json ;;                      # depodaki sahte receipt
            esac
          fi
      - name: Sahte receipt paketi (Prodigi teklif; siparis YOK, canli STATE'e dokunmaz)
        if: ${{ inputs.test_receipt != '' }}
        run: |
          set -euo pipefail
          mkdir -p _out/test
          env_kullan="$R_ENV"
          if [ "$env_kullan" = "sandbox" ] && ! rclone lsf "gdrive:ASTROLOVE/TEMP/PRODIGI_SANDBOX_TOKEN.json" >/dev/null 2>&1; then
            echo "::warning::sandbox anahtari yok -> live ortamda YALNIZ teklif (siparis yok)"
            env_kullan="live"
          fi
          echo "kuru test ortami: $env_kullan"
          args=(--env "$env_kullan" --state _work/state_test.csv --out _out/test --packages _out/test
                --approve-mode on --test-receipt _work/test_receipt.json)
          [ -n "${R_ONLY:-}" ] && args+=(--only-size "$R_ONLY")
          python scripts/prodigi/order_router.py "${args[@]}"
          for f in _out/test/*.json; do
            echo "--- $f"; python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(json.dumps({k: d[k] for k in ('receipt_id','only_size','country','etsy_total','prodigi_cost','margin','warn') if k in d}, ensure_ascii=False)); print('kalemler:', [(i['sku'], i['prodigi_sku'], i['asset_remote']) for i in d.get('items', [])]); print('idempotencyKey:', d.get('order', {}).get('idempotencyKey'))" "$f"
          done
          rclone copy _out/test "gdrive:ASTROLOVE/TEMP/POD_5X7/ROUTER_TEST" --include "*.json" || true
      - name: Yonlendir
        if: ${{ inputs.sadece_test != true }}
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          set -euo pipefail
          args=(--env "$R_ENV" --state _work/state.csv --out _out --packages _work/packages
                --approve-mode "$R_APPROVE" --since-days "$R_DAYS" --quota-min 400)
          [ -n "${R_ONLY:-}" ] && args+=(--only-size "$R_ONLY")
          if [ -n "${R_SUBMIT:-}" ]; then
            echo "::warning::GONDERIM: receipt $R_SUBMIT canli Prodigi siparisine cevrilecek"
            args+=(--submit "$R_SUBMIT" --apply)
          elif [ "${R_OTO:-false}" = "true" ]; then
            echo "::warning::CANLI OTOMATIK MOD: kosu basina en fazla ${R_MAX} siparis; takip Etsy'ye yazilir"
            args+=(--apply --approve-mode off --max-orders "${R_MAX}" --min-yas-dk 60
                   --devral "1000000001=ord_14538276")     # elden acilan siparis: takibi buradan yazilir
            [ -n "${R_EW:-}" ] && args+=("$R_EW") || true
          elif [ "$R_APPROVE" = "off" ]; then
            echo "::warning::onayli mod KAPALI"
            args+=(--dry-run)
            [ -n "${R_EW:-}" ] && args+=("$R_EW") || true
          fi
          python scripts/prodigi/order_router.py "${args[@]}"        # sahte receipt ayri adimda kosar
      - name: Token/STATE/paket/rapor Drive'a
        if: ${{ always() }}
        env:
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}      # yalniz opak receipt kodu icin
        run: |
          set -euo pipefail
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "Token geri yazildi" || true
          if [ -s _work/state.csv ]; then rclone copyto _work/state.csv "gdrive:ASTROLOVE/TEMP/POD_ORDERS_STATE.csv" && echo "STATE yazildi"; fi
          ls _out/*.json >/dev/null 2>&1 && rclone copy _out "gdrive:ASTROLOVE/TEMP/POD_ORDERS" --include "*.json" --max-depth 1 -q && echo "Paketler Drive'a yazildi" || true
          stamp=$(TZ=Europe/Istanbul date +%Y%m%d_%H%M)
          [ -f _out/REPORT.md ] && rclone copyto _out/REPORT.md "gdrive:ASTROLOVE/TEMP/POD_ORDERS/REPORT_${R_ENV}_${stamp}.md" || true
          [ -f _out/DIKKAT.md ] && rclone copyto _out/DIKKAT.md "gdrive:ASTROLOVE/TEMP/POD_ORDERS/DIKKAT.md" && echo "DIKKAT.md Drive'a yazildi" || true
          # ISIM_BEKLIYOR: kartlar Drive'a; her YENI siparis icin bildirim (GitHub hata e-postasina dusen annotation)
          if [ -d _out/SIPARIS_ISIM ]; then
            rclone copy _out/SIPARIS_ISIM "gdrive:ASTROLOVE/TEMP/SIPARIS_ISIM" --include "*.md" -q && echo "siparis kartlari Drive'a yazildi"
          fi
          if [ -s _out/ISIM_YENI.txt ]; then
            while read -r rid; do
              [ -z "$rid" ] && continue
              fid=$(rclone lsjson "gdrive:ASTROLOVE/TEMP/SIPARIS_ISIM/${rid}.md" 2>/dev/null | python3 -c "import json,sys;d=json.load(sys.stdin);print(d[0]['ID'] if d else '')" || true)
              kod=$(python3 -c "import sys;sys.path.insert(0,'scripts/prodigi');import order_router as R;print(R.receipt_kod(sys.argv[1]))" "$rid")
              echo "::error title=ISIM_BEKLIYOR ${kod}::Kisisellestirmeli siparis ${kod} Prodigi'ye GONDERILMEDI. Kart: https://drive.google.com/file/d/${fid}/view"
            done < _out/ISIM_YENI.txt
          fi
      # Artifact'ta musteri verisi YOK (kart, paket/adres, STATE/receipt yalniz Drive'da): yalniz SKU haritasi.
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: pod-order-router
          path: _out/PRODIGI_SKU_HARITA.json
          if-no-files-found: ignore
          retention-days: 30
      - if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

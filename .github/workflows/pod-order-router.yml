name: pod-order-router

# Etsy POD siparisi -> Prodigi siparisi -> kargo takibi -> Etsy (scripts/prodigi/order_router.py).
# Zamanlanmis kosu (30 dk) yalniz repo degiskeni POD_ROUTER_ENABLED=true ise calisir ve
# env=live, apply, etsy_writes ile kosar. Elle tetiklemede varsayilan dry_run=true / sandbox.
# STATE Drive TEMP/POD_ORDERS_STATE.csv (yalniz apply'da geri yazilir); rapor TEMP/POD_ORDERS/.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      env:
        description: "Prodigi ortami"
        type: choice
        options: [sandbox, live]
        default: sandbox
      dry_run:
        description: "true = yalniz raporla; false = Prodigi'ye siparis YAZ (onay)"
        type: boolean
        default: true
      etsy_writes:
        description: "true = kargo takibini Etsy'ye yaz (yalniz live, onay)"
        type: boolean
        default: false
      test_receipt:
        description: "Drive'da test receipt JSON (ASTROLOVE altinda, or. TEMP/POD_ORDERS/TEST_RECEIPT.json); bos = Etsy'den oku"
        required: false
        default: ""

concurrency:
  group: etsy-token
  cancel-in-progress: false

jobs:
  route:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.POD_ROUTER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
      - name: Girdiler (cron = live/apply/etsy_writes)
        env:
          EV: ${{ github.event_name }}
          IN_ENV: ${{ inputs.env }}
          IN_DRY: ${{ inputs.dry_run }}
          IN_EW: ${{ inputs.etsy_writes }}
          IN_TR: ${{ inputs.test_receipt }}
        run: |
          set -euo pipefail
          if [ "$EV" = "schedule" ]; then
            echo "R_ENV=live" >> "$GITHUB_ENV"; echo "R_MODE=--apply" >> "$GITHUB_ENV"; echo "R_EW=--etsy-writes" >> "$GITHUB_ENV"; echo "R_TR=" >> "$GITHUB_ENV"
          else
            echo "R_ENV=$IN_ENV" >> "$GITHUB_ENV"
            [ "$IN_DRY" = "true" ] && echo "R_MODE=--dry-run" >> "$GITHUB_ENV" || echo "R_MODE=--apply" >> "$GITHUB_ENV"
            [ "$IN_EW" = "true" ] && echo "R_EW=--etsy-writes" >> "$GITHUB_ENV" || echo "R_EW=" >> "$GITHUB_ENV"
            echo "R_TR=$IN_TR" >> "$GITHUB_ENV"
          fi
      - name: Token, STATE, test receipt
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
          rclone copyto "gdrive:ASTROLOVE/TEMP/POD_ORDERS_STATE.csv" _work/state.csv 2>/dev/null || echo "STATE yok; yeni baslar"
          if [ -n "${R_TR:-}" ]; then rclone copyto "gdrive:ASTROLOVE/$R_TR" _work/test_receipt.json; fi
      - name: Yonlendir
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          set -euo pipefail
          [ "$R_MODE" = "--apply" ] && echo "::warning::APPLY: Prodigi $R_ENV siparis yazilacak ${R_EW:+(+ Etsy tracking)}" || true
          args=(--env "$R_ENV" --state _work/state.csv --out _out "$R_MODE")
          [ -n "${R_EW:-}" ] && args+=("$R_EW")
          [ -f _work/test_receipt.json ] && args+=(--test-receipt _work/test_receipt.json)
          python scripts/prodigi/order_router.py "${args[@]}"
      - name: Token/STATE/rapor Drive'a
        if: ${{ always() }}
        run: |
          set -euo pipefail
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "Token geri yazildi" || true
          if [ "$R_MODE" = "--apply" ] && [ -s _work/state.csv ]; then
            rclone copyto _work/state.csv "gdrive:ASTROLOVE/TEMP/POD_ORDERS_STATE.csv" && echo "STATE yazildi"
          fi
          stamp=$(TZ=Europe/Istanbul date +%Y%m%d_%H%M)
          [ -f _out/REPORT.md ] && rclone copyto _out/REPORT.md "gdrive:ASTROLOVE/TEMP/POD_ORDERS/REPORT_${R_ENV}_${stamp}.md" || true
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: pod-order-router
          path: |
            _out/
            _work/state.csv
          if-no-files-found: ignore
          retention-days: 30
      - if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

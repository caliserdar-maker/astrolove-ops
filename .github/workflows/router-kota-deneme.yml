name: router-kota-deneme

# Serdar 23 Eki (SIRA 4): router 2c testi. Etsy'den YALNIZ receipt listesi okunur (order_router.py --kota-deneme: filtresiz,
# sayfa boyu 1, opak kod); isleme, STATE, paket, Prodigi ve Etsy yazma YOK. mod dusuk: --quota-min 99999 (ilk sayfadan sonra
# kota durmasi zorlanir) -> KOTA_DURDU.txt -> kosu KIRMIZI biter (pod-order-router.yml son adimiyla ayni satir). mod normal:
# --quota-min 0 -> tum receipt'ler okunur (dusukte okunmayanlarin sonraki kosuda okundugu kodlarla gorulur).

permissions:
  actions: read
  contents: read

on:
  workflow_dispatch:
    inputs:
      mod: {description: "dusuk | normal", required: true, default: "dusuk"}

jobs:
  deneme:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Token
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
      - name: Receipt listesi (yalniz okuma)
        env:
          MOD: ${{ inputs.mod }}
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_KOTA_ROL: router
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          set -euo pipefail
          case "$MOD" in dusuk) Q=99999;; normal) Q=0;; *) echo "::error::mod"; exit 1;; esac
          python scripts/prodigi/order_router.py --kota-deneme --sayfa 1 --max-pages 20 --quota-min "$Q" \
            --state _work/state_yok.csv --out _out
      - name: Token geri yaz + kota durmasi
        if: ${{ always() }}
        run: |
          set -euo pipefail
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "Token geri yazildi" || true
          # pod-order-router.yml son adimiyla ayni satir:
          if [ -s _out/KOTA_DURDU.txt ]; then echo "::error title=ROUTER KOTA::$(head -c 400 _out/KOTA_DURDU.txt)"; exit 1; fi
      - if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

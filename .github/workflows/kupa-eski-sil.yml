name: kupa-eski-sil
# Eski sade kupa taslagi 4607523667'yi SIL (Serdar 2 Kas onayi; Merkez 2 Kas gece madde 3). Yalniz bu tek ilan; yayin/Ads yok.
# Kod: scripts/etsy/kupa_sade_eski_sil.py. Sira: kilit -> OKU (draft + baslik + SKU kumesi 1 Kas okumasiyla birebir; ham JSON yedek)
# -> yedek Drive'a (--immutable) + md5 dogrulamasi -> SIL (yeniden oku, ayni kosullar, TEK deleteListing) -> 404 dogrulamasi.
# Yedek ya da kosul tutmazsa silme YOK. Rapor + yedek: Drive TEMP/SADE_KUPA_SIL/<run_id>/. Kota tabani 10 (etsy_common.KOTA_SINIRI).
permissions:
  actions: read
  contents: read
on:
  workflow_dispatch:
    inputs:
      onay: { description: "Silinecek ilan numarasini yaz (4607523667); farkliysa kosu durur", required: true, default: "" }
jobs:
  sil:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - name: Onay kapisi
        env: { ONAY: "${{ inputs.onay }}" }
        run: '[ "$ONAY" = "4607523667" ] || { echo "::error::onay girdisi 4607523667 degil"; exit 1; }'
      - uses: actions/checkout@v4
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Kurulum
        run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || sudo apt-get install -y -qq rclone >/dev/null
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"; echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Etsy token
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
      - name: 1 Oku + kosul (silme yok)
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          OUT: _out
        run: python3 scripts/etsy/kupa_sade_eski_sil.py --asama oku
      - name: 2 Yedek Drive'a + dogrulama (tutmazsa silme yok)
        run: |
          set -euo pipefail
          python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/ETSY_TOKEN.json _out || { echo "::error::ciktida sir"; exit 1; }
          D="gdrive:ASTROLOVE/TEMP/SADE_KUPA_SIL/${GITHUB_RUN_ID}"
          rclone copy _out "$D" --immutable -q
          Y=YEDEK_4607523667.json
          L=$(md5sum "_out/$Y" | cut -d' ' -f1); U=$(rclone md5sum "$D/$Y" | cut -d' ' -f1)
          echo "yedek md5 yerel $L drive $U"
          [ -n "$U" ] && [ "$L" = "$U" ] || { echo "::error::Drive yedegi dogrulanamadi; silme yok"; exit 1; }
          echo "::notice title=SIL::yedek TEMP/SADE_KUPA_SIL/${GITHUB_RUN_ID}/$Y"
      - name: 3 Sil (yeniden oku, ayni kosullar, tek deleteListing, 404 dogrulamasi)
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          OUT: _out
        run: python3 scripts/etsy/kupa_sade_eski_sil.py --asama sil
      - name: Rapor Drive'a + token geri yaz
        if: ${{ always() }}
        run: |
          OUT_RC=0; TOKEN_RC=0
          if ls _out/* >/dev/null 2>&1; then
            python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/ETSY_TOKEN.json _out \
              && rclone copy _out "gdrive:ASTROLOVE/TEMP/SADE_KUPA_SIL/${GITHUB_RUN_ID}" --ignore-existing -q || OUT_RC=1
          fi
          bash scripts/etsy/token_geri_yaz.sh || TOKEN_RC=1
          rm -rf _work ~/.config/rclone
          [ "$OUT_RC" = 0 ] && [ "$TOKEN_RC" = 0 ] || exit 1

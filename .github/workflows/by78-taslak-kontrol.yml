name: by78-taslak-kontrol

# BY78 78 taslak BAGIMSIZ kontrol (14 Eki 2026, Takip gorevi). SALT OKUR: Etsy API'ye yalniz GET; yazma metodu varsa is FAIL.
# Taslak listesi: Drive TEMP/<taslak_yol> (cift, listing_id). Ilan metni: bizim-yilimiz-v3 BIZIM_YILIMIZ_78_ILAN_METIN.csv.
# Cikti: Drive TEMP/BY78_TASLAK_KONTROL/KONTROL.csv + OZET.md (PASS sayisi, FAIL listesi, kalan kota).
# Ana oturum Etsy'ye yazarken CALISTIRILMAZ (kilit sirayi tutar; ayni anda tek Etsy kosusu).

permissions:
  actions: read
  contents: read

on:
  workflow_dispatch:
    inputs:
      taslak_yol: { description: "Drive ASTROLOVE/TEMP altindaki taslak CSV", required: false, default: "BY78_TASLAK_20261014/BY78_TASLAKLAR.csv" }
      metin_ref: { description: "ilan metni dali/commit", required: false, default: "bizim-yilimiz-v3" }
      mod: { description: "tam (ilan basi ~7 GET) | hafif (getListingsByListingIds 1 GET + bag kaydi)", required: false, default: "tam" }

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Token + girdiler
        env:
          TASLAK: ${{ inputs.taslak_yol }}
          METIN_REF: ${{ inputs.metin_ref }}
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
          rclone copyto "gdrive:ASTROLOVE/TEMP/$TASLAK" _work/TASLAK.csv
          git fetch -q --depth 1 origin "$METIN_REF" && git show FETCH_HEAD:BIZIM_YILIMIZ_78_ILAN_METIN.csv > _work/METIN.csv
          echo "metin $(git rev-parse --short FETCH_HEAD) | taslak $(($(wc -l < _work/TASLAK.csv) - 1)) satir"
          if [ "${{ inputs.mod }}" = hafif ]; then
            rclone copyto "gdrive:ASTROLOVE/TEMP/BY78_TASLAK_20261014/BY78_KAPAK_VIDEO.csv" _work/BAG.csv
            rclone copyto "gdrive:ASTROLOVE/TEMP/BY78_TASLAK_20261014/BY78_VIDEO_ETSY.json" _work/CL.json
            echo "bag kaydi $(($(wc -l < _work/BAG.csv) - 1)) satir + CL"
          fi
      - name: Guvenlik testi (yazma metodu varsa DUR) + birim test
        run: |
          set -euo pipefail
          if grep -nE "\.(patch|put|post|delete|post_json|put_json|post_file)\(|requests\.(patch|put|post|delete)|method=.(PATCH|PUT|POST|DELETE)" scripts/etsy/by78_taslak_kontrol.py; then
            echo "::error::Salt-okur betikte yazma metodu bulundu"; exit 1
          fi
          python -m unittest scripts/etsy/test_by78_taslak_kontrol.py
      - name: Kontrol (yalniz GET)
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          if [ "${{ inputs.mod }}" = hafif ]; then
            python scripts/etsy/by78_taslak_kontrol.py --taslak _work/TASLAK.csv --metin _work/METIN.csv --out _out --hafif --bag-csv _work/BAG.csv --cl-json _work/CL.json
          else
            python scripts/etsy/by78_taslak_kontrol.py --taslak _work/TASLAK.csv --metin _work/METIN.csv --out _out
          fi
      - name: Token geri yazimi ve cikti Drive'a
        if: ${{ always() }}
        run: |
          set -euo pipefail
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "yenilenen token geri yazildi" || true
          [ -f _out/KONTROL.csv ] || [ -f _out/KONTROL_HAFIF.csv ] || { echo "cikti yok"; exit 1; }
          python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/ETSY_TOKEN.json _out || { echo "::error::Ciktida sir bulundu; Drive'a yazilmadi"; exit 1; }
          rclone copy _out "gdrive:ASTROLOVE/TEMP/BY78_TASLAK_KONTROL" -q
          echo "Cikti: ASTROLOVE/TEMP/BY78_TASLAK_KONTROL/ (KONTROL.csv, OZET.md)"
          cat _out/OZET*.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: rm -rf _work ~/.config/rclone

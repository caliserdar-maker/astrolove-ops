name: pinterest-analiz
# Pinterest anlik durum tespiti 19 Eki 2026 (SALT OKUMA). Metricool ve Pinterest'e YAZMA / SILME / DEGISTIRME YOK; yalniz GET.
# scripts/sosyal/analiz/pinterest.py: hesap gunluk (1 Eki+), pin bazinda, pano, plan/gercek (13 Eki+), 14-16 Eki yeniden okuma.
# Token: secret METRICOOL_USER_TOKEN (userId/blogId Drive METRICOOL_TOKEN.json'dan). Loga yazilmaz (::add-mask:: + sir_koru).
# Sir taramasini gecmeyen dosya _work'te kalir, Drive'a gitmez. Cikti: Drive ASTROLOVE/TEMP/SOSYAL_ANALIZ_20261019/PINTEREST/.
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      mod:
        description: "analiz (19 Eki tespit) | karsilastir (ChatGPT PIEV01 ayrismasi) | k4 (Eylul/Ekim pin farki, kontak sayfalari, P3 pano plan/zamanlayici; cikti K4/)"
        default: analiz
jobs:
  oku:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      O: gdrive:ASTROLOVE/TEMP/SOSYAL_ANALIZ_20261019/PINTEREST
    steps:
      - uses: actions/checkout@v4
      - name: rclone + token
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          mkdir -p ~/.config/rclone _work _out; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Analiz (yalniz GET)
        env:
          MC_TOK: ${{ secrets.METRICOOL_USER_TOKEN }}
        run: |
          set -uo pipefail
          umask 077
          [ -n "${MC_TOK:-}" ] || { echo "::error::METRICOOL_USER_TOKEN bos"; exit 1; }
          echo "::add-mask::$MC_TOK"
          rclone copyto "gdrive:ASTROLOVE/TEMP/METRICOOL_TOKEN.json" _work/kimlik.json
          python3 -c "import json,os;d=json.load(open('_work/kimlik.json'));json.dump({'userToken':os.environ['MC_TOK'],'userId':d['userId'],'blogId':d['blogId']},open('_work/mc.json','w'))"
          python3 -c "import json;print('::add-mask::'+json.load(open('_work/kimlik.json'))['userToken'])"
          mkdir -p _work/onceki
          rclone copy "gdrive:ASTROLOVE/TEMP/PINTEREST_20261017" _work/onceki --include "HAM_*.json" -q || echo "onceki okuma yok"
          if [ "${{ inputs.mod }}" = "karsilastir" ]; then BETIK="scripts/sosyal/analiz/pinterest_karsilastir.py _work/mc.json _out"
          elif [ "${{ inputs.mod }}" = "k4" ]; then
            pip install -q pillow >/dev/null 2>&1 || true
            mkdir -p _work/k1 _work/plan _work/img
            rclone copy "$O" _work/k1 --include "HAM_posts_pinterest.json" --max-depth 1 -q || echo "K1 okuma yok"
            rclone copy "gdrive:ASTROLOVE/TEMP/PIN_V6_20261012/PLAN" _work/plan --include "PIN_V6_PLAN_YAYIN.csv" -q || echo "PLAN_YAYIN yok"
            BETIK="scripts/sosyal/analiz/pinterest_k4.py _work/mc.json _out/K4 _work/img --onceki _work/onceki/HAM_posts_pinterest.json --k1 _work/k1/HAM_posts_pinterest.json --metin sosyal/pin_v6/PIN_METIN_234.csv --plan _work/plan/PIN_V6_PLAN_YAYIN.csv --panolar data/sosyal/pinterest/v6_plan/PANOLAR_HAM.json"
          else BETIK="scripts/sosyal/analiz/pinterest.py _work/mc.json _out _work/onceki"; fi
          python3 $BETIK | python3 scripts/guvenlik/sir_koru.py tee --sir-json _work/mc.json --sir-json _work/kimlik.json "$GITHUB_STEP_SUMMARY"
          rc=${PIPESTATUS[0]}
          mkdir -p _work/engel
          find _out -type f | while read -r f; do
            python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/mc.json --sir-json _work/kimlik.json "$f" >/dev/null 2>&1 \
              || { echo "TARAMA GECMEDI (Drive'a gitmez): $(basename "$f")"; mv "$f" _work/engel/; }
          done
          python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/mc.json --sir-json _work/kimlik.json _out || exit 1
          rclone copy _out "$O" -q
          rclone lsl "$O" | python3 scripts/guvenlik/sir_koru.py tee --sir-json _work/mc.json "$GITHUB_STEP_SUMMARY"
          exit $rc
      - if: always()
        run: |
          rm -rf _work ~/.config/rclone
          if [ -f "$RUNNER_TEMP/SIR_ENGEL" ]; then echo "::error::sir iceren satir engellendi (sir_koru)"; exit 1; fi

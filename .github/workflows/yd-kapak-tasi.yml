name: yd-kapak-tasi
# YD (1st Anniversary) 10'lu galeri: Canva disa aktarim linklerinden Drive'a TASIMA (plan v3 adim 2; Serdar / Merkez 27 Eki). Etsy'ye dokunmaz.
# Poster galeri tasima is akisinin kopyasi; farklar: --urun yd (<CIFT>_Y01..Y10 + ORTAK_Y04, hepsi 3000x2250, 703 beklenen; Merkez 27 Eki karar d / e),
# METIN_KAPI.tsv kapisi, satir basina link suresi (5 dk alti SURE_AZ) + imza tekrari DUR (IMZA.csv, ham imza yok), AYRI kilit grubu
# yd-kapak (bekleme 15 dk; poster tasimasini beklemez). Girdi: Drive TSV (cift, kart_no 1..10, design_id, url) + METIN_KAPI.tsv, dosya id
# ile; imzali URL maskelenir, loga yazilmaz. Cikti: Drive TEMP/YD_KAPAK_V1/<damga>/<CIFT>_Y<NN>.jpg + ORTAK_Y04 + OZET.md + MANIFEST.csv + IMZA.csv.
# hedef_damga doluysa mevcut klasore eklenir (gruplar); mevcut dosyalar yalniz okunur (yeni dosyalar --immutable). scripts/kapak78/galeri_tasi.py
permissions:
  actions: read
  contents: read
on:
  workflow_dispatch:
    inputs:
      tsv_id: {description: "Drive dosya id (TSV: cift, kart_no 1..10, design_id, url)", required: true}
      metin_kapi_id: {description: "Drive dosya id (METIN_KAPI.tsv: cift, design_id, baslik, satir_metni, durum)", required: true}
      hedef_damga: {description: "bos = yeni klasor; dolu (YYYYMMDD_HHMMSS) = mevcut klasore ekle", required: false, default: ""}
jobs:
  tasi:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Girdi kapisi
        env: {TSV_ID: "${{ inputs.tsv_id }}", MK_ID: "${{ inputs.metin_kapi_id }}", HD: "${{ inputs.hedef_damga }}"}
        run: '[[ "$TSV_ID" =~ ^[A-Za-z0-9_-]{20,80}$ && "$MK_ID" =~ ^[A-Za-z0-9_-]{20,80}$ && "$HD" =~ ^([0-9]{8}_[0-9]{6})?$ ]] || { echo "::error::girdi"; exit 1; }'
      - uses: actions/checkout@v4
      - name: Sira kilidi (iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py --grup yd-kapak --zaman-asimi-dk 15
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q pillow==11.0.0
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || { sudo apt-get install -y -qq rclone >/dev/null; }
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: TSV + METIN_KAPI + mevcut klasor (Drive)
        env: {TSV_ID: "${{ inputs.tsv_id }}", MK_ID: "${{ inputs.metin_kapi_id }}", HD: "${{ inputs.hedef_damga }}"}
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _mevcut _yeni
          rclone backend copyid gdrive: "$TSV_ID" _work/girdi.tsv -q
          rclone backend copyid gdrive: "$MK_ID" _work/METIN_KAPI.tsv -q
          echo "TSV satir: $(grep -c . _work/girdi.tsv) | METIN_KAPI satir: $(grep -c . _work/METIN_KAPI.tsv)"
          if [ -n "$HD" ]; then
            K="gdrive:ASTROLOVE/TEMP/YD_KAPAK_V1/$HD"
            rclone lsjson "$K" --max-depth 1 >/dev/null || { echo "::error::hedef klasor yok ya da okunamadi: YD_KAPAK_V1/$HD"; exit 1; }
            rclone copy "$K" _mevcut --include "*_Y[0-9][0-9].jpg" --include "MANIFEST.csv" --include "IMZA.csv" --max-depth 1 --transfers 8 -q
            echo "mevcut: $(ls _mevcut/*.jpg 2>/dev/null | wc -l) jpg"
            echo "DAMGA=$HD" >> "$GITHUB_ENV"
          else
            echo "DAMGA=$(date -u +%Y%m%d_%H%M%S)" >> "$GITHUB_ENV"
          fi
      - name: Indir + kontrol
        run: python3 scripts/kapak78/galeri_tasi.py --urun yd --tsv _work/girdi.tsv --metin-kapi _work/METIN_KAPI.tsv --klasor _mevcut --yeni _yeni --ciftler data/pod/yd78_ids.csv
      - name: Drive'a yaz
        if: ${{ always() }}
        run: |
          set -euo pipefail
          K="gdrive:ASTROLOVE/TEMP/YD_KAPAK_V1/${DAMGA:?}"
          if ls _yeni/*.jpg >/dev/null 2>&1; then
            rclone copy _yeni "$K" --include "*.jpg" --max-depth 1 --immutable --transfers 8 -q
          fi
          for f in OZET.md MANIFEST.csv IMZA.csv; do [ -f "_yeni/$f" ] && rclone copyto "_yeni/$f" "$K/$f" -q; done
          echo "Cikti: TEMP/YD_KAPAK_V1/${DAMGA} (yeni jpg: $(ls _yeni/*.jpg 2>/dev/null | wc -l))"
          [ -f _yeni/OZET.md ] && head -40 _yeni/OZET.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        run: rm -rf _work _mevcut _yeni ~/.config/rclone

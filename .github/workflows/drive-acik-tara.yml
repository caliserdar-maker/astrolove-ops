name: drive-acik-tara
# SALT OKUMA (Serdar 21 Eki not 1a): herkese acik Drive ogelerinden adinda SIPARIS/ISIM/TESLIM gecenlerin icerigi (OCR/pdf/metin)
# cikarilir, yalniz Drive TEMP/DENETIM_20261021/ACIK_ICERIK_<run_id>/ICERIK.json'a (sahip-yalniz) yazilir. Izin degistirmez.
# Musteri deseni eslestirmesi bu depoda YAPILMAZ (desen listesi depoya girmez); denetim oturumu yerelde yapar.
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      liste_yolu: {description: "DENETIM_20261021 altindaki PAYLASIM_ONCE.json yolu", required: true, default: "PAYLASIM_39653869755/PAYLASIM_ONCE.json"}
jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/guvenlik
      - name: Araclar
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq tesseract-ocr poppler-utils >/dev/null
          curl -fsSL -o /tmp/rc.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q -j /tmp/rc.zip '*/rclone' -d /tmp/rcb && sudo install -m 755 /tmp/rcb/rclone /usr/local/bin/rclone
      - name: Icerik cikar
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          LISTE: ${{ inputs.liste_yolu }}
        run: |
          set -euo pipefail
          [[ "$LISTE" =~ ^PAYLASIM_[0-9]+/PAYLASIM_ONCE\.json$ ]] || { echo "HATA: liste yolu"; exit 1; }
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          rclone copyto "gdrive:ASTROLOVE/TEMP/DENETIM_20261021/$LISTE" /tmp/liste.json
          python3 -I scripts/guvenlik/drive_acik_icerik.py --liste /tmp/liste.json --cikti /tmp/acik
          rclone copy /tmp/acik "gdrive:ASTROLOVE/TEMP/DENETIM_20261021/ACIK_ICERIK_${GITHUB_RUN_ID}" --error-on-no-transfer
          echo "Cikti: DENETIM_20261021/ACIK_ICERIK_${GITHUB_RUN_ID}/ICERIK.json"
      - if: always()
        run: rm -rf ~/.config/rclone /tmp/acik /tmp/liste.json

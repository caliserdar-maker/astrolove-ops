name: pin-media-sync

# Drive ASTROLOVE/TEMP/SOSYAL/PINTEREST/MEDYA/ altindaki pin medyasini astrolove-media reposuna
# (GitHub Pages) pinterest/ altina AYNI goreli yolla tasir. Metricool medyayi yalniz herkese acik
# dogrudan URL'den ceker: https://caliserdar-maker.github.io/astrolove-media/pinterest/<goreli yol>
# Yalniz .jpg .jpeg .png .mp4. Silme yapmaz. Etsy YOK. Kalip: ig-media-sync.yml.
# '_' ya da '.' ile baslayan klasor/dosya adlari REDDEDILIR: astrolove-media Jekyll ile derleniyor (.nojekyll yok),
# bu adlar yayina girmez (1 Eki olcumu: pinterest/_test/TEST_PIN.jpg repoda var, Pages 404).

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      dosyalar:
        description: "MEDYA/ altina goreli dosya listesi, virgullu (or. _test/TEST_PIN.jpg,CANCER_LIBRA/PIN_T1_KAPAK.jpg)"
        required: false
        default: ""
      klasor:
        description: "MEDYA/ altina goreli klasor (or. CANCER_LIBRA). dosyalar doluysa yok sayilir; ikisi de bossa DUR"
        required: false
        default: ""
      dry_run:
        description: "Yalniz goster; repoya push etme"
        type: boolean
        default: true

concurrency:
  group: pin-media-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Girdi denetimi
        env:
          DOSYALAR: ${{ inputs.dosyalar }}
          KLASOR: ${{ inputs.klasor }}
        run: |
          set -euo pipefail
          if [ -z "${DOSYALAR// /}" ] && [ -z "${KLASOR// /}" ]; then
            echo "DUR: dosyalar ya da klasor gerekli (hepsini tasima secenegi yok)." >&2; exit 1
          fi
          for p in ${DOSYALAR//,/ } $KLASOR; do
            case "$p" in
              /*|*..*|*\\*) echo "DUR: gecersiz yol: $p" >&2; exit 1 ;;
              _*|*/_*|.*|*/.*) echo "DUR: '_' ya da '.' ile baslayan yol bileseni Pages'te yayinlanmaz (Jekyll): $p" >&2; exit 1 ;;
            esac
          done
          for p in ${DOSYALAR//,/ }; do
            case "${p,,}" in
              *.jpg|*.jpeg|*.png|*.mp4) ;;
              *) echo "DUR: izinsiz tur (yalniz jpg/jpeg/png/mp4): $p" >&2; exit 1 ;;
            esac
          done

      - name: Medya reposunu al
        uses: actions/checkout@v4
        with:
          repository: caliserdar-maker/astrolove-media
          token: ${{ secrets.OPS_ADMIN_TOKEN }}
          path: media

      - name: rclone kur
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          rclone version | head -1

      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONF_B64:-}" ]; then
            echo "HATA: RCLONE_CONF_B64 secret'i tanimli degil." >&2
            exit 1
          fi
          mkdir -p ~/.config/rclone
          umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi

      - name: Drive -> pinterest/
        env:
          DOSYALAR: ${{ inputs.dosyalar }}
          KLASOR: ${{ inputs.klasor }}
        run: |
          set -euo pipefail
          KAYNAK="gdrive:ASTROLOVE/TEMP/SOSYAL/PINTEREST/MEDYA"
          mkdir -p media/pinterest
          tur=(--include "*.jpg" --include "*.jpeg" --include "*.png" --include "*.mp4")
          if [ -n "${DOSYALAR// /}" ]; then
            : > liste.txt
            for p in ${DOSYALAR//,/ }; do echo "$p" >> liste.txt; done
            n_ist=$(wc -l < liste.txt)
            rclone copy "$KAYNAK" media/pinterest --files-from liste.txt --stats-one-line -v 2>&1 | tail -3
            eksik=0
            while read -r p; do [ -f "media/pinterest/$p" ] || { echo "EKSIK: $p"; eksik=1; }; done < liste.txt
            [ $eksik -eq 0 ] || { echo "DUR: istenen dosya Drive'da yok ya da turu izinsiz" >&2; exit 1; }
            echo "istenen $n_ist dosya alindi"
          else
            rclone copy "$KAYNAK/$KLASOR" "media/pinterest/$KLASOR" "${tur[@]}" --stats-one-line -v 2>&1 | tail -3
          fi

      - name: Degisiklikleri gor
        id: diff
        working-directory: media
        run: |
          set -euo pipefail
          git add -A pinterest
          n=$(git diff --cached --name-only | wc -l)
          echo "changed=$n" >> "$GITHUB_OUTPUT"
          echo "degisen dosya: $n"
          git diff --cached --stat | tail -5
          echo "### pin-media-sync (degisen: $n)" >> "$GITHUB_STEP_SUMMARY"
          git diff --cached --name-only | sed 's#^#- https://caliserdar-maker.github.io/astrolove-media/#' >> "$GITHUB_STEP_SUMMARY"

      - name: Push
        if: ${{ inputs.dry_run != true && steps.diff.outputs.changed != '0' }}
        working-directory: media
        run: |
          set -euo pipefail
          git config user.name "astrolove-ops"
          git config user.email "actions@users.noreply.github.com"
          git commit -qm "pinterest: pin medyasi senkron ($(date -u +%Y-%m-%d))"
          git push
          echo "push edildi: $(git rev-parse --short HEAD)"

      - name: Dry-run notu
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "dry-run, push edilmedi"

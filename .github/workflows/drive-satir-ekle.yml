name: drive-satir-ekle

# Drive'daki bir .md dosyasina satir ekler (oturumlar arasi durum notu; varsayilan TEMP/OTURUM_NOTLARI.md).
# TEMP/YAYIN_DURUM.md hedefi REDDEDILIR (26 Eki, Serdar onayi): yayin-durum.yml o dosyayi her gun bastan uretir, notlar silinir.
# Satir, dosyadaki "## " ile baslayan ilk basliktan ONCE (gunluk bolumunun sonu) eklenir; baslik yoksa sona.
# Yalniz TEMP/ altindaki .md dosyalari. Etsy YOK.

on:
  workflow_dispatch:
    inputs:
      dosya: {description: "ASTROLOVE/ altina gore yol (TEMP/....md)", required: true, default: "TEMP/OTURUM_NOTLARI.md"}
      satir: {description: "eklenecek satir (tek satir)", required: true}

permissions:
  actions: read
  contents: read

# Sira (26 Eki, Serdar onayi): GitHub concurrency grubu bekleyen ara kosuyu iptal ediyordu; yerine sira kilidi (iptal yok).

jobs:
  ekle:
    runs-on: ubuntu-latest
    timeout-minutes: 30          # sira kilidi bekleme dahil (26 Eki; eski 10 dk, concurrency kuyrugu sure saymiyordu)
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/etsy
            scripts/ops
            .github/workflows
      - name: Sira kilidi (iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py --grup drive-satir-ekle --zaman-asimi-dk 25
      - run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Satir ekle
        env:
          DOSYA: ${{ inputs.dosya }}
          SATIR: ${{ inputs.satir }}
        run: |
          set -euo pipefail
          [[ "$DOSYA" =~ ^TEMP/[A-Za-z0-9_./-]+\.md$ && "$DOSYA" != *..* ]] || { echo "::error::yalniz TEMP/*.md"; exit 1; }
          if [ "$(printf '%s' "$DOSYA" | sed 's#//*#/#g; s#/\./#/#g')" = "TEMP/YAYIN_DURUM.md" ]; then
            echo "::error::TEMP/YAYIN_DURUM.md hedeflenemez: yayin-durum her gun bu dosyayi yeniden uretir (eklenen not silinir). TEMP/OTURUM_NOTLARI.md kullanin."; exit 1
          fi
          # Dosya kapisi (26 Eki): okuma hatasinda bos dosyayla devam YOK (eski bos varsayilan tum belgeyi tek satira indirebiliyordu).
          # Dosya Drive'da hic yoksa (ilk kayit) olusturma serbest. scripts/ops/durum_dosyasi.py (tur md: yalniz satir ekleme)
          python3 scripts/ops/durum_dosyasi.py oku --uzak "gdrive:ASTROLOVE/$DOSYA" --yerel _d.md --durum _durum_md --tur md --ilk-kayit-izni
          python3 - <<'EOF'
          import os
          s = open('_d.md', encoding='utf-8').read().split('\n')
          s = [] if s == [''] else s          # ilk kayit (bos dosya): basa bos satir eklenmesin
          satir = os.environ['SATIR'].replace('\n', ' ').strip()
          i = next((k for k, x in enumerate(s) if x.startswith('## ')), None)
          if i is None:
              while s and not s[-1].strip():          # sondaki bos satirlar: notlar arasinda bos satir olmasin
                  s.pop()
              s = [x for x in s] + [satir]
          else:
              j = i
              while j > 0 and not s[j - 1].strip():
                  j -= 1
              s = s[:j] + [satir] + s[j:]
          open('_d.md', 'w', encoding='utf-8').write('\n'.join(s).rstrip('\n') + '\n')
          EOF
          python3 scripts/ops/durum_dosyasi.py yaz --uzak "gdrive:ASTROLOVE/$DOSYA" --yerel _d.md --durum _durum_md --tur md --ilk-kayit-izni
          grep -c '' _d.md | xargs echo "satir sayisi:"
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone _d.md

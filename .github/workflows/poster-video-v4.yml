name: poster-video-v4
# Poster ilan videosu v4 ORNEK (19 Eki 2026, Serdar): yayindaki kupa ilani 4598525642 (Orchard Cancer & Libra) videosunun
# birebir aynisi, tek fark sahne = poster kapagi. Etsy'ye ve Metricool'a YAZMA YOK.
# 1) Etsy SALT OKUMA: scripts/etsy/kupa_video_indir.py (getListingVideos; en fazla 2 cagri, kota tabani 10) + CDN'den video.
# 2) Kanit: kupa-orchard kupa_orchard/kod/cift.py (Cancer Libra Emily James) yeniden uretilir; ciktisindaki video6b videosu
#    canli dosyayla kare kare karsilastirilir. Toz kapali kopyalar yalniz QC icin (murekkep olusumu).
# 3) sosyal/poster_video/poster_video_v4.py (murekkep rengi = varsayilan, yesil = kupa sabitleri) + v4_karsilastir.py.
# Cikti: Drive ASTROLOVE/TEMP/POSTER_VIDEO_ORNEK_20261019/V4/.
permissions:
  actions: read
  contents: write   # yalniz poster-video-onizleme dalina kucuk onizleme
on:
  workflow_dispatch:
    inputs:
      kapak:
        description: 'KAPAK/ altindaki kapak dosyasi'
        default: 4570143815_CANCER_LIBRA.jpg
jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      O: gdrive:ASTROLOVE/TEMP/POSTER_VIDEO_ORNEK_20261019/V4
      K: gdrive:ASTROLOVE/TEMP/KAPAK_P2_78_20261019/KAPAK
      KAPAK: ${{ inputs.kapak }}
      KUPA_ILAN: "4598525642"
    steps:
    - uses: actions/checkout@v4
    - name: Etsy kilidi (sira bekle, iptal yok)
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/etsy/kilit_bekle.py
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Kurulum
      run: |
        set -euo pipefail
        pip install -q numpy==2.1.3 pillow==11.0.0 scipy==1.14.1 opencv-python-headless==4.10.0.84 requests==2.34.2
        sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg fonts-dejavu-core >/dev/null
        curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
    - name: rclone.conf
      env:
        RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      run: |
        set -euo pipefail
        mkdir -p ~/.config/rclone; umask 077
        printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
        if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "::add-mask::$GOOGLE_CLIENT_SECRET"
          grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true; fi
    - name: Canli kupa videosu (Etsy SALT OKUMA)
      env:
        ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
        ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
        TOKEN_FILE: _work/ETSY_TOKEN.json
      run: |
        set -euo pipefail
        umask 077; mkdir -p _work _o
        rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
        python3 scripts/etsy/kupa_video_indir.py "$KUPA_ILAN" _o | cut -c1-2000
    - name: Token geri yaz
      if: ${{ always() }}
      run: |
        [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "token geri yazildi" || true
        rm -f _work/ETSY_TOKEN.json _work/ETSY_TOKEN.json.updated
    - name: Kupa yeniden uretim (kanit) + poster v4 + QC
      run: |
        set +e -uo pipefail   # QC FAIL olsa da ciktilar Drive'a gitsin
        case "$KAPAK" in *[!A-Za-z0-9_.]*|'') echo "::error::kapak adi gecersiz"; exit 1 ;; esac
        mkdir -p _w/k
        git fetch -q origin kupa-orchard && git archive origin/kupa-orchard kupa_orchard | tar -x -C _w/k
        bash _w/k/kupa_orchard/kod/sembol_al.sh CANCER_LIBRA _w/sem
        T0=$(date +%s)
        (cd _w/k/kupa_orchard && python3 -I kod/cift.py Cancer Libra Emily James "My favorite place is with you" ../../sem ../../kupa) > _w/cift.log 2>&1; CR=$?
        tail -3 _w/cift.log; echo "::warning::KUPA YENIDEN URETIM rc=$CR $(( $(date +%s) - T0 )) sn"
        VD=_w/kupa/video
        sed 's/a3 = np.clip(al, 0, 0.9)\[..., None\]/a3 = np.clip(al, 0, 0.9)[..., None] * 0/' _w/k/kupa_orchard/kod/video6b.py > _w/video6b_tozsuz.py
        python3 -I _w/video6b_tozsuz.py "$VD/" _w/kupa/galeri/01_Orange_Blossom_kapak.jpg _w/kupa_tozsuz.mp4 | tail -1
        rclone copyto "$K/$KAPAK" _w/kapak.jpg -q || { echo "::error::kapak yok"; exit 1; }
        V4=_o/CANCER_LIBRA_ilan_video_v4.mp4; VY=_w/CANCER_LIBRA_ilan_video_v4_yesil.mp4
        python3 -I sosyal/poster_video/poster_video_v4.py _w/kapak.jpg "$V4" murekkep | grep -v '  kare'
        python3 -I sosyal/poster_video/poster_video_v4.py _w/kapak.jpg "$VY" yesil | grep -v '  kare'
        TOZSUZ=1 python3 -I sosyal/poster_video/poster_video_v4.py _w/kapak.jpg _w/v4_tozsuz.mp4 | tail -1
        python3 -I sosyal/poster_video/v4_karsilastir.py _o/CANLI_KUPA_VIDEO.mp4 "$V4" _w/kapak.jpg _o "$VD" _w/kupa_tozsuz.mp4 _w/v4_tozsuz.mp4 | tee _w/qc.txt; QC=${PIPESTATUS[0]}
        mkdir -p _w/qy; python3 -I sosyal/poster_video/v4_karsilastir.py _o/CANLI_KUPA_VIDEO.mp4 "$VY" _w/kapak.jpg _w/qy "$VD" _w/kupa_tozsuz.mp4 _w/v4_tozsuz.mp4 > _w/qy.txt; QY=$?
        cp _w/qy/QC.json _o/QC_yesil.json; cp _w/qy/KARSILASTIRMA_KONTAK.jpg _o/KARSILASTIRMA_KONTAK_yesil.jpg; mv "$VY" _o/
        rm -f _o/*.sembol_maske.png
        grep -E '^\{|SONUC|CANLI|V4' _w/qc.txt | sed 's/^/::warning::QC /' | cut -c1-3000; echo "::warning::QC_YESIL rc=$QY $(tail -1 _w/qy.txt)"
        rclone copy _o "$O" -q
        echo "::warning::DRIVE $(rclone lsf "$O" | tr '\n' ' ')"
        mkdir -p _pv; cp _o/KARSILASTIRMA_KONTAK*.jpg _o/QC*.json _o/CANLI_KUPA_VIDEO.json _pv/ 2>/dev/null
        echo "RC=$(( QC + CR ))" >> "$GITHUB_ENV"
    - name: Onizleme dali
      if: ${{ always() }}
      run: |
        set +e -uo pipefail
        [ -n "$(ls -A _pv 2>/dev/null)" ] || exit 0
        B=poster-video-onizleme; PV=ornek_v4
        git config user.name "github-actions"; git config user.email "actions@github.com"
        for i in 1 2 3; do
          rm -rf _pvw; git worktree prune
          git fetch -q origin $B 2>/dev/null && git worktree add -q _pvw origin/$B 2>/dev/null || { git worktree add -q --detach _pvw; (cd _pvw && git checkout -q --orphan tmp && git rm -rqf . ); }
          rm -rf "_pvw/$PV"; mkdir -p "_pvw/$PV"; cp _pv/* "_pvw/$PV/"
          (cd _pvw && git add -A && git commit -qm "poster video v4 onizleme (kosu ${{ github.run_id }})" && git push -q origin HEAD:refs/heads/$B) && { echo "::warning::ONIZLEME $B/$PV"; break; }
          sleep 5
        done
    - name: Sonuc
      if: ${{ always() }}
      run: |
        rm -rf _work _w ~/.config/rclone
        [ "${RC:-1}" = "0" ]

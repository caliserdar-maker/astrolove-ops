name: wp-mockup-canva

# CANVA SAAT DOSYALARI + 2 PX MASKE EROZYONU ILE TAM MOCKUP - 4 Eyl 2026.
# Watch wallpaper'i Canva'dan disa aktarilan temiz dosyadan alinir (Python
# plaka/glow zinciri DEVRE DISI); diger cihazlar FINAL_V2'den gelir.
# FINAL_V2, MOCKUP_V2, DELIVERY ve ZIP'ler DEGISMEZ; cikti TEMP altina yazilir.
# Etsy'ye dokunulmaz.

on:
  workflow_dispatch:
    inputs:
      watch_urls:
        description: "Satir basina: <Cift>|<Edisyon>|<indirme URL>"
        required: true
      pairs:
        description: "Ciftler (virgul)"
        required: true
        default: "Aries_Aries,Leo_Pisces"
      scenes:
        description: "Sahneler"
        required: true
        default: "SET01,SET03,SET04,SET06,SET07,SET10Y"
      erode:
        description: "Maske erozyonu (px)"
        required: true
        default: "2"

concurrency:
  group: wp-mockup-canva
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null

      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi

      - name: Girdiler (calib, masterlar, pilot, FINAL_V2)
        run: |
          set -euo pipefail
          mkdir -p _work/calib _work/masters _work/pilot _work/wpold _work/canva _work/wpmix _work/out
          rclone copy "gdrive:ASTROLOVE/WALLPAPER/MOCKUP_V2/_CALIB" _work/calib \
            --include "calib.json" --include "masks/*.png"
          rclone copy "gdrive:ASTROLOVE/WALLPAPER/MOCKUP_V2/CANCER_LIBRA" _work/masters --include "*_FINAL.jpg"
          rclone copy "gdrive:ASTROLOVE/ARCHIVE/FINAL_V2_PILOT_V1" _work/pilot --include "AstroLove_*.jpg"
          test "$(ls _work/pilot | wc -l)" = "16"
          IFS=',' read -ra PS <<< "${{ inputs.pairs }}"
          for P in "${PS[@]}"; do
            UP=$(echo "$P" | tr '[:lower:]' '[:upper:]')
            mkdir -p "_work/wpold/$UP"
            rclone copy "gdrive:ASTROLOVE/WALLPAPER/FINAL_V2/$UP" "_work/wpold/$UP" --include "AstroLove_*.jpg"
            test "$(ls _work/wpold/$UP | wc -l)" = "16"
          done

      - name: Canva sayfalarini indir
        env:
          WATCH_URLS: ${{ inputs.watch_urls }}
        run: |
          set -euo pipefail
          n=0
          while IFS='|' read -r P ED URL; do
            [ -z "${P:-}" ] && continue
            curl -fsSL "$URL" -o "_work/canva/${P}__${ED}.png"
            n=$((n+1))
          done <<< "$WATCH_URLS"
          echo "indirilen: $n"
          ls -l _work/canva
          python3 - <<'PY'
          import glob
          from PIL import Image
          for f in sorted(glob.glob("_work/canva/*.png")):
              im = Image.open(f)
              print(f, im.size, im.mode)
          PY

      - name: Dogrula (cift eslesmesi + edisyon) ve yerine koy
        run: |
          set -euo pipefail
          IFS=',' read -ra PS <<< "${{ inputs.pairs }}"
          for P in "${PS[@]}"; do
            UP=$(echo "$P" | tr '[:lower:]' '[:upper:]')
            mkdir -p "_work/wpmix/$UP"
            cp "_work/wpold/$UP"/AstroLove_*.jpg "_work/wpmix/$UP/"
          done
          python scripts/etsy/wp_watch_swap.py --src _work/canva --wp-old _work/wpold \
            --out _work/wpmix --report _work/WP_WATCH_SWAP.csv | tee _work/rapor.txt
          for P in "${PS[@]}"; do
            UP=$(echo "$P" | tr '[:lower:]' '[:upper:]')
            ls -l "_work/wpmix/$UP"/AstroLove_*_Watch.jpg
          done

      - name: Render (6 sahne, maske ${{ inputs.erode }} px iceri, SET07 paste)
        run: |
          set -euo pipefail
          IFS=',' read -ra PS <<< "${{ inputs.pairs }}"
          for P in "${PS[@]}"; do
            UP=$(echo "$P" | tr '[:lower:]' '[:upper:]')
            python scripts/etsy/wp_mockup_render.py --calib _work/calib --masters _work/masters \
              --pilot _work/pilot --wallpapers "_work/wpmix/$UP" --pair "$P" \
              --scenes "${{ inputs.scenes }}" --erode-mask "${{ inputs.erode }}" --no-relight \
              --out _work/out | tee -a _work/rapor.txt
          done
          find _work/out -maxdepth 1 -name "*.jpg" -exec ls -l {} \;

      - name: Drive'a yaz (TEMP; uretim klasorleri degismez)
        if: ${{ always() }}
        run: |
          set -euo pipefail
          [ -d _work/out ] && rclone copy _work/out "gdrive:ASTROLOVE/TEMP/FIX_TEST/MOCKUP_CANVA" --include "*.jpg" || true
          [ -d _work/wpmix ] && rclone copy _work/wpmix "gdrive:ASTROLOVE/TEMP/FIX_TEST/WATCH_CANVA" --include "*/AstroLove_*_Watch.jpg" || true
          [ -f _work/WP_WATCH_SWAP.csv ] && rclone copyto _work/WP_WATCH_SWAP.csv "gdrive:ASTROLOVE/TEMP/WP_WATCH_SWAP.csv" || true
          [ -f _work/rapor.txt ] && rclone copyto _work/rapor.txt "gdrive:ASTROLOVE/TEMP/WP_MOCKUP_CANVA.txt" || true
          rclone lsl "gdrive:ASTROLOVE/TEMP/FIX_TEST/MOCKUP_CANVA" || true

      - name: anyone:reader + linkler
        if: ${{ always() }}
        run: |
          set -euo pipefail
          cat > _fid.py <<'PY'
          import json, sys
          print([r["ID"] for r in json.load(sys.stdin) if r["Name"] == sys.argv[1]][0])
          PY
          fid="$(rclone lsjson "gdrive:ASTROLOVE/TEMP/FIX_TEST" --dirs-only | python3 _fid.py MOCKUP_CANVA)"
          python scripts/pinterest/pin_media_perms.py --mode grant --folder-id "$fid" \
            --pattern "WA_MOCKUP_V2_" --apply

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: wp-mockup-canva
          path: |
            _work/WP_WATCH_SWAP.csv
            _work/rapor.txt
          if-no-files-found: ignore

      - name: Temizlik
        if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone _fid.py

name: etsy-arama-kaynak

# Resmi Etsy kaynak sayfalarini metin olarak Drive'a indirir (Etsy API YOK, yazma YOK).
# etsy-arama oturumu (10 Eki 2026). Cikti: Drive ASTROLOVE/TEMP/ETSY_ARAMA_20261010/kaynak/

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [claude/keen-curie-2hza60]
    paths:
      - config/etsy_arama_kaynak.trigger

jobs:
  indir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: rclone kur + conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Indir
        run: python3 scripts/etsy/arama_kaynak.py _out 2>&1 | python3 scripts/guvenlik/log_suz.py | tee _out_log.txt
      - name: Drive'a
        if: always()
        run: |
          set -euo pipefail
          mkdir -p _out; cp _out_log.txt _out/kosu_log.txt 2>/dev/null || true
          rclone copy _out "gdrive:ASTROLOVE/TEMP/ETSY_ARAMA_20261010/kaynak" -q
      - if: always()
        run: rm -rf ~/.config/rclone

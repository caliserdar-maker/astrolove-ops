name: yd-envanter-oku
# SALT OKUMA (Etsy'ye yazma YOK; Merkez 26 Eki YD): YD ilanlari gorsel / stil / foto bagi / video / kisisellestirme envanteri.
# Ilan listesi Drive TEMP/BY78_TASLAK_20261014/BY78_TASLAKLAR.csv (by78-denetim ile ayni). Cikti: Drive TEMP/<cikti>/ (YD2 gece 1 Kas:
# varsayilan YD_ENVANTER_<UTC damga>, YENI klasor, --immutable; klasor varsa DUR. Eski YD_ENVANTER_20261026 = 1. asama ONCESI yedek, yazilmaz).
permissions:
  actions: read
  contents: read
on:
  workflow_dispatch:
    inputs:
      pilot: {description: "pilot listing_id", required: false, default: "4595350971"}
      yalniz_pilot: {description: "1 = yalniz pilot oku; FARKLI Drive'daki YD_OZET.csv'den yeniden", required: false, default: "0"}
      cikti: {description: "TEMP altinda YENI klasor adi (bos = YD_ENVANTER_<UTC damga>); var olan klasore yazilmaz", required: false, default: ""}
jobs:
  oku:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Girdi kapisi
        env: {PILOT: "${{ inputs.pilot }}", YALNIZ: "${{ inputs.yalniz_pilot }}", CK: "${{ inputs.cikti }}"}
        run: |
          [[ "$PILOT" =~ ^[0-9]+$ && "$YALNIZ" =~ ^[01]$ && "$CK" =~ ^([A-Za-z0-9_]+)?$ ]] || { echo "::error::girdi"; exit 1; }
          [ "$CK" != YD_ENVANTER_20261026 ] || { echo "::error::YD_ENVANTER_20261026 (1. asama oncesi yedek) yazilmaz"; exit 1; }
          echo "CIKTI=${CK:-YD_ENVANTER_$(date -u +%Y%m%d_%H%M%S)}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || { sudo apt-get install -y -qq rclone >/dev/null; }
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Token + ilan listesi
        env: {YALNIZ: "${{ inputs.yalniz_pilot }}"}
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
          rclone copyto "gdrive:ASTROLOVE/TEMP/BY78_TASLAK_20261014/BY78_TASLAKLAR.csv" _work/LISTE.csv
          if rclone lsf "gdrive:ASTROLOVE/TEMP/$CIKTI" --max-depth 1 2>/dev/null | grep -q .; then echo "::error::TEMP/$CIKTI dolu; yeni klasor adi ver"; exit 1; fi
          if [ "$YALNIZ" = "1" ]; then rclone copyto "gdrive:ASTROLOVE/TEMP/YD_ENVANTER_20261026/YD_OZET.csv" _work/OZET.csv; fi
      - name: Oku
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          PILOT: ${{ inputs.pilot }}
          YALNIZ: ${{ inputs.yalniz_pilot }}
        run: |
          if [ "$YALNIZ" = "1" ]; then
            python3 scripts/etsy/yd_envanter_oku.py --liste _work/LISTE.csv --pilot "$PILOT" --out _out --yalniz-pilot --ozet _work/OZET.csv
          else
            python3 scripts/etsy/yd_envanter_oku.py --liste _work/LISTE.csv --pilot "$PILOT" --out _out
          fi
      - name: Token geri yaz + cikti Drive'a
        if: ${{ always() }}
        run: |
          TOKEN_RC=0; OUT_RC=0; bash scripts/etsy/token_geri_yaz.sh || TOKEN_RC=1
          if ls _out/* >/dev/null 2>&1; then
            python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/ETSY_TOKEN.json _out || { echo "::error::ciktida sir"; exit 1; }
            rclone copy _out "gdrive:ASTROLOVE/TEMP/${CIKTI:?}" --immutable -q && echo "Cikti: $CIKTI (kosu ${GITHUB_RUN_ID})" | tee -a "$GITHUB_STEP_SUMMARY" || OUT_RC=1
          fi
          [ "$TOKEN_RC" = 0 ] && [ "$OUT_RC" = 0 ] || exit 1
      - if: always()
        run: rm -rf _work ~/.config/rclone

name: wp-quad-probe

# QUAD KONUMU DOGRU MU - SALT OLCUM - 5 Eyl 2026.
# Gercek ekran siniri sahne fotografindan (luminans gecisinden) bulunur,
# calib.json'daki quad ile karsilastirilir. calib.json'a DOKUNULMAZ; uretim
# yok. Cikti: TEMP/WP_QUAD_PROBE.csv + TEMP/AUDIT_CROPS/M13_* kanit panelleri.

on:
  workflow_dispatch:
    inputs:
      scenes:
        description: "Sahneler"
        required: true
        default: "SET01,SET03,SET04,SET06,SET07,SET10Y"
      kanit:
        description: "Kanit panelleri (SAHNE:EKRAN)"
        required: true
        default: "SET07:1,SET03:0"

concurrency:
  group: wp-quad-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null

      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi

      - name: Girdiler (calib + sahne masterlari)
        run: |
          set -euo pipefail
          mkdir -p _work/calib _work/masters _work/crops
          rclone copy "gdrive:ASTROLOVE/WALLPAPER/MOCKUP_V2/_CALIB" _work/calib --include "calib.json"
          rclone copy "gdrive:ASTROLOVE/WALLPAPER/MOCKUP_V2/CANCER_LIBRA" _work/masters --include "*_FINAL.jpg"
          ls -l _work/masters

      - name: Olcum
        run: |
          set -euo pipefail
          python scripts/etsy/wp_quad_probe.py --calib _work/calib --masters _work/masters \
            --scenes "${{ inputs.scenes }}" --kanit "${{ inputs.kanit }}" \
            --crop-dir _work/crops --out _work/WP_QUAD_PROBE.csv | tee _work/rapor.txt
          ls -l _work/crops

      - name: Drive'a yaz + anyone:reader
        if: ${{ always() }}
        run: |
          set -euo pipefail
          [ -f _work/WP_QUAD_PROBE.csv ] && rclone copyto _work/WP_QUAD_PROBE.csv "gdrive:ASTROLOVE/TEMP/WP_QUAD_PROBE.csv" || true
          [ -f _work/rapor.txt ] && rclone copyto _work/rapor.txt "gdrive:ASTROLOVE/TEMP/WP_QUAD_PROBE.txt" || true
          if [ -n "$(ls -A _work/crops 2>/dev/null)" ]; then
            rclone copy _work/crops "gdrive:ASTROLOVE/TEMP/AUDIT_CROPS" --include "M13_*.jpg"
            cat > _fid.py <<'PY'
          import json, sys
          print([r["ID"] for r in json.load(sys.stdin) if r["Name"] == sys.argv[1]][0])
          PY
            fid="$(rclone lsjson "gdrive:ASTROLOVE/TEMP" --dirs-only | python3 _fid.py AUDIT_CROPS)"
            python scripts/pinterest/pin_media_perms.py --mode grant --folder-id "$fid" \
              --pattern "M13_" --apply
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: wp-quad-probe
          path: |
            _work/WP_QUAD_PROBE.csv
            _work/rapor.txt
          if-no-files-found: ignore

      - name: Temizlik
        if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone _fid.py

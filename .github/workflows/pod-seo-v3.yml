name: pod-seo-v3

# POD SEO v3 (Serdar onayli baslik/aciklama/etiket, 27 Eyl 2026): 78 POD ilaninda YALNIZ secilen alanlar.
# Degisiklik dosyasi repo verisinden uretilir: scripts/etsy/seo/pod_seo_v3_build.py.
# Varsayilan KURU DENEME: Etsy'ye hicbir yazma cagrisi yok. Yazma yalniz
# apply=true VE confirm=CANLI ile acilir; betik ilk hatada DURUR.
# Cikti: Drive ASTROLOVE/TEMP/POD_SEO/<DRY|APPLY>_<UTC damga>/

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "true = Etsy'ye YAZ (ayrica confirm=CANLI gerekir)"
        type: boolean
        default: false
      confirm:
        description: "Yazma icin tam olarak: CANLI"
        required: false
        default: ""
      limit:
        description: "En fazla N ilan (0 = 78'in hepsi)"
        required: false
        default: "0"
      alanlar:
        description: "Yazilacak alanlar: title,tags ya da title,description,tags"
        required: false
        default: "title,tags"
      ids:
        description: "Yalniz bu ilanlar (virgullu id); bos = 78'in hepsi"
        required: false
        default: ""


permissions:
  actions: read
  contents: read

jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      APPLY: ${{ inputs.apply }}
      CONFIRM: ${{ inputs.confirm }}
      LIMIT: ${{ inputs.limit || '0' }}
      IDS: ${{ inputs.ids || '' }}
      ALANLAR: ${{ inputs.alanlar || 'title,tags' }}
    steps:
      - name: Onay kapisi
        run: |
          set -euo pipefail
          if [ "$APPLY" = "true" ] && [ "$CONFIRM" != "CANLI" ]; then
            echo "::error::apply=true icin confirm tam olarak 'CANLI' olmali (gelen: '$CONFIRM'). DUR."
            exit 1
          fi
          if [ "$APPLY" = "true" ]; then
            echo "::warning::APPLY: 78 POD ilaninda YALNIZ su alanlar degisecek: $ALANLAR"
            echo "MOD=APPLY" >> "$GITHUB_ENV"
          else
            echo "KURU DENEME: Etsy'ye hicbir yazma cagrisi yapilmayacak"
            echo "MOD=DRY" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Token + POD state + veri uretimi
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
          rclone copyto "gdrive:ASTROLOVE/TEMP/POD_LISTING/POD_LISTINGS_STATE.csv" _work/pod_state.csv
          echo "POD state satiri: $(( $(wc -l < _work/pod_state.csv) - 1 ))"
          python scripts/etsy/seo/pod_seo_v3_build.py --out _work/pod_changes_v3.json
      - name: POD SEO v3 (kuru deneme / apply)
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          set -euo pipefail
          args=(--changes _work/pod_changes_v3.json --pod-state _work/pod_state.csv \
                --out _out --limit "$LIMIT" --alanlar "$ALANLAR" --ids "$IDS")
          if [ "$APPLY" = "true" ]; then args+=(--apply --confirm "$CONFIRM"); fi
          python scripts/etsy/pod_seo_update.py "${args[@]}"
      - name: Token + cikti Drive'a
        if: ${{ always() }}
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y%m%d_%H%M)
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "Token geri yazildi" || true
          if grep -rqE 'x-api-key|refresh_token|"access_token"' _out/ 2>/dev/null; then
            echo "::error::ciktida sir benzeri anahtar bulundu, Drive'a yazilmadi"; exit 1
          fi
          hedef="gdrive:ASTROLOVE/TEMP/POD_SEO/V3_${MOD:-DRY}_${stamp}"
          [ -d _out ] && rclone copy _out "$hedef" -q && echo "Cikti: TEMP/POD_SEO/V3_${MOD:-DRY}_${stamp}/"
          rclone lsf "$hedef" | head -10
          echo "yedek dosyasi: $(rclone lsf "$hedef/backups" | wc -l)"
          if [ -f _out/report.md ]; then head -12 _out/report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        continue-on-error: true
        with:
          retention-days: 1
          name: pod-seo-v3
          path: _out/
          if-no-files-found: ignore
      - if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

name: wp-watch-ablation

# SET07 SAAT - KALAN HALENIN KAYNAGI (SALT OLCUM) - 4 Eyl 2026.
# Uretim yok, Drive'a yalniz olcum CSV/TXT yazilir; MOCKUP_V2 ve DELIVERY'ye
# dokunulmaz, Etsy'ye hic gidilmez.

on:
  workflow_dispatch:
    inputs:
      pair:
        description: "Tek cift"
        required: true
        default: "Leo_Pisces"

concurrency:
  group: wp-watch-ablation
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null

      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi

      - name: Girdiler (calib + maske, SET07 masteri, kaynak Watch MB)
        run: |
          set -euo pipefail
          P="${{ inputs.pair }}"; UP=$(echo "$P" | tr '[:lower:]' '[:upper:]')
          mkdir -p _work/calib _work/masters _work/wp
          rclone copy "gdrive:ASTROLOVE/WALLPAPER/MOCKUP_V2/_CALIB" _work/calib \
            --include "calib.json" --include "masks/*.png"
          rclone copyto "gdrive:ASTROLOVE/WALLPAPER/MOCKUP_V2/CANCER_LIBRA/WA_MOCKUP_V2_SET07_Cancer_Libra_FINAL.jpg" \
            _work/masters/WA_MOCKUP_V2_SET07_Cancer_Libra_FINAL.jpg
          rclone copyto "gdrive:ASTROLOVE/WALLPAPER/FINAL_V2/$UP/AstroLove_${P}_Midnight_Blue_Watch.jpg" \
            "_work/wp/AstroLove_${P}_Midnight_Blue_Watch.jpg"
          ls -l _work/masters _work/wp

      - name: Hale zinciri olcumu
        run: |
          set -euo pipefail
          P="${{ inputs.pair }}"
          python scripts/etsy/wp_watch_ablation.py \
            --calib _work/calib \
            --master _work/masters/WA_MOCKUP_V2_SET07_Cancer_Libra_FINAL.jpg \
            --wp "_work/wp/AstroLove_${P}_Midnight_Blue_Watch.jpg" \
            --pair "$P" --out _work/WP_SET07_ABLATION.csv | tee _work/rapor.txt

      - name: Sonuclari Drive'a yaz (yalniz olcum)
        if: ${{ always() }}
        run: |
          set -euo pipefail
          [ -f _work/WP_SET07_ABLATION.csv ] && rclone copyto _work/WP_SET07_ABLATION.csv "gdrive:ASTROLOVE/TEMP/WP_SET07_ABLATION.csv" || true
          [ -f _work/rapor.txt ] && rclone copyto _work/rapor.txt "gdrive:ASTROLOVE/TEMP/WP_SET07_ABLATION.txt" || true

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: wp-watch-ablation
          path: |
            _work/WP_SET07_ABLATION.csv
            _work/rapor.txt
          if-no-files-found: ignore

      - name: Temizlik
        if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

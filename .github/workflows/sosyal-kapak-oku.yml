name: sosyal-kapak-oku

# SALT OKUMA (Serdar onayi 15 Eki 2026): 5 platformda yayinlanmis videolarin kapagi nasil gorunuyor?
# Metricool'a / YouTube / Facebook / Instagram / TikTok / Threads'e YAZMA / SILME / DEGISTIRME YOK; yalniz GET.
# Platform basina son yayinlanan 1-2 video gonderisi: platformun kapak/onizleme gorseli (Metricool analytics gorsel
# alani, herkese acik sayfa og:image, TikTok oEmbed, i.ytimg.com) indirilir; parlaklik + bizim kapak / ilk kare /
# 8. sn karesi farki olculur (scripts/sosyal/sosyal_kapak_oku.py). Sonuc Drive TEMP/SOSYAL_KAPAK_<tarih>/.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      bas:
        default: "2026-10-12T00:00:00"
      adet:
        default: "2"

jobs:
  oku:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KD: gdrive:ASTROLOVE/TEMP/VIDEO_V9_20261012/KAPAK
      V: gdrive:ASTROLOVE/TEMP/VIDEO_V9_20261012/FINAL
    steps:
      - uses: actions/checkout@v4
      - name: Paketler
        run: |
          pip install -q numpy==2.1.3 pillow==11.0.0
          sudo apt-get install -y -qq ffmpeg >/dev/null
          echo "O=gdrive:ASTROLOVE/TEMP/SOSYAL_KAPAK_$(TZ=Europe/Istanbul date +%Y%m%d)" >> "$GITHUB_ENV"
      - name: rclone + token
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          mkdir -p ~/.config/rclone _work _out _w; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            export RCLONE_CONFIG_GDRIVE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET"
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
          rclone copyto "gdrive:ASTROLOVE/TEMP/METRICOOL_TOKEN.json" _work/mc.json
          python3 -c "import json;print('::add-mask::'+json.load(open('_work/mc.json'))['userToken'])"

      - name: Kapak okuma + olcum (yalniz GET)
        env:
          BAS: ${{ inputs.bas }}
          ADET: ${{ inputs.adet }}
        run: |
          set -uo pipefail
          python3 scripts/sosyal/sosyal_kapak_oku.py --token _work/mc.json --bas "$BAS" --adet "$ADET" --cikti _out --is _w 2>&1 \
            | python3 scripts/guvenlik/sir_koru.py tee --sir-json _work/mc.json "$GITHUB_STEP_SUMMARY" _out/OZET.txt
          rc=${PIPESTATUS[0]}
          python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/mc.json _out || exit 1   # sir varsa Drive'a yuklenmez
          rclone copy _out "$O" -q
          rclone lsl "$O" | python3 scripts/guvenlik/sir_koru.py tee --sir-json _work/mc.json "$GITHUB_STEP_SUMMARY"
          exit $rc

      - if: always()
        run: |
          rm -rf _work _w ~/.config/rclone
          if [ -f "$RUNNER_TEMP/SIR_ENGEL" ]; then echo "::error::sir iceren satir engellendi (sir_koru)"; exit 1; fi

name: wp-media

# GECE ZINCIRI asama e: 78 ilana medya yukler (6 galeri gorseli + 1 video +
# 5 dijital dosya). ETSY'YE YAZAR (dry_run=false). STATE degistirmez, yayin yok.
# Tek Etsy kosusu: concurrency etsy-token. Resume: TEMP/WP_UPLOAD_STATE.csv.

on:
  workflow_dispatch:
    inputs:
      pairs:
        description: "Cift alt kumesi (virgullu; bos = hepsi)"
        required: false
        default: ""
      limit:
        description: "En fazla ilan (0 = sinirsiz)"
        required: true
        default: "1"
      dry_run:
        description: "true = yalniz oku/raporla; false = ETSY'YE YAZ"
        type: boolean
        default: true
      no_video:
        description: "Videoyu atla (asama c hazir degilse true)"
        type: boolean
        default: true
      quota_stop:
        description: "Kalan kota bu degerin altina dusunce temiz cik"
        required: true
        default: "300"

concurrency:
  group: etsy-token
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null

      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi

      - name: Token, STATE ve medyayi al
        run: |
          set -euo pipefail
          umask 077
          mkdir -p _work/media/mock _work/media/zip _work/media/video
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
          rclone copyto "gdrive:ASTROLOVE/TEMP/WA_WP_DRAFTS_STATE.csv" _work/drafts.csv
          rclone copyto "gdrive:ASTROLOVE/TEMP/WP_UPLOAD_STATE.csv" _work/UPLOAD_STATE.csv || true
          rclone copyto "gdrive:ASTROLOVE/TEMP/HOW_TO_SET_YOUR_WALLPAPER.pdf" _work/media/HOW_TO_SET_YOUR_WALLPAPER.pdf
          # yalniz islenecek ciftlerin medyasi (kota ve disk icin)
          pairs="${{ inputs.pairs }}"
          if [ -z "$pairs" ]; then pairs=$(cut -d, -f1 _work/drafts.csv | sed '/^$/d' | paste -sd,); fi
          lim="${{ inputs.limit }}"
          echo "$pairs" | tr ',' '\n' | sed '/^$/d' > _work/want.txt
          if [ "$lim" != "0" ]; then head -n "$lim" _work/want.txt > _work/want2.txt; mv _work/want2.txt _work/want.txt; fi
          while read -r p; do
            up=$(echo "$p" | tr '[:lower:]' '[:upper:]')
            rclone copy "gdrive:ASTROLOVE/WALLPAPER/MOCKUP_V2/$up" "_work/media/mock/$up" --include "WA_MOCKUP_V2_*_FINAL.jpg" || true
            rclone copy "gdrive:ASTROLOVE/WALLPAPER/DELIVERY/$up" "_work/media/zip/$up" --include "*.zip" || true
            if [ "${{ inputs.no_video }}" != "true" ]; then
              rclone copy "gdrive:ASTROLOVE/WALLPAPER/VIDEO_V2/$up" "_work/media/video/$up" --include "WA_WP_VIDEO_*.mp4" || true
            fi
          done < _work/want.txt
          du -sh _work/media

      - name: Medya yukle
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          set -euo pipefail
          args=(--state _work/drafts.csv --media _work/media --out _work/UPLOAD_STATE.csv
                --limit "${{ inputs.limit }}" --quota-stop "${{ inputs.quota_stop }}")
          if [ -n "${{ inputs.pairs }}" ]; then args+=(--pairs "${{ inputs.pairs }}"); fi
          if [ "${{ inputs.no_video }}" = "true" ]; then args+=(--no-video); fi
          if [ "${{ inputs.dry_run }}" != "true" ]; then
            echo "::warning::APPLY modu: Etsy'ye medya yazilacak."
            args+=(--apply)
          fi
          python scripts/etsy/wp_media_upload.py "${args[@]}"

      - name: STATE ve token'i Drive'a geri yaz
        if: ${{ always() }}
        run: |
          set -euo pipefail
          [ -f _work/UPLOAD_STATE.csv ] && rclone copyto _work/UPLOAD_STATE.csv "gdrive:ASTROLOVE/TEMP/WP_UPLOAD_STATE.csv" || true
          if [ -f _work/ETSY_TOKEN.json.updated ]; then
            rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json"
            echo "Token Drive'a geri yazildi."
          else
            echo "Token yenilenmedi."
          fi

      - name: Son dogrulama (salt okur)
        if: ${{ always() }}
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          set -euo pipefail
          [ -f _work/ETSY_TOKEN.json ] || exit 0
          args=(--state _work/drafts.csv --out _work/VERIFY_ALL.csv --limit "${{ inputs.limit }}"
                --expect-video "${{ inputs.no_video == true && 'false' || 'true' }}")
          if [ -n "${{ inputs.pairs }}" ]; then args+=(--pairs "${{ inputs.pairs }}"); fi
          python scripts/etsy/wp_verify_all.py "${args[@]}" || echo "::warning::son dogrulamada FAIL var"
          rclone copyto _work/VERIFY_ALL.csv "gdrive:ASTROLOVE/TEMP/WP_VERIFY_ALL.csv" || true

      - name: Temizlik
        if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

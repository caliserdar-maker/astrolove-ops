name: cl-galeri-drive

# CL galeri inceleme paketini Drive'a kopyalar (salt Drive yazma; Etsy YOK).
# Kaynak: data/pod/cl_galeri_final19 (siralanmis 19 gorsel: 14 kart + 5 renk)
# Cikti: Drive ASTROLOVE/TEMP/CL_GALERI_FINAL19 + paylasim linki

permissions:
  contents: read

on:
  workflow_dispatch: {}

jobs:
  kopyala:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Drive'a yaz ve linki al
        run: |
          set -euo pipefail
          HEDEF="gdrive:ASTROLOVE/TEMP/CL_GALERI_FINAL19"
          rclone copy data/pod/cl_galeri_final19 "$HEDEF" -q
          echo "Dosya sayisi: $(rclone lsf "$HEDEF" | wc -l)"
          echo "Paylasim linki: $(rclone link "$HEDEF")"
          rm -rf ~/.config/rclone

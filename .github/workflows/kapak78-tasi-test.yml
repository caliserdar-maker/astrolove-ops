name: kapak78-tasi-test
# Poster 78 kapak TASIMA TESTI (Merkez 26 Eki plan adim 3; Etsy'ye dokunmaz, Etsy kilidi gerekmez).
# Girdi: Drive dosyasi (TSV: cift, design_id, url), dosya id ile okunur. Imzali URL girdi degil, maskelenir, loga yazilmaz.
# Cikti: Drive TEMP/POSTER_KAPAK_V10/<damga>/KAPAK_<CIFT>.jpg + OZET.md. canva-bulk-fetch / kapak-yukle-78 kullanilmaz.
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      tsv_id: {description: "Drive dosya id (TSV)", required: true, default: "1Sa2-epNZyfgyRLcNYjLCLgWJYkp3tXSh"}
jobs:
  tasi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Girdi kapisi
        env: {TSV_ID: "${{ inputs.tsv_id }}"}
        run: '[[ "$TSV_ID" =~ ^[A-Za-z0-9_-]{20,80}$ ]] || { echo "::error::tsv_id"; exit 1; }'
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q pillow==11.0.0
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || { sudo apt-get install -y -qq rclone >/dev/null; }
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: TSV (Drive, id ile)
        env: {TSV_ID: "${{ inputs.tsv_id }}"}
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work
          rclone backend copyid gdrive: "$TSV_ID" _work/girdi.tsv -q
          echo "TSV satir: $(grep -c . _work/girdi.tsv)"
          echo "DAMGA=$(date -u +%Y%m%d_%H%M%S)" >> "$GITHUB_ENV"
      - name: Indir + kontrol
        run: python3 scripts/kapak78/tasi_test.py --tsv _work/girdi.tsv --out _out
      - name: Drive'a yaz
        if: ${{ always() }}
        run: |
          if ls _out/* >/dev/null 2>&1; then
            rclone copy _out "gdrive:ASTROLOVE/TEMP/POSTER_KAPAK_V10/${DAMGA}" -q && echo "Cikti: TEMP/POSTER_KAPAK_V10/${DAMGA}"
          fi
      - if: always()
        run: rm -rf _work _out ~/.config/rclone

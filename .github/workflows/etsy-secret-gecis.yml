name: etsy-secret-gecis
# ETSY SHARED SECRET GECISI (Serdar 12 Kas 2026). Betik: scripts/etsy/secret_gecis.py; mod listesi, onay sozcukleri, mod basina Etsy
# istek sayisi ve geri donus sirasi: docs/SECRETS.md "Etsy shared secret gecisi". HER KOSU AYRI SERDAR ONAYIDIR.
# Girdi yalniz mod ve onay: sir degeri ya da parcasi GIRDI OLMAZ. Onay sozcugu: SERDAR_SECRET_<MOD buyuk harf>.
# Cikti: yalniz sabit metin + EVET / HAYIR / DOLU / BOS / VAR / YOK / HTTP kodu. Artifact, is ozeti, veri tasiyan notice, log dosyasi YOK.
# Her secret yalniz onu kullanan adimin env'inde. Kanit ucu AYARSIZ iken yazan gecis modlari DUR verir (secret_gecis.KANIT_UCU).
# Kilit: kapat / ac disindaki her modda kilit_bekle (token indirmeden ve ilk yazimdan once). Siparis: bu kosu olusturuldugu andan
# itibaren Etsy kilit sirasindadir (kilit_bekle sirayi olusturma zamanina gore tutar) ve siparis-kisisel-oku ayni kumededir; bu
# yuzden siparis-* icin BEKLENMEZ (karsilikli bekleme olurdu): yazan modlarda aktif siparis-* varsa kosu hemen DUR verir. Hicbir
# sey yazmayan modlarda (tamam_kapisi, yedek_dogrula, geri_dogrula) ve kapat / ac'ta siparis kontrolu yok. Kontrol 2'den sonra
# baslayan bir siparis-kisisel-oku, bu kosunun kalan adimlari (kurulum + mod) kadar bekler.
permissions:
  contents: read
  actions: read
on:
  workflow_dispatch:
    inputs:
      mod:
        description: "olc | yedek | yedek_dogrula | prova | kapat | ac | kod_anahtari | alan_sil | alan_geri | degistir | dogrula | tamam_kapisi | tamam_kontrol | geri_al | geri_dogrula | temizle | temizle_drive"
        required: true
      onay:
        description: "SERDAR_SECRET_<MOD> (ornek: SERDAR_SECRET_OLC); her mod icin ayri"
        required: true
env:
  MOD: ${{ inputs.mod }}
  ONAY: ${{ inputs.onay }}
jobs:
  gecis:
    runs-on: ubuntu-24.04
    timeout-minutes: 150     # kilit en fazla 120 dk + mod
    steps:
      - uses: actions/checkout@v4
      - name: Ortak kapi (ref main, deneme 1, mod listede, moda ozel onay sozcugu)
        run: python3 scripts/etsy/secret_gecis.py kapi
      - name: Siparis kontrol 1 (BEKLEMESIZ; aktif siparis-* varsa hemen DUR, yeni kosu ayri onay)
        if: ${{ !contains(fromJSON('["kapat","ac","tamam_kapisi","yedek_dogrula","geri_dogrula"]'), inputs.mod) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/common/siparis_bekle.py --dk 0
      - name: Kilit (Etsy kilidi)
        if: ${{ inputs.mod != 'kapat' && inputs.mod != 'ac' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - name: Siparis kontrol 2 (kilit alindiktan sonra, BEKLEMESIZ; kilit beklenirken baslayan siparis-* varsa hemen DUR)
        if: ${{ !contains(fromJSON('["kapat","ac","tamam_kapisi","yedek_dogrula","geri_dogrula"]'), inputs.mod) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/common/siparis_bekle.py --dk 0
      - name: Kurulum
        run: pip install -q requests==2.34.2 pynacl
      - name: rclone + conf (Drive'a dokunan modlar)
        if: ${{ !contains(fromJSON('["yedek","prova","kapat","ac","kod_anahtari"]'), inputs.mod) }}
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: olc (olcum (salt okuma; kanit ucu adayi))
        if: ${{ inputs.mod == 'olc' }}
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
        run: |
          set -euo pipefail
          python3 scripts/etsy/secret_gecis.py olc
      - name: yedek (canli -> ETSY_SHARED_SECRET_YEDEK)
        if: ${{ inputs.mod == 'yedek' }}
        env:
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHARED_SECRET_YENI: ${{ secrets.ETSY_SHARED_SECRET_YENI }}
          OPS_ADMIN_TOKEN: ${{ secrets.OPS_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/etsy/secret_gecis.py yedek
      - name: yedek_dogrula (YEDEK == canli + kanit ucu YEDEK ile 200)
        if: ${{ inputs.mod == 'yedek_dogrula' }}
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHARED_SECRET_YEDEK: ${{ secrets.ETSY_SHARED_SECRET_YEDEK }}
        run: |
          set -euo pipefail
          python3 scripts/etsy/secret_gecis.py yedek_dogrula
      - name: prova (OPS_ADMIN_TOKEN yetkileri + Serdar deneme girisi (canli secret'a dokunmaz))
        if: ${{ inputs.mod == 'prova' }}
        env:
          OPS_ADMIN_TOKEN: ${{ secrets.OPS_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/etsy/secret_gecis.py prova
      - name: prova_son (geri alma + adim ortami olcumu)
        if: ${{ always() && inputs.mod == 'prova' }}
        env:
          OPS_ADMIN_TOKEN: ${{ secrets.OPS_ADMIN_TOKEN }}
          PROVA_DEGERI: ${{ secrets.ETSY_SECRET_PROVA }}
        run: |
          set -euo pipefail
          python3 scripts/etsy/secret_gecis.py prova_son
      - name: kapat (sir sizdirabilen 18 is akisini kapat (kayit repo degiskeninde))
        if: ${{ inputs.mod == 'kapat' }}
        env:
          OPS_ADMIN_TOKEN: ${{ secrets.OPS_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/etsy/secret_gecis.py kapat
      - name: ac (yalniz kapat'in kapattiklarini ac)
        if: ${{ inputs.mod == 'ac' }}
        env:
          OPS_ADMIN_TOKEN: ${{ secrets.OPS_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/etsy/secret_gecis.py ac
      - name: kod_anahtari (SIPARIS_KOD_ANAHTARI yoksa rastgele uret)
        if: ${{ inputs.mod == 'kod_anahtari' }}
        env:
          OPS_ADMIN_TOKEN: ${{ secrets.OPS_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/etsy/secret_gecis.py kod_anahtari
      - name: alan_sil (token dosyasindan shared_secret alanini kaldir (alan == canli ise))
        if: ${{ inputs.mod == 'alan_sil' }}
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
        run: |
          set -euo pipefail
          python3 scripts/etsy/secret_gecis.py alan_sil
      - name: alan_geri (token dosyasina shared_secret alanini geri koy)
        if: ${{ inputs.mod == 'alan_geri' }}
        env:
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHARED_SECRET_YEDEK: ${{ secrets.ETSY_SHARED_SECRET_YEDEK }}
        run: |
          set -euo pipefail
          python3 scripts/etsy/secret_gecis.py alan_geri
      - name: degistir (canli := YENI (kapilar PASS ise))
        if: ${{ inputs.mod == 'degistir' }}
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHARED_SECRET_YEDEK: ${{ secrets.ETSY_SHARED_SECRET_YEDEK }}
          ETSY_SHARED_SECRET_YENI: ${{ secrets.ETSY_SHARED_SECRET_YENI }}
          OPS_ADMIN_TOKEN: ${{ secrets.OPS_ADMIN_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/etsy/secret_gecis.py degistir
      - name: dogrula (kaynak esitligi + kanit ucu + zincir testi)
        if: ${{ inputs.mod == 'dogrula' }}
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHARED_SECRET_YEDEK: ${{ secrets.ETSY_SHARED_SECRET_YEDEK }}
          ETSY_SHARED_SECRET_YENI: ${{ secrets.ETSY_SHARED_SECRET_YENI }}
        run: |
          set -euo pipefail
          python3 scripts/etsy/secret_gecis.py dogrula
      - name: tamam_kapisi (eski degerle baslamis aktif kosu yok + alan durumu)
        if: ${{ inputs.mod == 'tamam_kapisi' }}
        env:
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHARED_SECRET_YENI: ${{ secrets.ETSY_SHARED_SECRET_YENI }}
          OPS_ADMIN_TOKEN: ${{ secrets.OPS_ADMIN_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/etsy/secret_gecis.py tamam_kapisi
      - name: tamam_kontrol (eski reddediliyor, canli kabul ediliyor (tek okuma))
        if: ${{ inputs.mod == 'tamam_kontrol' }}
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHARED_SECRET_YEDEK: ${{ secrets.ETSY_SHARED_SECRET_YEDEK }}
        run: |
          set -euo pipefail
          python3 scripts/etsy/secret_gecis.py tamam_kontrol
      - name: geri_al (canli := YEDEK)
        if: ${{ inputs.mod == 'geri_al' }}
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHARED_SECRET_YEDEK: ${{ secrets.ETSY_SHARED_SECRET_YEDEK }}
          ETSY_SHARED_SECRET_YENI: ${{ secrets.ETSY_SHARED_SECRET_YENI }}
          OPS_ADMIN_TOKEN: ${{ secrets.OPS_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/etsy/secret_gecis.py geri_al
      - name: geri_dogrula (canli == YEDEK + kanit ucu YEDEK ile 200)
        if: ${{ inputs.mod == 'geri_dogrula' }}
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHARED_SECRET_YEDEK: ${{ secrets.ETSY_SHARED_SECRET_YEDEK }}
          ETSY_SHARED_SECRET_YENI: ${{ secrets.ETSY_SHARED_SECRET_YENI }}
        run: |
          set -euo pipefail
          python3 scripts/etsy/secret_gecis.py geri_dogrula
      - name: temizle (gecici secret'lari sil, Drive yedeklerini listele)
        if: ${{ inputs.mod == 'temizle' }}
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHARED_SECRET_YEDEK: ${{ secrets.ETSY_SHARED_SECRET_YEDEK }}
          ETSY_SHARED_SECRET_YENI: ${{ secrets.ETSY_SHARED_SECRET_YENI }}
          OPS_ADMIN_TOKEN: ${{ secrets.OPS_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/etsy/secret_gecis.py temizle
      - name: temizle_drive (bu betigin Drive token yedeklerini kalici sil)
        if: ${{ inputs.mod == 'temizle_drive' }}
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          OPS_ADMIN_TOKEN: ${{ secrets.OPS_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/etsy/secret_gecis.py temizle_drive
      - name: Temizlik
        if: ${{ always() }}
        run: rm -rf ~/.config/rclone

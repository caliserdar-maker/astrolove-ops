name: reels-p-degistir

# Bekleyen IG + FB Reels -> yeni P acilisli video (Serdar onayi 20 Eki 2026). Karusel ve FB album DEGISMEZ.
# scripts/sosyal/reels_p_degistir.py -> cift basina metricool_video_degistir.py --mod yaz (FB: --fb-kapak, kapak = ilk kare).
# Sira: mod=tek_ig (1 cift) -> geri okuma temizse mod=tek_fb (ayni cift) -> temizse mod=kalan. Ilk FAIL -> DUR.
# Cikti (kosular birikir): Drive TEMP/SOSYAL_DEGISIM_20261020/UYGULAMA_IG_FB/ (SONUC.csv, OZET.txt, <CIFT>_<mod>/ raporlari).

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      mod:
        type: choice
        options: [tek_ig, tek_fb, kalan]
        default: tek_ig
      cift:
        description: 'tek_ig / tek_fb icin cift (bos = yayini >= 1 gun sonra olan en erken cift, iki kosuda ayni)'
        default: ''

concurrency:
  group: metricool-video-degistir
  cancel-in-progress: false

jobs:
  degistir:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      T: gdrive:ASTROLOVE/TEMP
      O: gdrive:ASTROLOVE/TEMP/SOSYAL_DEGISIM_20261020/UYGULAMA_IG_FB
    steps:
      - uses: actions/checkout@v4
      - name: Paketler
        run: |
          pip install -q numpy==2.1.3 pillow==11.0.0
          sudo apt-get -qq update >/dev/null && sudo apt-get install -y -qq ffmpeg >/dev/null
          ffprobe -version | head -1
      - name: rclone + token
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          for d in 1 2 3; do curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1; command -v rclone >/dev/null && break; sleep $((d * 10)); done
          command -v rclone >/dev/null || { sudo apt-get -qq update >/dev/null; sudo apt-get install -y -qq rclone >/dev/null; }
          mkdir -p ~/.config/rclone _work _out; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            export RCLONE_CONFIG_GDRIVE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET"
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
          rclone copyto "$T/METRICOOL_TOKEN.json" _work/mc.json
          python3 -c "import json;print('::add-mask::'+json.load(open('_work/mc.json'))['userToken'])"
          rclone copyto "$T/SOSYAL_DEGISIM_20261020/INSTAGRAM/ESLEME.csv" _work/IG.csv
          rclone copyto "$T/SOSYAL_DEGISIM_20261020/FACEBOOK/ESLEME.csv" _work/FB.csv
          rclone copyto "$O/SONUC.csv" _out/SONUC.csv 2>/dev/null || echo "onceki SONUC yok"
          rclone copyto "$O/OZET.txt" _out/OZET.txt 2>/dev/null || echo "onceki OZET yok"
          wc -l _work/IG.csv _work/FB.csv
      - name: Degistir (${{ inputs.mod }})
        env:
          MOD: ${{ inputs.mod }}
          CIFT: ${{ inputs.cift }}
        run: |
          set +e -uo pipefail
          case "$CIFT" in *[!A-Z_]*) echo "::error::cift bicimi"; exit 1 ;; esac
          python3 scripts/sosyal/reels_p_degistir.py --token _work/mc.json --ig _work/IG.csv --fb _work/FB.csv \
            --video-dir "$T/SOSYAL_VIDEO_P_78_20261020" --mod "$MOD" --cift "$CIFT" --cikti _out --is _work/is --onceki _out/SONUC.csv 2>&1 \
            | python3 scripts/guvenlik/sir_koru.py tee --sir-json _work/mc.json "$GITHUB_STEP_SUMMARY"
          rc=${PIPESTATUS[0]}
          find _out -name '_*.mp4' -delete; find _out -name '_kapak*.jpg' -delete
          mkdir -p _work/engel
          while IFS= read -r f; do
            python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/mc.json "$f" >/dev/null 2>&1 \
              || { echo "TARAMA GECMEDI (Drive'a gitmez): $f"; mv "$f" _work/engel/; }
          done < <(find _out -type f)
          python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/mc.json _out || exit 1
          rclone copy _out "$O" -q
          rclone lsl "$O" --max-depth 1 | python3 scripts/guvenlik/sir_koru.py tee --sir-json _work/mc.json "$GITHUB_STEP_SUMMARY"
          exit $rc
      - if: always()
        run: |
          rm -rf _work ~/.config/rclone
          if [ -f "$RUNNER_TEMP/SIR_ENGEL" ]; then echo "::error::sir iceren satir engellendi (sir_koru)"; exit 1; fi

name: yayin-durum

# Gunluk YAYIN_DURUM.md (salt okuma; Serdar talimati 28 Eyl): 78 POD ilani kapak/video/galeri/aciklama/hazirlik/envanter(size+fiyat)
# = OK/BEKLIYOR/FAIL. scripts/etsy/yayin_durum.py; Etsy 2-3 cagri. Cikti Drive TEMP/YAYIN_DURUM.md.

permissions:
  actions: read
  contents: read

on:
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch: {}

jobs:
  durum:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Kayitlar + token
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _k _v _g
          T="gdrive:ASTROLOVE/TEMP"
          rclone copyto "$T/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
          rclone copy "$T/KAPAK78_YUKLE" _k --include "*/SONUC.json" -q || true
          rclone copy "$T/VIDEO78_YUKLE" _v --include "*/SONUC.json" -q || true
          CL=$(rclone lsf --dirs-only "$T/" | grep '^POD_CL_GALERI_YEDEK_' | sort | tail -1 || true)
          [ -n "$CL" ] && rclone copyto "$T/${CL}rapor.json" _g/cl_rapor.json 2>/dev/null || true
          rclone copyto "$T/GALERI_YAYIN/ILERLEME.json" _g/galeri77.json 2>/dev/null || true
          rclone copyto "$T/YAYIN_DURUM.md" _work/onceki.md 2>/dev/null || true
          rclone copyto "$T/SIZE_SIRA/ILERLEME.json" _g/envanter.json 2>/dev/null || true
          echo "kapak kayit: $(find _k -name SONUC.json | wc -l) | video kayit: $(find _v -name SONUC.json | wc -l) | galeri: $(ls _g | tr '\n' ' ')"
      - name: Durum
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          set -euo pipefail
          python scripts/etsy/yayin_durum.py --kapak _k --video _v --galeri _g/cl_rapor.json --galeri _g/galeri77.json \
            --envanter _g/envanter.json --onceki _work/onceki.md --out _work/YAYIN_DURUM.md
          rclone copyto _work/YAYIN_DURUM.md "gdrive:ASTROLOVE/TEMP/YAYIN_DURUM.md" -q
          head -40 _work/YAYIN_DURUM.md >> "$GITHUB_STEP_SUMMARY"
      - name: Token geri yaz
        if: ${{ always() }}
        run: |
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "Token geri yazildi" || true
          rm -rf _work ~/.config/rclone

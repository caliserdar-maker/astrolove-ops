name: galeri-77

# 77 cift galerisi, CL kesin paketiyle (86296c5) ayni 19 gorsel (Serdar 28 Eyl genel onayi). Etsy YOK, Prodigi YOK.
# Kaynak (cift basina, Drive TEMP/GALERI_77/_KAYNAK/<CIFT>/, varsa yeniden uretilmez):
#   KAPAK.jpg   = TEMP/POD_KAPAK_78/<en son damga>/KAPAK_<CIFT>.jpg (v9e kapak)
#   BASKI_MIDNIGHT_BLUE.jpg = TEMP/POD_KAPAK_V3/SIPARIS/<CIFT>_MIDNIGHT_BLUE_11x14/BASKI_11x14.jpg (kapagin posteri)
#   BASKI_<RENK>.jpg (diger 4 renk) = siparis-baski-v1 siparis_dosyasi.py --urun pod 11x14 EMILY/JAMES (degistirilmeden)
# mod kaynak: yalniz kaynak; mod tam: kaynak + 19 kart (galeri77_kur.py) + QC + Drive TEMP/GALERI_77/<CIFT>/ + HAZIR.csv
# Cikti: TEMP/GALERI_77/<CIFT>/ (19 jpg + ALT_METIN.csv + SET.json), _QC/<CIFT>/ (QC.txt, TEMAS), _HAZIR/<CIFT>.csv ->
#   her biten cift sonrasi TEMP/GALERI_77/HAZIR.csv yeniden yazilir (etsy oturumu buradan yukler). QC FAIL cift atlanir.
# Es zamanli en fazla 4 is (max-parallel 4).

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      ciftler:
        description: "virgullu cift listesi ya da HEPSI74"
        required: true
      mod:
        description: "kaynak | tam"
        required: true
        default: tam
      yeniden:
        description: "evet: Drive'da hazir (HAZIR satiri olan) ciftleri de yeniden uret"
        required: false
        default: hayir

concurrency:
  group: galeri-77
  cancel-in-progress: false

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        parca: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Checkout (siparis-baski-v1, hat kodu)
        uses: actions/checkout@v4
        with:
          ref: siparis-baski-v1
          path: _sb
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q numpy==2.1.3 pillow==11.0.0 scipy==1.14.1 opencv-python-headless==4.10.0.84 pyspellchecker==0.9.0 fonttools img2pdf pikepdf
          # siparis_dosyasi (hat kodu) kendi ortaminda, hata-kontrol-baski ile ayni (surum sabitlenmez)
          python -m venv _sbenv && _sbenv/bin/pip install -q pillow opencv-python-headless numpy fonttools img2pdf pikepdf
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          mkdir -p fonts; base=https://raw.githubusercontent.com/google/fonts/main/ofl
          curl -fsSL "$base/ebgaramond/EBGaramond%5Bwght%5D.ttf" -o 'fonts/EBGaramond[wght].ttf'
          curl -fsSL "$base/montserrat/Montserrat%5Bwght%5D.ttf" -o 'fonts/Montserrat[wght].ttf'
          curl -fsSL "$base/lato/Lato-Regular.ttf" -o fonts/Lato-Regular.ttf
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Kaynak + galeri
        env:
          CIFTLER: ${{ inputs.ciftler }}
          MOD: ${{ inputs.mod }}
          YENIDEN: ${{ inputs.yeniden }}
          PARCA: ${{ matrix.parca }}
        run: |
          set +e -uo pipefail
          case "$MOD" in kaynak|tam) : ;; *) echo "HATA: mod kaynak|tam"; exit 1 ;; esac
          case "$CIFTLER" in *[!A-Z_0-9,]*) echo "HATA: ciftler A-Z_ ve virgul"; exit 1 ;; esac
          if [ "$CIFTLER" = "HEPSI74" ]; then
            CIFTLER=$(tail -n +2 data/pod/pod78_ids.csv | cut -d, -f2 | grep -v -x -E 'CANCER_LIBRA|ARIES_LIBRA|AQUARIUS_LIBRA|CAPRICORN_LIBRA' | paste -sd,)
          fi
          IFS=, read -ra HEP <<< "$CIFTLER"
          BEN=(); for i in "${!HEP[@]}"; do [ $((i % 4)) = "$PARCA" ] && BEN+=("${HEP[$i]}"); done
          [ ${#BEN[@]} = 0 ] && { echo "bu parcada cift yok"; exit 0; }
          G=gdrive:ASTROLOVE/TEMP/GALERI_77
          KDAMGA=$(rclone lsf --dirs-only gdrive:ASTROLOVE/TEMP/POD_KAPAK_78/ | tr -d '/' | grep -E '^[0-9]{8}_[0-9]{4}$' | sort | tail -1)
          echo "kapak klasoru: POD_KAPAK_78/$KDAMGA | parca $PARCA: ${#BEN[@]} cift"
          MB64=$(printf '%s' 'It Began With a Kiss in the Rain' | base64 -w0)
          N=${#BEN[@]}; n=0; t0=$(date +%s); FAIL=(); TAMAM=0
          mkdir -p _work/kaynak/CANCER_LIBRA
          rclone copyto "$G/_KAYNAK/CANCER_LIBRA/BASKI_MIDNIGHT_BLUE.jpg" _work/kaynak/CANCER_LIBRA/BASKI_MIDNIGHT_BLUE.jpg -q \
            || rclone copyto "gdrive:ASTROLOVE/TEMP/POD_KAPAK_V3/SIPARIS/CANCER_LIBRA_MIDNIGHT_BLUE_11x14/BASKI_11x14.jpg" _work/kaynak/CANCER_LIBRA/BASKI_MIDNIGHT_BLUE.jpg -q
          for C in "${BEN[@]}"; do
            n=$((n+1)); Y=_work/kaynak/$C; mkdir -p $Y; hata=""
            if [ "$MOD" = "tam" ] && [ "$YENIDEN" != "evet" ] && rclone lsf "$G/_HAZIR/$C.csv" >/dev/null 2>&1 \
               && [ -n "$(rclone lsf "$G/_HAZIR/$C.csv" 2>/dev/null)" ]; then
              echo "[$n/$N] $C zaten hazir (HAZIR satiri var), atlandi"; continue
            fi
            rclone copy "$G/_KAYNAK/$C" $Y -q 2>/dev/null
            if [ ! -f $Y/KAPAK.jpg ]; then
              rclone copyto "gdrive:ASTROLOVE/TEMP/POD_KAPAK_78/$KDAMGA/KAPAK_$C.jpg" $Y/KAPAK.jpg -q || hata="kapak yok"
            fi
            if [ ! -f $Y/BASKI_MIDNIGHT_BLUE.jpg ]; then
              rclone copyto "gdrive:ASTROLOVE/TEMP/POD_KAPAK_V3/SIPARIS/${C}_MIDNIGHT_BLUE_11x14/BASKI_11x14.jpg" $Y/BASKI_MIDNIGHT_BLUE.jpg -q || hata="$hata MB baski yok"
              rclone copyto "gdrive:ASTROLOVE/TEMP/POD_KAPAK_V3/SIPARIS/${C}_MIDNIGHT_BLUE_11x14/KAPI_RAPORU.json" $Y/KAPI_MIDNIGHT_BLUE.json -q 2>/dev/null
            fi
            # PW kaynagi (POD_PRINT) degistiyse (pw-kucuk-yeniden yazimi) onbellekteki PW baskisi yeniden uretilir
            PWS=$(rclone lsjson "gdrive:ASTROLOVE/TEMP/POD_PRINT/$C/PURE_WHITE/11x14.jpg" 2>/dev/null | python3 -c "import json,sys;l=json.load(sys.stdin);print(l[0]['ModTime'] if l else '')" 2>/dev/null)
            PWE=$([ -f $Y/PW_KAYNAK.json ] && python3 -c "import json;l=json.load(open('$Y/PW_KAYNAK.json'));print(l[0]['ModTime'] if l else '')" 2>/dev/null)
            if [ -n "$PWS" ] && [ "$PWS" != "$PWE" ]; then
              [ -f $Y/BASKI_PURE_WHITE.jpg ] && echo "$C: PW kaynagi degisti ($PWE -> $PWS), PW baskisi yeniden"
              rm -f $Y/BASKI_PURE_WHITE.jpg $Y/KAPI_PURE_WHITE.json; rclone deletefile "$G/_KAYNAK/$C/BASKI_PURE_WHITE.jpg" -q 2>/dev/null
              rclone lsjson "gdrive:ASTROLOVE/TEMP/POD_PRINT/$C/PURE_WHITE/11x14.jpg" > $Y/PW_KAYNAK.json 2>/dev/null
            fi
            for R in DEEP_BLACK PURE_WHITE CHAMPAGNE_IVORY WARM_PARCHMENT; do
              [ -f $Y/BASKI_$R.jpg ] && continue
              (cd _sb && ../_sbenv/bin/python scripts/medya_v1/siparis_dosyasi.py --cift "$C" --renk "$R" --boy 11x14 --urun pod \
                --isim1 EMILY --isim2 JAMES --mesaj-b64 "$MB64" --sip-kok "$G/_KAYNAK/SIPARIS" > "../_work/log_${C}_$R.txt" 2>&1)
              D="_sb/_siparis/${C}_${R}_11x14"
              if [ -f "$D/KAPI_RAPORU.json" ] && python3 scripts/pod/galeri77_kapi.py "$D/KAPI_RAPORU.json" && [ -f "$D/BASKI_11x14.jpg" ]; then
                cp "$D/BASKI_11x14.jpg" $Y/BASKI_$R.jpg; cp "$D/KAPI_RAPORU.json" $Y/KAPI_$R.json
              elif [ "$R" = "WARM_PARCHMENT" ]; then
                # WP hat yolu SISTEM HATASI (sembol_sol): yedek = onayli POD_PRINT WP kaynagi, isim+mesaj bandi EJ ise
                rclone copyto "gdrive:ASTROLOVE/TEMP/POD_PRINT/$C/WARM_PARCHMENT/11x14.jpg" _work/wp_$C.jpg -q \
                  && python3 scripts/pod/galeri77_wp.py _work/wp_$C.jpg $Y/BASKI_MIDNIGHT_BLUE.jpg | tee $Y/WP_YEDEK.txt \
                  && [ "${PIPESTATUS[0]}" = "0" ] && cp _work/wp_$C.jpg $Y/BASKI_$R.jpg \
                  || { hata="$hata WP baski+yedek FAIL"; grep -h -E "_11x14 \{'urun'" "_work/log_${C}_$R.txt" | cut -c1-400; }
              else
                hata="$hata $R baski FAIL"; grep -h -E "_11x14 \{'urun'" "_work/log_${C}_$R.txt" | cut -c1-600; tail -3 "_work/log_${C}_$R.txt"
              fi
            done
            rclone copy $Y "$G/_KAYNAK/$C" -q
            if [ -z "$hata" ] && [ "$MOD" = "tam" ]; then
              O=_work/out/$C
              if bash scripts/pod/galeri77_cift.sh "$C" $Y $O > _work/cift_$C.txt 2>&1; then
                rclone sync $O/paket "$G/$C" -q
                rclone copy $O/QC.txt "$G/_QC/$C" -q; rclone copy $O/TEMAS_$C.jpg "$G/_QC/$C" -q; rclone copy $O/KUR.txt "$G/_QC/$C" -q
                LID=$(awk -F, -v c="$C" '$2==c{print $1}' data/pod/pod78_ids.csv)
                WPK=hat; [ -f $Y/WP_YEDEK.txt ] && WPK=pod_print_yedek
                PWT=$(python3 -c "import json;l=json.load(open('$Y/PW_KAYNAK.json'));print(l[0]['ModTime'][:19] if l else '')" 2>/dev/null)
                ADET=$(rclone lsf "$G/$C" --include "*.jpg" | wc -l)
                [ "$ADET" = 19 ] || hata="Drive'da $ADET gorsel"
                if [ -z "$hata" ]; then
                  printf '%s,%s,TEMP/GALERI_77/%s/,19,PASS,%s,%s,%s\n' "$C" "$LID" "$C" "$(date -u +%Y%m%d_%H%M)" "$WPK" "$PWT" | rclone rcat "$G/_HAZIR/$C.csv"
                  bash scripts/pod/galeri77_hazir.sh; TAMAM=$((TAMAM+1))
                fi
              else
                hata="galeri QC FAIL"; tail -4 _work/cift_$C.txt; grep -h "FAIL" $O/QC.txt 2>/dev/null | cut -c1-300 | head -8
                [ -f $O/QC.txt ] && rclone copy $O/QC.txt "$G/_QC/$C" -q
                rclone deletefile "$G/_HAZIR/$C.csv" -q 2>/dev/null
              fi
            fi
            if [ -n "$hata" ]; then FAIL+=("$C: $hata"); echo "::warning::$C atlandi: $hata"; fi
            g=$(( $(date +%s) - t0 ))
            echo "[$n/$N] $C ${hata:-OK} | gecen ${g}s | kalan ~$(( g * (N - n) / n ))s | %$(( n * 100 / N ))"
          done
          echo "== parca $PARCA: hazir $TAMAM | FAIL ${#FAIL[@]}"; printf '%s\n' "${FAIL[@]}"
          exit 0
      - if: always()
        run: rm -rf ~/.config/rclone

  son:
    needs: uret
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: HAZIR.csv + ozet
        run: |
          set -euo pipefail
          bash scripts/pod/galeri77_hazir.sh
          G=gdrive:ASTROLOVE/TEMP/GALERI_77
          echo "GALERI_77 linki: $(rclone link "$G" 2>/dev/null || echo -)"
          echo "QC linki: $(rclone link "$G/_QC" 2>/dev/null || echo -)"
      - if: always()
        run: rm -rf ~/.config/rclone

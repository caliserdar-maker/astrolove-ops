name: galeri-77

# 77 cift galerisi, CL kesin paketiyle (86296c5) ayni 19 gorsel (Serdar 28 Eyl genel onayi). Etsy YOK, Prodigi YOK.
# Kaynak (cift basina, Drive TEMP/GALERI_77/_KAYNAK/<CIFT>/, varsa yeniden uretilmez):
#   KAPAK.jpg   = TEMP/POD_KAPAK_78/<en son damga>/KAPAK_<CIFT>.jpg (v9e kapak)
#   BASKI_MIDNIGHT_BLUE.jpg = TEMP/POD_KAPAK_V3/SIPARIS/<CIFT>_MIDNIGHT_BLUE_11x14/BASKI_11x14.jpg (kapagin posteri)
#   BASKI_<RENK>.jpg (diger 4 renk) = siparis-baski-v1 siparis_dosyasi.py --urun pod 11x14 EMILY/JAMES (degistirilmeden)
# mod kaynak: yalniz kaynak; mod tam: kaynak + 19 kart (galeri77_kur.py) + QC + Drive TEMP/GALERI_77/<CIFT>/ + HAZIR.csv
# Cikti: TEMP/GALERI_77/<CIFT>/ (19 jpg + ALT_METIN.csv + SET.json), _QC/<CIFT>/ (QC.txt, TEMAS), _HAZIR/<CIFT>.csv ->
#   her biten cift sonrasi TEMP/GALERI_77/HAZIR.csv yeniden yazilir (etsy oturumu buradan yukler). QC FAIL cift atlanir.
# WP (Warm Parchment) EMILY/JAMES baskisi hattan KAPI gecmezse: isimsiz WP KULLANILMAZ (Serdar 28 Eyl); 05 ve 19 haric
#   17 gorsel QC'lenip <CIFT>/ klasorune yazilir, _WPBEKLE/<CIFT>.txt + HAZIR satiri set=17 (Serdar 30 Eyl: galeri WP'yi
#   beklemez; 05/19 yerine baska gorsel konmaz). WP PASS olunca ayni 'tam' kosusu (wp_dal) WP'yi uretir, 19 gorseli
#   tamamlar, HAZIR satiri set=19 olur. PW kaynagi degismez, PW yeniden uretilmez.
# Es zamanli en fazla 4 is (max-parallel 4).

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      ciftler:
        description: "virgullu cift listesi ya da HEPSI74"
        required: true
      mod:
        description: "kaynak | tam"
        required: true
        default: tam
      wp_dal:
        description: "WP: ATLA = WP denenmez (17 gorsel); dal adi = o daldaki siparis_dosyasi, TUM kapilar (olcek dahil), RED ise WP_TANI.md; bos = eski tolerans"
        required: false
        default: ""
      yeniden:
        description: "evet: Drive'da hazir (HAZIR satiri olan) ciftleri de yeniden uret"
        required: false
        default: hayir
      ornek:
        description: "ornek klasoru (TEMP/<ad>/<CIFT>/): WP yeniden uretilir, 05+19 ve WP baskisi yalniz buraya; galeri/HAZIR/_KAYNAK'a dokunulmaz"
        required: false
        default: ""

concurrency:
  group: galeri-77
  cancel-in-progress: false

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        parca: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Checkout (siparis-baski-v1, hat kodu)
        uses: actions/checkout@v4
        with:
          ref: siparis-baski-v1
          path: _sb
      - name: Checkout (WP dali)
        if: ${{ inputs.wp_dal != '' && inputs.wp_dal != 'ATLA' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.wp_dal }}
          path: _sbwp
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q numpy==2.1.3 pillow==11.0.0 scipy==1.14.1 opencv-python-headless==4.10.0.84 pyspellchecker==0.9.0 fonttools img2pdf pikepdf
          # siparis_dosyasi (hat kodu) kendi ortaminda, hata-kontrol-baski ile ayni (surum sabitlenmez)
          python -m venv _sbenv && _sbenv/bin/pip install -q pillow opencv-python-headless numpy fonttools img2pdf pikepdf
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          mkdir -p fonts; base=https://raw.githubusercontent.com/google/fonts/main/ofl
          curl -fsSL "$base/ebgaramond/EBGaramond%5Bwght%5D.ttf" -o 'fonts/EBGaramond[wght].ttf'
          curl -fsSL "$base/montserrat/Montserrat%5Bwght%5D.ttf" -o 'fonts/Montserrat[wght].ttf'
          curl -fsSL "$base/lato/Lato-Regular.ttf" -o fonts/Lato-Regular.ttf
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Kaynak + galeri
        env:
          CIFTLER: ${{ inputs.ciftler }}
          MOD: ${{ inputs.mod }}
          YENIDEN: ${{ inputs.yeniden }}
          WP_DAL: ${{ inputs.wp_dal }}
          ORNEK: ${{ inputs.ornek }}
          PARCA: ${{ matrix.parca }}
        run: |
          set +e -uo pipefail
          case "$MOD" in kaynak|tam) : ;; *) echo "HATA: mod kaynak|tam"; exit 1 ;; esac
          case "$CIFTLER" in *[!A-Z_0-9,]*) echo "HATA: ciftler A-Z_ ve virgul"; exit 1 ;; esac
          case "$ORNEK" in *[!A-Z_0-9]*) echo "HATA: ornek A-Z_0-9"; exit 1 ;; esac
          # ornek modu (Serdar 1 Eki): WP onay ornegi; uretim galerisi, HAZIR, _WPBEKLE ve _KAYNAK degismez
          SK="gdrive:ASTROLOVE/TEMP/GALERI_77/_KAYNAK/SIPARIS"; [ -n "$ORNEK" ] && SK="gdrive:ASTROLOVE/TEMP/$ORNEK/_SIPARIS"
          if [ "$CIFTLER" = "HEPSI74" ]; then
            CIFTLER=$(tail -n +2 data/pod/pod78_ids.csv | cut -d, -f2 | grep -v -x -E 'CANCER_LIBRA|ARIES_LIBRA|AQUARIUS_LIBRA|CAPRICORN_LIBRA' | paste -sd,)
          fi
          IFS=, read -ra HEP <<< "$CIFTLER"
          BEN=(); for i in "${!HEP[@]}"; do [ $((i % 4)) = "$PARCA" ] && BEN+=("${HEP[$i]}"); done
          [ ${#BEN[@]} = 0 ] && { echo "bu parcada cift yok"; exit 0; }
          G=gdrive:ASTROLOVE/TEMP/GALERI_77
          KDAMGA=$(rclone lsf --dirs-only gdrive:ASTROLOVE/TEMP/POD_KAPAK_78/ | tr -d '/' | grep -E '^[0-9]{8}_[0-9]{4}$' | sort | tail -1)
          echo "kapak klasoru: POD_KAPAK_78/$KDAMGA | parca $PARCA: ${#BEN[@]} cift"
          MB64=$(printf '%s' 'It Began With a Kiss in the Rain' | base64 -w0)
          N=${#BEN[@]}; n=0; t0=$(date +%s); FAIL=(); TAMAM=0; BEKLE=0
          mkdir -p _work/kaynak/CANCER_LIBRA
          rclone copyto "$G/_KAYNAK/CANCER_LIBRA/BASKI_MIDNIGHT_BLUE.jpg" _work/kaynak/CANCER_LIBRA/BASKI_MIDNIGHT_BLUE.jpg -q \
            || rclone copyto "gdrive:ASTROLOVE/TEMP/POD_KAPAK_V3/SIPARIS/CANCER_LIBRA_MIDNIGHT_BLUE_11x14/BASKI_11x14.jpg" _work/kaynak/CANCER_LIBRA/BASKI_MIDNIGHT_BLUE.jpg -q
          # WP plate'i (baski-duzelt oturumu yeniliyor): WP baskisi hangi plate ile uretildiyse WP_PLATE.txt'de; plate
          # degisirse o ciftin WP baskisi ve galerisi yeniden (HAZIR satiri olsa bile)
          PLATE_T=$(rclone lsjson "gdrive:ASTROLOVE/TEMP/SIPARIS_ISIM/PLATES/VINTAGE_11x14.png" 2>/dev/null | python3 -c "import json,sys;l=json.load(sys.stdin);print(l[0]['ModTime'] if l else '')" 2>/dev/null)
          echo "WP plate VINTAGE_11x14: $PLATE_T"
          satir17() {   # HAZIR satiri, set=17 (05 ve 19 yok; isimsiz WP KULLANILMAZ, yerine baska gorsel konmaz)
            local LID PWT
            LID=$(awk -F, -v c="$C" '$2==c{print $1}' data/pod/pod78_ids.csv)
            PWT=$(python3 -c "import json;l=json.load(open('$Y/PW_KAYNAK.json'));print(l[0]['ModTime'][:19] if l else '')" 2>/dev/null)
            printf '%s,%s,TEMP/GALERI_77/%s/,17,PASS,%s,-,%s,17\n' "$C" "$LID" "$C" "$(date -u +%Y%m%d_%H%M)" "$PWT" | rclone rcat "$G/_HAZIR/$C.csv"
            bash scripts/pod/galeri77_hazir.sh
          }
          for C in "${BEN[@]}"; do
            n=$((n+1)); Y=_work/kaynak/$C; mkdir -p $Y; hata=""
            WPP=$(rclone cat "$G/_KAYNAK/$C/WP_PLATE.txt" 2>/dev/null)
            if [ -z "$ORNEK" ] && [ "$MOD" = "tam" ] && [ "$YENIDEN" != "evet" ] && [ -n "$(rclone lsf "$G/_HAZIR/$C.csv" 2>/dev/null)" ] \
               && [ "$WPP" = "$PLATE_T" ]; then
              echo "[$n/$N] $C zaten hazir (HAZIR satiri var, WP plate ayni), atlandi"; continue
            fi
            rclone copy "$G/_KAYNAK/$C" $Y -q 2>/dev/null
            [ -n "$ORNEK" ] && rm -f $Y/BASKI_WARM_PARCHMENT.jpg $Y/KAPI_WARM_PARCHMENT.json $Y/WP_PLATE.txt $Y/WP_KOD.txt   # ornek: WP her zaman yeniden
            if [ ! -f $Y/KAPAK.jpg ]; then
              rclone copyto "gdrive:ASTROLOVE/TEMP/POD_KAPAK_78/$KDAMGA/KAPAK_$C.jpg" $Y/KAPAK.jpg -q || hata="kapak yok"
            fi
            if [ ! -f $Y/BASKI_MIDNIGHT_BLUE.jpg ]; then
              rclone copyto "gdrive:ASTROLOVE/TEMP/POD_KAPAK_V3/SIPARIS/${C}_MIDNIGHT_BLUE_11x14/BASKI_11x14.jpg" $Y/BASKI_MIDNIGHT_BLUE.jpg -q || hata="$hata MB baski yok"
              rclone copyto "gdrive:ASTROLOVE/TEMP/POD_KAPAK_V3/SIPARIS/${C}_MIDNIGHT_BLUE_11x14/KAPI_RAPORU.json" $Y/KAPI_MIDNIGHT_BLUE.json -q 2>/dev/null
            fi
            # isimsiz WP KULLANILMAZ (Serdar 28 Eyl): eski onbellekte POD_PRINT WP yedegi kaldiysa silinir
            if [ -f $Y/WP_YEDEK.txt ]; then
              rm -f $Y/WP_YEDEK.txt $Y/BASKI_WARM_PARCHMENT.jpg
              rclone deletefile "$G/_KAYNAK/$C/WP_YEDEK.txt" -q 2>/dev/null; rclone deletefile "$G/_KAYNAK/$C/BASKI_WARM_PARCHMENT.jpg" -q 2>/dev/null
            fi
            if [ -f $Y/BASKI_WARM_PARCHMENT.jpg ] && [ "$(cat $Y/WP_PLATE.txt 2>/dev/null)" != "$PLATE_T" ]; then
              echo "$C: WP plate degisti -> WP baskisi yeniden"; rm -f $Y/BASKI_WARM_PARCHMENT.jpg $Y/KAPI_WARM_PARCHMENT.json
              rclone deletefile "$G/_KAYNAK/$C/BASKI_WARM_PARCHMENT.jpg" -q 2>/dev/null
            fi
            for R in DEEP_BLACK PURE_WHITE CHAMPAGNE_IVORY WARM_PARCHMENT; do
              [ -f $Y/BASKI_$R.jpg ] && continue
              [ "$R" = "WARM_PARCHMENT" ] && [ "$WP_DAL" = "ATLA" ] && continue      # WP denemesi yok (Serdar 28 Eyl: merge beklenir)
              SB=_sb; KT=""
              if [ "$R" = "WARM_PARCHMENT" ] && [ -n "$WP_DAL" ]; then SB=_sbwp; KT="--tam"; fi   # WP: baski-duzelt dali, tum kapilar
              (cd $SB && ../_sbenv/bin/python scripts/medya_v1/siparis_dosyasi.py --cift "$C" --renk "$R" --boy 11x14 --urun pod \
                --isim1 EMILY --isim2 JAMES --mesaj-b64 "$MB64" --sip-kok "$SK" > "../_work/log_${C}_$R.txt" 2>&1)
              D="$SB/_siparis/${C}_${R}_11x14"
              [ -f "$D/KAPI_RAPORU.json" ] || { echo "$C $R: KAPI_RAPORU yok"; tail -4 "_work/log_${C}_$R.txt"; }
              if [ -f "$D/KAPI_RAPORU.json" ] && python3 scripts/pod/galeri77_kapi.py "$D/KAPI_RAPORU.json" $KT && [ -f "$D/BASKI_11x14.jpg" ]; then
                cp "$D/BASKI_11x14.jpg" $Y/BASKI_$R.jpg; cp "$D/KAPI_RAPORU.json" $Y/KAPI_$R.json
                [ "$R" = "WARM_PARCHMENT" ] && printf '%s' "$PLATE_T" > $Y/WP_PLATE.txt && printf '%s' "${WP_DAL:-siparis-baski-v1}@$(git -C $SB rev-parse --short HEAD)" > $Y/WP_KOD.txt
              elif [ "$R" = "WARM_PARCHMENT" ] && [ -n "$KT" ] && [ -f "$D/KAPI_RAPORU.json" ]; then
                # tum kapilar gecmedi: tani (WP_TANI.md + karsilastirma) Drive'a; yeni iterasyon yok
                FD=fonts python3 scripts/pod/galeri77_wptani.py "$C" "$D/KAPI_RAPORU.json" "$D/BASKI_11x14.jpg" $Y/BASKI_MIDNIGHT_BLUE.jpg \
                  "${WP_DAL}@$(git -C $SB rev-parse --short HEAD)" _work/wptani_$C
                cp "$D/KAPI_RAPORU.json" _work/wptani_$C/KAPI_RAPORU.json
                rclone copy _work/wptani_$C "$G/_WPTANI/$C" -q && rclone copyto _work/wptani_$C/WP_TANI.md "$G/WP_TANI.md" -q
                [ -n "$ORNEK" ] && rclone copy _work/wptani_$C "gdrive:ASTROLOVE/TEMP/$ORNEK/$C" -q
                echo "WP_TANI: TEMP/GALERI_77/WP_TANI.md + _WPTANI/$C/ | $(rclone link "$G/_WPTANI/$C" 2>/dev/null)"
              elif [ "$R" != "WARM_PARCHMENT" ]; then
                hata="$hata $R baski FAIL"; grep -h -E "_11x14 \{'urun'" "_work/log_${C}_$R.txt" | cut -c1-600; tail -3 "_work/log_${C}_$R.txt"
              fi
            done
            [ -f $Y/PW_KAYNAK.json ] || rclone lsjson "gdrive:ASTROLOVE/TEMP/POD_PRINT/$C/PURE_WHITE/11x14.jpg" > $Y/PW_KAYNAK.json 2>/dev/null
            [ -z "$ORNEK" ] && rclone copy $Y "$G/_KAYNAK/$C" -q
            WPV=0; [ -f $Y/BASKI_WARM_PARCHMENT.jpg ] && WPV=1
            if [ -n "$ORNEK" ]; then
              # WP onay ornegi: 19 kart yerelde kurulur + QC; yalniz 05, 19 (3000x2250) + WP baskisi + QC Drive TEMP/$ORNEK/<CIFT>/
              [ $WPV = 0 ] && hata="$hata WP RED (WP_TANI.md)"
              if [ -z "$hata" ]; then
                O=_work/out/$C; ORN="gdrive:ASTROLOVE/TEMP/$ORNEK/$C"
                if bash scripts/pod/galeri77_cift.sh "$C" $Y $O > _work/cift_$C.txt 2>&1; then
                  for f in 05_renk_ve_dijital.jpg 19_renk_warm_parchment.jpg; do rclone copyto $O/paket/$f "$ORN/$f" -q || hata="$hata $f yuklenemedi"; done
                  rclone copy $O/QC.txt "$ORN" -q; rclone copy $O/TEMAS_$C.jpg "$ORN" -q
                  for f in BASKI_WARM_PARCHMENT.jpg KAPI_WARM_PARCHMENT.json WP_KOD.txt; do rclone copy $Y/$f "$ORN" -q; done
                  python3 -c "from PIL import Image;[print(f, Image.open('$O/paket/'+f).size) for f in ('05_renk_ve_dijital.jpg','19_renk_warm_parchment.jpg')]"
                  python3 scripts/pod/galeri77_serit.py $O/paket                 # kenar tasmasi olcumu (01, 05, 15-19)
                  echo "ORNEK: TEMP/$ORNEK/$C/ | $(tail -1 $O/QC.txt) | $(rclone link "$ORN" 2>/dev/null)"
                  [ -z "$hata" ] && TAMAM=$((TAMAM+1))
                else
                  hata="ornek galeri QC FAIL"; tail -4 _work/cift_$C.txt; grep -h "FAIL" $O/QC.txt 2>/dev/null | cut -c1-300 | head -8
                  [ -f $O/QC.txt ] && rclone copy $O/QC.txt "$ORN" -q
                fi
              fi
              if [ -n "$hata" ]; then FAIL+=("$C: $hata"); echo "::warning::$C ornek: $hata"; fi
              echo "[$n/$N] $C ornek ${hata:-OK}"; continue
            fi
            if [ -z "$hata" ] && [ "$MOD" = "tam" ] && [ $WPV = 0 ] && [ "$YENIDEN" != "evet" ] \
               && [ -n "$(rclone lsf "$G/_WPBEKLE/$C.txt" 2>/dev/null)" ]; then
              # Serdar 30 Eyl: galeri WP'yi beklemez; 17 gorsel QC PASS cift HAZIR'a set=17 ile girer (yeniden uretmeden)
              ADET=$(rclone lsf "$G/$C" --include "*.jpg" | wc -l)
              QSON=$(rclone cat "$G/_QC/$C/QC.txt" 2>/dev/null | tail -1)
              if [ "$ADET" = 17 ] && [[ "$QSON" == *"17 gorsel"*"| PASS" ]]; then
                satir17; echo "[$n/$N] $C: 17 gorsel QC PASS, HAZIR set=17 (WP bekliyor)"; BEKLE=$((BEKLE+1)); continue
              fi
              echo "$C: _WPBEKLE var ama Drive'da $ADET gorsel / QC '$QSON' -> yeniden uretilir"
            fi
            if [ -z "$hata" ] && [ "$MOD" = "tam" ]; then
              O=_work/out/$C
              if bash scripts/pod/galeri77_cift.sh "$C" $Y $O > _work/cift_$C.txt 2>&1; then
                rclone sync $O/paket "$G/$C" -q
                rclone copy $O/QC.txt "$G/_QC/$C" -q; rclone copy $O/TEMAS_$C.jpg "$G/_QC/$C" -q; rclone copy $O/KUR.txt "$G/_QC/$C" -q
                ADET=$(rclone lsf "$G/$C" --include "*.jpg" | wc -l)
                if [ $WPV = 0 ]; then
                  # WP bekliyor: 17 gorsel Drive'da, HAZIR satiri YOK (etsy yuklemez)
                  [ "$ADET" = 17 ] || hata="Drive'da $ADET gorsel (17 bekleniyor)"
                  if [ -z "$hata" ]; then
                    echo "17 gorsel QC PASS $(date -u +%Y%m%d_%H%M)" | rclone rcat "$G/_WPBEKLE/$C.txt"
                    satir17; BEKLE=$((BEKLE+1))      # Serdar 30 Eyl: set=17 HAZIR satiri; WP PASS gelince set=19
                  else
                    rclone deletefile "$G/_HAZIR/$C.csv" -q 2>/dev/null
                  fi
                else
                  LID=$(awk -F, -v c="$C" '$2==c{print $1}' data/pod/pod78_ids.csv)
                  PWT=$(python3 -c "import json;l=json.load(open('$Y/PW_KAYNAK.json'));print(l[0]['ModTime'][:19] if l else '')" 2>/dev/null)
                  [ "$ADET" = 19 ] || hata="Drive'da $ADET gorsel"
                  if [ -z "$hata" ]; then
                    WPK=$(cat $Y/WP_KOD.txt 2>/dev/null || echo hat)
                    printf '%s,%s,TEMP/GALERI_77/%s/,19,PASS,%s,%s,%s,19\n' "$C" "$LID" "$C" "$(date -u +%Y%m%d_%H%M)" "$WPK" "$PWT" | rclone rcat "$G/_HAZIR/$C.csv"
                    rclone deletefile "$G/_WPBEKLE/$C.txt" -q 2>/dev/null
                    bash scripts/pod/galeri77_hazir.sh; TAMAM=$((TAMAM+1))
                  fi
                fi
              else
                hata="galeri QC FAIL"; tail -4 _work/cift_$C.txt; grep -h "FAIL" $O/QC.txt 2>/dev/null | cut -c1-300 | head -8
                [ -f $O/QC.txt ] && rclone copy $O/QC.txt "$G/_QC/$C" -q
                rclone deletefile "$G/_HAZIR/$C.csv" -q 2>/dev/null
              fi
            fi
            if [ -n "$hata" ]; then FAIL+=("$C: $hata"); echo "::warning::$C atlandi: $hata"; fi
            g=$(( $(date +%s) - t0 ))
            echo "[$n/$N] $C ${hata:-OK} | gecen ${g}s | kalan ~$(( g * (N - n) / n ))s | %$(( n * 100 / N ))"
          done
          echo "== parca $PARCA: set=19 $TAMAM | set=17 (WP bekliyor) $BEKLE | FAIL ${#FAIL[@]}"; printf '%s\n' "${FAIL[@]}"
          exit 0
      - if: always()
        run: rm -rf ~/.config/rclone

  son:
    needs: uret
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: HAZIR.csv + ozet
        run: |
          set -euo pipefail
          bash scripts/pod/galeri77_hazir.sh
          G=gdrive:ASTROLOVE/TEMP/GALERI_77
          echo "GALERI_77 linki: $(rclone link "$G" 2>/dev/null || echo -)"
          echo "QC linki: $(rclone link "$G/_QC" 2>/dev/null || echo -)"
      - if: always()
        run: rm -rf ~/.config/rclone

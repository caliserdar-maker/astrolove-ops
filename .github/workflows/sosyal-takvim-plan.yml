name: sosyal-takvim-plan
# Sosyal takvim PLANI (SALT OKUMA, 20 Eki 2026): Metricool'a YAZMA YOK. scripts/sosyal/analiz/takvim_plan.py:
# bekleyen IG/FB/Threads/TikTok/YouTube gonderileri -> haftada 3 poster / 2 kupa / 2 yil donumu sirasi, kaydirma + bos yerler,
# kupa/yil donumu ciftleri (CANCER_LIBRA + Ads 23 Eyl ilk 3 poster cifti), hedef ilan ID, metin sablonu.
# Girdi (Drive, yalniz okuma): AstroLove_Ads_546_20260923.json, KUPA_TASLAK_LISTE.csv, BY78_TASLAKLAR.csv.
# Cikti Drive TEMP/SOSYAL_TAKVIM_PLAN_20261020/ (PLAN.csv, PLAN_GUN_ADINA_GORE.csv, OZET.txt, METIN_SABLON.txt).
permissions:
  contents: read
on:
  workflow_dispatch:
jobs:
  oku:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      O: gdrive:ASTROLOVE/TEMP/SOSYAL_TAKVIM_PLAN_20261020
    steps:
      - uses: actions/checkout@v4
      - name: rclone + token
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          mkdir -p ~/.config/rclone _work _out; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Analiz (yalniz GET)
        env:
          MC_TOK: ${{ secrets.METRICOOL_USER_TOKEN }}
        run: |
          set -uo pipefail
          umask 077
          [ -n "${MC_TOK:-}" ] || { echo "::error::METRICOOL_USER_TOKEN bos"; exit 1; }
          echo "::add-mask::$MC_TOK"
          rclone copyto "gdrive:ASTROLOVE/TEMP/METRICOOL_TOKEN.json" _work/kimlik.json
          python3 -c "import json,os;d=json.load(open('_work/kimlik.json'));json.dump({'userToken':os.environ['MC_TOK'],'userId':d['userId'],'blogId':d['blogId']},open('_work/mc.json','w'))"
          python3 -c "import json;print('::add-mask::'+json.load(open('_work/kimlik.json'))['userToken'])"
          mkdir -p _work/g
          rclone copyto "gdrive,root_folder_id=1MOoFVV_VFqxD1i-QCAMopB57lonQK0Tw:AstroLove_Ads_546_20260923.json" _work/g/ads.json
          rclone copyto "gdrive:ASTROLOVE/TEMP/KUPA_ORCHARD_TASLAK_20261019/KUPA_TASLAK_LISTE.csv" _work/g/kupa.csv
          rclone copyto "gdrive:ASTROLOVE/TEMP/BY78_TASLAK_20261014/BY78_TASLAKLAR.csv" _work/g/by.csv
          ls -l _work/g
          python3 scripts/sosyal/analiz/takvim_plan.py _work/mc.json _out --ads _work/g/ads.json --kupa _work/g/kupa.csv --by _work/g/by.csv --pod78 data/pod/pod78_ids.csv | python3 scripts/guvenlik/sir_koru.py tee --sir-json _work/mc.json --sir-json _work/kimlik.json "$GITHUB_STEP_SUMMARY"
          rc=${PIPESTATUS[0]}
          mkdir -p _work/engel
          find _out -type f | while read -r f; do
            python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/mc.json --sir-json _work/kimlik.json "$f" >/dev/null 2>&1 \
              || { echo "TARAMA GECMEDI (Drive'a gitmez): $(basename "$f")"; mv "$f" _work/engel/; }
          done
          python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/mc.json --sir-json _work/kimlik.json _out || exit 1
          rclone copy _out "$O" -q
          rclone lsl "$O" | python3 scripts/guvenlik/sir_koru.py tee --sir-json _work/mc.json "$GITHUB_STEP_SUMMARY"
          exit $rc
      - if: always()
        run: |
          rm -rf _work ~/.config/rclone
          if [ -f "$RUNNER_TEMP/SIR_ENGEL" ]; then echo "::error::sir iceren satir engellendi (sir_koru)"; exit 1; fi

name: printify-kupa-oku
# GECICI (15 Eki 2026, Serdar onayi): Printify kazimali kupa KATALOG okuma (blueprint 10669). YALNIZ GET /catalog.
# Urun / taslak / siparis / yukleme YOK. Anahtar Drive TEMP/PRINTIFY_API_KEY (Google Doc, txt olarak okunur); is bitince
# anahtar Drive'dan silinir ve bu dosya main'den kaldirilir. Zamanlama YOK.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oku:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Kurulum
        run: |
          set -euo pipefail
          pip install -q requests==2.32.3
          curl -fsSL -o /tmp/rc.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip || curl -fsSL -o /tmp/rc.zip https://github.com/rclone/rclone/releases/download/v1.68.2/rclone-v1.68.2-linux-amd64.zip
          unzip -q -j /tmp/rc.zip '*/rclone' -d /tmp/rcb && sudo install -m 755 /tmp/rcb/rclone /usr/local/bin/rclone
          python3 -m py_compile scripts/printify/printify_kupa_oku.py
          ! grep -nE "\.(post|put|patch|delete)\(|requests\.(post|put|patch|delete)" scripts/printify/printify_kupa_oku.py
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true; fi
      - name: Katalog oku (yalniz GET)
        run: |
          set +e -uo pipefail
          umask 077; mkdir -p _out
          K=$(rclone cat --drive-export-formats txt "gdrive,root_folder_id=12N9iS2i4byMbkH5c0Inmni_nIv2zyTzH:PRINTIFY_API_KEY.txt" | python3 -c "import sys;print(sys.stdin.read().replace('﻿','').strip())")
          echo "::add-mask::$K"; [ -n "$K" ] || { echo "::error::anahtar bos"; exit 1; }
          PRINTIFY_API_KEY="$K" python3 scripts/printify/printify_kupa_oku.py _out 2>&1 | tee _out/LOG.txt
          if grep -rqF "$K" _out; then echo "::error::ciktida anahtar var, Drive'a yazilmaz"; rm -rf _out; exit 1; fi
          echo "anahtar cikti taramasi temiz"
      - name: Drive'a yaz
        if: ${{ always() }}
        run: |
          set +e -uo pipefail
          [ -d _out ] && rclone copy _out "gdrive,root_folder_id=12N9iS2i4byMbkH5c0Inmni_nIv2zyTzH:KUPA_PRINTIFY_WAYLAND_20261015" -q && echo "Drive: TEMP/KUPA_PRINTIFY_WAYLAND_20261015"
      - name: Anahtari Drive'dan sil (her zaman)
        if: ${{ always() }}
        run: |
          set +e
          rclone deletefile --drive-export-formats txt "gdrive,root_folder_id=12N9iS2i4byMbkH5c0Inmni_nIv2zyTzH:PRINTIFY_API_KEY.txt" && echo "anahtar dosyasi cope atildi"
          rm -rf _out ~/.config/rclone

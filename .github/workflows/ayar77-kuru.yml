name: ayar77-kuru

# AYAR77 KURU KOSU (SALT OKUMA; Etsy'ye yazma YOK): 77 POD ilani x CL (4570143815) canli referansi,
# alan bazinda "simdiki -> yeni" fark tablosu + 77 aciklama dosyasi. Cikti: Drive TEMP/AYAR77_KURU_<damga>/.
# Yazma adimi bu workflow'da YOK; Serdar onayindan sonra ayri kosu.

permissions:
  actions: read
  contents: read

on:
  workflow_dispatch: {}


jobs:
  kuru:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Token + OAS
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
          curl -fsSL -o _work/oas.json https://www.etsy.com/openapi/generated/oas/3.0.0.json || echo "OAS indirilemedi (rapor eksik kalir)"
      - name: Oz-test (sahte API)
        run: python scripts/pod/test_ayar77_kuru.py
      - name: Kuru kosu (salt okuma)
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: python scripts/pod/ayar77_kuru.py --out _out --oas _work/oas.json
      - name: Token + cikti Drive'a
        if: ${{ always() }}
        run: |
          set -euo pipefail
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "Token geri yazildi" || true
          if grep -rqE 'x-api-key|refresh_token|"access_token"|::add-mask::' _out/ 2>/dev/null; then
            echo "::error::ciktida sir benzeri icerik; Drive'a yazilmadi"; exit 1
          fi
          stamp=$(date -u +%Y%m%d_%H%M)
          [ -d _out ] && rclone copy _out "gdrive:ASTROLOVE/TEMP/AYAR77_KURU_${stamp}" -q && echo "Cikti: TEMP/AYAR77_KURU_${stamp}/"
          [ -f _out/OZET.md ] && head -12 _out/OZET.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Temizlik
        if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

name: pasif-sure-oku

# SALT OKUMA (Serdar 22 Eki, BAG EDISYONLARI kontrol paketi madde 2-3): pasif (inactive + expired) ilanlarin sure durumu
# (ending_timestamp; suresi gecmis -> yeniden acmada 0,20 USD) + referans ilan gorseli (varsayilan 4570143815 #3).
# Etsy'ye yazma YOK. Cikti yalniz Drive DENETIM_20261021/BAG_EDISYON/<run_id>/.

permissions:
  actions: read
  contents: read

on:
  workflow_dispatch:
    inputs:
      gorsel: {description: "LISTING_ID:RANK", required: false, default: "4570143815:3"}

env:
  D: "gdrive:ASTROLOVE/TEMP/DENETIM_20261021/BAG_EDISYON/${{ github.run_id }}"

jobs:
  oku:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf + token
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
          mkdir -p _work _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
      - name: Oku
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          GORSEL: ${{ inputs.gorsel }}
        run: |
          [[ "$GORSEL" =~ ^([0-9]+:[0-9]+)?$ ]] || { echo "::error::gorsel bicimi"; exit 1; }
          python3 scripts/etsy/pasif_sure_oku.py --out _out --gorsel "$GORSEL"
      - name: Token geri yaz + cikti Drive'a
        if: always()
        run: |
          set -euo pipefail
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "Token geri yazildi" || echo "Token yenilenmedi"
          python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/ETSY_TOKEN.json _out || { echo "::error::ciktida sir"; exit 1; }
          rclone copy _out "$D" -q && echo "cikti: DENETIM_20261021/BAG_EDISYON/${GITHUB_RUN_ID}"
      - if: always()
        run: rm -rf _work ~/.config/rclone

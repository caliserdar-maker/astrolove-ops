name: sosyal-kapak

# Video kapagi v1 (Serdar onayli tasarim, 13 Eki 2026; sosyal/kapak_v1, tasarima dokunulmaz).
# 1) 78 poster (pin-v6 _POSTER2000, video ve IG ile ayni kaynak) -> kapak_toplu.py: once GEMINI_LEO onayli ornekle
#    (ortalama fark <= 2.5, degilse DUR), sonra 78 kapak + QC.csv + KONTAK.jpg -> Drive VIDEO_V9_20261012/KAPAK
# 2) Metricool: 1 kapak S3 (planner) yukleme testi, GONDERI YOK. Facebook/YouTube icin yalniz okuma kontrolu.
# 3) Plan: 77 gun (GEMINI_LEO haric) + kapak sutunu; metricool_5p_yaz.py --gunler 2-78 --mod kuru (Metricool'a YAZMA YOK)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      s3_test:
        type: boolean
        default: true
      yalniz_s3:
        description: "true = yalniz kapak S3 testi (kapaklar Drive KAPAK'tan alinir, uretim/plan yok)"
        type: boolean
        default: false

jobs:
  kapak:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      P: gdrive:ASTROLOVE/TEMP/PIN_V6_20261012/_POSTER2000
      KD: gdrive:ASTROLOVE/TEMP/VIDEO_V9_20261012/KAPAK
      K: gdrive:ASTROLOVE/TEMP/IG_V6_20261012/KARUSEL
      V: gdrive:ASTROLOVE/TEMP/VIDEO_V9_20261012/FINAL
      O: gdrive:ASTROLOVE/TEMP/SOSYAL_PLAN_20261012
      URL_KOK: https://caliserdar-maker.github.io/astrolove-media/instagram/v6
    steps:
      - uses: actions/checkout@v4
      - name: Paketler
        run: pip install -q numpy==2.1.3 pillow==11.0.0 scipy==1.14.1 opencv-python-headless==4.10.0.84
      - name: rclone + token
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            export RCLONE_CONFIG_GDRIVE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET"
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
          mkdir -p _work _out _o/KAPAK
          rclone copyto "gdrive:ASTROLOVE/TEMP/METRICOOL_TOKEN.json" _work/mc.json
          python3 -c "import json;print('::add-mask::'+json.load(open('_work/mc.json'))['userToken'])"
          rclone copyto "gdrive:ASTROLOVE/TEMP/ig_token.json" _work/ig.json || true
          [ -f _work/ig.json ] && python3 -c "import json;print('::add-mask::'+json.load(open('_work/ig.json'))['token'])" || true

      - name: Posterler (78, 2000x3000)
        if: ${{ inputs.yalniz_s3 != true }}
        run: |
          set -euo pipefail
          mkdir -p _w/P2000
          rclone copy "$P" _w/P2000 -q --transfers 8 --include "*.jpg"
          python3 -c "
          import glob,sys
          from PIL import Image
          f=glob.glob('_w/P2000/*.jpg'); bad=[p for p in f if Image.open(p).size!=(2000,3000)]
          print('POSTER', len(f), 'olcu disi', len(bad), bad[:3]); sys.exit(1 if len(f)!=78 or bad else 0)"

      - name: 78 kapak (once GEMINI_LEO onayli karsilastirma)
        if: ${{ inputs.yalniz_s3 != true }}
        run: |
          set -uo pipefail
          python3 sosyal/kapak_v1/kapak_toplu.py --posters _w/P2000 --out _o/KAPAK --esik 2.5 | tee -a "$GITHUB_STEP_SUMMARY"
          rc=${PIPESTATUS[0]}
          rclone copy _o/KAPAK "$KD" -q --transfers 8
          rclone lsjson "$KD" --files-only > _out/KAPAK.json
          python3 -c "import json;x=json.load(open('_out/KAPAK.json'));print('Drive KAPAK', sum(e['Name'].endswith('-kapak.jpg') for e in x), 'kapak +', [e['Name'] for e in x if not e['Name'].endswith('-kapak.jpg')])" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Metricool kapak S3 testi (1 kapak, gonderi YOK)
        if: ${{ inputs.s3_test == true }}
        run: |
          set -uo pipefail
          [ -f _o/KAPAK/aquarius-and-aquarius-astroloveart-kapak.jpg ] || rclone copyto "$KD/aquarius-and-aquarius-astroloveart-kapak.jpg" _o/KAPAK/aquarius-and-aquarius-astroloveart-kapak.jpg
          python3 scripts/sosyal/metricool_s3_test.py _work/mc.json _o/KAPAK/aquarius-and-aquarius-astroloveart-kapak.jpg _out/KAPAK_S3_TEST.json | tee -a "$GITHUB_STEP_SUMMARY"
          rc=${PIPESTATUS[0]}
          rclone copy _out "$O" --include "KAPAK_S3_TEST.json"
          grep -q '"sonuc": "OK"' _out/KAPAK_S3_TEST.json && exit $rc || exit 1

      - name: Facebook / YouTube kapak (yalniz okuma)
        if: ${{ inputs.yalniz_s3 != true }}
        run: |
          set -uo pipefail
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import importlib.util, json, os, urllib.request, urllib.parse
          sp = importlib.util.spec_from_file_location('mpb', 'scripts/sosyal/metricool_pin_baslik.py')
          mpb = importlib.util.module_from_spec(sp); sp.loader.exec_module(mpb)
          mc = mpb.MC(json.load(open('_work/mc.json')))
          ps = mpb.veri(mc.istek('GET', '/v2/scheduler/posts', {'start': '2026-10-12T20:00:00', 'end': '2026-10-13T06:00:00',
                                                               'timezone': 'Europe/Istanbul'})) or []
          for p in ps:
              n = [x.get('network') for x in p.get('providers') or []]
              pr = [{k: x.get(k) for k in ('network', 'status', 'publicUrl', 'id', 'detailedStatus') if x.get(k)} for x in p.get('providers') or []]
              print('GEMINI_LEO', p.get('id'), (p.get('publicationDate') or {}).get('dateTime'), n, json.dumps(pr)[:300],
                    'videoThumbnailUrl' if p.get('videoThumbnailUrl') else '', p.get('videoCoverMilliseconds'))
          if os.path.exists('_work/ig.json'):
              t = json.load(open('_work/ig.json'))['token']
              for yol in ('me?fields=id,name', 'me/permissions'):
                  try:
                      with urllib.request.urlopen(f'https://graph.facebook.com/v21.0/{yol}&access_token={urllib.parse.quote(t)}'.replace('permissions&', 'permissions?'), timeout=30) as r:
                          print('GRAPH', yol, r.read()[:600].decode())
                  except Exception as e:
                      print('GRAPH', yol, 'HATA', getattr(e, 'code', ''), (e.read()[:300].decode() if hasattr(e, 'read') else str(e))[:300])
          EOF

      - name: Plan 77 gun + kapak (KURU, Metricool'a yazma yok)
        if: ${{ inputs.yalniz_s3 != true }}
        run: |
          set -uo pipefail
          rclone lsjson -R "$K" --no-modtime > _out/KARUSEL.json
          rclone lsjson "$V" --files-only --no-modtime > _out/VIDEO.json
          python3 scripts/sosyal/plan_5p.py --metin-dir data/sosyal/metin --karusel _out/KARUSEL.json --video _out/VIDEO.json \
            --kapak _out/KAPAK.json --url-kok "$URL_KOK" --baslangic 2026-10-12 --cikti _out/PLAN_TUM.csv | tee -a "$GITHUB_STEP_SUMMARY"
          r1=${PIPESTATUS[0]}
          python3 -c "
          import csv
          r=list(csv.DictReader(open('_out/PLAN_TUM.csv',encoding='utf-8'))); s=[x for x in r if x['cift']!='GEMINI_LEO']
          w=csv.DictWriter(open('_out/PLAN_5_PLATFORM.csv','w',newline='',encoding='utf-8'),fieldnames=list(r[0]),lineterminator='\n'); w.writeheader(); w.writerows(s)
          print('PLAN_5_PLATFORM.csv', len(s), 'satir (GEMINI_LEO haric)', s[0]['tarih_saat'], '->', s[-1]['tarih_saat'])" | tee -a "$GITHUB_STEP_SUMMARY"
          python3 scripts/sosyal/metricool_5p_yaz.py --token-dosya _work/mc.json --plan _out/PLAN_5_PLATFORM.csv --gunler 2-78 \
            --kapak-dir _o/KAPAK --mod kuru --cikti _out 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          r2=${PIPESTATUS[0]}
          rclone copy _out "$O" --include "PLAN_5_PLATFORM.csv" --include "KURU_2-78.json" --include "KAPAK_S3_TEST.json"
          rclone lsl "$O" --include "PLAN_5_PLATFORM.csv" --include "KURU_2-78.json" --include "KAPAK_S3_TEST.json" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $(( r1 + r2 ))

      - if: always()
        run: rm -rf _work ~/.config/rclone

name: ornament-galeri9-etsy
# ORNAMENT 78 TASLAK galeri degisimi v9 (Serdar 7-8 Kas: "Evet, degistir", "5 stil gorseli uretilecek", "Gevsetme: 78 gece").
# Kod scripts/etsy/ornament_galeri9.py (+ test_ornament_galeri9.py). YAYIN YOK; PATCH yalniz acil state=inactive; DELETE yalniz yedekteki eski
# gorsel / video id'leri.
# mod=yedek : SALT OKUMA, taslaklarin galeri / video / stil baglari -> Drive TEMP/ORNAMENT_GALERI9_ETSY/YEDEK9.json (+ damgali kopya);
#             var olan YEDEK9 kaydi ezilmez, yalniz eksik ciftler eklenir. Pilot: CANCER_LIBRA DURUM9 "tamam" olmadan baska cift yazilmaz.
# mod=kuru  : AG/TOKEN YOK; YEDEK9'dan taklit, gonderilecek istekler KURU_<CIFT>.json
# mod=yaz   : cift basina eski 11 gorsel + video -> yeni 14 gorsel + video, stil baglari 10-14, tam geri okuma; DURUM9.json kalici
# Galeri: Drive ASTROLOVE/TEMP/<galeri>/<CIFT>/ (ornament-galeri9 ciktisi, OLCUM PASS zorunlu).
permissions:
  actions: read
  contents: read
on:
  workflow_dispatch:
    inputs:
      mod: { description: "yedek | kuru | yaz", required: true, default: "yedek" }
      ciftler: { description: "TUMU ya da virgul/bosluk ayrimli CIFT", required: true, default: "CANCER_LIBRA" }
      galeri: { description: "Drive ASTROLOVE/TEMP/<galeri> (ORNAMENT_GALERI9_...)", required: false, default: "" }
      sembol_karti: { description: "15. gorsel sembol karti dahil (Serdar gorsel onayi sonrasi)", type: boolean, default: false }
env:
  O: "gdrive:ASTROLOVE/TEMP/ORNAMENT_GALERI9_ETSY"
  SEMBOL_KARTI: ${{ inputs.sembol_karti && '1' || '0' }}
jobs:
  g9:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - name: Girdi kapisi
        env: { M: "${{ inputs.mod }}", C: "${{ inputs.ciftler }}", G: "${{ inputs.galeri }}" }
        run: |
          [[ "$M" =~ ^(yedek|kuru|yaz)$ ]] || { echo "::error::mod"; exit 1; }
          [[ "$C" =~ ^[A-Z_,\ ]+$ ]] || { echo "::error::ciftler"; exit 1; }
          [[ -z "$G" || "$G" =~ ^ORNAMENT_GALERI9_[A-Za-z0-9_]+$ ]] || { echo "::error::galeri (ORNAMENT_GALERI9_...)"; exit 1; }
          if [[ "$M" =~ ^(kuru|yaz)$ && -z "$G" ]]; then echo "::error::galeri gerekli"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Kurulum + testler
        run: |
          set -euo pipefail
          pip install -q requests==2.34.2 pillow==11.0.0
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || sudo apt-get install -y -qq rclone >/dev/null
          python3 scripts/etsy/test_ornament_galeri9.py
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"; echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Galeri + video (kuru, yaz; kilitsiz)
        if: ${{ inputs.mod == 'kuru' || inputs.mod == 'yaz' }}
        env:
          C: ${{ inputs.ciftler }}
          G: ${{ inputs.galeri }}
        run: |
          set -euo pipefail
          L=$(cd scripts/etsy && python3 -c 'import os, ornament_galeri9 as k; print(" ".join(k.cift_listesi(os.environ["C"])))')
          n=0; t0=$(date +%s); top=$(echo $L | wc -w); mkdir -p _img
          for c in $L; do
            rclone copy "gdrive:ASTROLOVE/TEMP/$G/$c" "_img/$c" --include "*_[01][0-9]_*.jpg" --include "*_VIDEO.mp4" --include "*_OLCUM.json" --transfers 8 -q
            n=$((n+1)); g=$(( $(date +%s)-t0 )); echo "indir [$n/$top] $c $(ls _img/$c | wc -l) dosya | gecen $g sn | kalan ~$(( g*(top-n)/n )) sn | %$((100*n/top))"
            B=$([ "$SEMBOL_KARTI" = 1 ] && echo 17 || echo 16)
            [ "$(ls _img/$c | wc -l)" -ge "$B" ] || echo "::warning::$c medya $(ls _img/$c | wc -l) ($B olmali; ilan DUR-ON ile atlanir)"
          done
      - name: Etsy kilidi (sira bekle, iptal yok; token indirmeden ONCE)
        if: ${{ inputs.mod != 'kuru' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/etsy/kilit_bekle.py
          echo "KILIT_T0=$(date +%s)" >> "$GITHUB_ENV"
      - name: Token + yedek + DURUM9
        env: { M: "${{ inputs.mod }}" }
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out
          echo "DAMGA=$(date -u +%Y%m%d_%H%M%S)" >> "$GITHUB_ENV"
          if [ "$M" != "kuru" ]; then rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json; fi
          if [ "$M" = "yedek" ]; then rclone copyto "gdrive:ASTROLOVE/TEMP/ORNAMENT_TASLAK/DURUM.json" _work/TASLAK_DURUM.json
            rclone copyto "$O/YEDEK9.json" _work/YEDEK_ONCEKI.json 2>/dev/null && echo "onceki YEDEK9 korunur" || echo "onceki YEDEK9 yok"; fi
          if [ "$M" != "yedek" ]; then rclone copyto "$O/YEDEK9.json" _work/YEDEK9.json || { echo "::error::YEDEK9.json yok (once mod=yedek)"; exit 1; }; fi
          if [ "$M" = "yaz" ]; then
            V=$(rclone lsf "$O" --files-only --include DURUM9.json) || { echo "::error::Drive okunamadi"; exit 1; }
            case "$V" in
              "") echo "DURUM9.json yok (ilk yaz kosusu)";;
              DURUM9.json) rclone copyto "$O/DURUM9.json" _out/DURUM9.json; python3 -c 'import json; json.load(open("_out/DURUM9.json"))';;
              *) echo "::error::DURUM9.json beklenmeyen liste: $V"; exit 1;;
            esac
          fi
      - name: Kos
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          TASLAK_DURUM: _work/TASLAK_DURUM.json
          YEDEK: _work/YEDEK9.json
          YEDEK_ONCEKI: _work/YEDEK_ONCEKI.json
          OUT: _out
          IMG_ROOT: _img
          C: ${{ inputs.ciftler }}
          M: ${{ inputs.mod }}
        run: python3 scripts/etsy/ornament_galeri9.py --mod "$M" --ciftler "$C"
      - name: Token geri yaz + YEDEK / DURUM9 + cikti Drive'a
        if: ${{ always() }}
        env: { M: "${{ inputs.mod }}" }
        run: |
          set +e
          TOKEN_RC=0; OUT_RC=0; D_RC=0
          if [ -f _work/ETSY_TOKEN.json ]; then bash scripts/etsy/token_geri_yaz.sh || TOKEN_RC=1; fi
          if [ "$M" = "yedek" ] && [ -f _out/YEDEK9.json ]; then
            rclone copyto _out/YEDEK9.json "$O/YEDEK9.json" -q && rclone copyto _out/YEDEK9.json "$O/yedek_${DAMGA:?}/YEDEK9.json" -q || D_RC=1
          fi
          if [ "$M" = "yaz" ] && [ -f _out/DURUM9.json ]; then
            python3 -c 'import json,re,sys; t=open("_out/DURUM9.json").read(); json.loads(t); sys.exit(1 if re.search(r"(token|secret|Bearer)",t,re.I) else 0)' \
              && rclone copyto _out/DURUM9.json "$O/DURUM9.json" -q || D_RC=1
          fi
          if ls _out/* >/dev/null 2>&1; then
            SIR_OK=1
            if [ -f _work/ETSY_TOKEN.json ]; then python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/ETSY_TOKEN.json _out || { echo "::error::ciktida sir"; SIR_OK=0; OUT_RC=1; }; fi
            if [ "$SIR_OK" = 1 ]; then rclone copy _out "$O/${M}_${DAMGA:?}" -q || OUT_RC=1
              echo "Cikti: TEMP/ORNAMENT_GALERI9_ETSY/${M}_$DAMGA" | tee -a "$GITHUB_STEP_SUMMARY"; fi
          fi
          [ "$D_RC" = 0 ] || echo "::error::YEDEK9 / DURUM9 Drive'a yazilamadi"
          [ "$TOKEN_RC" = 0 ] && [ "$OUT_RC" = 0 ] && [ "$D_RC" = 0 ] || exit 1
      - if: always()
        run: rm -rf _work _out _img ~/.config/rclone

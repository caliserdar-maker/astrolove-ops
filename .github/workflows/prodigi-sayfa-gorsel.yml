name: prodigi-sayfa-gorsel

# Prodigi urun sayfalarindaki gorselleri indirir (salt okuma; Prodigi API/anahtar YOK, Etsy YOK).
# Cikti: Drive TEMP/PRODIGI/CLASSIC_GORSEL/<stamp>/ (gorseller, index.csv, KONTAK_*.jpg, sayfa html)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      urls: {description: "bosluklu URL listesi", required: true, default: "https://www.prodigi.com/products/wall-art/framed-prints/classic-frames/"}
      azami: {description: "en fazla gorsel", required: true, default: "120"}

jobs:
  indir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2 pillow
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Indir
        env:
          URLS: ${{ inputs.urls }}
          AZAMI: ${{ inputs.azami }}
        run: |
          set -euo pipefail
          python scripts/prodigi/sayfa_gorsel_indir.py --out _out --azami "$AZAMI" $URLS
      - name: Drive'a yaz
        if: ${{ always() }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y%m%d_%H%M)
          [ -d _out ] && rclone copy _out "gdrive:ASTROLOVE/TEMP/PRODIGI/CLASSIC_GORSEL/$STAMP" -q || true
          echo "Drive: TEMP/PRODIGI/CLASSIC_GORSEL/$STAMP"
          rm -rf ~/.config/rclone

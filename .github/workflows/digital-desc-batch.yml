name: digital-desc-batch

# Onaylanan dijital aciklamayi kalan dijital ilanlara uygular (Mo 14 Eyl 2026).
# Ilan basina yalniz uc sey degisir: acilis cumlesindeki iki burc adi (basliktan
# dogrulanir), THE ARTWORK'teki edisyon cumlesi ve PREFER IT READY TO HANG'deki
# POD linki (DIGITAL_POD_MAP.csv). Yedek -> yalniz description PATCH -> geri okuma.
# Kota tabaninin altina inince DURUR; durum CSV'si her ilanda Drive'a yazilir, bir
# sonraki kosu kaldigi yerden devam eder.

permissions:
  contents: read

on:
  schedule:
    # Her 4 saatte bir (gunde 6 kez). Etsy kotasi kayan 24 saatlik pencere (15 Eyl
    # 2026 olcumu: 05:15 UTC'de hala 26 kalmisti), o yuzden sabit saat yerine sik
    # deneme: betik kosu basinda 1 cagrilik kota sondasi yapar, taban altindaysa
    # hicbir ilana dokunmadan cikar. Zamanlanmis kosu her zaman APPLY=true calisir;
    # yapacak ilan kalmadiysa Etsy'ye sifir cagriyla cikar (bos kosu).
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "true = Etsy'ye YAZ"
        type: boolean
        default: false
      skip:
        description: "Atlanacak ilan no(lari)"
        required: false
        default: "4552211376"
      limit:
        description: "En fazla N ilan (0 = hepsi)"
        required: false
        default: "0"
      quota_min:
        description: "Kota tabani (bir ilan ~12 cagri)"
        required: false
        default: "30"
      map_dir:
        description: "DIGITAL_POD_MAP klasoru (bos = en yenisi)"
        required: false
        default: ""

concurrency:
  group: etsy-token
  cancel-in-progress: false

jobs:
  desc:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      APPLY: ${{ github.event_name == 'schedule' && 'true' || inputs.apply }}
      SKIP: ${{ inputs.skip || '4552211376' }}
      LIMIT: ${{ inputs.limit || '0' }}
      QMIN: ${{ inputs.quota_min || '30' }}
      MAPDIR: ${{ inputs.map_dir }}
      TPL: scripts/etsy/desc/AQUARIUS_AQUARIUS_DIGITAL_4552211376.txt
      REMOTE: gdrive:ASTROLOVE/TEMP/POD_LISTING/DIGITAL_DESC_STATE.csv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Girdiler + metin kontrolu
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
          dir="$MAPDIR"
          if [ -z "$dir" ]; then
            dir=$(rclone lsf "gdrive:ASTROLOVE/TEMP/POD_LISTING/" --dirs-only | grep '^DIGITAL_POD_MAP_' | sort | tail -1)
            dir="${dir%/}"
          fi
          echo "harita klasoru: $dir"
          rclone copyto "gdrive:ASTROLOVE/TEMP/POD_LISTING/${dir}/DIGITAL_POD_MAP.csv" _work/map.csv
          echo "harita satiri: $(( $(wc -l < _work/map.csv) - 1 ))"
          rclone copyto "$REMOTE" _work/desc_state.csv 2>/dev/null || echo "durum dosyasi yok; yeni baslar"
          python - <<'PY'
          import os, pathlib, sys
          sys.path.insert(0, "scripts/etsy")
          import digital_desc_batch as B
          t = pathlib.Path(os.environ["TPL"]).read_text(encoding="utf-8")
          B.sablon_dogrula(t)
          print(f"sablon: {len(t)} karakter, {t.count(chr(10))+1} satir, ascii disi "
                f"{sorted({c for c in t if ord(c) > 127})}")
          kotu = {c: t.count(c) for c in "—–‒―−" if c in t}
          if kotu:
              raise SystemExit(f"HATA: uzun tire: {kotu}")
          print("capalar tamam:", len(B.TARIF), "edisyon tarifi")
          PY
      - name: 'Aciklama guncelleme (dry-run / apply)'
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          set -euo pipefail
          args=(--map _work/map.csv --template "$TPL" --out _out --state _work/desc_state.csv \
                --state-remote "$REMOTE" --skip "$SKIP" --limit "$LIMIT" --quota-min "$QMIN")
          if [ "$APPLY" = "true" ]; then
            echo "::warning::APPLY: dijital ilanlarda YALNIZ description degisecek"
            args+=(--apply)
          fi
          python scripts/etsy/digital_desc_batch.py "${args[@]}"
      - name: Rapor + Drive
        if: ${{ always() }}
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y%m%d_%H%M)
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "Token geri yazildi" || true
          if [ -f _work/desc_state.csv ]; then
            cp _work/desc_state.csv _out/DIGITAL_DESC_REPORT.csv
            rclone copyto _work/desc_state.csv "$REMOTE"
            python scripts/etsy/desc_report.py _work/desc_state.csv
          fi
          if [ -f _out/DIGITAL_DESC_OZET.json ]; then
            python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          o = json.loads(pathlib.Path("_out/DIGITAL_DESC_OZET.json").read_text())
          print(f"### digital-desc: {o['sonuclar']} | kalan {o.get('kalan')} | kota {o.get('kota')}")
          if o.get("tamamlandi"):
              print("::notice::TAMAMLANDI - tum dijital ilanlar guncel; cron kaldirilabilir.")
          else:
              print(f"::notice::KALAN {o.get('kalan')} ilan - bir sonraki zamanlanmis kosu devam edecek.")
          PY
          fi
          [ -d _out ] && rclone copy _out "gdrive:ASTROLOVE/TEMP/POD_LISTING/DIGITAL_DESC_${stamp}" -q && \
            echo "Cikti: TEMP/POD_LISTING/DIGITAL_DESC_${stamp}/" || true
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: digital-desc-batch
          path: |
            _out/
            _work/desc_state.csv
          if-no-files-found: ignore
      - if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone

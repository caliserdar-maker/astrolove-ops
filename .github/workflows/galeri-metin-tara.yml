name: galeri-metin-tara
# Galeri v11b gorsellerinde boy sayisi yazisi taramasi (Serdar 30 Eki, 5x7 isi madde 4). ETSY API YOK, token yok, kilit yok.
# Girdi: Drive TEMP/POSTER_GALERI_V11_YEDEK/<damga>/<lid>_<CIFT>/r<rank>_<id>.jpg (yedek-oku + indir / dogrula ciktisi; klasor degismez).
# tesseract OCR: "<n> sizes", "thirteen sizes", boy listesi (5x7 var / yok). scripts/kapak78/galeri_metin_tara.py
# Cikti: Drive TEMP/GALERI_METIN_TARA/<damga>/ (TARAMA.csv, OZET.md), --immutable.
# Hiz (30 Eki): OCR oncesi 2000 px gri kucultme (Pillow), isci = cpu sayisi, tesseract OMP_THREAD_LIMIT=1, gorsel basina 90 sn.
# TARAMA.csv gorsel bittikce yazilir, OZET.md her 50 gorselde; tarama adimi kesilirse yukleme (always) kismi sonucu yazar.
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      damga: {description: "TEMP/POSTER_GALERI_V11_YEDEK/<damga> (YYYYMMDD_HHMMSS)", required: true}
      rank: {description: "virgullu rank listesi (orn. 1,3); bos = hepsi", required: false, default: ""}
jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Girdi kapisi
        env: {D: "${{ inputs.damga }}", RK: "${{ inputs.rank }}"}
        run: |
          [[ "$D" =~ ^[0-9]{8}_[0-9]{6}$ ]] || { echo "::error::damga"; exit 1; }
          [[ -z "$RK" || "$RK" =~ ^[0-9]{1,2}(,[0-9]{1,2})*$ ]] || { echo "::error::rank (orn. 1,3)"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y tesseract-ocr >/dev/null
          python3 -m pip install -q pillow==12.3.0
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || { sudo apt-get install -y -qq rclone >/dev/null; }
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Indir + tara (Etsy yok)
        timeout-minutes: 105
        env: {D: "${{ inputs.damga }}", RK: "${{ inputs.rank }}"}
        run: |
          set -euo pipefail
          mkdir -p _y _out
          echo "DAMGA=$(date -u +%Y%m%d_%H%M%S)" >> "$GITHUB_ENV"
          inc=()
          if [ -n "$RK" ]; then IFS=, read -ra R <<< "$RK"; for r in "${R[@]}"; do inc+=(--include "*/r${r}_*.jpg"); done
          else inc=(--include "*/r*.jpg"); fi
          rclone copy "gdrive:ASTROLOVE/TEMP/POSTER_GALERI_V11_YEDEK/$D" _y "${inc[@]}" --transfers 8 -q
          echo "indirilen: $(find _y -name 'r*.jpg' | wc -l) | cpu $(nproc) | rank ${RK:-hepsi}"
          python3 scripts/kapak78/galeri_metin_tara.py --dir _y --out _out --rank "$RK"
          sed -i "s|^kaynak: _y|kaynak: TEMP/POSTER_GALERI_V11_YEDEK/$D|" _out/OZET.md
          head -20 _out/OZET.md >> "$GITHUB_STEP_SUMMARY"
      - name: Drive'a yaz
        if: ${{ always() }}
        env: {D: "${{ inputs.damga }}"}
        run: |
          set -euo pipefail
          if ls _out/* >/dev/null 2>&1; then
            rm -f _out/*.tmp
            [ -f _out/OZET.md ] && sed -i "s|^kaynak: _y$|kaynak: TEMP/POSTER_GALERI_V11_YEDEK/${D}|" _out/OZET.md
            rclone copy _out "gdrive:ASTROLOVE/TEMP/GALERI_METIN_TARA/${DAMGA:?}" --immutable -q
            echo "::notice title=GALERI METIN::TEMP/GALERI_METIN_TARA/${DAMGA}/"
          fi
      - if: always()
        run: rm -rf _y _out ~/.config/rclone

name: video-v7-girdi-dal
# Yerel gelistirme girdisi (Merkez 28 Eki, mesaj silme duzeltmesi). Etsy API YOK; Drive yalniz OKUNUR. Oturum Drive / artifact
# dosyasi indiremiyor (ag politikasi); girdiler ayri git dalina (girdi/v7-<kosu>) yazilir: kapak/KAPAK_<CIFT>.jpg (78, V10),
# video/<CIFT>.mp4 ve log/<CIFT>_uretim.log (secilen ciftler, TAM78 klasorunden).
permissions:
  contents: write
on:
  workflow_dispatch:
    inputs:
      tam78: {description: 'TEMP/VIDEO_V7_DUZELTME/<damga>/TAM78', default: '20261028_100938'}
      ciftler: {description: 'video + log alinacak ciftler (bosluklu)', required: true}
env:
  K: gdrive:ASTROLOVE/TEMP/POSTER_KAPAK_V10/20261026_153710
jobs:
  dal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Girdi
      env: {T: "${{ inputs.tam78 }}", C: "${{ inputs.ciftler }}"}
      run: |
        [[ "$T" =~ ^[0-9]{8}_[0-9]{6}$ ]] || { echo "::error::tam78"; exit 1; }
        for c in $C; do [[ "$c" =~ ^[A-Z]+_[A-Z]+$ ]] || { echo "::error::cift $c"; exit 1; }; done
    - name: rclone
      timeout-minutes: 6
      run: curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
    - name: rclone.conf
      env:
        RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      run: |
        set -euo pipefail
        mkdir -p ~/.config/rclone; umask 077
        printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
        if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "::add-mask::$GOOGLE_CLIENT_SECRET"
          grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true; fi
    - name: Indir + dala yaz
      env: {T: "${{ inputs.tam78 }}", C: "${{ inputs.ciftler }}"}
      run: |
        set -euo pipefail
        mkdir -p _d/kapak _d/video _d/log
        rclone copy "$K" _d/kapak --include "KAPAK_*.jpg" --max-depth 1 --transfers 8 -q
        for c in $C; do
          rclone copyto "gdrive:ASTROLOVE/TEMP/VIDEO_V7_DUZELTME/$T/TAM78/$c.mp4" "_d/video/$c.mp4" -q
          rclone copyto "gdrive:ASTROLOVE/TEMP/VIDEO_V7_DUZELTME/$T/TAM78/LOG/${c}_uretim.log" "_d/log/${c}_uretim.log" -q
        done
        echo "kapak $(ls _d/kapak | wc -l) video $(ls _d/video | wc -l)"; du -sh _d
        D="girdi/v7-$GITHUB_RUN_ID"
        cd _d && git init -q && git checkout -q -b "$D"
        git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A && git commit -q -m "v7 girdi (TAM78 $T)"
        git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$D"
        echo "::notice title=GIRDI::dal $D"
    - if: ${{ always() }}
      run: rm -rf _d ~/.config/rclone

name: metricool-by-metin

# Metricool bekleyen yil donumu (BY) pinlerinde baski vaadi duzeltmesi (Serdar kararlari 21 Eki 2026, PLAN_KARAR A).
# kuru: liste + KURU_DENEME.csv + MEDYA_HOST/MEDYA_DRIVE.csv (yazma YOK) | tek: 1 gonderi PUT + GET | hepsi: kalanlar.
# tek/hepsi onay girdisi SERDAR_PIN_METIN ister. Token: Drive TEMP/METRICOOL_TOKEN.json (loga yazilmaz).
# Cikti: Drive TEMP/PIN_METIN_20261021/<run_id>/ (sahip-yalniz).

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      mod:
        description: "kuru | tek | hepsi"
        type: choice
        options: [kuru, tek, hepsi]
        default: kuru
      onay:
        description: "tek/hepsi icin SERDAR_PIN_METIN"
        required: false
        default: ""

concurrency:
  group: metricool-yazma
  cancel-in-progress: false

jobs:
  metin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      D: gdrive:ASTROLOVE/TEMP/PIN_METIN_20261021/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: rclone + token
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            export RCLONE_CONFIG_GDRIVE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET"
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
          mkdir -p _work
          rclone copyto "gdrive:ASTROLOVE/TEMP/METRICOOL_TOKEN.json" _work/mc.json
          python3 - <<'PY'
          import json
          t = json.load(open('_work/mc.json'))
          print(f"::add-mask::{t['userToken']}")
          print('token alanlari:', sorted(t), 'token uzunlugu', len(t['userToken']))
          PY

      - name: Calistir (${{ inputs.mod }})
        env:
          MOD: ${{ inputs.mod }}
          ONAY: ${{ inputs.onay }}
        run: |
          set -uo pipefail
          python3 scripts/sosyal/metricool_by_metin.py --token-dosya _work/mc.json --mod "$MOD" --onay "$ONAY" --cikti _out 2>&1 \
            | python3 scripts/guvenlik/sir_koru.py tee --sir-json _work/mc.json "$GITHUB_STEP_SUMMARY"
          rc=${PIPESTATUS[0]}
          python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/mc.json _out || exit 1   # sir varsa Drive'a yuklenmez
          rclone copy _out "$D" --include "*.csv" --include "HAM_LISTE.json" 2>&1 | tail -2 || true
          rclone lsl "$D" | python3 scripts/guvenlik/sir_koru.py tee --sir-json _work/mc.json "$GITHUB_STEP_SUMMARY" || true
          exit $rc

      - if: always()
        run: |
          rm -rf _work ~/.config/rclone
          if [ -f "$RUNNER_TEMP/SIR_ENGEL" ]; then echo "::error::sir iceren satir engellendi (sir_koru)"; exit 1; fi

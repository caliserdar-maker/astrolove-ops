name: etsy-kupa-kargo

# "Kupa Free US UK EU" kargo profiline (318301958420) Kanada + Avustralya hedefi (Serdar onayi 20 Eki 2026).
# scripts/etsy/kupa_kargo_ekle.py. mod kuru: SALT OKUMA (profil + 78 kupa ilani + plan) -> YEDEK.json, OZET_KURU.txt.
# mod yaz: ETSY'YE YAZAR (onay KUPA_CA_AU): yedek (Drive dogrulamali) -> POST destinations x2 -> geri okuma -> SONRA.json, OZET.txt.
# Kota tabani 10, cagri siniri 20. Cikti: Drive ASTROLOVE/TEMP/KUPA_KARGO_20261020/.

permissions:
  actions: read
  contents: read

on:
  workflow_dispatch:
    inputs:
      mod: {description: "kuru (salt okuma) | yaz (Etsy'ye yazar)", required: true, default: kuru, type: choice, options: [kuru, yaz]}
      onay: {description: "yaz icin KUPA_CA_AU", required: false, default: ""}
      ca: {description: "Kanada teslim gunu MIN-MAX", required: true, default: "4-7"}
      au: {description: "Avustralya teslim gunu MIN-MAX", required: true, default: "5-9"}

jobs:
  kargo:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      D: gdrive:ASTROLOVE/TEMP/KUPA_KARGO_20261020
    steps:
      - uses: actions/checkout@v4
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Token + kupa ilan listesi
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
          rclone copyto "gdrive:ASTROLOVE/TEMP/KUPA_ORCHARD_TASLAK_20261019/KUPA_TASLAK_LISTE.csv" _work/liste.csv
      - name: Kargo profili (${{ inputs.mod }})
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          MOD: ${{ inputs.mod }}
          ONAY: ${{ inputs.onay }}
          CA: ${{ inputs.ca }}
          AU: ${{ inputs.au }}
        run: |
          set -uo pipefail
          A="--liste _work/liste.csv --ca $CA --au $AU --out out"
          if [ "$MOD" = "yaz" ]; then
            [ "$ONAY" = "KUPA_CA_AU" ] || { echo "::error::onay KUPA_CA_AU degil, yazma yok"; exit 1; }
            rclone copyto "$D/YEDEK.json" _work/YEDEK.json -q || { echo "::error::kuru YEDEK.json yok, yazma yok"; exit 1; }
            python scripts/etsy/kupa_kargo_ekle.py --mod yaz --confirm "$ONAY" --kuru-yedek _work/YEDEK.json --yedek-drive "$D" $A
            rc=$?
            rclone copy out "$D" --include "SONRA.json" --include "OZET.txt" --include "YEDEK_YAZ_ONCE.json" -q
          else
            python scripts/etsy/kupa_kargo_ekle.py --mod kuru $A
            rc=$?
            mv out/OZET.txt out/OZET_KURU.txt 2>/dev/null || true
            if [ -n "$(rclone lsf "$D/YEDEK.json" 2>/dev/null)" ]; then
              rclone copyto out/YEDEK.json "$D/YEDEK_KURU_$(date -u +%H%M).json" -q; echo "YEDEK.json zaten var, ustune yazilmadi"
            else rclone copyto out/YEDEK.json "$D/YEDEK.json" -q; fi
            rclone copyto out/OZET_KURU.txt "$D/OZET_KURU.txt" -q
          fi
          rclone lsl "$D"
          exit $rc
      - name: Token geri yaz
        if: always()
        run: |
          set -euo pipefail
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "Token geri yazildi" || echo "Token yenilenmedi"
      - if: always()
        run: rm -rf _work ~/.config/rclone

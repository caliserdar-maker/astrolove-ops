name: wp-kagit-tara

# WP KAGIT TARAMASI (Serdar onayi 2 Eki, TANI 2/3; salt okur): 78 cift x boy (TANI 3: 16x20, 18x24, 24x36, A2) onayli WARM_PARCHMENT kaynak kagidi vs
# VINTAGE_11x14 plate kagidi (e_kagit tanimi, uretim fonksiyonlari) + Drive koken bilgisi (btime / mtime / md5).
# POD_PRINT ve PLATES salt okunur; cikti yalniz TEMP/WP_KAGIT_TARA/<run_id>/. Isim / musteri / Etsy YOK.
# Tetik: config/wp_kagit_tara.trigger degisikligi (bu dal).

permissions:
  contents: read

on:
  push:
    branches: [claude/wp-katman-baski-60sk0s]
    paths:
      - config/wp_kagit_tara.trigger

concurrency: wp-kagit-tara

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        boy: [16x20, 18x24, 24x36, A2]
    env:
      BOY: ${{ matrix.boy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow opencv-python-headless numpy
      - name: Kilit testi (wp_katman degismedi)
        run: python scripts/medya_v1/test_wp_kilit.py
      - name: Takas (buyuk boy bellek)
        if: ${{ matrix.boy == '24x36' || matrix.boy == 'A2' }}
        run: |
          sudo fallocate -l 32G /mnt/takas3 && sudo chmod 600 /mnt/takas3 && sudo mkswap /mnt/takas3 >/dev/null && sudo swapon /mnt/takas3
          free -g
      - name: rclone kur
        run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONF_B64:-}" ]; then echo "HATA: RCLONE_CONF_B64 yok" >&2; exit 1; fi
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Koken bilgisi + indir (salt okur)
        run: |
          set -euo pipefail
          T0=$(date +%s); mkdir -p out _in/kok
          POD=gdrive:ASTROLOVE/TEMP/POD_PRINT
          rclone lsjson -R -M --hash --files-only "$POD" --include "*/WARM_PARCHMENT/$BOY.jpg" > out/meta_$BOY.json
          rclone copy "$POD" _in/kok --include "*/WARM_PARCHMENT/$BOY.jpg" --transfers 16
          rclone copyto "gdrive:ASTROLOVE/TEMP/SIPARIS_ISIM/PLATES/VINTAGE_$BOY.png" "_in/VINTAGE_$BOY.png"
          echo "SURE indir $BOY $(( $(date +%s) - T0 )) sn"
      - name: Tara
        run: python scripts/medya_v1/wp_kagit_tara.py --boy "$BOY" --kok _in/kok --plate "_in/VINTAGE_$BOY.png" --meta "out/meta_$BOY.json" --cik out
      - name: Tarih ozeti (koken; yalniz dosya kayitlari)
        run: |
          python - <<'PY'
          import json, os
          boy = os.environ['BOY']
          for x in json.load(open(f'out/meta_{boy}.json')):
              if x.get('IsDir') or x['Path'].count('/') < 2:
                  continue
              c = x['Path'].split('/', 1)[0]
              print('KOKEN', boy, c, x['ModTime'][:16], (x.get('Metadata') or {}).get('btime', '')[:16], x.get('Size'))
          PY
      - name: Drive
        if: ${{ always() }}
        run: |
          [ -d out ] && rclone copy out "gdrive:ASTROLOVE/TEMP/WP_KAGIT_TARA/${{ github.run_id }}/" && echo "drive: TEMP/WP_KAGIT_TARA/${{ github.run_id }}/"
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone _in

  kesit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow opencv-python-headless numpy
      - name: rclone kur
        run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONF_B64:-}" ]; then echo "HATA: RCLONE_CONF_B64 yok" >&2; exit 1; fi
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Indir (salt okur)
        run: |
          set -euo pipefail
          mkdir -p _k
          POD=gdrive:ASTROLOVE/TEMP/POD_PRINT
          for c in AQUARIUS_CANCER PISCES_SCORPIO; do rclone copyto "$POD/$c/WARM_PARCHMENT/11x14.jpg" "_k/$c.jpg"; done
          rclone copyto gdrive:ASTROLOVE/TEMP/SIPARIS_ISIM/PLATES/VINTAGE_11x14.png _k/VINTAGE_11x14.png
          # Canva DAHPeYBzqXU disa aktarimi (pod_print_build kaynagi): sayfa 44 = GEMINI_LEO, 45 = GEMINI_LIBRA
          SRC=gdrive:ASTROLOVE/WALL_ART/POSTERS/ORIGINAL_HIGH_RES/WARM_PARCHMENT/11X14
          rclone lsjson -M "$SRC" --files-only --ignore-case --include "GEMINI_LEO.jpg" --include "GEMINI_LIBRA.jpg" > _k/canva_meta.json
          cat _k/canva_meta.json | python -c "import json,sys;[print('CANVA_META',x['Path'],x['ModTime'],x.get('Size')) for x in json.load(sys.stdin)]"
          rclone copy "$SRC" _k/canva --ignore-case --include "GEMINI_LEO.jpg" --include "GEMINI_LIBRA.jpg"
          ls -la _k _k/canva
      - name: Kesit (1:1, yalniz kagit)
        run: |
          set -euo pipefail
          L=$(ls _k/canva | grep -i '^gemini_leo\.jpg$'); B=$(ls _k/canva | grep -i '^gemini_libra\.jpg$')
          python scripts/medya_v1/wp_kagit_tara.py --kok _k --plate _k/VINTAGE_11x14.png --cik out_k --kesit \
            AQUARIUS_CANCER_kaynak=_k/AQUARIUS_CANCER.jpg PISCES_SCORPIO_kaynak=_k/PISCES_SCORPIO.jpg \
            CANVA_s44_GEMINI_LEO=_k/canva/$L CANVA_s45_GEMINI_LIBRA=_k/canva/$B
      - name: Drive
        if: ${{ always() }}
        run: |
          [ -d out_k ] && rclone copy out_k "gdrive:ASTROLOVE/TEMP/WP_KAGIT_TARA/${{ github.run_id }}/KESIT_11x14/" && echo "drive: TEMP/WP_KAGIT_TARA/${{ github.run_id }}/KESIT_11x14/"
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone _k

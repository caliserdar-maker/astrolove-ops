name: kupa-galeri78-yukle

# Kupa 78 Orchard galeri: 14 gorsel + 1 video + Style (513) bagi 7-14. scripts/etsy/kupa_galeri78.py. KOSTURMA AYRI ONAYLA (kuru da).
# Sira: (1) kupa-galeri78-hazir plan_damga bos -> hazir_kosu (KAYNAK.csv)  (2) bu is akisi mod=kuru hazir_kosu=<1> -> plan_damga
#       (3) kupa-galeri78-hazir plan_damga=<2> -> eski medya yedegi Drive'da (KILITSIZ, CDN)  (4) mod=yaz hazir_kosu=<1> plan_damga=<2>
#       (her kosu en fazla azami_ilan ilan; kalanlar icin ayni girdilerle yeniden)  geri_al: mod=geri_al plan_damga + sadece.
# KILIT SURESI (Serdar 23 Eki): toplu Drive / CDN isi bu is akisinda YOK (hazir is akisinda). Kilitten ONCE: Drive girdileri, partinin
#   (azami_ilan) dosyalari + YEDEK.json'lari, yedek lsjson --hash. Kilitten SONRA: durum dosyalari, parti yeniden (yetkili), token, Etsy.
# mod=kuru: ETSY SALT OKUMA (ilan basina 6 GET, ayni burcta +1 RU okumasi), PLAN_KUPA78.json + plan_damga.
# mod=yaz: ETSY'YE YAZAR yalniz confirm=KUPA_GALERI78 + plan_damga + data/pod/kupa_galeri78_alt.csv ONAYLI. Metin (aciklama /
#   kisisellestirme) YAZILMAZ (betik varsayilani; RU = EN kurali). DEVAM_<ilan>.json her yukleme oncesi / sonrasi Drive'a
#   (TEMP/KUPA_GALERI78/DEVAM_ILAN/<plan_damga>/): kosu ilan ortasinda olurse devam / geri_al bu kayitla.
# mod=geri_al: ETSY'YE YAZAR yalniz confirm=KUPA_GALERI78_GERI + plan_damga + sadece; yedekten eski galeri / baglar / video.
# Ilk PASS / ZATEN olmayan ilanda kosu durur. Kosu ciktisi TEMP/KUPA_GALERI78/KOSU/<run_id>/.

permissions:
  actions: read
  contents: read

on:
  workflow_dispatch:
    inputs:
      mod:
        description: "kuru = salt okuma (plan); yaz = Etsy'ye yazar; geri_al = Etsy'ye yazar (yedekten eski hal)"
        required: true
        default: "kuru"
        type: choice
        options: [kuru, yaz, geri_al]
      confirm: {description: "yaz: KUPA_GALERI78 / geri_al: KUPA_GALERI78_GERI", required: false, default: ""}
      hazir_kosu: {description: "kuru / yaz: kupa-galeri78-hazir kaynak kosusunun run_id'si (HAZIR/<id>/KAYNAK.csv)", required: false, default: ""}
      plan_damga: {description: "yaz / geri_al: kuru kosunun plan_damga degeri (<kosu>_<sha12>)", required: false, default: ""}
      sadece: {description: "yalniz bu ilanlar (virgullu listing_id); bos = 78; geri_al icin zorunlu", required: false, default: ""}
      haric: {description: "bu ilanlar haric (virgullu listing_id)", required: false, default: ""}
      azami_ilan: {description: "yaz: kosu basina en fazla ilan", required: false, default: "15"}
      kurtar: {description: "true = hata kaydi olan DEVAM ilanini surdur", required: false, default: "false"}
      metin_yaz: {description: "true = EN aciklama galeriyle birlikte (Serdar 31 Eki onayi; RU yazilmaz). kuru ve yaz AYNI deger (plana bagli)", required: false, default: "false"}

env:
  T: "gdrive:ASTROLOVE/TEMP"
  O: "gdrive:ASTROLOVE/TEMP/KUPA_GALERI78"
  Y: "gdrive:ASTROLOVE/TEMP/KUPA_GALERI78_YEDEK"

jobs:
  etsy:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Girdi kapisi
        env:
          MOD: ${{ inputs.mod }}
          ONAY: ${{ inputs.confirm }}
          HK: ${{ inputs.hazir_kosu }}
          PD: ${{ inputs.plan_damga }}
          SA: ${{ inputs.sadece }}
          HA: ${{ inputs.haric }}
          AI: ${{ inputs.azami_ilan }}
          KT: ${{ inputs.kurtar }}
          MY: ${{ inputs.metin_yaz }}
        run: |
          set -euo pipefail
          [[ "$MY" =~ ^(true|false)$ ]] || { echo "::error::girdi (metin_yaz)"; exit 1; }
          [[ "$MOD" =~ ^(kuru|yaz|geri_al)$ && "$KT" =~ ^(true|false)$ && "$AI" =~ ^[0-9]{1,2}$ ]] || { echo "::error::girdi (mod / kurtar / azami_ilan)"; exit 1; }
          [[ "$SA" =~ ^([0-9]+(,[0-9]+)*)?$ && "$HA" =~ ^([0-9]+(,[0-9]+)*)?$ ]] || { echo "::error::girdi (sadece / haric)"; exit 1; }
          if [ "$MOD" != geri_al ]; then [[ "$HK" =~ ^[0-9]+$ ]] || { echo "::error::kuru / yaz icin hazir_kosu (run_id)"; exit 1; }; fi
          if [ "$MOD" = yaz ]; then
            [ "$ONAY" = KUPA_GALERI78 ] || { echo "::error::yazim icin confirm KUPA_GALERI78"; exit 1; }
            [ "$AI" -ge 1 ] || { echo "::error::yazimda azami_ilan >= 1 (kilit suresi siniri)"; exit 1; }
          fi
          if [ "$MOD" = geri_al ]; then
            [ "$ONAY" = KUPA_GALERI78_GERI ] || { echo "::error::geri alma icin confirm KUPA_GALERI78_GERI"; exit 1; }
            [ -n "$SA" ] || { echo "::error::geri alma icin sadece (ilanlar)"; exit 1; }
          fi
          if [ "$MOD" != kuru ]; then [[ "$PD" =~ ^[0-9]+_[0-9a-f]{12}$ ]] || { echo "::error::plan_damga (<kosu>_<sha12>)"; exit 1; }; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Girdiler + parti dosyalari (Drive; kilitten ONCE)
        env:
          MOD: ${{ inputs.mod }}
          HK: ${{ inputs.hazir_kosu }}
          PD: ${{ inputs.plan_damga }}
          SA: ${{ inputs.sadece }}
          HA: ${{ inputs.haric }}
          AI: ${{ inputs.azami_ilan }}
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work/devam_ilan _out _yedek _d/kapak _d/kart _d/stil _d/video
          rclone copyto "$T/KUPA_ORCHARD_TASLAK_20261019/KUPA_TASLAK_LISTE.csv" _work/liste.csv
          if [ "$MOD" != geri_al ]; then
            rclone copyto "$O/HAZIR/$HK/KAYNAK.csv" _work/KAYNAK.csv || { echo "::error::HAZIR/$HK/KAYNAK.csv yok"; exit 1; }
            rclone copyto "$O/HAZIR/$HK/GIRDI.txt" _work/GIRDI.txt
            cp _work/KAYNAK.csv _work/GIRDI.txt _out/; echo "$HK" > _out/HAZIR_KOSU.txt
          fi
          if [ "$MOD" = yaz ]; then
            read -r KD GD SD < _work/GIRDI.txt
            echo "KD=$KD" >> "$GITHUB_ENV"; echo "GD=$GD" >> "$GITHUB_ENV"; echo "SD=$SD" >> "$GITHUB_ENV"
            rclone copyto "$O/KOSU/${PD%%_*}/PLAN_KUPA78.json" _work/PLAN_KUPA78.json
            K1=$(rclone cat "$O/KOSU/${PD%%_*}/GIRDI.txt" 2>/dev/null || true)
            [ "$K1" = "$KD $GD $SD" ] || { echo "::error::kuru plan girdileri ($K1) bu hazir kosusuyla ($KD $GD $SD) ayni degil; yazma yok"; exit 1; }
            rclone lsjson -R --hash "$Y/$PD" > _work/YEDEK_LSJSON.json || { echo "::error::yedek klasoru $PD okunamadi (once kupa-galeri78-hazir)"; exit 1; }
            # on okuma (bilgi; yetkili okuma kilitten sonra): parti ve yalniz onun dosyalari
            rclone copy "$O/DEVAM_ILAN/$PD" _work/devam_ilan -q 2>/dev/null || true
            rclone copyto "$O/DEVAM.json" _work/DEVAM_ON.json -q 2>/dev/null || true
            rclone copyto "$O/ILERLEME.json" _work/ILERLEME_ON.json -q 2>/dev/null || true
            python3 scripts/etsy/kupa_galeri78.py parti --liste _work/liste.csv --plan _work/PLAN_KUPA78.json --plan-damga "$PD" \
              --devam _work/DEVAM_ON.json --ilerleme _work/ILERLEME_ON.json --devam-ilan-dir _work/devam_ilan --azami-ilan "$AI" \
              --sadece "$SA" --haric "$HA" --out _work/parti_on
            rclone copy "$T/KUPA_GALERI_KAYNAK/$GD/kapak" _d/kapak --files-from _work/parti_on/kapak.txt --transfers 16 -q
            rclone copy "$T/KUPA_GALERI_KAYNAK/$GD/video" _d/video --files-from _work/parti_on/video.txt --transfers 16 -q
            rclone copy "$T/KUPA_KART78/$KD" _d/kart --files-from _work/parti_on/kart.txt --transfers 16 -q
            rclone copy "$T/KUPA_STIL78/$SD" _d/stil --files-from _work/parti_on/stil.txt --transfers 16 -q
            rclone copy "$Y/$PD" _yedek --files-from _work/parti_on/yedek.txt -q
          fi
          if [ "$MOD" = geri_al ]; then
            rclone copy "$O/DEVAM_ILAN/$PD" _work/devam_ilan -q 2>/dev/null || true
            for lid in ${SA//,/ }; do rclone copy "$Y/$PD" _yedek --include "${lid}_*/**" -q; done
          fi
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - name: Durum dosyalari oku (kilit sonrasi; kuru yalniz okur, ZATEN kapisi) + yetkili parti
        env:
          MOD: ${{ inputs.mod }}
          PD: ${{ inputs.plan_damga }}
          SA: ${{ inputs.sadece }}
          HA: ${{ inputs.haric }}
          AI: ${{ inputs.azami_ilan }}
        run: |
          set -euo pipefail
          umask 077
          # durum kapisi (26 Eki, Serdar onayi): okuma hatasinda bos varsayilanla devam YOK
          python3 scripts/ops/durum_dosyasi.py oku --uzak "$O/DEVAM.json" --yerel _work/DEVAM.json --durum _work/DURUM_DEVAM \
            --tur json-ilanlar --ilk-kayit-izni
          python3 scripts/ops/durum_dosyasi.py oku --uzak "$O/ILERLEME.json" --yerel _work/ILERLEME.json --durum _work/DURUM_ILERLEME \
            --tur json-ilanlar --ilk-kayit-izni
          if [ "$MOD" != kuru ] && rclone lsf --dirs-only "$O/DEVAM_ILAN" 2>/dev/null | grep -qx "$PD/"; then
            rm -rf _work/devam_ilan; mkdir -p _work/devam_ilan
            rclone copy "$O/DEVAM_ILAN/$PD" _work/devam_ilan -q
          fi
          if [ "$MOD" = yaz ]; then
            python3 scripts/etsy/kupa_galeri78.py parti --liste _work/liste.csv --plan _work/PLAN_KUPA78.json --plan-damga "$PD" \
              --devam _work/DEVAM.json --ilerleme _work/ILERLEME.json --devam-ilan-dir _work/devam_ilan --azami-ilan "$AI" \
              --sadece "$SA" --haric "$HA" --out _work/parti
            # on okumadan farkliysa eksik dosyalar (rclone copy var olani atlar; cogunlukla bos is)
            rclone copy "$T/KUPA_GALERI_KAYNAK/$GD/kapak" _d/kapak --files-from _work/parti/kapak.txt --transfers 16 -q
            rclone copy "$T/KUPA_GALERI_KAYNAK/$GD/video" _d/video --files-from _work/parti/video.txt --transfers 16 -q
            rclone copy "$T/KUPA_KART78/$KD" _d/kart --files-from _work/parti/kart.txt --transfers 16 -q
            rclone copy "$T/KUPA_STIL78/$SD" _d/stil --files-from _work/parti/stil.txt --transfers 16 -q
            rclone copy "$Y/$PD" _yedek --files-from _work/parti/yedek.txt -q
            echo "PARTI=$(cat _work/parti/PARTI.txt)" >> "$GITHUB_ENV"
          fi
      - name: Token
        run: |
          set -euo pipefail
          umask 077
          rclone copyto "$T/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
      - name: Kupa galeri 78
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          MOD: ${{ inputs.mod }}
          PD: ${{ inputs.plan_damga }}
          SA: ${{ inputs.sadece }}
          MY: ${{ inputs.metin_yaz }}
          HA: ${{ inputs.haric }}
          AI: ${{ inputs.azami_ilan }}
          KT: ${{ inputs.kurtar }}
        run: |
          set +e -o pipefail
          if [ "$MOD" = kuru ]; then
            python3 scripts/etsy/kupa_galeri78.py kuru --liste _work/liste.csv --kaynak _work/KAYNAK.csv --out _out --sadece "$SA" --haric "$HA" \
              --ilerleme _work/ILERLEME.json $([ "$MY" = true ] && echo --metin-yaz) 2>&1 | tee _work/kosu.log
            echo "KOD=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          elif [ "$MOD" = yaz ]; then
            if [ -z "$PARTI" ]; then
              echo "::notice title=KUPA GALERI78::parti bos (plandaki ilanlar PASS / GERI_ALINDI); Etsy cagrisi yok"; echo "KOD=0" >> "$GITHUB_ENV"; exit 0
            fi
            args=(--liste _work/liste.csv --kaynak _work/KAYNAK.csv --out _out --sadece "$PARTI"
                  --confirm KUPA_GALERI78 --plan _work/PLAN_KUPA78.json --plan-damga "$PD" --dosya-dir _d --yedek-dir _yedek
                  --yedek-liste _work/YEDEK_LSJSON.json --yedek-uzak "$Y/$PD" --devam _work/DEVAM.json --ilerleme _work/ILERLEME.json
                  --devam-ilan-dir _work/devam_ilan --devam-hedef-kok "$O/DEVAM_ILAN/$PD" --azami-ilan "$AI")
            [ "$KT" = true ] && args+=(--kurtar)
            [ "$MY" = true ] && args+=(--metin-yaz)
            python3 scripts/etsy/kupa_galeri78.py yaz "${args[@]}" 2>&1 | tee _work/kosu.log
            echo "KOD=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          else
            python3 scripts/etsy/kupa_galeri78.py geri_al --liste _work/liste.csv --out _out --sadece "$SA" --confirm KUPA_GALERI78_GERI \
              --plan-damga "$PD" --yedek-dir _yedek --yedek-uzak "$Y/$PD" --devam _work/DEVAM.json --devam-ilan-dir _work/devam_ilan \
              --devam-hedef-kok "$O/DEVAM_ILAN/$PD" 2>&1 | tee _work/kosu.log
            echo "KOD=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          fi
      - name: Token + durum + cikti Drive'a
        if: always()
        env:
          MOD: ${{ inputs.mod }}
        run: |
          set -uo pipefail
          # Token geri yazimi (Serdar 27 Eki): yenilenen refresh token kaybolursa tum Etsy kosulari durur. 3 deneme.
          TOKEN_FAIL=""; FAIL=""
          if [ -f _work/ETSY_TOKEN.json.updated ]; then
            TOKEN_FAIL=1
            for n in 1 2 3; do
              if rclone copyto _work/ETSY_TOKEN.json "$T/ETSY_TOKEN.json"; then TOKEN_FAIL=""; echo "Token geri yazildi (deneme $n)"; break; fi
              echo "Token geri yazimi basarisiz (deneme $n)"; sleep 10
            done
            [ -z "$TOKEN_FAIL" ] || echo "::error::ETSY TOKEN GERI YAZILAMADI (3 deneme). Yeni refresh token kaybolabilir; Etsy kosulari baslatma, Merkez'e bildir."
          else
            echo "Token yenilenmedi (yenileme yok)"
          fi
          [ -f _work/kosu.log ] && python3 scripts/guvenlik/log_suz.py < _work/kosu.log > "_out/kosu_$(date -u +%Y%m%d_%H%M).txt"
          if grep -rqE '"(access_token|refresh_token)"[[:space:]]*:[[:space:]]*"[A-Za-z0-9._-]{20,}"|x-api-key[[:space:]]*:' _out/ 2>/dev/null; then
            echo "::error::Ciktida sir bulundu; Drive'a yazilmadi"; exit 1; fi
          # ilan basina DEVAM_<ilan>.json zaten her yuklemede Drive'da; toplu DEVAM / ILERLEME kosu sonunda (kosu oldu ise devam
          # DEVAM_ILAN'dan okunur)
          if [ "$MOD" != kuru ] && [ -n "${KOD:-}" ]; then
            for x in DEVAM.json ILERLEME.json; do
              if [ -f "_work/DURUM_${x%%.*}/ONCE" ]; then
                python3 scripts/ops/durum_dosyasi.py yaz --uzak "$O/$x" --yerel "_work/$x" --durum "_work/DURUM_${x%%.*}" --tur json-ilanlar \
                  --ilk-kayit-izni || FAIL=1
              else
                echo "::error::$x okunamadi; Drive'a yazilmadi"; FAIL=1
              fi
            done
          fi
          [ -d _out ] && rclone copy _out "$O/KOSU/${GITHUB_RUN_ID}" -q && echo "::notice title=KUPA GALERI78::Drive TEMP/KUPA_GALERI78/KOSU/${GITHUB_RUN_ID}/"
          [ -f _out/RAPOR.md ] && head -60 _out/RAPOR.md >> "$GITHUB_STEP_SUMMARY" || true
          [ -z "$FAIL" ] || { echo "::error::durum dosyasi kapisi FAIL"; exit 1; }
          [ -z "$TOKEN_FAIL" ] || exit 1
          [ "${KOD:-1}" = 0 ] || { echo "::error::cikis ${KOD:-?}"; exit 1; }
      - if: always()
        run: rm -rf _work _d _yedek ~/.config/rclone

name: kupa-galeri78-yukle

# Kupa 78 Orchard galeri: 14 gorsel + 1 video + Style (513) bagi 7-14; ayni burc ciftlerinde (12) aciklama + kisisellestirme
# "First Name" / "Second Name" (Serdar gece istisnasi 30 Eki). KOSTURMA AYRI ONAYLA (kuru da). scripts/etsy/kupa_galeri78.py.
# kuru=true (varsayilan): ETSY SALT OKUMA (ilan basina 6 GET, ayni burcta +1 RU okumasi), PLAN_KUPA78.json + plan_damga.
# kuru=false: ETSY'YE YAZAR yalniz confirm=KUPA_GALERI78 + plan_damga + data/pod/kupa_galeri78_alt.csv ONAYLI. RU YAZILMAZ.
# Isler: hazir (KILITSIZ, Etsy yok): kaynak dosyalar + KAYNAK.csv; yazimda eski medya yedegi (etsystatic CDN, plan adreslerinden)
#        Drive TEMP/KUPA_GALERI78_YEDEK/<plan_damga>/ (--immutable) + lsjson. Yedek Drive'da dogrulanmadan etsy isi yazmaz.
#        etsy (Etsy kilidi checkout'tan hemen sonra, token indirmeden ONCE; concurrency grubu yok): kuru / yazim, token geri yazimi.
# Kaynaklar: TEMP/KUPA_GALERI_KAYNAK/<kaynak_damga>/{kapak,video}, TEMP/KUPA_KART78/<kart_damga>/ (MANIFEST.csv),
#            TEMP/KUPA_STIL78/<stil_damga>/. Ilan listesi TEMP/KUPA_ORCHARD_TASLAK_20261019/KUPA_TASLAK_LISTE.csv.
# Durum: TEMP/KUPA_GALERI78/DEVAM.json, ILERLEME.json (durum_dosyasi.py, kilit sonrasi okuma). Kosu ciktisi KOSU/<run_id>/.
# updateListing yalniz ayni burc metninde ve state active okunduktan sonra. Ilk PASS / ZATEN olmayan ilanda kosu durur.

permissions:
  actions: read
  contents: read

on:
  workflow_dispatch:
    inputs:
      kuru: {description: "true = yazma yok (plan); false = yazim", required: true, default: "true"}
      confirm: {description: "yazim icin KUPA_GALERI78", required: false, default: ""}
      plan_damga: {description: "yazim: kuru kosunun plan_damga degeri (<kosu>_<sha12>)", required: false, default: ""}
      kart_damga: {description: "TEMP/KUPA_KART78/<damga> (MANIFEST.csv)", required: true, default: ""}
      kaynak_damga: {description: "TEMP/KUPA_GALERI_KAYNAK/<damga> (kapak + video)", required: true, default: "20261030_192647"}
      stil_damga: {description: "TEMP/KUPA_STIL78/<damga>", required: true, default: "20261030_192647"}
      sadece: {description: "yalniz bu ilanlar (virgullu listing_id); bos = 78", required: false, default: ""}
      haric: {description: "bu ilanlar haric (virgullu listing_id)", required: false, default: ""}
      azami_ilan: {description: "yazim: kosu basina en fazla ilan (0 = sinirsiz)", required: false, default: "0"}
      kurtar: {description: "true = hata kaydi olan DEVAM ilanini surdur", required: false, default: "false"}

env:
  T: "gdrive:ASTROLOVE/TEMP"
  O: "gdrive:ASTROLOVE/TEMP/KUPA_GALERI78"
  Y: "gdrive:ASTROLOVE/TEMP/KUPA_GALERI78_YEDEK"

jobs:
  hazir:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Girdi kapisi
        env:
          KURU: ${{ inputs.kuru }}
          ONAY: ${{ inputs.confirm }}
          PD: ${{ inputs.plan_damga }}
          KD: ${{ inputs.kart_damga }}
          GD: ${{ inputs.kaynak_damga }}
          SD: ${{ inputs.stil_damga }}
          SA: ${{ inputs.sadece }}
          HA: ${{ inputs.haric }}
          AI: ${{ inputs.azami_ilan }}
          KT: ${{ inputs.kurtar }}
        run: |
          set -euo pipefail
          [[ "$KD" =~ ^[0-9]{8}_[0-9]{6}$ && "$GD" =~ ^[0-9]{8}_[0-9]{6}$ && "$SD" =~ ^[0-9]{8}_[0-9]{6}$ ]] || { echo "::error::girdi (damgalar)"; exit 1; }
          [[ "$KURU" =~ ^(true|false)$ && "$KT" =~ ^(true|false)$ && "$AI" =~ ^[0-9]{1,2}$ ]] || { echo "::error::girdi (kuru / kurtar / azami_ilan)"; exit 1; }
          [[ "$SA" =~ ^([0-9]+(,[0-9]+)*)?$ && "$HA" =~ ^([0-9]+(,[0-9]+)*)?$ ]] || { echo "::error::girdi (sadece / haric)"; exit 1; }
          if [ "$KURU" = false ]; then
            [ "$ONAY" = KUPA_GALERI78 ] || { echo "::error::yazim icin confirm KUPA_GALERI78"; exit 1; }
            [[ "$PD" =~ ^[0-9]+_[0-9a-f]{12}$ ]] || { echo "::error::yazim icin plan_damga (<kosu>_<sha12>)"; exit 1; }
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Kaynak dosyalar (Etsy yok)
        env:
          KD: ${{ inputs.kart_damga }}
          GD: ${{ inputs.kaynak_damga }}
          SD: ${{ inputs.stil_damga }}
          SA: ${{ inputs.sadece }}
          HA: ${{ inputs.haric }}
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _k _d/kapak _d/kart _d/stil _d/video
          rclone copyto "$T/KUPA_ORCHARD_TASLAK_20261019/KUPA_TASLAK_LISTE.csv" _work/liste.csv
          rclone copyto "$T/KUPA_KART78/$KD/MANIFEST.csv" _work/MANIFEST.csv || { echo "::error::KUPA_KART78/$KD/MANIFEST.csv yok"; exit 1; }
          rclone copyto "$T/KUPA_GALERI_KAYNAK/$GD/kapak/KAYIT.tsv" _work/KAYIT.tsv || { echo "::error::kapak KAYIT.tsv yok"; exit 1; }
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "scripts/etsy")
          import kupa_galeri78 as K
          R = K.kapsam(K.liste_oku("_work/liste.csv"), os.environ["SA"], os.environ["HA"])
          ad = {"kapak": [], "kart": [], "stil": [], "video": []}
          for r in R:
              for s, rel in K.kaynak_yollari(r["cift"]).items():
                  k, f = rel.split("/", 1); ad[k].append(f)
          for k, v in ad.items():
              open(f"_work/{k}.txt", "w").writelines(x + "\n" for x in v)
          print(f"kapsam: {len(R)} ilan")
          PY
          rclone copy "$T/KUPA_GALERI_KAYNAK/$GD/kapak" _d/kapak --files-from _work/kapak.txt --transfers 16 -q || true
          rclone copy "$T/KUPA_GALERI_KAYNAK/$GD/video" _d/video --files-from _work/video.txt --transfers 16 -q || true
          rclone copy "$T/KUPA_KART78/$KD" _d/kart --files-from _work/kart.txt --transfers 16 -q || true
          rclone copy "$T/KUPA_STIL78/$SD" _d/stil --files-from _work/stil.txt --transfers 16 -q || true
          set +e
          python3 scripts/etsy/kupa_galeri78.py kaynak --liste _work/liste.csv --out _k --sadece "$SA" --haric "$HA" --dosya-dir _d \
            --kart-manifest _work/MANIFEST.csv --kapak-kayit _work/KAYIT.tsv 2>&1 | tee _k/kaynak.log
          KK=${PIPESTATUS[0]}
          set -e
          echo "$KD $GD $SD" > _k/GIRDI.txt
          rclone copy _k "$O/KOSU/${GITHUB_RUN_ID}/kaynak" -q
          echo "::notice title=KAYNAK::cikis $KK (FAIL satirli ilan kuruda BLOK; KOSU/${GITHUB_RUN_ID}/kaynak/KAYNAK.csv)"
      - name: Eski medya yedegi (yazim; Etsy yok, kilitsiz)
        if: ${{ inputs.kuru == 'false' }}
        env:
          PD: ${{ inputs.plan_damga }}
          SA: ${{ inputs.sadece }}
          HA: ${{ inputs.haric }}
        run: |
          set -euo pipefail
          umask 077; mkdir -p _yedek
          rclone copyto "$O/KOSU/${PD%%_*}/PLAN_KUPA78.json" _work/PLAN_KUPA78.json || { echo "::error::PLAN_KUPA78.json yok (KOSU/${PD%%_*})"; exit 1; }
          python3 scripts/etsy/kupa_galeri78.py yedek --liste _work/liste.csv --out _yedek --plan _work/PLAN_KUPA78.json --plan-damga "$PD" \
            --yedek-dir _yedek --sadece "$SA" --haric "$HA"
          rclone copy _yedek "$Y/$PD" --immutable --transfers 16 -q
          rclone lsjson -R "$Y/$PD" > _work/YEDEK_LSJSON.json
          python3 - <<'PY'
          import json, pathlib
          L = {x["Path"]: x.get("Size") for x in json.load(open("_work/YEDEK_LSJSON.json")) if not x.get("IsDir")}
          y = pathlib.Path("_yedek")
          eksik = [str(p.relative_to(y)) for p in y.rglob("*") if p.is_file() and L.get(str(p.relative_to(y))) != p.stat().st_size]
          if eksik:
              raise SystemExit(f"yedek Drive'da eksik / boyut farkli: {len(eksik)} dosya")
          print(f"yedek Drive'da dogrulandi: {len(L)} dosya")
          PY
          rclone copyto _work/YEDEK_LSJSON.json "$O/KOSU/${GITHUB_RUN_ID}/kaynak/YEDEK_LSJSON.json" -q
      - if: always()
        run: rm -rf _work _k _d _yedek ~/.config/rclone

  etsy:
    needs: hazir
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Girdiler (Drive)
        env:
          KURU: ${{ inputs.kuru }}
          PD: ${{ inputs.plan_damga }}
          KD: ${{ inputs.kart_damga }}
          GD: ${{ inputs.kaynak_damga }}
          SD: ${{ inputs.stil_damga }}
          SA: ${{ inputs.sadece }}
          HA: ${{ inputs.haric }}
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out _yedek _d/kapak _d/kart _d/stil _d/video
          rclone copyto "$T/KUPA_ORCHARD_TASLAK_20261019/KUPA_TASLAK_LISTE.csv" _work/liste.csv
          rclone copyto "$O/KOSU/${GITHUB_RUN_ID}/kaynak/KAYNAK.csv" _work/KAYNAK.csv
          cp _work/KAYNAK.csv _out/KAYNAK.csv; echo "$KD $GD $SD" > _out/GIRDI.txt
          if [ "$KURU" = false ]; then
            rclone copyto "$O/KOSU/${PD%%_*}/PLAN_KUPA78.json" _work/PLAN_KUPA78.json
            K1=$(rclone cat "$O/KOSU/${PD%%_*}/GIRDI.txt" 2>/dev/null || true)
            [ "$K1" = "$KD $GD $SD" ] || { echo "::error::kuru plan girdileri ($K1) bu kosuyla ($KD $GD $SD) ayni degil; yazma yok"; exit 1; }
            rclone copyto "$O/KOSU/${GITHUB_RUN_ID}/kaynak/YEDEK_LSJSON.json" _work/YEDEK_LSJSON.json
            rclone copy "$Y/$PD" _yedek --include "*/YEDEK.json" -q
            python3 - <<'PY'
          import json, os
          p = json.load(open("_work/PLAN_KUPA78.json"))
          sa = {x for x in os.environ["SA"].split(",") if x}; ha = {x for x in os.environ["HA"].split(",") if x}
          ids = {i for i in p["girdiler"] if (not sa or i in sa) and i not in ha}
          ad = {"kapak": [], "kart": [], "stil": [], "video": []}
          for lid, g in p["girdiler"].items():
              if lid not in ids:
                  continue
              for d in [h[1] for h in g["hedef"]] + [g["video"][0]]:
                  k, f = d.split("/", 1); ad[k].append(f)
          for k, v in ad.items():
              open(f"_work/{k}.txt", "w").writelines(x + "\n" for x in v)
          print(f"plan: {len(ids)} ilan")
          PY
            rclone copy "$T/KUPA_GALERI_KAYNAK/$GD/kapak" _d/kapak --files-from _work/kapak.txt --transfers 16 -q
            rclone copy "$T/KUPA_GALERI_KAYNAK/$GD/video" _d/video --files-from _work/video.txt --transfers 16 -q
            rclone copy "$T/KUPA_KART78/$KD" _d/kart --files-from _work/kart.txt --transfers 16 -q
            rclone copy "$T/KUPA_STIL78/$SD" _d/stil --files-from _work/stil.txt --transfers 16 -q
          fi
      - name: Durum dosyalari oku (kilit sonrasi; kuru yalniz okur, ZATEN kapisi)
        run: |
          set -euo pipefail
          umask 077
          # durum kapisi (26 Eki, Serdar onayi): okuma hatasinda bos varsayilanla devam YOK
          python3 scripts/ops/durum_dosyasi.py oku --uzak "$O/DEVAM.json" --yerel _work/DEVAM.json --durum _work/DURUM_DEVAM \
            --tur json-ilanlar --ilk-kayit-izni
          python3 scripts/ops/durum_dosyasi.py oku --uzak "$O/ILERLEME.json" --yerel _work/ILERLEME.json --durum _work/DURUM_ILERLEME \
            --tur json-ilanlar --ilk-kayit-izni
      - name: Token
        run: |
          set -euo pipefail
          umask 077
          rclone copyto "$T/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
      - name: Kupa galeri 78
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          KURU: ${{ inputs.kuru }}
          PD: ${{ inputs.plan_damga }}
          SA: ${{ inputs.sadece }}
          HA: ${{ inputs.haric }}
          AI: ${{ inputs.azami_ilan }}
          KT: ${{ inputs.kurtar }}
        run: |
          set +e -o pipefail
          args=(--liste _work/liste.csv --kaynak _work/KAYNAK.csv --out _out --sadece "$SA" --haric "$HA")
          if [ "$KURU" = true ]; then
            python3 scripts/etsy/kupa_galeri78.py kuru "${args[@]}" --ilerleme _work/ILERLEME.json 2>&1 | tee _work/kosu.log
          else
            args+=(--confirm KUPA_GALERI78 --plan _work/PLAN_KUPA78.json --plan-damga "$PD" --dosya-dir _d --yedek-dir _yedek
                   --yedek-liste _work/YEDEK_LSJSON.json --yedek-uzak "$Y/$PD" --devam _work/DEVAM.json --ilerleme _work/ILERLEME.json
                   --azami-ilan "${AI:-0}")
            [ "$KT" = true ] && args+=(--kurtar)
            python3 scripts/etsy/kupa_galeri78.py yaz "${args[@]}" 2>&1 | tee _work/kosu.log
          fi
          echo "KOD=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
      - name: Token + durum + cikti Drive'a
        if: always()
        env:
          KURU: ${{ inputs.kuru }}
        run: |
          set -uo pipefail
          # Token geri yazimi (Serdar 27 Eki): yenilenen refresh token kaybolursa tum Etsy kosulari durur. 3 deneme.
          TOKEN_FAIL=""; FAIL=""
          if [ -f _work/ETSY_TOKEN.json.updated ]; then
            TOKEN_FAIL=1
            for n in 1 2 3; do
              if rclone copyto _work/ETSY_TOKEN.json "$T/ETSY_TOKEN.json"; then TOKEN_FAIL=""; echo "Token geri yazildi (deneme $n)"; break; fi
              echo "Token geri yazimi basarisiz (deneme $n)"; sleep 10
            done
            [ -z "$TOKEN_FAIL" ] || echo "::error::ETSY TOKEN GERI YAZILAMADI (3 deneme). Yeni refresh token kaybolabilir; Etsy kosulari baslatma, Merkez'e bildir."
          else
            echo "Token yenilenmedi (yenileme yok)"
          fi
          [ -f _work/kosu.log ] && python3 scripts/guvenlik/log_suz.py < _work/kosu.log > "_out/kosu_$(date -u +%Y%m%d_%H%M).txt"
          if grep -rqE '"(access_token|refresh_token)"[[:space:]]*:[[:space:]]*"[A-Za-z0-9._-]{20,}"|x-api-key[[:space:]]*:' _out/ 2>/dev/null; then
            echo "::error::Ciktida sir bulundu; Drive'a yazilmadi"; exit 1; fi
          if [ "$KURU" = false ] && [ -n "${KOD:-}" ]; then
            for x in DEVAM.json ILERLEME.json; do
              if [ -f "_work/DURUM_${x%%.*}/ONCE" ]; then
                python3 scripts/ops/durum_dosyasi.py yaz --uzak "$O/$x" --yerel "_work/$x" --durum "_work/DURUM_${x%%.*}" --tur json-ilanlar \
                  --ilk-kayit-izni || FAIL=1
              else
                echo "::error::$x okunamadi; Drive'a yazilmadi"; FAIL=1
              fi
            done
          fi
          [ -d _out ] && rclone copy _out "$O/KOSU/${GITHUB_RUN_ID}" -q && echo "::notice title=KUPA GALERI78::Drive TEMP/KUPA_GALERI78/KOSU/${GITHUB_RUN_ID}/"
          [ -f _out/RAPOR.md ] && head -60 _out/RAPOR.md >> "$GITHUB_STEP_SUMMARY" || true
          [ -z "$FAIL" ] || { echo "::error::durum dosyasi kapisi FAIL"; exit 1; }
          [ -z "$TOKEN_FAIL" ] || exit 1
          [ "${KOD:-1}" = 0 ] || { echo "::error::cikis ${KOD:-?}"; exit 1; }
      - if: always()
        run: rm -rf _work _d _yedek ~/.config/rclone

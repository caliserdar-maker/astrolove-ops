name: trafik-oncesi

# Yayin oncesi trafik kaydi (14 Eki 2026): 78 canli kisisel cift ilaninin (data/pod/pod78_ids.csv) state/views/num_favorers degeri.
# SALT OKUR: yalniz GET /v3/application/listings/batch; ilan ve Ads ayari degismez. 14 gun sonra karsilastirilacak.
# Cikti: Drive ASTROLOVE/TEMP/TRAFIK_ONCESI_20261014.csv. Anahtar/token hicbir dosyaya ya da loga yazilmaz.

permissions:
  actions: read
  contents: read

on:
  workflow_dispatch:

jobs:
  oku:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    env:
      CIKTI: TRAFIK_ONCESI_20261014.csv
    steps:
      - uses: actions/checkout@v4
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Token
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
      - name: Guvenlik testi (yazma metodu varsa DUR)
        run: |
          set -euo pipefail
          if grep -nE "\.(patch|put|post|delete|post_json|put_json|post_file)\(|requests\.(patch|put|post|delete)|method=.(PATCH|PUT|POST|DELETE)" scripts/etsy/trafik_oncesi.py; then
            echo "::error::Salt-okur betikte yazma metodu bulundu"; exit 1
          fi
          grep -q 'api.get("/listings/batch"' scripts/etsy/trafik_oncesi.py
          echo "yalniz GET /listings/batch: OK"
      - name: Trafik kaydi (yalniz GET)
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          set -euo pipefail
          python scripts/etsy/trafik_oncesi.py --ids data/pod/pod78_ids.csv --cikti "_out/$CIKTI"
      - name: Token geri yazimi ve cikti Drive'a
        if: ${{ always() }}
        run: |
          set -euo pipefail
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "yenilenen token geri yazildi" || true
          [ -f "_out/$CIKTI" ] || { echo "cikti yok"; exit 1; }
          python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/ETSY_TOKEN.json _out || { echo "::error::Ciktida sir bulundu; Drive'a yazilmadi"; exit 1; }
          rclone copyto "_out/$CIKTI" "gdrive:ASTROLOVE/TEMP/$CIKTI" -q
          echo "Cikti: ASTROLOVE/TEMP/$CIKTI ($(($(wc -l < "_out/$CIKTI") - 1)) satir)"
      - if: always()
        run: rm -rf _work ~/.config/rclone

name: wp-spill-probe

# WP TASMA (EDISYON BAZLI) + SAAT WALLPAPER KAYNAK HALESI - SALT OLCUM - 4 Eyl 2026.
# Uretim yok. Drive'a yalniz olcum CSV/TXT ve TEMP/AUDIT_CROPS altina kanit
# kirpmalari yazilir; FINAL_V2, MOCKUP_V2, WP_PLATES, DELIVERY degismez,
# Etsy'ye hic gidilmez.

on:
  workflow_dispatch:
    inputs:
      pairs:
        description: "Kisim 2 (saat) ciftleri"
        required: true
        default: "Aries_Aries,Leo_Pisces"
      spill_pair:
        description: "Kisim 1 (tasma) cifti"
        required: true
        default: "Aries_Aries"
      scenes:
        description: "Telefon sahneleri"
        required: true
        default: "SET01,SET03,SET04"
      grant:
        description: "Kirpmalara anyone:reader ver ve link yaz"
        type: boolean
        default: true

concurrency:
  group: wp-spill-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null

      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi

      - name: Girdiler (calib, masterlar, wallpaper'lar, plakalar)
        run: |
          set -euo pipefail
          mkdir -p _work/calib _work/masters _work/wp _work/plates _work/crops
          rclone copy "gdrive:ASTROLOVE/WALLPAPER/MOCKUP_V2/_CALIB" _work/calib \
            --include "calib.json" --include "masks/*.png"
          rclone copy "gdrive:ASTROLOVE/WALLPAPER/MOCKUP_V2/CANCER_LIBRA" _work/masters --include "*_FINAL.jpg"
          IFS=',' read -ra PS <<< "${{ inputs.pairs }},${{ inputs.spill_pair }}"
          for P in $(printf '%s\n' "${PS[@]}" | sort -u); do
            UP=$(echo "$P" | tr '[:lower:]' '[:upper:]')
            mkdir -p "_work/wp/$UP"
            rclone copy "gdrive:ASTROLOVE/WALLPAPER/FINAL_V2/$UP" "_work/wp/$UP" \
              --include "AstroLove_*_Phone.jpg" --include "AstroLove_*_Watch.jpg"
          done
          rclone copy "gdrive:ASTROLOVE/TEMP/WP_PLATES" _work/plates --include "PLATE_*WATCH*.png" --include "PLATE_*Watch*.png" || true
          echo "--- plakalar"; ls -l _work/plates || true
          echo "--- KOKEN: FINAL_V2 Watch dosyalari (ModTime)"
          for P in $(printf '%s\n' "${PS[@]}" | sort -u); do
            UP=$(echo "$P" | tr '[:lower:]' '[:upper:]')
            rclone lsl "gdrive:ASTROLOVE/WALLPAPER/FINAL_V2/$UP" --include "AstroLove_*_Watch.jpg"
          done
          echo "--- KOKEN: plakalar (ModTime)"
          rclone lsl "gdrive:ASTROLOVE/TEMP/WP_PLATES" --include "PLATE_*.png" | head -20 || true

      - name: Olcum
        run: |
          set -euo pipefail
          python scripts/etsy/wp_spill_probe.py \
            --calib _work/calib --masters _work/masters --wp-dir _work/wp \
            --plates _work/plates --pairs "${{ inputs.pairs }}" \
            --spill-pair "${{ inputs.spill_pair }}" --scenes "${{ inputs.scenes }}" \
            --crop-dir _work/crops --out _work/WP_SPILL_PROBE.csv | tee _work/rapor.txt

      - name: Drive'a yaz (olcum + kanit)
        if: ${{ always() }}
        run: |
          set -euo pipefail
          [ -f _work/WP_SPILL_PROBE.csv ] && rclone copyto _work/WP_SPILL_PROBE.csv "gdrive:ASTROLOVE/TEMP/WP_SPILL_PROBE.csv" || true
          [ -f _work/rapor.txt ] && rclone copyto _work/rapor.txt "gdrive:ASTROLOVE/TEMP/WP_SPILL_PROBE.txt" || true
          if [ -n "$(ls -A _work/crops 2>/dev/null)" ]; then
            rclone copy _work/crops "gdrive:ASTROLOVE/TEMP/AUDIT_CROPS" --include "M09_*.jpg"
            ls -l _work/crops
          fi

      - name: Kirpmalara izin + linkler
        if: ${{ always() && inputs.grant }}
        run: |
          set -euo pipefail
          [ -n "$(ls -A _work/crops 2>/dev/null)" ] || exit 0
          cat > _fid.py <<'PY'
          import json, sys
          print([r["ID"] for r in json.load(sys.stdin) if r["Name"] == sys.argv[1]][0])
          PY
          fid="$(rclone lsjson "gdrive:ASTROLOVE/TEMP" --dirs-only | python3 _fid.py AUDIT_CROPS)"
          python scripts/pinterest/pin_media_perms.py --mode grant --folder-id "$fid" \
            --pattern "M09_" --apply

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: wp-spill-probe
          path: |
            _work/WP_SPILL_PROBE.csv
            _work/rapor.txt
          if-no-files-found: ignore

      - name: Temizlik
        if: ${{ always() }}
        run: rm -rf _work ~/.config/rclone _fid.py

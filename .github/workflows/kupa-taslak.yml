name: kupa-taslak
# KUPA ORCHARD Etsy TASLAK (Serdar 19 Eki 2026). YAYIN YOK, Etsy Ads YOK. Kod: scripts/etsy/kupa_taslak.py
# mod=oku : SALT OKUMA (kategori/nitelik, BY hazirlik, iade/ortak/bolum/kargo, sabit kayitlar, ayni baslikli taslak, OAS).
# mod=kuru: AG/TOKEN YOK, Etsy'ye dokunmaz: galeri + metin indirilir, gonderilecek her istek KURU_<CIFT>.json'a yazilir.
# mod=yaz : ETSY'YE YAZAR, yalniz Serdar'in o kosuya ozel onayiyla: cift basina 1 YENI taslak (8 Orchard stili x 11/15 oz
#           = 16 urun, 14 gorsel + video, stil gorselleri, kisisellestirme, nitelikler) + geri okuma + salt son okuma.
#           Yeni bolum/kargo/iade kaydi acilmaz. Eski taslak 4597843405'e yazma yok. PATCH yalniz acil state=inactive.
# Metin: kupa-orchard dali kupa_orchard/ilan/KUPA78_ORCHARD_METIN.csv (metin_ref). Gorsel: Drive ASTROLOVE/KUPA_ORCHARD78/<hedef>/<CIFT>/{galeri/01-14_*.jpg, video/*.mp4}
# Rapor: Drive TEMP/KUPA_ORCHARD_TASLAK_20261019/ (DURUM.json: cift -> listing_id). Etsy kilidi: kilit_bekle.py. Kota tabani 10.
permissions:
  actions: read
  contents: read
on:
  workflow_dispatch:
    inputs:
      mod: { description: "oku | kuru | yaz", required: true, default: "kuru" }
      ciftler: { description: "TUMU ya da virgul/bosluk ayrimli CIFT (alfabetik anahtar, orn. CANCER_LIBRA)", required: true, default: "CANCER_LIBRA" }
      hedef: { description: "Drive ASTROLOVE/KUPA_ORCHARD78/<hedef>", required: true, default: "ORCHARD78_20261019" }
      metin_ref: { description: "kupa-orchard dalinda commit: kupa_orchard/ilan/KUPA78_ORCHARD_METIN.csv", required: true, default: "0278b13" }
      haric: { description: "atlanacak ciftler, bosluk ayrimli CIFT=neden (orn. SAGITTARIUS_SAGITTARIUS=uretim_HATA)", required: false, default: "" }
env:
  O: "gdrive:ASTROLOVE/TEMP/KUPA_ORCHARD_TASLAK_20261019"
jobs:
  kupa:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with: { path: main }
      - name: Etsy kilidi (sira bekle, iptal yok)
        if: ${{ inputs.mod != 'kuru' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: cd main && python3 scripts/etsy/kilit_bekle.py
      - uses: actions/checkout@v4
        with: { ref: kupa-orchard, path: orchard, fetch-depth: 0, sparse-checkout: kupa_orchard/ilan }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Kurulum
        run: |
          set -euo pipefail
          case "${{ inputs.mod }}" in oku|kuru|yaz) ;; *) echo "::error::mod oku|kuru|yaz olmali"; exit 1;; esac
          pip install -q requests==2.34.2
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || sudo apt-get install -y -qq rclone >/dev/null
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"; echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Cift listesi + metin
        env:
          CIFTLER: ${{ inputs.ciftler }}
        run: |
          set -euo pipefail
          mkdir -p _work _out _img
          L=$(cd main/scripts/etsy && python3 -c 'import os, kupa_taslak as k; print(" ".join(k.cift_listesi(os.environ["CIFTLER"])))')
          echo "CIFT_LISTE=$L" >> "$GITHUB_ENV"; echo "cift: $(echo $L | wc -w) | $L"
          git -C orchard show "${{ inputs.metin_ref }}:kupa_orchard/ilan/KUPA78_ORCHARD_METIN.csv" > _work/KUPA78_ORCHARD_METIN.csv
          N=$(python3 -c 'import csv,sys; print(len(list(csv.DictReader(open(sys.argv[1], encoding="utf-8")))))' _work/KUPA78_ORCHARD_METIN.csv)
          echo "metin ${{ inputs.metin_ref }}: $N satir"; [ "$N" = 78 ] || { echo "::error::metin satiri $N (78 olmali)"; exit 1; }
      - name: Galeri + video (kuru, yaz)
        if: ${{ inputs.mod != 'oku' }}
        env:
          HARIC: ${{ inputs.haric }}
        run: |
          set -euo pipefail
          K="gdrive:ASTROLOVE/KUPA_ORCHARD78/${{ inputs.hedef }}"; t0=$(date +%s)
          # mukerrer klasor / eksik-fazla galeri olan cift ATLANIR (ATLA.txt); yalniz temiz ciftler indirilir
          rclone lsjson "$K" --dirs-only --no-modtime --no-mimetype > _work/kok.json
          rclone lsjson -R "$K" --files-only --no-modtime --no-mimetype --include "/*/galeri/[01][0-9]_*.jpg" --include "/*/video/*.mp4" > _work/dosyalar.json
          python3 main/scripts/etsy/kupa_medya_tara.py _work/kok.json _work/dosyalar.json _work $CIFT_LISTE --haric $HARIC
          cp _work/ATLA.txt _out/ATLA.txt
          echo "YAZ_LISTE=$(cat _work/YAZ_LISTE.txt)" >> "$GITHUB_ENV"
          [ -s _work/ATLA.txt ] && echo "::warning::ATLANAN $(tr '\n' ';' < _work/ATLA.txt | cut -c1-900)"
          rclone copy "$K" _img --files-from _work/INDIR.txt --transfers 16 -q
          for c in $(cat _work/YAZ_LISTE.txt); do
            g=$(ls _img/$c/galeri/*.jpg 2>/dev/null | wc -l); v=$(ls _img/$c/video/*.mp4 2>/dev/null | wc -l)
            [ "$g" = 14 ] && [ "$v" = 1 ] || { echo "::error::$c indirme galeri $g/14 video $v/1"; exit 1; }
          done
          echo "indirme: $(cat _work/YAZ_LISTE.txt | wc -w) cift, $(wc -l < _work/INDIR.txt) dosya, $(( $(date +%s) - t0 )) sn"
      - name: Etsy token + onceki durum (oku, yaz)
        if: ${{ inputs.mod != 'kuru' }}
        run: |
          set -euo pipefail
          umask 077
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
          rclone copyto "gdrive:ASTROLOVE/TEMP/BY78_TASLAK_20261014/BY78_TASLAKLAR.csv" _work/BY78_TASLAKLAR.csv
          rclone copy "$O" _out --include "/DURUM.json" -q || true
          [ -f _out/DURUM.json ] && cat _out/DURUM.json || echo "onceki durum yok"
      - name: Etsy SALT OKUMA
        if: ${{ inputs.mod == 'oku' }}
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          BY_CSV: _work/BY78_TASLAKLAR.csv
          OUT: _out
        run: |
          [ -f _work/KUPA78_ORCHARD_METIN.csv ] && export METIN_CSV=_work/KUPA78_ORCHARD_METIN.csv
          python3 main/scripts/etsy/kupa_taslak.py --mod oku --ciftler "$CIFT_LISTE"
      - name: KURU (Etsy'ye istek yok)
        if: ${{ inputs.mod == 'kuru' }}
        env:
          METIN_CSV: _work/KUPA78_ORCHARD_METIN.csv
          IMG_ROOT: _img
          OUT: _out
        run: python3 main/scripts/etsy/kupa_taslak.py --mod kuru --ciftler "$YAZ_LISTE"
      - name: Etsy YAZ (taslak)
        if: ${{ inputs.mod == 'yaz' }}
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          METIN_CSV: _work/KUPA78_ORCHARD_METIN.csv
          IMG_ROOT: _img
          OUT: _out
          ATLA_DOSYA: _out/ATLA.txt
        run: python3 main/scripts/etsy/kupa_taslak.py --mod yaz --ciftler "$YAZ_LISTE"
      - name: Son okuma (salt okuma, ayri adim)
        if: ${{ always() && inputs.mod == 'yaz' }}
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          OUT: _out
        run: |
          [ -f _out/DURUM.json ] || { echo "DURUM.json yok"; exit 0; }
          [ "$(echo $YAZ_LISTE | wc -w)" -le 5 ] || { echo "toplu kosu: son okuma atlandi (geri okuma yaz icinde)"; exit 0; }
          for c in $YAZ_LISTE; do
            L=$(python3 -c 'import json,sys; print(json.load(open("_out/DURUM.json")).get("ciftler", {}).get(sys.argv[1], ""))' "$c")
            [ -n "$L" ] || continue
            LISTING_ID=$L python3 main/scripts/etsy/kupa_son_oku.py && mv _out/KUPA_SON_OKU.json "_out/KUPA_SON_OKU_$c.json"
          done
      - name: Drive'a rapor
        if: ${{ always() }}
        run: '[ -d _out ] && rclone copy _out "$O" -q && echo "::warning::rapor Drive TEMP/KUPA_ORCHARD_TASLAK_20261019" || true'
      - name: Token geri yaz
        if: ${{ always() }}
        run: |
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "token geri yazildi" || true
          rm -rf _work ~/.config/rclone

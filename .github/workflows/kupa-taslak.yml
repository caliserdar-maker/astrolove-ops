name: kupa-taslak
# DAL gorev-g (Serdar 1 Kas, Gorev 20261101G): bu dosya YALNIZ bu dalda SADE KUPA tek burc YENI TASLAK akisidir; main'deki
# kupa-taslak.yml (cift kupa) DEGISMEZ, bu dal main'e alinmaz. Dosya adi yalniz workflow_dispatch icin (main'de ayni adli dosya var).
# Girdi adlari main surumuyle ayni: mod=yaz, ciftler=burc listesi (ARIES / TUMU), hedef=SADE_TASLAK (onay), metin_ref=kupa-orchard commit.
# Kod: scripts/kupa/sade_taslak.py (createDraftListing; mod=yayin'da yalniz 15/15 PASS taslaga PATCH {state: active}; DELETE yok;
#      ayar kaynagi ARIES 4607613712 yalniz okunur; 4607523667'ye istek yok; state draft degilse DUR).
# Medya: sade_taslak.MEDYA_KLASOR / KART_KLASOR (Merkez 1 Kas tablosu); kilitten ONCE iner; 15/15 yoksa o burc atlanir; sha MANIFEST kapisi.
# Rapor: Drive TEMP/SADE_TASLAK_G/<damga>/ ; kalici DURUM.json (burc -> listing_id): TEMP/SADE_TASLAK_G/DURUM.json
permissions:
  actions: read
  contents: read
on:
  workflow_dispatch:
    inputs:
      mod: { description: "oku (Etsy salt okuma) | yaz (taslak) | yayin (taslak + 14/14 PASS ise state=active, Serdar 1 Kas) | denetim (G-OKU: 12 ilan salt okuma, sade_oku.py)", required: true, default: "kuru" }
      ciftler: { description: "burc listesi: ARIES ya da TUMU ya da virgullu", required: true, default: "CANCER_LIBRA" }
      hedef: { description: "onay: SADE_TASLAK", required: true, default: "ORCHARD78_20261019" }
      metin_ref: { description: "kupa-orchard commit: kupa_orchard/ilan/SADE12_*.csv", required: true, default: "0278b13" }
      haric: { description: "kullanilmaz", required: false, default: "" }
env:
  T: "gdrive:ASTROLOVE/TEMP/SADE_TASLAK_G"
jobs:
  sade:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Girdi + dal kapisi
        env: { M: "${{ inputs.mod }}", H: "${{ inputs.hedef }}", MR: "${{ inputs.metin_ref }}", B: "${{ inputs.ciftler }}" }
        run: |
          set -euo pipefail
          [ "${{ github.ref_name }}" = gorev-g ] || { echo "::error::yalniz dal gorev-g (ref ${{ github.ref_name }}); Etsy'ye yazma yok"; exit 1; }
          { [ "$M" = yaz ] || [ "$M" = oku ] || [ "$M" = yayin ] || [ "$M" = denetim ]; } && [ "$H" = SADE_TASLAK ] && [[ "$MR" =~ ^[0-9a-f]{7,40}$ ]] && [[ "$B" =~ ^[A-Za-z,\ ]+$ ]] || { echo "::error::girdi: mod=yaz hedef=SADE_TASLAK metin_ref ciftler"; exit 1; }
          echo "DAMGA=$(date -u +%Y%m%d_%H%M%S)" >> "$GITHUB_ENV"
          case "$M" in oku) echo "ONAY=OKU" ;; yayin) echo "ONAY=SADE_YAYIN" ;; denetim) echo "ONAY=DENETIM" ;; *) echo "ONAY=SADE_TASLAK" ;; esac >> "$GITHUB_ENV"
          [ "$M" = denetim ] && echo "T=gdrive:ASTROLOVE/TEMP/SADE12_OKU" >> "$GITHUB_ENV" || true
      - uses: actions/checkout@v4
      - name: "Betik kapisi"
        run: '[ -f scripts/kupa/sade_taslak.py ] || { echo "::error::sade_taslak.py yok"; exit 1; }'
      - uses: actions/checkout@v4
        with: { ref: kupa-orchard, path: orchard, fetch-depth: 0, sparse-checkout: kupa_orchard/ilan }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Kurulum
        run: |
          set -euo pipefail
          pip install -q requests==2.34.2 pillow==12.3.0 numpy==2.5.3
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq ffmpeg >/dev/null
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || sudo apt-get install -y -qq rclone >/dev/null
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"; echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
          mkdir -p _w _o _img _m
      - name: Metin + medya (kilitten ONCE)
        env: { B: "${{ inputs.ciftler }}", MR: "${{ inputs.metin_ref }}" }
        run: |
          set -euo pipefail
          git -C orchard show "e235d342:kupa_orchard/ilan/SADE12_KARE.json" > _m/SADE12_KARE.json   # Merkez 1 Kas: bayt farkli video icin kare ozeti
          for f in SADE12_SEO_ONERI.csv SADE12_METIN.csv SADE12_MANIFEST.tsv; do git -C orchard show "$MR:kupa_orchard/ilan/$f" > "_m/$f"; done
          L=$(python3 -c 'import sys; sys.path.insert(0,"scripts/kupa"); import sade_taslak as s; print(" ".join(s.burc_listesi(sys.argv[1])))' "$B")
          echo "BURC_LISTE=$L" >> "$GITHUB_ENV"; echo "burc: $L"
          TAM=""; : > _o/ATLA.txt
          for b in $L; do
            python3 scripts/kupa/sade_taslak.py --liste "$b" --liste-dizin _w
            mkdir -p "_img/$b"
            read MK KK < _w/klasor.txt
            rclone copy "gdrive,root_folder_id=$MK:" "_img/$b" --files-from _w/a.txt --max-depth 1 -q || true
            rclone copy "gdrive,root_folder_id=$KK:" "_img/$b" --files-from _w/k.txt --max-depth 1 -q || true
            n=$(ls "_img/$b" | wc -l); echo "$b: $n dosya"
            # Merkez 1 Kas: 15/15 yoksa O BURC atlanir (raporlanir), digerleri surer
            if [ "$n" = 15 ]; then TAM="$TAM $b"; else echo "::warning::$b ATLANDI: medya $n/15"; echo "$b|medya $n/15" >> _o/ATLA.txt; rm -rf "_img/$b"; fi
          done
          TAM=$(echo $TAM); [ -n "$TAM" ] || { echo "::error::hicbir burcta 15/15 medya yok"; exit 1; }
          echo "BURC_LISTE=$TAM" >> "$GITHUB_ENV"; echo "kosulacak: $TAM"
      - name: Medya on kontrolu (Etsy YOK, kilitten ONCE; sha + kare ozeti onbellegi)
        env:
          SEO_CSV: _m/SADE12_SEO_ONERI.csv
          METIN_CSV: _m/SADE12_METIN.csv
          MANIFEST: _m/SADE12_MANIFEST.tsv
          KARE_JSON: _m/SADE12_KARE.json
          KARE_ONBELLEK: _m/KARE_ONBELLEK.json
          IMG_ROOT: _img
        run: python3 scripts/kupa/sade_taslak.py --on-kontrol "$BURC_LISTE"
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - name: Etsy token + kalici durum
        run: |
          set -euo pipefail
          umask 077
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _w/ETSY_TOKEN.json
          # inceleme 1 Kas madde 1: DURUM varsa okunmali; okunamazsa DUR (sessizce "yok" sayilmaz)
          if rclone lsf "$T" --files-only --include "/DURUM.json" | grep -qx DURUM.json; then
            rclone copyto "$T/DURUM.json" _o/DURUM.json || { echo "::error::DURUM.json var ama okunamadi; Etsy'ye yazma yok"; exit 1; }
            cat _o/DURUM.json
          else echo "onceki DURUM yok"; fi
      - name: YAZ (Etsy, yeni taslak)
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _w/ETSY_TOKEN.json
          SEO_CSV: _m/SADE12_SEO_ONERI.csv
          METIN_CSV: _m/SADE12_METIN.csv
          MANIFEST: _m/SADE12_MANIFEST.tsv
          KARE_JSON: _m/SADE12_KARE.json
          KARE_ONBELLEK: _m/KARE_ONBELLEK.json
          IMG_ROOT: _img
          OUT: _o
        run: |
          set +e
          if [ "$ONAY" = DENETIM ]; then python3 scripts/kupa/sade_oku.py --burclar "$(echo $BURC_LISTE | tr ' ' ',')" --confirm OKU12
          else python3 scripts/kupa/sade_taslak.py --burclar "$BURC_LISTE" --confirm "$ONAY"; fi; echo "RC=$?" >> "$GITHUB_ENV"
      - name: Token + cikti Drive'a
        if: always()
        run: |
          set -uo pipefail
          TOKEN_RC=0
          if [ -f _w/ETSY_TOKEN.json ]; then bash scripts/etsy/token_geri_yaz.sh _w/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" || TOKEN_RC=1; fi
          if grep -rqE '"(access_token|refresh_token)"[[:space:]]*:[[:space:]]*"[A-Za-z0-9._-]{20,}"|x-api-key[[:space:]]*:' _o/ 2>/dev/null; then
            echo "::error::Ciktida sir bulundu; Drive'a yazilmadi"; rm -rf _w ~/.config/rclone; exit 1; fi
          [ -d _o ] && ls _o/* >/dev/null 2>&1 && rclone copy _o "$T/${DAMGA}" --immutable -q && echo "::notice::$T/${DAMGA}/" || true
          [ "$ONAY" = DENETIM ] && rm -f _o/DURUM.json                  # G-OKU: kalici DURUM'a dokunulmaz, kopyalanmaz
          if [ "$ONAY" != OKU ] && [ "$ONAY" != DENETIM ] && [ -f _o/DURUM.json ]; then
            rclone copyto _o/DURUM.json "$T/DURUM.json" -q || { echo "::error::DURUM.json Drive'a yazilamadi (sonraki kosu ikinci ilan acmasin diye DUR)"; TOKEN_RC=1; }
          fi
          rm -rf _w ~/.config/rclone
          [ "$TOKEN_RC" = 0 ] || { echo "::error::token geri yazilamadi"; exit 1; }
      - name: Sonuc
        if: always()
        run: |
          case "${RC:-x}" in 0) ;; 5) echo "::warning::kalan kota < 300: G-OKU baslamadi" ;; 4) echo "::warning::KOTA: kalan burclar baslamadi; kota acilinca ayni girdiyle yeniden (DURUM.json kaldigi yerden)" ;;
            *) echo "::error::sonuc kodu ${RC:-yok}"; exit 1 ;; esac

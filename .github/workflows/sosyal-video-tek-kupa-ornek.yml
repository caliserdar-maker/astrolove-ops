name: sosyal-video-tek-kupa-ornek
# TEK KUPA 9:16 sosyal video ORNEGI (21 Eki 2026, Serdar): yalniz CANCER_LIBRA, toplu uretim yok. Metricool'a, Etsy'ye ve
# hicbir hesaba YAZMA YOK. kupa-orchard cift.py (baski katmanlari) + tek kupa on/arka sahneleri, kupa-printful-sonuc esitle.py,
# uretim + QC tek script: sosyal/poster_video/tek_kupa_reel.py. Cikti: Drive ASTROLOVE/TEMP/SOSYAL_VIDEO_TEK_KUPA_ORNEK_20261021/
permissions:
  contents: read
on:
  workflow_dispatch:
jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      O: gdrive:ASTROLOVE/TEMP/SOSYAL_VIDEO_TEK_KUPA_ORNEK_20261021
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Kurulum
      run: |
        set -euo pipefail
        pip install -q numpy==2.1.3 pillow==11.0.0 scipy==1.14.1 opencv-python-headless==4.10.0.84
        sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg fonts-dejavu-core >/dev/null
        curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
    - name: rclone.conf
      env:
        RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      run: |
        set -euo pipefail
        mkdir -p ~/.config/rclone; umask 077
        printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
        if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "::add-mask::$GOOGLE_CLIENT_SECRET"
          grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true; fi
    - name: Katmanlar + uret + QC + Drive
      run: |
        set +e -uo pipefail
        mkdir -p _w/k _o
        T0=$(date +%s)
        git fetch -q origin kupa-orchard kupa-printful-sonuc
        git archive origin/kupa-orchard kupa_orchard | tar -x -C _w/k
        git show origin/kupa-printful-sonuc:kupa_uretim/kod/esitle.py > _w/esitle.py
        bash _w/k/kupa_orchard/kod/sembol_al.sh CANCER_LIBRA _w/sem > /dev/null || { echo "::error::sembol"; exit 1; }
        (cd _w/k/kupa_orchard && python3 -I kod/cift.py Cancer Libra Emily James "My favorite place is with you" ../../sem ../../ko) > _w/cift.log 2>&1 \
          || { echo "::error::cift.py"; tail -5 _w/cift.log; exit 1; }
        echo "::warning::[1/2] cift.py katmanlari $(( $(date +%s) - T0 )) sn"
        python3 -I sosyal/poster_video/tek_kupa_reel.py _w/k/kupa_orchard _w/ko/video _w/esitle.py CANCER LIBRA _o _w/is > _w/log.txt 2>&1; RC=$?
        grep -E 'Traceback|Error|HATA' _w/log.txt | tail -5
        while IFS= read -r l; do echo "::warning::$l" | cut -c1-3900; done < _o/OLCUM.txt
        echo "::warning::[2/2] uretim + QC bitti, toplam $(( $(date +%s) - T0 )) sn, cikis $RC"
        rclone copy _o "$O" -q
        echo "::warning::DRIVE $(rclone lsf "$O" | tr '\n' ' ')"
        echo "RC=$RC" >> "$GITHUB_ENV"
    - name: Sonuc
      if: ${{ always() }}
      run: |
        rm -rf _w ~/.config/rclone
        [ "${RC:-1}" = "0" ]

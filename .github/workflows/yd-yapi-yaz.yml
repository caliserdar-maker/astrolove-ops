name: yd-yapi-yaz
# YD (1st Anniversary) yeni ilan yapisi YAZIMI, onayli KURU plana kilitli. scripts/etsy/yd_yapi_yaz.py. KOSTURMA AYRI SERDAR ONAYIYLA.
# Plan: Drive TEMP/YD_YAPI/KURU_<plan_damga>/ (yd-yapi-kuru ciktisi; plan_damga = kuru kosu no). updateListing YOK; yalniz envanter PUT
# ?max_variations_supported=3 + Style bagi onarimi; profil modlari yalniz kargo ucreti.
# mod kontrol: SALT OKUMA (ilan basina 3 GET). yaz / geri-al / profil / profil-geri-al: ETSY'YE YAZAR, onay sozcugu zorunlu
# (SERDAR_YD_YAPI_YAZ / SERDAR_YD_YAPI_GERI_AL / SERDAR_YD_PROFIL / SERDAR_YD_PROFIL_GERI_AL). sadece: pilot (yaz modunda bos ise tum=evet
# zorunlu, inceleme 30 Eki madde 7); haric: plandan atlanir.
# Ilk FAIL (otomatik geri alma sonrasi) / KOTA / okuma hatasinda kosu durur. Cikti Drive TEMP/YD_YAPI/YAZ_<mod>_<run>_<deneme>/.
permissions:
  actions: read
  contents: read
on:
  workflow_dispatch:
    inputs:
      mod: {description: "kontrol | yaz | geri-al | profil | profil-geri-al", required: true, default: "kontrol"}
      plan_damga: {description: "kuru kosu no (Drive TEMP/YD_YAPI/KURU_<no>)", required: true}
      sadece: {description: "virgullu listing_id (pilot: tek ilan; bos = plandaki tum ilanlar)", required: false, default: ""}
      haric: {description: "virgullu listing_id, plandan atlanir", required: false, default: ""}
      onay: {description: "yazan modlar icin onay sozcugu", required: false, default: ""}
      tum: {description: "mod yaz + sadece bos: plandaki TUM ilanlar icin acikca evet (pilot sonrasi; inceleme 30 Eki madde 7)", required: false, default: "hayir"}
jobs:
  yaz:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Girdi kapisi
        env: {MOD: "${{ inputs.mod }}", PD: "${{ inputs.plan_damga }}", S: "${{ inputs.sadece }}", H: "${{ inputs.haric }}", TUM: "${{ inputs.tum }}"}
        run: |
          [[ "$MOD" =~ ^(kontrol|yaz|geri-al|profil|profil-geri-al)$ ]] || { echo "::error::mod"; exit 1; }
          [[ "$PD" =~ ^[0-9]+$ ]] || { echo "::error::plan_damga"; exit 1; }
          [[ "$S" =~ ^([0-9]+(,[0-9]+)*)?$ && "$H" =~ ^([0-9]+(,[0-9]+)*)?$ ]] || { echo "::error::sadece/haric"; exit 1; }
          [[ "$TUM" =~ ^(evet|hayir)$ ]] || { echo "::error::tum (evet / hayir)"; exit 1; }
          if [ "$MOD" = yaz ] && [ -z "$S" ] && [ "$TUM" != evet ]; then echo "::error::yaz: sadece (pilot) bos ise tum=evet gerekli"; exit 1; fi
      - uses: actions/checkout@v4
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || { sudo apt-get install -y -qq rclone >/dev/null; }
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Plan + token
        env: {PD: "${{ inputs.plan_damga }}"}
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out "_plan/KURU_$PD"
          rclone copy "gdrive:ASTROLOVE/TEMP/YD_YAPI/KURU_$PD" "_plan/KURU_$PD" \
            --include "KURU_*.json" --include "PLAN.csv" --include "PROFIL_PLAN.json" --transfers 8 -q
          echo "plan dosyasi: $(ls "_plan/KURU_$PD" | wc -l)"
          [ -f "_plan/KURU_$PD/PLAN.csv" ] || { echo "::error::plan KURU_$PD yok"; exit 1; }
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
      - name: Yaz
        env:
          MOD: ${{ inputs.mod }}
          PD: ${{ inputs.plan_damga }}
          S: ${{ inputs.sadece }}
          H: ${{ inputs.haric }}
          ONAY: ${{ inputs.onay }}
          TUM: ${{ inputs.tum }}
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          set +e -o pipefail
          TA=(); [ "$TUM" = evet ] && TA=(--tum)
          python3 scripts/etsy/yd_yapi_yaz.py --mod "$MOD" --plan "_plan/KURU_$PD" --plan-damga "$PD" --sadece "$S" --haric "$H" \
            --onay "$ONAY" "${TA[@]}" --out _out 2>&1 | tee _work/kosu.log
          echo "KOD=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
      - name: Token geri yaz + cikti Drive'a
        if: ${{ always() }}
        env: {MOD: "${{ inputs.mod }}"}
        run: |
          TOKEN_RC=0; OUT_RC=0; bash scripts/etsy/token_geri_yaz.sh || TOKEN_RC=1
          [ -f _work/kosu.log ] && python3 scripts/guvenlik/log_suz.py < _work/kosu.log > _out/kosu.txt
          if ls _out/* >/dev/null 2>&1; then
            python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/ETSY_TOKEN.json _out || { echo "::error::ciktida sir"; exit 1; }
            rclone copy _out "gdrive:ASTROLOVE/TEMP/YD_YAPI/YAZ_${MOD}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" --immutable -q \
              && echo "::notice title=YD YAPI::TEMP/YD_YAPI/YAZ_${MOD}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}/" || OUT_RC=1
          fi
          [ "$TOKEN_RC" = 0 ] && [ "$OUT_RC" = 0 ] && [ "${KOD:-1}" = 0 ] || exit 1
      - if: always()
        run: rm -rf _work _plan ~/.config/rclone

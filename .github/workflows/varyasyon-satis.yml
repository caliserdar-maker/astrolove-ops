name: varyasyon-satis

# Serdar 27 Eyl 2026: satilan renk/boy dagilimi (tek renk mi 5 renk mi). SALT OKUMA.
# getShopReceipts. Musteri adi/adres yok. Cikti Drive TEMP/VARYASYON_SATIS.md

permissions:
  actions: read
  contents: read

on:
  workflow_dispatch:
    inputs:
      adet:
        description: "Son kac satis"
        default: "100"

jobs:
  oku:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Oku
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          ADET: ${{ inputs.adet }}
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
          python scripts/etsy/varyasyon_satis.py 2>&1 | tee _satis.log
          rclone copyto out/VARYASYON_SATIS.md "gdrive:ASTROLOVE/TEMP/VARYASYON_SATIS.md" -q
          rclone copyto out/VARYASYON_SATIS.json "gdrive:ASTROLOVE/TEMP/VARYASYON_SATIS.json" -q
      - name: Hata logu
        if: failure()
        run: |
          if [ -f _satis.log ]; then
            tail -40 _satis.log | python3 scripts/guvenlik/log_suz.py > _t.log   # ::add-mask:: ve token desenleri Drive'a gitmez
            if python3 scripts/guvenlik/log_suz.py --say < _t.log > /dev/null; then rclone copyto _t.log "gdrive:ASTROLOVE/TEMP/LOGS/varyasyon_satis_${{ github.run_id }}.log" -q || true
            else echo "::warning::log suzgecten gecmedi, Drive'a yazilmadi"; fi
          fi
      - name: Token geri yaz
        if: always()
        run: |
          set -euo pipefail
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "Token geri yazildi" || echo "Token yenilenmedi"
      - if: always()
        run: rm -rf _work ~/.config/rclone

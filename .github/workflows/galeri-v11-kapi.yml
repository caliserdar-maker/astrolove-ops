name: galeri-v11-kapi
# Galeri v11 B3 tam boy kapi (Merkez 29 Eki, plan v2 adim 5b). ETSY YOK. scripts/kapak78/galeri_v11_kapi.py (Pillow 11.0.0).
# mod=kapi: TEMP/POSTER_GALERI_V11/<dosya_damga> kartlari; esik config/galeri_v11_esik.json (yoksa / onay bossa etiket ve bant ESIK_YOK).
# mod=olc : onayli CANCER_LIBRA 5 gorsel (TEMP/POSTER_GALERI_V11/<dosya_damga>, _ONAYLI tasimasi) + canli v10 pozitif kontroller
#           -> ESIK_ONERI (Serdar onayina sunulur; kullanilmaz).
# Referanslar (yalniz okuma): v10 kartlar TEMP/POSTER_GALERI_V10/20261026_181944 (G6-G9), v10 kapak TEMP/POSTER_KAPAK_V10/20261026_153710.
# Cikti ayni klasor altinda KAPI/<kosu>/ (KAPI.csv, KAPI.md | ESIK_ONERI.json, .md).
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      dosya_damga: {description: "TEMP/POSTER_GALERI_V11/<damga>", required: true}
      mod: {description: "kapi | olc", required: true, default: "kapi"}
      sadece: {description: "virgullu cift / listing_id (bos = 78)", required: false, default: ""}
jobs:
  kapi:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Girdi kapisi
        env: {D: "${{ inputs.dosya_damga }}", M: "${{ inputs.mod }}", S: "${{ inputs.sadece }}"}
        run: '[[ "$D" =~ ^[0-9]{8}_[0-9]{6}$ && "$M" =~ ^(kapi|olc)$ && "$S" =~ ^([A-Z0-9_]+(,[A-Z0-9_]+)*)?$ ]] || { echo "::error::girdi"; exit 1; }'
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q pillow==11.0.0 numpy==2.1.3
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || { sudo apt-get install -y -qq rclone >/dev/null; }
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true; fi
      - name: Girdiler (Drive, yalniz okuma)
        env: {D: "${{ inputs.dosya_damga }}"}
        run: |
          set -euo pipefail
          mkdir -p _d _g _k
          rclone copy "gdrive:ASTROLOVE/TEMP/POSTER_GALERI_V11/$D" _d --include "*_W[0-9][0-9]_*.jpg" --max-depth 1 --transfers 8 -q
          rclone copy "gdrive:ASTROLOVE/TEMP/POSTER_GALERI_V10/20261026_181944" _g --include "*_G[6-9].jpg" --max-depth 1 --transfers 8 -q
          rclone copy "gdrive:ASTROLOVE/TEMP/POSTER_KAPAK_V10/20261026_153710" _k --include "KAPAK_*.jpg" --max-depth 1 --transfers 8 -q
          echo "v11 $(ls _d | wc -l) | v10 kart $(ls _g | wc -l) | v10 kapak $(ls _k | wc -l)"
      - name: Kapi / olcum
        env: {M: "${{ inputs.mod }}", S: "${{ inputs.sadece }}"}
        run: |
          set +e
          if [ "$M" = "olc" ]; then
            python3 -I scripts/kapak78/galeri_v11_kapi.py --olc --onayli _d --v10-galeri _g --out _out; RC=$?
          else
            python3 -I scripts/kapak78/galeri_v11_kapi.py --dosya-dir _d --v10-galeri _g --v10-kapak _k --ciftler data/pod/pod78_ids.csv \
              --sadece "$S" --esik config/galeri_v11_esik.json --out _out; RC=$?
          fi
          echo "RC=$RC" >> "$GITHUB_ENV"
      - name: Drive'a yaz
        if: ${{ always() }}
        env: {D: "${{ inputs.dosya_damga }}"}
        run: |
          set -euo pipefail
          [ -d _out ] || exit 0
          rclone copy _out "gdrive:ASTROLOVE/TEMP/POSTER_GALERI_V11/$D/KAPI/${GITHUB_RUN_ID}" --immutable -q
          echo "Cikti: TEMP/POSTER_GALERI_V11/$D/KAPI/${GITHUB_RUN_ID}" | tee -a "$GITHUB_STEP_SUMMARY"
          for f in KAPI.md ESIK_ONERI.md; do [ -f "_out/$f" ] && head -6 "_out/$f" >> "$GITHUB_STEP_SUMMARY"; done; true
      - name: Sonuc
        run: '[ "${RC:-1}" = 0 ] || { echo "::error::kapi PASS degil (RC ${RC:-?})"; exit 1; }'
      - if: always()
        run: rm -rf _d _g _k _out ~/.config/rclone

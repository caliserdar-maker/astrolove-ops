name: musteri-dal-sil
# ACIL MUSTERI VERISI (Serdar 21 Eki, madde 2): YALNIZ inceleme/siparis-9000000000 dali silinir (dal adi sabit, girdi yok).
# Yedek: Drive SIPARIS_ISIM/DIJITAL/9000000000/DAL_YEDEK_20261021 (musteri-dal-yedek kosu 39605583575, check one-way 103 PASS).
# Dal ucu yedeklenen d1c4848a degilse silmez (yedekten sonra yeni commit gelmis olur). Gecici is akisi: P8 ile kaldirilir.
permissions:
  contents: write
on:
  workflow_dispatch: {}
jobs:
  sil:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      B: inceleme/siparis-9000000000
      YEDEK_UC: d1c4848a34752976e632f4169ceb5678a8094871
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dal ucu = yedek ucu
        run: |
          set -euo pipefail
          U=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$B" --jq .object.sha)
          echo "dal ucu $U"; [ "$U" = "$YEDEK_UC" ] || { echo "::error::dal ucu yedekten farkli, silinmedi"; exit 1; }
      - name: Sil
        run: |
          set -euo pipefail
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$B"
          echo "silindi $B"
      - name: Dogrula (dal yok)
        run: |
          set -uo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$B" >/dev/null 2>&1; then echo "::error::dal hala var"; exit 1; fi
          echo "dal yok: $B"

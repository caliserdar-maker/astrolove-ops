name: sosyal-video-p-78
# 78 cift sosyal video, acilis P (20 Eki 2026, Serdar: P onayli; baslik uc satir, poster videonun kendi posteri).
# Metricool'a ve hicbir hesaba YAZMA YOK (IG/FB Reels degisimi ayri gorev). sosyal/video_v9/video_p_toplu.py: her cift
# acilis_p.p_kare (olcek onayli CANCER_LIBRA ile ayni; sigmayan baslik yalniz kendisi kuculur) + video_uret --acilis P + p_qc.olc.
# hazirla: 78 poster listesi + onayli v9 yolu dogrulamasi (dogrula.py) + matrix; uret: 4'erli 20 is (her biri 4 paralel);
# topla: KONTROL.csv, KONTAK_ILK_KARE_*.jpg, OZET.txt. Muzik 2 (kesin secim, 78 ciftte ayni); parola Drive MUZIK_PAROLA.txt.
# Cikti: Drive ASTROLOVE/TEMP/SOSYAL_VIDEO_P_78_20261020/
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      grup:
        description: 'is basina cift'
        default: '4'
env:
  D: gdrive:ASTROLOVE/TEMP/SOSYAL_VIDEO_P_78_20261020
  P2000: gdrive:ASTROLOVE/TEMP/PIN_V6_20261012/_POSTER2000
  ONAY_P: gdrive:ASTROLOVE/TEMP/SOSYAL_ACILIS_P_20261020/P_kare.png
  REF_DIR: 1_rcZ69bhw00QfHedBiWywEoHPu9Y4bkB
jobs:
  hazirla:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Kurulum
      run: |
        set -euo pipefail
        pip install -q numpy==2.1.3 pillow==11.0.0 scipy==1.14.1 opencv-python-headless==4.10.0.84
        curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
    - name: rclone.conf
      env:
        RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      run: |
        set -euo pipefail
        mkdir -p ~/.config/rclone; umask 077
        printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
        if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "::add-mask::$GOOGLE_CLIENT_SECRET"
          grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true; fi
    - name: Dogrula + is listesi
      id: m
      env:
        GRUP: ${{ inputs.grup }}
      run: |
        set -euo pipefail
        case "$GRUP" in ''|*[!0-9]*) echo "::error::grup sayi"; exit 1 ;; esac
        mkdir -p _w/ref _w/dg
        rclone copyto gdrive:AstroLoveArt_Gemini_Leo_2000.jpg _w/ref/GEMINI_LEO.jpg --drive-root-folder-id "$REF_DIR" -q
        python3 sosyal/video_v9/video_uret.py --poster _w/ref/GEMINI_LEO.jpg --a Gemini --b Leo --out _w/dg --kareler 2,5,8,13,17,22 >/dev/null
        python3 sosyal/video_v9/dogrula.py _w/dg | tee _w/dg.txt
        sed 's/^/::warning::DOGRULA /' _w/dg.txt
        rclone lsf "$P2000" --files-only --include "*.jpg" | sed 's/\.jpg$//' | sort > liste.txt
        N=$(wc -l < liste.txt); echo "::warning::POSTER2000 $N poster"; [ "$N" = 78 ] || { echo "::error::78 poster yok ($N)"; exit 1; }
        python3 -c "
        import json, sys
        p = open('liste.txt').read().split(); g = int(sys.argv[1])
        m = [{'no': i // g + 1, 'pairs': ','.join(p[i:i + g])} for i in range(0, len(p), g)]
        print('matrix=' + json.dumps({'include': m}))" "$GRUP" >> "$GITHUB_OUTPUT"
        rm -rf ~/.config/rclone
  uret:
    needs: hazirla
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.hazirla.outputs.matrix) }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Kurulum
      run: |
        set -euo pipefail
        pip install -q numpy==2.1.3 pillow==11.0.0 scipy==1.14.1 opencv-python-headless==4.10.0.84
        sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg fonts-dejavu-core >/dev/null
        curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
        curl -fsSL --retry 3 "https://raw.githubusercontent.com/google/fonts/main/ofl/ebgaramond/EBGaramond%5Bwght%5D.ttf" -o "$RUNNER_TEMP/EBGaramond[wght].ttf"
        echo "::warning::CPU $(nproc)"
    - name: rclone.conf
      env:
        RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      run: |
        set -euo pipefail
        mkdir -p ~/.config/rclone; umask 077
        printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
        if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "::add-mask::$GOOGLE_CLIENT_SECRET"
          grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true; fi
    - name: Uret + QC
      env:
        PAIRS: ${{ matrix.pairs }}
      run: |
        set +e -uo pipefail
        mkdir -p _w/P2000 _w/m _o
        for k in ${PAIRS//,/ }; do rclone copyto "$P2000/$k.jpg" "_w/P2000/$k.jpg" -q || echo "::error::poster yok: $k"; done
        rclone copyto "$ONAY_P" _w/onay_P_kare.png -q
        P=$(rclone cat "gdrive:ASTROLOVE/TEMP/MUZIK_PAROLA.txt" 2>/dev/null | tr -d '\r\n')
        [ -n "$P" ] && echo "::add-mask::$P"
        [ -n "$P" ] || { echo "::error::muzik parolasi Drive'dan okunamadi"; exit 1; }
        MUZIK_PAROLA="$P" openssl enc -d -aes-256-cbc -pbkdf2 -in sosyal/video_v9/assets/muzik_2.m4a.enc -out _w/m/muzik.m4a -pass env:MUZIK_PAROLA \
          || { unset P; echo "::error::muzik cozulemedi"; exit 1; }
        unset P
        python3 sosyal/video_v9/video_p_toplu.py --posters _w/P2000 --pairs "$PAIRS" --font "$RUNNER_TEMP/EBGaramond[wght].ttf" \
          --muzik _w/m/muzik.m4a --out _o --is 4 --onay_p _w/onay_P_kare.png | tee _w/log.txt; RC=${PIPESTATUS[0]}
        grep -E 'ILERLEME|OZET' _w/log.txt | sed 's/^/::warning::/'
        for f in _o/_is/*/log.txt; do [ -f "$f" ] && { echo "::error::FAIL log $f"; tail -15 "$f"; }; done
        rm -rf _w/m
        rclone copy _o "$D" -q --include "*.mp4"
        mkdir -p _qc && cp -r _o/ILK _o/satir _o/olcum _qc/ 2>/dev/null
        echo "RC=$RC" >> "$GITHUB_ENV"
    - uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: qc-${{ matrix.no }}
        path: _qc/
        if-no-files-found: ignore
        retention-days: 7
    - name: Sonuc
      if: ${{ always() }}
      run: |
        rm -rf ~/.config/rclone _w
        [ "${RC:-1}" = "0" ]
  topla:
    if: ${{ always() && needs.hazirla.result == 'success' }}
    needs:
    - hazirla
    - uret
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Kurulum
      run: |
        pip install -q pillow==11.0.0
        sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y fonts-dejavu-core >/dev/null
        curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
    - name: rclone.conf
      env:
        RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      run: |
        set -euo pipefail
        mkdir -p ~/.config/rclone; umask 077
        printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
        if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "::add-mask::$GOOGLE_CLIENT_SECRET"
          grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true; fi
    - uses: actions/download-artifact@v4
      with:
        path: _a
        pattern: qc-*
    - name: KONTROL.csv + kontak
      run: |
        set +e -uo pipefail
        mkdir -p _t/ILK _t/satir _t/olcum _o
        for d in _a/qc-*; do cp -r $d/ILK/. _t/ILK/ 2>/dev/null; cp -r $d/satir/. _t/satir/ 2>/dev/null; cp -r $d/olcum/. _t/olcum/ 2>/dev/null; done
        python3 sosyal/video_v9/video_p_topla.py _t _o | tee _w_topla.txt; RC=${PIPESTATUS[0]}
        rclone lsf "$D" --include "*.mp4" | wc -l | sed 's/^/::warning::DRIVE mp4 /'
        N=$(rclone lsf "$D" --include "*.mp4" | wc -l); echo "Drive mp4: $N" >> _o/OZET.txt
        [ "$N" = 78 ] || RC=1
        cp -r _t/olcum _o/OLCUM_CIFT
        rclone copy _o "$D" -q
        sed 's/^/::warning::/' _o/OZET.txt
        rm -rf ~/.config/rclone
        exit $RC

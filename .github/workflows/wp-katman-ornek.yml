name: wp-katman-ornek

# WP KATMAN ORNEKLERI (30 Eyl 2026, Serdar genel onayi): 3 cift x (11x14, 8x10).
# Duz renkte (CI, olmazsa MB) mevcut hatla baski -> murekkep katmani -> WP plate uzerine WP murekkebi.
# Kimlik testi tablosu + ornekler YALNIZ Drive TEMP/WP_ORNEK. PLATES / POD_PRINT salt okunur.
# Etsy/Prodigi secret'i YOK; musteriye hicbir sey gitmez.
# Tetik: config/wp_katman.trigger degisikligi (bu dal).

permissions:
  contents: read

on:
  push:
    branches: [claude/wp-katman-baski-60sk0s]
    paths:
      - config/wp_katman.trigger

concurrency: wp-katman-ornek

jobs:
  ornek:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        cift: [AQUARIUS_CANCER, ARIES_SCORPIO, CANCER_LIBRA]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python bagimliliklari
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pillow opencv-python-headless numpy fonttools img2pdf pikepdf
      - name: rclone kur
        run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONF_B64:-}" ]; then echo "HATA: RCLONE_CONF_B64 yok" >&2; exit 1; fi
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Sentetik test
        run: python scripts/medya_v1/test_wp_katman.py && python scripts/medya_v1/test_wp_bakir.py && python scripts/medya_v1/test_wp_dikis_yanyana.py
      - name: WP katman ornegi
        run: python scripts/medya_v1/wp_ornek.py --cift "${{ matrix.cift }}" --boylar 11x14,8x10
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone

  tablo:
    needs: ornek
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow opencv-python-headless numpy
      - name: rclone kur
        run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Kimlik tablosu
        run: python scripts/medya_v1/wp_ornek.py --tablo
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone

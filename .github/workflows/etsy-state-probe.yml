name: etsy-state-probe

# SALT OKUR: magazadaki ilanlarin durum dagilimi (draft/active/inactive/expired sayilari) + istege bagli
# tek ilanin state'i. Dogrulama amacli, 4-5 GET. Hicbir yazma yapmaz.

on:
  workflow_dispatch:
    inputs:
      listing_ids:
        description: "Virgullu ilan id listesi (state tek tek okunur; bos birakilabilir)"
        required: false
        default: ""

concurrency:
  group: etsy-token
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
      - name: Token
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
      - name: Durum dagilimi (salt okur)
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          IDS: ${{ inputs.listing_ids }}
        run: |
          set -euo pipefail
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import os, sys
          sys.path.insert(0, "scripts/etsy")
          from etsy_common import Etsy, TokenStore, mask
          k, s = os.environ.get("ETSY_API_KEY", ""), os.environ.get("ETSY_SHARED_SECRET", "")
          mask(k); mask(s)
          store = TokenStore(os.environ["TOKEN_FILE"], k, s)
          if store.needs_refresh():
              store.refresh()
          api = Etsy(store)
          shop = os.environ["ETSY_SHOP_ID"]
          for st in ("draft", "active", "inactive", "expired"):
              r = api.get(f"/shops/{shop}/listings", params={"state": st, "limit": 1}) or {}
              print(f"{st}: {r.get('count')}")
          for lid in [x.strip() for x in (os.environ.get("IDS") or "").split(",") if x.strip()]:
              L = api.get(f"/listings/{lid}") or {}
              print(f"{lid}: state={L.get('state')} | created={L.get('creation_timestamp')} | updated={L.get('last_modified_timestamp')} | state_ts={L.get('state_timestamp')}")
          print(f"x-remaining-today: {api.remaining}")
          PY
      - name: Token geri yaz
        if: ${{ always() }}
        run: |
          set -euo pipefail
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "Token geri yazildi" || echo "Token yenilenmedi"
          rm -rf _work ~/.config/rclone

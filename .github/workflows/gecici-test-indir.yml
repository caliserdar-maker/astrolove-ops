name: gecici-test-indir
# GECICI (16 Eki 2026): yalniz gecici/test-indir dalini siler. Hemen ardindan bu dosya main'den kaldirilir.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sil:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gecici dali sil
        run: git ls-remote --exit-code "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" refs/heads/gecici/test-indir && git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" --delete gecici/test-indir

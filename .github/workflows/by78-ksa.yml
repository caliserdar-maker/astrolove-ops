name: by78-ksa
# BIZIM YILIMIZ: ayri kargo profili (adim=profil) / SKU + aciklama + profil baglama (adim=ilan). ETSY'YE YAZAR.
# Serdar onayi 15 Eki 2026 (A-D plani). onay alani SERDAR_AD_15EKI olmali. Cikti: Drive TEMP/BY78_KSA_20261015/.
permissions:
  actions: read
  contents: read
on:
  workflow_dispatch:
    inputs:
      adim:
        description: "profil | ilan"
        type: choice
        options: [profil, ilan]
        default: profil
      ciftler:
        description: "ilan adimi: bosluklu cift listesi (ornek CANCER_LIBRA)"
        default: ""
      profil:
        description: "ilan adimi: yeni BY kargo profil id"
        default: ""
      onay:
        description: "SERDAR_AD_15EKI"
        default: ""
jobs:
  ksa:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Onay kapisi
        run: |
          [ "${{ inputs.onay }}" = "SERDAR_AD_15EKI" ] || { echo "::error::onay yok"; exit 1; }
      - uses: actions/checkout@v4
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Token + taslak listesi
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
          rclone copyto "gdrive:ASTROLOVE/TEMP/BY78_TASLAK_20261014/BY78_TASLAKLAR.csv" _work/TASLAK.csv
      - name: Calistir
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          TASLAK_CSV: _work/TASLAK.csv
          ADIM: ${{ inputs.adim }}
          CIFTLER: ${{ inputs.ciftler }}
          PROFIL: ${{ inputs.profil }}
        run: python3 scripts/etsy/by78_kargo_sku_aciklama.py --adim "$ADIM" --ciftler "$CIFTLER" --profil "$PROFIL" --out _out
      - name: Token geri yaz + cikti Drive'a
        if: ${{ always() }}
        run: |
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "token geri yazildi" || true
          if [ -d _out ] && ls _out/* >/dev/null 2>&1; then
            python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/ETSY_TOKEN.json _out || { echo "::error::ciktida sir"; exit 1; }
            rclone copy _out "gdrive:ASTROLOVE/TEMP/BY78_KSA_20261015" -q && echo "Cikti: TEMP/BY78_KSA_20261015/"
          fi
          rm -rf _work ~/.config/rclone

name: galeri-v10-dogrula

# Galeri v10 bagimsiz dogrulama (Merkez 28 Eki madde 1; Serdar onayi). ETSY SALT OKUMA: ilan basina tek GET (images), yazma
# yontemleri kapali; kota tabani kota_taban (varsayilan 10 = KOTA_SINIRI; daha yuksegi yalniz Serdar talimatiyla girdi olarak). Durum dosyalarina YAZMAZ.
# Drive girdileri Etsy kilidi ALINMADAN once indirilir (KILIT SURESI): PLAN_V10.json (KOSU/<plan kosusu>), ILERLEME.json,
# v10 kapaklar TEMP/POSTER_KAPAK_V10/20261026_153710, eski rank 1 yedegi TEMP/POSTER_KAPAK_V10_YEDEK/20261026_144404.
# Cikti TEMP/POSTER_GALERI_V10_YUKLE/DOGRULA/<run_id>/ (DOGRULA.md, DOGRULA.json, SAPMA.csv, log). scripts/kapak78/galeri_v10_dogrula.py

permissions:
  actions: read
  contents: read

on:
  workflow_dispatch:
    inputs:
      plan_damga: {description: "kuru kosu plan_damga (<kosu>_<sha12>)", required: true, default: "40377589850_ab5b0d982175"}
      galeri_damga: {description: "TEMP/POSTER_GALERI_V10/<damga> (yalniz rapor)", required: true, default: "20261026_181944"}
      kota_taban: {description: "Etsy kalan kota bu degerin altina inmez (varsayilan KOTA_SINIRI 10; 28 Eki kosusu 515 ile)", required: true, default: "10"}

env:
  T: "gdrive:ASTROLOVE/TEMP"
  O: "gdrive:ASTROLOVE/TEMP/POSTER_GALERI_V10_YUKLE"

jobs:
  is:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Girdi kapisi
        env: {PD: "${{ inputs.plan_damga }}", GD: "${{ inputs.galeri_damga }}", KT: "${{ inputs.kota_taban }}"}
        run: '[[ "$PD" =~ ^[0-9]+_[0-9a-f]{12}$ && "$GD" =~ ^[0-9]{8}_[0-9]{6}$ && "$KT" =~ ^[0-9]{2,5}$ ]] || { echo "::error::girdi"; exit 1; }'
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2 numpy==2.1.3 pillow==11.0.0
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Girdiler (Drive, kilit oncesi)
        env: {PD: "${{ inputs.plan_damga }}"}
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out _in/kapak _in/yedek
          rclone copyto "$O/KOSU/${PD%%_*}/PLAN_V10.json" _work/PLAN_V10.json
          rclone copyto "$O/ILERLEME.json" _work/ILERLEME.json
          rclone copy "$T/POSTER_KAPAK_V10/20261026_153710" _in/kapak --include "KAPAK_*.jpg" --max-depth 1 --transfers 8 -q
          rclone copy "$T/POSTER_KAPAK_V10_YEDEK/20261026_144404" _in/yedek --include "*/r1_*.jpg" --transfers 8 -q
          echo "indirilen: kapak $(ls _in/kapak | wc -l), eski r1 $(ls _in/yedek/*/r1_*.jpg 2>/dev/null | wc -l)"
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - name: Token
        run: |
          set -euo pipefail
          umask 077
          rclone copyto "$T/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
      - name: Dogrulama (salt okuma)
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          PD: ${{ inputs.plan_damga }}
          GD: ${{ inputs.galeri_damga }}
          KT: ${{ inputs.kota_taban }}
        run: |
          set +e -o pipefail
          python3 scripts/kapak78/galeri_v10_dogrula.py --plan _work/PLAN_V10.json --plan-damga "$PD" --galeri-damga "$GD" \
            --ilerleme _work/ILERLEME.json --ciftler data/pod/pod78_ids.csv --kapak-dir _in/kapak --yedek-dir _in/yedek \
            --out _out --kota-taban "$KT" 2>&1 | tee _work/kosu.log
          echo "KOD=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
      - name: Token + cikti Drive'a
        if: always()
        run: |
          set -uo pipefail
          TOKEN_FAIL=""
          if [ -f _work/ETSY_TOKEN.json.updated ]; then
            TOKEN_FAIL=1
            for n in 1 2 3; do
              if rclone copyto _work/ETSY_TOKEN.json "$T/ETSY_TOKEN.json"; then TOKEN_FAIL=""; echo "Token geri yazildi (deneme $n)"; break; fi
              echo "Token geri yazimi basarisiz (deneme $n)"; sleep 10
            done
            [ -z "$TOKEN_FAIL" ] || echo "::error::ETSY TOKEN GERI YAZILAMADI (3 deneme). Yeni refresh token kaybolabilir; Etsy kosulari baslatma, Merkez'e bildir."
          else
            echo "Token yenilenmedi (yenileme yok)"
          fi
          [ -f _work/kosu.log ] && python3 scripts/guvenlik/log_suz.py < _work/kosu.log > "_out/kosu_$(date -u +%Y%m%d_%H%M).txt"
          if grep -rqE '"(access_token|refresh_token)"[[:space:]]*:[[:space:]]*"[A-Za-z0-9._-]{20,}"|x-api-key[[:space:]]*:' _out/ 2>/dev/null; then
            echo "::error::Ciktida sir bulundu; Drive'a yazilmadi"; exit 1; fi
          [ -d _out ] && rclone copy _out "$O/DOGRULA/${GITHUB_RUN_ID}" -q && echo "::notice title=GALERI V10 DOGRULA::Drive TEMP/POSTER_GALERI_V10_YUKLE/DOGRULA/${GITHUB_RUN_ID}/"
          [ -f _out/DOGRULA.md ] && head -40 _out/DOGRULA.md >> "$GITHUB_STEP_SUMMARY" || true
          [ -z "$TOKEN_FAIL" ] || exit 1
          [ "${KOD:-1}" = 0 ] || { echo "::error::cikis ${KOD:-?} (sapma ya da DUR; DOGRULA.md)"; exit 1; }
      - if: always()
        run: rm -rf _work _in ~/.config/rclone

name: regresyon-rapor

# SALT OKUR: regresyon-78 kosusunun (RUN_ID) artifact'lerinden rapor + FAIL hucre tablosu (kapi + deger).
# Drive'a yalniz TEMP/REGRESYON_78x4_<damga>/ (REGRESYON.md, FAIL_TABLO.md, jsonl). Etsy / musteri YOK.
# Tetik: config/regresyon_rapor.trigger degisikligi (bu dal).

permissions:
  contents: read
  actions: read

on:
  push:
    branches: [claude/gracious-meitner-i72rkr]
    paths:
      - config/regresyon_rapor.trigger

env:
  RUN_IDS: "36828199342"          # bosluklu liste; sonraki kosu ayni hucrede oncekinin yerine gecer

jobs:
  rapor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Artifact'ler (her kosu ayri klasor, sirali)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          i=0
          for r in $RUN_IDS; do
            i=$((i+1)); gh run download "$r" -R "$GITHUB_REPOSITORY" -D "sonuc/${i}_$r"
          done
      - run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Rapor + FAIL tablosu
        run: |
          set +e
          mkdir -p e y rapor
          for f in sonuc/*/sonuc_eski_*/*.jsonl; do k=$(basename "$(dirname "$(dirname "$f")")"); cp "$f" "e/${k}_$(basename "$f")"; done
          for f in sonuc/*/sonuc_yeni_*/*.jsonl; do k=$(basename "$(dirname "$(dirname "$f")")"); cp "$f" "y/${k}_$(basename "$f")"; done
          python3 scripts/medya_v1/regresyon_karsilastir.py --eski e --yeni y --md rapor/REGRESYON.md > /dev/null
          python3 scripts/medya_v1/regresyon_fail_tablo.py y
          cp FAIL_TABLO.md rapor/ && cat e/*.jsonl > rapor/eski.jsonl && cat y/*.jsonl > rapor/yeni.jsonl
          D=$(date -u +%Y%m%d_%H%M)
          rclone copy rapor "gdrive:ASTROLOVE/TEMP/REGRESYON_78x4_$D" && echo "rapor: TEMP/REGRESYON_78x4_$D"
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone

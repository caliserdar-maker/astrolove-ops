name: siparis-kisisel-oku

# SALT OKUMA (Serdar 23 Eki): tek receipt'in kisisellestirme alanlari -> GIZLI siparis klasoru
# Drive ASTROLOVE/SIPARIS/<receipt>/OKUMA_<run_id>/KISISEL.json. Ham receipt dokumu YOK; alici adi / adres yazilmaz.
# Loga deger yazilmaz (scripts/etsy/siparis_kisisel.py yalniz alan adlarini basar). Etsy'ye yazma / mesaj YOK.

permissions:
  actions: read
  contents: read

on:
  workflow_dispatch:
    inputs:
      receipt: {description: "Etsy receipt (yalniz rakam)", required: true}

jobs:
  oku:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: Etsy kilidi (sira bekle, iptal yok)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Token
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
      - name: Oku (salt okur)
        env:
          RECEIPT: ${{ inputs.receipt }}
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
        run: |
          set -euo pipefail
          [[ "$RECEIPT" =~ ^[0-9]+$ ]] || { echo "::error::receipt"; exit 1; }
          python3 scripts/etsy/siparis_kisisel.py --receipt "$RECEIPT" --out _out
      - name: Token geri yaz + gizli klasore yaz
        if: always()
        env:
          RECEIPT: ${{ inputs.receipt }}
        run: |
          set -euo pipefail
          [ -f _work/ETSY_TOKEN.json.updated ] && rclone copyto _work/ETSY_TOKEN.json "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" && echo "Token geri yazildi" || echo "Token yenilenmedi"
          [[ "$RECEIPT" =~ ^[0-9]+$ ]] || exit 1
          [ -f _out/KISISEL.json ] && rclone copy _out "gdrive:ASTROLOVE/SIPARIS/$RECEIPT/OKUMA_${GITHUB_RUN_ID}" -q && echo "Cikti: SIPARIS/$RECEIPT/OKUMA_${GITHUB_RUN_ID}/" || { echo "::error::KISISEL yok"; exit 1; }
      - if: always()
        run: rm -rf _work _out ~/.config/rclone

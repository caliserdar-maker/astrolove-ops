name: pin-build-v4

# Pinterest pin gorselleri V4 toplu uretim: POSTERS/OPTIMIZED_FOR_PRODUCTION/
# <ED>/2X3 posterlerini 1000x1500'e kucultur (filigran/mockup YOK), Drive
# WALL_ART/LISTING_MEDIA/PIN_MEDIA_V2/<ED>/ altina yazar, klasoru anyone:reader
# (miras kapali) yapar ve dogrular, TEMP/PIN_UPLOAD_STATE_V2.csv'yi gunceller,
# kontak sayfasini TEMP/PIN_KONTAK_V2/ altina koyar. Edisyon basina bir kosu.
# Eski PIN_MEDIA'ya dokunmaz; Pinterest'e dokunmaz. Sir loga dusmez.

on:
  workflow_dispatch:
    inputs:
      edition:
        description: "Edisyon"
        type: choice
        options: [WARM_PARCHMENT, MIDNIGHT_BLUE, DEEP_BLACK, CHAMPAGNE_IVORY, PURE_WHITE]
        default: WARM_PARCHMENT

concurrency:
  group: pin-media-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bagimliliklar
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core
          pip install -q -r requirements.txt

      - name: rclone kur
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
          rclone version | head -1

      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${RCLONE_CONF_B64:-}" ]; then
            echo "HATA: RCLONE_CONF_B64 secret'i tanimli degil." >&2
            exit 1
          fi
          mkdir -p ~/.config/rclone
          umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          # Yeni OAuth istemcisinin secret'i conf'daki degeri ezer (rclone env override).
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
          fi

      - name: Pinleri uret ve yukle
        run: |
          set -euo pipefail
          python scripts/pinterest/build_pins_v4.py --edition "${{ inputs.edition }}"

      - name: Kontak sayfasini artifact olarak sakla
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pin-kontak-v2-${{ inputs.edition }}
          path: _out/PIN_KONTAK_V2/
          if-no-files-found: ignore
          retention-days: 30

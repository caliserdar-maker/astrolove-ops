name: yayina-hazir
# YAYINA HAZIR KONTROLU (SALT OKUMA; Serdar 8 Kas sistem onerisi 2). Kod scripts/etsy/yayina_hazir.py; SPEC (beklenen degerler)
# ve ilan listesi (Drive) girdi. mod=olc: tum ilanlar tek batch, 1 draft + 1 active ornek alan olcumu; mod=kontrol: tum ilanlar -> YAYINA_HAZIR.md.
# Etsy'ye yazma yok. Istek: kontrol = 1 + 1 (uretim ortaklari) + ceil(ilan/100) + ilan (nitelik); olc = 1 + 1 + ceil(ilan/100) + 2. Kota yetmezse okuma baslamadan DUR.
permissions:
  actions: read
  contents: read
on:
  workflow_dispatch:
    inputs:
      mod: { description: "olc | kontrol", required: true, default: "olc" }
      spec: { description: "depo yolu, ornek docs/ornament/ORN_YAYIN_SPEC.json", required: true, default: "docs/ornament/ORN_YAYIN_SPEC.json" }
      ilanlar: { description: "Drive yolu (gdrive:ASTROLOVE/TEMP/...json)", required: true, default: "gdrive:ASTROLOVE/TEMP/ORNAMENT_GALERI9_ETSY/YEDEK9.json" }
      nitelik_yok: { description: "nitelikler OKUNMASIN (SPEC'te nitelik varsa sonuc 'olculemedi'; varsayilan okunur, ilan basina +1 istek)", type: boolean, default: false }
env:
  O: "gdrive:ASTROLOVE/TEMP/YAYINA_HAZIR"
jobs:
  kontrol:
    runs-on: ubuntu-24.04
    timeout-minutes: 150   # kilit_bekle en fazla 120 dk bekleyebilir
    steps:
      - name: Girdi kapisi
        env: { M: "${{ inputs.mod }}", S: "${{ inputs.spec }}", I: "${{ inputs.ilanlar }}" }
        run: |
          [[ "$M" =~ ^(olc|kontrol)$ ]] || { echo "::error::mod"; exit 1; }
          [[ "$S" =~ ^docs/[A-Za-z0-9_/.-]+\.json$ ]] || { echo "::error::spec"; exit 1; }
          [[ "$I" =~ ^gdrive:ASTROLOVE/TEMP/[A-Za-z0-9_/.-]+\.json$ ]] || { echo "::error::ilanlar"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Kurulum
        run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || sudo apt-get install -y -qq rclone >/dev/null
          python3 scripts/etsy/test_yayina_hazir.py
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"; echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Etsy kilidi (token indirmeden ONCE; refresh token donebilir)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/etsy/kilit_bekle.py
      - name: Token + ilan listesi
        env: { I: "${{ inputs.ilanlar }}" }
        run: |
          set -euo pipefail
          umask 077; mkdir -p _work _out
          echo "DAMGA=$(date -u +%Y%m%d_%H%M%S)" >> "$GITHUB_ENV"
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_TOKEN.json" _work/ETSY_TOKEN.json
          rclone copyto "$I" _work/ILANLAR.json || { echo "::error::ilan listesi yok"; exit 1; }
      - name: Kos
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
          TOKEN_FILE: _work/ETSY_TOKEN.json
          M: ${{ inputs.mod }}
          S: ${{ inputs.spec }}
          N: ${{ inputs.nitelik_yok && '1' || '0' }}
        run: |
          set -euo pipefail
          EK=""; if [ "$N" = 1 ]; then EK="--nitelik-yok"; fi
          python3 scripts/etsy/yayina_hazir.py --mod "$M" --spec "$S" --ilanlar _work/ILANLAR.json --out _out $EK
      - name: Token geri yaz + cikti Drive'a
        if: ${{ always() }}
        env: { M: "${{ inputs.mod }}" }
        run: |
          set +e
          TOKEN_RC=0; OUT_RC=0
          if [ -f _work/ETSY_TOKEN.json ]; then bash scripts/etsy/token_geri_yaz.sh || TOKEN_RC=1; fi
          if ls _out/* >/dev/null 2>&1; then
            SIR_OK=1
            if [ -f _work/ETSY_TOKEN.json ]; then python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/ETSY_TOKEN.json _out || { echo "::error::ciktida sir"; SIR_OK=0; OUT_RC=1; }; fi
            if [ "$SIR_OK" = 1 ]; then rclone copy _out "$O/${M}_${DAMGA:?}" -q || OUT_RC=1
              echo "Cikti: TEMP/YAYINA_HAZIR/${M}_$DAMGA" | tee -a "$GITHUB_STEP_SUMMARY"; fi
          fi
          [ "$TOKEN_RC" = 0 ] && [ "$OUT_RC" = 0 ] || exit 1
      - if: always()
        run: rm -rf _work _out ~/.config/rclone

name: wa-kupa-kart-ornek
# Wall art + kupa bilgi kartlari SADE stil ORNEGI (Merkez 27 Eki gorev C; Serdar 'Ok'). Tek cift, toplu uretim YOK, ETSY YOK, Canva yok.
# Girdi (yalniz okunur): Drive TEMP/POSTER_GALERI_V10/<galeri_damga>/<CIFT>_G3.jpg (canli kisisellestirme karti; isim bandi),
# KUPA_ORCHARD78/ORCHARD78_20261019/<CIFT>/galeri/03,05,06,07 (Orchard bilgi kartlari; kupa fotograflari), dal kupa-printful-sonuc
# kupa_uretim/sembol/<CIFT>/ (sol, sag, ana maskeleri). Cikti: Drive TEMP/WA_KUPA_KART_ORNEK/<damga>/ 8 kart + KONTAK_WA_KUPA.jpg
# + KART_OZET.json. scripts/kapak78/wa_kupa_kart_ornek.py (stil ve kapilar yd_kart_ornek.py).
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      cift: {description: "CIFT", required: true, default: "CANCER_LIBRA"}
      galeri_damga: {description: "TEMP/POSTER_GALERI_V10/<damga>", required: true, default: "20261026_181944"}
jobs:
  kart:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Girdi kapisi
        env: {C: "${{ inputs.cift }}", GD: "${{ inputs.galeri_damga }}"}
        run: '[[ "$C" =~ ^[A-Z]+_[A-Z]+$ && "$GD" =~ ^[0-9]{8}_[0-9]{6}$ ]] || { echo "::error::girdi"; exit 1; }'
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: kupa-printful-sonuc
          path: _kupa
          sparse-checkout: kupa_uretim/sembol/${{ inputs.cift }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: libfribidi (raqm; yd-kart-toplu ile ayni)
        timeout-minutes: 4
        continue-on-error: true
        run: dpkg -s libfribidi0 >/dev/null 2>&1 || sudo apt-get install -y -qq libfribidi0 >/dev/null
      - name: pip
        timeout-minutes: 6
        run: |
          pip install -q pillow==11.0.0 numpy==2.1.3
          python3 -c "from PIL import features, __version__; print('pillow', __version__, 'raqm', features.check('raqm'))"
      - name: rclone
        timeout-minutes: 6
        run: curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || { sudo apt-get install -y -qq rclone >/dev/null; }
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Girdiler + kartlar
        env: {C: "${{ inputs.cift }}", GD: "${{ inputs.galeri_damga }}"}
        run: |
          set -euo pipefail
          L=$(python3 -c "import csv,sys; r=next(r for r in csv.DictReader(open('data/pod/yd78_ids.csv')) if r['cift']==sys.argv[1]); print(r['a'], r['b'])" "$C")
          read -r A B <<< "$L"
          mkdir -p _g _o _out
          rclone copyto "gdrive:ASTROLOVE/TEMP/POSTER_GALERI_V10/$GD/${C}_G3.jpg" _g/G3.jpg -q
          rclone copy "gdrive:ASTROLOVE/KUPA_ORCHARD78/ORCHARD78_20261019/$C/galeri" _o --include "0[3567]_*.jpg" --max-depth 1 -q
          echo "Orchard: $(ls _o)"
          python3 scripts/kapak78/wa_kupa_kart_ornek.py --cift "$C" --a "$A" --b "$B" --sembol "_kupa/kupa_uretim/sembol/$C" \
            --g3 _g/G3.jpg --orchard _o --out _out
          echo "DAMGA=$(date -u +%Y%m%d_%H%M%S)" >> "$GITHUB_ENV"
      - name: Drive'a yaz
        run: |
          set -euo pipefail
          rclone copy _out "gdrive:ASTROLOVE/TEMP/WA_KUPA_KART_ORNEK/${DAMGA:?}" --immutable -q
          echo "Cikti: TEMP/WA_KUPA_KART_ORNEK/$DAMGA ($(ls _out | wc -l) dosya)" | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: rm -rf _g _o _out ~/.config/rclone

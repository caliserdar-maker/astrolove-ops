name: wa-kupa-kart-ornek
# Wall art + kupa bilgi kartlari SADE stil ORNEGI (Merkez 27 Eki gorev C; Serdar 'Ok'). Tek cift, toplu uretim YOK, ETSY YOK, Canva yok.
# Girdi (yalniz okunur): Drive dosya id poster_id (Midnight Blue ornek poster 2000x3000, isim bandi kaynagi; Merkez 27 Eki madde 3),
# dal temiz/kupa-orchard kupa_orchard/ (Orchard gorunumleri cift.py ile ayni cagri, orchard_gorunum.py; kupa-orchard78 surumleri),
# dal kupa-printful-sonuc kupa_uretim/sembol/<CIFT>/ (sol, sag, ana). Kupa zemini kupa_zemin.py ile #F5F0E7 (madde 4).
# Cikti: Drive TEMP/WA_KUPA_KART_ORNEK/[<hedef>/]<damga>/ 10 kart (kupa 02 ve 04 dahil, Merkez 28 Eki) + KAPAK43/ (4:3 kapak ornegi) + KONTAK_WA_KUPA.jpg +
# KART_OZET.json + zemin_olcum.json. hedef verilirse (orn. 20261027_192528) cikti onun ALT klasorune yazilir; mevcut dosyalar silinmez /
# ustune yazilmaz (--immutable).
# scripts/kapak78/wa_kupa_kart_ornek.py (stil ve kapilar yd_kart_ornek.py).
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      cift: {description: "CIFT", required: true, default: "CANCER_LIBRA"}
      poster_id: {description: "Drive dosya id: Midnight Blue ornek poster 2000x3000 (EMILY / JAMES)", required: true, default: "1nCbiepEjZPaS_mrBKee4r4t94vIgbVfT"}
      hedef: {description: "TEMP/WA_KUPA_KART_ORNEK altindaki hedef klasor (YYYYMMDD_HHMMSS; bos = yeni damga klasoru)", required: false, default: ""}
jobs:
  kart:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Girdi kapisi
        env: {C: "${{ inputs.cift }}", PI: "${{ inputs.poster_id }}", HD: "${{ inputs.hedef }}"}
        run: '[[ "$C" =~ ^[A-Z]+_[A-Z]+$ && "$PI" =~ ^[A-Za-z0-9_-]{20,80}$ && "$HD" =~ ^([0-9]{8}_[0-9]{6})?$ ]] || { echo "::error::girdi"; exit 1; }'
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: kupa-printful-sonuc
          path: _kupa
          sparse-checkout: kupa_uretim/sembol/${{ inputs.cift }}
      - uses: actions/checkout@v4
        with:
          ref: temiz/kupa-orchard
          path: _ko
          sparse-checkout: kupa_orchard
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: libfribidi (raqm; yd-kart-toplu ile ayni)
        timeout-minutes: 4
        continue-on-error: true
        run: dpkg -s libfribidi0 >/dev/null 2>&1 || sudo apt-get install -y -qq libfribidi0 >/dev/null
      - name: pip (kart + zemin) ve Orchard ortami (kupa-orchard78 surumleri)
        timeout-minutes: 8
        run: |
          pip install -q pillow==11.0.0 numpy==2.1.3 opencv-python-headless==4.10.0.84
          python3 -m venv _v12 && _v12/bin/pip install -q numpy==2.5.3 pillow==12.3.0 scipy==1.18.1 opencv-python-headless==5.0.0.93
          python3 -c "from PIL import features, __version__; print('pillow', __version__, 'raqm', features.check('raqm'))"
      - name: rclone
        timeout-minutes: 6
        run: curl -fsSL --retry 3 https://rclone.org/install.sh | sudo bash >/dev/null || { sudo apt-get install -y -qq rclone >/dev/null; }
      - name: rclone.conf
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Girdiler + kartlar
        env: {C: "${{ inputs.cift }}", PI: "${{ inputs.poster_id }}"}
        run: |
          set -euo pipefail
          L=$(python3 -c "import csv,sys; r=next(r for r in csv.DictReader(open('data/pod/yd78_ids.csv')) if r['cift']==sys.argv[1]); print(r['a'], r['b'])" "$C")
          read -r A B <<< "$L"
          mkdir -p _g _s _out
          rclone backend copyid gdrive: "$PI" _g/POSTER.jpg -q
          _v12/bin/python3 -I scripts/kapak78/orchard_gorunum.py _ko/kupa_orchard "_kupa/kupa_uretim/sembol/$C" "$A" "$B" _s
          python3 -I scripts/kapak78/kupa_zemin.py _s/gorunum _s
          python3 scripts/kapak78/wa_kupa_kart_ornek.py --cift "$C" --a "$A" --b "$B" --sembol "_kupa/kupa_uretim/sembol/$C" \
            --poster _g/POSTER.jpg --sahne _s --out _out
          cp _s/zemin_olcum.json _out/
          # Merkez 28 Eki 2. mesaj madde 6: kare kapaklar 4:3 ORNEK (01 orange + 08 fig); toplu uretim Serdar gorsel onayindan sonra
          _v12/bin/python3 -I scripts/kapak78/kupa_kapak43.py _ko/kupa_orchard _s/baski "$A" "$B" _out/KAPAK43 --stiller orange,fig
          echo "DAMGA=$(date -u +%Y%m%d_%H%M%S)" >> "$GITHUB_ENV"
      - name: Drive'a yaz
        env: {HD: "${{ inputs.hedef }}"}
        run: |
          set -euo pipefail
          Y="TEMP/WA_KUPA_KART_ORNEK/${HD:+$HD/}${DAMGA:?}"
          rclone copy _out "gdrive:ASTROLOVE/$Y" --immutable -q
          echo "Cikti: $Y ($(ls _out | wc -l) dosya)" | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: rm -rf _g _s _out _v12 ~/.config/rclone

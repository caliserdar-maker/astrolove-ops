name: threads-analiz
# Threads anlik durum tespiti 19 Eki 2026 (SALT OKUMA). Metricool ve Threads'e YAZMA / SILME / DEGISTIRME YOK; yalniz GET.
# scripts/sosyal/analiz/threads.py: hesap gunluk (1 Eki+; belgede yalniz posts metrics), gonderi bazinda (12 Eki+),
# plan/gercek (12 Eki+), timelines-gonderi karsilastirmasi, metrik-kaynak eslemesi.
# Token: secret METRICOOL_USER_TOKEN (userId/blogId Drive METRICOOL_TOKEN.json'dan). Loga yazilmaz (::add-mask:: + sir_koru).
# Sir taramasini gecmeyen dosya _work'te kalir, Drive'a gitmez. Cikti: Drive ASTROLOVE/TEMP/SOSYAL_ANALIZ_20261019/THREADS/.
permissions:
  contents: read
# mod=degisim (20 Eki): bekleyen Threads gonderileri envanteri + aile/cift + eski/yeni kapak olcumu (threads_degisim.py);
# cikti Drive ASTROLOVE/TEMP/SOSYAL_DEGISIM_20261020/THREADS/. Drive'dan yalniz okuma, Metricool'a yazma yok.
on:
  workflow_dispatch:
    inputs:
      mod:
        description: "analiz (19 Eki tespit) | degisim (bekleyen gonderi + yeni kapak esleme)"
        default: analiz
jobs:
  oku:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      O: gdrive:ASTROLOVE/TEMP/SOSYAL_ANALIZ_20261019/THREADS
    steps:
      - uses: actions/checkout@v4
      - name: rclone + token
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
          mkdir -p ~/.config/rclone _work _out; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"; fi
      - name: Analiz (yalniz GET)
        env:
          MC_TOK: ${{ secrets.METRICOOL_USER_TOKEN }}
        run: |
          set -uo pipefail
          umask 077
          [ -n "${MC_TOK:-}" ] || { echo "::error::METRICOOL_USER_TOKEN bos"; exit 1; }
          echo "::add-mask::$MC_TOK"
          rclone copyto "gdrive:ASTROLOVE/TEMP/METRICOOL_TOKEN.json" _work/kimlik.json
          python3 -c "import json,os;d=json.load(open('_work/kimlik.json'));json.dump({'userToken':os.environ['MC_TOK'],'userId':d['userId'],'blogId':d['blogId']},open('_work/mc.json','w'))"
          python3 -c "import json;print('::add-mask::'+json.load(open('_work/kimlik.json'))['userToken'])"
          if [ "${{ inputs.mod }}" = "degisim" ]; then
            O="gdrive:ASTROLOVE/TEMP/SOSYAL_DEGISIM_20261020/THREADS"
            pip install -q numpy==2.1.3 pillow==11.0.0
            P2="gdrive:ASTROLOVE/TEMP/KAPAK_P2_78_20261019"
            mkdir -p _work/dg/p2 _work/is
            rclone lsjson -R --files-only --max-depth 3 "$P2" > _work/dg/p2.json || echo "[]" > _work/dg/p2.json
            rclone lsjson -R --files-only "gdrive:ASTROLOVE/TEMP/KUPA_KAPAK_78_20261019/KAPAK" > _work/dg/kupa.json || echo "[]" > _work/dg/kupa.json
            rclone lsjson -R --files-only "gdrive:ASTROLOVE/TEMP/KAPAK_Y1_78_20261019/KAPAK" > _work/dg/y1.json || echo "[]" > _work/dg/y1.json
            for k in BASLIK_A/KAPAK_A KAPAK YEDEK; do rclone copy "$P2/$k" "_work/dg/p2/$k" --transfers 8 -q || echo "$k kopyalanamadi"; done
            BETIK="scripts/sosyal/analiz/threads_degisim.py _work/mc.json _out _work/is --p2-ls _work/dg/p2.json --p2-dir _work/dg/p2 --kupa-ls _work/dg/kupa.json --y1-ls _work/dg/y1.json --pod78 data/pod/pod78_ids.csv"
          else BETIK="scripts/sosyal/analiz/threads.py _work/mc.json _out"; fi
          python3 $BETIK | python3 scripts/guvenlik/sir_koru.py tee --sir-json _work/mc.json --sir-json _work/kimlik.json "$GITHUB_STEP_SUMMARY"
          rc=${PIPESTATUS[0]}
          mkdir -p _work/engel
          for f in _out/*; do
            python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/mc.json --sir-json _work/kimlik.json "$f" >/dev/null 2>&1 \
              || { echo "TARAMA GECMEDI (Drive'a gitmez): $(basename "$f")"; mv "$f" _work/engel/; }
          done
          python3 scripts/guvenlik/sir_koru.py tara --sir-json _work/mc.json --sir-json _work/kimlik.json _out || exit 1
          rclone copy _out "$O" -q
          rclone lsl "$O" | python3 scripts/guvenlik/sir_koru.py tee --sir-json _work/mc.json "$GITHUB_STEP_SUMMARY"
          exit $rc
      - if: always()
        run: |
          rm -rf _work ~/.config/rclone
          if [ -f "$RUNNER_TEMP/SIR_ENGEL" ]; then echo "::error::sir iceren satir engellendi (sir_koru)"; exit 1; fi

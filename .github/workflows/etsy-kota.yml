name: etsy-kota

# Etsy kota olcumu (salt okuma; OAuth/token kullanmaz, bu yuzden Etsy kilidine girmez). Saatlik:
# /openapi-ping basliklari (x-limit-per-day, x-remaining-today, ...) Drive TEMP/ETSY_KOTA.csv'ye eklenir.
# Amac: gunluk sifirlama mi kayan 24 saat mi (28 Eyl gozlemi: 13:54 293 -> 14:02 527) + isleri kotaya gore zamanlamak.
# OLCUM KILIDI (Serdar 1 Kas madde 7): Etsy kilit kumesinde (kilit_bekle kullanan workflow'lar) in_progress kosu varken olcum
# yapilmaz (31 Eki: yazimla cakisan olcum kota dususu 725/583, kosunun saydigi 723/581). Olcumden once ve sonra kontrol; biri
# doluysa ATLA, CSV'ye satir yazilmaz. GitHub API okunamazsa da ATLA (yanlis satir yerine eksik satir). Bu is akisi kilit kumesine
# GIRMEZ (yazicilari bekletmez): kilit modulu yalniz ice aktarilir.

permissions:
  contents: read
  actions: read

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

jobs:
  olc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          set -euo pipefail
          pip install -q requests==2.34.2
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
            [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true
          fi
      - name: Etsy kosusu kontrolu (once)
        id: k1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "scripts/etsy")
          import kilit_bekle as K
          kume = K.kilit_kumesi(".", "etsy")
          benim = int(os.environ["GITHUB_RUN_ID"])
          try:
              kosular = K.api_kosular()
              aktif = [k for k in kosular if k.get("path") in kume and k.get("status") == "in_progress" and int(k.get("id")) != benim]
              neden = "; ".join(K.ozet(k) for k in aktif[:5])
          except Exception as e:  # noqa: BLE001
              aktif, neden = ["?"], f"GitHub API okunamadi ({type(e).__name__})"
          atla = bool(aktif)
          print((f"ATLA (once): Etsy kosusu in_progress, olcum yapilmaz: {neden}" if atla else f"kontrol (once): kume {len(kume)} is akisi, aktif Etsy kosusu yok"), flush=True)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"atla={'true' if atla else 'false'}\n")
          PY
      - name: Olc (Drive'a henuz yazilmaz)
        if: ${{ steps.k1.outputs.atla == 'false' }}
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
        run: |
          set -euo pipefail
          rclone copyto "gdrive:ASTROLOVE/TEMP/ETSY_KOTA.csv" ETSY_KOTA.csv 2>/dev/null || true
          python scripts/etsy/kota_olc.py --csv ETSY_KOTA.csv
      - name: Etsy kosusu kontrolu (sonra)
        if: ${{ steps.k1.outputs.atla == 'false' }}
        id: k2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "scripts/etsy")
          import kilit_bekle as K
          kume = K.kilit_kumesi(".", "etsy")
          benim = int(os.environ["GITHUB_RUN_ID"])
          try:
              kosular = K.api_kosular()
              aktif = [k for k in kosular if k.get("path") in kume and k.get("status") == "in_progress" and int(k.get("id")) != benim]
              neden = "; ".join(K.ozet(k) for k in aktif[:5])
          except Exception as e:  # noqa: BLE001
              aktif, neden = ["?"], f"GitHub API okunamadi ({type(e).__name__})"
          atla = bool(aktif)
          print((f"ATLA (sonra): Etsy kosusu in_progress, olcum yapilmaz: {neden}" if atla else f"kontrol (sonra): kume {len(kume)} is akisi, aktif Etsy kosusu yok"), flush=True)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"atla={'true' if atla else 'false'}\n")
          PY
      - name: Drive'a ekle (olcum boyunca Etsy kosusu yoksa)
        if: ${{ steps.k1.outputs.atla == 'false' && steps.k2.outputs.atla == 'false' }}
        run: |
          set -euo pipefail
          rclone copyto ETSY_KOTA.csv "gdrive:ASTROLOVE/TEMP/ETSY_KOTA.csv" -q
          tail -3 ETSY_KOTA.csv
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone

name: sosyal-video-yd-ornek-v4
# Yil donumu 9:16 sosyal video ORNEGI v4 (21 Eki 2026, Serdar: poster tam ortali, en buyuk boy): yalniz CANCER_LIBRA.
# Onayli motor (yildonumu_video.py f57fd17, dosya degistirilmeden) en buyuk boyda dogrudan render; poster ve baslik ortali,
# 8 sn, 30 fps, ses yok. Uretim + QC tek script: sosyal/poster_video/yd_reel_v4.py.
# Metricool'a, Etsy'ye ve hicbir hesaba YAZMA YOK; toplu uretim yok. Cikti: Drive ASTROLOVE/TEMP/SOSYAL_VIDEO_YD_ORNEK_20261020/V4/
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      cift:
        description: 'cift (KAPAK_Y1_78 KAPAK/<CIFT>.jpg + PIN/<CIFT>_PIN.jpg)'
        default: CANCER_LIBRA
jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      O: gdrive:ASTROLOVE/TEMP/SOSYAL_VIDEO_YD_ORNEK_20261020/V4
      K: gdrive:ASTROLOVE/TEMP/KAPAK_Y1_78_20261019
      ILAN: gdrive:ASTROLOVE/TEMP/YILDONUMU_VIDEO_ORNEK_20261020
      CIFT: ${{ inputs.cift }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Kurulum
      run: |
        set -euo pipefail
        pip install -q numpy==2.1.3 pillow==11.0.0 scipy==1.14.1 opencv-python-headless==4.10.0.84
        sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg fonts-dejavu-core >/dev/null
        curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
    - name: rclone.conf
      env:
        RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      run: |
        set -euo pipefail
        mkdir -p ~/.config/rclone; umask 077
        printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
        if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "::add-mask::$GOOGLE_CLIENT_SECRET"
          grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true; fi
    - name: Uret + QC + Drive
      run: |
        set +e -uo pipefail
        case "$CIFT" in *[!A-Z_]*|'') echo "::error::cift gecersiz"; exit 1 ;; esac
        mkdir -p _w _o
        rclone copyto "$K/KAPAK/$CIFT.jpg" _w/kapak.jpg -q || { echo "::error::kapak yok"; exit 1; }
        rclone copyto "$K/PIN/${CIFT}_PIN.jpg" _w/pin.jpg -q || { echo "::error::pin yok"; exit 1; }
        ON=()
        rclone copyto "$ILAN/${CIFT}_yd_video.mp4" _w/onay_ilan.mp4 -q && ON=(--onay_ilan _w/onay_ilan.mp4)
        T0=$(date +%s)
        python3 -I sosyal/poster_video/yd_reel_v4.py _w/kapak.jpg _w/pin.jpg "$CIFT" _o _w/is "${ON[@]}" > _w/log.txt 2>&1; RC=$?
        grep -E 'kare 150|uretim|Traceback|Error' _w/log.txt | tail -5
        while IFS= read -r l; do echo "::warning::$l" | cut -c1-3900; done < _o/OLCUM.txt
        echo "::warning::SURE $(( $(date +%s) - T0 )) sn, cikis $RC"
        rclone copy _o "$O" -q
        echo "::warning::DRIVE $(rclone lsf "$O" | tr '\n' ' ')"
        echo "RC=$RC" >> "$GITHUB_ENV"
    - name: Sonuc
      if: ${{ always() }}
      run: |
        rm -rf _w ~/.config/rclone
        [ "${RC:-1}" = "0" ]

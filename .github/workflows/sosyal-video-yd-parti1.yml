name: sosyal-video-yd-parti1
# Yil donumu 9:16 sosyal video PARTI 1 (21 Eki 2026, Serdar: v4 onayli): v4 kodu (sosyal/poster_video/yd_reel_v4.py) ile
# ciftler paralel; her cift kendi kapagi ve pini. Baslik sigmayan cift uretilmez (olcu OLCUM'a). Birlestirme:
# yd_parti_topla.py (KONTAK_ILK_KARE.jpg + OLCUM.txt). Metricool'a, Etsy'ye ve hicbir hesaba YAZMA YOK.
# Cikti: Drive ASTROLOVE/TEMP/SOSYAL_VIDEO_YD_PARTI1_20261021/
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      ciftler:
        description: 'ciftler (virgulle)'
        default: CANCER_LIBRA,AQUARIUS_LIBRA,SCORPIO_TAURUS,ARIES_LIBRA
env:
  O: gdrive:ASTROLOVE/TEMP/SOSYAL_VIDEO_YD_PARTI1_20261021
  K: gdrive:ASTROLOVE/TEMP/KAPAK_Y1_78_20261019
  ILAN: gdrive:ASTROLOVE/TEMP/YILDONUMU_VIDEO_ORNEK_20261020
jobs:
  hazirla:
    runs-on: ubuntu-latest
    outputs:
      m: ${{ steps.m.outputs.m }}
    steps:
    - id: m
      env:
        C: ${{ inputs.ciftler }}
      run: |
        set -euo pipefail
        case "$C" in *[!A-Z_,]*|'') echo "::error::ciftler gecersiz"; exit 1 ;; esac
        echo "m=$(printf '%s' "$C" | python3 -c 'import json,sys; print(json.dumps([c for c in sys.stdin.read().split(",") if c]))')" >> "$GITHUB_OUTPUT"
  uret:
    needs: hazirla
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        cift: ${{ fromJson(needs.hazirla.outputs.m) }}
    env:
      CIFT: ${{ matrix.cift }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Kurulum
      run: |
        set -euo pipefail
        pip install -q numpy==2.1.3 pillow==11.0.0 scipy==1.14.1 opencv-python-headless==4.10.0.84
        sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg fonts-dejavu-core >/dev/null
        curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
    - name: rclone.conf
      env:
        RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      run: |
        set -euo pipefail
        mkdir -p ~/.config/rclone; umask 077
        printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
        if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "::add-mask::$GOOGLE_CLIENT_SECRET"
          grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true; fi
    - name: Uret + QC
      run: |
        set +e -uo pipefail
        mkdir -p _w "_o/$CIFT"
        rclone copyto "$K/KAPAK/$CIFT.jpg" _w/kapak.jpg -q || { echo "::error::kapak yok"; exit 1; }
        rclone copyto "$K/PIN/${CIFT}_PIN.jpg" _w/pin.jpg -q || { echo "::error::pin yok"; exit 1; }
        ON=()
        rclone copyto "$ILAN/${CIFT}_yd_video.mp4" _w/onay_ilan.mp4 -q 2>/dev/null && ON=(--onay_ilan _w/onay_ilan.mp4)
        T0=$(date +%s)
        python3 -I sosyal/poster_video/yd_reel_v4.py _w/kapak.jpg _w/pin.jpg "$CIFT" "_o/$CIFT" _w/is "${ON[@]}" > _w/log.txt 2>&1; RC=$?
        grep -E 'Traceback|Error' _w/log.txt | tail -5
        head -3 "_o/$CIFT/OLCUM.txt" 2>/dev/null | while IFS= read -r l; do echo "::warning::$l" | cut -c1-3900; done
        echo "::warning::$CIFT SURE $(( $(date +%s) - T0 )) sn, cikis $RC"
        rm -rf _w/is
    - uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: yd-${{ matrix.cift }}
        path: _o
        retention-days: 3
    - name: Temizlik
      if: ${{ always() }}
      run: rm -rf _w ~/.config/rclone
  topla:
    needs: uret
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Kurulum
      run: |
        set -euo pipefail
        pip install -q numpy==2.1.3 pillow==11.0.0
        sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y ffmpeg fonts-dejavu-core >/dev/null
        curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1
    - uses: actions/download-artifact@v4
      with:
        pattern: yd-*
        merge-multiple: true
        path: _a
    - name: rclone.conf
      env:
        RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      run: |
        set -euo pipefail
        mkdir -p ~/.config/rclone; umask 077
        printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf; chmod 600 ~/.config/rclone/rclone.conf
        if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then echo "::add-mask::$GOOGLE_CLIENT_SECRET"
          grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf && echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV" || true; fi
    - name: KONTAK + OLCUM + Drive
      env:
        C: ${{ inputs.ciftler }}
      run: |
        set +e -uo pipefail
        python3 -I sosyal/poster_video/yd_parti_topla.py _a _r "$C" > _r_log.txt 2>&1; RC=$?
        while IFS= read -r l; do echo "::warning::$l" | cut -c1-3900; done < _r_log.txt
        rclone copy _r "$O" -q
        echo "::warning::DRIVE $(rclone lsf "$O" | tr '\n' ' ')"
        rm -rf ~/.config/rclone
        exit $RC

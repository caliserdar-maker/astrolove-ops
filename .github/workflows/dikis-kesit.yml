name: dikis-kesit

# DIKIS SON KONTROL (Serdar 2 Eki; salt okur): dikis-yayin sonucundan secilen (edisyon:boy) icin en yuksek dikis
# degerli yayindaki ZIP JPG'sinin tagline 1:1 kesiti (etiketli). Yeni olcum / yeniden uretim YOK.
# Girdi Drive TEMP/DIKIS_YAYIN/<kaynak_run>/DIKIS_*.jsonl; cikti ayni klasorde KESIT/. Etsy API / yazma YOK.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      kaynak_run: {description: "dikis-yayin run id", required: true, default: "37044488907"}
      secim: {description: "EDISYON:boy virgullu", required: true, default: "MIDNIGHT_BLUE:11x14,PURE_WHITE:18x24,PURE_WHITE:A2"}

jobs:
  kesit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Girdi denetimi
        run: |
          set -euo pipefail
          jq -re '.inputs.kaynak_run | test("^[0-9]+$")' "$GITHUB_EVENT_PATH" >/dev/null
          jq -re '.inputs.secim | test("^[A-Z_]+:[0-9xA]+(,[A-Z_]+:[0-9xA]+)*$")' "$GITHUB_EVENT_PATH" >/dev/null
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow
      - run: curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null
      - name: rclone.conf olustur
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone; umask 077
          printf '%s' "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          if [ -n "${GOOGLE_CLIENT_SECRET:-}" ]; then
            echo "::add-mask::$GOOGLE_CLIENT_SECRET"
            if grep -qE '^[[:space:]]*client_id[[:space:]]*=[[:space:]]*\S' ~/.config/rclone/rclone.conf; then
              echo "RCLONE_CONFIG_GDRIVE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> "$GITHUB_ENV"
            fi
          fi
      - name: Kesit
        run: |
          set -euo pipefail
          T0=$(date +%s); R=$(jq -r '.inputs.kaynak_run' "$GITHUB_EVENT_PATH")
          rclone copy "gdrive:ASTROLOVE/TEMP/DIKIS_YAYIN/$R/" jsonl --include "DIKIS_*.jsonl"
          python scripts/ornek/dikis_kesit.py --jsonl-kok jsonl --secim "$(jq -r '.inputs.secim' "$GITHUB_EVENT_PATH")" --cik out
          rclone copy out "gdrive:ASTROLOVE/TEMP/DIKIS_YAYIN/$R/KESIT/"
          echo "SURE $(( $(date +%s) - T0 )) sn"
      - if: ${{ always() }}
        run: rm -rf ~/.config/rclone
